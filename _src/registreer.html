  <section class="section s-dark" style="min-height:80vh; display:flex; align-items:center">
    <div class="wrap wrap--text">
      <div id="app" style="max-width:32rem">
        <p class="eyebrow">Account</p>
        <h1 style="margin-bottom:1rem">Even geduld</h1>
        <p class="hero__sub" id="reg-loading">Uitnodiging valideren&hellip;</p>
      </div>
    </div>
  </section>

  <style>
    #app .field:last-of-type{margin-bottom:1.5rem}
    #reg-err{color:#e8a598; font-size:var(--fs-sm); margin:.25rem 0 1rem; display:none; line-height:1.5}
    #reg-info{background:var(--s-dark-2); border:1px solid var(--hair-d); border-left:2px solid var(--koerslijn);
      border-radius:var(--r-md); padding:1rem 1.25rem; margin:1.25rem 0 1.5rem; font-size:var(--fs-sm)}
    #reg-info b{color:var(--ink-d)}
    #reg-info .m{font-family:var(--mono, ui-monospace, monospace); font-size:var(--fs-xs); color:var(--muted-d)}
    #app .hint{font-size:var(--fs-xs); color:var(--muted-d); margin-top:.35rem}
  </style>

  <script>
  (function(){
    var WORKER = 'https://kantoorinzicht.marcel-bisschops.workers.dev';
    var app = document.getElementById('app');

    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function params(){ return new URLSearchParams(window.location.search); }
    function bestemming(){ return (params().get('redirect') === 'adv' ? '{{ROOT}}adv.html' : '{{ROOT}}marilyn.html'); }

    function toonFout(txt){
      var e = document.getElementById('reg-err');
      if(e){ e.textContent = txt; e.style.display = 'block'; }
    }

    function eindscherm(titel, tekst){
      app.innerHTML =
        '<p class="eyebrow">Account</p>'
        + '<h1 style="margin-bottom:1rem">' + esc(titel) + '</h1>'
        + '<p class="hero__sub">' + esc(tekst) + '</p>'
        + '<div class="btn-row"><a class="btn btn-primary" href="' + bestemming() + '">Naar inloggen</a></div>';
    }

    function wachtwoordVeld(id, label, hint){
      return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>'
        + '<input type="password" id="' + id + '" autocomplete="new-password">'
        + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '')
        + '</div>';
    }

    async function init(){
      var p = params();
      var token = p.get('token') || '';
      var resetToken = p.get('reset') || '';

      // ── Wachtwoord opnieuw instellen ──────────────────────────────────────────
      if(resetToken){
        app.innerHTML =
          '<p class="eyebrow">Account</p>'
          + '<h1 style="margin-bottom:1rem">Nieuw wachtwoord instellen</h1>'
          + '<p class="hero__sub">Kies een nieuw wachtwoord voor uw account.</p>'
          + '<div id="reg-err"></div>'
          + wachtwoordVeld('ww1', 'Nieuw wachtwoord', 'Minimaal 8 tekens.')
          + wachtwoordVeld('ww2', 'Wachtwoord bevestigen', null)
          + '<div class="btn-row"><button class="btn btn-primary" id="reg-btn" type="button">Wachtwoord instellen</button></div>';
        bindWachtwoordForm(async function(ww){
          var r = await fetch(WORKER + '/gebruikers/ww-reset', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: resetToken, wachtwoord: ww})
          });
          var d = await r.json().catch(function(){ return {}; });
          if(!r.ok || !d.ok){ return {error: d.error || 'Er ging iets mis. Probeer het opnieuw.'}; }
          return {ok: true};
        }, 'Wachtwoord ingesteld', 'Uw wachtwoord is opgeslagen. U kunt nu inloggen.');
        return;
      }

      // ── Geen token ───────────────────────────────────────────────────────────
      if(!token){
        app.innerHTML =
          '<p class="eyebrow">Account</p>'
          + '<h1 style="margin-bottom:1rem">Ongeldige link</h1>'
          + '<p class="hero__sub">Deze activatielink is niet compleet. Vraag uw adviseur om een nieuwe uitnodiging, '
          + 'of neem contact op via <a href="mailto:marcel@bisschopsfinancing.nl">marcel@bisschopsfinancing.nl</a>.</p>';
        return;
      }

      // ── Uitnodiging valideren ───────────────────────────────────────────────
      var d;
      try{
        var r = await fetch(WORKER + '/gebruikers/invite?token=' + encodeURIComponent(token));
        d = await r.json().catch(function(){ return {}; });
        if(!r.ok || !d.ok){
          app.innerHTML =
            '<p class="eyebrow">Account</p>'
            + '<h1 style="margin-bottom:1rem">Uitnodiging niet geldig</h1>'
            + '<p class="hero__sub">' + esc(d.error || 'Deze uitnodiging is ongeldig of al gebruikt.') + '<br>'
            + 'Neem contact op via <a href="/contact.html">koersvoormorgen.nl/contact</a>.</p>';
          return;
        }
      }catch(e){
        app.innerHTML =
          '<p class="eyebrow">Account</p>'
          + '<h1 style="margin-bottom:1rem">Geen verbinding</h1>'
          + '<p class="hero__sub">Controleer uw internetverbinding en laad de pagina opnieuw.</p>';
        return;
      }

      // ── Activatieformulier ──────────────────────────────────────────────────
      app.innerHTML =
        '<p class="eyebrow">Account</p>'
        + '<h1 style="margin-bottom:1rem">Welkom, ' + esc(d.naam) + '</h1>'
        + '<p class="hero__sub">Stel een wachtwoord in om uw account te activeren.</p>'
        + '<div id="reg-info"><b>' + esc(d.naam) + '</b>'
        + (d.bedrijf ? '<br>' + esc(d.bedrijf) : '')
        + '<br><span class="m">' + esc(d.email) + '</span></div>'
        + '<div id="reg-err"></div>'
        + wachtwoordVeld('ww1', 'Wachtwoord', 'Minimaal 8 tekens, kies iets wat u onthoudt.')
        + wachtwoordVeld('ww2', 'Wachtwoord bevestigen', null)
        + '<div class="btn-row"><button class="btn btn-primary" id="reg-btn" type="button">Account activeren</button></div>';

      bindWachtwoordForm(async function(ww){
        var r = await fetch(WORKER + '/gebruikers/activeer', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token: token, wachtwoord: ww})
        });
        var ad = await r.json().catch(function(){ return {}; });
        if(!r.ok || !ad.ok){ return {error: ad.error || 'Activeren mislukt. Probeer het opnieuw.'}; }
        return {ok: true};
      }, 'Account geactiveerd',
         'Uw account is nu actief. Log in met uw e-mailadres en het wachtwoord dat u zojuist heeft ingesteld.');
    }

    // Gedeelde afhandeling voor beide wachtwoordformulieren.
    function bindWachtwoordForm(verstuur, geluktTitel, geluktTekst){
      var btn = document.getElementById('reg-btn');
      var ww1 = document.getElementById('ww1');
      var ww2 = document.getElementById('ww2');
      if(!btn || !ww1 || !ww2) return;

      async function ga(){
        var err = document.getElementById('reg-err');
        if(err) err.style.display = 'none';
        if(ww1.value.length < 8){ toonFout('Wachtwoord moet minimaal 8 tekens zijn.'); return; }
        if(ww1.value !== ww2.value){ toonFout('De wachtwoorden komen niet overeen.'); return; }
        btn.disabled = true;
        var oudeTekst = btn.textContent;
        btn.textContent = 'Bezig…';
        try{
          var res = await verstuur(ww1.value);
          if(res && res.error){ toonFout(res.error); btn.disabled = false; btn.textContent = oudeTekst; return; }
          eindscherm(geluktTitel, geluktTekst);
        }catch(e){
          toonFout('Verbindingsfout. Probeer het opnieuw.');
          btn.disabled = false; btn.textContent = oudeTekst;
        }
      }

      btn.addEventListener('click', ga);
      ww2.addEventListener('keydown', function(e){ if(e.key === 'Enter') ga(); });
      ww1.focus();
    }

    init();
  })();
  </script>
