<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantoorInzicht — Adviseur</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0e0c;--card:#1a1815;--card2:#222019;--border:#2e2b27;--border2:#3a3733;--head:#f5f0e8;--sub:#c8bfb0;--mid:#9a9080;--muted:#6a6050;--teal:#2db88a;--teal-bg:rgba(45,184,138,.08);--teal-dark:rgba(45,184,138,.25);--teal-dim:#1a9a6a;--gold:#c9a84c;--gold-bg:rgba(201,168,76,.1);--red:#d64a3a;--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--sub);min-height:100vh;font-size:14px}
#app{min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:54px;border-bottom:1px solid var(--border);background:var(--card)}
.hdr-brand{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 18px;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:12px;padding:7px 14px;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.wrap{max-width:960px;margin:0 auto;padding:2rem}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:400px}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field select,.field textarea{width:100%;background:#0f0e0c;border:1px solid var(--border2);border-radius:var(--r);color:#c8bfb0;font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 11px;outline:none;transition:border .15s;-webkit-text-fill-color:#c8bfb0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field textarea{resize:vertical;min-height:70px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:2rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:500;color:var(--teal);line-height:1;margin-bottom:.25rem}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.tbl-title{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--sub);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.badge-actief{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--head);margin-bottom:1.25rem}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.code-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark);border-radius:3px;padding:2px 8px;letter-spacing:.08em}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px;font-style:italic}
</style>
</head>
<body>
<div id="app"></div>
<script>
var WORKER='https://kantoorinzicht.marcel-bisschops.workers.dev';
var G={email:'',ww:'',naam:'',bedrijf:'',trajecten:[]};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function render(h){document.getElementById('app').innerHTML=h;}
// Alle fetches gebruiken alleen Content-Type header — geen custom headers
function post(url,body){return fetch(WORKER+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}

function renderLogin(){
  render('<div class="login-wrap"><div class="login-box">'
    +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;color:#f5f0e8;margin-bottom:.25rem">KantoorInzicht M&A</div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1.75rem;line-height:1.6">Adviseur portaal — log in met uw e-mailadres en wachtwoord.</div>'
    +'<div class="field"><label>E-mailadres</label><input type="email" id="l-e" placeholder="u@kantoor.nl" autofocus></div>'
    +'<div class="field"><label>Wachtwoord</label><input type="password" id="l-w" placeholder="••••••••"></div>'
    +'<div id="l-err" style="color:var(--red);font-size:12px;margin-bottom:.75rem;display:none"></div>'
    +'<button class="btn" id="l-btn" style="width:100%">Inloggen</button>'
    +'<div style="margin-top:1rem;font-size:11px;color:var(--muted);text-align:center">Geen account? Vraag een uitnodiging aan bij uw beheerder.</div>'
    +'</div></div>');
  document.getElementById('l-btn').onclick=doLogin;
  document.getElementById('l-w').onkeydown=function(e){if(e.key==='Enter')doLogin();};
  document.getElementById('l-e').onkeydown=function(e){if(e.key==='Enter')document.getElementById('l-w').focus();};
}

async function doLogin(){
  var btn=document.getElementById('l-btn');btn.disabled=true;btn.textContent='Laden...';
  var err=document.getElementById('l-err');err.style.display='none';
  var email=document.getElementById('l-e').value.trim();
  var ww=document.getElementById('l-w').value;
  if(!email||!ww){err.textContent='Vul e-mail en wachtwoord in.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
  try{
    var r=await post('/adviseur/trajecten',{email:email,wachtwoord:ww});
    var d=await r.json();
    if(!r.ok||!d.ok){err.textContent=d.error||'Inloggegevens onjuist.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
    G.email=email;G.ww=ww;G.naam=d.naam;G.bedrijf=d.bedrijf;G.trajecten=d.trajecten||[];
    renderDashboard();
  }catch(e){err.textContent='Fout: '+e.message;err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';}
}

function renderDashboard(){
  var html='<div class="hdr"><div class="hdr-brand"><div class="wdot"></div>KantoorInzicht · Adviseur</div>'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<span style="font-size:12px;color:var(--muted)">'+esc(G.naam)+(G.bedrijf?' · '+esc(G.bedrijf):'')+'</span>'
    +'<button class="btn-ghost" onclick="renderLogin()">Uitloggen</button>'
    +'</div></div>'
    +'<div class="wrap">'
    +'<div class="stat-row">'
    +'<div class="stat-card"><div class="stat-num">'+G.trajecten.length+'</div><div class="stat-lbl">Trajecten</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+G.trajecten.filter(function(t){return t.status==='actief';}).length+'</div><div class="stat-lbl">Actief</div></div>'
    +'</div>'
    +'<div class="tbl-wrap">'
    +'<div class="tbl-hdr"><div class="tbl-title">M&A Trajecten</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn-ghost" onclick="ververs()">↻ Verversen</button>'
    +'<button class="btn" onclick="nieuwTraject()">+ Nieuw traject</button>'
    +'</div></div>';
  if(!G.trajecten.length){
    html+='<div class="empty">Nog geen trajecten. Klik op "+ Nieuw traject".</div>';
  } else {
    var sl={accountancy:'Acc.',mkb:'MKB',zorg:'Zorg',itsoftware:'IT/SW'};
    html+='<table><thead><tr><th>Kantoor</th><th>Type</th><th>Sector</th><th>Status</th><th>Aangemaakt</th><th></th></tr></thead><tbody>';
    G.trajecten.forEach(function(t){
      html+='<tr>'
        +'<td style="font-weight:600;color:var(--head)">'+esc(t.kantoor_naam||'—')+'</td>'
        +'<td style="color:var(--mid)">'+esc(t.traject_type||'—')+'</td>'
        +'<td style="color:var(--mid)">'+esc(sl[t.sector]||'Acc.')+'</td>'
        +'<td><span class="badge badge-actief">'+esc(t.status||'actief')+'</span></td>'
        +'<td style="font-size:12px;color:var(--muted)">'+fmt(t.created_at)+'</td>'
        +'<td style="text-align:right">'
        +'<div style="display:flex;gap:6px;justify-content:flex-end">'
        +'<button class="btn-ghost" onclick="bekijkCodes(\''+esc(t.id)+'\',\''+esc(t.koper_code||'')+'\',\''+esc(t.tussen_code||'')+'\',\''+esc(t.kantoor_naam||'')+'\')">Codes</button>'
        +'</div></td>'
        +'</tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div></div>';
  render(html);
}

async function ververs(){
  try{
    var r=await post('/adviseur/trajecten',{email:G.email,wachtwoord:G.ww});
    var d=await r.json();
    if(d.ok){G.trajecten=d.trajecten||[];renderDashboard();}
  }catch(e){}
}

function bekijkCodes(id,koperCode,tussenCode,naam){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.className='modal';
  mo.innerHTML='<div class="modal-title">'+esc(naam)+'</div>'
    +'<div class="sec-hdr">Toegangscodes</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;font-size:13px;margin-bottom:1.5rem">'
    +'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Verkoperscode</div>'
    +'<div style="display:flex;align-items:center;gap:8px"><span class="code-chip">'+esc(id)+'</span>'
    +'<button onclick="navigator.clipboard.writeText(\''+esc(id)+'\')" style="font-size:11px;background:none;border:1px solid var(--border2);color:var(--mid);padding:2px 8px;border-radius:3px;cursor:pointer">Kopieer</button></div></div>'
    +'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Koperscode</div>'
    +'<div style="display:flex;align-items:center;gap:8px"><span class="code-chip" style="background:var(--gold-bg);color:var(--gold);border-color:rgba(201,168,76,.3)">'+esc(koperCode||'—')+'</span>'
    +(koperCode?'<button onclick="navigator.clipboard.writeText(\''+esc(koperCode)+'\')" style="font-size:11px;background:none;border:1px solid var(--border2);color:var(--mid);padding:2px 8px;border-radius:3px;cursor:pointer">Kopieer</button>':'')
    +'</div></div>'
    +'<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Tussenpersoonscode</div>'
    +'<div style="display:flex;align-items:center;gap:8px"><span class="code-chip" style="background:var(--card2);color:var(--mid);border-color:var(--border2)">'+esc(tussenCode||'—')+'</span>'
    +(tussenCode?'<button onclick="navigator.clipboard.writeText(\''+esc(tussenCode)+'\')" style="font-size:11px;background:none;border:1px solid var(--border2);color:var(--mid);padding:2px 8px;border-radius:3px;cursor:pointer">Kopieer</button>':'')
    +'</div></div></div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:1.25rem;padding:.75rem;background:var(--card2);border-radius:var(--r)">Verkoper en koper loggen in via <strong style="color:var(--sub)">koersvoormorgen.nl/mna.html</strong></div>'
    +'<div style="display:flex;justify-content:flex-end"><button class="btn-ghost" id="mo-sluit">Sluiten</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)document.body.removeChild(ov);};
  document.getElementById('mo-sluit').onclick=function(){document.body.removeChild(ov);};
}

function nieuwTraject(){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.className='modal';
  mo.innerHTML='<div class="modal-title">Nieuw traject aanmaken</div>'
    +'<div style="display:flex;gap:12px">'
    +'<div class="field" style="flex:1"><label>Type *</label><select id="n-type"><option value="Verkoop">Verkoop</option><option value="Fusie">Fusie</option><option value="Opvolging">Opvolging</option><option value="PE-traject">PE-traject</option><option value="Overname">Overname</option></select></div>'
    +'<div class="field" style="flex:1"><label>Sector *</label><select id="n-sector"><option value="accountancy">Accountancy</option><option value="mkb">MKB</option><option value="zorg">Zorg</option><option value="itsoftware">IT & Software</option></select></div>'
    +'</div>'
    +'<div class="field"><label>Kantoornaam *</label><input type="text" id="n-naam" placeholder="Naam van de onderneming"></div>'
    +'<div style="display:flex;gap:12px">'
    +'<div class="field" style="flex:1"><label>Contactpersoon *</label><input type="text" id="n-contact" placeholder="Naam"></div>'
    +'<div class="field" style="flex:1"><label>E-mail contactpersoon *</label><input type="email" id="n-email" placeholder="E-mailadres"></div>'
    +'</div>'
    +'<div class="field"><label>Adres</label><input type="text" id="n-adres" placeholder="Straat, postcode, plaats"></div>'
    +'<div style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.25rem">'
    +'<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem">Kopende partij (optioneel)</div>'
    +'<div style="display:flex;gap:12px">'
    +'<div class="field" style="flex:1"><label>Naam koper</label><input type="text" id="n-koper-naam" placeholder="Naam"></div>'
    +'<div class="field" style="flex:1"><label>E-mail koper</label><input type="email" id="n-koper-email" placeholder="E-mailadres"></div>'
    +'</div></div>'
    +'<div id="n-err" style="color:var(--red);font-size:12px;margin-bottom:.75rem;display:none"></div>'
    +'<div id="n-ok" style="display:none;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;font-size:13px"></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end">'
    +'<button class="btn-ghost" id="n-ann">Annuleren</button>'
    +'<button class="btn" id="n-maak">Aanmaken</button>'
    +'</div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)document.body.removeChild(ov);};
  document.getElementById('n-ann').onclick=function(){document.body.removeChild(ov);};
  document.getElementById('n-maak').onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent='Aanmaken...';
    var err=document.getElementById('n-err');err.style.display='none';
    var naam=document.getElementById('n-naam').value.trim();
    var contact=document.getElementById('n-contact').value.trim();
    var email=document.getElementById('n-email').value.trim();
    if(!naam||!contact||!email){err.textContent='Kantoornaam, contactpersoon en e-mail zijn verplicht.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';return;}
    try{
      var r=await post('/adviseur/create',{
        email:G.email,wachtwoord:G.ww,
        traject:{
          kantoor_naam:naam,contact_naam:contact,contact_email:email,
          traject_type:document.getElementById('n-type').value,
          sector:document.getElementById('n-sector').value,
          verkoper_adres:document.getElementById('n-adres').value.trim(),
          koper_naam:document.getElementById('n-koper-naam').value.trim(),
          koper_email:document.getElementById('n-koper-email').value.trim()
        }
      });
      var d=await r.json();
      if(!d.ok){err.textContent=d.error||'Fout.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';return;}
      document.getElementById('n-ok').style.display='block';
      document.getElementById('n-ok').innerHTML='<strong style="color:var(--teal)">✓ Aangemaakt</strong><br>'
        +'Verkoperscode: <span class="code-chip">'+esc(d.code)+'</span><br>'
        +'Koperscode: <span class="code-chip" style="background:var(--gold-bg);color:var(--gold);border-color:rgba(201,168,76,.3)">'+esc(d.koper_code)+'</span><br>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:.5rem">Inloggen via koersvoormorgen.nl/mna.html</div>';
      document.getElementById('n-ann').textContent='Sluiten';
      btn.textContent='Aangemaakt ✓';
      G.trajecten.unshift({id:d.code,kantoor_naam:naam,traject_type:document.getElementById('n-type').value,sector:document.getElementById('n-sector').value,status:'actief',koper_code:d.koper_code,tussen_code:d.tussen_code,created_at:Date.now()});
    }catch(e){err.textContent=e.message+' — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';}
  };
  document.getElementById('n-naam').focus();
}

renderLogin();
</script>
</body>
</html>
