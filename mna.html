<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&A Begeleiding — KantoorInzicht</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.save-indicator{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}
/* Cover letter */
.cover-letter{background:var(--panel);border:2px solid var(--teal);border-radius:var(--r2);padding:2rem;margin-bottom:1.5rem}
.cover-letter h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--head);font-weight:600;margin-bottom:1rem}
.cover-letter p{font-size:13px;color:var(--mid);margin-bottom:.75rem;line-height:1.75}
.cover-letter ul{margin:.5rem 0 .75rem 1.2rem}
.cover-letter ul li{font-size:13px;color:var(--mid);margin-bottom:.3rem}
.cover-letter .fase-ref{display:flex;align-items:baseline;gap:.5rem;padding:5px 0;border-bottom:1px solid var(--border)}
.cover-letter .fase-ref:last-child{border:none}
.cover-letter .fase-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);min-width:24px}
.status-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.status-actief{background:var(--teal-bg);color:var(--teal)}
.status-in_behandeling{background:var(--gold-bg);color:var(--gold)}
.status-afgerond{background:var(--card);color:var(--mid)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .25s ease forwards}
@media print{
  @page{margin:2cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.prog-bar{display:none!important}
  .ai-panel,.panel{break-inside:avoid}
  body{font-size:11px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
var WORKER='https://kantoorinzicht.marcel-bisschops.workers.dev';

var FASES=[
{id:'financieel',num:'I',title:'Financieel',desc:'Kwaliteit en duurzaamheid van omzet en winst.',
 dataFields:[
  {id:'omzet1',label:'Jaaromzet jaar 1 (oudste)',ph:'bijv. 2.400.000',doc:true},
  {id:'omzet2',label:'Jaaromzet jaar 2',ph:'bijv. 2.650.000',doc:true},
  {id:'omzet3',label:'Jaaromzet jaar 3 (meest recent)',ph:'bijv. 2.900.000',doc:true},
  {id:'omzetYTD',label:'Omzet YTD huidig jaar',ph:'bijv. 1.800.000',doc:true},
  {id:'ebitda',label:'EBITDA-marge jaar 3 (%)',ph:'bijv. 23',doc:false},
  {id:'ebitdaNorm',label:'Genormaliseerde EBITDA',ph:'bijv. 650.000',doc:true},

 redflags:['Hoge WIP en oude debiteuren (>90 dagen)','Lage partnerproductiviteit tov benchmark','Eenmalige omzetpieken vertekenen beeld','Niet-genormaliseerde partnerbeloningen']},

{id:'commercieel',num:'II',title:'Klanten & commercieel',desc:'Concentratie, retentie en commerciële kracht.',

  {id:'aantalKlanten',label:'Aantal actieve klanten',ph:'bijv. 340',doc:false},
  {id:'churn',label:'Klantverloop per jaar (%)',ph:'bijv. 6',doc:false},
  {id:'klantduur',label:'Gem. klantduur (jaar)',ph:'bijv. 8',doc:false},
  {id:'top1pct',label:'Grootste klant (% omzet)',ph:'bijv. 8',doc:false},
  {id:'top10pct',label:'Top 10 klanten (% omzet)',ph:'bijv. 35',doc:false},
  {id:'recurring',label:'Vaste omzet (%)',ph:'bijv. 65',doc:false},

 redflags:['Omzet geconcentreerd bij minder dan 5 klanten','Klantverloop meer dan 10% per jaar','Klantrelaties hangen aan individuele partners','Geen structurele acquisitie — alleen referrals']},

  {id:'gemLeeftijd',label:'Gem. leeftijd partners',ph:'bijv. 54',doc:false},
  {id:'omzetPerP',label:'Omzet per partner',ph:'bijv. 725.000',doc:false},

  {id:'vacatures',label:'Openstaande vacatures',ph:'bijv. 3',doc:false},
  {id:'raAa',label:'RA/AA in opleiding',ph:'bijv. 4',doc:false},
  {id:'opvolging',label:'Opvolgingskandidaat aanwezig',ph:'bijv. ja / nee',doc:false},
  {id:'pContract',label:'Partnerovereenkomsten actueel',ph:'bijv. ja / deels / nee',doc:true},
 ],
 items:['Omzetbijdrage per partner vastgesteld','Leeftijdsopbouw partners in kaart','Exitregelingen en contractduur besproken','Good/bad leaver bepalingen aanwezig','Opvolgingsplan sleutelpartners aanwezig','Retentierisico na transactie beoordeeld','Organogram met FTE per niveau aangeleverd','Verlooppercentage bepaald (benchmark 15%)','Cultuur en veranderbereidheid getoetst'],
 redflags:['Omzet zit in hoofden van 1-2 partners','Pensioengolf zonder concrete opvolging','Personeelsverloop meer dan 15%','Geen formele partnerovereenkomsten']},

{id:'compliance',num:'IV',title:'Compliance & kwaliteit',desc:'Regulatory status, dossierkwaliteit en integriteitsrisico.',
 dataFields:[
  {id:'nba',label:'NBA-status',ph:'bijv. actief / opgeschort',doc:true},
  {id:'afm',label:'AFM-vergunning',ph:'bijv. n.v.t. / aanwezig',doc:true},
  {id:'toetsDatum',label:'Laatste kwaliteitstoetsing (jaar)',ph:'bijv. 2023',doc:true},
  {id:'toetsOordeel',label:'Oordeel kwaliteitstoetsing',ph:'bijv. voldoende / met aandachtspunten',doc:true},
  {id:'tuchtzaken',label:'Lopende tuchtzaken',ph:'bijv. 0 / ja (beschrijf)',doc:false},
  {id:'claims',label:'Civiele claims',ph:'bijv. geen / ja (bedrag)',doc:false},
  {id:'wwft',label:'Wwft-procedures op orde',ph:'bijv. ja / deels / nee',doc:true},
  {id:'incidenten',label:'Integriteitsincidenten <5 jaar',ph:'bijv. geen / ja (beschrijf)',doc:false},
 ],
 items:['NBA-inschrijving en vergunningsstatus gecontroleerd','Laatste kwaliteitstoetsingen doorgenomen','Bevindingen en herstelmaatregelen beoordeeld','Wwft-procedures en client acceptance gereviewed','UBO-processen inzichtelijk','Lopende tuchtzaken geïnventariseerd','Civiele claims in kaart','Compliance handboek actueel'],
 redflags:['Negatieve kwaliteitstoetsing NBA afgelopen 2 jaar','Lopende tuchtzaken of civiele claims','Wwft zwak ingericht','Structurele dossierbevindingen']},

{id:'it',num:'V',title:'IT & automatisering',desc:'Systemen, automatiseringsgraad en AI-readiness.',
 dataFields:[
  {id:'software',label:'Primaire software',ph:'bijv. Exact Online, Caseware',doc:false},
  {id:'softwareOverig',label:'Overige systemen',ph:'bijv. AFAS, Silverfin, Dext',doc:false},
  {id:'autoGraad',label:'Automatiseringsgraad routinetaken',ph:'bijv. hoog / gemiddeld / laag',doc:false},
  {id:'ai',label:'AI-tooling in gebruik',ph:'bijv. Copilot, ChatGPT',doc:false},
  {id:'itKosten',label:'IT-kosten (% omzet)',ph:'bijv. 4',doc:false},
  {id:'security',label:'Cybersecurity status',ph:'bijv. ISO 27001 / geen cert.',doc:true},
  {id:'itRisico',label:'Bekende IT-risicos',ph:'bijv. verouderde software',doc:false},
 ],
 items:['Softwarelandschap volledig in kaart','Automatiseringsgraad routinetaken bepaald','AI-tooling aanwezig en in gebruik','Workflow management operationeel','Cybersecurity status vastgesteld','Backup- en recoveryprocessen getoetst','Datakwaliteit en rapportagestructuur inzichtelijk'],
 redflags:['Geen schaalbaar systeemlandschap','Hoge mate van handmatig werk','Lage AI-readiness','Cybersecurity kwetsbaarheden aanwezig']},

{id:'juridisch',num:'VI',title:'Juridisch & fiscaal',desc:'Structuur, contracten en fiscale risico.',
 dataFields:[
  {id:'rechtsvorm',label:'Rechtsvorm(en)',ph:'bijv. BV, maatschap',doc:true},
  {id:'structuur',label:'Aandeelhoudersstructuur',ph:'bijv. 3 partners elk 33%',doc:true},
  {id:'huur',label:'Huurcontract looptijd',ph:'bijv. tot 2027, verlengbaar',doc:true},
  {id:'vpb',label:'VPB openstaande discussies',ph:'bijv. geen / ja (beschrijf)',doc:false},
  {id:'fiscaalRisico',label:'Fiscale risicos',ph:'bijv. geen / ja (beschrijf)',doc:false},
  {id:'stak',label:'STAK of bijzondere structuur',ph:'bijv. n.v.t. / ja (beschrijf)',doc:true},
  {id:'overigeClaims',label:'Claims of garanties',ph:'bijv. geen / ja (bedrag)',doc:false},
  {id:'lease',label:'Leaseverplichtingen (per jaar)',ph:'bijv. 45.000',doc:true},
 ],
 items:['Statuten en aandeelhoudersovereenkomst doorgenomen','Groepsstructuur inzichtelijk','Partnerovereenkomsten compleet en actueel','Huurcontracten en looptijden inzichtelijk','Leaseverplichtingen geïnventariseerd','VPB-positie 3 jaar beoordeeld','Partnerstructuur fiscaal geanalyseerd','Openstaande Belastingdienstdiscussies vastgesteld'],
 redflags:['Openstaande fiscale discussies of naheffingen','Gebrekkige partnerovereenkomsten','Huurcontract niet overdraagbaar','Onbekende claims of garantieverplichtingen']},

{id:'strategisch',num:'VII',title:'Strategisch & markt',desc:'Marktpositie, groeipotentieel en strategische fit.',
 dataFields:[
  {id:'marktpos',label:'Marktpositie / regio',ph:'bijv. top 3 in regio X',doc:false},
  {id:'niche',label:'Niche of specialisme',ph:'bijv. agri, zorg, PE-backed',doc:false},
  {id:'concurrenten',label:'Belangrijkste concurrenten',ph:'bijv. kantoor A, B',doc:false},
  {id:'aiImpact',label:'AI-impact op dienstenmix',ph:'bijv. hoog (60% samenstel)',doc:false},
  {id:'cultuurFit',label:'Cultuurfit met koper',ph:'bijv. goed / twijfelachtig',doc:false},
  {id:'synergie',label:'Synergiepotentieel',ph:'bijv. 15% kostensynergie',doc:false},
  {id:'groeipot',label:'Buy & build potentieel',ph:'bijv. 2-3 regionale kantoren',doc:false},
  {id:'peReadiness',label:'PE-readiness indicatief',ph:'bijv. hoog / gemiddeld / laag',doc:false},
 ],
 items:['Regionale marktpositie en niches vastgesteld','Concurrentieanalyse uitgevoerd','AI-impact op dienstverleningsmodel beoordeeld','Buy & build potentieel geïnventariseerd','Schaalbaarheid vastgesteld','Synergiepotentieel bepaald','Cultuurfit getoetst','PE-readiness indicatief bepaald'],
 redflags:['Te hoge afhankelijkheid samenstelpraktijk (AI-risico)','Geen duidelijke niche of marktpositie','Cultuurmismatch met koper','Beperkt integratiepotentieel']},
];

var S={screen:'login',code:'',traject:null,fase:0,checked:{},data:{},docRefs:{},notities:{},aiTexts:{},aiLoading:{},saving:false,saveTimer:null};

function pct(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return 0;var d=f.items.filter(function(_,i){return S.checked[id+'_'+i];}).length;return f.items.length?Math.round(d/f.items.length*100):0;}
function totalPct(){var t=0,d=0;FASES.forEach(function(f){t+=f.items.length;d+=f.items.filter(function(_,i){return S.checked[f.id+'_'+i];}).length;});return t?Math.round(d/t*100):0;}
function dc(v){return v>=70?'var(--teal)':v>=50?'var(--gold)':'var(--red)';}
function ge(id){return document.getElementById(id);}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── SAVE TO DB ──────────────────────────────────────────────────
function saveCurrent(cb){
  var f=FASES[S.fase];
  if(!f||S.screen!=='main')return;
  if(S.traject&&S.traject.status==='vergrendeld'){if(cb)cb();return;}
  f.dataFields.forEach(function(df){
    var el=ge('df_'+df.id);if(el)S.data[f.id+'_'+df.id]=el.value;
    if(df.doc){var re=ge('dr_'+df.id);if(re)S.docRefs[f.id+'_'+df.id]=re.value;}
  });
  var nel=ge('notitie_'+f.id);
  if(nel)S.notities[f.id]=nel.value;

  clearTimeout(S.saveTimer);
  S.saveTimer=setTimeout(function(){
    fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:S.code,fase_id:f.id,data_json:getDataForFase(f.id),checklist_json:getChecklistForFase(f.id),notitie:S.notities[f.id]||''})
    }).then(function(){showSaveIndicator();}).catch(function(){});
    if(cb)cb();
  },800);
}

function getDataForFase(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});
  if(!f)return {};
  var out={};
  f.dataFields.forEach(function(df){
    var v=S.data[faseId+'_'+df.id];
    var r=S.docRefs[faseId+'_'+df.id];
    if(v||r)out[df.id]={value:v||'',ref:r||'',label:df.label};
  });
  return out;
}
function getChecklistForFase(faseId){
  var out={items:{},redflags:{}};
  var f=FASES.find(function(x){return x.id===faseId;});
  if(!f)return out;
  f.items.forEach(function(_,i){out.items[i]=!!S.checked[faseId+'_'+i];});
  f.redflags.forEach(function(_,i){out.redflags[i]=!!S.checked[faseId+'_rf_'+i];});
  return out;
}

function showSaveIndicator(){
  var el=ge('save-ind');
  if(!el)return;
  el.textContent='Opgeslagen';
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2000);
}

// ── LOAD FROM DB ─────────────────────────────────────────────────
function loadDataFromDB(dbData){
  dbData.forEach(function(row){
    var faseId=row.fase_id;
    var dataJson=typeof row.data_json==='string'?JSON.parse(row.data_json||'{}'):row.data_json||{};
    var chkJson=typeof row.checklist_json==='string'?JSON.parse(row.checklist_json||'{}'):row.checklist_json||{};
    var f=FASES.find(function(x){return x.id===faseId;});
    if(!f)return;
    // data
    Object.keys(dataJson).forEach(function(dfId){
      var v=dataJson[dfId];
      if(v&&v.value)S.data[faseId+'_'+dfId]=v.value;
      if(v&&v.ref)S.docRefs[faseId+'_'+dfId]=v.ref;
    });
    // checklist
    if(chkJson.items)Object.keys(chkJson.items).forEach(function(i){S.checked[faseId+'_'+i]=chkJson.items[i];});
    if(chkJson.redflags)Object.keys(chkJson.redflags).forEach(function(i){S.checked[faseId+'_rf_'+i]=chkJson.redflags[i];});
    // notitie
    if(row.notitie)S.notities[faseId]=row.notitie;
  });
}

// ── AI ───────────────────────────────────────────────────────────
async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  saveCurrent();S.aiLoading[faseId]=true;renderApp();
  var dataLines=[];
  f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataLines.push(df.label+': '+v+(r?' (document: '+r+')':''));});
  var chk=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var open=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfs=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur gespecialiseerd in accountantskantoren en administratiekantoren. Je begeleidt een '+esc(S.traject&&S.traject.traject_type||'M&A')+'-traject voor kantoor "'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'".\n\nFASE: '+f.title+'\nVOORTGANG: '+pct(faseId)+'% ('+chk.length+'/'+f.items.length+')\n\nINGEVOERDE GEGEVENS:\n'+(dataLines.join('\n')||'Geen cijfers ingevoerd')+'\n\nAFGEROND:\n'+(chk.map(function(x){return '+ '+x;}).join('\n')||'Niets')+'\n\nOPEN:\n'+(open.map(function(x){return 'o '+x;}).join('\n')||'Alles gereed')+'\n\nRODE VLAGGEN:\n'+(rfs.map(function(x){return '! '+x;}).join('\n')||'Geen')+'\n\nNOTITIES:\n'+(S.notities[faseId]||'Geen')+'\n\nGeef een beknopt strategisch advies voor deze fase. Analyseer de ingevoerde cijfers expliciet en vergelijk met sectorgemiddelden. Bespreek: voortgang en prioriteiten, urgente openstaande items, impact rode vlaggen op transactie, concrete vervolgstappen. Schrijf in ik-vorm, direct en professioneel. Gebruik ## koppen. Geen tabellen of bullets.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();var dec=new TextDecoder();var collected='';
    while(true){var res=await reader.read();if(res.done)break;dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}}});}
    S.aiTexts[faseId]=collected;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

function bindAll(){

  if(lb){
    lb.onclick=async function(){
      var code=((ge('l-code')||{}).value||'').trim().toUpperCase();
      if(!code)return;
      var err=ge('l-err');var load=ge('l-load');
      if(err)err.style.display='none';
      if(load)load.style.display='block';
      lb.disabled=true;
      try{
        var resp=await fetch(WORKER+'/mna/traject/'+code);
        if(!resp.ok)throw new Error('not found');
        var d=await resp.json();
        S.code=code;S.traject=d.traject;
        if(d.data&&d.data.length)loadDataFromDB(d.data);
        S.screen='cover';renderApp();
      }catch(e){
        if(err)err.style.display='block';
        if(load)load.style.display='none';
        lb.disabled=false;
      }
    };
    var cf=ge('l-code');
    if(cf){cf.oninput=function(){this.value=this.value.toUpperCase();};cf.onkeydown=function(e){if(e.key==='Enter')lb.click();};}
  }

  var toMain=ge('to-main-btn');if(toMain)toMain.onclick=function(){S.screen='main';renderApp();};
  var toMain2=ge('to-main-btn2');if(toMain2)toMain2.onclick=function(){S.screen='main';renderApp();};
  var coverBtn=ge('cover-btn');if(coverBtn)coverBtn.onclick=function(){saveCurrent();S.screen='cover';renderApp();};
  var backMain=ge('back-main');if(backMain)backMain.onclick=function(){S.screen='main';renderApp();};
  var sumBtn=ge('sum-btn');if(sumBtn)sumBtn.onclick=function(){saveCurrent();S.screen='summary';renderApp();};
  var sumBtn2=ge('sum-btn2');if(sumBtn2)sumBtn2.onclick=function(){saveCurrent();S.screen='summary';renderApp();};
  var prevBtn=ge('prev-btn');if(prevBtn)prevBtn.onclick=function(){saveCurrent();S.fase--;renderApp();};
  var nextBtn=ge('next-btn');if(nextBtn)nextBtn.onclick=function(){saveCurrent();S.fase++;renderApp();};
  var genBtn=ge('gen-btn');if(genBtn)genBtn.onclick=function(){generateAI(FASES[S.fase].id);};

  document.querySelectorAll('.fase-card[data-fi]').forEach(function(el){
    el.onclick=function(){saveCurrent();S.fase=parseInt(el.dataset.fi);renderApp();};
  });
  document.querySelectorAll('.chk-item[data-key]').forEach(function(el){
    el.onclick=function(){saveCurrent();S.checked[el.dataset.key]=!S.checked[el.dataset.key];renderApp();};
  });
}

renderApp();
</script>
</body>
</html>
