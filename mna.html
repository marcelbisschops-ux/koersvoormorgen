<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&A Begeleiding — KantoorInzicht</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
/* Field */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
/* Data entry grid */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
.data-grid.triple{grid-template-columns:1fr 1fr 1fr}
@media(max-width:700px){.data-grid.triple{grid-template-columns:1fr 1fr}}
/* Section header */
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
/* Tab bar */
.tab-bar{display:flex;gap:2px;margin-bottom:2rem;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .12s}
.tab:hover{color:var(--sub)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab.done{color:var(--mid)}
.tab.done::after{content:' ✓';font-size:9px}
/* Progress */
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
/* Checklist */
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
/* AI panel */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
/* Overview */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
/* Nav */
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
/* Summary */
.sum-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem}
.sum-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem;display:flex;align-items:center;justify-content:space-between}
.sum-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)}
.sum-row:last-child{border-bottom:none}
.sum-row .lbl{color:var(--muted)}
/* Spinner */
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* Doc ref badge */
.doc-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;background:var(--gold-bg);color:var(--gold);border:1px solid rgba(201,168,76,.3);padding:2px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .25s ease forwards}
@media print{
  @page{margin:1.5cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.tab-bar{display:none!important}
  .ai-panel,.panel{break-inside:avoid}
  body{font-size:11px}
}
</style>
</head>

function pct(id){
  var f=FASES.find(function(x){return x.id===id;});
  if(!f)return 0;
  var done=f.items.filter(function(_,i){return S.checked[id+'_'+i];}).length;
  return f.items.length?Math.round(done/f.items.length*100):0;
}

  FASES.forEach(function(f){
    t+=f.items.length;
    d+=f.items.filter(function(_,i){return S.checked[f.id+'_'+i];}).length;
  });
  return t?Math.round(d/t*100):0;
}
function dc(v){return v>=70?'var(--teal)':v>=50?'var(--gold)':'var(--red)';}
function ge(id){return document.getElementById(id);}

// ── SAVE CURRENT FASE DATA ───────────────────────────────────────
function saveCurrent(){
  var f=FASES[S.fase];
  if(!f||S.screen!=='main')return;
  f.dataFields.forEach(function(df){
    var el=ge('df_'+df.id);
    if(el)S.data[f.id+'_'+df.id]=el.value;
    if(df.doc){
      var rel=ge('dr_'+df.id);
      if(rel)S.docRefs[f.id+'_'+df.id]=rel.value;
    }
  });
  var nel=ge('notitie_'+f.id);
  if(nel)S.notities[f.id]=nel.value;
}

// ── RENDER ───────────────────────────────────────────────────────
function renderApp(){
  var app=ge('app');
  if(S.screen==='login') app.innerHTML=renderLogin();
  else if(S.screen==='main') app.innerHTML=renderMain();
  else if(S.screen==='summary') app.innerHTML=renderSummary();
  bindAll();
}

    +'<div style="font-size:11px;color:var(--muted);margin-top:.25rem">Alles wordt bewaard zolang deze pagina open is. Gebruik het PDF-overzicht om te exporteren.</div>'

    +'<div style="font-family:Playfair Display,serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.25rem">'
    +'Due Diligence <em style="color:var(--teal)">Voorbereiding</em></div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1rem">'+escHtml(S.naam)+' &middot; '

    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; M&amp;A</div>'

    +'<button class="btn-ghost btn-sm" onclick="window.print()">PDF afdrukken</button>'

    +'<div style="font-family:Playfair Display,serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.25rem">DD Samenvatting</div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1.5rem">'+escHtml(S.naam)+' &middot; '+new Date().toLocaleDateString('nl-NL',{day:'2-digit',month:'long',year:'numeric'})+'</div>'

    +'<div class="panel" style="text-align:center;padding:1.1rem"><div style="font-family:Playfair Display,serif;font-size:1.8rem;font-weight:600;color:var(--red)">'+rfCount+'</div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Rode vlaggen</div></div>'

// ── GENERATE AI ──────────────────────────────────────────────────
async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});
  if(!f)return;
  saveCurrent();
  S.aiLoading[faseId]=true;
  renderApp();

  var dataLines=[];
  f.dataFields.forEach(function(df){
    var val=S.data[f.id+'_'+df.id];
    var ref=S.docRefs[f.id+'_'+df.id];
    if(val) dataLines.push(df.label+': '+val+(ref?' (document: '+ref+')':''));
  });

  var checkedItems=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var openItems=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfHits=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var notitie=S.notities[faseId]||'';
  var p=pct(faseId);

  var dataStr=dataLines.length?dataLines.join('\n'):'Geen cijfers ingevoerd';
  var checkedStr=checkedItems.length?checkedItems.map(function(x){return 'Gereed: '+x;}).join('\n'):'Nog niets afgerond';
  var openStr=openItems.length?openItems.map(function(x){return 'Open: '+x;}).join('\n'):'Alle items afgerond';
  var rfStr=rfHits.length?rfHits.map(function(x){return 'Rode vlag gesignaleerd: '+x;}).join('\n'):'Geen rode vlaggen gesignaleerd';

  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur gespecialiseerd in accountantskantoren en administratiekantoren. Je begeleidt een due diligence traject voor kantoor "'+S.naam+'".\n\nFASE: '+f.title+'\nVOORTGANG: '+p+'% ('+checkedItems.length+'/'+f.items.length+' checklistitems)\n\nINGEVOERDE CIJFERS EN KENGETALLEN:\n'+dataStr+'\n\nCHECKLIST STATUS:\n'+checkedStr+'\n\n'+openStr+'\n\nRODE VLAGGEN:\n'+rfStr+'\n\nNOTITIES:\n'+(notitie||'Geen notities ingevoerd')+'\n\nGeef een beknopt strategisch advies voor deze fase. Analyseer de ingevoerde cijfers expliciet waar relevant en vergelijk met sectorgemiddelden. Bespreek: de voortgang en prioriteiten, urgente openstaande items, hoe rode vlaggen de transactie beinvloeden, en concrete vervolgstappen. Schrijf in ik-vorm, direct en professioneel. Gebruik ## koppen. Geen tabellen of bullets.';

  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();
    var dec=new TextDecoder();
    var collected='';
    while(true){
      var res=await reader.read();
      if(res.done)break;
      var chunk=dec.decode(res.value,{stream:true});
      chunk.split('\n').forEach(function(line){
        if(line.startsWith('data:')){
          var d=line.slice(5).trim();
          if(d==='[DONE]')return;
          try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}
        }
      });
    }
    S.aiTexts[faseId]=collected;
  }catch(e){
    S.aiTexts[faseId]='__ERROR__';
  }
  S.aiLoading[faseId]=false;
  renderApp();
}

// ── BIND EVENTS ──────────────────────────────────────────────────
function bindAll(){
  var lb=ge('l-btn');
  if(lb){
    lb.onclick=function(){
      var pw=(ge('l-pw')||{}).value||'';
      var naam=(ge('l-naam')||{}).value||'';
      if(pw.trim()===MNA_PW){S.naam=naam.trim()||'Kantoor';S.screen='main';renderApp();}
      else{var e=ge('l-err');if(e)e.style.display='block';}
    };
    var pf=ge('l-pw');
    if(pf)pf.onkeydown=function(e){if(e.key==='Enter')lb.click();};
  }
  document.querySelectorAll('.fase-card[data-fi]').forEach(function(el){
    el.onclick=function(){saveCurrent();S.fase=parseInt(el.dataset.fi);renderApp();};
  });
  document.querySelectorAll('.chk-item[data-key]').forEach(function(el){
    el.onclick=function(){saveCurrent();S.checked[el.dataset.key]=!S.checked[el.dataset.key];renderApp();};
  });
  var gb=ge('gen-btn');
  if(gb)gb.onclick=function(){generateAI(FASES[S.fase].id);};
  var pb=ge('prev-btn');
  if(pb)pb.onclick=function(){saveCurrent();S.fase--;renderApp();};
  var nb=ge('next-btn');
  if(nb)nb.onclick=function(){saveCurrent();S.fase++;renderApp();};
  var sb=ge('sum-btn');
  if(sb)sb.onclick=function(){saveCurrent();S.screen='summary';renderApp();};
  var sb2=ge('sum-btn2');
  if(sb2)sb2.onclick=function(){saveCurrent();S.screen='summary';renderApp();};
  var bm=ge('back-main');
  if(bm)bm.onclick=function(){S.screen='main';renderApp();};
}

function escHtml(s){
  if(!s)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

renderApp();
</script>
