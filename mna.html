function docProcesCheck(docType) {
  // Bepaal opdrachtgever_rol — default 'verkoper' voor legacy trajecten
  var rol = (S.traject && S.traject.opdrachtgever_rol) ? S.traject.opdrachtgever_rol : 'verkoper';
  var t = S.traject || {};
  var waarschuwingen = [];
  var geblokkeerd = false;

  // Proceslogica: Informatiebrief → BEM → Excl → NDA → LoI
  if (docType === 'bem') {
    // BEM: altijd als eerste mogelijk, geen vereiste
    // Maar check wel of er al een is
    if (t.bem_tekst || t.bem_datum) {
      waarschuwingen.push('Er is al een Bemiddelingsovereenkomst aangemaakt' +
        (t.bem_getekend ? ' (getekend door ' + t.bem_getekend + ')' : ' (nog niet getekend)') + '.');
    }
  }

  if (docType === 'excl') {
    if (!t.bem_tekst && !t.bem_datum) {
      waarschuwingen.push('⚠ De Bemiddelingsovereenkomst is nog niet aangemaakt. Verstuur eerst de BEM.');
      geblokkeerd = true;
    } else if (!t.bem_getekend) {
      waarschuwingen.push('⚠ De Bemiddelingsovereenkomst is nog niet getekend door de opdrachtgever. Overweeg of u toch wilt doorgaan.');
    }
    if (t.excl_tekst || t.excl_datum) {
      waarschuwingen.push('Er is al een Exclusiviteitsbrief aangemaakt' +
        (t.excl_getekend ? ' (getekend door ' + t.excl_getekend + ')' : ' (nog niet getekend)') + '.');
    }
  }

  if (docType === 'nda') {
    if (!t.bem_tekst && !t.bem_datum) {
      waarschuwingen.push('⚠ De Bemiddelingsovereenkomst is nog niet aangemaakt. Verstuur eerst de BEM.');
      geblokkeerd = true;
    } else if (!t.bem_getekend) {
      waarschuwingen.push('⚠ De Bemiddelingsovereenkomst is nog niet getekend. Overweeg of u toch wilt doorgaan.');
    }
    if (t.nda_tekst || t.nda_datum) {
      waarschuwingen.push('Er is al een NDA aangemaakt' +
        (t.nda_getekend ? ' (getekend door ' + t.nda_getekend + ')' : ' (nog niet getekend)') + '.');
    }
  }

  if (docType === 'loi') {
    var ndaOk = t.nda_getekend || (t.nda_tekst && t.nda_datum);
    var exclOk = t.excl_getekend || (t.excl_tekst && t.excl_datum);
    if (!ndaOk) {
      waarschuwingen.push('⚠ De NDA is nog niet ' + (t.nda_datum ? 'getekend' : 'aangemaakt') + '. Verstuur eerst de NDA.');
      geblokkeerd = true;
    }
    if (!exclOk) {
      waarschuwingen.push('⚠ De Exclusiviteitsbrief is nog niet ' + (t.excl_datum ? 'getekend' : 'aangemaakt') + '. Verstuur eerst de Excl.');
      geblokkeerd = true;
    }
    if (t.loi_tekst || t.loi_datum) {
      waarschuwingen.push('Er is al een LoI aangemaakt' +
        (t.loi_getekend ? ' (getekend door ' + t.loi_getekend + ')' : ' (nog niet getekend)') + '.');
    }
  }

  return { waarschuwingen: waarschuwingen, geblokkeerd: geblokkeerd };
}

async function toonDocWaarschuwing(docType, onDoorgaan) {
  // Haal versies op voor realtime blokkadecheck
  var versies = [];
  try {
    var vr = await fetch(WORKER+'/mna/versies/'+S.code);
    versies = await vr.json();
  } catch(e) {}

  var t = S.traject || {};
  var heeftBem = versies.some(function(v){return v.doc_type==='bem'||v.doc_type==='bem_verk'||v.doc_type==='bem_koper'||v.doc_type==='bem_upload';});
  var heeftNda = versies.some(function(v){return v.doc_type==='nda'||v.doc_type==='nda_upload';});
  var heeftExcl = versies.some(function(v){return v.doc_type==='exclusief'||v.doc_type==='excl'||v.doc_type==='excl_upload';});
  var heeftLoi = versies.some(function(v){return v.doc_type==='loi'||v.doc_type==='loi_upload';});

  var waarschuwingen = [];
  var geblokkeerd = false;

  if (!t.koper_naam || !t.koper_naam.trim()) {
    waarschuwingen.push('⚠ Kopernaam is nog niet ingevuld. Het document gebruikt dan de generieke aanduiding "[koper]" in plaats van een naam.');
  }

  if (docType === 'bem') {
    if (heeftBem) waarschuwingen.push('Er is al een Bemiddelingsovereenkomst aangemaakt.');
  }
  if (docType === 'excl') {
    if (!heeftBem) { waarschuwingen.push('⚠ De BEM is nog niet aangemaakt. Verstuur eerst de BEM.'); geblokkeerd = true; }
    if (heeftExcl) waarschuwingen.push('Er is al een Exclusiviteitsbrief aangemaakt.');
  }
  if (docType === 'nda') {
    if (!heeftBem) { waarschuwingen.push('⚠ De BEM is nog niet aangemaakt. Verstuur eerst de BEM.'); geblokkeerd = true; }
    if (heeftNda) waarschuwingen.push('Er is al een NDA aangemaakt.');
  }
  if (docType === 'loi') {
    if (!heeftNda) { waarschuwingen.push('⚠ De NDA is nog niet aangemaakt.'); geblokkeerd = true; }
    if (!heeftExcl) { waarschuwingen.push('⚠ De Exclusiviteitsbrief is nog niet aangemaakt.'); geblokkeerd = true; }
    if (heeftLoi) waarschuwingen.push('Er is al een LoI aangemaakt.');
  }

  var check = { waarschuwingen: waarschuwingen, geblokkeerd: geblokkeerd };
  if (!check.waarschuwingen.length) { onDoorgaan(); return; }
  if (!check.waarschuwingen.length) { onDoorgaan(); return; }

  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  var mo = document.createElement('div');
  mo.style.cssText = 'background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:1.75rem;max-width:440px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.25)';

  var labels = {nda:'NDA',loi:'Letter of Intent',bem:'Bemiddelingsovereenkomst',excl:'Exclusiviteitsbrief',dealvoorstel:'Dealvoorstel',bieding:'Indicatieve bieding',spa:'Concept-koopovereenkomst'};
  var kleuren = {nda:'#7c5cbf',loi:'var(--gold)',bem:'#2a5ea0',excl:'var(--teal)',dealvoorstel:'#8a5a00',bieding:'#a0522d',spa:'#5a5470'};
  var kleur = kleuren[docType] || 'var(--teal)';

  mo.innerHTML = '<div style="font-family:Playfair Display,serif;font-size:1.1rem;font-weight:600;color:var(--head);margin-bottom:1rem">'
    + (check.geblokkeerd ? '⛔ ' : '⚠️ ') + labels[docType] + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem">'
    + check.waarschuwingen.map(function(w) {
        var isBlocker = w.startsWith('⚠');
        return '<div style="padding:.6rem .875rem;background:' + (isBlocker ? 'var(--red-bg)' : 'var(--gold-bg)')
          + ';border-left:3px solid ' + (isBlocker ? 'var(--red)' : 'var(--gold)')
          + ';border-radius:0 var(--r) var(--r) 0;font-size:12px;color:var(--sub);line-height:1.6">'
          + esc(w) + '</div>';
      }).join('')
    + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button class="btn-ghost" id="dw-ann">Annuleren</button>'
    + (!check.geblokkeerd ? '<button class="btn" id="dw-door" style="background:' + kleur + '">Toch doorgaan</button>' : '')
    + '</div>';

  ov.appendChild(mo); document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if(e.target===ov) document.body.removeChild(ov); });
  document.getElementById('dw-ann').onclick = function() { document.body.removeChild(ov); };
  if (!check.geblokkeerd) {
    document.getElementById('dw-door').onclick = function() {
      document.body.removeChild(ov);
      onDoorgaan();
    };
  }
}

async function laadPartijDocs() {
  var el = document.getElementById('partij-docs-sectie');
  if (!el) return;
  // Bepaal welke doc types zichtbaar zijn per rol
  // Documentzichtbaarheid op basis van opdrachtgever_rol
  var opdRol = (S.traject && S.traject.opdrachtgever_rol) ? S.traject.opdrachtgever_rol : 'verkoper';
  var rolFilter;
  if (isVerkoper()) {
    // Verkoper ziet: NDA + LoI + Excl (als verkoper opdrachtgever is = Excl naar koper)
    // Verkoper ziet NOOIT de BEM — dat is een contract tussen Bisschops Financing en opdrachtgever
    // Verkoper ziet altijd Excl — die is immers gericht aan de verkoper
    rolFilter = ['nda','loi','nda_upload','loi_upload','excl','exclusief','excl_upload'];
  } else {
    // Koper ziet: NDA + LoI + Excl (als koper opdrachtgever is = Excl naar verkoper)
    // Koper ziet NOOIT de BEM tenzij koper zelf opdrachtgever is
    rolFilter = ['nda','loi','nda_upload','loi_upload'];
    if (opdRol === 'koper' || opdRol === 'beide') rolFilter.push('bem','bem_koper','bem_upload');
    if (opdRol === 'verkoper' || opdRol === 'beide') rolFilter.push('excl','exclusief','excl_upload');
  }
  var labels = {nda:'NDA',loi:'Letter of Intent',bem:'Bemiddelingsovereenkomst',bem_verk:'Bemiddelingsovereenkomst',bem_koper:'Bemiddelingsovereenkomst',excl:'Exclusiviteitsbrief',exclusief:'Exclusiviteitsbrief',bem_upload:'Bemiddelingsovereenkomst',excl_upload:'Exclusiviteitsbrief',nda_upload:'NDA',loi_upload:'Letter of Intent'};
  var kleuren = {nda:'#7c5cbf',loi:'#c9a84c',bem:'#2a5ea0',bem_verk:'#2a5ea0',bem_koper:'#2a5ea0',excl:'#1a7a5e',exclusief:'#1a7a5e'};
  try {
    // Haal contractversies EN geüploade dataroom-bestanden parallel op
    var [versiesResp, docsResp] = await Promise.all([
      fetch(WORKER+'/mna/versies/'+S.code),
      fetch(WORKER+'/mna/document/lijst/'+S.code)
    ]);
    var versies = await versiesResp.json();
    var alleDocs = await docsResp.json();

    // Filter contractversies op rol
    versies = versies.filter(function(v){ return rolFilter.indexOf(v.doc_type) !== -1; });
    // Filter dataroom-bestanden: alleen bewaard=1
    var dataroomDocs = alleDocs.filter(function(d){ return d.bewaard; });

    if (!versies.length && !dataroomDocs.length) {
      el.innerHTML='<div style="margin-top:1.5rem;font-size:12px;color:var(--muted);font-style:italic">Nog geen documenten beschikbaar.</div>';
      return;
    }
    var html = '<div style="margin-top:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem">'
      + '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">&#128196; Uw documenten</div>'
      + '<div style="display:flex;flex-direction:column;gap:6px">';

    // Haal Signhost transacties op
    var shTransacties = [];
    try {
      var shR = await fetch(WORKER+'/mna/signhost/status/'+S.code);
      var shD = await shR.json();
      shTransacties = shD.transactions || [];
    } catch(e) {}

    // Contractversies (NDA, BEM, LoI, Excl)
    versies.forEach(function(v) {
      var dt = new Date(v.created_at).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});
      var kleur = kleuren[v.doc_type]||'var(--teal)';
      // Zoek Signhost transactie voor dit doc type
      var shTx = shTransacties.find(function(tx){ return tx.doc_type === v.doc_type || (tx.reference && tx.reference.includes(v.doc_type)); });
      var shStatus = shTx ? shTx.status : null;
      // Check ook trajectvelden voor tekenstatus
      var t = S.traject || {};
      var trajectGetekend = false;
      if(v.doc_type === 'bem' || v.doc_type === 'bem_verk' || v.doc_type === 'bem_koper' || v.doc_type === 'bem_upload') trajectGetekend = !!t.bem_getekend;
      else if(v.doc_type === 'nda' || v.doc_type === 'nda_upload') trajectGetekend = !!t.nda_getekend;
      else if(v.doc_type === 'loi' || v.doc_type === 'loi_upload') trajectGetekend = !!t.loi_getekend;
      else if(v.doc_type === 'excl' || v.doc_type === 'exclusief' || v.doc_type === 'excl_upload') trajectGetekend = !!t.excl_getekend;
      var isGetekend = shStatus === 'ondertekend' || trajectGetekend;
      var shBadge = '';
      if(isGetekend) shBadge = '<span style="font-size:10px;background:#edf7f3;color:var(--teal);border:1px solid var(--teal);border-radius:10px;padding:1px 8px;font-weight:600">✓ Getekend</span>';
      else if(shStatus && shStatus !== 'ondertekend') shBadge = '<span style="font-size:10px;background:#f5f5f3;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:1px 8px">' + esc(shStatus) + '</span>';
      else if(!v.is_upload) shBadge = '<span style="font-size:10px;background:#fdf8ee;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:1px 8px">Niet getekend</span>';
      html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .875rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<span style="font-size:12px;font-weight:600;color:'+kleur+';flex:1">'+(labels[v.doc_type]||v.doc_type)+'</span>'
        + '<span style="font-size:11px;color:var(--muted)">'+dt+'</span>'
        + shBadge
        + (v.is_upload
          ? '<a href="'+WORKER+'/mna/document/download/'+v.id+'?code='+encodeURIComponent(S.code)+'" target="_blank" class="btn-ghost" style="font-size:11px;padding:4px 12px;text-decoration:none">&#8681; Download</a>'
          : '<button class="btn-ghost partij-doc-open" data-id="'+v.id+'" style="font-size:11px;padding:4px 12px">&#128065; Lezen</button>')
        + '</div>';
    });

    // Geüploade dataroom-bestanden — filter contracten eruit + BEM nooit tonen aan verkoper
    var contractBestandsnamen = versies.filter(function(v){return v.is_upload;}).map(function(v){return v.bestand_naam||v.id;});
    dataroomDocs = dataroomDocs.filter(function(d){
      // Verwijder als het al als contract-upload getoond wordt
      if(contractBestandsnamen.some(function(n){return n===d.bestand_naam;}))return false;
      var naam=(d.bestand_naam||'').toLowerCase();
      // BEM nooit tonen aan verkoper
      if(isVerkoper()&&(naam.includes('bem')||naam.includes('bemiddelingsovereenkomst')))return false;
      // Excl niet tonen aan koper als koper de opdrachtgever is (Excl is dan voor de verkoper)
      if(!isVerkoper()&&(naam.includes('excl')||naam.includes('exclusiviteit'))&&(opdRol==='koper'||opdRol==='beide'))return false;
      return true;

  // Marcel-only: checklist + rode vlaggen + notities + AI

    var aiText=S.aiTexts[f.id];var aiLoad=S.aiLoading[f.id];

    else{
      var h=aiText;
      // Verwijder pipe-tabellen (| Veld | Status | ... |)
      h=h.replace(/^\|[-| ]+\|$/gm,'');
      h=h.replace(/^\|.+\|$/gm,function(line){

        return line.replace(/^\||\|$/g,'').split('|').map(function(s){return s.trim();}).filter(Boolean).join(' — ');
      });

      h=h.replace(/\b(NIET GEVERIFIEERD|ONVOLLEDIG GEDOCUMENTEERD|ONVOLLEDIG|NIET GEVERIFIEERD|HOOG|MIDDELMATIG|LAAG|KRITIEK)\b/g,'');
      // Verwijder dubbele spaties en lege regels
      h=h.replace(/  +/g,' ').replace(/\n{3,}/g,'\n\n');
      // Markdown naar HTML
      h=h.replace(/## ([^\n]+)/g,function(_,t){return '<h3>'+t+'</h3>';});
      h=h.replace(/\*\*([^*]+)\*\*/g,function(_,t){return '<strong>'+t+'</strong>';});
      h=h.split('\n\n').map(function(p){
        p=p.trim();

        // Bullets omzetten naar leesbare zinnen

        return '<p>'+p+'</p>';
      }).join('');
      aiBodyHtml=h;
    }
    var aiHtml='<div class="ai-panel"><div class="ai-hdr"><div><div class="ai-title">AI-advies: '+f.title+'</div><div class="ai-sub">Intern analyse-instrument</div></div>'
      +(!isKoper()&&!isVerkoper()?'<button class="btn-gen" id="gen-btn" '+(aiLoad?'disabled':'')+'>'+(aiLoad?'<div class="spin"></div> Genereren...':aiText&&aiText!=='__ERROR__'?'Opnieuw':'Genereer advies')+'</button>':'')

        +'<div style="display:flex;justify-content:flex-end;margin-top:.5rem">'
        +'<button id="qa-btn-'+f.id+'" class="btn btn-sm" style="background:var(--gold);font-size:12px">Vraag stellen</button>'
        +'</div></div>':'')
      +'</div>';
  }
  var nav='<div class="fase-nav">'
    +(isVerkoper()?'<button class="btn-ghost btn-sm" id="cover-btn">&#128196; Cover letter</button>':'')
    +(S.fase>0?'<button class="btn-ghost btn-sm" id="prev-btn">&#8592; Vorige</button>':'')
    +'<div style="flex:1"></div>'
    +(!isKoper()&&!vergrendeld?'<button class="btn-ghost btn-sm" id="opslaan-btn" style="color:var(--teal);border-color:var(--teal)">&#128190; Opslaan</button>':'')
    +(isVerkoper()&&!vergrendeld?(function(){
        var fid=FASES[S.fase].id;
        var isAfgerond=S.faseStatus&&S.faseStatus[fid]&&S.faseStatus[fid].afgerond;
        var fp=fillPct(fid);
        if(isAfgerond){
          return '<button class="btn btn-sm" id="fase-heropen-btn" style="background:var(--muted);font-size:11px">&#10003; Afgerond — Heropenen</button>';
        } else if(fp>=50){
          return '<button class="btn btn-sm" id="fase-afronden-btn" style="background:var(--gold);font-size:11px">&#10003; Fase afronden</button>';
        }
        return '';
      })():'')
    +'<button class="btn-ghost btn-sm" id="sum-btn">Overzicht</button>'
    +(S.fase<FASES.length-1?'<button class="btn btn-sm" id="next-btn">Volgende &#8594;</button>':'<button class="btn btn-sm" id="sum-btn2">Afronden &#10003;</button>')
    +'</div>';

  var lockedBanner=vergrendeld?'<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red)">&#128274; <strong>Dit traject is vergrendeld.</strong> U kunt geen wijzigingen meer doorvoeren.</div>':'';

  return '<div class="wrap anim">'
    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; M&amp;A'+versieLabel()+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="font-size:11px;color:var(--muted)">'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'</span>'

    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1rem">Verplichte velden ingevuld: <span style="font-family:IBM Plex Mono,monospace;font-weight:600;color:'+(tp===100?'var(--teal)':tp>50?'var(--gold)':'var(--red)')+'">'+tp+'%</span><span style="font-size:11px;color:var(--muted);margin-left:6px">(alle 7 fases)</span></div>'

function renderSummary(){
  var missing=getMissing();
  var vergrendeld=S.traject&&S.traject.status==='vergrendeld';
  var completeFases=FASES.filter(function(f){return fillPct(f.id)===100;});
  var incompleteFases=FASES.filter(function(f){return fillPct(f.id)<100;});

  // ── KRITIEKE DISCREPANTIE-CHECK (geen API, puur rekenen) ────────────────
  var kritiekeDiscrepanties=[];

  function parseGeldCheck(v){
    if(!v)return null;
    var n=String(v).replace(/[^0-9,.]/g,'').replace(',','.');
    var parsed=parseFloat(n);
    return isNaN(parsed)?null:parsed;
  }

  var o1=parseGeldCheck(S.data['financieel_omzet1']);
  var o2=parseGeldCheck(S.data['financieel_omzet2']);
  var o3=parseGeldCheck(S.data['financieel_omzet3']);
  var ebitdaAbs=parseGeldCheck(S.data['financieel_ebitda']);
  var ebitdaMarge=parseGeldCheck(S.data['financieel_ebitdaMarge']);
  var partnerBel=parseGeldCheck(S.data['financieel_partnerBel']);

  // 1. Ontbrekende kritieke financiële velden
  if(!o1||!o2||!o3) kritiekeDiscrepanties.push('Jaaromzet voor alle drie jaren is verplicht voor een indicatieve waardering. Vul omzet jaar 1, 2 en 3 in.');
  if(!ebitdaAbs&&!ebitdaMarge) kritiekeDiscrepanties.push('EBITDA ontbreekt volledig (zowel absoluut als marge). Dit is de basis voor de waarderingsberekening.');
  if(!partnerBel) kritiekeDiscrepanties.push('Partnerbeloning ontbreekt. Zonder dit gegeven kan de EBITDA niet genormaliseerd worden.');

  // 2. EBITDA-marge buiten realistisch bereik
  if(ebitdaMarge!==null){
    if(ebitdaMarge<0) kritiekeDiscrepanties.push('EBITDA-marge is negatief ('+ebitdaMarge+'%). Een verlieslatend kantoor kan niet gewaardeerd worden zonder toelichting. Controleer de invoer.');
    if(ebitdaMarge>50) kritiekeDiscrepanties.push('EBITDA-marge is '+ebitdaMarge+'% — onrealistisch hoog voor de sector (norm 15-25%). Controleer of het percentage correct is ingevoerd (niet als decimaal 0.168 in plaats van 16.8%).');
  }

  // 3. Consistentiecheck EBITDA-absoluut vs marge × omzet
  if(o3&&ebitdaAbs&&ebitdaMarge){
    var berekendEbitda=o3*(ebitdaMarge/100);
    var afwijking=Math.abs(berekendEbitda-ebitdaAbs)/ebitdaAbs;
    if(afwijking>0.15){
      kritiekeDiscrepanties.push(
        'EBITDA-inconsistentie: EBITDA absoluut ('+ebitdaAbs.toLocaleString('nl-NL')+') wijkt meer dan 15% af van '
        +'marge × omzet ('+ebitdaMarge+'% × '+o3.toLocaleString('nl-NL')+' = '+Math.round(berekendEbitda).toLocaleString('nl-NL')+'). '
        +'Controleer of absoluut bedrag en percentage bij hetzelfde boekjaar horen.'
      );
    }
  }

  // 4. Onverklaarbare omzetsprong (>50% jaar op jaar)
  if(o1&&o2){
    var groei12=((o2-o1)/o1)*100;
    if(Math.abs(groei12)>50) kritiekeDiscrepanties.push(
      'Omzetgroei jaar 1→2 is '+Math.round(groei12)+'% — ongebruikelijk groot. '
      +'Controleer of de juiste jaren zijn ingevoerd of voeg een toelichting toe.'
    );
  }
  if(o2&&o3){
    var groei23=((o3-o2)/o2)*100;
    if(Math.abs(groei23)>50) kritiekeDiscrepanties.push(
      'Omzetgroei jaar 2→3 is '+Math.round(groei23)+'% — ongebruikelijk groot. '
      +'Controleer of de juiste jaren zijn ingevoerd of voeg een toelichting toe.'
    );
  }

  // 5. Dalende omzettrend (jaar 3 < jaar 1) zonder toelichting
  if(o1&&o3&&o3<o1){
    kritiekeDiscrepanties.push(
      'Omzet jaar 3 ('+o3.toLocaleString('nl-NL')+') is lager dan omzet jaar 1 ('+o1.toLocaleString('nl-NL')+'). '
      +'Een dalende trend vereist een toelichting in de notitie van fase Strategisch voordat het dossier kan worden vrijgegeven.'
    );
  }

  // 6. Partnerbeloning hoger dan EBITDA (normalisatie-probleem)
  if(partnerBel&&ebitdaAbs&&partnerBel>ebitdaAbs){
    kritiekeDiscrepanties.push(
      'Partnerbeloning ('+partnerBel.toLocaleString('nl-NL')+') is hoger dan EBITDA absoluut ('+ebitdaAbs.toLocaleString('nl-NL')+'). '
      +'Dit leidt tot een negatieve genormaliseerde EBITDA en maakt waardering onmogelijk. Controleer de invoer.'
    );
  }

  var heeftKritiek=kritiekeDiscrepanties.length>0;
  // ── EINDE CHECK ─────────────────────────────────────────────────────────

  // Summary cards
  var cards='';
  FASES.forEach(function(f){
    var p=isVerkoper()?fillPct(f.id):pct(f.id);
    var dataRows='';
    f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataRows+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">'+df.label+(df.req?' *':'')+'</span><span style="font-family:IBM Plex Mono,monospace;font-size:11px">'+esc(v)+(r?' <span style="color:var(--gold)">&#128196;'+esc(r)+'</span>':'')+'</span></div>';else if(df.req)dataRows+='<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--red)">&#9888; '+df.label+': niet ingevuld</div>';});
    var rfHits=f.redflags.filter(function(_,i){return S.checked[f.id+'_rf_'+i];});
    cards+='<div class="panel" style="border-color:'+(p===100?'var(--teal)':'var(--border)')+'"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between"><span>'+(isVerkoper()?'':f.num+'. ')+f.title+'</span><span style="color:'+(p===100?'var(--teal)':p>50?'var(--gold)':'var(--red)')+'">'+p+'%</span></div>'

async function finaleCheck(){
  var btn=ge('finale-check-btn');
  var out=ge('finale-check-out');
  if(!btn||!out)return;
  btn.disabled=true;btn.textContent='Bezig...';
  out.innerHTML='<div style="color:var(--muted);font-size:13px;padding:1rem;background:var(--card);border-radius:var(--r)">Analyse loopt... (20-40 sec)</div>';

  // Alleen fase-1 velden — relevant voor indicatieve waardering, niet de volledige fase-2 DD
  var veldenSamenvatting='';
  FASES.forEach(function(f){
    var gevuld=f.dataFields.filter(function(df){
      return !df.header && df.fase==='1' && (S.data[f.id+'_'+df.id]||'').trim();
    });
    if(gevuld.length){
      veldenSamenvatting+='\n'+f.num+'. '+f.title+'\n';
      gevuld.forEach(function(df){veldenSamenvatting+='  '+df.label+': '+S.data[f.id+'_'+df.id]+'\n';});
    }
  });

  var docNamen=[];
  Object.keys(DOCS).forEach(function(faseId){
    (DOCS[faseId]||[]).filter(function(d){return !d.uploading&&!d.verworpen;}).forEach(function(d){
      docNamen.push(d.naam);
    });
  });

  if(!docNamen.length){
    out.innerHTML='<div style="color:var(--gold);font-size:13px;padding:.75rem;background:var(--gold-bg);border-radius:var(--r);border:1px solid var(--gold)">⚠ Geen documenten geüpload.</div>';
    btn.disabled=false;btn.textContent='&#9881; Voer finale check uit';
    return;
  }

  var prompt='Je bent een M&A-adviseur die beoordeelt of de basisinformatie klopt voor een indicatieve waardering.\n\n'
    +'Kantoor: '+esc(S.traject&&S.traject.kantoor_naam||S.code)+'\n'
    +'Geüploade documenten: '+docNamen.join(', ')+'\n\n'
    +'INGEVULDE BASISVELDEN (fase 1 — pre-LoI):\n'+veldenSamenvatting+'\n\n'
    +'Beoordeel uitsluitend of de ingevulde basisvelden intern consistent zijn en voldoende zijn voor een indicatieve waardering. '
    +'NIET beoordelen: ontbrekende fase-2 DD-documenten, arbeidscontracten, debiteurenadministratie, huurcontracten — die zijn pas relevant na de LoI.\n\n'
    +'Schrijf maximaal 3 korte alineas in gewoon Nederlands:\n'
    +'1. Wat klopt en consistent is (noem de cijfers)\n'
    +'2. Wat afwijkt of intern inconsistent is (maximaal 2 punten)\n'
    +'3. Eén zin eindoordeel: zijn de basisvelden voldoende voor een indicatieve waardering?\n\n'
    +'Geen tabellen, geen lijsten, geen pipe-tekens. Maximaal 200 woorden.';

  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1000})});
    var rd=await resp.json();
    var tekst=(rd.text||'Fout bij genereren.')
      .replace(/## ([^\n]+)/g,'<h3 style="font-family:Playfair Display,serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem">$1</h3>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      // Verwijder eventuele pipe-tabellen
      .replace(/^\|[-| ]+\|$/gm,'')
      .replace(/^\|.+\|$/gm,function(line){
        return line.replace(/^\||\|$/g,'').split('|').map(function(s){return s.trim();}).filter(Boolean).join(' — ');
      })
      .split('\n\n').map(function(p){
        p=p.trim();
        if(!p)return '';
        if(p.charAt(0)==='<')return p;
        return '<p style="font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:.75rem">'+p.replace(/\n/g,'<br>')+'</p>';
      }).join('');
    out.innerHTML='<div style="padding:.5rem 0">'+tekst+'</div>';
  }catch(e){
    out.innerHTML='<div style="color:var(--red);font-size:13px">Fout: '+e.message+'</div>';
  }
  btn.disabled=false;btn.textContent='&#9881; Opnieuw';
}

async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  saveCurrent();S.aiLoading[faseId]=true;renderApp();
  var dataLines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataLines.push(df.label+': '+v+(r?' (doc: '+r+')':''));});
  var chk=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var open=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfs=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var sectorProfiel=getSectorProfiel();
  var sectorLabel=sectorProfiel.label||'MKB';
  var sectorNormen=sectorProfiel.aiNormen||'';
  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur. Sector: '+sectorLabel+'. Traject: '+esc(S.traject&&S.traject.traject_type||'M&A')+' voor "'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'".\n\nSECTOR NORMEN:\n'+sectorNormen+'\n\nFASE: '+f.title+'\n\nINGEVOERDE DATA:\n'+(dataLines.join('\n')||'Geen data')+'\n\nCHECKLIST:\nGereed: '+(chk.join(', ')||'niets')+'\nOpen: '+(open.join(', ')||'alles gereed')+'\n\nRODE VLAGGEN: '+(rfs.join(', ')||'geen')+'\n\nNOTITIES: '+(S.notities[faseId]||'geen')+'\n\nGeef beknopt strategisch advies voor deze sector. Analyseer de cijfers expliciet en vergelijk met de sectorgemiddelden hierboven. Bespreek: voortgang en prioriteiten, urgente openstaande punten, impact rode vlaggen, concrete vervolgstappen. Schrijf in ik-vorm. Gebruik ## koppen. Geen tabellen of bullets.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();var dec=new TextDecoder();var collected='';
    while(true){var res=await reader.read();if(res.done)break;dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}}});}
    S.aiTexts[faseId]=collected;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

var CHAT = {
  open: false,
  berichten: [],
  serverBerichten: [],
  laden: false,
  sturen: false,
  unread: 0
};

function chatContextBeschrijving() {
  var ctx = 'Traject: ' + (S.traject && S.traject.kantoor_naam || S.code);
  ctx += ' | Rol: ' + (isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper');
  if (S.screen === 'main') {
    var f = FASES[S.fase];
    if (f) {
      ctx += ' | Fase: ' + f.num + '. ' + f.title;
      var leeg = f.dataFields.filter(function(df) { return df.req && !df.header && !(S.data[f.id+'_'+df.id]||'').trim(); });
      if (leeg.length) ctx += ' | Nog leeg: ' + leeg.map(function(df){return df.label;}).join(', ');
      var gevuld = f.dataFields.filter(function(df) { return !df.header && (S.data[f.id+'_'+df.id]||'').trim(); });
      if (gevuld.length) ctx += ' | Ingevuld: ' + gevuld.map(function(df){return df.label+'='+S.data[f.id+'_'+df.id];}).join(', ');
    }
  }
  ctx += ' | Totaal: ' + totalFillPct() + '%';
  return ctx;
}

async function chatLaadBerichten() {
  if (!S.code) return;
  try {
    var resp = await fetch(WORKER + '/mna/chat/' + S.code);
    if (!resp.ok) return;
    var d = await resp.json();
    if (d.berichten) {
      CHAT.serverBerichten = d.berichten;
      var nieuweUnread = 0;
      d.berichten.forEach(function(b) {
        if (isVerkoper() && b.auteur === 'begeleider' && !b.gelezen) nieuweUnread++;
        if (isTussen() && b.auteur === 'verkoper' && !b.gelezen) nieuweUnread++;
      });
      if (!CHAT.open && nieuweUnread > CHAT.unread) {
        CHAT.unread = nieuweUnread;
        chatUpdateBadge();
      }
    }
  } catch(e) {}
}

async function chatVerstuur(tekst) {
  if (!tekst.trim() || CHAT.sturen) return;
  CHAT.sturen = true;
  var auteur = isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper';
  var naamLabel = isVerkoper() ? (S.traject && S.traject.contact_naam || 'Verkoper') : isTussen() ? (S.traject && S.traject.begeleider_naam || 'Begeleider') : 'Koper';
  var userMsg = { auteur: auteur, naam: naamLabel, tekst: tekst, ts: Date.now(), lokaal: true };
  CHAT.berichten.push(userMsg);
  chatRenderBerichten();
  try {
    await fetch(WORKER + '/mna/chat/' + S.code, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auteur: auteur, naam: naamLabel, tekst: tekst })
    });
  } catch(e) {}
  if (isVerkoper()) {
    CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: '...', ts: Date.now(), typing: true });
    chatRenderBerichten();
    var sp2=getSectorProfiel();var systeemPrompt = 'Je bent een vriendelijke assistent voor een M&A due diligence platform. Sector: '+(sp2.label||'MKB')+'. Je helpt de eigenaar/verkoper bij het invullen van het due diligence formulier. Sectorgemiddelden: '+(sp2.aiNormen||'')+'. Geef korte, praktische antwoorden in het Nederlands. CONTEXT: ' + chatContextBeschrijving();
    var msgs = [];
    var allB = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal&&!b.typing;}));
    allB.slice(-8).forEach(function(b) {
      if (b.auteur === 'verkoper') msgs.push({ role: 'user', content: b.tekst });
      else if (b.auteur === 'ai') msgs.push({ role: 'assistant', content: b.tekst });
    });
    try {
      var resp = await fetch(WORKER + '/ai', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: systeemPrompt, messages: msgs, max_tokens: 400 })
      });
      var rd = await resp.json();
      var antwoord = rd.text || 'Sorry, er ging iets mis.';
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      var aiMsg = { auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord, ts: Date.now(), lokaal: true };
      CHAT.berichten.push(aiMsg);
      fetch(WORKER + '/mna/chat/' + S.code, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord })
      }).catch(function(){});
    } catch(e) {
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: 'Verbindingsfout. Probeer opnieuw.', ts: Date.now() });
    }
    chatRenderBerichten();
  }
  CHAT.sturen = false;
}

function chatRenderBerichten() {
  var lijst = document.getElementById('chat-berichten');
  if (!lijst) return;
  var alleBerichten = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal;}));
  var gezien = {};
  alleBerichten = alleBerichten.filter(function(b){
    var k = b.auteur + '|' + b.tekst + '|' + (b.ts||'');
    if (gezien[k]) return false; gezien[k] = true; return true;
  });
  alleBerichten.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  if (!alleBerichten.length) {
    lijst.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:2rem 1rem">' + (isVerkoper() ? '\uD83D\uDC4B Hallo! Ik help u graag bij het invullen. Stel gerust een vraag.' : 'Nog geen berichten.') + '</div>';
    return;
  }
  lijst.innerHTML = alleBerichten.map(function(b) {
    var isEigen = (isVerkoper() && b.auteur === 'verkoper') || (isTussen() && b.auteur === 'begeleider');
    var isAI = b.auteur === 'ai';
    var isBeg = b.auteur === 'begeleider';
    var dt = b.ts ? new Date(b.ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '';
    var bg = isEigen ? 'var(--teal)' : isAI ? 'var(--card)' : isBeg ? '#f3f0ff' : 'var(--card)';
    var kleur = isEigen ? '#fff' : 'var(--sub)';
    var align = isEigen ? 'flex-end' : 'flex-start';
    var border = isAI ? '1px solid var(--border)' : isBeg ? '1px solid #c8b8f0' : 'none';
    var naamKleur = isAI ? 'var(--teal)' : isBeg ? '#7c5cbf' : 'var(--muted)';
    var naamHtml = isEigen ? '' : '<div style="font-size:10px;font-weight:600;color:'+naamKleur+';margin-bottom:3px">' + (b.naam||b.auteur) + '</div>';
    var radius = isEigen ? '12px 12px 2px 12px' : '12px 12px 12px 2px';
    if (b.typing) return '<div style="display:flex;justify-content:flex-start;margin-bottom:8px"><div style="background:var(--card);border:1px solid var(--border);border-radius:'+radius+';padding:8px 14px;max-width:80%">'+naamHtml+'<div style="display:flex;gap:4px;align-items:center;height:18px"><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite 0s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .2s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .4s"></div></div></div></div>';
    var tekstHtml = String(b.tekst||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    return '<div style="display:flex;justify-content:'+align+';margin-bottom:8px"><div style="background:'+bg+';border:'+border+';border-radius:'+radius+';padding:8px 12px;max-width:82%;word-break:break-word">'+naamHtml+'<div style="font-size:13px;color:'+kleur+';line-height:1.55">'+tekstHtml+'</div>'+(dt?'<div style="font-size:10px;color:'+(isEigen?'rgba(255,255,255,.6)':'var(--muted)')+';margin-top:3px;text-align:right">'+dt+'</div>':'')+'</div></div>';
  }).join('');
  lijst.scrollTop = lijst.scrollHeight;
}

function chatUpdateBadge() {
  var badge = document.getElementById('chat-badge');
  if (!badge) return;
  if (CHAT.unread > 0) { badge.style.display = 'flex'; badge.textContent = CHAT.unread > 9 ? '9+' : String(CHAT.unread); }
  else badge.style.display = 'none';
}

function chatOpen() {
  CHAT.open = true; CHAT.unread = 0; chatUpdateBadge();
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'flex';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'none';
  chatLaadBerichten().then(function(){ chatRenderBerichten(); });
  setTimeout(function(){ var inp = document.getElementById('chat-input'); if (inp) inp.focus(); }, 100);
}

function chatSluit() {
  CHAT.open = false;
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'none';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'flex';
}

window.chatStuurVanInput = function() {
  var inp = document.getElementById('chat-input'); if (!inp) return;
  var tekst = inp.value.trim(); if (!tekst) return;
  inp.value = ''; inp.style.height = 'auto';
  chatVerstuur(tekst);
};

  if (!document.getElementById('chat-style')) {

    st.textContent = '@keyframes chatdot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}';
    document.head.appendChild(st);
  }
  var headerTitel = isVerkoper() ? '&#128172; Assistent & Begeleider' : isTussen() ? '&#128172; Chat met verkoper' : '&#128172; Chat';
  var placeholder = isVerkoper() ? 'Stel een vraag...' : 'Stuur een bericht...';
  var container = document.createElement('div'); container.id = 'chat-container';
  container.innerHTML =
    '<div id="chat-fab" style="position:fixed;bottom:24px;right:24px;z-index:500;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--teal);box-shadow:0 4px 16px rgba(0,0,0,.2);cursor:pointer" onclick="chatOpen()">'
    +'<span style="font-size:22px">&#128172;</span>'
    +'<div id="chat-badge" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;border:2px solid #fff"></div>'
    +'</div>'
    +'<div id="chat-venster" style="display:none;position:fixed;bottom:24px;right:24px;z-index:500;width:360px;height:500px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);box-shadow:0 8px 32px rgba(0,0,0,.18);flex-direction:column;overflow:hidden">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--teal);color:#fff">'
    +'<div style="font-size:13px;font-weight:600">'+headerTitel+'</div>'
    +'<button onclick="chatSluit()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;line-height:1">&times;</button>'
    +'</div>'
    +'<div id="chat-berichten" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column"></div>'
    +'<div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end">'
    +'<textarea id="chat-input" placeholder="'+placeholder+'" rows="1" style="flex:1;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);outline:none;resize:none;max-height:80px;line-height:1.5"></textarea>'
    +'<button onclick="chatStuurVanInput()" style="background:var(--teal);border:none;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px;flex-shrink:0">&#8593;</button>'
    +'</div></div>';
  document.body.appendChild(container);
  var inp = document.getElementById('chat-input');
  if (inp) {
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatStuurVanInput();} });
    inp.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,80)+'px'; });
  }
  chatLaadBerichten().then(function(){ if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge(); });
  if (isVerkoper()) {
    clearInterval(window._chatPollInterval);
    window._chatPollInterval = setInterval(function(){
      if (S.code && S.screen !== 'login') chatLaadBerichten().then(function(){
        if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge();
      });
    }, 15000);
  }
}

// Wrap renderApp zodat chat altijd herinitialiseerd wordt
var _origRenderApp = renderApp;
renderApp = function() { _origRenderApp(); chatInit(); };

</script>
</body>
</html>
