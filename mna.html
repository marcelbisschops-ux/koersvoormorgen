      +(S.loiGetekend?'<div style="font-size:11px;padding:4px 10px;border-radius:12px;background:var(--gold-bg);border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;gap:4px">&#10003; Getekend door '+esc(S.loiGetekend)+'</div>':(!isAdmin()?'<button id="loi-teken-btn" class="btn-ghost" style="font-size:12px;border-color:var(--gold);color:var(--gold)">&#9998; Akkoord &amp; onderteken</button>':''))
      +'</div></div>':'')
    +'<div id="partij-docs-sectie" style="margin-top:1.5rem"></div>'
    +(isVerkoper()?'<button class="btn" id="to-main-btn2" style="width:100%;margin-top:1rem">Start met invullen &#8594;</button>':'')
    +'</div>';
}

function renderMain(){
  var f=FASES[S.fase];
  var tp=isVerkoper()?totalFillPct():Math.round(FASES.reduce(function(a,fase){return a+pct(fase.id);},0)/FASES.length);
  var vergrendeld=S.traject&&S.traject.status==='vergrendeld';
  var isRO=isKoper()||vergrendeld;

  var ov='<div class="fase-grid">';
  FASES.forEach(function(fase,i){
    var p=isVerkoper()?fillPct(fase.id):pct(fase.id);
    ov+='<div class="fase-card'+(S.fase===i?' active':'')+'" data-fi="'+i+'">'
      +'<div class="fase-num">'+fase.num+'</div>'
      +'<div class="fase-name">'+fase.title+'</div>'
      +'<div class="fase-bar"><div class="fase-fill" style="width:'+p+'%;background:'+(p===100?'var(--teal)':p>50?'var(--gold)':'var(--red)')+'"></div></div>'
      +'<div class="fase-pct">'+p+'%</div>'
      +'</div>';
  });
  ov+='</div>';

  // Data fields
  var dataHtml='<div class="panel"><div class="sec-hdr">Informatie invullen</div>';
  var instrTxt=isVerkoper()?'<div style="font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)">Vul de velden in. Upload rechts de relevante documenten &mdash; velden worden automatisch ingelezen zolang het boekjaar in het document staat. Controleer alle automatisch ingevulde waarden. De ge&uuml;ploade documenten dienen als grondslag voor de due diligence. Ontbrekende velden vult u zelf in.</div>':'';
  dataHtml+=instrTxt+'<div class="data-grid">';
  f.dataFields.forEach(function(df){
    if(df.header){
      dataHtml+='</div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:1.25rem 0 .6rem;padding-top:1rem;border-top:1px solid var(--border);grid-column:1/-1">'+df.label+'</div><div class="data-grid">';
      return;
    }
    var val=S.data[f.id+'_'+df.id]||'';
    var missing=S.showValidation&&df.req&&!val.trim();
    // Check of dit veld een openstaand conflict heeft
    var hasConflict=S._pendingConflicts&&S._pendingConflicts[f.id+'_'+df.id];
    dataHtml+='<div>';
    if(isRO){
      dataHtml+='<div class="f"><label>'+df.label+(df.req?' <span class="req">*</span>':'')+(df.doc?' &#128196;':'')+'</label>'
        +'<div class="readonly-val'+(val?'':' empty')+'">'+(val?esc(val):'Niet ingevuld')+(ref?'<span style="color:var(--gold);font-size:11px;margin-left:8px">&#128196; '+esc(ref)+'</span>':'')+'</div></div>';
    }else{
      var conflictStyle=hasConflict?'border-color:var(--gold);background:#fffbf0':'';
      var conflictTitle=hasConflict?(' title="Document zegt: '+esc(hasConflict)+'"'):'';
      dataHtml+='<div class="f"><label>'+df.label+(df.req?' <span class="req">*</span>':'')+(df.doc?' <span style="color:var(--gold);font-size:9px">&#128196; ref</span>':'')
        +(hasConflict?' <span style="color:var(--gold);font-size:9px;font-weight:600" title="Document geeft andere waarde: '+esc(hasConflict)+'">&#9888; afwijking</span>':'')+'</label>'
        +'<input type="text" id="df_'+df.id+'" value="'+esc(val)+'" placeholder="'+esc(df.ph)+'" class="'+(missing?'missing':'')+'" style="'+conflictStyle+'"'+conflictTitle+' oninput="userEdit(this)"></div>';
    }
    dataHtml+='</div>';
  });
  dataHtml+='</div>'+(S.showValidation&&getMissing().find(function(m){return m.fase.startsWith(f.num);})
    ?'<div style="font-size:12px;color:var(--red);margin-top:.5rem">&#9888; Vul alle verplichte velden (*) in voor een volledig beeld.</div>':'')+'</div>';

  // Marcel-only: checklist + rode vlaggen + notities + AI
  var extraHtml='';
  // Toon koper reactie voor tussenpersoon en Marcel
  if(isTussen()||(!isVerkoper()&&!isKoper())){
    var kReactie=S.koperReacties&&S.koperReacties[f.id];
    if(kReactie){
      extraHtml='<div class="panel" style="border-color:var(--gold);margin-bottom:1rem">'
        +'<div class="sec-hdr" style="color:var(--gold)">&#128172; Koper opmerking</div>'
        +'<div style="font-size:13px;color:var(--mid);line-height:1.7;font-style:italic;padding:.75rem;background:var(--gold-bg);border-radius:var(--r)">'+esc(kReactie)+'</div>'
        +'</div>';
    }
  }
  if(!isVerkoper()){
    var chkHtml='<div class="panel"><div class="sec-hdr">Checklist (intern)</div>';
    f.items.forEach(function(item,i){var key=f.id+'_'+i;var on=!!S.checked[key];chkHtml+='<div class="chk-item'+(on?' on':'')+'" data-key="'+key+'"'+(isKoper()?' style="cursor:default"':'')+'><div class="chk-box">'+(on?'&#10003;':'')+'</div><div class="chk-lbl">'+item+'</div></div>';});
    chkHtml+='<div class="sec-hdr" style="margin-top:1rem;color:var(--red)">Rode vlaggen &mdash; gesignaleerd?</div>';
    f.redflags.forEach(function(rf,i){var key=f.id+'_rf_'+i;var on=!!S.checked[key];chkHtml+='<div class="chk-item rf'+(on?' on':'')+'" data-key="'+key+'"'+(isKoper()?' style="cursor:default"':'')+'><div class="chk-box">'+(on?'&#10003;':'')+'</div><div class="chk-lbl">'+rf+'</div></div>';});
    chkHtml+='</div>';
    // Keuzelog: toon gemaakte keuzes bij conflicten voor deze fase
    var faseChoices=(S._choiceLog||[]).filter(function(c){return c.key.startsWith(f.id+'_');});
    var choiceLogHtml='';
    if(faseChoices.length){
      choiceLogHtml='<div style="margin-top:.75rem;padding:.6rem .75rem;background:#fffbf0;border:1px solid var(--gold);border-radius:var(--r);font-size:11px">'
        +'<div style="font-weight:600;color:var(--gold);margin-bottom:.4rem">&#128221; Gemaakte keuzes bij conflicten</div>'
        +faseChoices.map(function(c){
          return '<div style="padding:3px 0;border-bottom:1px solid var(--border);color:var(--mid)">'
            +'<strong>'+esc(c.label)+'</strong>: gekozen <strong style="color:'+(c.gekozen==='document'?'var(--teal)':'var(--sub)')+'">'+esc(c.waarde)+'</strong>'
            +' <span style="color:var(--muted)">('+esc(c.gekozen==='document'?'uit '+c.bron:'handmatig ingevoerd')+')</span>'
            +(c.verworpen?' &mdash; verworpen: <span style="text-decoration:line-through;color:var(--muted)">'+esc(c.verworpen)+'</span>':'')
            +' <span style="color:var(--muted);font-size:10px">'+esc(c.ts)+'</span>'
            +'</div>';
        }).join('')
        +'</div>';
    }
    var notHtml='<div class="panel"><div class="sec-hdr">Notities (intern)</div>'
      +((isKoper())?'<div style="font-size:13px;color:var(--mid);font-style:italic">'+(S.notities[f.id]||'Geen notities.')+'</div>'
        :'<textarea id="notitie_'+f.id+'" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);resize:vertical;min-height:70px;outline:none" placeholder="Interne bevindingen en aandachtspunten..." oninput="schedSave()">'+(S.notities[f.id]||'')+'</textarea>')
      +'<div style="display:flex;align-items:center;gap:.75rem;margin-top:.3rem"><div style="font-size:11px;color:var(--muted)">'+(isKoper()?'':'Wijzigingen worden automatisch opgeslagen.')+'</div><div id="save-ind" class="save-indicator">&#10003; Opgeslagen</div></div>'
      +choiceLogHtml
      +'</div>';
    var aiText=S.aiTexts[f.id];var aiLoad=S.aiLoading[f.id];
    var aiBodyHtml;
    if(aiLoad)aiBodyHtml='<div style="display:flex;align-items:center;gap:8px;color:var(--mid);font-size:13px"><div class="spin" style="border-color:var(--border2);border-top-color:var(--teal);width:14px;height:14px;border-width:2px"></div>Genereren...</div>';
    else if(!aiText)aiBodyHtml='<div style="color:var(--muted);font-size:13px">Klik op Genereer advies voor een analyse op basis van de ingevulde data, checklist en notities.</div>';
    else if(aiText==='__ERROR__')aiBodyHtml='<div style="color:var(--red);font-size:13px">Verbindingsfout. Probeer opnieuw.</div>';
    else{var h=aiText.replace(/## ([^\n]+)/g,function(_,t){return '<h3>'+t+'</h3>';});h=h.replace(/\*\*([^*]+)\*\*/g,function(_,t){return '<strong>'+t+'</strong>';});h=h.split('\n\n').map(function(p){return p.trim()&&p.charAt(0)!=='<'?'<p>'+p+'</p>':p;}).join('');aiBodyHtml=h;}
    var aiHtml='<div class="ai-panel"><div class="ai-hdr"><div><div class="ai-title">AI-advies: '+f.title+'</div><div class="ai-sub">Intern analyse-instrument</div></div>'
      +(!isKoper()&&!isVerkoper()?'<button class="btn-gen" id="gen-btn" '+(aiLoad?'disabled':'')+'>'+(aiLoad?'<div class="spin"></div> Genereren...':aiText&&aiText!=='__ERROR__'?'Opnieuw':'Genereer advies')+'</button>':'')
      +'</div><div class="ai-body">'+aiBodyHtml+'</div></div>';
    extraHtml=chkHtml+notHtml+aiHtml;
  }

  // Q&A module (koper stelt vragen, iedereen ziet antwoorden)
  if(isKoper()||isTussen()){
    extraHtml+='<div class="panel" style="border-color:var(--gold)" id="qa-panel-'+f.id+'">'
      +'<div class="sec-hdr" style="color:var(--gold)">&#10067; Q&A — vragen &amp; antwoorden</div>'
      +'<div id="qa-lijst-'+f.id+'" style="margin-bottom:1rem"><div style="font-size:12px;color:var(--muted);font-style:italic">Laden...</div></div>'
      +(isKoper()?'<div style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.5rem">'
        +'<div style="font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">Stel een vraag</div>'
        +'<textarea id="qa-input-'+f.id+'" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);resize:vertical;min-height:70px;outline:none" placeholder="Typ uw vraag over deze fase..."></textarea>'
        +'<div style="display:flex;justify-content:flex-end;margin-top:.5rem">'
        +'<button id="qa-btn-'+f.id+'" class="btn btn-sm" style="background:var(--gold);font-size:12px">Vraag stellen</button>'
        +'</div></div>':'')
      +'</div>';
  }
  var nav='<div class="fase-nav">'
    +(isVerkoper()?'<button class="btn-ghost btn-sm" id="cover-btn">&#128196; Cover letter</button>':'')
    +(S.fase>0?'<button class="btn-ghost btn-sm" id="prev-btn">&#8592; Vorige</button>':'')
    +'<div style="flex:1"></div>'
    +(!isKoper()&&!vergrendeld?'<button class="btn-ghost btn-sm" id="opslaan-btn" style="color:var(--teal);border-color:var(--teal)">&#128190; Opslaan</button>':'')
    +'<button class="btn-ghost btn-sm" id="sum-btn">Overzicht</button>'
    +(S.fase<FASES.length-1?'<button class="btn btn-sm" id="next-btn">Volgende &#8594;</button>':'<button class="btn btn-sm" id="sum-btn2">Afronden &#10003;</button>')
    +'</div>';

  var lockedBanner=vergrendeld?'<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red)">&#128274; <strong>Dit traject is vergrendeld.</strong> U kunt geen wijzigingen meer doorvoeren.</div>':'';

  return '<div class="wrap anim">'
    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; M&amp;A'+versieLabel()+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="font-size:11px;color:var(--muted)">'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'</span>'
    +'<button class="btn-ghost btn-sm" onclick="window.print()">PDF</button>'
    +'</div></div>'
    +lockedBanner

async function finaleCheck(){

  btn.disabled=true;btn.textContent='Bezig met controleren...';
  out.innerHTML='<div style="color:var(--muted);font-size:13px;padding:1rem;background:var(--card);border-radius:var(--r)">AI vergelijkt velden met documenten... (20-40 sec)</div>';

  // Bouw overzicht van alle ingevulde velden
  var veldenSamenvatting='';
  FASES.forEach(function(f){
    var gevuld=f.dataFields.filter(function(df){return !df.header&&(S.data[f.id+'_'+df.id]||'').trim();});
    if(gevuld.length){
      veldenSamenvatting+='\n## '+f.num+'. '+f.title+'\n';
      gevuld.forEach(function(df){veldenSamenvatting+='- '+df.label+': '+S.data[f.id+'_'+df.id]+'\n';});
    }
  });

  // Bouw overzicht van alle geüploade documenten en hun analyses
  var docSamenvatting='';
  Object.keys(DOCS).forEach(function(faseId){
    var docs=(DOCS[faseId]||[]).filter(function(d){return !d.uploading&&!d.verworpen&&d.analyse;});
    if(docs.length){
      var faseNaam=FASES.find(function(f){return f.id===faseId;});
      docSamenvatting+='\n## '+(faseNaam?faseNaam.num+'. '+faseNaam.title:faseId)+'\n';
      docs.forEach(function(d){
        docSamenvatting+='Document: '+d.naam+'\n';

    }

  if(!docSamenvatting){
    out.innerHTML='<div style="color:var(--gold);font-size:13px;padding:.75rem;background:var(--gold-bg);border-radius:var(--r);border:1px solid var(--gold)">⚠ Geen documenten geüpload — finale check vereist minimaal één geüpload document per fase.</div>';
    btn.disabled=false;btn.textContent='&#9881; Voer finale check uit';
    return;
  }

  var prompt='Je bent een forensische M&A-auditor voor een accountantskantoor due diligence.\n\n'
    +'Traject: '+esc(S.traject&&S.traject.kantoor_naam||S.code)+'\n\n'
    +'INGEVULDE VELDEN:\n'+veldenSamenvatting+'\n\n'
    +'AANGELEVERDE DOCUMENTEN EN ANALYSES:\n'+docSamenvatting+'\n\n'
    +'Voer een finale cross-check uit:\n'
    +'1. Welke ingevulde velden worden BEVESTIGD door documenten?\n'
    +'2. Welke ingevulde velden worden TEGENGESPROKEN of wijken af van de documenten?\n'
    +'3. Welke verplichte velden hebben GEEN documentaire onderbouwing?\n'
    +'4. Welke rode vlaggen of inconsistenties zie je?\n'
    +'5. Eindoordeel: is het dossier gereed voor DD?\n\n'
    +'Wees concreet en noem specifieke velden en bedragen. Gebruik ## koppen. Markeer problemen duidelijk met ⚠.';

  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:2500})});
    var rd=await resp.json();
    var tekst=(rd.text||'Fout bij genereren.')
      .replace(/## ([^\n]+)/g,'<h3 style="font-family:Playfair Display,serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:.75rem;border-top:1px solid var(--border)">$1</h3>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/⚠/g,'<span style="color:var(--red)">⚠</span>')
      .split('\n\n').map(function(p){return p.trim()&&p.charAt(0)!=='<'?'<p style="font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:.5rem">'+p+'</p>':p;}).join('');
    out.innerHTML='<div style="padding-top:.5rem">'+tekst+'</div>';
  }catch(e){
    out.innerHTML='<div style="color:var(--red);font-size:13px">Fout: '+e.message+'</div>';
  }
  btn.disabled=false;btn.textContent='&#9881; Opnieuw controleren';
}

async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  saveCurrent();S.aiLoading[faseId]=true;renderApp();
  var dataLines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataLines.push(df.label+': '+v+(r?' (doc: '+r+')':''));});
  var chk=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var open=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfs=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var sectorProfiel=getSectorProfiel();
  var sectorLabel=sectorProfiel.label||'MKB';
  var sectorNormen=sectorProfiel.aiNormen||'';
  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur. Sector: '+sectorLabel+'. Traject: '+esc(S.traject&&S.traject.traject_type||'M&A')+' voor "'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'".\n\nSECTOR NORMEN:\n'+sectorNormen+'\n\nFASE: '+f.title+'\n\nINGEVOERDE DATA:\n'+(dataLines.join('\n')||'Geen data')+'\n\nCHECKLIST:\nGereed: '+(chk.join(', ')||'niets')+'\nOpen: '+(open.join(', ')||'alles gereed')+'\n\nRODE VLAGGEN: '+(rfs.join(', ')||'geen')+'\n\nNOTITIES: '+(S.notities[faseId]||'geen')+'\n\nGeef beknopt strategisch advies voor deze sector. Analyseer de cijfers expliciet en vergelijk met de sectorgemiddelden hierboven. Bespreek: voortgang en prioriteiten, urgente openstaande punten, impact rode vlaggen, concrete vervolgstappen. Schrijf in ik-vorm. Gebruik ## koppen. Geen tabellen of bullets.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();var dec=new TextDecoder();var collected='';
    while(true){var res=await reader.read();if(res.done)break;dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}}});}
    S.aiTexts[faseId]=collected;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

// ============================================================
// CHAT SYSTEEM
// ============================================================
var CHAT = {
  open: false,
  berichten: [],
  serverBerichten: [],
  laden: false,
  sturen: false,
  unread: 0
};

function chatContextBeschrijving() {
  var ctx = 'Traject: ' + (S.traject && S.traject.kantoor_naam || S.code);
  ctx += ' | Rol: ' + (isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper');
  if (S.screen === 'main') {
    var f = FASES[S.fase];
    if (f) {
      ctx += ' | Fase: ' + f.num + '. ' + f.title;
      var leeg = f.dataFields.filter(function(df) { return df.req && !df.header && !(S.data[f.id+'_'+df.id]||'').trim(); });
      if (leeg.length) ctx += ' | Nog leeg: ' + leeg.map(function(df){return df.label;}).join(', ');
      var gevuld = f.dataFields.filter(function(df) { return !df.header && (S.data[f.id+'_'+df.id]||'').trim(); });
      if (gevuld.length) ctx += ' | Ingevuld: ' + gevuld.map(function(df){return df.label+'='+S.data[f.id+'_'+df.id];}).join(', ');
    }
  }
  ctx += ' | Totaal: ' + totalFillPct() + '%';
  return ctx;
}

async function chatLaadBerichten() {
  if (!S.code) return;
  try {
    var resp = await fetch(WORKER + '/mna/chat/' + S.code);
    if (!resp.ok) return;
    var d = await resp.json();
    if (d.berichten) {
      CHAT.serverBerichten = d.berichten;
      var nieuweUnread = 0;
      d.berichten.forEach(function(b) {
        if (isVerkoper() && b.auteur === 'begeleider' && !b.gelezen) nieuweUnread++;
        if (isTussen() && b.auteur === 'verkoper' && !b.gelezen) nieuweUnread++;
      });
      if (!CHAT.open && nieuweUnread > CHAT.unread) {
        CHAT.unread = nieuweUnread;
        chatUpdateBadge();
      }
    }
  } catch(e) {}
}

async function chatVerstuur(tekst) {
  if (!tekst.trim() || CHAT.sturen) return;
  CHAT.sturen = true;
  var auteur = isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper';
  var naamLabel = isVerkoper() ? (S.traject && S.traject.contact_naam || 'Verkoper') : isTussen() ? (S.traject && S.traject.begeleider_naam || 'Begeleider') : 'Koper';
  var userMsg = { auteur: auteur, naam: naamLabel, tekst: tekst, ts: Date.now(), lokaal: true };
  CHAT.berichten.push(userMsg);
  chatRenderBerichten();
  try {
    await fetch(WORKER + '/mna/chat/' + S.code, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auteur: auteur, naam: naamLabel, tekst: tekst })
    });
  } catch(e) {}
  if (isVerkoper()) {
    CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: '...', ts: Date.now(), typing: true });
    chatRenderBerichten();
    var sp2=getSectorProfiel();var systeemPrompt = 'Je bent een vriendelijke assistent voor een M&A due diligence platform. Sector: '+(sp2.label||'MKB')+'. Je helpt de eigenaar/verkoper bij het invullen van het due diligence formulier. Sectorgemiddelden: '+(sp2.aiNormen||'')+'. Geef korte, praktische antwoorden in het Nederlands. CONTEXT: ' + chatContextBeschrijving();
    var msgs = [];
    var allB = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal&&!b.typing;}));
    allB.slice(-8).forEach(function(b) {
      if (b.auteur === 'verkoper') msgs.push({ role: 'user', content: b.tekst });
      else if (b.auteur === 'ai') msgs.push({ role: 'assistant', content: b.tekst });
    });
    try {
      var resp = await fetch(WORKER + '/ai', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: systeemPrompt, messages: msgs, max_tokens: 400 })
      });
      var rd = await resp.json();
      var antwoord = rd.text || 'Sorry, er ging iets mis.';
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      var aiMsg = { auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord, ts: Date.now(), lokaal: true };
      CHAT.berichten.push(aiMsg);
      fetch(WORKER + '/mna/chat/' + S.code, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord })
      }).catch(function(){});
    } catch(e) {
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: 'Verbindingsfout. Probeer opnieuw.', ts: Date.now() });
    }
    chatRenderBerichten();
  }
  CHAT.sturen = false;
}

function chatRenderBerichten() {
  var lijst = document.getElementById('chat-berichten');
  if (!lijst) return;
  var alleBerichten = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal;}));
  var gezien = {};
  alleBerichten = alleBerichten.filter(function(b){
    var k = b.auteur + '|' + b.tekst + '|' + (b.ts||'');
    if (gezien[k]) return false; gezien[k] = true; return true;
  });
  alleBerichten.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  if (!alleBerichten.length) {
    lijst.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:2rem 1rem">' + (isVerkoper() ? '\uD83D\uDC4B Hallo! Ik help u graag bij het invullen. Stel gerust een vraag.' : 'Nog geen berichten.') + '</div>';
    return;
  }
  lijst.innerHTML = alleBerichten.map(function(b) {
    var isEigen = (isVerkoper() && b.auteur === 'verkoper') || (isTussen() && b.auteur === 'begeleider');
    var isAI = b.auteur === 'ai';
    var isBeg = b.auteur === 'begeleider';
    var dt = b.ts ? new Date(b.ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '';
    var bg = isEigen ? 'var(--teal)' : isAI ? 'var(--card)' : isBeg ? '#f3f0ff' : 'var(--card)';
    var kleur = isEigen ? '#fff' : 'var(--sub)';
    var align = isEigen ? 'flex-end' : 'flex-start';
    var border = isAI ? '1px solid var(--border)' : isBeg ? '1px solid #c8b8f0' : 'none';
    var naamKleur = isAI ? 'var(--teal)' : isBeg ? '#7c5cbf' : 'var(--muted)';
    var naamHtml = isEigen ? '' : '<div style="font-size:10px;font-weight:600;color:'+naamKleur+';margin-bottom:3px">' + (b.naam||b.auteur) + '</div>';
    var radius = isEigen ? '12px 12px 2px 12px' : '12px 12px 12px 2px';
    if (b.typing) return '<div style="display:flex;justify-content:flex-start;margin-bottom:8px"><div style="background:var(--card);border:1px solid var(--border);border-radius:'+radius+';padding:8px 14px;max-width:80%">'+naamHtml+'<div style="display:flex;gap:4px;align-items:center;height:18px"><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite 0s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .2s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .4s"></div></div></div></div>';
    var tekstHtml = String(b.tekst||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    return '<div style="display:flex;justify-content:'+align+';margin-bottom:8px"><div style="background:'+bg+';border:'+border+';border-radius:'+radius+';padding:8px 12px;max-width:82%;word-break:break-word">'+naamHtml+'<div style="font-size:13px;color:'+kleur+';line-height:1.55">'+tekstHtml+'</div>'+(dt?'<div style="font-size:10px;color:'+(isEigen?'rgba(255,255,255,.6)':'var(--muted)')+';margin-top:3px;text-align:right">'+dt+'</div>':'')+'</div></div>';
  }).join('');
  lijst.scrollTop = lijst.scrollHeight;
}

function chatUpdateBadge() {
  var badge = document.getElementById('chat-badge');
  if (!badge) return;
  if (CHAT.unread > 0) { badge.style.display = 'flex'; badge.textContent = CHAT.unread > 9 ? '9+' : String(CHAT.unread); }
  else badge.style.display = 'none';
}

function chatOpen() {
  CHAT.open = true; CHAT.unread = 0; chatUpdateBadge();
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'flex';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'none';
  chatLaadBerichten().then(function(){ chatRenderBerichten(); });
  setTimeout(function(){ var inp = document.getElementById('chat-input'); if (inp) inp.focus(); }, 100);
}

function chatSluit() {
  CHAT.open = false;
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'none';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'flex';
}

window.chatStuurVanInput = function() {
  var inp = document.getElementById('chat-input'); if (!inp) return;
  var tekst = inp.value.trim(); if (!tekst) return;
  inp.value = ''; inp.style.height = 'auto';
  chatVerstuur(tekst);
};

    +'<button onclick="chatStuurVanInput()" style="background:var(--teal);border:none;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px;flex-shrink:0">&#8593;</button>'

  document.body.appendChild(container);

  }
  chatLaadBerichten().then(function(){ if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge(); });
  if (isVerkoper()) {
    clearInterval(window._chatPollInterval);
    window._chatPollInterval = setInterval(function(){
      if (S.code && S.screen !== 'login') chatLaadBerichten().then(function(){
        if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge();
      });
    }, 15000);
  }
}

// Wrap renderApp zodat chat altijd herinitialiseerd wordt
var _origRenderApp = renderApp;
renderApp = function() { _origRenderApp(); chatInit(); };

</script>
</body>
