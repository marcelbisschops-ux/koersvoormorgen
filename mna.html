<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&A Begeleiding - KantoorInzicht</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f label .req{color:var(--red)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus{border-color:var(--teal)}
.f input.missing{border-color:var(--red);background:var(--red-bg)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
/* Checklist - only for MNA view */
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
/* AI panel */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
/* Fase grid */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.save-indicator{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}
/* Cover letter */
.cover-letter{background:var(--panel);border:2px solid var(--teal);border-radius:var(--r2);padding:2rem;margin-bottom:1.5rem}
.cover-letter h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--head);font-weight:600;margin-bottom:1rem}
.cover-letter p{font-size:13px;color:var(--mid);margin-bottom:.75rem;line-height:1.75}
/* Missing fields summary */
.missing-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem}
.missing-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.missing-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--red);border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none}
.complete-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--teal);border-bottom:1px solid var(--border)}
.complete-item:last-child{border-bottom:none}
/* Koper read-only view */
.readonly-val{font-size:13px;color:var(--sub);padding:8px 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-height:36px}
.readonly-val.empty{color:var(--muted);font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .25s ease forwards}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem;background:var(--card)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:var(--teal-bg)}
.upload-zone input{display:none}
.doc-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem}
.doc-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.doc-naam{font-size:12px;font-weight:600;color:var(--head)}
.doc-type{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.doc-analyse{font-size:12px;color:var(--mid);line-height:1.6;margin-top:.4rem;max-height:200px;overflow-y:auto;padding:.5rem;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.doc-velden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:.5rem}
.doc-veld{background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:4px;padding:4px 8px}
.doc-veld-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dim);font-weight:600}
.doc-veld-val{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);font-weight:600}
.upload-progress{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:.5rem;display:none}
.upload-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
.btn-del{background:transparent;border:1px solid var(--border2);color:var(--red);font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:var(--r)}
.btn-del:hover{background:var(--red-bg);border-color:var(--red)}
@keyframes prog{from{width:20%}to{width:85%}}
@media print{
  @page{margin:2cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.prog-bar{display:none!important}
  .ai-panel,.panel{break-inside:avoid}
  body{font-size:11px}
}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:13px;color:var(--sub);box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:flex-start;gap:10px;max-width:340px;pointer-events:auto;animation:toastIn .25s ease forwards;border-left:4px solid var(--teal)}
.toast.toast-ok{border-left-color:var(--teal)}.toast.toast-err{border-left-color:var(--red)}.toast.toast-warn{border-left-color:var(--gold)}.toast.toast-info{border-left-color:#2a5ea0}
.toast.hide{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:#fff;border:1px solid #c8c5bc;border-radius:10px;padding:1.75rem;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:1.25rem}
</style>
</head>

function versieLabel(){var v=window._versie||'v1.11';return '<span style="font-size:10px;font-weight:600;font-family:IBM Plex Mono,monospace;color:var(--muted);margin-left:8px">'+(v.startsWith('v')?v:'v'+v)+'</span>';}

// Laad versie bij startup
fetch(WORKER+'/mna/versie').then(function(r){return r.json();}).then(function(d){
  if(d.versie){window._versie=d.versie;}
}).catch(function(){});

function triggerFileUpload(faseId) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf,.docx,.doc,.xlsx,.xls,.csv,.txt,.eml'; inp.multiple = true;
  document.body.appendChild(inp);
  inp.addEventListener('change', function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length; i++) uploadDocument(faseId, files[i]);
    document.body.removeChild(inp);
  });
  inp.click();
}

// Bepaal actief sectorprofiel op basis van traject
function getSectorProfiel() {
  var sector = S.traject && S.traject.sector;
  if (sector && SECTOR_PROFIELEN[sector]) return SECTOR_PROFIELEN[sector];
  // Fallback: accountancy als standaard (bestaand gedrag)
  return SECTOR_PROFIELEN.accountancy;
}

function getSectorFases() {
  return getSectorProfiel().fases;
}


// FASES wordt dynamisch bepaald via getSectorFases()

var S={screen:'login',code:'',rol:'',traject:null,fase:0,checked:{},data:{},docRefs:{},notities:{},aiTexts:{},aiLoading:{},saveTimer:null,showValidation:false,dataroomLoading:false,dataroom:null,_opy:{},_epy:{},_conflicts:[],_userEdited:{},_docSource:{},faseStatus:{},dossierVrijgegeven:false};

// ── BEVEILIGING ─────────────────────────────────────────────────────────────
var SEC = {
  SESSION_MS: 8 * 60 * 60 * 1000,   // 8 uur sessieduur
  WARN_MS:    15 * 60 * 1000,        // waarschuwing 15 min voor expiry
  LOGIN_COOLDOWN_MS: 2000,           // 2 sec tussen loginpogingen
  MAX_ATTEMPTS: 10,                  // max pogingen per sessie
  loginAt: 0,
  lastActivity: 0,
  attempts: 0,
  lastAttemptAt: 0,
  _expTimer: null,
  _warnTimer: null,
  _actTimer: null
};

function secReset() {
  SEC.loginAt = 0; SEC.lastActivity = 0; SEC.attempts = 0;
  clearTimeout(SEC._expTimer); clearTimeout(SEC._warnTimer); clearTimeout(SEC._actTimer);
}

function secStartSession() {
  var now = Date.now();
  SEC.loginAt = now; SEC.lastActivity = now;
  clearTimeout(SEC._expTimer); clearTimeout(SEC._warnTimer);
  SEC._warnTimer = setTimeout(function() {
    if (S.screen !== 'login') {
      toast('Uw sessie verloopt over 15 minuten. Sla uw werk op of log opnieuw in om door te gaan.', 'warn', 8000);
    }
  }, SEC.SESSION_MS - SEC.WARN_MS);
  SEC._expTimer = setTimeout(function() {
    if (S.screen !== 'login') {
      toast('Sessie verlopen — u wordt automatisch uitgelogd.', 'warn', 4000);
      setTimeout(function() { uitloggen(); }, 2000);
    }
  }, SEC.SESSION_MS);
}

function secActivity() {
  SEC.lastActivity = Date.now();
}

function secCanLogin() {
  var now = Date.now();
  if (SEC.attempts >= SEC.MAX_ATTEMPTS) {
    toast('Te veel pogingen. Herlaad de pagina om opnieuw te proberen.', 'err', 6000);
    return false;
  }
  if (now - SEC.lastAttemptAt < SEC.LOGIN_COOLDOWN_MS) {
    toast('Even wachten...', 'warn', 1500);
    return false;
  }
  SEC.lastAttemptAt = now;
  SEC.attempts++;
  return true;
}

function secAuditLog(actie, extra) {
  if (!S.code) return;
  var payload = { code: S.code, rol: S.rol, actie: actie, ts: Date.now() };
  if (extra) Object.assign(payload, extra);
  fetch(WORKER + '/mna/audit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function() {});
}

function pct(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return 0;var d=f.items.filter(function(_,i){return S.checked[id+'_'+i];}).length;return f.items.length?Math.round(d/f.items.length*100):0;}
function checkOmzetSom(){
  var ids=['omzetJaarwerk','omzetAdvies','omzetLoon','omzetFiscaal','omzetOverig'];
  var som=0;
  var heeftWaarden=false;
  ids.forEach(function(id){
    var v=parseFloat((S.data['financieel_'+id]||'').replace(',','.'));
    if(!isNaN(v)){som+=v;heeftWaarden=true;}
  });
  var el=document.getElementById('omzet-som-check');
  if(!el)return;
  if(!heeftWaarden){el.style.display='none';return;}
  el.style.display='block';
  var afwijking=Math.abs(som-100);
  if(afwijking<0.5){
    el.innerHTML='<span style="color:var(--teal)">✓ Omzetverdeling klopt: '+som.toFixed(0)+'%</span>';
  }else{
    el.innerHTML='<span style="color:var(--red)">⚠ Omzetverdeling: '+som.toFixed(0)+'% (moet 100% zijn, verschil: '+(som>100?'+':'')+(som-100).toFixed(0)+'%)</span>';
  }
}

function fillPct(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return 0;var req=f.dataFields.filter(function(df){return df.req&&!df.header;});var done=req.filter(function(df){return !!(S.data[id+'_'+df.id]||'').trim();}).length;return req.length?Math.round(done/req.length*100):100;}
function totalFillPct(){var t=0,d=0;FASES.forEach(function(f){var req=f.dataFields.filter(function(df){return df.req&&!df.header;});t+=req.length;d+=req.filter(function(df){return !!(S.data[f.id+'_'+df.id]||'').trim();}).length;});return t?Math.round(d/t*100):0;}
function dc(v){return v>=70?'var(--teal)':v>=50?'var(--gold)':'var(--red)';}
function ge(id){return document.getElementById(id);}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isVerkoper(){return S.rol==='verkoper';}
function isKoper(){return S.rol==='koper';}
function isTussen(){return S.rol==='tussenpersoon';}
function isAdmin(){return isTussen();}

function getMissing(){
  var missing=[];
  FASES.forEach(function(f){
    var missingFields=f.dataFields.filter(function(df){return df.req&&!df.header&&!(S.data[f.id+'_'+df.id]||'').trim();});
    if(missingFields.length)missing.push({fase:f.num+'. '+f.title,fields:missingFields.map(function(df){return df.label;})});
  });
  return missing;
}

function saveCurrent(cb){
  var f=FASES[S.fase];
  if(!f||S.screen!=='main'||isKoper())return;
  markDirty();
  if(S.traject&&S.traject.status==='vergrendeld'){if(cb)cb();return;}
  f.dataFields.forEach(function(df){
    if(df.header){return;}
    var el=ge('df_'+df.id);
    var key=f.id+'_'+df.id;
    if(el){
      // _userEdited wordt alleen gezet via oninput, NIET hier
      if(el.value.trim()||S._userEdited[key])S.data[key]=el.value;
    }
    // Als element niet in DOM is, behoud altijd bestaande S.data waarde
  });
  var nel=ge('notitie_'+f.id);if(nel)S.notities[f.id]=nel.value;
  clearTimeout(S.saveTimer);
  S.saveTimer=setTimeout(function(){
    fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:S.code,fase_id:f.id,data_json:getDataForFase(f.id),checklist_json:getChecklistForFase(f.id),notitie:S.notities[f.id]||''})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error==='vergrendeld'){showAlert('Dit traject is vergrendeld. Uw wijzigingen zijn niet opgeslagen.');}
      else{showSaveIndicator();}
    }).catch(function(){});
    if(cb)cb();
  },800);
}

function getDataForFase(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return {};var out={};f.dataFields.forEach(function(df){if(df.header)return;var v=S.data[id+'_'+df.id];if(v)out[df.id]={value:v,label:df.label,req:df.req||false};});return out;}
function getChecklistForFase(id){var out={items:{},redflags:{}};var f=FASES.find(function(x){return x.id===id;});if(!f)return out;f.items.forEach(function(_,i){out.items[i]=!!S.checked[id+'_'+i];});f.redflags.forEach(function(_,i){out.redflags[i]=!!S.checked[id+'_rf_'+i];});return out;}
function loadDataFromDB(dbData){dbData.forEach(function(row){var id=row.fase_id;var dj=typeof row.data_json==='string'?JSON.parse(row.data_json||'{}'):row.data_json||{};var cj=typeof row.checklist_json==='string'?JSON.parse(row.checklist_json||'{}'):row.checklist_json||{};var f=FASES.find(function(x){return x.id===id;});if(!f)return;Object.keys(dj).forEach(function(k){var v=dj[k];if(v&&v.value)S.data[id+'_'+k]=v.value;});if(cj.items)Object.keys(cj.items).forEach(function(i){S.checked[id+'_'+i]=cj.items[i];});if(cj.redflags)Object.keys(cj.redflags).forEach(function(i){S.checked[id+'_rf_'+i]=cj.redflags[i];});if(row.notitie)S.notities[id]=row.notitie;if(row.koper_reactie){if(!S.koperReacties)S.koperReacties={};S.koperReacties[id]=row.koper_reactie;}});}
function showSaveIndicator(tekst){var el=ge('save-ind');if(!el)return;el.textContent=tekst||'Opgeslagen ✓';el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}
function showAlert(msg){toast(msg,"warn");}
function toast(msg,type,dur){type=type||'ok';dur=dur||3500;var c=document.getElementById('toast-container');if(!c){c=document.createElement('div');c.id='toast-container';c.className='toast-container';document.body.appendChild(c);}var t=document.createElement('div');t.className='toast toast-'+type;var ico=type==='ok'?'✓':type==='err'?'✕':type==='warn'?'⚠':'ℹ';t.innerHTML='<span style="font-size:15px;flex-shrink:0;color:'+(type==='ok'?'var(--teal)':type==='err'?'var(--red)':type==='warn'?'var(--gold)':'#2a5ea0')+'">'+ico+'</span><span style="flex:1;line-height:1.5">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0;line-height:1;flex-shrink:0">&times;</button>';c.appendChild(t);setTimeout(function(){t.classList.add('hide');setTimeout(function(){if(t.parentElement)t.parentElement.removeChild(t);},220);},dur);return t;}

function schedSave(){if(S.traject&&S.traject.status==='vergrendeld')return;markDirty();clearTimeout(S.saveTimer);S.saveTimer=setTimeout(function(){saveCurrent();},1200);}
function userEdit(el){
  // Markeer veld als handmatig bewerkt door gebruiker
  var faseId=FASES[S.fase]&&FASES[S.fase].id;
  if(el&&el.id&&faseId){
    var dfId=el.id.replace('df_','');
    S._userEdited[faseId+'_'+dfId]=true;
    // Wis docSource want gebruiker overschrijft nu zelf
    if(S._docSource)delete S._docSource[faseId+'_'+dfId];
  }
  schedSave();checkOmzetSom();
}

// Dirty tracking — weet of er onopgeslagen wijzigingen zijn
var _lastSavedHash = '';
function _dataHash(){
  // Snelle hash van alle gevulde velden om dirty state te detecteren
  if(!S.code)return'';
  var parts=[];
  FASES.forEach(function(f){
    f.dataFields.forEach(function(df){
      if(!df.header){var v=S.data[f.id+'_'+df.id];if(v)parts.push(f.id+'_'+df.id+'='+v);}
    });
  });
  return parts.join('|');
}
function markDirty(){S._dirty=true;}
function isDirty(){return !!S._dirty;}

function saveAll(opts){
  if(!S.code||S.traject&&S.traject.status==='vergrendeld')return;
  var useBeacon=opts&&opts.beacon; // voor pagehide/beforeunload
  var fasesMetData=FASES.filter(function(f){
    return f.dataFields.some(function(df){return !df.header&&(S.data[f.id+'_'+df.id]||'').trim();});
  });
  if(!fasesMetData.length)return;
  fasesMetData.forEach(function(f){
    var payload={code:S.code,fase_id:f.id,data_json:getDataForFase(f.id),checklist_json:getChecklistForFase(f.id),notitie:S.notities[f.id]||''};
    var body=JSON.stringify(payload);
    if(useBeacon&&navigator.sendBeacon){
      // sendBeacon: gegarandeerd verstuurd ook als tabblad sluit
      var blob=new Blob([body],{type:'application/json'});
      navigator.sendBeacon(WORKER+'/mna/save',blob);
    } else {
      fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json'},body:body
      }).then(function(r){return r.json();}).then(function(d){
        if(d.error==='vergrendeld')showAlert('Dit traject is vergrendeld.');
        else if(!d.error){showSaveIndicator();}
      }).catch(function(){});
    }
  });
  S._dirty=false;
  _lastSavedHash=_dataHash();
}

// Auto-save elke 30 seconden als er dirty wijzigingen zijn
setInterval(function(){
  if(S.screen==='main'&&S.code&&isDirty()){
    saveAll();
    showSaveIndicator('Auto-opgeslagen ✓');
  }
},30000);

// Bij tab wisselen (visibilitychange): direct opslaan
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.screen==='main'&&S.code&&isDirty()){
    saveAll();
  }
});

// Bij tabblad sluiten of pagina verlaten: sendBeacon (gegarandeerd)
window.addEventListener('pagehide',function(){
  if(S.screen==='main'&&S.code&&isDirty()){
    saveAll({beacon:true});
  }
});

// Fallback voor browsers zonder pagehide
window.addEventListener('beforeunload',function(){
  if(S.screen==='main'&&S.code&&isDirty()){

});

// -- DOCUMENT STATE ----------------------------------------------
var DOCS = {};  // { faseId: [{id, naam, type, grootte, analyse, velden, uploading}] }

function getDocsForFase(faseId) {
  return DOCS[faseId] || [];
}

function loadDocsForFase(faseId) {
  if (!S.code || isKoper()) return;
  fetch(WORKER + '/mna/document/lijst/' + S.code + '/' + faseId)
    .then(function(r){ return r.json(); })
    .then(function(docs){
      // Dedupliceer op id — server kan dubbele records hebben
      var seen={};
      DOCS[faseId] = docs.filter(function(d){ if(seen[d.id])return false; seen[d.id]=true; return true; })
        .map(function(d){
          return {
            id: d.id, naam: d.bestand_naam, type: d.bestand_type,
            grootte: d.bestand_grootte, analyse: d.analyse,
            velden: (function(s){try{var r=JSON.parse(s||'{}');return r&&typeof r==='object'&&!Array.isArray(r)?r:{};}catch(e){return {};}})(d.veld_extractie),
            uploaded_at: d.uploaded_at||null,
            bewaard: !!d.bewaard, methode: d.methode, uploading: false
          };
        });
      renderApp();
    }).catch(function(){});
}

async function uploadDocument(faseId, file) {
  if (!S.code || isKoper()) return;
  if (S.traject && S.traject.status === 'vergrendeld') { toast('Traject is vergrendeld.','warn'); return; }
  var maxSize = 20 * 1024 * 1024;
  if (file.size > maxSize) { toast('Bestand te groot (max 20MB). Huidig: ' + Math.round(file.size/1024/1024) + 'MB','warn'); return; }

  // Show uploading state
  if (!DOCS[faseId]) DOCS[faseId] = [];
  var tempId = 'uploading_' + Date.now();
  DOCS[faseId].unshift({ id: tempId, naam: file.name, type: file.type, grootte: file.size, analyse: '', velden: {}, uploading: true });
  renderApp();

  var formData = new FormData();
  formData.append('file', file);
  var bewaar = S.traject && S.traject.bewaar_docs !== false;
  var url = WORKER + '/mna/document/upload?code=' + S.code + '&fase_id=' + faseId + '&bewaar=' + bewaar;

  try {
    var resp = await fetch(url, { method: 'POST', body: formData });
    var d = await resp.json();
    if (d.ok) {
      // Replace temp with real
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      DOCS[faseId].unshift({
        id: d.doc_id, naam: file.name, type: file.type, grootte: file.size,
        analyse: d.analyse, velden: d.veld_extractie || {}, bewaard: !!d.r2_opgeslagen,
        uploaded_at: Date.now(), uploading: false, verworpen: !!d.verworpen, verworpen_reden: d.verworpen_reden||null
      });
      if (d.veld_extractie) {
        S._conflicts=[];
        var alleFases=['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];
        alleFases.forEach(function(fid){ autoFillFromExtraction(fid, d.veld_extractie, false, file.name); });
        if(S._conflicts&&S._conflicts.length){
          renderApp();setTimeout(toonConflictDialog,300);
        }else{markDirty();renderApp();schedSave();}
      }
      // Toon crosscheck waarschuwingen
      if((d.crosschecks&&d.crosschecks.length)||(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam)){
        var msgs=[];
        // Entiteit check
        if(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam){
          var n1=(d.entiteit_naam||'').toLowerCase(),n2=(S.traject.kantoor_naam||'').toLowerCase();
          if(!n1.includes(n2.split(' ')[0])&&!n2.includes(n1.split(' ')[0]))
            msgs.push('⚠ Entiteit in document ("'+d.entiteit_naam+'") wijkt af van kantoornaam ("'+S.traject.kantoor_naam+'")');
        }
        if(d.crosschecks)msgs=msgs.concat(d.crosschecks);
        if(msgs.length){
          var md='<div style="background:#fff8f0;border:1px solid #e8a84c;border-radius:6px;padding:.75rem;margin:.5rem 0">'
            +'<div style="font-size:11px;font-weight:600;color:#8a5a00;margin-bottom:.4rem">⚠ Aandachtspunten bij '+esc(file.name)+'</div>'
            +msgs.map(function(m){return '<div style="font-size:12px;color:#5a4010;padding:2px 0">• '+esc(m)+'</div>';}).join('')
            +'</div>';
          // Toon onder de upload zone
          var uz=document.getElementById('upload-zone-'+faseId);
          if(uz){var w=document.createElement('div');w.innerHTML=md;uz.parentNode.insertBefore(w,uz.nextSibling);}
        }
      }
    } else {
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      toast('Upload fout: ' + (d.error || 'onbekend'),'err');
    }
  } catch(e) {
    DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
    toast('Verbindingsfout bij uploaden.','err');
  }
  renderApp();
}

// Centrale upload: verwerk bestanden en laat AI alle fases invullen
window.centraalUploadFiles = async function(files) {
  if(!files||!files.length)return;
  var totaal=files.length;
  var verwerkt=0;
  var fouten=0;

  // Status in een aparte vaste div buiten de render-cyclus
  var statusDiv=document.getElementById('centraal-upload-status');
  function toonStatus(html){
    // Zoek element opnieuw na elke renderApp
    var el=document.getElementById('centraal-upload-status');
    if(el)el.innerHTML=html;
  }
  function toonVoortgang(huidig,totaalN,naam){
    var pct=Math.round(huidig/totaalN*100);
    var breedte=Math.max(4,pct);
    toonStatus('<div style="margin-bottom:4px;font-size:12px;color:var(--teal)">&#9881; Bezig: <strong>'+naam+'</strong> ('+huidig+'/'+totaalN+')</div>'
      +'<div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--teal);height:100%;width:'+breedte+'%;transition:width .3s"></div></div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:3px">'+pct+'% — dit kan 15-30 seconden per bestand duren</div>');
  }

  for(var i=0;i<files.length;i++){
    var file=files[i];
    toonVoortgang(i+1,totaal,file.name);

    var naam=file.name.toLowerCase();
    var faseId='financieel';
    if(naam.includes('loon')||naam.includes('salaris')||naam.includes('personeel'))faseId='partner';
    else if(naam.includes('klant')||naam.includes('debiteur')||naam.includes('crm')||naam.includes('omzet'))faseId='commercieel';
    else if(naam.includes('contract')||naam.includes('juridisch')||naam.includes('kvk')||naam.includes('akte'))faseId='juridisch';
    else if(naam.includes('it')||naam.includes('software')||naam.includes('ict')||naam.includes('systeem'))faseId='it';
    else if(naam.includes('kwaliteit')||naam.includes('audit')||naam.includes('compliance')||naam.includes('avg'))faseId='compliance';
    else if(naam.includes('strateg')||naam.includes('markt')||naam.includes('plan'))faseId='strategisch';

    var formData=new FormData();
    formData.append('file',file);
    var bewaar=S.traject&&S.traject.bewaar_docs!==false;
    var url=WORKER+'/mna/document/upload?code='+S.code+'&fase_id='+faseId+'&bewaar='+bewaar;

    try{
      // 60 seconden timeout per bestand
      var controller=new AbortController();
      var timeoutId=setTimeout(function(){controller.abort();},45000);
      var resp=await fetch(url,{method:'POST',body:formData,signal:controller.signal});
      clearTimeout(timeoutId);
      var d=await resp.json();
      if(d.ok){
        if(!DOCS[faseId])DOCS[faseId]=[];
        DOCS[faseId].unshift({id:d.doc_id,naam:file.name,type:file.type,grootte:file.size,analyse:d.analyse||'',velden:d.veld_extractie||{},bewaard:!!d.r2_opgeslagen,uploaded_at:Date.now(),uploading:false});
        if(d.veld_extractie&&Object.keys(d.veld_extractie).length&&!d.verworpen){
          S._conflicts=[];
          var alleFases2=['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];
          alleFases2.forEach(function(fid){ autoFillFromExtraction(fid,d.veld_extractie,false,file.name); });
        }
        verwerkt++;
        // Toon verworpen melding direct en ga door
        if(d.verworpen&&d.verworpen_reden){
          var statusEl3=document.getElementById('centraal-upload-status');
          if(statusEl3)statusEl3.innerHTML=(statusEl3.innerHTML||'')+'<div style="background:#fff0f0;border:1px solid var(--red);border-radius:6px;padding:.5rem .75rem;margin-top:.4rem;font-size:12px;color:var(--red)">🚫 <strong>'+esc(file.name)+'</strong> genegeerd: '+esc(d.verworpen_reden)+'</div>';
          // Direct doorgaan naar volgend bestand
          renderApp();
          continue;
        }
        // Toon crosscheck waarschuwingen als die er zijn
        if(d.crosschecks&&d.crosschecks.length){
          var warnHtml='<div style="background:#fff8f0;border:1px solid #e8a84c;border-radius:6px;padding:.75rem;margin-top:.5rem">'
            +'<div style="font-size:11px;font-weight:600;color:#8a5a00;margin-bottom:.4rem">⚠ '+file.name+' — '+d.crosschecks.length+' aandachtspunt(en)</div>';
          d.crosschecks.forEach(function(w){warnHtml+='<div style="font-size:12px;color:#5a4010;padding:2px 0">• '+esc(w)+'</div>';});
          // Entiteit check
          if(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam){
            var naam1=(d.entiteit_naam||'').toLowerCase();
            var naam2=(S.traject.kantoor_naam||'').toLowerCase();
            if(!naam1.includes(naam2.split(' ')[0])&&!naam2.includes(naam1.split(' ')[0])){
              warnHtml+='<div style="font-size:12px;color:#c0392b;padding:2px 0;font-weight:500">⚠ Entiteit in document ("'+esc(d.entiteit_naam)+'") wijkt af van kantoornaam ("'+esc(S.traject.kantoor_naam)+'") — controleer of dit het juiste bestand is.</div>';
            }
          }
          warnHtml+='</div>';
          var statusEl2=document.getElementById('centraal-upload-status');
          if(statusEl2)statusEl2.innerHTML=(statusEl2.innerHTML||'')+warnHtml;
        }
      } else {
        fouten++;
        toonStatus('<span style="color:var(--red)">Fout bij '+file.name+': '+(d.error||'onbekend')+'</span>');
      }
    }catch(e){
      fouten++;
      var msg=e.name==='AbortError'?'Timeout (90s) — probeer een kleiner bestand of upload PDF in plaats van CSV':e.message;
      toonStatus('<span style="color:var(--red)">Fout bij '+file.name+': '+msg+'</span>');
    }
  }

  // Sla eerst alle data op naar server VOORDAT renderApp de DOM overschrijft
  if(Object.keys(S.data).length) saveAll();

  // Render zodat gebruiker velden ziet
  renderApp();
  setTimeout(function(){
    toonStatus('<span style="color:var(--teal)">&#10003; '+verwerkt+' van '+totaal+' bestanden verwerkt'+(fouten?' ('+fouten+' fout)':'')+'. Controleer de velden hieronder.</span>');
  },500);
};

function cleanGetal(v) {
  if (!v || v === 'null') return v;
  var s = String(v).trim();
  // Nederlandse notatie: 2.847.000 → 2847000, of 24.8 → 24.8
  // Patroon: als er meerdere punten zijn, zijn het duizendtalscheiders
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return s.replace(/\./g, '');
  // Komma als decimaalscheider: 24,8 → 24.8
  if (/^\d+,\d+$/.test(s)) return s.replace(',', '.');
  return s;
}

function autoFillFromExtraction(faseId, velden, forceOverwrite, docNaam) {
  var currentDocNaam = docNaam || 'onbekend document';
  var knownFases = ['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];

  // Pre-pass: omzet_per_jaar_YYYY losse velden samenvoegen tot _opy object
  if (!S._opy) S._opy = {};
  Object.keys(velden).forEach(function(k) {
    var m = k.match(/^omzet_per_jaar_(\d{4})$/);
    if (m) {
      var jaar = m[1];
      var val = cleanGetal(velden[k]);
      if (val && val !== 'null') S._opy[jaar] = val;
    }
  });

  // Directe keys (fase_id_veld_id formaat van CSV upload) direct in S.data zetten
  Object.keys(velden).forEach(function(k){
    if(k.includes('_')&&!['omzet_per_jaar','ebitda_pct','omzet_jaarwerk_pct','omzet_advies_pct','omzet_loon_pct','omzet_fiscaal_pct','omzet_overig_pct','kosten_personeel_pct','kosten_huisvesting_pct','kosten_it_pct','kosten_marketing_pct'].includes(k)){
      var parts=k.split('_');
      // Check of het een fase_veld key is (bijv. financieel_omzet1)
      if(knownFases.includes(parts[0])){
        var val=cleanGetal(velden[k]);
        if(val&&val!=='null'&&String(val).trim()!==''){
          if(forceOverwrite||!(S.data[k]||'').trim())S.data[k]=String(val);
        }
      }
    }
  });

  function setIfEmpty(key, val) {
    if(val&&val!=='null'&&val!==null&&String(val).trim()!==''&&!(S.data[key]||'').trim())
      S.data[key]=String(val);
  }
  function applyOrConflict(key, val, label) {
    if(!val||val==='null'||val===null||String(val).trim()==='')return;
    var newVal=String(val);
    var existing=(S.data[key]||'').trim();
    if(!existing){S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return;}
    if(existing===newVal)return;
    if(forceOverwrite){S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return;}
    // Alleen conflict tonen als de gebruiker dit veld zelf heeft ingevuld
    if(!S._userEdited||!S._userEdited[key]){
      S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return; // Stil overschrijven als niet user-edited
    }
    if(!S._conflicts)S._conflicts=[];
    if(!S._conflicts)S._conflicts=[];
    S._conflicts.push({key:key,label:label,huidig:existing,nieuw:newVal,bron:currentDocNaam});
    if(!S._pendingConflicts)S._pendingConflicts={};
    S._pendingConflicts[key]=newVal;
  }
  if(faseId==='financieel'){
    if(!S._opy)S._opy={};
    var opy=velden.omzet_per_jaar;
    if(opy&&typeof opy==='object'){
      Object.keys(opy).forEach(function(jaar){
        var v=opy[jaar],j=Number(jaar);
        if(v&&v!=='null'&&v!==null&&!isNaN(j)&&j>1990&&j<2100)S._opy[String(j)]=v;
      });
    }
    if(velden.omzet&&velden.omzet!=='null'&&velden.boekjaar&&!isNaN(Number(velden.boekjaar))){velden.omzet=cleanGetal(velden.omzet);
      var bj=String(Number(velden.boekjaar));
      if(!S._opy[bj])S._opy[bj]=velden.omzet;
    }
    var yrs=Object.keys(S._opy).map(Number).filter(function(j){return!isNaN(j)&&j>1990&&j<2100;}).sort(function(a,b){return a-b;});
    if(yrs.length){
      // Altijd opnieuw mappen - juiste jaar altijd op juiste positie
      var toFill=yrs.slice(-3);
      var allFlds=['omzet1','omzet2','omzet3'];
      var usedFlds=allFlds.slice(3-toFill.length);
      // Vul correct in — maar wis NOOIT bestaande velden die al gevuld zijn
      toFill.forEach(function(yr,i){var w=S._opy[String(yr)];if(w)S.data['financieel_'+usedFlds[i]]=String(w);});

    if(!S._epy)S._epy={};
    var ev=velden.ebitda_pct;

      var ej=velden.boekjaar?String(Number(velden.boekjaar)):'0';

      if(eys.length)applyOrConflict('financieel_ebitdaMarge',S._epy[String(eys[0])],'EBITDA-marge (%)');
    }
    if(velden.ohw&&velden.ohw!=='null')applyOrConflict('financieel_wip',cleanGetal(velden.ohw),'Onderhanden werk');

    setIfEmpty('financieel_debiteurenOud',velden.debiteuren_oud||velden.debiteuren_90_dagen||velden.old_debiteuren_pct);

  }
  if(true){
    setIfEmpty('compliance_nba',velden.nba_status||velden.nba||velden.nba_inschrijving);
    setIfEmpty('compliance_afm',velden.afm_vergunning||velden.afm||velden.vergunning);
    setIfEmpty('compliance_toetsDatum',velden.kwaliteitstoetsing_jaar||velden.toetsing_datum||velden.laatste_toetsing);
    setIfEmpty('compliance_toetsOordeel',velden.kwaliteitstoetsing_oordeel||velden.toetsing_oordeel||velden.oordeel_toetsing);
    setIfEmpty('compliance_tuchtzaken',velden.tuchtzaken||velden.lopende_tuchtzaken);
    setIfEmpty('compliance_claims',velden.claims||velden.civiele_claims);

async function consolideerAnalyse(faseId){
  var docs=getDocsForFase(faseId);if(!docs.length)return;
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  var gc={};
  docs.forEach(function(d){
    if(!d.velden)return;
    Object.keys(d.velden).forEach(function(k){var v=d.velden[k];if(v&&v!=='null'&&v!==null&&!gc[k])gc[k]=v;});
    if(d.velden.omzet_per_jaar&&typeof d.velden.omzet_per_jaar==='object'){
      if(!gc.omzet_per_jaar)gc.omzet_per_jaar={};
      Object.keys(d.velden.omzet_per_jaar).forEach(function(jr){var v=d.velden.omzet_per_jaar[jr];if(v&&v!=='null'&&!gc.omzet_per_jaar[jr])gc.omzet_per_jaar[jr]=v;});
    }
  });
  autoFillFromExtraction(faseId,gc);
  S.aiLoading[faseId]=true;renderApp();
  var lines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];if(v&&!df.header)lines.push(df.label+': '+v);});
  var analyses=docs.map(function(d,i){return 'Doc '+(i+1)+': '+d.naam+'\n'+(d.analyse||'');}).join('\n---\n');
  var prompt='Geconsolideerde M&A analyse voor fase '+f.title+' van '+esc(S.traject&&S.traject.kantoor_naam||S.code)+'.\n\nVelden:\n'+(lines.join('\n')||'leeg')+'\n\nAnalyses:\n'+analyses+'\n\nTrends, rode vlaggen, aanbevelingen. Concreet. ## koppen.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader(),dec=new TextDecoder(),col='';
    while(true){var res=await reader.read();if(res.done)break;
      dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){
        if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;
          try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)col+=j.delta.text;}catch(e){}
        }
      });
    }
    S.aiTexts[faseId]=col;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

          + '<span style="font-size:11px">🚫</span>'

function handleFileUpload(event, faseId) {
  var files = event.target.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
  event.target.value = '';
}

function handleDropUpload(event, faseId) {
  var files = event.dataTransfer.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
}

    var d = await r.json();
    if(r.ok && !d.error) {
      S.traject = d.traject;
      S.data = {};
      S.checked = {};
      if(d.data && d.data.length) loadDataFromDB(d.data);
      S.rol = d.rol;
      S.modules = d.modules || S.modules || null;

    } else {
      toast(d.error||'Verversen mislukt','err',2000);

}

function parseGeld(s){if(!s)return 0;var n=String(s).replace(/[^0-9,.]/g,'').replace(',','.');return parseFloat(n)||0;}
function fmtGeld(n){if(!n||isNaN(n))return '—';if(n>=1000000)return '€'+(n/1000000).toFixed(2)+' mln';if(n>=1000)return '€'+(n/1000).toFixed(0)+'.000';return '€'+Math.round(n);}

// ===== DEALVOORSTEL: parameters, berekeningen, weergave =====
function dvMln(n){return (n/1000000).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});}
function dvPct(n){return n.toLocaleString('nl-NL',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
function dvMultiple(n){return n.toLocaleString('nl-NL',{minimumFractionDigits:1,maximumFractionDigits:1})+'×';}

function dvGetDefaults(){
  var t=S.traject||{};
  var sectorProfiel=getSectorProfiel();
  var normen=sectorProfiel.aiNormen||'';
  var mMatch=normen.match(/multiple\s*([\d.,]+)\s*[-–]\s*([\d.,]+)x/i);
  var mLaag=mMatch?parseFloat(mMatch[1].replace(',','.')):4.5;
  var mHoog=mMatch?parseFloat(mMatch[2].replace(',','.')):5.5;
  var ebBasis=parseGeld(S.data['financieel_ebitdaNorm']||S.data['financieel_ebitda']||'0');
  return {
    koperNaam:t.koper_naam||'',
    belangPct:51,
    ebitdaBewezen:ebBasis||0,
    ebitdaPrognose:ebBasis?Math.round(ebBasis*1.3):0,
    multipleBasis:mLaag,
    multipleBovengrens:mHoog,
    cliffPct:70,
    escrowPct:12,
    escrowMaanden:18,
    bankLeverage:2,
    rentePct:5,
    vpbPct:25.8,
    capexPct:1.5,
    groeiPct:4,
    horizonJaren:5,
    buyAndBuild:false,
    baOvernamesPerJaar:2,
    baOmvangEbitda:1400000,
    baAcqMultiple:5.5,
    baPlatformMultipleMax:9.5,
    baAcqSchuldPct:55,
    baAflossingPct:15
  };
}

// Glijdende-schaal prijsmechanisme: multiple loopt lineair van multipleBasis (bij de cliff-drempel)
// naar multipleBovengrens (bij of boven de prognose); onder de cliff geldt de vaste basis-multiple als
// harde ondergrens, boven de prognose wordt de bovengrens niet verder verhoogd.
function dvBerekenPrijsmechanisme(p){
  var cliff=p.ebitdaPrognose*(p.cliffPct/100);
  function multipleVoor(ebitda){
    if(!p.ebitdaPrognose||ebitda<=cliff) return p.multipleBasis;
    if(ebitda>=p.ebitdaPrognose) return p.multipleBovengrens;
    var frac=(ebitda-cliff)/(p.ebitdaPrognose-cliff);
    return p.multipleBasis+frac*(p.multipleBovengrens-p.multipleBasis);
  }
  var scenarios=[
    {label:'Cliff — serieuze misser',ebitda:cliff*0.9},
    {label:'Deels gerealiseerd',ebitda:cliff+(p.ebitdaPrognose-cliff)*0.5},
    {label:'Prognose gehaald',ebitda:p.ebitdaPrognose},
    {label:'Ruim boven prognose',ebitda:p.ebitdaPrognose*1.12}
  ];
  return scenarios.map(function(s){
    var mult=multipleVoor(s.ebitda);
    var ev=s.ebitda*mult;
    var deelKoper=ev*(p.belangPct/100);
    var deelVerkoper=ev*(1-p.belangPct/100);
    return {label:s.label,ebitda:s.ebitda,multiple:mult,ev:ev,deelKoper:deelKoper,deelVerkoper:deelVerkoper};
  });
}

// Bedrag bij closing (op bewezen EBITDA × basis-multiple) en de earn-up (verschil met het prognose-scenario)
function dvBerekenClosing(p){
  var evBasis=p.ebitdaBewezen*p.multipleBasis;
  var deelKoperBasis=evBasis*(p.belangPct/100);
  var deelVerkoperBasis=evBasis*(1-p.belangPct/100);
  var evPrognose=p.ebitdaPrognose*p.multipleBovengrens;
  var deelKoperPrognose=evPrognose*(p.belangPct/100);
  var earnUp=Math.max(0,deelKoperPrognose-deelKoperBasis);
  return {evBasis:evBasis,deelKoperBasis:deelKoperBasis,deelVerkoperBasis:deelVerkoperBasis,evPrognose:evPrognose,deelKoperPrognose:deelKoperPrognose,earnUp:earnUp};
}

// Meerjarig kasstroom-/schuldafbouwmodel (realisatie-scenario: prognose wordt gehaald, earn-up in jaar 1 uitgekeerd).
// Capex is vereenvoudigd als percentage van EBITDA (geen aparte omzetprognose beschikbaar in dit model).
function dvBerekenSchuldafbouw(p,closing){
  var rows=[];
  var huidigJaar=new Date().getFullYear();
  var nettoSchuld=p.ebitdaBewezen*p.bankLeverage;
  var ebitda=p.ebitdaBewezen;
  rows.push({jaar:'Closing ('+huidigJaar+')',ebitda:ebitda,rente:0,vpb:0,capex:0,fcf:0,earnUp:0,nettoSchuld:nettoSchuld,leverage:ebitda?nettoSchuld/ebitda:0});
  for(var j=1;j<=p.horizonJaren;j++){
    ebitda = j===1 ? (p.ebitdaPrognose||ebitda) : ebitda*(1+p.groeiPct/100);
    var rente=nettoSchuld*(p.rentePct/100);
    var vpb=Math.max(0,ebitda-rente)*(p.vpbPct/100);
    var capex=ebitda*(p.capexPct/100);
    var earnUp=j===1?closing.earnUp:0;
    var fcf=ebitda-rente-vpb-capex;
    nettoSchuld=Math.max(0,nettoSchuld-fcf+earnUp);
    rows.push({jaar:String(huidigJaar+j),ebitda:ebitda,rente:rente,vpb:vpb,capex:capex,fcf:fcf,earnUp:earnUp,nettoSchuld:nettoSchuld,leverage:ebitda?nettoSchuld/ebitda:0});
  }
  return rows;
}

// Vereenvoudigd buy-and-build platformscenario: N overnames/jaar van gemiddelde omvang, platformmultiple
// loopt lineair op naar het opgegeven maximum. Acquisitieschuld is een vast percentage van de acquisitiewaarde;
// bestaande schuld wordt jaarlijks met een indicatief percentage afgelost.
function dvBerekenBuyAndBuild(p,laatsteSchuldRow){
  var rows=[];
  var groepsEbitda=laatsteSchuldRow.ebitda;
  var nettoSchuld=laatsteSchuldRow.nettoSchuld;
  var multipleStart=p.multipleBovengrens;
  var huidigJaar=new Date().getFullYear()+p.horizonJaren;
  for(var j=1;j<=5;j++){
    var acqEbitda=p.baOvernamesPerJaar*p.baOmvangEbitda;
    var acqSchuld=acqEbitda*p.baAcqMultiple*(p.baAcqSchuldPct/100);
    groepsEbitda+=acqEbitda;
    nettoSchuld=Math.max(0,nettoSchuld*(1-p.baAflossingPct/100)+acqSchuld);
    var multiple=Math.min(p.baPlatformMultipleMax, multipleStart+(p.baPlatformMultipleMax-multipleStart)*(j/5));
    var ev=groepsEbitda*multiple;
    var koperWaarde=ev*(p.belangPct/100);
    rows.push({jaar:String(huidigJaar+j),deals:p.baOvernamesPerJaar,acqEbitda:acqEbitda,groepsEbitda:groepsEbitda,nettoSchuld:nettoSchuld,leverage:nettoSchuld/groepsEbitda,multiple:multiple,ev:ev,koperWaarde:koperWaarde});
  }
  return rows;
}

function dvFmtTekst(t){
  if(!t) return '';
  t=t.replace(/^(##+ .+)/gm,function(m){return '<h3>'+m.replace(/^#+\s*/,'')+'</h3>';});
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return t.split(/\n\n+/).map(function(p){
    p=p.trim();if(!p)return '';
    if(p.indexOf('<h3>')===0)return p;
    if(/^[-•]\s/m.test(p)){
      var items=p.split(/\n/).map(function(l){return l.replace(/^[-•]\s/,'');}).filter(Boolean);
      return '<ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
    }
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
}

function dvBouwRapportHtml(aiTekst,tabelMap){

  var html='';
  for(var i=0;i<parts.length;i++){
    html += (i%2===0) ? dvFmtTekst(parts[i]) : (tabelMap[parts[i]]||'');
  }
  return html;
}

function dvHtmlNaarTekst(html){

    .replace(/<\/t[hd]>/g,'  |  ')
    .replace(/<li>(.*?)<\/li>/g,'- $1\n')
    .replace(/<\/p>/g,'\n')
    .replace(/<br>/g,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function renderWaardering(){
  var t=S.traject||{};
  var isRO=isKoper();

  // Haal data op uit S.data
  var o1=parseGeld(S.data['financieel_omzet1']);
  var o2=parseGeld(S.data['financieel_omzet2']);
  var o3=parseGeld(S.data['financieel_omzet3']);
  var ebitdaPct=parseFloat(S.data['financieel_ebitda'])||0;
  var fte=parseFloat(S.data['partner_fte'])||0;
  var recurring=parseFloat(S.data['commercieel_recurring'])||0;
  var churn=parseFloat(S.data['commercieel_churn'])||0;

  // Multiples (sectornorm)
  var mLaag=4.6,mMid=5.05,mHoog=5.5,omzetFactor=0.8,risico=0;

  // Bereken
  var ebitdaAmt=o3*(ebitdaPct/100);
  var wLaag=ebitdaAmt*mLaag;
  var wMid=ebitdaAmt*mMid;
  var wHoog=ebitdaAmt*mHoog;
  var wOmzet=o3*omzetFactor;

  // Groei
  var groei=0,steps=0;
  if(o1>0&&o2>0){groei+=(o2-o1)/o1*100;steps++;}
  if(o2>0&&o3>0){groei+=(o3-o2)/o2*100;steps++;}
  var gemGroei=steps>0?groei/steps:3;
  var fc=[o3];
  for(var i=1;i<=3;i++)fc.push(fc[fc.length-1]*(1+gemGroei/100));
  var fcE=fc.map(function(o){return o*(ebitdaPct/100);});
  var fcW=fcE.map(function(e){return e*mMid;});

  // Earn-out default
  var earnBase=wMid;
  var earnPct=20,earnTarget=5,earnJaren=3;
  var fixedKoop=earnBase*(1-earnPct/100);
  var earnJaarlijks=earnBase*(earnPct/100)/earnJaren;

  var html='<div class="wrap anim">'
    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; Waardering'+versieLabel()+'</div>'

    +'<button class="btn-ghost btn-sm" onclick="window.print()">PDF</button>'
    +'<button class="btn-ghost btn-sm" onclick="S.screen=\'cover\';renderApp()">&#8592; Terug</button>'
    +'</div></div>'
    +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;color:var(--head);font-weight:600;margin-bottom:.25rem">Waardebepaling</div>'

  // Disclaimer
  html+='<div style="background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:1.5rem;font-size:12px;color:var(--mid);line-height:1.6">'
    +'<strong style="color:var(--gold)">&#9888; Indicatieve waardering</strong> &mdash; Deze berekening is gebaseerd op de ingevoerde due diligence data en sectorale benchmarks. Het betreft een indicatie, geen formeel taxatierapport. Bisschops Financing BV aanvaardt geen aansprakelijkheid voor beslissingen op basis van dit overzicht.'
    +'</div>';

  // Financieel overzicht
  html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">Financiële basis</div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'
    +'<div style="text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:.2rem">Omzet jaar 1</div><div style="font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;color:var(--sub)">'+fmtGeld(o1)+'</div></div>'
    +'<div style="text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:.2rem">Omzet jaar 2</div><div style="font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;color:var(--sub)">'+fmtGeld(o2)+'</div></div>'
    +'<div style="text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:.2rem">Omzet jaar 3</div><div style="font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;color:var(--teal)">'+fmtGeld(o3)+'</div></div>'
    +'<div style="text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:.2rem">EBITDA</div><div style="font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;color:var(--teal)">'+fmtGeld(ebitdaAmt)+' ('+ebitdaPct+'%)</div></div>'
    +'</div></div>';

  // Waardebepaling as-is
  html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">Waardebepaling as-is (EBITDA-methode)</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:.75rem">'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;text-align:center">'
      +'<div style="font-size:10px;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.06em">Laag ('+mLaag+'\xd7)</div>'
      +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;font-weight:600;color:var(--mid)">'+fmtGeld(wLaag)+'</div></div>'
    +'<div style="background:var(--teal-bg);border:2px solid var(--teal-dark);border-radius:var(--r2);padding:1rem;text-align:center">'
      +'<div style="font-size:10px;color:var(--teal-dim);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600">Midden ('+mMid+'\xd7)</div>'
      +'<div style="font-family:Playfair Display,serif;font-size:1.8rem;font-weight:600;color:var(--teal)">'+fmtGeld(wMid)+'</div></div>'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;text-align:center">'
      +'<div style="font-size:10px;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.06em">Hoog ('+mHoog+'\xd7)</div>'
      +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;font-weight:600;color:var(--mid)">'+fmtGeld(wHoog)+'</div></div>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--mid);padding:.6rem .75rem;background:var(--card);border-radius:var(--r)">'
      +'Omzetmethode ('+omzetFactor+'\xd7): <strong>'+fmtGeld(wOmzet)+'</strong>'
      +(recurring>0?' &nbsp;|&nbsp; Recurring: <strong>'+recurring+'%</strong>':'')
      +(churn>0?' &nbsp;|&nbsp; Churn: <strong>'+churn+'%</strong>':'')
    +'</div></div>';

  // Rolling forecast
  html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">Rolling forecast (3 jaar)</div>'
    +'<div style="font-size:12px;color:var(--mid);margin-bottom:.75rem">Gem. historische groei: <strong style="color:var(--sub)">'+gemGroei.toFixed(1)+'%</strong>/jaar</div>'
    +'<table style="width:100%;border-collapse:collapse"><thead><tr>'
    +'<th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Jaar</th>'
    +'<th style="text-align:right;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Omzet</th>'
    +'<th style="text-align:right;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">EBITDA</th>'
    +'<th style="text-align:right;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Waardebandreedte</th>'
    +'</tr></thead><tbody>';
  var jLabels=['Huidig','Jaar +1','Jaar +2','Jaar +3'];
  for(var j=0;j<4;j++){
    html+='<tr style="'+(j===0?'background:var(--teal-bg)':'')+'">'
      +'<td style="padding:8px 10px;font-size:12px;font-weight:'+(j===0?'600':'400')+';color:var(--sub);border-bottom:1px solid var(--border)">'+jLabels[j]+'</td>'
      +'<td style="padding:8px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;border-bottom:1px solid var(--border)">'+fmtGeld(fc[j])+'</td>'
      +'<td style="padding:8px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--teal);border-bottom:1px solid var(--border)">'+fmtGeld(fcE[j])+'</td>'
      +'<td style="padding:8px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--mid);border-bottom:1px solid var(--border)">'+fmtGeld(fcW[j]*(mLaag/mMid))+' \u2013 '+fmtGeld(fcW[j]*(mHoog/mMid))+'</td>'
      +'</tr>';
  }
  html+='</tbody></table></div>';

  // Earn-out
  html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">Earn-out structuur (indicatief)</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:.75rem">'
    +'<div style="background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:.75rem 1rem">'
      +'<div style="font-size:10px;color:var(--teal-dim);font-weight:600;text-transform:uppercase;margin-bottom:.3rem">Koopsom bij closing</div>'
      +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;font-weight:600;color:var(--teal)">'+fmtGeld(fixedKoop)+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:.2rem)">'+(100-earnPct)+'% van totale waarde</div>'
    +'</div>'
    +'<div style="background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--r);padding:.75rem 1rem">'
      +'<div style="font-size:10px;color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:.3rem">Earn-out ('+earnJaren+' jaar)</div>'
      +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;font-weight:600;color:var(--gold)">'+fmtGeld(earnBase*(earnPct/100))+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:.2rem">'+earnPct+'% bij '+earnTarget+'% omzetgroei/jaar</div>'
    +'</div></div>'
    +'<table style="width:100%;border-collapse:collapse"><thead><tr>'
    +'<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)">Moment</th>'
    +'<th style="text-align:right;padding:6px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)">Omzet target</th>'
    +'<th style="text-align:right;padding:6px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)">Uitkering</th>'
    +'<th style="text-align:right;padding:6px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)">Cumulatief</th>'
    +'</tr></thead><tbody>';
  var cumul=fixedKoop;
  html+='<tr style="background:var(--teal-bg)"><td style="padding:6px 10px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--border)">Closing</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--border)">—</td><td style="padding:6px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--teal);border-bottom:1px solid var(--border)">'+fmtGeld(fixedKoop)+'</td><td style="padding:6px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--teal);border-bottom:1px solid var(--border)">'+fmtGeld(cumul)+'</td></tr>';
  for(var k=1;k<=earnJaren;k++){
    var tgt=o3*Math.pow(1+earnTarget/100,k);
    cumul+=earnJaarlijks;
    html+='<tr><td style="padding:6px 10px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--border)">Jaar '+k+'</td>'
      +'<td style="padding:6px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;border-bottom:1px solid var(--border)">'+fmtGeld(tgt)+'</td>'
      +'<td style="padding:6px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--gold);border-bottom:1px solid var(--border)">'+fmtGeld(earnJaarlijks)+'</td>'
      +'<td style="padding:6px 10px;font-size:12px;font-family:IBM Plex Mono,monospace;text-align:right;border-bottom:1px solid var(--border)">'+fmtGeld(cumul)+'</td></tr>';
  }
  html+='<tr style="background:var(--card)"><td style="padding:6px 10px;font-size:12px;font-weight:600;color:var(--sub)">Totaal</td><td></td><td style="padding:6px 10px;font-size:12px;font-weight:600;font-family:IBM Plex Mono,monospace;text-align:right;color:var(--sub)">'+fmtGeld(earnBase)+'</td><td></td></tr>';
  html+='</tbody></table></div>';

  // AI rapport knop (alleen tussenpersoon)
  if(isTussen()){
    html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
      +'<div id="w-ai-out" style="display:none;margin-bottom:1rem"></div>'
      +'<button class="btn" id="w-ai-btn" style="width:100%">&#9881; Genereer AI waarderingsrapport</button>'
      +'</div>';
  }

  html+='</div>';
  return html;
}

      else{eDiv.innerHTML=entries.map(function(e){
        var dt=new Date(e.created_at).toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        var isAdm=e.auteur_type==='admin';
        return '<div style="padding:.75rem 1rem;margin-bottom:.5rem;border-radius:var(--r);background:'+(isAdm?'var(--teal-bg)':'var(--panel)')+';border:1px solid '+(isAdm?'var(--teal-dark)':'var(--border)')+';border-left:3px solid '+(isAdm?'var(--teal)':'var(--gold)')+'">'

          +'<div style="font-size:13px;color:var(--sub);line-height:1.7;white-space:pre-wrap">'+esc(e.bericht)+'</div>'
          +'<div style="font-size:11px;color:var(--muted);margin-top:5px">'+esc(e.auteur)+' &middot; '+dt+'</div>'
          +'</div>';
      }).join('');eDiv.scrollTop=eDiv.scrollHeight;}
    }
  }catch(e){var ed=document.getElementById('lb-entries');if(ed)ed.innerHTML='<div style="color:var(--red);font-size:13px">Fout bij laden: '+e.message+'</div>';}

      var fase=document.getElementById('lb-fase').value;
      if(!bericht&&!fase){toast('Voer een notitie in of selecteer een fase.','warn');return;}
      lbBtn.disabled=true;lbBtn.textContent='Opslaan...';
      try{
        var lr=await fetch(WORKER+'/mna/logboek/'+S.code,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bericht:bericht,nieuwe_fase:fase||undefined,auteur_naam:S.traject.begeleider_naam||'Begeleider'})});
        var ld=await lr.json();
        if(ld.ok){document.getElementById('lb-bericht').value='';document.getElementById('lb-fase').value='';renderLogboekScreen(app);}
        else toast('Fout: '+(ld.error||'onbekend'),'err');
      }catch(e){toast('Verbindingsfout.','err');}
      lbBtn.disabled=false;lbBtn.textContent='+ Opslaan';
    });

    // Tab switching
    var tabNotitie=document.getElementById('lb-tab-notitie');
    var tabMeeting=document.getElementById('lb-tab-meeting');
    var panelNotitie=document.getElementById('lb-panel-notitie');
    var panelMeeting=document.getElementById('lb-panel-meeting');
    if(tabNotitie&&tabMeeting){
      tabNotitie.onclick=function(){
        panelNotitie.style.display='';panelMeeting.style.display='none';
        tabNotitie.className='btn';tabMeeting.className='btn-ghost';
        tabNotitie.style.fontSize='12px';tabNotitie.style.padding='6px 14px';
        tabMeeting.style.fontSize='12px';tabMeeting.style.padding='6px 14px';
      };
      tabMeeting.onclick=function(){
        panelNotitie.style.display='none';panelMeeting.style.display='';
        tabMeeting.className='btn';tabNotitie.className='btn-ghost';
        tabNotitie.style.fontSize='12px';tabNotitie.style.padding='6px 14px';
        tabMeeting.style.fontSize='12px';tabMeeting.style.padding='6px 14px';
      };
    }

    // Meeting AI structureren
    var meetBtn=document.getElementById('lb-meeting-submit');
    if(meetBtn)meetBtn.addEventListener('click',async function(){
      var titel=document.getElementById('lb-meeting-titel').value.trim();
      var deelnemers=document.getElementById('lb-meeting-deelnemers').value.trim();
      var tekst=document.getElementById('lb-meeting-tekst').value.trim();
      var fase=document.getElementById('lb-meeting-fase').value;
      if(!tekst){toast('Voer vergadernotities in.','warn');return;}
      meetBtn.disabled=true;meetBtn.textContent='AI verwerkt...';
      try{
        var prompt='Structureer de volgende ruwe vergadernotities van een M&A traject in de accountancy-sector naar een professioneel vergaderverslag.\n\nVERGADERING: '+(titel||'Vergadering')+' | Deelnemers: '+(deelnemers||'onbekend')+'\n\nRUWE NOTITIES:\n'+tekst+'\n\nGeef terug in dit formaat:\n\n## Vergadering: [titel]\nDatum: [datum indien bekend]\nDeelnemers: [deelnemers]\n\n### Samenvatting\n[2-4 zinnen kerninhoud]\n\n### Besproken punten\n- [punt 1]\n- [punt 2]\n\n### Beslissingen\n- [beslissing 1]\n\n### Actiepunten\n- [ ] [actie] — [wie] — [wanneer]\n\n### Volgende stap\n[wat staat er gepland]\n\nCompact en professioneel. Alleen wat relevant is voor het M&A traject.';
        var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})});
        var rawText=await resp.text();
        var rd;try{rd=JSON.parse(rawText);}catch(e){throw new Error('Geen JSON: '+rawText.substring(0,150));}
        if(!resp.ok)throw new Error('Fout: '+(rd.error||''));
        var gestructureerd=rd.text||'Fout bij verwerken.';
        // Sla op als logboeknotitie
        var lr=await fetch(WORKER+'/mna/logboek/'+S.code,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bericht:gestructureerd,nieuwe_fase:fase||undefined,auteur_naam:S.traject.begeleider_naam||'Begeleider'})});
        var ld=await lr.json();
        if(ld.ok){
          document.getElementById('lb-meeting-titel').value='';
          document.getElementById('lb-meeting-deelnemers').value='';
          document.getElementById('lb-meeting-tekst').value='';
          document.getElementById('lb-meeting-fase').value='';
          // Ga terug naar notitie tab en herlaad
          if(tabNotitie)tabNotitie.click();
          renderLogboekScreen(app);
        } else toast('Fout: '+(ld.error||'onbekend'),'err');
      }catch(e){toast('Fout: '+e.message,'err');}
      meetBtn.disabled=false;meetBtn.textContent='⚙ AI structureren & opslaan';
    });
  }
}

  async function stuurTussen(type) {
    var emailEl = document.getElementById('inv-'+type+'t-email');
    var stEl = document.getElementById('inv-'+type+'t-st');
    var btnEl = document.getElementById('inv-'+type+'t-btn');
    var email = emailEl.value.trim();
    if (!email) { stEl.innerHTML='<span style="color:var(--red)">E-mail verplicht</span>'; return; }
    btnEl.disabled=true; btnEl.textContent='Versturen...';
    var code = type==='v' ? t.id : t.koper_code;
    try {
      var res = await fetch(WORKER+'/mna/uitnodiging', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-tussen-key': S.code },
        body: JSON.stringify({
          code: code, type: type==='v' ? 'verkoper' : 'koper', to: email,
          trajectNaam: t.kantoor_naam||S.code,
          adviseur_naam: t.begeleider_naam||'', adviseur_email: t.begeleider_email||''
        })
      });
      var rd = await res.json();
      if (rd.ok) { stEl.innerHTML='<span style="color:var(--teal)">&#10003; Verstuurd</span>'; btnEl.textContent='&#10003; Ok'; }
      else { stEl.innerHTML='<span style="color:var(--red)">'+esc(rd.error||'Fout')+'</span>'; btnEl.disabled=false; btnEl.textContent='Opnieuw'; }
    } catch(e) { stEl.innerHTML='<span style="color:var(--red)">Verbindingsfout</span>'; btnEl.disabled=false; }
  }
  document.getElementById('inv-vt-btn').onclick = function(){ stuurTussen('v'); };
  document.getElementById('inv-kt-btn').onclick = function(){ stuurTussen('k'); };
}

    +'<button id="kt-ok" style="background:#1a7a5e;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">Opslaan</button>'
    +'</div>';

    var btn=this;btn.disabled=true;btn.textContent='Opslaan...';

    async function verstuur(force){

          if(!bggRecActief){
            bggRec=new SpeechRec();bggRec.lang='nl-NL';bggRec.continuous=true;bggRec.interimResults=true;
            var base=document.getElementById('bgg-notities').value,interim='';
            bggRec.onresult=function(ev){interim='';var fin='';for(var i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)fin+=ev.results[i][0].transcript+' ';else interim+=ev.results[i][0].transcript;}if(fin){base+=(base&&!base.endsWith(' ')?'\n':'')+fin;}document.getElementById('bgg-notities').value=base+interim;};
            bggRec.onerror=function(e){if(recSt)recSt.textContent='Fout: '+e.error;bggRecActief=false;if(recBtn)recBtn.textContent='&#127908; Opnemen';};
            bggRec.onend=function(){if(bggRecActief){bggRec.start();}};
            bggRec.start();bggRecActief=true;recBtn.textContent='⏹ Stop opname';if(recSt)recSt.textContent='Opname actief...';
          } else {
            bggRec.stop();bggRecActief=false;recBtn.textContent='&#127908; Opnemen';if(recSt)recSt.textContent='';
          }
        };
      }

      // AI-verslag genereren
      var aiBtn=document.getElementById('bgg-ai-btn');
      var aiSt=document.getElementById('bgg-ai-st');
      if(aiBtn){
        aiBtn.onclick=async function(){
          var notities=(document.getElementById('bgg-notities').value||'').trim();
          if(!notities){if(aiSt)aiSt.textContent='Voer eerst notities in.';return;}
          aiBtn.disabled=true;if(aiSt)aiSt.textContent='Genereren...';
          var prompt='Maak professioneel gespreksverslag M&A traject.\n\nGesprek: '+document.getElementById('bgg-type').value+' | Datum: '+document.getElementById('bgg-datum').value+' | Deelnemers: '+(document.getElementById('bgg-deelnemers').value||'onbekend')+'\n\nNOTITIES:\n'+notities+'\n\nFormaat: ## Samenvatting, ## Besproken punten, ## Beslissingen, ## Actiepunten, ## Volgende stap';
          var rd=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})}).then(function(r){return r.json();}).catch(function(){return{};});
          document.getElementById('bgg-verslag').value=rd.text||'';
          aiBtn.disabled=false;if(aiSt)aiSt.textContent='✓ Verslag gegenereerd';
        };
      }

      // Concept auto-opslaan
      var bggTimer = null;
      ['bgg-datum','bgg-type','bgg-deelnemers','bgg-zicht','bgg-notities','bgg-verslag'].forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.addEventListener('input',function(){
          clearTimeout(bggTimer);
          bggTimer = setTimeout(function(){
            var ind = document.getElementById('bgg-concept-ind');
            fetch(WORKER+'/mna/gesprek/concept',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({code:S.code,datum:document.getElementById('bgg-datum').value,
                deelnemers:document.getElementById('bgg-deelnemers').value,
                type:document.getElementById('bgg-type').value,
                verslag:document.getElementById('bgg-verslag').value,
                zichtbaar_voor:document.getElementById('bgg-zicht').value,
                auteur:S.traject&&S.traject.begeleider_naam||'Begeleider'})
            });
            if(ind) ind.textContent = 'Concept opgeslagen '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
          }, 2000);
        });
      });

      // Definitief opslaan
      mo.querySelector('#bgg-ok').onclick = async function(){
        var datum = document.getElementById('bgg-datum').value;
        var err = document.getElementById('bgg-err');
        if(!datum){err.style.display='block';err.textContent='Datum is verplicht.';return;}
        var payload = {
          datum: datum,
          deelnemers: document.getElementById('bgg-deelnemers').value.trim(),
          type: document.getElementById('bgg-type').value,
          ruwe_notities: document.getElementById('bgg-notities').value.trim(),
          verslag: document.getElementById('bgg-verslag').value.trim(),
          zichtbaar_voor: document.getElementById('bgg-zicht').value
        };
        if(g.id) payload.id = g.id;
        var btn = this; btn.disabled=true; btn.textContent='Opslaan...';
        var r = await fetch(WORKER+'/mna/admin/gesprekken/'+S.traject.id,{
          method:'POST',headers:{'Content-Type':'application/json','x-tussen-key':S._bgKey||''},
          body:JSON.stringify(payload)
        }).then(function(x){return x.json();}).catch(function(){return{};});
        if(r.ok){
          fetch(WORKER+'/mna/gesprek/concept/delete/'+S.code,{method:'POST'}).catch(function(){});
          document.body.removeChild(ov);
          toast('Gesprek opgeslagen.','ok');
          laadBgGesprekken();
        } else {
          err.style.display='block';err.textContent='Fout: '+(r.error||'onbekend');
          btn.disabled=false;btn.textContent='&#128190; Definitief opslaan';
        }
      };
    }

    laadBgGesprekken();
  }

  function fmt(t) {
    if(!t) return '';
    t = t.replace(/^(Artikel \d+[^\n]*)/gm, '<h3>$1</h3>');
    t = t.replace(/^(##+ .+)/gm, function(m){ return '<h3>'+m.replace(/^#+\s*/,'')+'</h3>'; });
