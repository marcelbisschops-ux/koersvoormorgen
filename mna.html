*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f label .req{color:var(--red)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus{border-color:var(--teal)}
.f input.missing{border-color:var(--red);background:var(--red-bg)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
/* Checklist - only for MNA view */
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
/* AI panel */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
/* Fase grid */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.save-indicator{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}

.cover-letter{background:var(--panel);border:2px solid var(--teal);border-radius:var(--r2);padding:2rem;margin-bottom:1.5rem}

.cover-letter p{font-size:13px;color:var(--mid);margin-bottom:.75rem;line-height:1.75}

.missing-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem}
.missing-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.missing-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--red);border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none}
.complete-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--teal);border-bottom:1px solid var(--border)}
.complete-item:last-child{border-bottom:none}

.readonly-val.empty{color:var(--muted);font-style:italic}

.doc-veld-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dim);font-weight:600}
.doc-veld-val{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);font-weight:600}
.upload-progress{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:.5rem;display:none}
.upload-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
.btn-del{background:transparent;border:1px solid var(--border2);color:var(--red);font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:var(--r)}
.btn-del:hover{background:var(--red-bg);border-color:var(--red)}
@keyframes prog{from{width:20%}to{width:85%}}
@media print{
  @page{margin:2cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.prog-bar{display:none!important}
  .ai-panel,.panel{break-inside:avoid}
  body{font-size:11px}
}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:13px;color:var(--sub);box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:flex-start;gap:10px;max-width:340px;pointer-events:auto;animation:toastIn .25s ease forwards;border-left:4px solid var(--teal)}
.toast.toast-ok{border-left-color:var(--teal)}.toast.toast-err{border-left-color:var(--red)}.toast.toast-warn{border-left-color:var(--gold)}.toast.toast-info{border-left-color:#2a5ea0}
.toast.hide{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
</style>

var SEC = {
  SESSION_MS: 8 * 60 * 60 * 1000,   // 8 uur sessieduur
  WARN_MS:    15 * 60 * 1000,        // waarschuwing 15 min voor expiry
  LOGIN_COOLDOWN_MS: 2000,           // 2 sec tussen loginpogingen
  MAX_ATTEMPTS: 10,                  // max pogingen per sessie
  loginAt: 0,
  lastActivity: 0,
  attempts: 0,
  lastAttemptAt: 0,
  _expTimer: null,
  _warnTimer: null,
  _actTimer: null
};

function secReset() {
  SEC.loginAt = 0; SEC.lastActivity = 0; SEC.attempts = 0;
  clearTimeout(SEC._expTimer); clearTimeout(SEC._warnTimer); clearTimeout(SEC._actTimer);
}

function secStartSession() {
  var now = Date.now();
  SEC.loginAt = now; SEC.lastActivity = now;
  clearTimeout(SEC._expTimer); clearTimeout(SEC._warnTimer);
  SEC._warnTimer = setTimeout(function() {
    if (S.screen !== 'login') {
      toast('Uw sessie verloopt over 15 minuten. Sla uw werk op of log opnieuw in om door te gaan.', 'warn', 8000);
    }
  }, SEC.SESSION_MS - SEC.WARN_MS);
  SEC._expTimer = setTimeout(function() {
    if (S.screen !== 'login') {
      toast('Sessie verlopen — u wordt automatisch uitgelogd.', 'warn', 4000);
      setTimeout(function() { uitloggen(); }, 2000);
    }
  }, SEC.SESSION_MS);
}

function secActivity() {
  SEC.lastActivity = Date.now();
}

function secCanLogin() {
  var now = Date.now();
  if (SEC.attempts >= SEC.MAX_ATTEMPTS) {
    toast('Te veel pogingen. Herlaad de pagina om opnieuw te proberen.', 'err', 6000);
    return false;
  }
  if (now - SEC.lastAttemptAt < SEC.LOGIN_COOLDOWN_MS) {
    toast('Even wachten...', 'warn', 1500);
    return false;
  }
  SEC.lastAttemptAt = now;
  SEC.attempts++;
  return true;
}

async function uploadDocument(faseId, file) {
  if (!S.code || isKoper()) return;
  if (S.traject && S.traject.status === 'vergrendeld') { toast('Traject is vergrendeld.','warn'); return; }
  var maxSize = 20 * 1024 * 1024;
  if (file.size > maxSize) { toast('Bestand te groot (max 20MB). Huidig: ' + Math.round(file.size/1024/1024) + 'MB','warn'); return; }

  // Show uploading state
  if (!DOCS[faseId]) DOCS[faseId] = [];
  var tempId = 'uploading_' + Date.now();
  DOCS[faseId].unshift({ id: tempId, naam: file.name, type: file.type, grootte: file.size, analyse: '', velden: {}, uploading: true });
  renderApp();

  var formData = new FormData();
  formData.append('file', file);
  var bewaar = S.traject && S.traject.bewaar_docs !== false;
  var url = WORKER + '/mna/document/upload?code=' + S.code + '&fase_id=' + faseId + '&bewaar=' + bewaar;

  try {
    var resp = await fetch(url, { method: 'POST', body: formData });
    var d = await resp.json();
    if (d.ok) {
      // Replace temp with real
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      DOCS[faseId].unshift({
        id: d.doc_id, naam: file.name, type: file.type, grootte: file.size,
        analyse: d.analyse, velden: d.veld_extractie || {}, bewaard: !!d.r2_opgeslagen,
        uploaded_at: Date.now(), uploading: false, verworpen: !!d.verworpen, verworpen_reden: d.verworpen_reden||null
      });
      if (d.veld_extractie) {
        S._conflicts=[];
        autoFillFromExtraction(faseId, d.veld_extractie, false, file.name);
        if(S._conflicts&&S._conflicts.length){
          renderApp();setTimeout(toonConflictDialog,300);
        }else{renderApp();schedSave();}
      }
      // Toon crosscheck waarschuwingen
      if((d.crosschecks&&d.crosschecks.length)||(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam)){
        var msgs=[];
        // Entiteit check
        if(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam){
          var n1=(d.entiteit_naam||'').toLowerCase(),n2=(S.traject.kantoor_naam||'').toLowerCase();
          if(!n1.includes(n2.split(' ')[0])&&!n2.includes(n1.split(' ')[0]))
            msgs.push('⚠ Entiteit in document ("'+d.entiteit_naam+'") wijkt af van kantoornaam ("'+S.traject.kantoor_naam+'")');
        }
        if(d.crosschecks)msgs=msgs.concat(d.crosschecks);
        if(msgs.length){
          var md='<div style="background:#fff8f0;border:1px solid #e8a84c;border-radius:6px;padding:.75rem;margin:.5rem 0">'
            +'<div style="font-size:11px;font-weight:600;color:#8a5a00;margin-bottom:.4rem">⚠ Aandachtspunten bij '+esc(file.name)+'</div>'
            +msgs.map(function(m){return '<div style="font-size:12px;color:#5a4010;padding:2px 0">• '+esc(m)+'</div>';}).join('')
            +'</div>';
          // Toon onder de upload zone
          var uz=document.getElementById('upload-zone-'+faseId);
          if(uz){var w=document.createElement('div');w.innerHTML=md;uz.parentNode.insertBefore(w,uz.nextSibling);}
        }
      }
    } else {
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      toast('Upload fout: ' + (d.error || 'onbekend'),'err');
    }
  } catch(e) {
    DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
    toast('Verbindingsfout bij uploaden.','err');
  }
  renderApp();
}

// Centrale upload: verwerk bestanden en laat AI alle fases invullen
window.centraalUploadFiles = async function(files) {
  if(!files||!files.length)return;
  var totaal=files.length;
  var verwerkt=0;
  var fouten=0;

  // Status in een aparte vaste div buiten de render-cyclus
  var statusDiv=document.getElementById('centraal-upload-status');
  function toonStatus(html){
    // Zoek element opnieuw na elke renderApp
    var el=document.getElementById('centraal-upload-status');
    if(el)el.innerHTML=html;
  }
  function toonVoortgang(huidig,totaalN,naam){
    var pct=Math.round(huidig/totaalN*100);
    var breedte=Math.max(4,pct);
    toonStatus('<div style="margin-bottom:4px;font-size:12px;color:var(--teal)">&#9881; Bezig: <strong>'+naam+'</strong> ('+huidig+'/'+totaalN+')</div>'
      +'<div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--teal);height:100%;width:'+breedte+'%;transition:width .3s"></div></div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:3px">'+pct+'% — dit kan 15-30 seconden per bestand duren</div>');
  }

  for(var i=0;i<files.length;i++){
    var file=files[i];
    toonVoortgang(i+1,totaal,file.name);

    var naam=file.name.toLowerCase();
    var faseId='financieel';
    if(naam.includes('loon')||naam.includes('salaris')||naam.includes('personeel'))faseId='partner';
    else if(naam.includes('klant')||naam.includes('debiteur')||naam.includes('crm')||naam.includes('omzet'))faseId='commercieel';
    else if(naam.includes('contract')||naam.includes('juridisch')||naam.includes('kvk')||naam.includes('akte'))faseId='juridisch';
    else if(naam.includes('it')||naam.includes('software')||naam.includes('ict')||naam.includes('systeem'))faseId='it';
    else if(naam.includes('kwaliteit')||naam.includes('audit')||naam.includes('compliance')||naam.includes('avg'))faseId='compliance';
    else if(naam.includes('strateg')||naam.includes('markt')||naam.includes('plan'))faseId='strategisch';

    var formData=new FormData();
    formData.append('file',file);
    var bewaar=S.traject&&S.traject.bewaar_docs!==false;
    var url=WORKER+'/mna/document/upload?code='+S.code+'&fase_id='+faseId+'&bewaar='+bewaar;

    try{
      // 60 seconden timeout per bestand
      var controller=new AbortController();
      var timeoutId=setTimeout(function(){controller.abort();},45000);
      var resp=await fetch(url,{method:'POST',body:formData,signal:controller.signal});
      clearTimeout(timeoutId);
      var d=await resp.json();
      if(d.ok){
        if(!DOCS[faseId])DOCS[faseId]=[];
        DOCS[faseId].unshift({id:d.doc_id,naam:file.name,type:file.type,grootte:file.size,analyse:d.analyse||'',velden:d.veld_extractie||{},bewaard:!!d.r2_opgeslagen,uploaded_at:Date.now(),uploading:false});
        if(d.veld_extractie&&Object.keys(d.veld_extractie).length&&!d.verworpen){
          S._conflicts=[];
          autoFillFromExtraction(faseId,d.veld_extractie,false,file.name);
          if(faseId!=='financieel'&&(naam.includes('jaar')||naam.includes('balans')||naam.includes('winst'))){
            autoFillFromExtraction('financieel',d.veld_extractie,false,file.name);
          }
        }
        verwerkt++;
        // Toon verworpen melding direct en ga door
        if(d.verworpen&&d.verworpen_reden){
          var statusEl3=document.getElementById('centraal-upload-status');
          if(statusEl3)statusEl3.innerHTML=(statusEl3.innerHTML||'')+'<div style="background:#fff0f0;border:1px solid var(--red);border-radius:6px;padding:.5rem .75rem;margin-top:.4rem;font-size:12px;color:var(--red)">🚫 <strong>'+esc(file.name)+'</strong> genegeerd: '+esc(d.verworpen_reden)+'</div>';
          // Direct doorgaan naar volgend bestand
          renderApp();
          continue;
        }
        // Toon crosscheck waarschuwingen als die er zijn
        if(d.crosschecks&&d.crosschecks.length){
          var warnHtml='<div style="background:#fff8f0;border:1px solid #e8a84c;border-radius:6px;padding:.75rem;margin-top:.5rem">'
            +'<div style="font-size:11px;font-weight:600;color:#8a5a00;margin-bottom:.4rem">⚠ '+file.name+' — '+d.crosschecks.length+' aandachtspunt(en)</div>';
          d.crosschecks.forEach(function(w){warnHtml+='<div style="font-size:12px;color:#5a4010;padding:2px 0">• '+esc(w)+'</div>';});
          // Entiteit check
          if(d.entiteit_naam&&S.traject&&S.traject.kantoor_naam){
            var naam1=(d.entiteit_naam||'').toLowerCase();
            var naam2=(S.traject.kantoor_naam||'').toLowerCase();
            if(!naam1.includes(naam2.split(' ')[0])&&!naam2.includes(naam1.split(' ')[0])){
              warnHtml+='<div style="font-size:12px;color:#c0392b;padding:2px 0;font-weight:500">⚠ Entiteit in document ("'+esc(d.entiteit_naam)+'") wijkt af van kantoornaam ("'+esc(S.traject.kantoor_naam)+'") — controleer of dit het juiste bestand is.</div>';
            }
          }
          warnHtml+='</div>';
          var statusEl2=document.getElementById('centraal-upload-status');
          if(statusEl2)statusEl2.innerHTML=(statusEl2.innerHTML||'')+warnHtml;
        }
      } else {
        fouten++;
        toonStatus('<span style="color:var(--red)">Fout bij '+file.name+': '+(d.error||'onbekend')+'</span>');
      }
    }catch(e){
      fouten++;
      var msg=e.name==='AbortError'?'Timeout (90s) — probeer een kleiner bestand of upload PDF in plaats van CSV':e.message;
      toonStatus('<span style="color:var(--red)">Fout bij '+file.name+': '+msg+'</span>');
    }
  }

  // Sla eerst alle data op naar server VOORDAT renderApp de DOM overschrijft
  if(Object.keys(S.data).length) saveAll();

  // Render zodat gebruiker velden ziet
  renderApp();
  setTimeout(function(){
    toonStatus('<span style="color:var(--teal)">&#10003; '+verwerkt+' van '+totaal+' bestanden verwerkt'+(fouten?' ('+fouten+' fout)':'')+'. Controleer de velden hieronder.</span>');
  },500);
};

function autoFillFromExtraction(faseId, velden, forceOverwrite, docNaam) {
  var currentDocNaam = docNaam || 'onbekend document';
  // Directe keys (fase_id_veld_id formaat van CSV upload) direct in S.data zetten
  console.log('[autoFill] faseId:', faseId, 'velden keys:', Object.keys(velden).slice(0,10));
  Object.keys(velden).forEach(function(k){
    if(k.includes('_')&&!['omzet_per_jaar','ebitda_pct','omzet_jaarwerk_pct','omzet_advies_pct','omzet_loon_pct','omzet_fiscaal_pct','omzet_overig_pct','kosten_personeel_pct','kosten_huisvesting_pct','kosten_it_pct','kosten_marketing_pct'].includes(k)){
      var parts=k.split('_');
      // Check of het een fase_veld key is (bijv. financieel_omzet1)
      var knownFases=['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];
      if(knownFases.includes(parts[0])){
        var val=velden[k];
        if(val&&val!=='null'&&String(val).trim()!==''){
          if(forceOverwrite||!(S.data[k]||'').trim())S.data[k]=String(val);
        }
      }
    }
  });

  function setIfEmpty(key, val) {
    if(val&&val!=='null'&&val!==null&&String(val).trim()!==''&&!(S.data[key]||'').trim())
      S.data[key]=String(val);
  }
  function applyOrConflict(key, val, label) {
    if(!val||val==='null'||val===null||String(val).trim()==='')return;
    var newVal=String(val);
    var existing=(S.data[key]||'').trim();
    if(!existing){S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return;}
    if(existing===newVal)return;
    if(forceOverwrite){S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return;}
    // Alleen conflict tonen als de gebruiker dit veld zelf heeft ingevuld
    if(!S._userEdited||!S._userEdited[key]){
      S.data[key]=newVal;if(!S._docSource)S._docSource={};S._docSource[key]=currentDocNaam;return; // Stil overschrijven als niet user-edited
    }
    if(!S._conflicts)S._conflicts=[];
    if(!S._conflicts)S._conflicts=[];
    S._conflicts.push({key:key,label:label,huidig:existing,nieuw:newVal,bron:currentDocNaam});
    if(!S._pendingConflicts)S._pendingConflicts={};
    S._pendingConflicts[key]=newVal;
  }
  if(faseId==='financieel'){
    if(!S._opy)S._opy={};
    var opy=velden.omzet_per_jaar;
    if(opy&&typeof opy==='object'){
      Object.keys(opy).forEach(function(jaar){
        var v=opy[jaar],j=Number(jaar);
        if(v&&v!=='null'&&v!==null&&!isNaN(j)&&j>1990&&j<2100)S._opy[String(j)]=v;
      });
    }
    if(velden.omzet&&velden.omzet!=='null'&&velden.boekjaar&&!isNaN(Number(velden.boekjaar))){
      var bj=String(Number(velden.boekjaar));
      if(!S._opy[bj])S._opy[bj]=velden.omzet;
    }
    var yrs=Object.keys(S._opy).map(Number).filter(function(j){return!isNaN(j)&&j>1990&&j<2100;}).sort(function(a,b){return a-b;});
    if(yrs.length){
      // Altijd opnieuw mappen - juiste jaar altijd op juiste positie
      var toFill=yrs.slice(-3);
      var allFlds=['omzet1','omzet2','omzet3'];
      var usedFlds=allFlds.slice(3-toFill.length);
      // Vul correct in — maar wis NOOIT bestaande velden die al gevuld zijn
      toFill.forEach(function(yr,i){var w=S._opy[String(yr)];if(w)S.data['financieel_'+usedFlds[i]]=String(w);});
    }
    if(!S._epy)S._epy={};
    var ev=velden.ebitda_pct;
    if(ev&&ev!=='null'&&ev!==null){
      var ej=velden.boekjaar?String(Number(velden.boekjaar)):'0';
      if(!S._epy[ej])S._epy[ej]=ev;
      var eys=Object.keys(S._epy).map(Number).filter(function(j){return!isNaN(j);}).sort(function(a,b){return b-a;});
      if(eys.length)applyOrConflict('financieel_ebitda',S._epy[String(eys[0])],'EBITDA-marge (%)');
    }
    if(velden.ohw&&velden.ohw!=='null')applyOrConflict('financieel_wip',velden.ohw,'Onderhanden werk');
    if(velden.debiteuren&&velden.debiteuren!=='null')applyOrConflict('financieel_debiteuren',velden.debiteuren,'Debiteuren');
    setIfEmpty('financieel_ebitdaNorm',velden.resultaat);
    setIfEmpty('financieel_omzetJaarwerk',velden.omzet_jaarwerk_pct);
    setIfEmpty('financieel_omzetAdvies',velden.omzet_advies_pct);

    setIfEmpty('financieel_omzetOverig',velden.omzet_overig_pct);
    setIfEmpty('financieel_omzetYTD',velden.omzet_ytd||velden.ytd_omzet||velden.omzet_huidig_jaar);
    setIfEmpty('financieel_debiteurenOud',velden.debiteuren_oud||velden.debiteuren_90_dagen||velden.old_debiteuren_pct);
    setIfEmpty('financieel_declarab',velden.declarabiliteit||velden.declarab_pct);
    setIfEmpty('financieel_partnerBel',velden.partnerbeloning||velden.partner_beloning||velden.beloning_partners);
  }
  if(faseId==='partner'||velden.fte||velden.aantal_partners||velden.personeel_fte){
    setIfEmpty('partner_fte',velden.fte||velden.personeel_fte);
    setIfEmpty('partner_aantalP',velden.aantal_partners||velden.partners);
    setIfEmpty('partner_gemLeeftijd',velden.gem_leeftijd_partners||velden.leeftijd_partners);
    setIfEmpty('partner_omzetPerP',velden.omzet_per_partner);
    setIfEmpty('partner_pensioenP',velden.pensioen_partners||velden.partners_pensioen);
    setIfEmpty('partner_verloop',velden.personeelsverloop||velden.verloop_pct);
    setIfEmpty('partner_vacatures',velden.vacatures||velden.openstaande_vacatures);
    setIfEmpty('partner_raAa',velden.ra_aa_opleiding||velden.accountants_opleiding);
    setIfEmpty('partner_opvolging',velden.opvolgingskandidaat||velden.opvolging);
    setIfEmpty('partner_verandering',velden.veranderbereidheid||velden.bereidheid_verandering);
    setIfEmpty('partner_pContract',velden.partnerovereenkomsten||velden.partner_contract);
  }
  if(faseId==='commercieel'||velden.aantal_klanten){
    setIfEmpty('commercieel_aantalKlanten',velden.aantal_klanten||velden.actieve_klanten);
    setIfEmpty('commercieel_churn',velden.churn||velden.klantverloop||velden.churn_pct);
    setIfEmpty('commercieel_klantduur',velden.klantduur||velden.gem_klantduur||velden.gemiddelde_klantduur);
    setIfEmpty('commercieel_top1pct',velden.grootste_klant_pct||velden.top1_pct||velden.top_klant_pct);
    setIfEmpty('commercieel_top10pct',velden.top10_pct||velden.top10_klanten_pct);
    setIfEmpty('commercieel_recurring',velden.recurring||velden.recurring_pct||velden.abonnements_omzet);
    setIfEmpty('commercieel_crossSell',velden.cross_sell||velden.crosssell_pct);
    setIfEmpty('commercieel_nieuw',velden.nieuwe_klanten||velden.klanten_nieuw);
    setIfEmpty('commercieel_verlies',velden.verloren_klanten||velden.klanten_verlies);
  }
  if(faseId==='compliance'||velden.nba_status||velden.kwaliteitstoetsing){
    setIfEmpty('compliance_nba',velden.nba_status||velden.nba||velden.nba_inschrijving);
    setIfEmpty('compliance_afm',velden.afm_vergunning||velden.afm||velden.vergunning);
    setIfEmpty('compliance_toetsDatum',velden.kwaliteitstoetsing_jaar||velden.toetsing_datum||velden.laatste_toetsing);
    setIfEmpty('compliance_toetsOordeel',velden.kwaliteitstoetsing_oordeel||velden.toetsing_oordeel||velden.oordeel_toetsing);
    setIfEmpty('compliance_tuchtzaken',velden.tuchtzaken||velden.lopende_tuchtzaken);
    setIfEmpty('compliance_claims',velden.claims||velden.civiele_claims);
    setIfEmpty('compliance_wwft',velden.wwft||velden.wwft_procedures||velden.wwft_status);
    setIfEmpty('compliance_incidenten',velden.integriteitsincidenten||velden.incidenten);
  }
  if(faseId==='it'||velden.software_primair||velden.primaire_software){
    setIfEmpty('it_software',velden.software_primair||velden.primaire_software||velden.software);
    setIfEmpty('it_softwareOverig',velden.overige_systemen||velden.software_overig||velden.systemen);
    setIfEmpty('it_autoGraad',velden.automatiseringsgraad||velden.automgraad||velden.automatisering_pct);

    setIfEmpty('it_security',velden.cybersecurity||velden.security_status||velden.beveiliging);
    setIfEmpty('it_itRisico',velden.it_risicos||velden.bekende_risicos||velden.it_risico);

  if(faseId==='juridisch'||velden.rechtsvorm||velden.structuur){

async function consolideerAnalyse(faseId){
  var docs=getDocsForFase(faseId);if(!docs.length)return;
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  var gc={};
  docs.forEach(function(d){
    if(!d.velden)return;
    Object.keys(d.velden).forEach(function(k){var v=d.velden[k];if(v&&v!=='null'&&v!==null&&!gc[k])gc[k]=v;});
    if(d.velden.omzet_per_jaar&&typeof d.velden.omzet_per_jaar==='object'){
      if(!gc.omzet_per_jaar)gc.omzet_per_jaar={};
      Object.keys(d.velden.omzet_per_jaar).forEach(function(jr){var v=d.velden.omzet_per_jaar[jr];if(v&&v!=='null'&&!gc.omzet_per_jaar[jr])gc.omzet_per_jaar[jr]=v;});
    }
  });
  autoFillFromExtraction(faseId,gc);
  S.aiLoading[faseId]=true;renderApp();
  var lines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];if(v&&!df.header)lines.push(df.label+': '+v);});
  var analyses=docs.map(function(d,i){return 'Doc '+(i+1)+': '+d.naam+'\n'+(d.analyse||'');}).join('\n---\n');
  var prompt='Geconsolideerde M&A analyse voor fase '+f.title+' van '+esc(S.traject&&S.traject.kantoor_naam||S.code)+'.\n\nVelden:\n'+(lines.join('\n')||'leeg')+'\n\nAnalyses:\n'+analyses+'\n\nTrends, rode vlaggen, aanbevelingen. Concreet. ## koppen.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader(),dec=new TextDecoder(),col='';
    while(true){var res=await reader.read();if(res.done)break;
      dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){
        if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;
          try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)col+=j.delta.text;}catch(e){}
        }
      });
    }
    S.aiTexts[faseId]=col;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

async function deleteDocument(docId, faseId) {
  Object.keys(DOCS).forEach(function(fid){
    DOCS[fid]=DOCS[fid].filter(function(d){return d.id!==docId;});
  });
  renderApp();
  fetch(WORKER+'/mna/document/delete/'+docId,{method:'POST'}).catch(function(){});
}

  var uploadHtml = '';

    uploadHtml = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap">'
      + '<label style="display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:IBM Plex Sans,sans-serif;font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--r);cursor:pointer">'

          + '<div class="spin" style="border-color:var(--border2);border-top-color:var(--teal);width:11px;height:11px;flex-shrink:0"></div>'
          + '<span style="font-size:11px;color:var(--muted)">'+esc(doc.naam)+'</span>'
          + '</div>';

      if (doc.verworpen) {
        return '<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--red-bg);border-radius:var(--r);border:1px solid var(--red)">'
          + '<span style="font-size:11px">🚫</span>'
          + '<span style="font-size:11px;color:var(--red);flex:1">'+esc(doc.naam)+'</span>'
          + '<span style="font-size:10px;color:var(--red);font-style:italic">'+esc(doc.verworpen_reden||'verworpen')+'</span>'
          + '</div>';
      }
      return '<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--card);border-radius:var(--r);border:1px solid var(--border)">'

        + '<span style="font-size:10px;color:var(--muted)">'+(doc.grootte/1024/1024).toFixed(1)+'MB</span>'
        + (!isReadOnly?'<button onclick="deleteDocument(\''+doc.id+'\',\''+faseId+'\')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;padding:0 2px">✕</button>':'')
        + '</div>';
    }).join('');
    docsHtml += '</div>';
  }

  return '<div style="margin-bottom:1rem">'+uploadHtml+docsHtml+'</div>';
}

function handleFileUpload(event, faseId) {
  var files = event.target.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
  event.target.value = '';
}

function handleDropUpload(event, faseId) {
  var files = event.dataTransfer.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
}

}


async function loadDataroom(){
  if(!S.code||isKoper())return;
  S.dataroomLoading=true;renderApp();
  try{
    var resp=await fetch(WORKER+'/mna/document/lijst/'+S.code);
    var docs=await resp.json();
    S.dataroom=docs.map(function(d){return{id:d.id,naam:d.bestand_naam,type:d.bestand_type,grootte:d.bestand_grootte,fase_id:d.fase_id,bewaard:!!d.bewaard,uploaded_at:d.uploaded_at};});
  }catch(e){S.dataroom=[];}
  S.dataroomLoading=false;renderApp();
}

function renderWaardering(){
  var t=S.traject||{};
  var isRO=isKoper();
  function parseGeld(s){if(!s)return 0;var n=String(s).replace(/[^0-9,.]/g,'').replace(',','.');return parseFloat(n)||0;}
  function fmtGeld(n){if(!n||isNaN(n))return '—';if(n>=1000000)return '\u20ac'+(n/1000000).toFixed(2).replace('.',',')+' mln';if(n>=1000)return '\u20ac'+(n/1000).toFixed(0)+'.000';return '\u20ac'+Math.round(n);}

  // Haal data op uit S.data
  var o1=parseGeld(S.data['financieel_omzet1']);
  var o2=parseGeld(S.data['financieel_omzet2']);
  var o3=parseGeld(S.data['financieel_omzet3']);
  var ebitdaPct=parseFloat(S.data['financieel_ebitda'])||0;
  var fte=parseFloat(S.data['partner_fte'])||0;
  var recurring=parseFloat(S.data['commercieel_recurring'])||0;
  var churn=parseFloat(S.data['commercieel_churn'])||0;

  // Multiples (sectornorm)
  var mLaag=4.6,mMid=5.05,mHoog=5.5,omzetFactor=0.8,risico=0;

  // Bereken
  var ebitdaAmt=o3*(ebitdaPct/100);
  var wLaag=ebitdaAmt*mLaag;
  var wMid=ebitdaAmt*mMid;
  var wHoog=ebitdaAmt*mHoog;
  var wOmzet=o3*omzetFactor;

  // Groei

  if(o1>0&&o2>0){groei+=(o2-o1)/o1*100;steps++;}
  if(o2>0&&o3>0){groei+=(o3-o2)/o2*100;steps++;}
  var gemGroei=steps>0?groei/steps:3;
  var fc=[o3];
  for(var i=1;i<=3;i++)fc.push(fc[fc.length-1]*(1+gemGroei/100));
  var fcE=fc.map(function(o){return o*(ebitdaPct/100);});

      +(churn>0?' &nbsp;|&nbsp; Churn: <strong>'+churn+'%</strong>':'')
    +'</div></div>';

  // Rolling forecast
  html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'

  html+='</div>';

var logboekCache=null;

async function renderLogboekScreen(app){
  var faseNamen={voorgesprek:'Voorgesprek',kennismaking:'Kennismaking',pre_dd:'Pre-DD (LoI)',due_diligence:'Due Diligence',verkoop:'Verkoop / Closing'};
  var fases=['voorgesprek','kennismaking','pre_dd','due_diligence','verkoop'];
  var isBegOrAdmin=isTussen()||false;
  app.innerHTML='<div style="max-width:700px;margin:0 auto;padding:2rem 1rem">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem">'
    +'<button class="btn-ghost btn-sm" onclick="S.screen=\'cover\';renderApp()">&#8592; Terug</button>'
    +'<h2 style="font-family:Playfair Display,serif;font-size:1.2rem;color:var(--head);font-weight:600;margin:0">Traject logboek</h2>'
    +'</div>'
    +'<div id="lb-fases" style="display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap"></div>'
    +'<div id="lb-entries" style="margin-bottom:1.25rem"><div style="color:var(--muted);font-size:13px">Laden...</div></div>'
    +(isBegOrAdmin?'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem">'
      +'<div style="display:flex;gap:8px;margin-bottom:.75rem">'
      +'<button id="lb-tab-notitie" class="btn" style="font-size:12px;padding:6px 14px">&#128221; Notitie</button>'
      +'<button id="lb-tab-meeting" class="btn-ghost" style="font-size:12px;padding:6px 14px">&#127909; Meeting vastleggen</button>'
      +'</div>'
      +'<div id="lb-panel-notitie">'
      +'<textarea id="lb-bericht" rows="3" placeholder="Schrijf een logboeknotitie..." style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:vertical;margin-bottom:.75rem"></textarea>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +'<select id="lb-fase" style="background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:12px;padding:7px 10px;flex:1">'
      +'<option value="">— Fase niet wijzigen —</option>'
      +'<option value="voorgesprek">Voorgesprek</option>'
      +'<option value="kennismaking">Kennismaking</option>'
      +'<option value="pre_dd">Pre-DD (LoI)</option>'
      +'<option value="due_diligence">Due Diligence</option>'
      +'<option value="verkoop">Verkoop / Closing</option>'
      +'</select>'
      +'<button class="btn btn-sm" id="lb-submit">&#43; Opslaan</button>'
      +'</div></div>'
      +'<div id="lb-panel-meeting" style="display:none">'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:.5rem">Voer vergadernotities in of plak een transcript. De AI structureert automatisch naar samenvatting, beslissingen en actiepunten.</div>'
      +'<div style="display:flex;gap:8px;margin-bottom:.5rem">'
      +'<input type="text" id="lb-meeting-titel" placeholder="Titel (bijv. Kennismaking 22 mei)" style="flex:1;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:13px;padding:9px 12px;outline:none">'
      +'<input type="text" id="lb-meeting-deelnemers" placeholder="Deelnemers" style="flex:1;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:13px;padding:9px 12px;outline:none">'
      +'</div>'
      +'<textarea id="lb-meeting-tekst" rows="5" placeholder="Plak hier ruwe vergadernotities, opnametranscript of steekwoorden. AI structureert alles..." style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:vertical;margin-bottom:.75rem"></textarea>'
      +'<div style="display:flex;gap:8px;align-items:center">'
      +'<select id="lb-meeting-fase" style="background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:IBM Plex Sans,sans-serif;font-size:12px;padding:7px 10px;flex:1">'
      +'<option value="">— Fase niet wijzigen —</option>'
      +'<option value="voorgesprek">Voorgesprek</option>'
      +'<option value="kennismaking">Kennismaking</option>'
      +'<option value="pre_dd">Pre-DD (LoI)</option>'
      +'<option value="due_diligence">Due Diligence</option>'
      +'<option value="verkoop">Verkoop / Closing</option>'
      +'</select>'
      +'<button class="btn btn-sm" id="lb-meeting-submit" style="white-space:nowrap">&#9881; AI structureren &amp; opslaan</button>'
      +'</div></div>'
      +'</div>'
    :'<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;font-size:12px;color:var(--muted)">U kunt het logboek inzien. Alleen de begeleider en adviseur kunnen notities toevoegen.</div>')
    +'</div>';

  // Laad logboek
  try{
    var code=S.code;
    var lr=await fetch(WORKER+'/mna/logboek/'+code);
    var ld=await lr.json();
    logboekCache=ld;
    var huidigeFase=ld.traject_fase||'voorgesprek';
    // Fases
    var fDiv=document.getElementById('lb-fases');
    if(fDiv){fDiv.innerHTML=fases.map(function(f,i){
      var actief=f===huidigeFase;var geweest=fases.indexOf(huidigeFase)>i;
      var kleur=actief?'var(--teal)':geweest?'var(--teal-dim)':'var(--border2)';
      var bg=actief?'var(--teal-bg)':geweest?'rgba(26,122,94,.06)':'transparent';
      return '<div style="display:flex;align-items:center;gap:4px">'
        +(i>0?'<div style="width:16px;height:2px;background:'+kleur+';flex-shrink:0"></div>':'')
        +'<div style="font-size:10px;font-weight:600;padding:4px 10px;border-radius:12px;border:1.5px solid '+kleur+';color:'+(actief?'var(--teal)':geweest?'var(--teal-dim)':'var(--muted)')+';background:'+bg+';white-space:nowrap">'+(faseNamen[f]||f)+'</div></div>';
    }).join('');}
    // Entries
    var eDiv=document.getElementById('lb-entries');
    if(eDiv){
      var entries=ld.logboek||[];
      if(!entries.length){eDiv.innerHTML='<div style="color:var(--muted);font-size:13px;font-style:italic;padding:1rem 0">Nog geen logboeknotities.</div>';}
      else{eDiv.innerHTML=entries.map(function(e){
        var dt=new Date(e.created_at).toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        var isAdm=e.auteur_type==='admin';
        return '<div style="padding:.75rem 1rem;margin-bottom:.5rem;border-radius:var(--r);background:'+(isAdm?'var(--teal-bg)':'var(--panel)')+';border:1px solid '+(isAdm?'var(--teal-dark)':'var(--border)')+';border-left:3px solid '+(isAdm?'var(--teal)':'var(--gold)')+'">'
          +(e.fase_gewijzigd?'<div style="font-size:10px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">&#8594; Fase: '+(faseNamen[e.fase]||e.fase)+'</div>':'')
          +'<div style="font-size:13px;color:var(--sub);line-height:1.7;white-space:pre-wrap">'+esc(e.bericht)+'</div>'
          +'<div style="font-size:11px;color:var(--muted);margin-top:5px">'+esc(e.auteur)+' &middot; '+dt+'</div>'
          +'</div>';
      }).join('');eDiv.scrollTop=eDiv.scrollHeight;}
    }
  }catch(e){var ed=document.getElementById('lb-entries');if(ed)ed.innerHTML='<div style="color:var(--red);font-size:13px">Fout bij laden: '+e.message+'</div>';}

  // Submit
  if(isBegOrAdmin){
    var lbBtn=document.getElementById('lb-submit');
    if(lbBtn)lbBtn.addEventListener('click',async function(){
      var bericht=document.getElementById('lb-bericht').value.trim();
      var fase=document.getElementById('lb-fase').value;
      if(!bericht&&!fase){toast('Voer een notitie in of selecteer een fase.','warn');return;}
      lbBtn.disabled=true;lbBtn.textContent='Opslaan...';
      try{
        var lr=await fetch(WORKER+'/mna/logboek/'+S.code,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bericht:bericht,nieuwe_fase:fase||undefined,auteur_naam:S.traject.begeleider_naam||'Begeleider'})});
        var ld=await lr.json();
        if(ld.ok){document.getElementById('lb-bericht').value='';document.getElementById('lb-fase').value='';renderLogboekScreen(app);}
        else toast('Fout: '+(ld.error||'onbekend'),'err');
      }catch(e){toast('Verbindingsfout.','err');}
      lbBtn.disabled=false;lbBtn.textContent='+ Opslaan';
    });

    // Tab switching
    var tabNotitie=document.getElementById('lb-tab-notitie');
    var tabMeeting=document.getElementById('lb-tab-meeting');
    var panelNotitie=document.getElementById('lb-panel-notitie');
    var panelMeeting=document.getElementById('lb-panel-meeting');
    if(tabNotitie&&tabMeeting){
      tabNotitie.onclick=function(){
        panelNotitie.style.display='';panelMeeting.style.display='none';
        tabNotitie.className='btn';tabMeeting.className='btn-ghost';
        tabNotitie.style.fontSize='12px';tabNotitie.style.padding='6px 14px';
        tabMeeting.style.fontSize='12px';tabMeeting.style.padding='6px 14px';
      };
      tabMeeting.onclick=function(){
        panelNotitie.style.display='none';panelMeeting.style.display='';
        tabMeeting.className='btn';tabNotitie.className='btn-ghost';
        tabNotitie.style.fontSize='12px';tabNotitie.style.padding='6px 14px';
        tabMeeting.style.fontSize='12px';tabMeeting.style.padding='6px 14px';
      };
    }

    // Meeting AI structureren
    var meetBtn=document.getElementById('lb-meeting-submit');
    if(meetBtn)meetBtn.addEventListener('click',async function(){
      var titel=document.getElementById('lb-meeting-titel').value.trim();
      var deelnemers=document.getElementById('lb-meeting-deelnemers').value.trim();
      var tekst=document.getElementById('lb-meeting-tekst').value.trim();
      var fase=document.getElementById('lb-meeting-fase').value;
      if(!tekst){toast('Voer vergadernotities in.','warn');return;}
      meetBtn.disabled=true;meetBtn.textContent='AI verwerkt...';
      try{
        var prompt='Structureer de volgende ruwe vergadernotities van een M&A traject in de accountancy-sector naar een professioneel vergaderverslag.\n\nVERGADERING: '+(titel||'Vergadering')+' | Deelnemers: '+(deelnemers||'onbekend')+'\n\nRUWE NOTITIES:\n'+tekst+'\n\nGeef terug in dit formaat:\n\n## Vergadering: [titel]\nDatum: [datum indien bekend]\nDeelnemers: [deelnemers]\n\n### Samenvatting\n[2-4 zinnen kerninhoud]\n\n### Besproken punten\n- [punt 1]\n- [punt 2]\n\n### Beslissingen\n- [beslissing 1]\n\n### Actiepunten\n- [ ] [actie] — [wie] — [wanneer]\n\n### Volgende stap\n[wat staat er gepland]\n\nCompact en professioneel. Alleen wat relevant is voor het M&A traject.';
        var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})});
        var rawText=await resp.text();
        var rd;try{rd=JSON.parse(rawText);}catch(e){throw new Error('Geen JSON: '+rawText.substring(0,150));}
        if(!resp.ok)throw new Error('Fout: '+(rd.error||''));
        var gestructureerd=rd.text||'Fout bij verwerken.';
        // Sla op als logboeknotitie
        var lr=await fetch(WORKER+'/mna/logboek/'+S.code,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bericht:gestructureerd,nieuwe_fase:fase||undefined,auteur_naam:S.traject.begeleider_naam||'Begeleider'})});
        var ld=await lr.json();
        if(ld.ok){
          document.getElementById('lb-meeting-titel').value='';
          document.getElementById('lb-meeting-deelnemers').value='';
          document.getElementById('lb-meeting-tekst').value='';
          document.getElementById('lb-meeting-fase').value='';
          // Ga terug naar notitie tab en herlaad
          if(tabNotitie)tabNotitie.click();
          renderLogboekScreen(app);
        } else toast('Fout: '+(ld.error||'onbekend'),'err');
      }catch(e){toast('Fout: '+e.message,'err');}
      meetBtn.disabled=false;meetBtn.textContent='⚙ AI structureren & opslaan';
    });
  }
}

function renderApp(){
  var app=ge('app');
  if(S.screen==='login')app.innerHTML=renderLogin();
  else if(S.screen==='cover')app.innerHTML=renderCover();
  else if(S.screen==='main')app.innerHTML=renderMain();
  else if(S.screen==='summary')app.innerHTML=renderSummary();
  else if(S.screen==='dataroom')app.innerHTML=renderDataroom();
  else if(S.screen==='waardering')app.innerHTML=renderWaardering();
  else if(S.screen==='logboek')renderLogboekScreen(app);
  else if(S.screen==='begeleider')renderBegeleiderDashboard(app);
  bindAll();
}

    +'<div style="min-height:60vh;display:flex;align-items:center;justify-content:center">'

    +'<div id="l-load" style="color:var(--muted);font-size:12px;margin-bottom:.75rem;display:none">Laden...</div>'

    +'<div style="margin-top:1.25rem;font-size:11px;color:var(--muted);padding-top:1rem;border-top:1px solid var(--border)">Code ontvangen via Marcel Bisschops &middot; <a href="mailto:marcel@bisschopsfinancing.nl" style="color:var(--teal)">marcel@bisschopsfinancing.nl</a></div>'

    +'</div></div>'

    +'<div style="pointer-events:auto;text-align:right"><a href="privacy.html" style="font-size:12px;font-weight:600;color:var(--teal);text-decoration:underline;display:block;margin-bottom:2px">Privacyverklaring</a><span style="font-size:10px;color:var(--muted)">Gegevens vertrouwelijk behandeld conform AVG</span></div>'

function renderBegeleiderDashboard(app){
  var t=S.traject||{};
  var lb=window.partijLabels?window.partijLabels(t.traject_type||'Verkoop'):{sectie1:'Verkoper',sectie2:'Koper'};
  var html='<div class="wrap anim">'
    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; M&A Begeleider'+versieLabel()+'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn-ghost btn-sm" onclick="window.print()">&#128196; PDF</button>'
    +'<button class="btn-ghost btn-sm" onclick="uitloggen()">&#8592; Uitloggen</button>'
    +'</div></div>'
    // Traject info
    +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1.25rem">'
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem">'
    +'<div>'
    +'<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem">Traject</div>'
    +'<div style="font-family:Playfair Display,serif;font-size:1.3rem;font-weight:600;color:var(--head)">'+esc(t.kantoor_naam||'Traject')+'</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:.25rem">'+esc(t.traject_type||'M&A')+' &middot; Code: <span style="font-family:IBM Plex Mono,monospace;color:var(--teal)">'+esc(S.code)+'</span></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +(t.koper_vrijgegeven
      ?'<button class="btn-ghost btn-sm" id="bg-intrekken" style="color:var(--red);border-color:var(--red)">&#128275; Vrijgave intrekken</button>'
      :'<button class="btn btn-sm" id="bg-vrijgeven">&#128275; Koper toegang geven</button>')
    +'<span style="display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;background:'+(t.status==='vergrendeld'?'var(--red-bg)':'var(--teal-bg)')+';color:'+(t.status==='vergrendeld'?'var(--red)':'var(--teal)')+';border:1px solid '+(t.status==='vergrendeld'?'var(--red)':'var(--teal-dark)')+'">'+esc(t.status||'actief')+'</span>'
    +'</div></div></div>'
    // Actie knoppen
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem">'
    +'<button class="btn" id="bg-nda-actie" style="background:#7c5cbf;padding:12px;font-size:13px">&#128274; NDA</button>'
    +'<button class="btn" id="bg-loi-actie" style="background:var(--gold);padding:12px;font-size:13px">&#128196; LoI</button>'
    +'<button class="btn" id="bg-bem-actie" style="background:#2a5ea0;padding:12px;font-size:13px">&#128203; BEM</button>'
    +'<button class="btn" id="bg-gesprek-actie" style="background:var(--teal);padding:12px;font-size:13px">&#128172; Gesprek</button>'
    +'<button class="btn" id="bg-infoverzoek-actie" style="background:var(--teal-dim);padding:12px;font-size:13px">&#128203; Informatieverzoek</button>'
    +'</div>'
    // Doc output
    +'<div id="bg-doc-out" style="display:none;margin-bottom:1.25rem"></div>'
    // Gesprek output
    +'<div id="bg-gesp-out" style="display:none;margin-bottom:1.25rem"></div>'
    // DD data per fase
    +'<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Due diligence voortgang</div>';

  var faseLabels={financieel:'I. Financieel',commercieel:'II. Klanten & commercieel',partner:'III. Partners & personeel',compliance:'IV. Compliance & kwaliteit',it:'V. IT & automatisering',juridisch:'VI. Juridisch & fiscaal',strategisch:'VII. Strategisch & markt'};
  Object.keys(faseLabels).forEach(function(faseId){
    var row=(S._mnaData||[]).find(function(r){return r.fase_id===faseId;});
    var items=[];
    if(row){try{var dj=typeof row.data_json==='string'?JSON.parse(row.data_json):row.data_json;items=Object.values(dj||{}).filter(function(v){return v&&v.value;});}catch(e){}}
    var pct=row?Math.round(items.length/Math.max(1,Object.keys(row.data_json&&typeof row.data_json==='string'?JSON.parse(row.data_json||'{}'):row.data_json||{}).length)*100):0;
    var kleur=pct>=80?'var(--teal)':pct>=40?'var(--gold)':'var(--red)';
    html+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:.5rem;overflow:hidden">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--card)" class="bg-fase-hdr" data-fase="'+faseId+'">'
      +'<span style="font-size:13px;font-weight:500;color:var(--head)">'+faseLabels[faseId]+'</span>'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:11px;font-weight:600;color:'+kleur+'">'+items.length+' velden ingevuld</span>'
      +'<span style="font-size:12px;color:var(--muted)">&#9660;</span>'
      +'</div></div>'
      +'<div class="bg-fase-body" data-fase="'+faseId+'" style="display:none;padding:12px 14px">';
    if(!items.length){html+='<div style="color:var(--muted);font-size:12px;font-style:italic">Nog niets ingevuld door verkoper.</div>';}
    else{
      html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
      items.forEach(function(v){html+='<div style="background:var(--card);border-radius:var(--r);padding:6px 10px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px">'+esc(v.label||'')+'</div><div style="font-size:12px;font-family:IBM Plex Mono,monospace;color:var(--sub)">'+esc(v.value||'')+'</div></div>';});
      html+='</div>';
    }
    html+='</div></div>';
  });

  // AI analyse knop
  html+='<div style="margin-top:1rem;display:flex;gap:8px">'

async function finaleCheck(){
  var btn=ge('finale-check-btn');
  var out=ge('finale-check-out');
  if(!btn||!out)return;
  btn.disabled=true;btn.textContent='Bezig met controleren...';
  out.innerHTML='<div style="color:var(--muted);font-size:13px;padding:1rem;background:var(--card);border-radius:var(--r)">AI vergelijkt velden met documenten... (20-40 sec)</div>';

  // Bouw overzicht van alle ingevulde velden
  var veldenSamenvatting='';
  FASES.forEach(function(f){
    var gevuld=f.dataFields.filter(function(df){return !df.header&&(S.data[f.id+'_'+df.id]||'').trim();});
    if(gevuld.length){
      veldenSamenvatting+='\n## '+f.num+'. '+f.title+'\n';
      gevuld.forEach(function(df){veldenSamenvatting+='- '+df.label+': '+S.data[f.id+'_'+df.id]+'\n';});
    }
  });

  // Bouw overzicht van alle geüploade documenten en hun analyses
  var docSamenvatting='';
  Object.keys(DOCS).forEach(function(faseId){
    var docs=(DOCS[faseId]||[]).filter(function(d){return !d.uploading&&!d.verworpen&&d.analyse;});
    if(docs.length){
      var faseNaam=FASES.find(function(f){return f.id===faseId;});
      docSamenvatting+='\n## '+(faseNaam?faseNaam.num+'. '+faseNaam.title:faseId)+'\n';
      docs.forEach(function(d){
        docSamenvatting+='Document: '+d.naam+'\n';
        docSamenvatting+='Analyse: '+d.analyse.substring(0,400)+'\n\n';
      });
    }
  });

  if(!docSamenvatting){
    out.innerHTML='<div style="color:var(--gold);font-size:13px;padding:.75rem;background:var(--gold-bg);border-radius:var(--r);border:1px solid var(--gold)">⚠ Geen documenten geüpload — finale check vereist minimaal één geüpload document per fase.</div>';
    btn.disabled=false;btn.textContent='&#9881; Voer finale check uit';
    return;
  }

  var prompt='Je bent een forensische M&A-auditor voor een accountantskantoor due diligence.\n\n'
    +'Traject: '+esc(S.traject&&S.traject.kantoor_naam||S.code)+'\n\n'
    +'INGEVULDE VELDEN:\n'+veldenSamenvatting+'\n\n'
    +'AANGELEVERDE DOCUMENTEN EN ANALYSES:\n'+docSamenvatting+'\n\n'
    +'Voer een finale cross-check uit:\n'
    +'1. Welke ingevulde velden worden BEVESTIGD door documenten?\n'
    +'2. Welke ingevulde velden worden TEGENGESPROKEN of wijken af van de documenten?\n'
    +'3. Welke verplichte velden hebben GEEN documentaire onderbouwing?\n'
    +'4. Welke rode vlaggen of inconsistenties zie je?\n'
    +'5. Eindoordeel: is het dossier gereed voor DD?\n\n'
    +'Wees concreet en noem specifieke velden en bedragen. Gebruik ## koppen. Markeer problemen duidelijk met ⚠.';

  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:2500})});
    var rd=await resp.json();
    var tekst=(rd.text||'Fout bij genereren.')
      .replace(/## ([^\n]+)/g,'<h3 style="font-family:Playfair Display,serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:.75rem;border-top:1px solid var(--border)">$1</h3>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/⚠/g,'<span style="color:var(--red)">⚠</span>')
      .split('\n\n').map(function(p){return p.trim()&&p.charAt(0)!=='<'?'<p style="font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:.5rem">'+p+'</p>':p;}).join('');
    out.innerHTML='<div style="padding-top:.5rem">'+tekst+'</div>';
  }catch(e){
    out.innerHTML='<div style="color:var(--red);font-size:13px">Fout: '+e.message+'</div>';
  }
  btn.disabled=false;btn.textContent='&#9881; Opnieuw controleren';
}

async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  saveCurrent();S.aiLoading[faseId]=true;renderApp();
  var dataLines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataLines.push(df.label+': '+v+(r?' (doc: '+r+')':''));});
  var chk=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var open=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfs=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur gespecialiseerd in accountantskantoren en administratiekantoren. Traject: '+esc(S.traject&&S.traject.traject_type||'M&A')+' voor "'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'".\n\nFASE: '+f.title+'\n\nINGEVOERDE DATA:\n'+(dataLines.join('\n')||'Geen data')+'\n\nCHECKLIST:\nGereed: '+(chk.join(', ')||'niets')+'\nOpen: '+(open.join(', ')||'alles gereed')+'\n\nRODE VLAGGEN: '+(rfs.join(', ')||'geen')+'\n\nNOTITIES: '+(S.notities[faseId]||'geen')+'\n\nGeef beknopt strategisch advies. Analyseer de cijfers expliciet en vergelijk met sectorgemiddelden. Bespreek: voortgang en prioriteiten, urgente openstaande punten, impact rode vlaggen, concrete vervolgstappen. Schrijf in ik-vorm. Gebruik ## koppen. Geen tabellen of bullets.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();var dec=new TextDecoder();var collected='';
    while(true){var res=await reader.read();if(res.done)break;dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}}});}
    S.aiTexts[faseId]=collected;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

        +'<div style="margin-bottom:1rem"><label style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8a8880;display:block;margin-bottom:4px">Verslag</label><textarea id="bg-gs-verslag" rows="5" placeholder="Verslag — of klik AI om te genereren." style="width:100%;background:#f0eeea;border:1px solid #c8c5bc;border-radius:6px;padding:9px 11px;font-family:IBM Plex Mono,monospace;font-size:12px;line-height:1.7;resize:vertical"></textarea></div>'
        +'<div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">'
        +'<button id="bg-gs-ai" style="background:transparent;border:1px solid #1a7a5e;color:#1a7a5e;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:12px">&#9881; AI-verslag genereren</button>'
        +'<span id="bg-gs-status" style="font-size:12px;color:#8a8880;align-self:center"></span>'
        +'</div>'
        +'<div id="bg-gs-err" style="display:none;color:#e05252;font-size:12px;margin-bottom:.5rem"></div>'
        +'<div style="display:flex;gap:10px;justify-content:flex-end">'
        +'<button id="bg-gs-ann" style="background:transparent;border:1px solid #c8c5bc;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:13px">Annuleren</button>'
        +'<button id="bg-gs-ok" style="background:#1a7a5e;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:13px;font-weight:600">Opslaan</button>'
        +'</div>';
      ov.appendChild(mo);document.body.appendChild(ov);
      ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
      document.getElementById('bg-gs-ann').onclick=function(){document.body.removeChild(ov);};
      document.getElementById('bg-gs-ai').onclick=async function(){
        var notities=(document.getElementById('bg-gs-notities').value||'').trim();
        if(!notities){document.getElementById('bg-gs-status').textContent='Voer eerst notities in.';return;}
        var st=document.getElementById('bg-gs-status');st.textContent='Genereren...';
        var btn=this;btn.disabled=true;
        var prompt='Maak een professioneel gespreksverslag van een M&A traject.'
          +'\n\nGesprek: '+(document.getElementById('bg-gs-type').value)+' | Datum: '+(document.getElementById('bg-gs-datum').value)+' | Deelnemers: '+(document.getElementById('bg-gs-deelnemers').value||'onbekend')
          +'\n\nNOTITIES:\n'+notities
          +'\n\nGeef het verslag terug met secties: ## Samenvatting, ## Besproken punten, ## Beslissingen & afspraken, ## Actiepunten, ## Volgende stap. Professioneel, derde persoon.';
        try{
          var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})});
          var rd=await resp.json();
          document.getElementById('bg-gs-verslag').value=rd.text||'';
          st.textContent='✓ Verslag gegenereerd';
        }catch(e){st.textContent='Fout bij genereren';}
        btn.disabled=false;
      };
      document.getElementById('bg-gs-ok').onclick=async function(){
        var datum=document.getElementById('bg-gs-datum').value;
        var err=document.getElementById('bg-gs-err');
        if(!datum){err.style.display='block';err.textContent='Datum is verplicht.';return;}
        var btn=this;btn.disabled=true;btn.textContent='Opslaan...';
        var payload={datum:datum,deelnemers:document.getElementById('bg-gs-deelnemers').value.trim(),type:document.getElementById('bg-gs-type').value,ruwe_notities:document.getElementById('bg-gs-notities').value.trim(),verslag:document.getElementById('bg-gs-verslag').value.trim()};
        var auth=S._bgKey||'';
        var r=await fetch(WORKER+'/mna/admin/gesprekken/'+S.traject.id,{method:'POST',headers:{'Content-Type':'application/json','x-tussen-key':auth},body:JSON.stringify(payload)});
        var d=await r.json();
        if(d.ok){document.body.removeChild(ov);toast('Gesprek opgeslagen.','ok');}
        else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Opslaan';}
      };
    };
  }

  // ── BEGELEIDER AI-ANALYSE ────────────────────────────────────
  var aiAnalyseCoverBtn=ge('ai-analyse-btn-cover');
  if(aiAnalyseCoverBtn&&isTussen()){
    aiAnalyseCoverBtn.onclick=async function(){
      var btn=this;btn.disabled=true;btn.textContent='Analyseren...';
      var t3=S.traject;
      var bms={};
      try{var br=await fetch(WORKER+'/benchmarks');var bd=await br.json();bd.forEach(function(b){bms[b.sleutel]=b;});}catch(e){}
      var dataSamenvatting='';
      (S._mnaData||[]).forEach(function(row){
        try{
          var dj=typeof row.data_json==='string'?JSON.parse(row.data_json):row.data_json;
          var gevuld=Object.values(dj||{}).filter(function(v){return v&&v.value;});
          if(gevuld.length){dataSamenvatting+='\n## '+row.fase_id+'\n';gevuld.forEach(function(v){dataSamenvatting+='- '+v.label+': '+v.value+'\n';});}
        }catch(e){}
      });
      var bmTekst='BENCHMARKS: EBITDA '+(bms['ebitda_marge_admin']?bms['ebitda_marge_admin'].waarde:18.7)+'% | Multiples '+(bms['multiple_adm_laag']?bms['multiple_adm_laag'].waarde:4.6)+'x-'+(bms['multiple_adm_hoog']?bms['multiple_adm_hoog'].waarde:5.5)+'x\n';
      var prompt='M&A-adviseur accountancy. Analyseer traject: '+esc(t3.kantoor_naam||S.code)+' ('+esc(t3.traject_type||'Verkoop')+')\n'+bmTekst+'\nDUE DILIGENCE:'+dataSamenvatting+'\n\n## Samenvatting\n## Financieel profiel & waardering\n## Sterktes\n## Risicos\n## Aanbevelingen\n\nMax 500 woorden.';
      try{
        var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:3000})});
        var rd=await resp.json();
        var tekst=(rd.text||'Fout bij genereren.').replace(/## ([^\n]+)/g,'<strong style="display:block;margin:.75rem 0 .25rem;font-size:14px">$1</strong>').replace(/\n/g,'<br>');
        var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem';
        var mo=document.createElement('div');mo.style.cssText='background:#fff;border-radius:10px;padding:2rem;max-width:680px;width:100%;max-height:90vh;overflow-y:auto';
        mo.innerHTML='<div style="font-family:Playfair Display,serif;font-size:1.1rem;color:#1a1815;font-weight:600;margin-bottom:1.25rem">&#9881; AI-analyse · '+esc(t3.kantoor_naam||S.code)+'</div>'
          +'<div style="font-size:13px;color:#5a5854;line-height:1.8">'+tekst+'</div>'
          +'<div style="margin-top:1.25rem;text-align:right"><button id="ai-sluit" style="background:transparent;border:1px solid #c8c5bc;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:13px">Sluiten</button></div>';
        ov.appendChild(mo);document.body.appendChild(ov);
        ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
        document.getElementById('ai-sluit').onclick=function(){document.body.removeChild(ov);};
      }catch(e){toast('Fout bij AI-analyse: '+e.message,'err');}
      btn.disabled=false;btn.textContent='&#9881; AI-analyse';
    };
  }
}

renderApp();

// ============================================================
// CHAT SYSTEEM
// ============================================================
var CHAT = {
  open: false,
  berichten: [],
  serverBerichten: [],
  laden: false,
  sturen: false,
  unread: 0
};

function chatContextBeschrijving() {
  var ctx = 'Traject: ' + (S.traject && S.traject.kantoor_naam || S.code);
  ctx += ' | Rol: ' + (isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper');
  if (S.screen === 'main') {
    var f = FASES[S.fase];
    if (f) {
      ctx += ' | Fase: ' + f.num + '. ' + f.title;
      var leeg = f.dataFields.filter(function(df) { return df.req && !df.header && !(S.data[f.id+'_'+df.id]||'').trim(); });
      if (leeg.length) ctx += ' | Nog leeg: ' + leeg.map(function(df){return df.label;}).join(', ');
      var gevuld = f.dataFields.filter(function(df) { return !df.header && (S.data[f.id+'_'+df.id]||'').trim(); });
      if (gevuld.length) ctx += ' | Ingevuld: ' + gevuld.map(function(df){return df.label+'='+S.data[f.id+'_'+df.id];}).join(', ');
    }
  }
  ctx += ' | Totaal: ' + totalFillPct() + '%';
  return ctx;
}

async function chatLaadBerichten() {
  if (!S.code) return;
  try {
    var resp = await fetch(WORKER + '/mna/chat/' + S.code);
    if (!resp.ok) return;
    var d = await resp.json();
    if (d.berichten) {
      CHAT.serverBerichten = d.berichten;
      var nieuweUnread = 0;
      d.berichten.forEach(function(b) {
        if (isVerkoper() && b.auteur === 'begeleider' && !b.gelezen) nieuweUnread++;
        if (isTussen() && b.auteur === 'verkoper' && !b.gelezen) nieuweUnread++;
      });
      if (!CHAT.open && nieuweUnread > CHAT.unread) {
        CHAT.unread = nieuweUnread;
        chatUpdateBadge();
      }
    }
  } catch(e) {}
}

async function chatVerstuur(tekst) {
  if (!tekst.trim() || CHAT.sturen) return;
  CHAT.sturen = true;
  var auteur = isVerkoper() ? 'verkoper' : isTussen() ? 'begeleider' : 'koper';
  var naamLabel = isVerkoper() ? (S.traject && S.traject.contact_naam || 'Verkoper') : isTussen() ? (S.traject && S.traject.begeleider_naam || 'Begeleider') : 'Koper';
  var userMsg = { auteur: auteur, naam: naamLabel, tekst: tekst, ts: Date.now(), lokaal: true };
  CHAT.berichten.push(userMsg);
  chatRenderBerichten();
  try {
    await fetch(WORKER + '/mna/chat/' + S.code, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auteur: auteur, naam: naamLabel, tekst: tekst })
    });
  } catch(e) {}
  if (isVerkoper()) {
    CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: '...', ts: Date.now(), typing: true });
    chatRenderBerichten();
    var systeemPrompt = 'Je bent een vriendelijke assistent voor een M&A due diligence platform voor accountantskantoren. Je helpt de eigenaar/verkoper bij het invullen van het due diligence formulier. Geef korte, praktische antwoorden in het Nederlands. CONTEXT: ' + chatContextBeschrijving();
    var msgs = [];
    var allB = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal&&!b.typing;}));
    allB.slice(-8).forEach(function(b) {
      if (b.auteur === 'verkoper') msgs.push({ role: 'user', content: b.tekst });
      else if (b.auteur === 'ai') msgs.push({ role: 'assistant', content: b.tekst });
    });
    try {
      var resp = await fetch(WORKER + '/ai', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: systeemPrompt, messages: msgs, max_tokens: 400 })
      });
      var rd = await resp.json();
      var antwoord = rd.text || 'Sorry, er ging iets mis.';
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      var aiMsg = { auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord, ts: Date.now(), lokaal: true };
      CHAT.berichten.push(aiMsg);
      fetch(WORKER + '/mna/chat/' + S.code, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: antwoord })
      }).catch(function(){});
    } catch(e) {
      CHAT.berichten = CHAT.berichten.filter(function(b){ return !b.typing; });
      CHAT.berichten.push({ auteur: 'ai', naam: 'KantoorInzicht AI', tekst: 'Verbindingsfout. Probeer opnieuw.', ts: Date.now() });
    }
    chatRenderBerichten();
  }
  CHAT.sturen = false;
}

function chatRenderBerichten() {
  var lijst = document.getElementById('chat-berichten');
  if (!lijst) return;
  var alleBerichten = CHAT.serverBerichten.concat(CHAT.berichten.filter(function(b){return b.lokaal;}));
  var gezien = {};
  alleBerichten = alleBerichten.filter(function(b){
    var k = b.auteur + '|' + b.tekst + '|' + (b.ts||'');
    if (gezien[k]) return false; gezien[k] = true; return true;
  });
  alleBerichten.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  if (!alleBerichten.length) {
    lijst.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:2rem 1rem">' + (isVerkoper() ? '\uD83D\uDC4B Hallo! Ik help u graag bij het invullen. Stel gerust een vraag.' : 'Nog geen berichten.') + '</div>';
    return;
  }
  lijst.innerHTML = alleBerichten.map(function(b) {
    var isEigen = (isVerkoper() && b.auteur === 'verkoper') || (isTussen() && b.auteur === 'begeleider');
    var isAI = b.auteur === 'ai';
    var isBeg = b.auteur === 'begeleider';
    var dt = b.ts ? new Date(b.ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '';
    var bg = isEigen ? 'var(--teal)' : isAI ? 'var(--card)' : isBeg ? '#f3f0ff' : 'var(--card)';
    var kleur = isEigen ? '#fff' : 'var(--sub)';
    var align = isEigen ? 'flex-end' : 'flex-start';
    var border = isAI ? '1px solid var(--border)' : isBeg ? '1px solid #c8b8f0' : 'none';
    var naamKleur = isAI ? 'var(--teal)' : isBeg ? '#7c5cbf' : 'var(--muted)';
    var naamHtml = isEigen ? '' : '<div style="font-size:10px;font-weight:600;color:'+naamKleur+';margin-bottom:3px">' + (b.naam||b.auteur) + '</div>';
    var radius = isEigen ? '12px 12px 2px 12px' : '12px 12px 12px 2px';
    if (b.typing) return '<div style="display:flex;justify-content:flex-start;margin-bottom:8px"><div style="background:var(--card);border:1px solid var(--border);border-radius:'+radius+';padding:8px 14px;max-width:80%">'+naamHtml+'<div style="display:flex;gap:4px;align-items:center;height:18px"><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite 0s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .2s"></div><div style="width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chatdot .8s infinite .4s"></div></div></div></div>';
    var tekstHtml = String(b.tekst||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    return '<div style="display:flex;justify-content:'+align+';margin-bottom:8px"><div style="background:'+bg+';border:'+border+';border-radius:'+radius+';padding:8px 12px;max-width:82%;word-break:break-word">'+naamHtml+'<div style="font-size:13px;color:'+kleur+';line-height:1.55">'+tekstHtml+'</div>'+(dt?'<div style="font-size:10px;color:'+(isEigen?'rgba(255,255,255,.6)':'var(--muted)')+';margin-top:3px;text-align:right">'+dt+'</div>':'')+'</div></div>';
  }).join('');
  lijst.scrollTop = lijst.scrollHeight;
}

function chatUpdateBadge() {
  var badge = document.getElementById('chat-badge');
  if (!badge) return;
  if (CHAT.unread > 0) { badge.style.display = 'flex'; badge.textContent = CHAT.unread > 9 ? '9+' : String(CHAT.unread); }
  else badge.style.display = 'none';
}

function chatOpen() {
  CHAT.open = true; CHAT.unread = 0; chatUpdateBadge();
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'flex';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'none';
  chatLaadBerichten().then(function(){ chatRenderBerichten(); });
  setTimeout(function(){ var inp = document.getElementById('chat-input'); if (inp) inp.focus(); }, 100);
}

function chatSluit() {
  CHAT.open = false;
  var v = document.getElementById('chat-venster'); if (v) v.style.display = 'none';
  var f = document.getElementById('chat-fab'); if (f) f.style.display = 'flex';
}

window.chatStuurVanInput = function() {
  var inp = document.getElementById('chat-input'); if (!inp) return;
  var tekst = inp.value.trim(); if (!tekst) return;
  inp.value = ''; inp.style.height = 'auto';
  chatVerstuur(tekst);
};

function chatInit() {
  var oud = document.getElementById('chat-container'); if (oud) oud.remove();
  if (!S.code || S.screen === 'login') return;
  if (!document.getElementById('chat-style')) {
    var st = document.createElement('style'); st.id = 'chat-style';
    st.textContent = '@keyframes chatdot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}';
    document.head.appendChild(st);
  }
  var headerTitel = isVerkoper() ? '&#128172; Assistent & Begeleider' : isTussen() ? '&#128172; Chat met verkoper' : '&#128172; Chat';
  var placeholder = isVerkoper() ? 'Stel een vraag...' : 'Stuur een bericht...';
  var container = document.createElement('div'); container.id = 'chat-container';
  container.innerHTML =
    '<div id="chat-fab" style="position:fixed;bottom:24px;right:24px;z-index:500;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--teal);box-shadow:0 4px 16px rgba(0,0,0,.2);cursor:pointer" onclick="chatOpen()">'
    +'<span style="font-size:22px">&#128172;</span>'
    +'<div id="chat-badge" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;border:2px solid #fff"></div>'
    +'</div>'
    +'<div id="chat-venster" style="display:none;position:fixed;bottom:24px;right:24px;z-index:500;width:360px;height:500px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);box-shadow:0 8px 32px rgba(0,0,0,.18);flex-direction:column;overflow:hidden">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--teal);color:#fff">'
    +'<div style="font-size:13px;font-weight:600">'+headerTitel+'</div>'
    +'<button onclick="chatSluit()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;line-height:1">&times;</button>'
    +'</div>'
    +'<div id="chat-berichten" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column"></div>'
    +'<div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end">'
    +'<textarea id="chat-input" placeholder="'+placeholder+'" rows="1" style="flex:1;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);outline:none;resize:none;max-height:80px;line-height:1.5"></textarea>'
    +'<button onclick="chatStuurVanInput()" style="background:var(--teal);border:none;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px;flex-shrink:0">&#8593;</button>'
    +'</div></div>';
  document.body.appendChild(container);
  var inp = document.getElementById('chat-input');
  if (inp) {
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatStuurVanInput();} });
    inp.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,80)+'px'; });
  }
  chatLaadBerichten().then(function(){ if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge(); });
  if (isVerkoper()) {
    clearInterval(window._chatPollInterval);
    window._chatPollInterval = setInterval(function(){
      if (S.code && S.screen !== 'login') chatLaadBerichten().then(function(){
        if (CHAT.open) chatRenderBerichten(); else chatUpdateBadge();
      });
    }, 15000);
  }
}

// Wrap renderApp zodat chat altijd herinitialiseerd wordt
var _origRenderApp = renderApp;
renderApp = function() { _origRenderApp(); chatInit(); };

</script>
