<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>M&A Begeleiding - Koers voor Morgen</title>
<link rel="stylesheet" href="/assets/fonts.css">
<script src="/assets/kvm-ui-schakelaar.js"></script>
<link rel="stylesheet" href="/assets/kvm-design2.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
/* Huisstijl Koers voor Morgen (1 sep 2026): nachtblauw #0D1B2A, petrolgroen #3D6B63,
   warm off-white #F6F2EA, lichtgrijs #DCE2DD, goud #C49A4A. --red/--info/--purple blijven
   semantisch (fout/info/tag) ongewijzigd. */
:root{--void:#f6f2ea;--panel:#fff;--card:#ebeef1;--border:#d9dee3;--border2:#bfc8d0;--muted:#5a6974;--mid:#42525e;--sub:#16232e;--head:#0d1b2a;--teal:#3d6b63;--teal-dim:#2c4f4a;--teal-dark:#12352d;--teal-bg:rgba(61,107,99,.1);--gold:#c49a4a;--gold-bg:rgba(196,154,74,.12);--gold-dark:#8a6a2e;--red:#e05252;--red-bg:rgba(224,82,82,.1);--info:#2a5ea0;--info-bg:#eef3fa;--info-dim:#4a6ea0;--purple:#7c5cbf;--purple-bg:#f3f0ff;--purple-border:#c8b8f0;--r:6px;--r2:10px}
/* Nachtmodus: volgt de systeeminstelling van het apparaat (dag/avond), geen aparte knop nodig.
   Alleen de kleurvariabelen wisselen — de rest van de CSS/JS gebruikt overal var(--x), dus dat
   verft automatisch mee. De vaste merkkleuren van documentknoppen (bieding/SPA/waardering) en de
   afgedrukte contract-/waarderingsdocumenten blijven bewust ongewijzigd — die horen altijd hetzelfde
   te ogen, ongeacht dag- of nachtmodus. */
@media(prefers-color-scheme:dark){
  :root{--void:#0d1b2a;--panel:#132534;--card:#16293a;--border:#24384a;--border2:#33485c;--muted:#8ca0ae;--mid:#a6b8c4;--sub:#e2e9ee;--head:#f4f1e9;--teal:#5e9b8f;--teal-dim:#4a8377;--teal-dark:#9cc8bd;--teal-bg:rgba(94,155,143,.16);--gold:#d8b36a;--gold-bg:rgba(216,179,106,.14);--gold-dark:#e8cf9a;--red:#e8746b;--red-bg:rgba(232,116,107,.14);--info:#6ea8e0;--info-bg:rgba(110,168,224,.14);--info-dim:#8fb8e8;--purple:#b39ce0;--purple-bg:rgba(179,156,224,.16);--purple-border:#8f74b8}
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f label .req{color:var(--red)}
.req-tag{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--red);background:var(--red-bg);border:1px solid var(--red);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle;line-height:1.5}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus{border-color:var(--teal)}
/* Documentenflow horizontaal i.p.v. verticaal (11 sep 2026, Marcel: "documentflow wil ik
   horizontaal en niet verticaal") — een grid dat vanzelf naar een volgende rij wrapt i.p.v. één
   lange verticale stappenlijn met 17 rijen. */
.stap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin:.5rem 0 .75rem}
.stap-kaart{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r2);padding:.7rem .8rem;min-height:88px;box-sizing:border-box;transition:border-color .12s ease,transform .12s ease}
.stap-kaart:hover:not([disabled]){border-color:var(--teal);transform:translateY(-1px)}
.stap-kaart:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.stap-kaart[disabled]{cursor:not-allowed;opacity:.45}
.stap-kaart-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.stap-kaart-naam{font-size:12.5px;font-weight:600;color:var(--head);line-height:1.3}
.stap-kaart-status{font-size:10.5px;color:var(--muted);line-height:1.3}
.stap-kaart-badge{display:block;margin-top:3px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--teal);border-radius:8px;padding:2px 7px;width:fit-content}
@media(max-width:600px){.stap-grid{grid-template-columns:repeat(2,1fr)}}
.f input.missing{border-color:var(--red);background:var(--red-bg)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
/* Audit-fix P3 (26 juli 2026): het fase-detailscherm (velddata + documentsectie) gebruikte een
   inline grid-template-columns, dat wint qua CSS-specificiteit altijd van een class-based
   media-query — dus de bestaande @media(max-width:600px){.data-grid...}-regel had daar nooit
   effect. Eigen klasse i.p.v. de inline stijl, zodat de responsive override wél werkt. */
.data-grid-sidebar{display:grid;grid-template-columns:1fr 280px;gap:1.25rem;align-items:start}
@media(max-width:600px){.data-grid-sidebar{grid-template-columns:1fr}}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
/* Checklist - only for MNA view */
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
/* AI panel */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
.ai-body ul,.ai-body ol{margin:.4rem 0 .75rem 1.25rem}
.ai-body li{margin-bottom:.3rem;line-height:1.6}
/* Fase grid */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* Bevinding 12 sep 2026: gegenereerde documentuitvoer verscheen ver onder de aangeklikte knop, met
   alleen scrollIntoView als hint — bij een lange fasepagina makkelijk te missen. Een korte, duidelijke
   gloed rond de uitvoercontainer maakt onmiskenbaar wáár het net verschenen resultaat staat. */
@keyframes docKlaarGloed{0%,100%{box-shadow:0 0 0 0 transparent}20%,60%{box-shadow:0 0 0 3px var(--teal)}}
.doc-klaar-gloed{animation:docKlaarGloed 1.8s ease-in-out 2}
.save-indicator{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}
/* Cover letter */
.cover-letter{background:var(--panel);border:2px solid var(--teal);border-radius:var(--r2);padding:2rem;margin-bottom:1.5rem}
.cover-letter h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--head);font-weight:600;margin-bottom:1rem}
.cover-letter p{font-size:13px;color:var(--mid);margin-bottom:.75rem;line-height:1.75}
/* Missing fields summary */
.missing-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem}
.missing-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.missing-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--red);border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none}
.complete-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--teal);border-bottom:1px solid var(--border)}
.complete-item:last-child{border-bottom:none}
/* Koper read-only view */
.readonly-val{font-size:13px;color:var(--sub);padding:8px 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-height:36px}
.readonly-val.empty{color:var(--muted);font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .25s ease forwards}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem;background:var(--card)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:var(--teal-bg)}
.upload-zone input{display:none}
.doc-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem}
.doc-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.doc-naam{font-size:12px;font-weight:600;color:var(--head)}
.doc-type{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.doc-analyse{font-size:12px;color:var(--mid);line-height:1.6;margin-top:.4rem;max-height:200px;overflow-y:auto;padding:.5rem;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.doc-velden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:.5rem}
.doc-veld{background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:4px;padding:4px 8px}
.doc-veld-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dim);font-weight:600}
.doc-veld-val{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);font-weight:600}
.upload-progress{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:.5rem;display:none}
.upload-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
.btn-del{background:transparent;border:1px solid var(--border2);color:var(--red);font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:var(--r)}
.btn-del:hover{background:var(--red-bg);border-color:var(--red)}
@keyframes prog{from{width:20%}to{width:85%}}
@media print{
  @page{margin:2cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.prog-bar{display:none!important}
  #chat-fab,#chat-venster,.toast-container,#toast,#docs-toggle-ic{display:none!important}
  /* break-inside:avoid op .panel is bewust verwijderd — het hoofd-invulpaneel per fase (ook class
     .panel) is vaak hoger dan één pagina; "niet afbreken" dwong dan de hele pagina 1 leeg te laten
     terwijl het paneel in zijn geheel naar pagina 2 verhuisde. Losse regelblokken mogen gewoon
     over een paginagrens heen lopen. */
  .doc-veld{break-inside:avoid}
  #w-ai-hist,#w-ai-hist *{display:none!important}
  /* Scrollbare tekstvakken worden op papier anders afgekapt op hun schermhoogte — bij printen
     alles tonen (analyse-tekst in de dataroom, dealvoorstel-preview, interne bijlage). */
  .doc-analyse,#dv-preview,#dv-bijlage,.doc-analyse *{max-height:none!important;overflow:visible!important}
  body{font-size:11px}
}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:13px;color:var(--sub);box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:flex-start;gap:10px;max-width:340px;pointer-events:auto;animation:toastIn .25s ease forwards;border-left:4px solid var(--teal)}
.toast.toast-ok{border-left-color:var(--teal)}.toast.toast-err{border-left-color:var(--red)}.toast.toast-warn{border-left-color:var(--gold)}.toast.toast-info{border-left-color:#2a5ea0}
.toast.hide{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:1.75rem;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:1.25rem}

/* #97 M&A Journey (mna/22-journey.js) */
.jr{display:grid;gap:.75rem;padding:.25rem 0 .5rem}
.jr-kop{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.jr-titel{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;color:var(--head)}
.jr-sub{font-size:11px;color:var(--muted)}
.jr-volgende{background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--r);padding:.45rem .75rem;font-size:12px;display:flex;flex-direction:column;max-width:100%}
.jr-volgende span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
.jr-volgende b{color:var(--sub);font-weight:600}
.jr-lijn{list-style:none;margin:0;padding:0 0 .35rem;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(112px,1fr);gap:6px;overflow-x:auto;scroll-snap-type:x proximity;counter-reset:jr}
.jr-lijn li{scroll-snap-align:start}
.jr-stap.jr-nvt{opacity:.6;border-style:dashed}
.jr-lijn li{min-width:0}
.jr-stap{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .55rem;cursor:pointer;color:var(--sub);font:12px 'IBM Plex Sans',sans-serif;position:relative}
.jr-stap:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.jr-stap .jr-nr{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--panel);border:1px solid var(--border2);color:var(--mid)}
.jr-stap .jr-naam{font-size:11.5px;line-height:1.3;font-weight:500;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.jr-stap .jr-nu{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dark)}
.jr-stap.jr-gereed .jr-nr{background:var(--teal);border-color:var(--teal);color:#fff}
.jr-stap.jr-bezig .jr-nr{border-color:var(--gold);color:var(--gold-dark)}
.jr-stap.jr-actief{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal);background:var(--panel)}
.jr-stap.jr-huidig{border-color:var(--gold)}
.jr-paneel{border:1px solid var(--border);border-radius:var(--r2);padding:.85rem 1rem;background:var(--panel)}
.jr-paneel-kop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
/* WF-001 contexttabs per mandaat (mna/24) */
/* UX 05-11-2026: begeleider werkt in één applicatie met vaste navigatie links en afzonderlijke schermen (mna/24). */
#app.mt-shell{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
#app.mt-shell>:not(#mt-zij){grid-column:2;min-width:0}
#app.mt-shell .wrap{max-width:1080px}
#mt-zij{grid-column:1;grid-row:1/span 200;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1rem .75rem;gap:.75rem;z-index:30}
.mt-zij-kop{display:flex;flex-direction:column;gap:2px;padding:0 .5rem .75rem;border-bottom:1px solid var(--border)}
.mt-zij-merk{font-family:'Playfair Display',serif;font-size:15px;color:var(--head)}
.mt-zij-traject{font-size:13px;font-weight:600;color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
