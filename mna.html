<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&A Begeleiding - KantoorInzicht</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:2rem 2rem 5rem}
.narrow{max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-sm{font-size:11px;padding:5px 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f label .req{color:var(--red)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:border-color .12s}
.f input:focus,.f textarea:focus{border-color:var(--teal)}
.f input.missing{border-color:var(--red);background:var(--red-bg)}
.f textarea{resize:vertical;min-height:60px}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:600px){.data-grid{grid-template-columns:1fr}}
@media(max-width:768px){.fase-upload-grid{grid-template-columns:1fr!important}}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .5s}
/* Checklist - only for MNA view */
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:5px;user-select:none;-webkit-user-select:none}
.chk-item:hover{border-color:var(--border2)}
.chk-item.on{border-color:var(--teal);background:var(--teal-bg)}
.chk-item.rf{border-color:var(--red)}
.chk-item.rf.on{background:rgba(224,82,82,.1)}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chk-item.on .chk-box{background:var(--teal);border-color:var(--teal);color:#fff}
.chk-item.rf .chk-box{border-color:var(--red)}
.chk-item.rf.on .chk-box{background:var(--red);border-color:var(--red);color:#fff}
.chk-lbl{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
.chk-item.on .chk-lbl{color:var(--teal-dim)}
.chk-item.rf .chk-lbl{color:var(--red)}
/* AI panel */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:1.5rem}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.6rem}
.ai-title{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--head);font-weight:600}
.ai-sub{font-size:10px;color:var(--muted)}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.1rem 1.25rem;font-size:13px;color:var(--mid);line-height:1.8;min-height:50px}
.ai-body h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--head);margin:1rem 0 .35rem;padding-top:1rem;border-top:1px solid var(--border)}
.ai-body h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-body p{margin-bottom:.5rem}
.ai-body strong{color:var(--sub);font-weight:600}
/* Fase grid */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:680px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
.fase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:.9rem;cursor:pointer;transition:all .15s}
.fase-card:hover,.fase-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}
.fase-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:.2rem}
.fase-name{font-size:12px;font-weight:600;color:var(--head);margin-bottom:.35rem;line-height:1.3}
.fase-bar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;margin-bottom:.2rem}
.fase-fill{height:100%;background:var(--teal);border-radius:2px}
.fase-pct{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.fase-nav{display:flex;gap:8px;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.save-indicator{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}
/* Cover letter */
.cover-letter{background:var(--panel);border:2px solid var(--teal);border-radius:var(--r2);padding:2rem;margin-bottom:1.5rem}
.cover-letter h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--head);font-weight:600;margin-bottom:1rem}
.cover-letter p{font-size:13px;color:var(--mid);margin-bottom:.75rem;line-height:1.75}
/* Missing fields summary */
.missing-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem}
.missing-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.missing-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--red);border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none}
.complete-item{font-size:12px;padding:3px 0 3px .75rem;color:var(--teal);border-bottom:1px solid var(--border)}
.complete-item:last-child{border-bottom:none}
/* Koper read-only view */
.readonly-val{font-size:13px;color:var(--sub);padding:8px 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-height:36px}
.readonly-val.empty{color:var(--muted);font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .25s ease forwards}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem;background:var(--card)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:var(--teal-bg)}
.upload-zone input{display:none}
.doc-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem}
.doc-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.doc-naam{font-size:12px;font-weight:600;color:var(--head)}
.doc-type{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.doc-analyse{font-size:12px;color:var(--mid);line-height:1.6;margin-top:.4rem;max-height:200px;overflow-y:auto;padding:.5rem;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.doc-velden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:.5rem}
.doc-veld{background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:4px;padding:4px 8px}
.doc-veld-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dim);font-weight:600}
.doc-veld-val{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);font-weight:600}
.upload-progress{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:.5rem;display:none}
.upload-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
@media print{
  @page{margin:2cm;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .btn,.btn-ghost,.btn-gen,.fase-nav,.fase-grid,.prog-bar{display:none!important}
  .ai-panel,.panel{break-inside:avoid}
  body{font-size:11px}
}
</style>
</head>

function triggerFileUpload(faseId) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.docx,.doc,.xlsx,.xls,.csv';
  input.multiple = true;
  document.body.appendChild(input);

    var files = e.target.files;
    for (var i = 0; i < files.length; i++) uploadDocument(faseId, files[i]);
    document.body.removeChild(input);
  });
  input.click();
}

function pct(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return 0;var d=f.items.filter(function(_,i){return S.checked[id+'_'+i];}).length;return f.items.length?Math.round(d/f.items.length*100):0;}
function fillPct(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return 0;var req=f.dataFields.filter(function(df){return df.req;});var done=req.filter(function(df){return !!(S.data[id+'_'+df.id]||'').trim();}).length;return req.length?Math.round(done/req.length*100):100;}
function totalFillPct(){var t=0,d=0;FASES.forEach(function(f){var req=f.dataFields.filter(function(df){return df.req;});t+=req.length;d+=req.filter(function(df){return !!(S.data[f.id+'_'+df.id]||'').trim();}).length;});return t?Math.round(d/t*100):0;}
function dc(v){return v>=70?'var(--teal)':v>=50?'var(--gold)':'var(--red)';}
function ge(id){return document.getElementById(id);}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isVerkoper(){return S.rol==='verkoper';}
function isKoper(){return S.rol==='koper';}
function isTussen(){return S.rol==='tussenpersoon';}

function getMissing(){
  var missing=[];
  FASES.forEach(function(f){
    var missingFields=f.dataFields.filter(function(df){return df.req&&!(S.data[f.id+'_'+df.id]||'').trim();});
    if(missingFields.length)missing.push({fase:f.num+'. '+f.title,fields:missingFields.map(function(df){return df.label;})});
  });
  return missing;
}

function saveCurrent(cb){
  var f=FASES[S.fase];
  if(!f||S.screen!=='main'||isKoper())return;
  if(S.traject&&S.traject.status==='vergrendeld'){if(cb)cb();return;}
  f.dataFields.forEach(function(df){
    var el=ge('df_'+df.id);if(el)S.data[f.id+'_'+df.id]=el.value;
    if(df.doc){var re=ge('dr_'+df.id);if(re)S.docRefs[f.id+'_'+df.id]=re.value;}
  });
  var nel=ge('notitie_'+f.id);if(nel)S.notities[f.id]=nel.value;
  clearTimeout(S.saveTimer);
  S.saveTimer=setTimeout(function(){
    fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:S.code,fase_id:f.id,data_json:getDataForFase(f.id),checklist_json:getChecklistForFase(f.id),notitie:S.notities[f.id]||''})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error==='vergrendeld'){showAlert('Dit traject is vergrendeld. Uw wijzigingen zijn niet opgeslagen.');}
      else{showSaveIndicator();}
    }).catch(function(){});
    if(cb)cb();
  },800);
}

function getDataForFase(id){var f=FASES.find(function(x){return x.id===id;});if(!f)return {};var out={};f.dataFields.forEach(function(df){var v=S.data[id+'_'+df.id];var r=S.docRefs[id+'_'+df.id];if(v||r)out[df.id]={value:v||'',ref:r||'',label:df.label,req:df.req||false};});return out;}
function getChecklistForFase(id){var out={items:{},redflags:{}};var f=FASES.find(function(x){return x.id===id;});if(!f)return out;f.items.forEach(function(_,i){out.items[i]=!!S.checked[id+'_'+i];});f.redflags.forEach(function(_,i){out.redflags[i]=!!S.checked[id+'_rf_'+i];});return out;}
function loadDataFromDB(dbData){dbData.forEach(function(row){var id=row.fase_id;var dj=typeof row.data_json==='string'?JSON.parse(row.data_json||'{}'):row.data_json||{};var cj=typeof row.checklist_json==='string'?JSON.parse(row.checklist_json||'{}'):row.checklist_json||{};var f=FASES.find(function(x){return x.id===id;});if(!f)return;Object.keys(dj).forEach(function(k){var v=dj[k];if(v&&v.value)S.data[id+'_'+k]=v.value;if(v&&v.ref)S.docRefs[id+'_'+k]=v.ref;});if(cj.items)Object.keys(cj.items).forEach(function(i){S.checked[id+'_'+i]=cj.items[i];});if(cj.redflags)Object.keys(cj.redflags).forEach(function(i){S.checked[id+'_rf_'+i]=cj.redflags[i];});if(row.notitie)S.notities[id]=row.notitie;});}
function showSaveIndicator(){var el=ge('save-ind');if(!el)return;el.textContent='Opgeslagen';el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2000);}
function showAlert(msg){alert(msg);}
function schedSave(){if(S.traject&&S.traject.status==='vergrendeld')return;clearTimeout(S.saveTimer);S.saveTimer=setTimeout(function(){saveCurrent();},1200);}

function loadDocsForFase(faseId) {

          id: d.id, naam: d.bestand_naam, type: d.bestand_type,
          grootte: d.bestand_grootte, analyse: d.analyse,
          velden: JSON.parse(d.veld_extractie||'{}'),
          bewaard: !!d.bewaard, methode: d.methode, uploading: false
        };
      });
      renderApp();
    }).catch(function(){});
}

async function uploadDocument(faseId, file) {
  if (!S.code || isKoper()) return;
  if (S.traject && S.traject.status === 'vergrendeld') { alert('Traject is vergrendeld.'); return; }
  var maxSize = 20 * 1024 * 1024;
  if (file.size > maxSize) { alert('Bestand te groot (max 20MB). Huidig: ' + Math.round(file.size/1024/1024) + 'MB'); return; }

  // Show uploading state
  if (!DOCS[faseId]) DOCS[faseId] = [];
  var tempId = 'uploading_' + Date.now();
  DOCS[faseId].unshift({ id: tempId, naam: file.name, type: file.type, grootte: file.size, analyse: '', velden: {}, uploading: true });
  renderApp();

  var formData = new FormData();
  formData.append('file', file);
  var bewaar = S.traject && S.traject.bewaar_docs !== false;
  var url = WORKER + '/mna/document/upload?code=' + S.code + '&fase_id=' + faseId + '&bewaar=' + bewaar;

  try {
    var resp = await fetch(url, { method: 'POST', body: formData });
    var d = await resp.json();
    if (d.ok) {
      // Replace temp with real
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      DOCS[faseId].unshift({
        id: d.doc_id, naam: file.name, type: file.type, grootte: file.size,
        analyse: d.analyse, velden: d.veld_extractie || {}, bewaard: !!d.r2_opgeslagen, uploading: false
      });
      // Auto-fill fields from extraction
      if (d.veld_extractie) autoFillFromExtraction(faseId, d.veld_extractie, file.name);
    } else {
      DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
      alert('Upload fout: ' + (d.error || 'onbekend'));
    }
  } catch(e) {
    DOCS[faseId] = DOCS[faseId].filter(function(x){ return x.id !== tempId; });
    alert('Verbindingsfout bij uploaden.');
  }
  renderApp();
}

function autoFillFromExtraction(faseId, velden, fileName) {
  function setIfEmpty(key, value) {
    if (value && value !== 'null' && !(S.data[key] || '').trim()) S.data[key] = String(value);
  }
  if (faseId === 'financieel') {
    var opy = velden.omzet_per_jaar || {};
    var jaren = Object.keys(opy).filter(function(j){ return opy[j] && opy[j] !== 'null'; })
      .map(Number).filter(function(j){ return !isNaN(j); }).sort(function(a,b){ return a-b; });
    if (jaren.length >= 1) {
      ['omzet1','omzet2','omzet3'].forEach(function(veld,i){
        if(jaren[i]) setIfEmpty('financieel_'+veld, opy[String(jaren[i])]);
      });
    } else { setIfEmpty('financieel_omzet3', velden.omzet); }
    setIfEmpty('financieel_ebitda',            velden.ebitda_pct);
    setIfEmpty('financieel_ebitdaNorm',        velden.resultaat);
    setIfEmpty('financieel_wip',               velden.ohw);
    setIfEmpty('financieel_debiteuren',        velden.debiteuren);
    setIfEmpty('financieel_omzetJaarwerk',     velden.omzet_jaarwerk_pct);
    setIfEmpty('financieel_omzetAdvies',       velden.omzet_advies_pct);
    setIfEmpty('financieel_omzetLoon',         velden.omzet_loon_pct);
    setIfEmpty('financieel_omzetFiscaal',      velden.omzet_fiscaal_pct);
    setIfEmpty('financieel_omzetOverig',       velden.omzet_overig_pct);
    setIfEmpty('financieel_kostenPersoneel',   velden.kosten_personeel_pct);
    setIfEmpty('financieel_kostenHuisvesting', velden.kosten_huisvesting_pct);
    setIfEmpty('financieel_kostenIT',          velden.kosten_it_pct);
    setIfEmpty('financieel_kostenMarketing',   velden.kosten_marketing_pct);
  }
  if (faseId === 'partner') { setIfEmpty('partner_fte', velden.fte); }
  if (fileName) {
    var f = FASES.find(function(x){ return x.id === faseId; });
    if (f) f.dataFields.forEach(function(df) {
      if (df.doc) {
        var refKey = faseId + '_' + df.id;
        if (!S.docRefs[refKey] || !S.docRefs[refKey].trim()) S.docRefs[refKey] = fileName;
      }
    });
  }
}

async function deleteDocument(docId, faseId) {
  if (!confirm('Document verwijderen?')) return;
  await fetch(WORKER + '/mna/document/delete/' + docId, { method: 'POST' }).catch(function(){});
  Object.keys(DOCS).forEach(function(fid) {
    DOCS[fid] = DOCS[fid].filter(function(d){ return d.id !== docId; });
  });
  renderApp();
}

function renderDocumentSectie(faseId) {
  var docs = getDocsForFase(faseId);
  var isReadOnly = isKoper() || (S.traject && S.traject.status === 'vergrendeld');
  var uploadHtml = '';

  if (!isReadOnly) {
    uploadHtml = '<div class="upload-zone" id="upload-zone-' + faseId + '" data-fase="' + faseId + '" ondragover="event.preventDefault();this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="event.preventDefault();this.classList.remove(\'drag\');handleDropUpload(event,' + JSON.stringify(faseId) + ')">'
      + '<div style="font-size:24px;margin-bottom:.4rem">&#128196;</div>'
      + '<div style="font-size:13px;font-weight:600;color:var(--mid);margin-bottom:.2rem">Klik om document te uploaden of sleep hier naartoe</div>'
      + '<div style="font-size:11px;color:var(--muted)">PDF, Word, Excel, CSV &middot; max 20MB &middot; AI leest en analyseert automatisch</div>'
      + '</div>';
  }

  var docsHtml = docs.map(function(doc) {
    var icon = doc.type && doc.type.includes('pdf') ? '&#128209;' : doc.naam && doc.naam.endsWith('.csv') ? '&#128202;' : doc.naam && (doc.naam.endsWith('.xlsx')||doc.naam.endsWith('.xls')) ? '&#128202;' : '&#128196;';
    var grootteMb = (doc.grootte / 1024 / 1024).toFixed(1);

    var veldenHtml = '';
    if (doc.velden && Object.keys(doc.velden).length) {
      var relevantVelden = Object.entries(doc.velden).filter(function(kv){ return kv[1] && kv[1] !== 'null'; });
      if (relevantVelden.length) {
        veldenHtml = '<div class="doc-velden">'
          + relevantVelden.map(function(kv){
            var labels = {omzet:'Omzet',ebitda_pct:'EBITDA%',fte:'FTE',resultaat:'Resultaat',eigen_vermogen:'Eigen verm.',vreemd_vermogen:'Vreemd verm.',solvabiliteit:'Solvabiliteit',overige_bevindingen:'Bevinding'};
            return '<div class="doc-veld"><div class="doc-veld-lbl">' + (labels[kv[0]]||kv[0]) + '</div><div class="doc-veld-val">' + String(kv[1]).substring(0,20) + '</div></div>';
          }).join('')
          + '</div>';
      }
    }

    var analyseHtml = doc.uploading
      ? '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:.4rem"><div class="spin" style="border-color:var(--border2);border-top-color:var(--teal);width:12px;height:12px"></div>Uploaden en analyseren...</div>'
      : (doc.analyse ? '<div class="doc-analyse">' + doc.analyse.replace(/## ([^\r\n]+)/g,'<strong>$1</strong><br>').replace(/[\r\n]/g,'<br>').substring(0,1500) + (doc.analyse.length>1500?'...':'') + '</div>' : '');

    return '<div class="doc-card">'
      + '<div class="doc-card-hdr">'
      + '<div><span style="font-size:16px;margin-right:6px">' + icon + '</span><span class="doc-naam">' + doc.naam + '</span> <span class="doc-type">' + grootteMb + 'MB' + (doc.bewaard?' &middot; opgeslagen':' &middot; alleen analyse') + '</span></div>'
      + (!isReadOnly && !doc.uploading ? '<button onclick="deleteDocument(' + JSON.stringify(doc.id) + ',' + JSON.stringify(faseId) + ')" class="btn-del" style="font-size:10px;padding:2px 7px">Verwijder</button>' : '')
      + '</div>'
      + veldenHtml
      + analyseHtml
      + '</div>';
  }).join('');

  return '<div class="panel" id="doc-sectie-' + faseId + '"><div class="sec-hdr">Documenten &amp; AI-analyse</div>'
    + uploadHtml + docsHtml
    + (docs.length === 0 && isReadOnly ? '<div style="color:var(--muted);font-size:13px;font-style:italic">Geen documenten geupload voor deze fase.</div>' : '')
    + '</div>';
}

function handleFileUpload(event, faseId) {
  var files = event.target.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
  event.target.value = '';
}

function handleDropUpload(event, faseId) {
  var files = event.dataTransfer.files;
  for (var i = 0; i < files.length; i++) {
    uploadDocument(faseId, files[i]);
  }
}

an gewerkte uren dat wordt gefactureerd. Benchmark: 75–85%.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">Recurring omzet</strong> — Vaste terugkerende omzet op abonnements- of retainerbasis. PE-norm: &gt;60%.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">YTD</strong> — Year-to-Date: omzet of resultaat vanaf 1 januari tot heden.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">Wwft</strong> — Wet ter voorkoming van witwassen. Aantoonbare implementatie vereist bij due diligence.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">STAK</strong> — Stichting Administratiekantoor; juridische structuur met certificaten i.p.v. aandelen.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">Partnerbeloning</strong> — Totale vergoeding aan eigenaren. Marktconform = vergelijkbaar met een medewerker in die rol.</div>'+'<div style="font-size:11px;color:var(--mid);padding:3px 0;border-bottom:1px solid var(--border)"><strong style="color:var(--sub)">Due diligence (DD)</strong> — Diepgaand onderzoek naar alle aspecten van het kantoor vóór een transactie.</div>'+'</div></div>'

      dataHtml+='<div class="f"><label>'+df.label+(df.req?' <span class="req">*</span>':'')+(df.doc?' <span style="color:var(--gold);font-size:9px">&#128196; ref</span>':'')+'</label>'

  // Marcel-only: checklist + rode vlaggen + notities + AI

    var aiText=S.aiTexts[f.id];var aiLoad=S.aiLoading[f.id];

    +'</div>';

  var lockedBanner=vergrendeld?'<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red)">&#128274; <strong>Dit traject is vergrendeld.</strong> U kunt geen wijzigingen meer doorvoeren.</div>':'';

    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1rem">Voortgang: <span style="font-family:IBM Plex Mono,monospace;color:'+(tp===100?'var(--teal)':tp>50?'var(--gold)':'var(--red)')+'">'+tp+'%</span></div>'

function renderSummary(){
  var missing=getMissing();
  var vergrendeld=S.traject&&S.traject.status==='vergrendeld';
  var completeFases=FASES.filter(function(f){return fillPct(f.id)===100;});
  var incompleteFases=FASES.filter(function(f){return fillPct(f.id)<100;});

  // Summary cards
  var cards='';
  FASES.forEach(function(f){
    var p=isVerkoper()?fillPct(f.id):pct(f.id);
    var dataRows='';
    f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataRows+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">'+df.label+(df.req?' *':'')+'</span><span style="font-family:IBM Plex Mono,monospace;font-size:11px">'+esc(v)+(r?' <span style="color:var(--gold)">&#128196;'+esc(r)+'</span>':'')+'</span></div>';else if(df.req)dataRows+='<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--red)">&#9888; '+df.label+': niet ingevuld</div>';});
    var rfHits=f.redflags.filter(function(_,i){return S.checked[f.id+'_rf_'+i];});
    cards+='<div class="panel" style="border-color:'+(p===100?'var(--teal)':'var(--border)')+'"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:flex;justify-content:space-between"><span>'+(isVerkoper()?'':f.num+'. ')+f.title+'</span><span style="color:'+(p===100?'var(--teal)':p>50?'var(--gold)':'var(--red)')+'">'+p+'%</span></div>'
      +dataRows+(rfHits.length&&!isVerkoper()?'<div style="margin-top:.4rem">'+rfHits.map(function(rf){return '<div style="font-size:11px;color:var(--red)">&#9888; '+rf+'</div>';}).join('')+'</div>':'')
      +(S.notities[f.id]&&!isVerkoper()?'<div style="font-size:11px;color:var(--mid);margin-top:.35rem;font-style:italic">'+esc(S.notities[f.id].substring(0,120))+'</div>':'')
      +'</div>';
  });

  // Missing fields block
  var missingHtml='';
  if(missing.length&&isVerkoper()){
    missingHtml='<div class="panel" style="border-color:var(--red)">'
      +'<div style="font-size:13px;font-weight:600;color:var(--red);margin-bottom:.75rem">&#9888; Nog '+missing.reduce(function(a,m){return a+m.fields.length;},0)+' verplichte velden niet ingevuld</div>';
    missing.forEach(function(m){
      missingHtml+='<div style="margin-bottom:.6rem"><div style="font-size:12px;font-weight:600;color:var(--sub);margin-bottom:.2rem">'+esc(m.fase)+'</div>';
      m.fields.forEach(function(field){missingHtml+='<div style="font-size:12px;color:var(--red);padding:2px 0 2px .75rem">&#8212; '+esc(field)+'</div>';});
      missingHtml+='</div>';
    });
    missingHtml+='</div>';
  }

  var tp=isVerkoper()?totalFillPct():Math.round(FASES.reduce(function(a,f){return a+pct(f.id);},0)/FASES.length);
  return '<div class="wrap anim">'
    +'<div class="hdr"><div class="brand"><div class="wdot"></div>KantoorInzicht &middot; M&amp;A</div>'
    +'<div style="display:flex;gap:8px"><button class="btn-ghost btn-sm" onclick="window.print()">PDF</button><button class="btn-ghost btn-sm" id="back-main">&#8592; Terug</button></div></div>'
    +(vergrendeld?'<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red)">&#128274; Vergrendeld op '+(S.traject.vergrendeld_op?new Date(S.traject.vergrendeld_op).toLocaleString('nl-NL'):'')+'</div>':'')
    +'<div style="font-family:Playfair Display,serif;font-size:1.4rem;color:var(--head);font-weight:600;margin-bottom:.25rem">DD Samenvatting</div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:1.5rem">'+esc(S.traject&&S.traject.kantoor_naam||S.code)+' &middot; '+new Date().toLocaleDateString('nl-NL',{day:'2-digit',month:'long',year:'numeric'})+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem">'
    +'<div class="panel" style="text-align:center;padding:1rem"><div style="font-family:Playfair Display,serif;font-size:1.8rem;font-weight:600;color:'+(tp===100?'var(--teal)':tp>50?'var(--gold)':'var(--red)')+'">'+tp+'%</div><div style="font-size:10px;text-transform:uppercase;color:var(--muted)">'+(isVerkoper()?'Ingevuld':'Checklist')+'</div></div>'
    +'<div class="panel" style="text-align:center;padding:1rem"><div style="font-family:Playfair Display,serif;font-size:1.8rem;font-weight:600;color:var(--teal)">'+completeFases.length+'</div><div style="font-size:10px;text-transform:uppercase;color:var(--muted)">Fasen compleet</div></div>'
    +'<div class="panel" style="text-align:center;padding:1rem"><div style="font-family:Playfair Display,serif;font-size:1.8rem;font-weight:600;color:var(--red)">'+missing.reduce(function(a,m){return a+m.fields.length;},0)+'</div><div style="font-size:10px;text-transform:uppercase;color:var(--muted)">Velden ontbreken</div></div>'
    +'</div>'
    +missingHtml
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+cards+'</div>'
    +'</div>';
}

async function generateAI(faseId){
  var f=FASES.find(function(x){return x.id===faseId;});if(!f)return;
  saveCurrent();S.aiLoading[faseId]=true;renderApp();
  var dataLines=[];f.dataFields.forEach(function(df){var v=S.data[f.id+'_'+df.id];var r=S.docRefs[f.id+'_'+df.id];if(v)dataLines.push(df.label+': '+v+(r?' (doc: '+r+')':''));});
  var chk=f.items.filter(function(_,i){return S.checked[faseId+'_'+i];});
  var open=f.items.filter(function(_,i){return !S.checked[faseId+'_'+i];});
  var rfs=f.redflags.filter(function(_,i){return S.checked[faseId+'_rf_'+i];});
  var prompt='Je bent Marcel Bisschops, senior M&A-adviseur gespecialiseerd in accountantskantoren en administratiekantoren. Traject: '+esc(S.traject&&S.traject.traject_type||'M&A')+' voor "'+esc(S.traject&&S.traject.kantoor_naam||S.code)+'".\n\nFASE: '+f.title+'\n\nINGEVOERDE DATA:\n'+(dataLines.join('\n')||'Geen data')+'\n\nCHECKLIST:\nGereed: '+(chk.join(', ')||'niets')+'\nOpen: '+(open.join(', ')||'alles gereed')+'\n\nRODE VLAGGEN: '+(rfs.join(', ')||'geen')+'\n\nNOTITIES: '+(S.notities[faseId]||'geen')+'\n\nGeef beknopt strategisch advies. Analyseer de cijfers expliciet en vergelijk met sectorgemiddelden. Bespreek: voortgang en prioriteiten, urgente openstaande punten, impact rode vlaggen, concrete vervolgstappen. Schrijf in ik-vorm. Gebruik ## koppen. Geen tabellen of bullets.';
  try{
    var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader();var dec=new TextDecoder();var collected='';
    while(true){var res=await reader.read();if(res.done)break;dec.decode(res.value,{stream:true}).split('\n').forEach(function(line){if(line.startsWith('data:')){var d=line.slice(5).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)collected+=j.delta.text;}catch(e){}}});}
    S.aiTexts[faseId]=collected;
  }catch(e){S.aiTexts[faseId]='__ERROR__';}
  S.aiLoading[faseId]=false;renderApp();
}

function bindAll(){
  var lb=ge('l-btn');
  if(lb){
    lb.onclick=async function(){
      var code=((ge('l-code')||{}).value||'').trim().toUpperCase();
      if(!code)return;
      var err=ge('l-err');var load=ge('l-load');
      if(err)err.style.display='none';if(load)load.style.display='block';lb.disabled=true;
      try{
        var resp=await fetch(WORKER+'/mna/traject/'+code);
        if(!resp.ok)throw new Error('not found');
        var d=await resp.json();
        S.code=code;S.traject=d.traject;S.rol=d.rol||'verkoper';
        if(d.data&&d.data.length)loadDataFromDB(d.data);
        S.screen='cover';renderApp();
      }catch(e){if(err)err.style.display='block';if(load)load.style.display='none';lb.disabled=false;}
    };
    var cf=ge('l-code');
    if(cf){cf.oninput=function(){this.value=this.value.toUpperCase();};cf.onkeydown=function(e){if(e.key==='Enter')lb.click();};}
  }
  var toMain=ge('to-main-btn');if(toMain)toMain.onclick=function(){S.screen='main';var fId=FASES[S.fase]&&FASES[S.fase].id;if(fId&&!DOCS[fId])loadDocsForFase(fId);renderApp();};
  var toMain2=ge('to-main-btn2');if(toMain2)toMain2.onclick=function(){S.screen='main';renderApp();};
  var coverBtn=ge('cover-btn');if(coverBtn)coverBtn.onclick=function(){saveCurrent();S.screen='cover';renderApp();};
  var backMain=ge('back-main');if(backMain)backMain.onclick=function(){S.screen='main';renderApp();};
  var sumBtn=ge('sum-btn');if(sumBtn)sumBtn.onclick=function(){S.showValidation=true;saveCurrent();S.screen='summary';renderApp();};
  var sumBtn2=ge('sum-btn2');if(sumBtn2)sumBtn2.onclick=function(){S.showValidation=true;saveCurrent();S.screen='summary';renderApp();};
  var prevBtn=ge('prev-btn');if(prevBtn)prevBtn.onclick=function(){saveCurrent();S.fase--;renderApp();};
  var nextBtn=ge('next-btn');if(nextBtn)nextBtn.onclick=function(){saveCurrent();S.fase++;renderApp();};
  var genBtn=ge('gen-btn');if(genBtn)genBtn.onclick=function(){generateAI(FASES[S.fase].id);};
  document.querySelectorAll('.fase-card[data-fi]').forEach(function(el){el.onclick=function(){
    saveCurrent();
    var newFase=parseInt(el.dataset.fi);
    S.fase=newFase;
    var faseId=FASES[newFase]&&FASES[newFase].id;
    if(faseId&&!DOCS[faseId])loadDocsForFase(faseId);
    renderApp();
  };});
  if(!isKoper()){
    document.querySelectorAll('.chk-item[data-key]').forEach(function(el){el.onclick=function(){saveCurrent();S.checked[el.dataset.key]=!S.checked[el.dataset.key];renderApp();};});
  }
  document.querySelectorAll('.upload-zone[data-fase]').forEach(function(el){
    el.onclick=function(){ triggerFileUpload(el.dataset.fase); };
  });
}

renderApp();
</script>
</body>
</html>
