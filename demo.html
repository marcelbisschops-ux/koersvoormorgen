<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Koers voor Morgen · Platformdemo</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
:root{--void:#f2ece0;--panel:#fdfaf3;--card:#eae1d0;--border:#d8cfbd;--border2:#c7bda4;--muted:#556573;--mid:#33414c;--sub:#16232e;--head:#0d1b2a;--teal:#3d6b63;--teal-dim:#2c4f4a;--teal-dark:#12352d;--teal-bg:rgba(61,107,99,.1);--gold:#c49a4a;--gold-bg:rgba(196,154,74,.12);--gold-dark:#8a6a2e;--red:#e05252;--red-bg:rgba(224,82,82,.1);--info:#2a5ea0;--info-bg:#eef3fa;--purple:#7c5cbf;--purple-bg:#f3f0ff;--purple-border:#c8b8f0;--r:6px;--r2:10px}
@media(prefers-color-scheme:dark){
  :root{--void:#0d1b2a;--panel:#132534;--card:#16293a;--border:#24384a;--border2:#33485c;--muted:#8ba0ae;--mid:#c6d2da;--sub:#e2e9ee;--head:#f4f1e9;--teal:#5e9b8f;--teal-dim:#4a8377;--teal-dark:#9cc8bd;--teal-bg:rgba(94,155,143,.16);--gold:#d8b36a;--gold-bg:rgba(216,179,106,.14);--gold-dark:#e8cf9a;--red:#e8746b;--red-bg:rgba(232,116,107,.14);--info:#6ea8e0;--info-bg:rgba(110,168,224,.14);--purple:#b39ce0;--purple-bg:rgba(179,156,224,.16);--purple-border:#8f74b8}
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:15px;line-height:1.6;background-image:radial-gradient(ellipse 900px 500px at 15% -10%,var(--teal-bg),transparent),radial-gradient(ellipse 700px 500px at 100% 110%,var(--gold-bg),transparent)}
.serif{font-family:'Newsreader',Georgia,'Times New Roman',serif}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{background:var(--teal);color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:inherit;font-size:13px;font-weight:500;padding:10px 20px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:inherit;font-size:13px;padding:10px 12px;outline:none;width:100%}
.field input:focus{border-color:var(--teal)}

/* ── Poort ── */
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.gate-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.gate-title{font-size:1.3rem;color:var(--head);font-weight:600;margin-bottom:.4rem}
.gate-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.7}
#gate-err{color:var(--red);font-size:12px;margin-bottom:.75rem;display:none}

/* ── Presentatie ── */
#deck{display:none;min-height:100vh;flex-direction:column}
.deck-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.75rem;border-bottom:1px solid var(--border)}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.deck-nav{display:flex;align-items:center;gap:14px}
#slide-teller{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem 1rem}
.slide{max-width:960px;width:100%;display:none;animation:fadeIn .4s ease}
.slide.actief{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:.7rem;display:flex;align-items:center;gap:8px}
.slide-eyebrow:before{content:'';width:18px;height:2px;background:var(--gold);display:inline-block}
.slide h1{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:2.5rem;font-weight:600;color:var(--head);margin-bottom:1.2rem;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.slide-punten{list-style:none;display:flex;flex-direction:column;gap:.85rem;margin-top:1.4rem}
.slide-punten li{display:flex;gap:12px;font-size:16px;color:var(--sub);line-height:1.65}
.slide-punten li:before{content:'';flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:9px}
.slide-note{margin-top:1.5rem;padding:.85rem 1.1rem;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);font-size:13px;color:var(--mid);line-height:1.7}
.caption{margin-top:1rem;font-size:12px;color:var(--muted);line-height:1.6;font-style:italic}
.footer-bar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.75rem;border-top:1px solid var(--border)}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border2);cursor:pointer;border:none;padding:0}
.dot.actief{background:var(--teal);width:22px;border-radius:5px}

/* ── Diagram-bouwstenen ── */
.card-shadow{box-shadow:0 1px 2px rgba(13,27,42,.04),0 6px 20px -8px rgba(13,27,42,.12)}
.hero-row{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center;margin-top:.5rem}
@media(max-width:800px){.hero-row{grid-template-columns:1fr}}
.hero-visual{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem}
.hero-doc{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:16px 18px;margin-bottom:1.3rem}
.hero-doc-bar{height:9px;width:38%;background:var(--gold);border-radius:4px;margin-bottom:12px}
.hero-doc-line{height:6px;background:var(--border2);border-radius:3px;margin-bottom:8px}
.hero-doc-line:last-of-type{margin-bottom:0}
.hero-doc-label{margin-top:12px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dim);text-align:right}
.hero-roles-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero-role-chip{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero-role-chip .ico-badge{width:38px;height:38px;font-size:1.05rem;margin-bottom:0}
.hero-role-chip span{font-size:10.5px;font-weight:700;color:var(--head);line-height:1.3}
.rollen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:1.5rem}
@media(max-width:760px){.rollen-grid{grid-template-columns:1fr}}
.rol-kaart{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.4rem 1.25rem;transition:transform .15s ease}
.rol-kaart .ico-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:.75rem}
.rol-kaart h3{font-size:14.5px;color:var(--head);margin-bottom:.4rem;font-weight:700}
.rol-kaart p{font-size:12.5px;color:var(--muted);line-height:1.65}
.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:1.5rem}
@media(max-width:800px){.sector-grid{grid-template-columns:repeat(2,1fr)}}
.sector-kaart{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.1rem .9rem;text-align:center}
.sector-kaart .ico{font-size:1.6rem;margin-bottom:.5rem;display:block}
.sector-kaart h4{font-size:12.5px;color:var(--head);font-weight:700;margin-bottom:.3rem}
.sector-kaart p{font-size:11px;color:var(--muted);line-height:1.5}
.fasen-rij{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.5rem}
.fase-chip{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:7px 14px 7px 7px;font-size:12px;color:var(--mid);display:flex;align-items:center;gap:8px}
.fase-chip .nr{background:var(--teal);color:#fff;width:20px;height:20px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.flow-rij{display:flex;gap:0;flex-wrap:wrap;align-items:center;margin-top:1.5rem}
.flow-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;font-size:12.5px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:7px}
.flow-pijl{color:var(--gold);padding:0 8px;font-size:15px}
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem}
@media(max-width:760px){.split-2{grid-template-columns:1fr}}
.mini-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.1rem 1.25rem}
.mini-panel h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:.55rem}
.mini-panel p{font-size:13px;color:var(--mid);line-height:1.7}
.compare-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:1.4rem;font-size:12.5px}
.compare-table th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.compare-table td{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:9px 10px;color:var(--sub)}
.compare-table tr td:first-child{border-left:1px solid var(--border);border-radius:var(--r) 0 0 var(--r);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.compare-table tr td:last-child{border-right:1px solid var(--border);border-radius:0 var(--r) var(--r) 0}
.compare-table .win{color:var(--teal-dim);font-weight:700}
.score-bar-track{background:var(--card);border-radius:4px;height:7px;overflow:hidden;margin-top:4px}
.score-bar-fill{height:100%;background:var(--teal);border-radius:4px}
.unlock-rij{display:flex;gap:0;margin-top:1.5rem;counter-reset:stap}
.unlock-stap{flex:1;text-align:center;position:relative;padding:0 8px}
.unlock-stap:not(:last-child):after{content:'';position:absolute;top:19px;left:60%;width:80%;height:2px;background:var(--border2)}
.unlock-dot{width:38px;height:38px;border-radius:50%;background:var(--panel);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:15px;position:relative;z-index:1}
.unlock-stap.on .unlock-dot{border-color:var(--teal);background:var(--teal-bg)}
.unlock-stap h5{font-size:11.5px;color:var(--head);font-weight:700;margin-bottom:2px}
.unlock-stap p{font-size:10.5px;color:var(--muted);line-height:1.4}

/* ── Positioneringsmatrix (werkpunt 26): alleen .pos-*, geen absolute plaatsing → geen overlap op smalle schermen ── */
.pos-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:1.75rem;align-items:start;margin-top:.5rem}
@media(max-width:860px){.pos-grid{grid-template-columns:minmax(0,1fr);gap:1.25rem}}
.pos-fig{margin:0;min-width:0}
.pos-plot-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.pos-yas{display:flex;align-items:center;justify-content:center}
.pos-yas span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-dark);text-align:center}
.pos-yas span:after{content:' \2192'}
.pos-plot{min-width:0;display:flex;flex-direction:column;background-color:var(--panel);background-image:linear-gradient(var(--border2),var(--border2));background-size:1px 100%;background-position:50% 0;background-repeat:no-repeat;border:1px solid var(--border2);border-radius:var(--r2)}
.pos-half{display:flex;flex-direction:column;gap:.7rem;min-height:9.5rem;padding:.8rem .9rem}
.pos-boven{border-bottom:1px solid var(--border2)}
.pos-onder{justify-content:space-between}
.pos-ylabel{align-self:flex-start;max-width:100%;padding-right:4px;background:var(--panel);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.pos-rij{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.pos-groep{display:flex;flex-direction:column;gap:6px;min-width:0}
.pos-l{align-items:flex-start}
.pos-m{align-items:center}
.pos-r{align-items:flex-end}
.pos-chip{display:inline-block;max-width:100%;background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--head);line-height:1.3;text-align:center;overflow-wrap:anywhere}
.pos-kvm{background:var(--gold-bg);border:2px solid var(--gold);border-radius:var(--r);font-weight:700}
.pos-sub{font-size:10.5px;font-weight:600;color:var(--teal-dark)}
.pos-band{background:var(--panel);border:1px dashed var(--border2);border-radius:var(--r);padding:.5rem .7rem;font-size:11.5px;color:var(--mid);line-height:1.5;text-align:center}
.pos-xas{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 10px;font-size:10.5px;font-weight:600;color:var(--muted);line-height:1.4}
.pos-x-r{text-align:right}
.pos-x-titel{grid-column:1 / span 2;text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-dark)}
.pos-kern{background:var(--teal-bg);border:1px solid var(--teal-dark);border-left:3px solid var(--gold);border-radius:var(--r);padding:1rem 1.1rem}
.pos-kern-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:.4rem}
.pos-kern p{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:1.25rem;font-weight:600;color:var(--head);line-height:1.35}
.pos-punten{list-style:none;display:flex;flex-direction:column;gap:.45rem;margin-top:1rem}
.pos-punten li{display:flex;gap:10px;font-size:13.5px;color:var(--sub);line-height:1.5}
.pos-punten li:before{content:'';flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-top:7px}
.pos-bronnen{margin-top:.6rem;font-size:11.5px;color:var(--muted)}
.pos-bronnen summary{cursor:pointer;font-weight:600}
.pos-bronnen ul{list-style:none;display:flex;flex-direction:column;gap:.2rem;margin-top:.4rem}
.pos-bronnen a{color:var(--teal-dark);overflow-wrap:anywhere}
@media(max-width:560px){.pos-plot-wrap{grid-template-columns:minmax(0,1fr)}.pos-yas{justify-content:flex-start}.pos-yas span{writing-mode:horizontal-tb;transform:none;text-align:left}.pos-yas span:after{content:' \2191'}.pos-xas{grid-column:1}.pos-half{padding:.7rem .5rem}.pos-rij{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:4px}.pos-chip{font-size:11px;padding:4px 7px}.pos-kvm{font-size:10.5px;padding:4px 6px}}
/* #97 M&A Journey (mna/22-journey.js) */
.jr{display:grid;gap:.75rem;padding:.25rem 0 .5rem}
.jr-kop{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.jr-titel{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;color:var(--head)}
.jr-sub{font-size:11px;color:var(--muted)}
.jr-volgende{background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--r);padding:.45rem .75rem;font-size:12px;display:flex;flex-direction:column;max-width:100%}
.jr-volgende span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
.jr-volgende b{color:var(--sub);font-weight:600}
.jr-lijn{list-style:none;margin:0;padding:0 0 .35rem;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(112px,1fr);gap:6px;overflow-x:auto;scroll-snap-type:x proximity;counter-reset:jr}
.jr-lijn li{scroll-snap-align:start}
.jr-stap.jr-nvt{opacity:.6;border-style:dashed}
.jr-lijn li{min-width:0}
.jr-stap{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .55rem;cursor:pointer;color:var(--sub);font:12px 'IBM Plex Sans',sans-serif;position:relative}
.jr-stap:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.jr-stap .jr-nr{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--panel);border:1px solid var(--border2);color:var(--mid)}
.jr-stap .jr-naam{font-size:11.5px;line-height:1.3;font-weight:500;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.jr-stap .jr-nu{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dark)}
.jr-stap.jr-gereed .jr-nr{background:var(--teal);border-color:var(--teal);color:#fff}
.jr-stap.jr-bezig .jr-nr{border-color:var(--gold);color:var(--gold-dark)}
.jr-stap.jr-actief{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal);background:var(--panel)}
.jr-stap.jr-huidig{border-color:var(--gold)}
.jr-paneel{border:1px solid var(--border);border-radius:var(--r2);padding:.85rem 1rem;background:var(--panel)}
.jr-paneel-kop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.jr-paneel-titel{font-size:13px;font-weight:600;color:var(--head)}
.jr-taken{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.jr-taak{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:.5rem .6rem;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.jr-taak.jr-eigen{border-color:var(--gold);background:var(--gold-bg)}
.jr-taak-hoofd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.jr-taak-naam{font-size:13px;color:var(--sub);font-weight:500}
.jr-taak-meta{grid-column:1/2;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.jr-taak .jr-knop{grid-column:2;grid-row:1/3;white-space:nowrap}
.jr-eigen-label{color:var(--gold-dark);font-weight:600}
.jr-bron{font-family:'IBM Plex Mono',monospace;font-size:10px}
.jr-chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.jr-chip.jr-gereed{background:var(--teal-bg);color:var(--teal-dark);border-color:var(--teal)}
.jr-chip.jr-bezig{background:var(--gold-bg);color:var(--gold-dark);border-color:var(--gold)}
.jr-chip.jr-open{background:var(--card);color:var(--mid)}
.jr-chip.jr-nvt{background:transparent;color:var(--muted);border-style:dashed}
.jr-leeg{font-size:12px;color:var(--muted);font-style:italic;padding:.25rem 0}
.jr-docs{margin-top:.75rem}
.jr-docs:empty{display:none}
.jr-doelwitten ul{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:4px}
.jr-doelwitten li{display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap}
.jr-markeer{outline:3px solid var(--gold);outline-offset:3px;transition:outline-color .6s}
@media (max-width:760px){.jr-lijn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.jr-lijn li{flex:0 0 132px;scroll-snap-align:start}.jr-taak{grid-template-columns:1fr}.jr-taak .jr-knop{grid-column:1;grid-row:auto;justify-self:start}}

const _WORKER_WHITELIST=['https://kantoorinzicht.marcel-bisschops.workers.dev','https://kantoorinzicht-staging.marcel-bisschops.workers.dev'];
const _WORKER_PARAM=new URLSearchParams(location.search).get('worker')||'';
const WORKER=_WORKER_WHITELIST.includes(_WORKER_PARAM)?_WORKER_PARAM:'https://kantoorinzicht.marcel-bisschops.workers.dev';

// ── Poort: dezelfde beheersleutel als marilyn.html, gevalideerd via een echte, bestaande
// admin-only aanroep — geen apart wachtwoord om te onthouden of te beheren. De sleutel blijft
// alleen in het geheugen van dit tabblad (net als marilyn), nooit in localStorage.
async function gateOpen(){
  const btn=document.getElementById('gate-btn');
  const err=document.getElementById('gate-err');
  const key=document.getElementById('gate-key').value.trim();
  if(!key)return;
  btn.disabled=true;btn.textContent='Controleren...';err.style.display='none';
  // Volledig scherm meteen bij deze klik aanvragen (Marcel, 11 sep 2026: "moet automatisch
  // volledige pagina worden") — dit is nog binnen dezelfde gebruikersactie (de klik/Enter die
  // gateOpen() startte), wat de browser vereist om requestFullscreen() toe te staan. Lukt het
  // niet (bv. browser weigert), dan blijft de handmatige "Volledig scherm"-knop in de deck-balk
  // gewoon beschikbaar — geen harde eis, geen foutmelding hierover.
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  try{
    const r=await fetch(WORKER+'/mna/admin/lijst',{headers:{'x-admin-key':key}});
    if(!r.ok)throw new Error('unauthorized');
    document.getElementById('gate').style.display='none';
    document.getElementById('deck').style.display='flex';
    initDeck();
  }catch(e){
    err.style.display='block';btn.disabled=false;btn.textContent='Openen';
  }
}
document.getElementById('gate-btn').addEventListener('click',gateOpen);
document.getElementById('gate-key').addEventListener('keydown',e=>{if(e.key==='Enter')gateOpen();});

function demoJourneyInit(){
  const el=document.getElementById('demo-jr'); if(!el||typeof jrHtml!=='function')return;
  let vorm='verkoop', rol='begeleider';
  const teken=()=>{
    const set=DEMO_JOURNEY[vorm]||{}; const d=set[rol]||set[rol==='koper_voor_nda'?'koper':'begeleider']||set.begeleider;
    el.innerHTML=jrHtml(d,{alleenLezen:true,titel:vorm==='koopmandaat'?'Journey van een koopmandaat':'M&A Journey'}); jrWire(el,d,{});
    document.querySelectorAll('#demo-jr-vorm button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===vorm)));
    document.querySelectorAll('#demo-jr-rol button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.r===rol));b.hidden=vorm==='koopmandaat'&&(b.dataset.r==='verkoper'||b.dataset.r==='koper_voor_nda');});
  };
  document.querySelectorAll('#demo-jr-vorm button').forEach(b=>b.addEventListener('click',()=>{vorm=b.dataset.v;if(vorm==='koopmandaat'&&(rol==='verkoper'||rol==='koper_voor_nda'))rol='begeleider';teken();}));
  document.querySelectorAll('#demo-jr-rol button').forEach(b=>b.addEventListener('click',()=>{rol=b.dataset.r;teken();}));
  teken();
}
let huidige=0;
function initDeck(){
  document.getElementById('stage').innerHTML=SLIDES.map((s,i)=>
    `<div class="slide" data-i="${i}"><div class="slide-eyebrow">${s.eyebrow}</div><h1>${s.titel}</h1>${s.html}</div>`
  ).join('');
  document.getElementById('dots').innerHTML=SLIDES.map((s,i)=>`<button class="dot" data-i="${i}" title="${s.titel}"></button>`).join('');
  document.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>{huidige=parseInt(d.dataset.i,10);render();}));
  document.getElementById('prev-btn').addEventListener('click',()=>{if(huidige>0){huidige--;render();}});
  // next-btn krijgt zijn click-handler in render() zelf (onclick-property, niet addEventListener) —
  // die tekst verandert immers per stand ("Volgende" vs. "Terug naar begin"), dus de gedragslogica
  // moet daar in sync blijven. Een aparte addEventListener hier zou een tweede handler op dezelfde
  // knop zetten en bij elke klik dubbel laten springen.
  document.addEventListener('keydown',e=>{
    if(document.getElementById('deck').style.display==='none')return;
    if(e.key==='ArrowRight'&&huidige<SLIDES.length-1){huidige++;render();}
    if(e.key==='ArrowLeft'&&huidige>0){huidige--;render();}
  });
  document.getElementById('fullscreen-btn').addEventListener('click',()=>{
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
  demoJourneyInit();
  render();
}
function render(){
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('actief',parseInt(el.dataset.i,10)===huidige));
  document.querySelectorAll('.dot').forEach(el=>el.classList.toggle('actief',parseInt(el.dataset.i,10)===huidige));
  document.getElementById('slide-teller').textContent=(huidige+1)+' / '+SLIDES.length;
  document.getElementById('prev-btn').disabled=huidige===0;
  document.getElementById('next-btn').innerHTML=huidige===SLIDES.length-1?'Terug naar begin &#8594;':'Volgende &#8594;';
  document.getElementById('next-btn').onclick=()=>{ if(huidige<SLIDES.length-1){huidige++;} else {huidige=0;} render(); };
}
</script>
