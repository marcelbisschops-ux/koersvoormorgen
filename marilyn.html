<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantoorInzicht — Beheer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1400px;margin:0 auto;padding:2rem}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid)}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red);font-family:'IBM Plex Sans',sans-serif;font-size:11px;padding:3px 10px;border-radius:var(--r);cursor:pointer}
.btn-red:hover{background:var(--red-bg)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.login-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--head);font-weight:600;margin-bottom:.4rem}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--teal)}
.tabs{display:flex;gap:4px;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tab{font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:2rem}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--teal);line-height:1;margin-bottom:.25rem}
.stat-lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:2rem}
.table-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;gap:.5rem}
.table-title{font-size:13px;font-weight:600;color:var(--head)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px;text-align:left;border-bottom:2px solid var(--border);background:var(--card);white-space:nowrap;position:relative;resize:horizontal;overflow:auto;min-width:60px}
th:after{content:'';position:absolute;right:0;top:25%;height:50%;width:3px;background:var(--border2);cursor:col-resize;opacity:0;transition:opacity .15s}
th:hover:after{opacity:1}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--mid);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(26,122,94,.04)}
.table-wrap{overflow-x:auto}
.score-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:2px 8px;border-radius:3px}
.score-high{background:var(--teal-bg);color:var(--teal)}
.score-mid{background:var(--gold-bg);color:var(--gold)}
.score-low{background:var(--red-bg);color:var(--red)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.search-bar{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;width:220px;outline:none}
.search-bar:focus{border-color:var(--teal)}
.detail-panel{background:var(--card);border-top:1px solid var(--border);padding:12px 14px;display:none}
.detail-panel.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.detail-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.detail-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.detail-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500}
.code-chip{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark);padding:2px 8px;border-radius:3px;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:1.25rem}
.copy-btn{font-size:10px;padding:1px 6px;border:1px solid var(--border2);border-radius:3px;cursor:pointer;background:transparent;color:var(--muted);margin-left:4px}
.copy-btn:hover{border-color:var(--mid);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand"><div class="wdot"></div>KantoorInzicht <span style="color:var(--teal);margin-left:4px">Beheer</span></div>
    <div id="hdr-actions" style="display:none;gap:10px;align-items:center">
      <button class="btn-ghost" style="font-size:12px" id="btn-refresh">&#8635; Verversen</button>
      <button class="btn-ghost" style="font-size:12px" id="btn-logout">Uitloggen</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
const WORKER='https://kantoorinzicht.marcel-bisschops.workers.dev';
let adminKey='',scans=[],callbacks=[],mnaList=[],rapporten=[],activeTab='scans',scanFilter='',openRow=null;

function dc(v){return v>=70?'score-high':v>=50?'score-mid':'score-low';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}

// LOGIN
function renderLogin(){
  document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-box">'
    +'<div class="login-title">Beheer toegang</div>'
    +'<div class="login-sub">Voer uw admin-sleutel in om door te gaan.</div>'
    +'<div class="field"><label>Admin-sleutel</label><input type="password" id="ak" placeholder="••••••••" autofocus></div>'
    +'<button class="btn" id="login-btn" style="width:100%">Inloggen</button>'
    +'<div id="login-err" style="color:var(--red);font-size:12px;margin-top:.75rem;display:none">Sleutel incorrect of verbindingsfout.</div>'
    +'</div></div>';
  document.getElementById('login-btn').addEventListener('click',doLogin);
  document.getElementById('ak').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  var key=document.getElementById('ak').value.trim();
  if(!key)return;
  var btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Laden...';
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(key)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(key))
    ]);
    if(!r1.ok)throw new Error('unauthorized');
    scans=await r1.json();
    callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    adminKey=key;
    document.getElementById('hdr-actions').style.display='flex';
    document.getElementById('btn-refresh').addEventListener('click',refreshData);
    document.getElementById('btn-logout').addEventListener('click',logout);
    renderDashboard();
  }catch(e){
    document.getElementById('login-err').style.display='block';
    btn.disabled=false;btn.textContent='Inloggen';
  }
}

function logout(){
  adminKey='';scans=[];callbacks=[];mnaList=[];rapporten=[];
  document.getElementById('hdr-actions').style.display='none';
  renderLogin();
}

async function refreshData(){
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(adminKey))
    ]);
    scans=await r1.json();
    callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    renderDashboard();
  }catch(e){alert('Kon niet verversen.');}
}

// DASHBOARD
function renderDashboard(){
  var avg=scans.length?Math.round(scans.reduce(function(a,s){return a+(s.overall||0);},0)/scans.length):0;
  var recent=scans.filter(function(s){return Date.now()-s.created_at<7*24*3600*1000;}).length;
  document.getElementById('app').innerHTML=
    '<div class="stats-row">'
    +'<div class="stat-card"><div class="stat-num">'+scans.length+'</div><div class="stat-lbl">Totaal scans</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+recent+'</div><div class="stat-lbl">7 dagen</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+(avg||'—')+'</div><div class="stat-lbl">Gem. score</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+callbacks.length+'</div><div class="stat-lbl">Terugbelverzoeken</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+mnaList.length+'</div><div class="stat-lbl">M&A Trajecten</div></div>'
    +'</div>'
    +'<div class="tabs">'
    +'<button class="tab'+(activeTab==='scans'?' active':'')+'" id="t-scans">Scans ('+scans.length+')</button>'
    +'<button class="tab'+(activeTab==='callbacks'?' active':'')+'" id="t-cb">Terugbelverzoeken ('+callbacks.length+')</button>'
    +'<button class="tab'+(activeTab==='mna'?' active':'')+'" id="t-mna">M&A Trajecten ('+mnaList.length+')</button>'
    +'<button class="tab'+(activeTab==='docs'?' active':'')+'" id="t-docs">Documenten</button>'
    +'<button class="tab'+(activeTab==='rapporten'?' active':'')+'" id="t-rapp">Scan rapporten ('+rapporten.length+')</button>'
    +'<button class="tab'+(activeTab==='benchmarks'?' active':'')+'" id="t-bench">Benchmarks</button>'
    +'</div>'
    +'<div id="tc"></div>';
  document.getElementById('t-scans').addEventListener('click',function(){activeTab='scans';scanFilter='';openRow=null;renderDashboard();});
  document.getElementById('t-cb').addEventListener('click',function(){activeTab='callbacks';renderDashboard();});
  document.getElementById('t-mna').addEventListener('click',function(){activeTab='mna';renderDashboard();});
  document.getElementById('t-docs').addEventListener('click',function(){activeTab='docs';renderDashboard();});
  document.getElementById('t-rapp').addEventListener('click',function(){activeTab='rapporten';renderDashboard();});
  document.getElementById('t-bench').addEventListener('click',function(){activeTab='benchmarks';renderDashboard();});
  renderTab();
}

function renderTab(){
  var el=document.getElementById('tc');
  if(activeTab==='scans')renderScansTab(el);
  else if(activeTab==='callbacks')renderCallbacksTab(el);
  else if(activeTab==='mna')renderMnaTab(el);
  else if(activeTab==='docs')renderDocsTab(el);
  else if(activeTab==='benchmarks')renderBenchmarksTab(el);
  else renderRapportenTab(el);
}

// SCANS TAB
function renderScansTab(el){
  var filtered=scans.filter(function(s){
    if(!scanFilter)return true;
    var q=scanFilter.toLowerCase();
    return (s.office_name||'').toLowerCase().includes(q)
      ||(s.region||'').toLowerCase().includes(q)
      ||(s.top_scenario||'').toLowerCase().includes(q)
      ||(s.group_name||'').toLowerCase().includes(q);
  });
  var html='<div class="table-wrap"><div class="table-hdr"><div class="table-title">Ingediende scans</div>'
    +'<div style="display:flex;gap:10px;align-items:center">'
    +'<input class="search-bar" id="ss" placeholder="Zoek op naam, regio, scenario..." value="'+esc(scanFilter)+'">'
    +'<button class="btn-red" id="btn-del-sel-scans" style="font-size:12px;padding:7px 14px;display:none">&#10005; Verwijder geselecteerde (<span id="sel-cnt-scans">0</span>)</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-ref-s">&#8635; Verversen</button>'
    +'</div></div>';
  if(!filtered.length){
    html+='<div class="empty">Geen scans gevonden'+(scans.length?'. Filter: "'+esc(scanFilter)+'"':' — nog geen scans ingediend.')+'</div>';
  } else {
    html+='<table><thead><tr><th style="width:32px"><input type="checkbox" id="cb-all-scans" title="Alles"></th><th>Datum</th><th>Kantoor</th><th>Regio</th><th>Fte</th><th>Omzet</th><th>Score</th><th>Scenario</th><th>Groep</th><th></th></tr></thead><tbody>';
    filtered.forEach(function(s,i){
      var scores='';
      if(s.scores){
        try{
          var sc=typeof s.scores==='string'?JSON.parse(s.scores):s.scores;
          scores=Object.entries(sc).map(function(kv){
            return '<div class="detail-item"><div class="detail-label">'+esc(kv[0])+'</div>'
              +'<div class="detail-val" style="color:'+(kv[1]>=70?'var(--teal)':kv[1]>=50?'var(--gold)':'var(--red)')+'">'+kv[1]+'/100</div></div>';
          }).join('');
        }catch(e){}
      }
      html+='<tr data-i="'+i+'" style="cursor:pointer"><td onclick="event.stopPropagation()"><input type="checkbox" class="scan-cb" data-id="'+( s.id||'')+'" style="cursor:pointer"></td>'
        +'<td class="mono" style="font-size:11px;white-space:nowrap">'+formatDate(s.created_at)+'</td>'
        +'<td style="font-weight:500;color:var(--head)">'+esc(s.office_name||'Anoniem')+'</td>'
        +'<td>'+esc(s.region||'—')+'</td>'
        +'<td>'+(s.fte||'—')+'</td>'
        +'<td>'+(s.revenue||'—')+'</td>'
        +'<td><span class="score-badge '+dc(s.overall)+'">'+(s.overall||'—')+'</span></td>'
        +'<td><span class="tag">'+esc((s.top_scenario||'—').split(' ').slice(0,2).join(' '))+'</span></td>'
        +'<td style="font-size:11px;color:var(--muted)">'+esc(s.group_name||s.group_id||'Solo')+'</td>'
        +'<td style="white-space:nowrap;display:flex;gap:4px;align-items:center">'+(openRow===i?'▲':'▼')
        +' <button class="btn-ghost btn-maak-traject" data-id="'+(s.id||'')+'" data-naam="'+esc(s.office_name||'Anoniem')+'" data-email="'+esc(s.office_email||'')+'" data-fte="'+esc(s.fte||'')+'" data-revenue="'+esc(s.revenue||'')+'" data-region="'+esc(s.region||'')+'" data-overall="'+(s.overall||'')+'" data-scenario="'+esc(s.top_scenario||'')+'" data-scores="'+esc(typeof s.scores==='string'?s.scores:JSON.stringify(s.scores||{}))+'" style="font-size:10px;padding:2px 8px;color:var(--teal)">&#43; Traject</button>'
        +' <button class="btn-del-scan btn-red" data-id="'+(s.id||'')+'" style="font-size:10px;padding:2px 6px">&#10005;</button></td>'
        +'</tr>'
        +'<tr><td colspan="10" style="padding:0"><div class="detail-panel'+(openRow===i?' open':'')+'"><div class="detail-grid">'
        +(scores||'<div style="color:var(--muted);font-size:12px">Geen scoredata.</div>')
        +'</div></div></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';
  el.innerHTML=html;
  var inp=document.getElementById('ss');
  if(inp)inp.addEventListener('input',function(){scanFilter=this.value;renderTab();});
  var rb=document.getElementById('btn-ref-s');
  if(rb)rb.addEventListener('click',refreshData);
  el.querySelectorAll('tr[data-i]').forEach(function(r){
    r.addEventListener('click',function(){
      var i=parseInt(r.dataset.i);openRow=openRow===i?null:i;renderTab();
    });
  });
  el.querySelectorAll('.btn-del-scan').forEach(function(b){
    b.addEventListener('click',function(e){e.stopPropagation();deleteScan(b.dataset.id);});
  });
  el.querySelectorAll('.btn-maak-traject').forEach(function(b){
    b.addEventListener('click',function(e){e.stopPropagation();maakTrajectVanScan(b.dataset.id,b.dataset.naam,b.dataset.email,b.dataset.fte,b.dataset.revenue,b.dataset.region,b.dataset.overall,b.dataset.scenario,b.dataset.scores);});
  });
  function updSelScans(){var n=el.querySelectorAll('.scan-cb:checked').length;var btn=document.getElementById('btn-del-sel-scans');var cnt=document.getElementById('sel-cnt-scans');if(btn)btn.style.display=n>0?'inline-block':'none';if(cnt)cnt.textContent=n;}
  var cbAllS=document.getElementById('cb-all-scans');
  if(cbAllS)cbAllS.addEventListener('change',function(){el.querySelectorAll('.scan-cb').forEach(function(cb){cb.checked=cbAllS.checked;});updSelScans();});
  el.querySelectorAll('.scan-cb').forEach(function(cb){cb.addEventListener('change',updSelScans);});
  var btnDelS=document.getElementById('btn-del-sel-scans');
  if(btnDelS)btnDelS.addEventListener('click',async function(){var ids=Array.from(el.querySelectorAll('.scan-cb:checked')).map(function(cb){return cb.dataset.id;});if(!ids.length)return;if(!confirm('Verwijder '+ids.length+' scan(s)?'))return;btnDelS.disabled=true;btnDelS.textContent='Verwijderen...';for(var i=0;i<ids.length;i++){try{await fetch(WORKER+'/admin/delete/scan/'+ids[i]+'?key='+encodeURIComponent(adminKey),{method:'POST'});}catch(e){}}await refreshData();});
}

// CALLBACKS TAB
function renderCallbacksTab(el){
  var html='<div class="table-wrap"><div class="table-hdr"><div class="table-title">Terugbelverzoeken</div>'
    +'<div style="display:flex;gap:8px;align-items:center"><button class="btn-red" id="btn-del-sel-cb" style="font-size:12px;padding:7px 14px;display:none">&#10005; Verwijder geselecteerde (<span id="sel-cnt-cb">0</span>)</button><button class="btn" style="font-size:12px;padding:7px 14px" id="btn-ref-c">&#8635; Verversen</button></div></div>';
  if(!callbacks.length){
    html+='<div class="empty">Nog geen terugbelverzoeken.</div>';
  } else {
    html+='<table><thead><tr><th style="width:32px"><input type="checkbox" id="cb-all-cb" title="Alles"></th><th>Datum</th><th>Naam</th><th>Telefoon</th><th>E-mail</th><th>Beltijd</th><th>Kantoor</th><th>Score</th><th>Scenario</th><th></th></tr></thead><tbody>';
    callbacks.forEach(function(c){
      var k=typeof c.kantoor==='string'?JSON.parse(c.kantoor||'{}'):(c.kantoor||{});
      html+='<tr><td><input type="checkbox" class="cb-cb" data-id="'+(c.id||'')+'"></td>'
        +'<td class="mono" style="font-size:11px;white-space:nowrap">'+formatDate(c.created_at)+'</td>'
        +'<td style="font-weight:500;color:var(--head)">'+esc(c.naam||'—')+'</td>'
        +'<td><a href="tel:'+esc(c.tel)+'" style="color:var(--teal);text-decoration:none">'+esc(c.tel||'—')+'</a></td>'

async function renderBenchmarksTab(el){

    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-refresh">&#8635; Bronnen updaten</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-add">+ Handmatig toevoegen</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)" id="btn-bench-pdf">&#128196; PDF analyseren</button>'

  async function laadBenchmarks(){

      var r=await fetch(WORKER+'/benchmarks');
      var data=await r.json();
      if(!data.length){db.innerHTML='<div class="empty">Nog geen benchmarks. Klik op Bronnen updaten om de eerste data op te halen.</div>';return;}

        var valFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
        html+='<tr>'
          +'<td class="mono" style="font-size:11px;color:var(--teal)">'+esc(b.sleutel)+'</td>'
          +'<td style="font-size:12px">'+esc(b.omschrijving||'--')+'</td>'
          +'<td class="mono" style="font-weight:600;color:var(--head)">'+valFmt+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+esc(b.bron||'--')+(b.bron_url?'<br><a href="'+esc(b.bron_url)+'" target="_blank" style="color:var(--teal);font-size:10px">Bron &#8599;</a>':'')+'</td>'
          +'<td class="mono" style="font-size:11px">'+esc(b.peildatum||'--')+'</td>'
          +'<td class="mono" style="font-size:11px">'+dt+'</td>'
          +'<td><button class="btn-red btn-del-bench" data-sleutel="'+esc(b.sleutel)+'" style="font-size:10px;padding:2px 6px">&#10005;</button></td>'
          +'</tr>';
      });
      html+='</tbody></table>';
      db.innerHTML=html;
      db.querySelectorAll('.btn-del-bench').forEach(function(btn){
        btn.addEventListener('click',async function(){
          if(!confirm('Benchmark "'+btn.dataset.sleutel+'" verwijderen?'))return;
          await fetch(WORKER+'/admin/benchmarks/delete/'+btn.dataset.sleutel+'?key='+encodeURIComponent(adminKey),{method:'POST'}).catch(function(){});
          laadBenchmarks();
        });
      });
    }catch(e){db.innerHTML='<div class="empty">Fout bij laden: '+e.message+'</div>';}
  }
  laadBenchmarks();

  document.getElementById('btn-bench-refresh').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;btn.textContent='Updaten...';
    try{
      var r=await fetch(WORKER+'/admin/benchmarks/refresh?key='+encodeURIComponent(adminKey),{method:'POST'});
      var d=await r.json();
      if(d.ok){alert(d.count+' benchmarks bijgewerkt uit bronnen.');laadBenchmarks();}
      else alert('Fout: '+(d.error||'onbekend'));
    }catch(e){alert('Verbindingsfout.');}
    btn.disabled=false;btn.textContent='↻ Bronnen updaten';
  });

  document.getElementById('btn-bench-pdf').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.className='modal';
    mo.style.maxWidth='520px';
    mo.innerHTML='<div class="modal-title">&#128196; PDF analyseren voor benchmarks</div>'
      +'<p style="font-size:13px;color:var(--mid);margin-bottom:1rem;line-height:1.6">Upload een PDF met benchmarkdata (bijv. Full Finance, Simplicate, AV Top 20). De AI extraheert automatisch de relevante waarden en slaat ze op als benchmarks.</p>'
      +'<div class="field"><label>Bron naam <span style="color:var(--red)">*</span></label><input type="text" id="pdf-bron" placeholder="bijv. AV Top 20 Administratiekantoren 2025" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>Peildatum <span style="color:var(--red)">*</span></label><input type="text" id="pdf-datum" placeholder="bijv. 2025" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>PDF bestand <span style="color:var(--red)">*</span></label><input type="file" id="pdf-file" accept=".pdf" style="margin-bottom:.5rem"></div>'
      +'<div id="pdf-status" style="font-size:12px;color:var(--teal);margin:.75rem 0;display:none;padding:10px;background:var(--teal-bg);border-radius:var(--r)"></div>'
      +'<div id="pdf-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div id="pdf-preview" style="font-size:12px;color:var(--mid);margin-bottom:.75rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="pdf-ann">Annuleren</button><button class="btn" id="pdf-ok">Analyseren &amp; opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('pdf-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('pdf-ok').addEventListener('click',async function(){
      var bron=document.getElementById('pdf-bron').value.trim();
      var datum=document.getElementById('pdf-datum').value.trim();
      var file=document.getElementById('pdf-file').files[0];
      var err=document.getElementById('pdf-err');
      var status=document.getElementById('pdf-status');
      var preview=document.getElementById('pdf-preview');
      if(!bron||!datum||!file){err.style.display='block';err.textContent='Vul alle velden in en selecteer een PDF.';return;}
      var btn=document.getElementById('pdf-ok');
      // Als al geanalyseerd en bevestigd: sla op zonder opnieuw analyseren
      if(btn.dataset.confirmed==='1'){
        btn.disabled=true;btn.textContent='Opslaan...';
        var gevonden2=btn._gevonden||[];
        for(var bi=0;bi<gevonden2.length;bi++){
          await fetch(WORKER+'/admin/benchmarks/update?key='+encodeURIComponent(adminKey),{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sleutel:gevonden2[bi].sleutel,waarde:gevonden2[bi].waarde,categorie:gevonden2[bi].categorie||'algemeen',omschrijving:gevonden2[bi].omschrijving,bron:bron,peildatum:datum})
          }).catch(function(){});
        }
        status.textContent='&#10003; '+gevonden2.length+' benchmarks opgeslagen.';
        status.style.background='var(--teal-bg)';status.style.color='var(--teal)';
        btn.textContent='Klaar';btn.dataset.confirmed='';
        laadBenchmarks();
        return;
      }
      btn.disabled=true;btn.textContent='Analyseren...';
      err.style.display='none';
      status.style.display='block';status.textContent='PDF inlezen...';
      try{
        // PDF naar base64
        var b64=await new Promise(function(res,rej){
          var r=new FileReader();
          r.onload=function(){res(r.result.split(',')[1]);};
          r.onerror=function(){rej(new Error('Lezen mislukt'));};
          r.readAsDataURL(file);
        });
        status.textContent='AI analyseert PDF... (30-60 seconden)';
        // Stuur naar worker die AI aanroept
        var resp=await fetch(WORKER+'/admin/benchmarks/pdf-analyse?key='+encodeURIComponent(adminKey),{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pdf_base64:b64,bron:bron,peildatum:datum,bestandsnaam:file.name})
        });
        var data=await resp.json();
        if(!resp.ok||data.error)throw new Error(data.error||'Analyse mislukt');
        var gevonden=data.benchmarks||[];
        if(!gevonden.length)throw new Error('Geen benchmarkwaarden gevonden in dit document.');
        // Haal huidige benchmarks op voor conflict check
        var huidig={};
        try{var br=await fetch(WORKER+'/benchmarks');var bd=await br.json();bd.forEach(function(b){huidig[b.sleutel]=b;});}catch(e){}
        // Bouw preview met conflict waarschuwingen

      +'<div id="bm-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="bm-ann">Annuleren</button><button class="btn" id="bm-ok">Opslaan</button></div>';

}

          +'Uurtarief personeel: admin \u20ac'+(bms['uurtarief_personeel_admin']?bms['uurtarief_personeel_admin'].waarde:93)+', klein acc \u20ac'+(bms['uurtarief_personeel_klein']?bms['uurtarief_personeel_klein'].waarde:95)+', groot acc \u20ac'+(bms['uurtarief_personeel_groot']?bms['uurtarief_personeel_groot'].waarde:114)+'\n'
          +'Uurtarief partner: admin \u20ac'+(bms['uurtarief_partner_admin']?bms['uurtarief_partner_admin'].waarde:126)+', klein acc \u20ac'+(bms['uurtarief_partner_klein']?bms['uurtarief_partner_klein'].waarde:149)+', groot acc \u20ac'+(bms['uurtarief_partner_groot']?bms['uurtarief_partner_groot'].waarde:228)+'\n'
          +'Afboeking: admin '+(bms['afboeking_admin']?bms['afboeking_admin'].waarde:2.6)+'%, klein acc '+(bms['afboeking_klein']?bms['afboeking_klein'].waarde:4.0)+'%, groot acc '+(bms['afboeking_groot']?bms['afboeking_groot'].waarde:8.1)+'%\n'
          +'EBITDA-multiples: adm laag '+(bms['multiple_adm_laag']?bms['multiple_adm_laag'].waarde:4.6)+'x, adm hoog '+(bms['multiple_adm_hoog']?bms['multiple_adm_hoog'].waarde:5.5)+'x\n'
          +'PE recurring ondergrens: 70%\n'
          +'Salarisindexatie 2024: admin '+(bms['salarisindexatie_2024_admin']?bms['salarisindexatie_2024_admin'].waarde:4.1)+'%, klein '+(bms['salarisindexatie_2024_klein']?bms['salarisindexatie_2024_klein'].waarde:4.5)+'%, groot '+(bms['salarisindexatie_2024_groot']?bms['salarisindexatie_2024_groot'].waarde:4.2)+'%\n'
          +'Tariefstijging 2024: admin '+(bms['tariefstijging_2024_admin']?bms['tariefstijging_2024_admin'].waarde:5.4)+'%, klein '+(bms['tariefstijging_2024_klein']?bms['tariefstijging_2024_klein'].waarde:5.0)+'%, groot '+(bms['tariefstijging_2024_groot']?bms['tariefstijging_2024_groot'].waarde:6.3)+'%\n';
        var prompt='Je bent M&A-adviseur gespecialiseerd in accountants- en administratiekantoren. Analyseer de due diligence data en geef een concreet adviesrapport.\n\n'
          +'TRAJECT: '+d.traject.kantoor_naam+' ('+d.traject.traject_type+')\nStatus: '+d.traject.status+'\n\n'
          +bmTekst+'\nINGEVULDE DUE DILIGENCE DATA:'+dataSamenvatting+'\n\n'
          +'Schrijf een rapport (## koppen): ## Samenvatting traject\n## Financieel profiel & waardering\n## Sterktes\n## Risicos & aandachtspunten\n## Aanbevelingen voor de volgende stap\n\n'
          +'Derde persoon. Concreet, direct. Max 600 woorden.';
        var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:3000})});
        var rd=await resp.json();
        var tekst=rd.content&&rd.content[0]?rd.content[0].text:(rd.error||'Fout bij genereren.');
        tekst=tekst.replace(/^## (.+)$/gm,'<h3 style="font-family:Playfair Display,serif;font-size:1rem;color:var(--head);margin:1.25rem 0 .5rem">$1</h3>');
        tekst=tekst.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
        tekst=tekst.replace(/\n\n/g,'</p><p style="font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:.75rem">');
        aiOut.innerHTML='<div style="font-size:11px;font-weight:600;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem">AI-analyse · '+d.traject.kantoor_naam+'</div><p style="font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:.75rem">'+tekst+'</p>';
        btn.textContent='Opnieuw genereren';btn.disabled=false;
      }catch(e){aiOut.innerHTML='<div style="color:var(--red);font-size:13px">Fout: '+e.message+'</div>';btn.textContent='Genereer AI-analyse';btn.disabled=false;}
    });
  }catch(e){document.getElementById('detail-body').textContent='Fout: '+e.message;}
}

// NIEUW TRAJECT
function toonNieuwModal(){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.className='modal';
  mo.innerHTML='<div class="modal-title">Nieuw M&amp;A traject aanmaken</div>'
    +'<div class="field"><label>Kantoornaam <span style="color:var(--red)">*</span></label><input type="text" id="m-k" placeholder="bijv. Accountantskantoor De Vries"></div>'
    +'<div class="field"><label>Contactpersoon</label><input type="text" id="m-c" placeholder="Naam verkopende partner"></div>'
    +'<div class="field"><label>E-mail contactpersoon</label><input type="email" id="m-e" placeholder="partner@kantoor.nl"></div>'
    +'<div class="field"><label>Trajecttype</label><select id="m-t"><option value="Verkoop">Verkoop</option><option value="Fusie">Fusie</option><option value="Opvolging">Opvolging</option><option value="PE-traject">PE-traject</option><option value="Overname">Overname</option></select></div>'
    +'<div class="field"><label>Notitie (intern)</label><textarea id="m-n" rows="2" placeholder="Interne aantekeningen..."></textarea></div>'
    +'<div id="m-res" style="display:none;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:1rem;margin-bottom:1rem;font-size:13px;line-height:2"></div>'
    +'<div id="m-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.75rem"></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="m-ann">Annuleren</button><button class="btn" id="m-ok">Traject aanmaken</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('m-ann').addEventListener('click',function(){document.body.removeChild(ov);});
  document.getElementById('m-ok').addEventListener('click',async function(){
    var kantoor=document.getElementById('m-k').value.trim();
    if(!kantoor){var er=document.getElementById('m-err');er.style.display='block';er.textContent='Kantoornaam is verplicht.';return;}
    var btn=document.getElementById('m-ok');btn.disabled=true;btn.textContent='Aanmaken...';
    document.getElementById('m-err').style.display='none';
    try{
      var r=await fetch(WORKER+'/mna/create',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
        body:JSON.stringify({kantoor_naam:kantoor,contact_naam:document.getElementById('m-c').value.trim(),contact_email:document.getElementById('m-e').value.trim(),traject_type:document.getElementById('m-t').value,notitie:document.getElementById('m-n').value.trim()})});
      var d=await r.json();
      if(d.ok){
        mnaList.unshift({id:d.code,kantoor_naam:kantoor,traject_type:document.getElementById('m-t').value,koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});
        var res=document.getElementById('m-res');res.style.display='block';
        res.innerHTML='<strong style="color:var(--teal-dim)">&#10003; Traject aangemaakt</strong><br>'
          +'<b>Verkoperscode:</b> <span class="code-chip">'+d.code+'</span> <button class="copy-btn res-copy" data-copy="'+d.code+'">⎘ Kopieer</button><br>'
          +'<b>Koperscode:</b> <span class="code-chip" style="background:var(--gold-bg);color:var(--gold);border-color:var(--gold)">'+d.koper_code+'</span> <button class="copy-btn res-copy" data-copy="'+d.koper_code+'">⎘ Kopieer</button><br>'
          +'<b>Tussenpersoon:</b> <span class="code-chip" style="background:var(--card);color:var(--mid)">'+d.tussen_code+'</span> <button class="copy-btn res-copy" data-copy="'+d.tussen_code+'">⎘ Kopieer</button><br><br>'
          +'<button id="res-opslaan" style="font-size:12px;padding:5px 12px;border:1px solid var(--teal-dark);border-radius:var(--r);cursor:pointer;background:transparent;color:var(--teal)">&#8681; Opslaan als bestand</button>';
        res.querySelectorAll('.res-copy').forEach(function(b){b.addEventListener('click',function(){navigator.clipboard.writeText(b.dataset.copy).then(function(){var o=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=o;},1500);});});});
        document.getElementById('res-opslaan').addEventListener('click',function(){slaOp({id:d.code,kantoor_naam:kantoor,traject_type:document.getElementById('m-t').value,koper_code:d.koper_code,tussen_code:d.tussen_code,created_at:Date.now()});});
        btn.textContent='Aangemaakt';
        document.getElementById('m-ann').textContent='Sluiten';
        document.getElementById('m-ann').addEventListener('click',function(){document.body.removeChild(ov);renderTab();},{once:true});
      }else{var er2=document.getElementById('m-err');er2.style.display='block';er2.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Traject aanmaken';}
    }catch(e){var er3=document.getElementById('m-err');er3.style.display='block';er3.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Traject aanmaken';}
  });
}

function slaOp(t){
  var inhoud='KantoorInzicht \u2014 M&A Traject\n\nKantoor: '+(t.kantoor_naam||'—')+'\nType: '+(t.traject_type||'—')+'\nStatus: '+(t.status||'actief')+'\nAangemaakt: '+formatDate(t.created_at)+'\n\nCODES\nVerkoperscode: '+t.id+'\nKoperscode: '+(t.koper_code||'—')+'\nTussenpersoonscode: '+(t.tussen_code||'—')+'\n\nToegang via: https://koersvoormorgen.nl/mna.html';
  var blob=new Blob([inhoud],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='traject-'+t.id+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function vergrendel(id,naam){
  if(!confirm('Traject '+naam+' vergrendelen?'))return;
  try{
    var r=await fetch(WORKER+'/mna/admin/vergrendel/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST'});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='vergrendeld';renderTab();}
    else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}

async function ontvergrendel(id){
  try{
    var r=await fetch(WORKER+'/mna/admin/status/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'actief'})});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='actief';renderTab();}
    else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}

async function maakTrajectVanScan(scanId,naam,email,fte,revenue,region,overall,scenario,scoresStr){
  if(!confirm('M&A traject aanmaken voor '+naam+'? Scan-data wordt automatisch ingevuld in het traject.'))return;
  try{
    // Stap 1: traject aanmaken
    var r=await fetch(WORKER+'/mna/scan-to-traject?key='+encodeURIComponent(adminKey),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scan_id:scanId,kantoor_naam:naam,contact_email:email,traject_type:'Verkoop'})
    });
    var d=await r.json();
    if(!d.ok){alert('Fout: '+(d.error||'onbekend'));return;}
    var code=d.code;
    mnaList.unshift({id:code,kantoor_naam:naam,traject_type:'Verkoop',koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});

    // Stap 2: scan-data doorzetten naar MNA fasen
    var omzetNum=revenue?parseFloat(String(revenue).replace(/[^0-9]/g,''))||0:0;
    var fteNum=fte?parseInt(fte)||0:0;
    var omzetPfte=omzetNum&&fteNum?Math.round(omzetNum/fteNum):0;
    var scores={};
    try{scores=JSON.parse(scoresStr||'{}');}catch(e){}

    // Financieel fase
    var finData={
      omzet3:{value:revenue||'',label:'Jaaromzet jaar 3 (meest recent)',req:true},
      declarab:{value:omzetPfte>0?'€'+omzetPfte.toLocaleString('nl-NL')+' per FTE (berekend uit scan)':'',label:'Declarabiliteit (%)',req:false}
    };
    await fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
      body:JSON.stringify({code:code,fase_id:'financieel',data_json:finData,notitie:'Automatisch ingevuld vanuit KantoorInzicht scan (score: '+overall+'/100)'})
    }).catch(function(){});

    // Partner fase
    var partnerData={
      fte:{value:fte||'',label:'Totaal FTE',req:true}
    };
    await fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
      body:JSON.stringify({code:code,fase_id:'partner',data_json:partnerData,notitie:''})
    }).catch(function(){});

    // Strategisch fase
    var sc=scores||{};
    var strategischNotitie='KantoorInzicht scan scores:\n'+Object.entries(sc).map(function(kv){return '- '+kv[0]+': '+kv[1]+'/100';}).join('\n')+'\nAanbevolen scenario: '+(scenario||'\u2014')+'\nOverall score: '+(overall||'\u2014')+'/100';
  
    var stratData={
      marktpos:{value:region||'',label:'Marktpositie / regio',req:true},
      synergie:{value:scenario||'',label:'Gewenste vervolgstap eigenaar',req:true}
    };
    await fetch(WORKER+'/mna/save',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
      body:JSON.stringify({code:code,fase_id:'strategisch',data_json:stratData,notitie:strategischNotitie})
    }).catch(function(){});

    alert('Traject aangemaakt en scan-data ingevuld!\n\nVerkoperscode: '+code+'\nKoperscode: '+d.koper_code+'\n\nIngevuld: omzet, FTE, regio, scenario en dimensiescores.');
    activeTab='mna';renderDashboard();
  }catch(e){alert('Verbindingsfout: '+e.message);}
}
