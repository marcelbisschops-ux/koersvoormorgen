function toast(msg,type,dur){type=type||'ok';dur=dur||3500;var c=document.getElementById('toast-container');if(!c){c=document.createElement('div');c.id='toast-container';c.className='toast-container';document.body.appendChild(c);}var t=document.createElement('div');t.className='toast toast-'+type;var ico=type==='ok'?'✓':type==='err'?'✕':type==='warn'?'⚠':'ℹ';t.innerHTML='<span style="font-size:15px;flex-shrink:0;color:'+(type==='ok'?'var(--teal)':type==='err'?'var(--red)':type==='warn'?'var(--gold)':'#2a5ea0')+'">'+ico+'</span><span style="flex:1;line-height:1.5">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0;line-height:1;flex-shrink:0">&times;</button>';c.appendChild(t);setTimeout(function(){t.classList.add('hide');setTimeout(function(){if(t.parentElement)t.parentElement.removeChild(t);},220);},dur);return t;}

function renderLogin(){
  document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-box">'
    +'<div class="login-title">KantoorInzicht Beheer</div>'
    +'<div class="login-sub">Beheerder-toegang. Alleen voor beheerder.</div>'
    +'<div class="field" style="margin-top:1rem"><label>Beheerder-sleutel</label><input type="password" id="ak" placeholder="••••••••" autofocus></div>'
    +'<button class="btn" id="login-btn" style="width:100%">Inloggen</button>'
    +'<div style="margin-top:1rem;padding:.75rem 1rem;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);font-size:11px;color:var(--muted);line-height:1.7">&#128274; <strong style="color:var(--sub)">Beveiliging & privacy</strong><br>Verbinding versleuteld (HTTPS). Gegevens in Cloudflare EU (Frankfurt). Geen gegevensverkoop. <a href="privacy.html" style="color:var(--teal)">Privacyverklaring</a></div>'
    +'<div id="login-err" style="color:var(--red);font-size:12px;margin-top:.75rem;display:none">Sleutel incorrect.</div>'
    +'<div id="login-mode" style="display:none"></div>'
    +'<div id="admin-fields" style="display:none"></div>'
    +'<div id="adviseur-fields" style="display:none"></div>'
    +'</div></div>';
  document.getElementById('login-btn').addEventListener('click',doLogin);
  document.getElementById('ak').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  var btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Laden...';
  var err=document.getElementById('login-err');err.style.display='none';
  var key=document.getElementById('ak').value.trim();
  if(!key){btn.disabled=false;btn.textContent='Inloggen';return;}
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(key)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(key))
    ]);
    if(!r1.ok)throw new Error('unauthorized');
    scans=await r1.json();callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    adminKey=key;isSuperAdmin=true;gebruikerInfo=null;gebruikerToken='';
    document.getElementById('hdr-actions').style.display='flex';
    document.getElementById('btn-refresh').addEventListener('click',refreshData);
    document.getElementById('btn-logout').addEventListener('click',logout);
    renderDashboard();
  }catch(e){
    err.textContent='Sleutel incorrect of verbindingsfout.';
    err.style.display='block';
    btn.disabled=false;btn.textContent='Inloggen';
  }
}

function logout(){
  adminKey='';scans=[];callbacks=[];mnaList=[];rapporten=[];
  gebruikerToken='';gebruikerInfo=null;isSuperAdmin=false;
  document.getElementById('hdr-actions').style.display='none';
  renderLogin();
}

async function refreshData(){
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(adminKey))
    ]);
    scans=await r1.json();callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    renderDashboard();
  }catch(e){toast('Kon niet verversen.','err');}
}

          +'<td>'+(vergr?'<span class="tag" style="background:var(--red-bg);color:var(--red);border-color:var(--red)">&#128274; Vergrendeld</span>':'<span style="font-size:11px;color:var(--muted)">Vrij</span>')+'</td>'
          +'<td class="mono" style="font-size:11px">'+dt+'</td>'
          +'<td style="white-space:nowrap;display:flex;gap:4px">'
          +(d.bewaard?'<a href="'+WORKER+'/mna/document/download/'+d.id+'?key='+encodeURIComponent(adminKey)+'" target="_blank" class="btn-ghost" style="font-size:11px;padding:3px 8px;text-decoration:none">&#8681;</a>':'')
          +(vergr
            ?'<button class="btn-ghost btn-ontv-doc" data-id="'+d.id+'" style="font-size:11px;padding:3px 8px;color:var(--teal)">&#128275;</button>'
            :'<button class="btn-ghost btn-verg-doc" data-id="'+d.id+'" style="font-size:11px;padding:3px 8px;color:var(--gold)">&#128274;</button>')
          +(!vergr?'<button class="btn-red btn-del-doc" data-id="'+d.id+'" style="font-size:10px;padding:2px 6px">&#10005;</button>':'')
          +'</td>'
          +'</tr>';
      });
      html+='</tbody></table>';
      db.innerHTML=html;
      var ds=document.getElementById('doc-search');if(ds)ds.addEventListener('input',function(){var q=this.value.toLowerCase();db.querySelectorAll('tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});});
      var cbAll=document.getElementById('cb-all');if(cbAll){cbAll.addEventListener('change',function(){document.querySelectorAll('.doc-cb:not(:disabled)').forEach(function(cb){cb.checked=cbAll.checked;});updateSelCount();});}
      db.querySelectorAll('.doc-cb').forEach(function(cb){cb.addEventListener('change',updateSelCount);});
      db.querySelectorAll('.btn-del-doc').forEach(function(b){b.addEventListener('click',function(){verwijderDoc(b.dataset.id);});});
      db.querySelectorAll('.btn-verg-doc').forEach(function(b){b.addEventListener('click',function(){vergrendelDoc(b.dataset.id,true);});});
      db.querySelectorAll('.btn-ontv-doc').forEach(function(b){b.addEventListener('click',function(){vergrendelDoc(b.dataset.id,false);});});
    }catch(e){db.textContent='Fout bij laden: '+e.message;}
  });
}


async function renderBenchmarksTab(el){
  el.innerHTML='<div class="table-wrap"><div class="table-hdr"><div class="table-title">Benchmarks</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-refresh">&#8635; Bronnen updaten</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-add">+ Handmatig toevoegen</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)" id="btn-bench-pdf">&#128196; PDF analyseren</button>'
    +'</div></div>'
    +'<div id="bench-body" class="empty">Laden...</div></div>';

  async function laadBenchmarks(){
    var db=document.getElementById('bench-body');
    try{
      var r=await fetch(WORKER+'/benchmarks');
      var data=await r.json();
      if(!data.length){db.innerHTML='<div class="empty">Nog geen benchmarks. Klik op Bronnen updaten om de eerste data op te halen.</div>';return;}
      var html='<table><thead><tr><th>Sleutel</th><th>Omschrijving</th><th>Waarde</th><th>Bron</th><th>Peildatum</th><th>Bijgewerkt</th><th></th></tr></thead><tbody>';
      data.forEach(function(b){
        var dt=b.updated_at?new Date(b.updated_at).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'--';
        var valFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
        html+='<tr>'
          +'<td class="mono" style="font-size:11px;color:var(--teal)">'+esc(b.sleutel)+'</td>'
          +'<td style="font-size:12px">'+esc(b.omschrijving||'--')+'</td>'
          +'<td class="mono" style="font-weight:600;color:var(--head)">'+valFmt+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+esc(b.bron||'--')+(b.bron_url?'<br><a href="'+esc(b.bron_url)+'" target="_blank" style="color:var(--teal);font-size:10px">Bron &#8599;</a>':'')+'</td>'
          +'<td class="mono" style="font-size:11px">'+esc(b.peildatum||'--')+'</td>'
          +'<td class="mono" style="font-size:11px">'+dt+'</td>'
          +'<td><button class="btn-red btn-del-bench" data-sleutel="'+esc(b.sleutel)+'" style="font-size:10px;padding:2px 6px">&#10005;</button></td>'
          +'</tr>';
      });
      html+='</tbody></table>';
      db.innerHTML=html;
      db.querySelectorAll('.btn-del-bench').forEach(function(btn){
        btn.addEventListener('click',async function(){
          if(!confirm('Benchmark "'+btn.dataset.sleutel+'" verwijderen?'))return;
          await fetch(WORKER+'/admin/benchmarks/delete/'+btn.dataset.sleutel+'?key='+encodeURIComponent(adminKey),{method:'POST'}).catch(function(){});
          laadBenchmarks();
        });
      });
    }catch(e){db.innerHTML='<div class="empty">Fout bij laden: '+e.message+'</div>';}
  }
  laadBenchmarks();

  document.getElementById('btn-bench-refresh').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;btn.textContent='Updaten...';
    try{
      var r=await fetch(WORKER+'/admin/benchmarks/refresh?key='+encodeURIComponent(adminKey),{method:'POST'});
      if(!r.ok&&r.status!==400){var errTxt=await r.text().catch(()=>'');throw new Error('Server fout '+r.status+': '+errTxt.substring(0,100));}
      var d=await r.json();
      if(d.ok){toast(d.count+' benchmarks bijgewerkt uit bronnen.','ok');laadBenchmarks();}
      else toast('Fout: '+(d.error||'onbekend'),'err');
    }catch(e){toast('Verbindingsfout.','err');}
    btn.disabled=false;btn.textContent='↻ Bronnen updaten';
  });

  document.getElementById('btn-bench-pdf').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.style.cssText='background:#fff;border:1px solid #c8c5bc;border-radius:10px;padding:1.75rem;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;max-width:520px';
    mo.innerHTML='<div class="modal-title">&#128196; PDF analyseren voor benchmarks</div>'
      +'<p style="font-size:13px;color:var(--mid);margin-bottom:1rem;line-height:1.6">Upload een PDF met benchmarkdata (bijv. Full Finance, Simplicate, AV Top 20). De AI extraheert automatisch de relevante waarden en slaat ze op als benchmarks.</p>'
      +'<div class="field"><label>Bron naam <span style="color:var(--red)">*</span></label><input type="text" id="pdf-bron" placeholder="bijv. AV Top 20 Administratiekantoren 2025" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>Peildatum <span style="color:var(--red)">*</span></label><input type="text" id="pdf-datum" placeholder="bijv. 2025" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>PDF bestand <span style="color:var(--red)">*</span></label><input type="file" id="pdf-file" accept=".pdf" style="margin-bottom:.5rem"></div>'
      +'<div id="pdf-status" style="font-size:12px;color:var(--teal);margin:.75rem 0;display:none;padding:10px;background:var(--teal-bg);border-radius:var(--r)"></div>'
      +'<div id="pdf-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div id="pdf-preview" style="font-size:12px;color:var(--mid);margin-bottom:.75rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="pdf-ann">Annuleren</button><button class="btn" id="pdf-ok">Analyseren &amp; opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('pdf-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('pdf-ok').addEventListener('click',async function(){
      var bron=document.getElementById('pdf-bron').value.trim();
      var datum=document.getElementById('pdf-datum').value.trim();
      var file=document.getElementById('pdf-file').files[0];
      var err=document.getElementById('pdf-err');
      var status=document.getElementById('pdf-status');
      var preview=document.getElementById('pdf-preview');
      if(!bron||!datum||!file){err.style.display='block';err.textContent='Vul alle velden in en selecteer een PDF.';return;}
      var btn=document.getElementById('pdf-ok');
      // Als al geanalyseerd en bevestigd: sla op zonder opnieuw analyseren
      if(btn.dataset.confirmed==='1'){
        btn.disabled=true;btn.textContent='Opslaan...';
        var gevonden2=btn._gevonden||[];
        for(var bi=0;bi<gevonden2.length;bi++){
          await fetch(WORKER+'/admin/benchmarks/update?key='+encodeURIComponent(adminKey),{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sleutel:gevonden2[bi].sleutel,waarde:gevonden2[bi].waarde,categorie:gevonden2[bi].categorie||'algemeen',omschrijving:gevonden2[bi].omschrijving,bron:bron,peildatum:datum})
          }).catch(function(){});
        }
        status.textContent='&#10003; '+gevonden2.length+' benchmarks opgeslagen.';
        status.style.background='var(--teal-bg)';status.style.color='var(--teal)';
        btn.textContent='Klaar';btn.dataset.confirmed='';
        laadBenchmarks();
        return;
      }
      btn.disabled=true;btn.textContent='Analyseren...';
      err.style.display='none';
      status.style.display='block';status.textContent='PDF inlezen...';
      try{
        // PDF naar base64
        var b64=await new Promise(function(res,rej){
          var r=new FileReader();
          r.onload=function(){res(r.result.split(',')[1]);};
          r.onerror=function(){rej(new Error('Lezen mislukt'));};
          r.readAsDataURL(file);
        });
        status.textContent='AI analyseert PDF... (30-60 seconden)';
        // Stuur naar worker die AI aanroept
        var resp=await fetch(WORKER+'/admin/benchmarks/pdf-analyse?key='+encodeURIComponent(adminKey),{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pdf_base64:b64,bron:bron,peildatum:datum,bestandsnaam:file.name})
        });
        var data=await resp.json();
        if(!resp.ok||data.error)throw new Error(data.error||'Analyse mislukt');
        var gevonden=data.benchmarks||[];
        if(!gevonden.length)throw new Error('Geen benchmarkwaarden gevonden in dit document.');
        // Haal huidige benchmarks op voor conflict check
        var huidig={};
        try{var br=await fetch(WORKER+'/benchmarks');var bd=await br.json();bd.forEach(function(b){huidig[b.sleutel]=b;});}catch(e){}
        // Bouw preview met conflict waarschuwingen
        var conflicten=gevonden.filter(function(b){return huidig[b.sleutel]&&Math.abs(huidig[b.sleutel].waarde-b.waarde)>1;});
        var pvHtml='<strong style="color:var(--head)">'+gevonden.length+' waarden gevonden'+(conflicten.length?' &mdash; <span style="color:var(--gold)">'+conflicten.length+' conflict(en)</span>':'')+':</strong><br><br>';
        gevonden.forEach(function(b){
          var hv=huidig[b.sleutel];
          var conflict=hv&&Math.abs(hv.waarde-b.waarde)>1;
          var nvFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
          if(conflict){
            var ovFmt=hv.waarde>1000?'€'+(hv.waarde/1000).toFixed(0)+'K':hv.waarde.toFixed(2)+'x';
            pvHtml+='<div style="padding:6px 10px;margin-bottom:4px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0">'
              +'<span style="color:var(--gold)">&#9888; Conflict</span> <code>'+b.sleutel+'</code><br>'
              +'Huidig ('+esc(hv.bron||'onbekend')+'): <strong>'+ovFmt+'</strong> → Nieuw ('+esc(bron)+'): <strong>'+nvFmt+'</strong></div>';
          } else {
            pvHtml+='<div style="padding:4px 0;font-size:12px">&#10003; <code>'+b.sleutel+'</code>: '+nvFmt+(hv?' (ongewijzigd)':' (nieuw)')+'</div>';
          }
        });
        preview.style.display='block';preview.innerHTML=pvHtml;
        if(conflicten.length){
          status.style.display='block';status.textContent='&#9888; Controleer de conflicten hierboven. Klik Opslaan om alle waarden te overschrijven.';
          status.style.background='var(--gold-bg)';status.style.color='var(--gold)';
          btn._gevonden=gevonden;
          btn.disabled=false;btn.textContent='Toch opslaan';
          btn.dataset.confirmed='1';
        } else {
          status.textContent='&#10003; '+gevonden.length+' benchmarks opgeslagen in D1.';
          btn.textContent='Klaar';
          laadBenchmarks();
        }
      }catch(e){
        err.style.display='block';err.textContent='Fout: '+e.message;
        btn.disabled=false;btn.textContent='Opnieuw proberen';
        status.style.display='none';
      }
    });
  });

  document.getElementById('btn-bench-add').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.style.cssText='background:#fff;border:1px solid #c8c5bc;border-radius:10px;padding:1.75rem;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;max-width:560px';
    mo.innerHTML='<div class="modal-title">Benchmark handmatig toevoegen</div>'
      +'<div class="field"><label>Sleutel (uniek ID) <span style="color:var(--red)">*</span></label><input type="text" id="bm-id" placeholder="bijv. noab_ebitda_marge"></div>'
      +'<div class="field"><label>Omschrijving</label><input type="text" id="bm-omschr" placeholder="bijv. EBITDA marge benchmark NOAB 2025"></div>'
      +'<div class="field"><label>Waarde (getal) <span style="color:var(--red)">*</span></label><input type="number" id="bm-val" step="0.1" placeholder="bijv. 22.5"></div>'
      +'<div class="field"><label>Categorie</label><select id="bm-cat"><option value="productiviteit">Productiviteit</option><option value="winstgevendheid">Winstgevendheid</option><option value="waardering">Waardering</option><option value="tarieven">Tarieven</option><option value="algemeen">Algemeen</option></select></div>'
      +'<div class="field"><label>Bron</label><input type="text" id="bm-bron" placeholder="bijv. NOAB/Fiscount Benchmark 2025"></div>'
      +'<div class="field"><label>Bron URL (optioneel)</label><input type="text" id="bm-url" placeholder="https://..."></div>'
      +'<div class="field"><label>Peildatum</label><input type="text" id="bm-datum" placeholder="bijv. 2025-Q3 of 2025"></div>'
      +'<div id="bm-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="bm-ann">Annuleren</button><button class="btn" id="bm-ok">Opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('bm-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('bm-ok').addEventListener('click',async function(){
      var id=document.getElementById('bm-id').value.trim();
      var val=parseFloat(document.getElementById('bm-val').value);
      var err=document.getElementById('bm-err');
      if(!id||isNaN(val)){err.style.display='block';err.textContent='Sleutel en waarde zijn verplicht.';return;}
      var btn=document.getElementById('bm-ok');
      // Conflict check: huidige waarde ophalen
      if(!btn.dataset.confirmed){
        try{
          var chkR=await fetch(WORKER+'/benchmarks');
          var chkD=await chkR.json();
          var bestaand=chkD.find(function(b){return b.sleutel===id;});
          if(bestaand&&Math.abs(bestaand.waarde-val)>0.01){
            var ovFmt2=bestaand.waarde>1000?'€'+(bestaand.waarde/1000).toFixed(0)+'K':bestaand.waarde.toFixed(2)+'x';
            var nvFmt2=val>1000?'€'+(val/1000).toFixed(0)+'K':val.toFixed(2)+'x';
            err.style.display='block';
            err.style.color='var(--gold)';
            err.innerHTML='&#9888; Huidige waarde: <strong>'+ovFmt2+'</strong> ('+esc(bestaand.bron||'onbekend')+')<br>Nieuwe waarde: <strong>'+nvFmt2+'</strong><br><br>Klik nogmaals op Opslaan om te overschrijven.';
            btn.dataset.confirmed='1';
            return;
          }
        }catch(eCk){}
      }
      btn.dataset.confirmed='';
      btn.disabled=true;btn.textContent='Opslaan...';
      try{
        var r=await fetch(WORKER+'/admin/benchmarks/update?key='+encodeURIComponent(adminKey),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({sleutel:id,waarde:val,categorie:document.getElementById('bm-cat').value,omschrijving:document.getElementById('bm-omschr').value.trim(),bron:document.getElementById('bm-bron').value.trim(),bron_url:document.getElementById('bm-url').value.trim(),peildatum:document.getElementById('bm-datum').value.trim()})
        });
        var d=await r.json();
        if(d.ok){document.body.removeChild(ov);laadBenchmarks();}
        else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Opslaan';}
      }catch(e2){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Opslaan';}
    });
  });
}

function renderTemplatesTab(el){
  var docLabels={nda:'NDA (Geheimhoudingsovereenkomst)',loi:'Letter of Intent (LoI)',bem_verk:'Bemiddelingsovereenkomst Verkoop',bem_koper:'Bemiddelingsovereenkomst Aankoop',exclusief:'Exclusiviteitsbrief'};
  var docKleuren={nda:'#7c5cbf',loi:'var(--gold)',bem_verk:'#2a5ea0',bem_koper:'#2a5ea0',exclusief:'var(--teal)'};

  el.innerHTML='<div class="table-wrap"><div class="table-hdr"><div class="table-title">&#128196; Document Templates</div></div>'
    +'<div style="padding:1.25rem">'
    +'<div style="font-size:13px;color:var(--mid);margin-bottom:1.25rem;line-height:1.7">'
    +'Hier beheers je de document templates. De <strong>Bisschops Financing standaard templates</strong> zijn al ingebouwd. '
    +'Je kunt per document een eigen template uploaden — die wordt dan gebruikt in plaats van de standaard. '
    +'Als er geen eigen template is, genereert de AI op basis van de BF-standaard.'
    +'</div>'
    +'<div id="tpl-lijst" style="display:flex;flex-direction:column;gap:10px"></div>'
    +'</div></div>';

  var lijst=document.getElementById('tpl-lijst');
  Object.entries(docLabels).forEach(function(entry){
    var type=entry[0];var label=entry[1];
    var kleur=docKleuren[type]||'var(--teal)';
    var div=document.createElement('div');
    div.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem';
    div.innerHTML='<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
      +'<div style="font-size:12px;font-weight:600;color:'+kleur+';min-width:220px">'+label+'</div>'
      +'<div id="tpl-status-'+type+'" style="font-size:11px;color:var(--muted)">Laden...</div>'
      +'<div style="margin-left:auto;display:flex;gap:8px">'
      +'<button class="btn-ghost tpl-bekijk" data-type="'+type+'" style="font-size:11px;padding:4px 12px" title="Bekijk huidig template">&#128065; Bekijk</button>'
      +'<label class="btn" style="font-size:11px;padding:4px 12px;cursor:pointer;background:'+kleur+'">&#128196; Upload eigen<input type="file" accept=".txt,.docx,.doc" data-type="'+type+'" class="tpl-upload" style="display:none"></label>'
      +'<button class="btn-ghost tpl-reset" data-type="'+type+'" style="font-size:11px;padding:4px 12px;color:var(--red);border-color:var(--red)">&#10005; Reset BF standaard</button>'
      +'</div></div>'
      +'<div id="tpl-preview-'+type+'" style="display:none;margin-top:.75rem;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:.75rem;font-size:12px;font-family:Georgia,serif;line-height:1.7;color:var(--sub);max-height:200px;overflow-y:auto"></div>';
    lijst.appendChild(div);

    // Laad status
    fetch(WORKER+'/mna/template/'+type).then(function(r){return r.json();}).then(function(d){
      var s=document.getElementById('tpl-status-'+type);
      if(s)s.innerHTML=d.ok?'<span style="color:var(--teal)">&#10003; Eigen template actief</span> (door '+esc(d.begeleider_naam||'onbekend')+')':'<span style="color:var(--muted)">BF standaard actief</span>';
    }).catch(function(){});

    // Bekijk knop
    div.querySelector('.tpl-bekijk').addEventListener('click',async function(){
      var prev=document.getElementById('tpl-preview-'+type);
      if(prev.style.display!=='none'){prev.style.display='none';return;}
      prev.textContent='Laden...';prev.style.display='block';
      var r=await fetch(WORKER+'/mna/template/'+type);var d=await r.json();
      prev.textContent=d.ok?d.tekst:'(BF standaard — zie gegenereerde documenten)';
    });

    // Upload eigen template
    div.querySelector('.tpl-upload').addEventListener('change',async function(){
      var file=this.files[0];if(!file)return;
      var reader=new FileReader();
      reader.onload=async function(e){
        var tekst=e.target.result;
        if(file.name.endsWith('.docx')){toast('Upload als .txt bestand (kopieer tekst uit Word en sla op als .txt)','warn');return;}
        var r=await fetch(WORKER+'/mna/template/upload',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({doc_type:type,tekst:tekst,begeleider_naam:'Marcel Bisschops',begeleider_email:'marcel@bisschopsfinancing.nl'})});
        var d=await r.json();
        if(d.ok){toast('Template opgeslagen!','ok');renderTemplatesTab(el);}
        else toast('Fout: '+(d.error||'onbekend'),'err');
      };
      reader.readAsText(file,'utf-8');
    });

    // Reset naar BF standaard
    div.querySelector('.tpl-reset').addEventListener('click',async function(){
      if(!confirm('Reset naar BF standaard template voor '+label+'?'))return;

function renderWaarderingTab(el){
  var selectedTraject=null;

    multiLaag:4.6,multiMid:5.05,multiHoog:5.5,omzetFactor:0.8,risico:0,
    earnBase:0,earnPct:20,earnTarget:5,earnJaren:3,earnMinimum:0};

  function parseGeld(s){if(!s)return 0;var n=String(s).replace(/[^0-9,.]/g,'').replace(',','.');return parseFloat(n)||0;}
  function fmtGeld(n){if(!n||isNaN(n))return '—';if(n>=1000000)return '\u20ac'+(n/1000000).toFixed(2).replace('.',',')+' mln';if(n>=1000)return '\u20ac'+(n/1000).toFixed(0)+'.000';return '\u20ac'+Math.round(n);}
  function fmtPct(n){return n?n.toFixed(1)+'%':'—';}

  function bereken(){
    var o3=W.omzet3||0;
    var ebitdaAmt=o3*(W.ebitda/100);
    var waardeMultiLaag=ebitdaAmt*W.multiLaag*(1-W.risico/100);
    var waardeMultiMid=ebitdaAmt*W.multiMid*(1-W.risico/100);
    var waardeMultiHoog=ebitdaAmt*W.multiHoog*(1-W.risico/100);
    var waardeOmzet=o3*W.omzetFactor*(1-W.risico/100);
    // Rolling forecast: gemiddelde groei berekenen
    var groei=0,groeiSteps=0;
    if(W.omzet1>0&&W.omzet2>0){groei+=(W.omzet2-W.omzet1)/W.omzet1*100;groeiSteps++;}
    if(W.omzet2>0&&W.omzet3>0){groei+=(W.omzet3-W.omzet2)/W.omzet2*100;groeiSteps++;}
    var gemGroei=groeiSteps>0?groei/groeiSteps:3;
    var fc=[o3];
    for(var i=1;i<=3;i++)fc.push(fc[fc.length-1]*(1+gemGroei/100));
    var fcEbitda=fc.map(function(o){return o*(W.ebitda/100);});
    var fcWaarde=fcEbitda.map(function(e){return e*W.multiMid*(1-W.risico/100);});
    // Earn-out
    var koopsom=W.earnBase||waardeMultiMid;
    var earnTotaal=0;var earnSchema=[];
    for(var j=1;j<=W.earnJaren;j++){
      var targetOmzet=o3*(1+W.earnTarget/100*j);
      var uitkering=Math.max(W.earnMinimum,koopsom*(W.earnPct/100)/W.earnJaren);
      earnTotaal+=uitkering;
      earnSchema.push({jaar:j,target:targetOmzet,uitkering:uitkering});
    }
    return {ebitdaAmt,waardeMultiLaag,waardeMultiMid,waardeMultiHoog,waardeOmzet,gemGroei,fc,fcEbitda,fcWaarde,koopsom,earnTotaal,earnSchema};
  }

      +'</div>';

    // Resultaten as-is
    html+='<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)">Waardebepaling as-is</div>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem">'

    // Rolling forecast

      +'<div style="font-size:12px;color:var(--muted);margin-bottom:.75rem">Gemiddelde historische omzetgroei: <strong style="color:var(--sub)">'+res.gemGroei.toFixed(1)+'%</strong> per jaar</div>'

      +'<div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Earn-out % van koopsom</div><input type="number" id="w-earn-pct" value="'+W.earnPct+'" min="0" max="100" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px"></div>'

      el.innerHTML=renderModule();bindWaardering();

        else if(id==='w-multi-laag')W.multiLaag=parseFloat(this.value)||4.6;
        else if(id==='w-multi-mid')W.multiMid=parseFloat(this.value)||5.05;
        else if(id==='w-multi-hoog')W.multiHoog=parseFloat(this.value)||5.5;
        else if(id==='w-earn-base')W.earnBase=parseGeld(this.value);
        else if(id==='w-earn-pct')W.earnPct=parseFloat(this.value)||20;
        else if(id==='w-earn-target')W.earnTarget=parseFloat(this.value)||5;
        else if(id==='w-earn-jaren')W.earnJaren=parseInt(this.value)||3;
        // Herrender alleen resultaten zonder volledige re-render
        var res2=bereken();
        // Update waardeboxen

async function leesRapport(id){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.style.cssText='background:#fff;border:1px solid #c8c5bc;border-radius:10px;padding:1.75rem;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;max-width:800px';

    +'<div style="display:flex;justify-content:flex-end"><button class="btn-ghost" id="rapp-sluit">Sluiten</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('rapp-sluit').addEventListener('click',function(){document.body.removeChild(ov);});
  try{
    var r=await fetch(WORKER+'/admin/rapport/'+id+'?key='+encodeURIComponent(adminKey));
    var d=await r.json();
    mo.querySelector('.modal-title').textContent=(d.kantoor_naam||'Rapport')+' — score '+d.overall+' — '+formatDate(d.created_at);
    var rb=document.getElementById('rapp-body');
    if(d.rapport_tekst){
      var txt=d.rapport_tekst
        .replace(/## (.+)/g,'<h3 style="font-family:Playfair Display,serif;font-size:1rem;color:var(--head);font-weight:600;margin:1.25rem 0 .5rem;border-top:1px solid var(--border);padding-top:1rem">$1</h3>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      txt=txt.split('\n\n').map(function(p){p=p.trim();if(!p||p.startsWith('<'))return p;return '<p>'+p+'</p>';}).join('');


      rb.innerHTML=txt;
    } else {
      rb.textContent='Geen rapport tekst.';
    }
  }catch(e){document.getElementById('rapp-body').textContent='Fout: '+e.message;}
}

async function verwijderRapport(id){

  try{

        var bemTplStandaard=isSell?'BEMIDDELINGSOVEREENKOMST VERKOOP\n(OPDRACHTGEVER – SELL-SIDE MANDATE)\nArtikel 1 – Partijen\n[Naam Opdrachtgever], gevestigd te [adres], rechtsgeldig vertegenwoordigd door [naam], hierna te noemen: “Opdrachtgever”;\nBisschops Financing B.V., gevestigd te Grotestraat 13, 5841AA Oploo, hierna te noemen: “Bisschops Financing”;\nOpdrachtgever en Bisschops Financing hierna gezamenlijk te noemen: “Partijen”.\nArtikel 2 – Opdracht en doel\nOpdrachtgever verstrekt aan Bisschops Financing de exclusieve opdracht tot het begeleiden van de verkoop van (de aandelen in) de onderneming, activiteiten of vermogensbestanddelen.\nDe werkzaamheden van Bisschops Financing richten zich primair op procesbegeleiding en omvatten:\nanalyse van de onderneming en bepalen van de verkoopstrategie;\nopstellen van informatiemateriaal (teaser en informatiememorandum);\nstructureren en begeleiden van het verkoopproces;\nondersteuning bij onderhandelingen tot en met closing.\nOp de werkzaamheden rust uitsluitend een inspanningsverplichting en geen resultaatsverplichting.\nArtikel 3 – Looptijd en Exclusiviteit\nDeze overeenkomst wordt aangegaan voor een initiële exclusieve periode van vier (4) maanden.\nNa afloop van deze periode wordt de overeenkomst stilzwijgend voortgezet voor onbepaalde tijd, met een opzegtermijn van één (1) maand.\nGedurende de looptijd van de overeenkomst zal Opdrachtgever:\ngeen andere M&A-adviseur of bemiddelaar inschakelen voor een vergelijkbare opdracht;\ngeen onderhandelingen voeren zonder directe betrokkenheid van Bisschops Financing;\npotentiële kopers die zich rechtstreeks melden direct doorverwijzen naar Bisschops Financing.\nArtikel 4 – Introductie en bescherming\nEen Potentiële Koper geldt als door Bisschops Financing geïntroduceerd zodra identificerende gegevens door Bisschops Financing aan Opdrachtgever zijn verstrekt of een ontmoeting tot stand is gebracht.\nIndien een Potentiële Koper reeds bij Opdrachtgever bekend is en in de zes (6) maanden voorafgaand aan de Introductie aantoonbaar contact heeft plaatsgevonden, dient Opdrachtgever dit binnen vijf (5) werkdagen na Introductie schriftelijk en met bewijsstukken aan Bisschops Financing te melden.\nBij gebreke van een tijdige en volledige melding wordt de Potentiële Koper onweerlegbaar geacht door Bisschops Financing te zijn geïntroduceerd.\nArtikel 5 – Vergoedingen\nGeen Succesfee voor Opdrachtgever: Opdrachtgever is aan Bisschops Financing geen succesfee verschuldigd bij het tot stand komen van een Transactie. Bisschops Financing zal haar honorarium voor de bemiddeling verhalen op de Kopende Partij.\nExtra werkzaamheden (Uurtarief): Indien Opdrachtgever wenst dat Bisschops Financing werkzaamheden verricht die buiten de in Artikel 2 genoemde scope vallen, kan dit op basis van uurtarief worden overeengekomen. Dit geldt ongeacht of het verkooptraject volgens verwachting verloopt.\nVoorbeelden van extra werk: Het actief benaderen van specifieke marktpartijen op verzoek van Opdrachtgever, extra financiële analyses of aanpassingen aan het informatiememorandum na eerdere goedkeuring, of intensieve begeleiding bij complexe vraagstukken die buiten de standaard procesregie vallen.\nBeperking: Conform Artikel 3 van de Algemene Voorwaarden omvat dit extra werk nooit werkzaamheden die zijn voorbehouden aan accountants, fiscalisten of advocaten (zoals due diligence rapportages, belastingadvies of het opstellen van SPA\'s).\nTarief: Dit geschiedt uitsluitend na expliciete opdracht en tegen een tarief van € 250 exclusief btw per uur.\nArtikel 6 – Beëindiging zonder Transactie\nIndien de overeenkomst eindigt zonder dat een Transactie tot stand komt, is Opdrachtgever uitsluitend kosten verschuldigd in de volgende gevallen ("Break-fee"):\nIntrekking: Indien Opdrachtgever de opdracht intrekt of beëindigt terwijl er concrete interesse is van Potentiële Kopers;\nWeigering: Indien Opdrachtgever een marktconform bod weigert dat voldoet aan de vooraf vastgestelde criteria;\nToerekenbare tekortkoming: Indien het proces vastloopt door onjuiste informatieverstrekking of obstructie door Opdrachtgever.\nIn deze gevallen is Opdrachtgever aan Bisschops Financing een vergoeding verschuldigd van de daadwerkelijk bestede uren (à € 250/uur), met een minimum van € 5.000 exclusief btw.\nArtikel 7 – Informatieverstrekking en vrijwaring\nOpdrachtgever staat in voor de juistheid, volledigheid en tijdigheid van de aan Bisschops Financing verstrekte informatie. Opdrachtgever vrijwaart Bisschops Financing voor alle schade en aanspraken van derden die voortvloeien uit onjuiste of onvolledige informatieverstrekking.\nArtikel 8 – Toepasselijkheid Algemene Voorwaarden\nOp deze overeenkomst zijn de hieronder opgenomen Algemene Voorwaarden van Bisschops Financing B.V. integraal van toepassing.\nIn geval van strijdigheid tussen deze Overeenkomst en de Algemene Voorwaarden, prevaleren de bepalingen uit deze Overeenkomst.\nArtikel 9 – Rechtskeuze en forum\nOp deze overeenkomst is uitsluitend Nederlands recht van toepassing. Geschillen worden exclusief voorgelegd aan de Rechtbank Oost-Brabant.\nOndertekening\nPlaats: ____________________ Datum: ____________________\nOpdrachtgever\nNaam: ____________________\nHandtekening: ____________________\nBisschops Financing B.V.\nNaam: ____________________\nHandtekening: ____________________\nALGEMENE VOORWAARDEN\nBisschops Financing B.V.\nArtikel 1 – Toepasselijkheid\nDeze Algemene Voorwaarden zijn van toepassing op alle aanbiedingen, offertes, opdrachten, overeenkomsten en werkzaamheden van Bisschops Financing B.V. (hierna: Bisschops Financing).\nDeze voorwaarden gelden mede ten behoeve van alle aan Bisschops Financing verbonden personen en rechtspersonen, waaronder bestuurders, aandeelhouders, werknemers, adviseurs en ingeschakelde derden.\nAfwijkingen van deze voorwaarden zijn slechts geldig indien schriftelijk overeengekomen.\nDe toepasselijkheid van algemene voorwaarden van de wederpartij wordt uitdrukkelijk uitgesloten.\nArtikel 2 – Definities\nOpdrachtgever: De natuurlijke persoon of rechtspersoon die een overeenkomst aangaat met Bisschops Financing, alsmede iedere rechtspersoon of persoon namens wie wordt gehandeld of die economisch met de opdracht is verbonden.\nGelieerde Entiteit: Iedere rechtspersoon of natuurlijke persoon die direct of indirect organisatorisch, juridisch, financieel of economisch is verbonden aan Opdrachtgever.\nIntroductie: Het moment waarop Bisschops Financing identificerende gegevens van een potentiële koper, verkoper, investeerder, target of andere transactiedeelnemer verstrekt, dan wel een ontmoeting of contact tot stand brengt.\nTransactie: Iedere juridische of economische overdracht, participatie, samenwerking of gelijkwaardige constructie (aandelen, activa/passiva, fusie, etc.).\nTransactiewaarde: De totale economische waarde van de Transactie, inclusief vaste koopsom, maximale earn-out, uitgestelde betalingen, vendor loans, overgenomen schulden en overige economische voordelen.\nArtikel 3 – Aard van de dienstverlening\nBisschops Financing verricht haar werkzaamheden naar beste inzicht en vermogen op basis van een inspanningsverplichting.\nBisschops Financing treedt niet op als accountant, fiscalist, advocaat of Register Valuator. Eventuele adviezen van Bisschops Financing kunnen nimmer als zodanig worden opgevat.\nOpdrachtgever blijft volledig verantwoordelijk voor due diligence, risicobeoordeling, fiscale/juridische toetsing en de uiteindelijke besluitvorming.\nArtikel 4 – Vergoedingen en betaling\nTenzij schriftelijk anders overeengekomen gelden de volgende tarieven voor werkzaamheden op regiebasis:\nuurtarief: € 250 exclusief btw;\nreiskosten: € 0,35 per kilometer;\nreistijd: 50% van het geldende uurtarief.\nFacturen dienen te worden voldaan binnen veertien (14) dagen na factuurdatum.\nBij niet-tijdige betaling is Opdrachtgever van rechtswege in verzuim en is wettelijke handelsrente en incassokosten verschuldigd.\nArtikel 5 – Succesfee en nawerking\nIndien een Transactie tot stand komt met een door Bisschops Financing geïntroduceerde of betrokken partij, is de overeengekomen succesfee verschuldigd.\nDit recht blijft bestaan gedurende vierentwintig (24) maanden na de Introductie of beëindiging van de overeenkomst (nawerking).\nIndien na ondertekening van een intentieverklaring (LOI) geen Transactie tot stand komt als rechtstreeks gevolg van:\neen aan Opdrachtgever toerekenbare tekortkoming;\nhet afbreken van onderhandelingen in strijd met redelijkheid en billijkheid;\nhet omzeilen van Bisschops Financing;\nis Opdrachtgever aan Bisschops Financing een vergoeding verschuldigd gelijk aan 50% van de overeengekomen succesfee (of de geschatte succesfee bij een marktconforme transactie).\nArtikel 6 – Anti-omzeiling\nIndien een Transactie direct of indirect wordt gerealiseerd via een Gelieerde Entiteit of alternatieve structuur, blijft de volledige succesfee verschuldigd.\nDaarnaast verbeurt Opdrachtgever een direct opeisbare boete van € 25.000, onverminderd het recht op volledige schadevergoeding.\nArtikel 7 – Aansprakelijkheid\nIedere aansprakelijkheid is uitgesloten, behoudens in geval van opzet of bewuste roekeloosheid van de leiding.\nAansprakelijkheid is beperkt tot uitsluitend directe schade. Indirecte schade (zoals gederfde winst, gemiste besparingen of bedrijfsstagnatie) is uitdrukkelijk uitgesloten.\nIedere aanspraak vervalt indien deze niet binnen twaalf (12) maanden na ontdekking schriftelijk is gemeld.\nArtikel 8 – Geheimhouding\nPartijen verplichten zich tot strikte geheimhouding van alle vertrouwelijke informatie, ook na beëindiging van de overeenkomst.\nArtikel 9 – Rechtskeuze en forum\nOp alle rechtsverhoudingen is uitsluitend Nederlands recht van toepassing.\nGeschillen worden exclusief voorgelegd aan de Rechtbank Oost-Brabant.':'BEMIDDELINGSOVEREENKOMST AANKOOP\n(OPDRACHTGEVER – BUY-SIDE MANDATE)\nPartijen\n[Naam Opdrachtgever], gevestigd te [adres], rechtsgeldig vertegenwoordigd door [naam], hierna te noemen: “Opdrachtgever”;\nBisschops Financing B.V., gevestigd te Grotestraat 13, 5841AA Oploo, hierna te noemen: “Bisschops Financing”;\nOpdrachtgever en Bisschops Financing hierna gezamenlijk te noemen: “Partijen”.\nArtikel 1 – Opdracht en doel\nOpdrachtgever verstrekt aan Bisschops Financing de opdracht tot het identificeren, benaderen en begeleiden van mogelijke Targets met het oog op het realiseren van een Transactie.\nDe werkzaamheden van Bisschops Financing omvatten onder meer, doch niet uitsluitend:\nhet vaststellen van zoekprofiel en investeringscriteria;\nhet selecteren en analyseren van potentiële Targets;\nhet tot stand brengen van introducties en eerste contacten;\nhet structureren en begeleiden van het acquisitieproces;\nhet ondersteunen van onderhandelingen tot en met closing;\nhet afstemmen met juridische, fiscale en financiële adviseurs.\nOp de werkzaamheden rust uitsluitend een inspanningsverplichting en geen resultaatsverplichting.\nArtikel 2 – Introductie en bescherming\nEen Target geldt als door Bisschops Financing geïntroduceerd zodra identificerende gegevens door Bisschops Financing aan Opdrachtgever zijn verstrekt of een ontmoeting tot stand is gebracht.\nIndien een Target reeds bij Opdrachtgever bekend is en in de zes (6) maanden voorafgaand aan de Introductie aantoonbaar contact heeft plaatsgevonden, dient Opdrachtgever dit binnen vijf (5) werkdagen na Introductie schriftelijk en met bewijsstukken aan Bisschops Financing te melden.\nBij gebreke van een tijdige en volledige melding wordt de Target onweerlegbaar geacht door Bisschops Financing te zijn geïntroduceerd.\nArtikel 3 – Voorfasevergoeding en start van het traject\nEen voorfasevergoeding wordt uitsluitend verschuldigd indien:\neen eerste inhoudelijke kennismaking tussen Opdrachtgever en een door Bisschops Financing geïntroduceerde Target heeft plaatsgevonden; en\nnaar het oordeel van Bisschops Financing sprake is van wederzijdse intentie om het traject voort te zetten.\nVan wederzijdse intentie is in ieder geval sprake indien:\naanvullende informatie wordt uitgewisseld;\nvervolggesprekken worden gepland of gevoerd;\ndue diligence wordt voorbereid of gestart;\nwaardering, structuur of voorwaarden worden besproken;\nanderszins blijkt dat partijen het traject wensen voort te zetten.\nDe vaststelling van wederzijdse intentie wordt door Bisschops Financing na schriftelijk akkoord van Opdrachtgever, waaronder per e-mail, bevestigd.\nVanaf het moment van deze bevestiging:\nwordt de voorfasevergoeding verschuldigd;\ngeldt volledige bescherming van succesfee, nawerking en anti-omzeiling.\nPartijen kiezen vooraf één van de volgende vergoedingsstructuren:\n[ ] Optie A – Vaste startvergoeding: Een eenmalige, niet-verrekenbare vergoeding van € 10.000 exclusief btw.\n[ ] Optie B – Regiebasis: Vergoeding op basis van bestede tijd en kosten conform de Algemene Voorwaarden.\nIndien geen wederzijdse intentie ontstaat, is geen voorfasevergoeding verschuldigd.\nArtikel 4 – Communicatie en exclusieve betrokkenheid\nVanaf het moment waarop wederzijdse intentie is vastgesteld, verloopt alle communicatie met de Target uitsluitend via Bisschops Financing, tenzij Partijen schriftelijk anders overeenkomen.\nOpdrachtgever zal geen rechtstreekse onderhandelingen voeren zonder betrokkenheid van Bisschops Financing.\nArtikel 5 – Succesfee\nBij het tot stand komen van een Transactie is Opdrachtgever aan Bisschops Financing een succesfee verschuldigd, berekend over de volledige Transactiewaarde volgens onderstaande staffel:\n5% over de eerste € 1.000.000;\n4% over de volgende € 1.000.000;\n3% over het deel van € 2.000.000 tot € 5.000.000;\n2% over het meerdere boven € 5.000.000.\nDe succesfee bedraagt minimaal € 25.000 exclusief btw.\nEarn-out en uitgestelde componenten\nDe succesfee wordt berekend over de maximaal overeengekomen Transactiewaarde, inclusief:\nearn-out-regelingen;\nvendor loans;\nuitgestelde betalingen;\neconomisch gelijkwaardige vergoedingen.\nDe succesfee vormt een onvoorwaardelijke betalingsverplichting van Opdrachtgever.\nBetaling geschiedt overeenkomstig de betalingsmomenten van de Transactie, tenzij schriftelijk anders overeengekomen.\nArtikel 6 – Beëindiging vóór closing\nIndien de overeenkomst eindigt zonder closing, is Opdrachtgever aan Bisschops Financing verschuldigd:\nvergoeding van bestede uren conform de Algemene Voorwaarden;\nmet een minimum van € 5.000 exclusief btw.\nEen eventueel verschuldigde startvergoeding (zoals bedoeld in Artikel 3) blijft volledig verschuldigd.\nArtikel 7 – Due diligence en verantwoordelijkheid\nOpdrachtgever blijft volledig verantwoordelijk voor:\neigen onderzoek;\nbeoordeling van risico’s;\nbesluitvorming;\ninschakeling van adviseurs.\nBisschops Financing aanvaardt geen aansprakelijkheid voor onjuistheden in door derden verstrekte informatie.\nArtikel 8 – Geheimhouding\nOpdrachtgever behandelt alle ontvangen informatie strikt vertrouwelijk.\nInformatie wordt uitsluitend gebruikt voor het doel van de mogelijke Transactie.\nArtikel 9 – Toepasselijkheid Algemene Voorwaarden\nOp deze overeenkomst zijn de Algemene Voorwaarden van Bisschops Financing B.V. integraal van toepassing.\nBij strijdigheid prevaleren de bepalingen uit de Algemene Voorwaarden.\nArtikel 10 – Rechtskeuze en forum\nOp deze overeenkomst is Nederlands recht van toepassing.\nGeschillen worden exclusief voorgelegd aan de Rechtbank Oost-Brabant.\nArtikel 11 – Slotbepalingen\nWijzigingen zijn slechts geldig indien schriftelijk overeengekomen.\nIndien een bepaling nietig blijkt, blijven overige bepalingen onverminderd van kracht.\nOndertekening\nPlaats: ____________________ Datum: ____________________\nOpdrachtgever\nNaam: ____________________\nHandtekening: ____________________\nBisschops Financing B.V.\nNaam: ____________________\nHandtekening: ____________________\nALGEMENE VOORWAARDEN\nBisschops Financing B.V.\nArtikel 1 – Toepasselijkheid\nDeze Algemene Voorwaarden zijn van toepassing op alle aanbiedingen, offertes, opdrachten, overeenkomsten en werkzaamheden van Bisschops Financing B.V. (hierna: Bisschops Financing).\nDeze voorwaarden gelden mede ten behoeve van alle aan Bisschops Financing verbonden personen en rechtspersonen, waaronder bestuurders, aandeelhouders, werknemers, adviseurs en ingeschakelde derden.\nAfwijkingen van deze voorwaarden zijn slechts geldig indien schriftelijk overeengekomen.\nDe toepasselijkheid van algemene voorwaarden van de wederpartij wordt uitdrukkelijk uitgesloten.\nArtikel 2 – Definities\nOpdrachtgever: De natuurlijke persoon of rechtspersoon die een overeenkomst aangaat met Bisschops Financing, alsmede iedere rechtspersoon of persoon namens wie wordt gehandeld of die economisch met de opdracht is verbonden.\nGelieerde Entiteit: Iedere rechtspersoon of natuurlijke persoon die direct of indirect organisatorisch, juridisch, financieel of economisch is verbonden aan Opdrachtgever, waaronder groepsmaatschappijen, deelnemingen, holdings en bestuurdersvennootschappen.\nIntroductie: Het moment waarop Bisschops Financing identificerende gegevens van een potentiële koper, verkoper, investeerder, target of andere transactiedeelnemer verstrekt, dan wel een ontmoeting of contact tot stand brengt.\nTransactie: Iedere juridische of economische overdracht, participatie, samenwerking of gelijkwaardige constructie, waaronder begrepen maar niet beperkt tot:\naandelenoverdracht;\nactiva-passiva-transacties;\noverdracht van activiteiten, personeel, contracten of goodwill;\nfusies, splitsingen of joint ventures;\nparticipaties of financieringsstructuren;\niedere andere constructie die economisch gelijkstaat aan verkoop, investering of toetreding.\nTransactiewaarde: De totale economische waarde van de Transactie, waaronder mede begrepen:\nvaste koopsom;\nearn-outregelingen gewaardeerd tegen de maximaal overeengekomen waarde;\nuitgestelde betalingen en vendor loans;\novergenomen schulden of verplichtingen;\nmanagement-, consultancy-, huur- of leasevergoedingen en overige waardeoverdrachten;\nieder ander economisch voordeel samenhangend met de Transactie, ongeacht juridische vorm of betalingsmoment.\nArtikel 3 – Aard van de dienstverlening\nBisschops Financing verricht haar werkzaamheden naar beste inzicht en vermogen.\nOp alle werkzaamheden rust uitsluitend een inspanningsverplichting en nadrukkelijk geen resultaatsverplichting.\nBisschops Financing treedt niet op als accountant, fiscalist, advocaat, notaris of Register Valuator en verstrekt geen assurance-, waarderings- of certificeringsverklaringen.\nOpdrachtgever blijft volledig verantwoordelijk voor:\nhet uitvoeren van due diligence;\nhet inwinnen van juridisch, fiscaal en financieel advies;\nde uiteindelijke besluitvorming omtrent een Transactie.\nArtikel 4 – Vergoedingen en betaling\nTenzij schriftelijk anders overeengekomen gelden de volgende tarieven:\nuurtarief: € 250 exclusief btw;\nreiskosten: € 0,35 per kilometer;\nreistijd: 50% van het geldende uurtarief.\nFacturen dienen te worden voldaan binnen veertien (14) dagen na factuurdatum.\nBij niet-tijdige betaling is Opdrachtgever van rechtswege in verzuim en is verschuldigd:\nwettelijke handelsrente;\nbuitengerechtelijke incassokosten conform de wet.\nBetalingen strekken eerst in mindering op kosten en rente en vervolgens op de hoofdsom.\nArtikel 5 – Succesfee en nawerking\nIndien een Transactie tot stand komt met een door Bisschops Financing geïntroduceerde of betrokken partij, is Opdrachtgever de overeengekomen succesfee verschuldigd.\nDit recht blijft bestaan gedurende vierentwintig (24) maanden na:\nde Introductie; of\nbeëindiging van de overeenkomst.\nIndien na ondertekening van een intentieverklaring, term sheet of vergelijkbaar document geen Transactie tot stand komt als rechtstreeks gevolg van:\neen aan Opdrachtgever toerekenbare tekortkoming;\nhet afbreken van onderhandelingen in strijd met redelijkheid en billijkheid;\nhet omzeilen van Bisschops Financing;\nis Opdrachtgever aan Bisschops Financing een vergoeding verschuldigd gelijk aan 50% van de overeengekomen succesfee, onverminderd het recht op aanvullende schadevergoeding indien de werkelijke schade hoger is.\nArtikel 6 – Anti-omzeiling\nIndien een Transactie direct of indirect wordt gerealiseerd via:\neen Gelieerde Entiteit;\neen alternatieve juridische structuur;\neen economisch gelijkwaardige constructie;\nblijft de volledige succesfee verschuldigd.\nDaarnaast verbeurt Opdrachtgever een direct opeisbare boete van € 25.000, onverminderd het recht op volledige schadevergoeding.\nDe boete is cumulatief en treedt niet in de plaats van schadevergoeding.\nArtikel 7 – Aansprakelijkheid\nIedere aansprakelijkheid van Bisschops Financing is, behoudens in geval van opzet of bewuste roekeloosheid van de leiding, uitgesloten.\nIndien en voor zover ondanks het voorgaande aansprakelijkheid wordt aangenomen, is deze beperkt tot uitsluitend directe schade.\nAansprakelijkheid voor indirecte schade is uitdrukkelijk uitgesloten, waaronder begrepen:\ngevolgschade;\ngederfde winst;\ngemiste besparingen;\nreputatieschade;\nschade door bedrijfsstagnatie.\nIedere aanspraak op schadevergoeding vervalt indien deze niet binnen twaalf (12) maanden na ontdekking schriftelijk bij Bisschops Financing is gemeld.\nArtikel 8 – Geheimhouding\nPartijen verplichten zich tot strikte geheimhouding van alle vertrouwelijke informatie die zij in het kader van de opdracht verkrijgen.\nVertrouwelijke informatie wordt uitsluitend gebruikt voor het doel waarvoor deze is verstrekt.\nDeze verplichting blijft van kracht na beëindiging van de overeenkomst.\nArtikel 9 – Rechtskeuze en forum\nOp alle rechtsverhoudingen tussen Opdrachtgever en Bisschops Financing is uitsluitend Nederlands recht van toepassing.\nGeschillen worden exclusief voorgelegd aan de Rechtbank Oost-Brabant.';

    +'<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">&#128206; Bijlagen</span>'
    +'<label class="btn-ghost" style="font-size:11px;padding:3px 10px;cursor:pointer">&#43; Voeg toe<input type="file" id="gs-bijlage-input" multiple accept=".pdf,.docx,.doc,.txt,.eml,.msg,.html,.png,.jpg,.jpeg" style="display:none"></label>'
    +'</div>'
    +'<div id="gs-bijlagen-lijst" style="font-size:12px;color:var(--muted);font-style:italic">Geen bijlagen</div>'
    +'</div>'

    +'<div class="field" style="margin-bottom:0"><label>Verslag (vul in of genereer met AI)</label>'
    +'<textarea id="gs-verslag" rows="6" placeholder="Hier komt het gestructureerde verslag." style="font-size:12px;line-height:1.7;font-family:IBM Plex Mono,monospace">'+esc(g.verslag||'')+'</textarea></div>'
    +'<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">'
    +'<button class="btn-ghost" id="gs-ai-btn" style="font-size:12px;padding:6px 14px;color:var(--teal);border-color:var(--teal)">&#9881; AI-verslag genereren</button>'
    +'<span id="gs-ai-status" style="font-size:12px;color:var(--muted);align-self:center"></span>'
    +'</div>'
    +'<div id="gs-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.5rem"></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +'<button class="btn-ghost" id="gs-ann">Annuleren</button>'
    +'<button class="btn" id="gs-ok">Opslaan</button>'
    +'</div>';

  ov2.appendChild(mo2);document.body.appendChild(ov2);
  ov2.addEventListener('click',function(e){if(e.target===ov2)document.body.removeChild(ov2);});
  document.getElementById('gs-ann').addEventListener('click',function(){document.body.removeChild(ov2);});

  // ── OPNAME (Web Speech API) ──────────────────────────────────
  var recognition=null;
  var recActief=false;
  var recBtn=document.getElementById('gs-rec-btn');
  var recStatus=document.getElementById('gs-rec-status');
  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    recBtn.title='Spraakherkenning niet beschikbaar in deze browser (gebruik Chrome)';
    recBtn.style.opacity='0.4';recBtn.disabled=true;
    recStatus.textContent='Chrome vereist';
  } else {
    recBtn.addEventListener('click',function(){
      if(!recActief){
        recognition=new SpeechRecognition();
        recognition.lang='nl-NL';
        recognition.continuous=true;
        recognition.interimResults=true;
        var notitiesEl=document.getElementById('gs-notities');
        var baseText=notitiesEl.value;
        var interim='';
        recognition.onresult=function(evt){
          interim='';
          var final='';
          for(var i=evt.resultIndex;i<evt.results.length;i++){
            if(evt.results[i].isFinal)final+=evt.results[i][0].transcript+' ';
            else interim+=evt.results[i][0].transcript;
          }
          if(final){baseText+=(baseText&&!baseText.endsWith(' ')?'\n':'')+final;notitiesEl.value=baseText+interim;}
          else{notitiesEl.value=baseText+interim;}
        };
        recognition.onerror=function(e){recStatus.textContent='Fout: '+e.error;stopRec();};
        recognition.onend=function(){if(recActief)recognition.start();};
        recognition.start();
        recActief=true;
        recBtn.textContent='⏹ Stop';recBtn.style.color='var(--red)';recBtn.style.borderColor='var(--red)';
        recStatus.innerHTML='<span style="color:var(--red)">● Aan het opnemen...</span>';
      } else {
        stopRec();
      }
    });
  }

  function stopRec(){
    if(recognition){recognition.onend=null;recognition.stop();recognition=null;}
    recActief=false;
    recBtn.textContent='&#127908; Opnemen';recBtn.style.color='var(--teal)';recBtn.style.borderColor='var(--teal)';
    recStatus.textContent='Opname gestopt';
  }

  // ── BIJLAGEN ────────────────────────────────────────────────
  function renderBijlagen(){
    var el=document.getElementById('gs-bijlagen-lijst');
    if(!el)return;
    if(!bijlagenLijst.length){el.innerHTML='<span style="color:var(--muted);font-style:italic">Geen bijlagen</span>';return;}
    el.innerHTML=bijlagenLijst.map(function(b){
      var size=b.grootte?(b.grootte/1024).toFixed(0)+'KB':'';
      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">'
        +'<span style="font-size:18px">'+(b.type&&b.type.includes('pdf')?'📄':b.type&&b.type.includes('word')?'📝':'📎')+'</span>'
        +'<span style="font-size:12px;flex:1;color:var(--sub)">'+esc(b.naam)+'</span>'
        +'<span style="font-size:10px;color:var(--muted)">'+size+'</span>'
        +(b.tekst?'<span style="font-size:10px;background:var(--teal-bg);color:var(--teal);padding:1px 6px;border-radius:3px">AI kan lezen</span>':'')
        +(b.uploading?'<span style="font-size:10px;color:var(--muted)">Uploaden...</span>'
          :'<button class="btn-ghost bijlage-del" data-id="'+b.id+'" style="font-size:10px;padding:1px 6px;color:var(--red);border-color:var(--red)">✕</button>')
        +'</div>';
    }).join('');
    el.querySelectorAll('.bijlage-del').forEach(function(btn){
      btn.addEventListener('click',async function(){
        var bid=btn.dataset.id;
        if(gesprekId){await fetch(WORKER+'/mna/admin/gesprek/bijlage/delete/'+bid+'?key='+encodeURIComponent(adminKey),{method:'POST'}).catch(function(){});}
        bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==bid;});
        renderBijlagen();
      });
    });
  }

  // Laad bestaande bijlagen als bewerken
  if(gesprekId){
    fetch(WORKER+'/mna/admin/gesprek/bijlagen/'+gesprekId+'?key='+encodeURIComponent(adminKey))
      .then(function(r){return r.json();})
      .then(function(d){
        bijlagenLijst=(d.bijlagen||[]).map(function(b){return{id:b.id,naam:b.bestand_naam,type:b.bestand_type,grootte:b.bestand_grootte,tekst:b.tekst};});
        renderBijlagen();
      }).catch(function(){});
  }

  document.getElementById('gs-bijlage-input').addEventListener('change',async function(){
    var files=Array.from(this.files);
    if(!files.length)return;
    // Sla gesprek eerst op als het nieuw is zodat we een ID hebben
    if(!gesprekId){
      var datum=document.getElementById('gs-datum').value;
      if(!datum){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Sla het gesprek eerst op (datum vereist) voor je bijlagen toevoegt.';return;}
      var payload={datum:datum,deelnemers:document.getElementById('gs-deelnemers').value.trim(),type:document.getElementById('gs-type').value,ruwe_notities:document.getElementById('gs-notities').value.trim(),verslag:document.getElementById('gs-verslag').value.trim()};
      var r=await fetch(WORKER+'/mna/admin/gesprekken/'+trajectId,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(payload)});
      var d=await r.json();
      if(!d.ok){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Kon gesprek niet opslaan: '+(d.error||'onbekend');return;}
      gesprekId=d.id;
      bestaand={id:gesprekId};
    }
    for(var i=0;i<files.length;i++){
      var file=files[i];
      var tmpId='tmp_'+Date.now()+'_'+i;
      bijlagenLijst.push({id:tmpId,naam:file.name,type:file.type,grootte:file.size,uploading:true});
      renderBijlagen();
      var fd=new FormData();fd.append('file',file);
      try{
        var resp=await fetch(WORKER+'/mna/admin/gesprek/bijlage/'+gesprekId+'?key='+encodeURIComponent(adminKey),{method:'POST',body:fd});
        var bd=await resp.json();
        bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==tmpId;});
        if(bd.ok){bijlagenLijst.push({id:bd.id,naam:bd.naam||file.name,type:file.type,grootte:file.size,tekst:bd.tekst_beschikbaar?'ja':''});}
      }catch(e){bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==tmpId;});}
      renderBijlagen();
    }
    this.value='';
  });

  // ── AI VERSLAG ────────────────────────────────────────────
  document.getElementById('gs-ai-btn').addEventListener('click',async function(){
    var notities=(document.getElementById('gs-notities').value||'').trim();
    var bijlagenTekst=bijlagenLijst.filter(function(b){return b.tekst;}).map(function(b){return '--- '+b.naam+' ---\n'+b.tekst;}).join('\n\n');
    if(!notities&&!bijlagenTekst){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Voer notities in of voeg een bijlage toe.';return;}
    document.getElementById('gs-err').style.display='none';
    var st=document.getElementById('gs-ai-status');st.textContent='Verslag wordt gegenereerd...';
    var btn2=this;btn2.disabled=true;
    var deelnemers=(document.getElementById('gs-deelnemers').value||'').trim();
    var datum=(document.getElementById('gs-datum').value||'');
    var type=(document.getElementById('gs-type').value||'gesprek');
    var typeLabels={gesprek:'Gesprek',kennismaking:'Kennismaking',onderhandeling:'Onderhandeling',vergadering:'Vergadering',telefonisch:'Telefonisch overleg',email:'E-mailwisseling',andere:'Overig'};
    var prompt='Maak een professioneel gespreksverslag van een M&A traject.'
      +'\n\nGesprek: '+(typeLabels[type]||type)+' | Datum: '+(datum||'onbekend')+' | Deelnemers: '+(deelnemers||'onbekend')
      +(notities?'\n\nNOTITIES:\n'+notities:'')
      +(bijlagenTekst?'\n\nBIJLAGEN:\n'+bijlagenTekst:'')
      +'\n\nGeef het verslag terug in dit formaat:\n\n## Samenvatting\n[2-3 zinnen]\n\n## Besproken punten\n[per punt]\n\n## Beslissingen & afspraken\n[concreet]\n\n## Actiepunten\n[wie, wat, wanneer]\n\n## Volgende stap\n[gepland]\n\nProfessioneel, derde persoon, bondig.';
    try{
      var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})});
      var rd=await resp.json();
      document.getElementById('gs-verslag').value=rd.text||rd.content||'';
      st.textContent='✓ Verslag gegenereerd';
    }catch(err){st.textContent='Fout bij genereren';}
    btn2.disabled=false;
  });

  // ── OPSLAAN ───────────────────────────────────────────────
  document.getElementById('gs-ok').addEventListener('click',async function(){
    if(recActief)stopRec();
    var err=document.getElementById('gs-err');err.style.display='none';
    var datum=document.getElementById('gs-datum').value;
    if(!datum){err.style.display='block';err.textContent='Datum is verplicht.';return;}
    var btn3=this;btn3.disabled=true;btn3.textContent='Opslaan...';
    try{
      var payload={datum:datum,deelnemers:document.getElementById('gs-deelnemers').value.trim(),type:document.getElementById('gs-type').value,ruwe_notities:document.getElementById('gs-notities').value.trim(),verslag:document.getElementById('gs-verslag').value.trim()};
      if(gesprekId)payload.id=gesprekId;
      var r=await fetch(WORKER+'/mna/admin/gesprekken/'+trajectId,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(payload)});
      var d=await r.json();
      if(d.ok){document.body.removeChild(ov2);if(onSaved)onSaved();}
      else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn3.disabled=false;btn3.textContent='Opslaan';}
    }catch(e2){err.style.display='block';err.textContent='Verbindingsfout.';btn3.disabled=false;btn3.textContent='Opslaan';}
  });
}

function slaOp(t){
  var regels=['KantoorInzicht - M&A Traject','','Kantoor: '+(t.kantoor_naam||'-'),'Type: '+(t.traject_type||'-'),'Status: '+(t.status||'actief'),'Aangemaakt: '+formatDate(t.created_at),'','CODES','Verkoperscode: '+t.id,'Koperscode: '+(t.koper_code||'-'),'Tussenpersoonscode: '+(t.tussen_code||'-'),'','Toegang via: https://koersvoormorgen.nl/mna.html'];
  var inhoud=regels.join('\n');
  var blob=new Blob([inhoud],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='traject-'+t.id+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function vergrendel(id,naam){
  if(!confirm('Traject '+naam+' vergrendelen?'))return;
  try{
    var r=await fetch(WORKER+'/mna/admin/vergrendel/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST'});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='vergrendeld';renderTab();}
    else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

async function ontvergrendel(id){
  try{
    var r=await fetch(WORKER+'/mna/admin/status/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'actief'})});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='actief';renderTab();}
    else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

async function maakTrajectVanScan(scanId, naam, email){
  if(!confirm('M&A traject aanmaken voor '+naam+'?'))return;
  try{
    var r=await fetch(WORKER+'/mna/scan-to-traject?key='+encodeURIComponent(adminKey),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scan_id:scanId,kantoor_naam:naam,contact_email:email,traject_type:'Verkoop'})
    });
    var d=await r.json();
    if(d.ok){
      mnaList.unshift({id:d.code,kantoor_naam:naam,traject_type:'Verkoop',koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});
      toast('Traject aangemaakt! Verkoperscode: '+d.code,' ok');
      activeTab='mna';renderDashboard();
    } else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

// WIS TRAJECT DATA — data wissen zonder traject te verwijderen
function wisTrajectData(id, naam) {
  var ov = document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  var mo = document.createElement('div'); mo.className = 'modal'; mo.style.maxWidth = '480px';
  mo.innerHTML = '<div class="modal-title">&#129529; Data wissen — ' + esc(naam) + '</div>'
    + '<p style="font-size:13px;color:var(--mid);line-height:1.65;margin-bottom:1.25rem">Kies welke data gewist moet worden. Het traject zelf en de toegangscodes blijven bewaard.</p>'
    + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem">'
    + '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer">'
    + '<input type="checkbox" id="wis-dd" checked style="width:15px;height:15px;cursor:pointer">'
    + '<div><div style="font-size:13px;font-weight:600;color:var(--sub)">DD-velden (alle 7 fases)</div>'
    + '<div style="font-size:11px;color:var(--muted)">Alle ingevulde formuliervelden worden leeggemaakt. Voortgang wordt 0%.</div></div></label>'
    + '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer">'
    + '<input type="checkbox" id="wis-chk" checked style="width:15px;height:15px;cursor:pointer">'
    + '<div><div style="font-size:13px;font-weight:600;color:var(--sub)">Checklist-statussen</div>'
    + '<div style="font-size:11px;color:var(--muted)">Alle vinkjes in de checklists worden gereset.</div></div></label>'
    + '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer">'
    + '<input type="checkbox" id="wis-docs" style="width:15px;height:15px;cursor:pointer">'
    + '<div><div style="font-size:13px;font-weight:600;color:var(--sub)">Geüploade documenten</div>'
    + '<div style="font-size:11px;color:var(--muted)">Alle bestanden in de dataroom worden permanent verwijderd.</div></div></label>'
    + '</div>'
    + '<div id="wis-progress" style="display:none;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--teal);margin-bottom:.75rem"></div>'
    + '<div id="wis-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.75rem"></div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button class="btn-ghost" id="wis-ann">Annuleren</button>'
    + '<button class="btn" id="wis-ok" style="background:var(--red);border:none">&#129529; Wissen</button>'
    + '</div>';
  ov.appendChild(mo); document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('wis-ann').addEventListener('click', function() { document.body.removeChild(ov); });
  document.getElementById('wis-ok').addEventListener('click', async function() {
    var wisDD = document.getElementById('wis-dd').checked;
    var wisChk = document.getElementById('wis-chk').checked;
    var wisDocs = document.getElementById('wis-docs').checked;
    if (!wisDD && !wisChk && !wisDocs) {
      document.getElementById('wis-err').style.display = 'block';
      document.getElementById('wis-err').textContent = 'Selecteer minimaal één optie.';
      return;
    }
    var confirmMsg = 'Data van traject ' + naam + ' wissen:\n';
    if (wisDD) confirmMsg += '✓ DD-velden (alle fases)\n';
    if (wisChk) confirmMsg += '✓ Checklist-statussen\n';
    if (wisDocs) confirmMsg += '✓ Geüploade documenten\n';
    confirmMsg += '\nDit kan NIET ongedaan worden gemaakt. Doorgaan?';
    if (!confirm(confirmMsg)) return;
    var btn = this; btn.disabled = true; btn.textContent = 'Bezig...';
    var prog = document.getElementById('wis-progress'); prog.style.display = 'block';
    var stappen = []; var ok = true;
    // Stap 1: DD-velden + checklist wissen
    if (wisDD || wisChk) {
      prog.textContent = '⏳ DD-data wissen...';
      try {
        var r = await fetch(WORKER + '/mna/admin/wis-data/' + id + '?key=' + encodeURIComponent(adminKey), { method: 'POST' });
        var d = await r.json();
        if (d.ok) {
          stappen.push('✓ DD-data gewist via worker');
        } else {
          // Fallback: fase voor fase leegmaken
          var fases = ['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];
          var gedaan = 0;
          for (var i = 0; i < fases.length; i++) {
            try {
              await fetch(WORKER + '/mna/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: id, fase_id: fases[i], data_json: {}, checklist_json: {}, notitie: '' }) });
              gedaan++;
            } catch(e2) {}
          }
          stappen.push('✓ DD-data gewist via ' + gedaan + '/7 fases');
        }
      } catch(e) { stappen.push('✕ DD-data fout: ' + esc(e.message)); ok = false; }
    }
    // Stap 2: Documenten verwijderen
    if (wisDocs) {
      prog.textContent = '⏳ Documenten verwijderen...';
      try {
        var rd = await fetch(WORKER + '/mna/admin/documenten?key=' + encodeURIComponent(adminKey));
        var docs = await rd.json();
        var trajectDocs = docs.filter(function(doc) { return doc.traject_id === id && !doc.vergrendeld; });
        var verw = 0;
        for (var j = 0; j < trajectDocs.length; j++) {
          try {
            var dr = await fetch(WORKER + '/mna/document/delete/' + trajectDocs[j].id + '?key=' + encodeURIComponent(adminKey), { method: 'POST' });
            if (dr.ok) verw++;
          } catch(e3) {}
        }
        stappen.push('✓ ' + verw + '/' + trajectDocs.length + ' documenten verwijderd');
      } catch(e) { stappen.push('✕ Documenten fout: ' + esc(e.message)); ok = false; }
    }
    prog.innerHTML = stappen.join('<br>') + '<br><br>' + (ok ? '<strong style="color:var(--teal)">✓ Klaar!</strong>' : '<strong style="color:var(--gold)">⚠ Voltooid met fouten</strong>');
    btn.textContent = 'Sluiten';
    btn.style.background = 'var(--teal)';
    btn.onclick = function() { document.body.removeChild(ov); refreshData(); };
    document.getElementById('wis-ann').textContent = 'Sluiten';
    document.getElementById('wis-ann').onclick = function() { document.body.removeChild(ov); refreshData(); };
    toast((ok ? 'Data gewist voor traject ' : 'Data gedeeltelijk gewist voor traject ') + naam, ok ? 'ok' : 'warn');
  });
}

    partner: { label: 'III. Partners & personeel', velden: [
