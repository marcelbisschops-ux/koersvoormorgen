      {id:'omzetPerP',label:'Omzet per partner',req:true},{id:'pensioenP',label:'Pensioen <5 jaar',req:true},
      {id:'fte',label:'Totaal FTE',req:true},{id:'verloop',label:'Personeelsverloop (%)',req:true},
      {id:'vacatures',label:'Vacatures',req:false},{id:'raAa',label:'RA/AA in opleiding',req:false},
      {id:'opvolging',label:'Opvolgingskandidaat',req:true},{id:'verandering',label:'Veranderbereidheid',req:true},
      {id:'pContract',label:'Partnerovereenkomsten',req:true}
    ]},
    compliance: { label: 'IV. Compliance & kwaliteit', velden: [
      {id:'nba',label:'NBA-status',req:true},{id:'afm',label:'AFM-vergunning',req:true},
      {id:'toetsDatum',label:'Laatste toetsing (jaar)',req:true},{id:'toetsOordeel',label:'Oordeel toetsing',req:true},
      {id:'tuchtzaken',label:'Tuchtzaken',req:true},{id:'claims',label:'Civiele claims',req:true},
      {id:'wwft',label:'Wwft-status',req:true},{id:'incidenten',label:'Incidenten <5 jaar',req:true}
    ]},
    it: { label: 'V. IT & automatisering', velden: [
      {id:'software',label:'Primaire software',req:true},{id:'softwareOverig',label:'Overige systemen',req:false},
      {id:'autoGraad',label:'Automatiseringsgraad',req:true},{id:'ai',label:'AI-tooling',req:true},
      {id:'itKosten',label:'IT-kosten (%)',req:false},{id:'security',label:'Cybersecurity',req:false},
      {id:'itRisico',label:'IT-risicos',req:true}
    ]},
    juridisch: { label: 'VI. Juridisch & fiscaal', velden: [
      {id:'rechtsvorm',label:'Rechtsvorm',req:true},{id:'structuur',label:'Aandeelhoudersstructuur',req:true},
      {id:'huur',label:'Huurcontract looptijd',req:true},{id:'vpb',label:'VPB discussies',req:true},
      {id:'fiscaalRisico',label:'Fiscale risicos',req:true},{id:'stak',label:'STAK/bijzondere structuur',req:false},
      {id:'overigeClaims',label:'Claims/garanties',req:true},{id:'lease',label:'Leaseverplichtingen',req:false}
    ]},
    strategisch: { label: 'VII. Strategisch & markt', velden: [
      {id:'marktpos',label:'Marktpositie/regio',req:true},{id:'niche',label:'Niche/specialisme',req:true},
      {id:'concurrenten',label:'Concurrenten',req:false},{id:'aiImpact',label:'AI-impact',req:true},
      {id:'cultuurFit',label:'Cultuuromschrijving',req:true},{id:'synergie',label:'Gewenste vervolgstap',req:true},
      {id:'tijdlijn',label:'Tijdlijn',req:true}
    ]}
  };

  // Bouw bron-index: veld_key → bestandsnaam (welk doc vulde dit veld in)
  var bronIndex = {};
  (d.documenten || []).forEach(function(doc) {
    if (!doc.veld_extractie) return;
    try {
      var ve = typeof doc.veld_extractie === 'string' ? JSON.parse(doc.veld_extractie) : doc.veld_extractie;
      // De extractie-keys zijn de raw AI-keys (omzet, fte, etc.)
      // We slaan het document op als bron voor alle keys die het bevat
      Object.keys(ve || {}).forEach(function(k) {
        if (ve[k] !== null && ve[k] !== undefined && String(ve[k]).trim() !== '' && String(ve[k]) !== 'null') {
          if (!bronIndex[doc.fase_id + '::' + k]) bronIndex[doc.fase_id + '::' + k] = [];
          bronIndex[doc.fase_id + '::' + k].push(doc.bestand_naam);
        }
      });
    } catch(e) {}
  });

  // Bouw data-index: fase_id_veld_id → waarde
  var dataIndex = {};
  (d.data || []).forEach(function(row) {
    try {
      var dj = typeof row.data_json === 'string' ? JSON.parse(row.data_json) : row.data_json;
      Object.entries(dj || {}).forEach(function(entry) {
        var vId = entry[0]; var vData = entry[1];
        if (vData && vData.value) dataIndex[row.fase_id + '_' + vId] = vData.value;
      });
    } catch(e) {}
  });

  // Render modal
  var ov = document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  var mo = document.createElement('div'); mo.className = 'modal';
  mo.style.maxWidth = '900px';
  mo.style.fontFamily = 'IBM Plex Sans, sans-serif';

  var totaalVeld = 0, gevuldVeld = 0, leegReq = 0;
  var html = '<div class="modal-title">&#128269; Veldendebug — ' + esc(naam) + '</div>';

  // Samenvatting
  Object.keys(FASE_DEF).forEach(function(faseId) {
    FASE_DEF[faseId].velden.forEach(function(v) {
      totaalVeld++;
      if (dataIndex[faseId + '_' + v.id]) gevuldVeld++;
      else if (v.req) leegReq++;
    });
  });

  var pct = Math.round(gevuldVeld / totaalVeld * 100);
  var pctReq = totaalVeld > 0 ? Math.round((totaalVeld - leegReq) / totaalVeld * 100) : 0;

  html += '<div style="display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">'
    + '<div style="background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:8px 14px;font-size:12px">'
    + '<span style="color:var(--muted)">Gevuld:</span> <strong style="color:var(--teal)">' + gevuldVeld + '/' + totaalVeld + ' (' + pct + '%)</strong></div>'
    + '<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:8px 14px;font-size:12px">'
    + '<span style="color:var(--muted)">Leeg verplicht:</span> <strong style="color:var(--red)">' + leegReq + '</strong></div>'
    + '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;font-size:12px">'
    + '<span style="color:var(--muted)">Documenten geanalyseerd:</span> <strong>' + (d.documenten || []).length + '</strong></div>'
    + '</div>';

  // Legenda
  html += '<div style="display:flex;gap:16px;margin-bottom:1rem;font-size:11px">'
    + '<span style="color:var(--teal)">&#10003; Gevuld</span>'
    + '<span style="color:var(--red)">&#10005; Leeg verplicht</span>'
    + '<span style="color:var(--muted)">&#8212; Leeg optioneel</span>'
    + '</div>';

  // Per fase
  Object.keys(FASE_DEF).forEach(function(faseId) {
    var fase = FASE_DEF[faseId];
    var faseFilled = fase.velden.filter(function(v) { return !!dataIndex[faseId + '_' + v.id]; }).length;
    var faseReq = fase.velden.filter(function(v) { return v.req; }).length;
    var faseReqFilled = fase.velden.filter(function(v) { return v.req && !!dataIndex[faseId + '_' + v.id]; }).length;
    var fasePct = faseReq > 0 ? Math.round(faseReqFilled / faseReq * 100) : 100;
    var faseKleur = fasePct === 100 ? 'var(--teal)' : fasePct >= 50 ? 'var(--gold)' : 'var(--red)';

    // Documenten voor deze fase
    var faseDocs = (d.documenten || []).filter(function(doc) { return doc.fase_id === faseId; });

    html += '<div style="margin-bottom:1rem;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card)">'
      + '<span style="font-size:12px;font-weight:600;color:var(--head)">' + fase.label + '</span>'
      + '<div style="display:flex;gap:12px;align-items:center">'
      + (faseDocs.length ? '<span style="font-size:10px;color:var(--muted)">' + faseDocs.map(function(d) { return esc(d.bestand_naam); }).join(', ') + '</span>' : '<span style="font-size:10px;color:var(--red)">Geen documenten</span>')
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:11px;color:' + faseKleur + '">' + fasePct + '%</span>'
      + '</div></div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0">';

    fase.velden.forEach(function(v) {
      var key = faseId + '_' + v.id;
      var waarde = dataIndex[key];
      var gevuld = !!waarde;
      var bg = gevuld ? 'var(--teal-bg)' : v.req ? 'var(--red-bg)' : 'transparent';
      var icoon = gevuld ? '&#10003;' : v.req ? '&#10005;' : '&#8212;';
      var icoonKleur = gevuld ? 'var(--teal)' : v.req ? 'var(--red)' : 'var(--muted)';
      var labelKleur = gevuld ? 'var(--sub)' : v.req ? 'var(--red)' : 'var(--muted)';

      // Bron opzoeken
      var bronnen = bronIndex[faseId + '::' + v.id] || [];
      // Ook proberen met alternatieven (bijv. 'fte' voor 'partner_fte')
      if (!bronnen.length) {
        var altKeys = [v.id, v.id.replace(/([A-Z])/g, '_$1').toLowerCase()];
        altKeys.forEach(function(ak) {
          var b2 = bronIndex[faseId + '::' + ak];
          if (b2 && b2.length) bronnen = bronnen.concat(b2);
        });
      }
      var bronTekst = bronnen.length ? bronnen[bronnen.length-1] : (gevuld ? 'handmatig' : '');

      html += '<div style="padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:' + bg + '">'
        + '<div style="display:flex;align-items:flex-start;gap:6px">'
        + '<span style="color:' + icoonKleur + ';font-size:12px;flex-shrink:0;margin-top:1px">' + icoon + '</span>'
        + '<div style="min-width:0">'
        + '<div style="font-size:10px;color:' + labelKleur + ';font-weight:' + (v.req ? '600' : '400') + '">' + esc(v.label) + (v.req ? '' : ' <span style="opacity:.5;font-weight:400">(opt)</span>') + '</div>'
        + (gevuld ? '<div style="font-size:11px;font-family:IBM Plex Mono,monospace;color:var(--teal-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px" title="' + esc(waarde) + '">' + esc(String(waarde).length > 35 ? String(waarde).substring(0, 35) + '…' : waarde) + '</div>' : '')
        + (bronTekst ? '<div style="font-size:9px;color:var(--muted);margin-top:1px">&#128196; ' + esc(bronTekst) + '</div>' : '')
        + '</div></div></div>';
    });

    html += '</div></div>';
  });

  html += '<div style="display:flex;justify-content:flex-end;margin-top:1rem">'
    + '<button class="btn-ghost" id="debug-sluit">Sluiten</button></div>';

  mo.innerHTML = html;
  ov.appendChild(mo);
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('debug-sluit').addEventListener('click', function() { document.body.removeChild(ov); });
}

async function renderComplianceTab(el) {
  el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:2rem 0">Laden...</div>';

  // Haal alle VOK statussen op voor alle trajecten
  var vokData = {};
  try {
    var vokReqs = mnaList.map(function(t) {
      return fetch(WORKER + '/mna/vok/status?code=' + encodeURIComponent(t.tussen_code || ''))
        .then(function(r) { return r.json(); })
        .then(function(d) { vokData[t.tussen_code] = d; })
        .catch(function() { vokData[t.tussen_code] = { getekend: false }; });
    });
    await Promise.all(vokReqs);
  } catch(e) {}

  var getekend = mnaList.filter(function(t) { return vokData[t.tussen_code] && vokData[t.tussen_code].getekend; });
  var ongetekend = mnaList.filter(function(t) { return !vokData[t.tussen_code] || !vokData[t.tussen_code].getekend; });

  var html = '<div class="table-wrap">'
    + '<div class="table-hdr"><div class="table-title">&#128274; Verwerkersovereenkomsten (VOK) & AVG-compliance</div>'
    + '<div style="display:flex;gap:8px;align-items:center">'
    + '<span style="font-size:12px;padding:4px 12px;border-radius:12px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)">&#10003; '+getekend.length+' getekend</span>'
    + '<span style="font-size:12px;padding:4px 12px;border-radius:12px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)">&#9888; '+ongetekend.length+' ontbreekt</span>'
    + '<button id="vok-reset-btn" class="btn-red" style="font-size:11px;padding:4px 10px;margin-left:8px">&#128465; Reset VOK (test)</button>'
    + '</div></div>'
    + '<div style="padding:1.25rem">';

  // Samenvatting banner
  if (ongetekend.length > 0) {
    html += '<div style="background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--r);padding:.875rem 1rem;margin-bottom:1.25rem;font-size:13px;color:var(--mid);line-height:1.6">'
      + '<strong style="color:var(--gold)">&#9888; Actie vereist</strong> — '+ongetekend.length+' tussenpersoon'+(ongetekend.length!==1?'en hebben':'heeft')+' de verwerkersovereenkomst nog niet getekend. '
      + 'Zij zien de VOK-popup automatisch bij hun volgende login.'
      + '</div>';
  } else {
    html += '<div style="background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:.875rem 1rem;margin-bottom:1.25rem;font-size:13px;color:var(--teal-dim)">'
      + '&#10003; Alle tussenpersonen hebben de verwerkersovereenkomst getekend.'
      + '</div>';
  }

  // Tabel
  html += '<table style="width:100%;border-collapse:collapse">'
    + '<thead><tr>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Traject</th>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Tussenpersoonscode</th>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">VOK status</th>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Getekend door</th>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Datum</th>'
    + '<th style="text-align:left;padding:10px 12px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border)">Versie</th>'
    + '</tr></thead><tbody>';

  mnaList.forEach(function(t) {
    var vok = vokData[t.tussen_code] || { getekend: false };
    var datum = vok.datum ? new Date(vok.datum).toLocaleDateString('nl-NL', {day:'2-digit',month:'short',year:'numeric'}) : '—';
    var statusHtml = vok.getekend
      ? '<span style="font-size:11px;font-weight:600;color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-dark);padding:2px 8px;border-radius:3px">&#10003; Getekend</span>'
      : '<span style="font-size:11px;font-weight:600;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold);padding:2px 8px;border-radius:3px">&#9888; Ontbreekt</span>';

    html += '<tr style="border-bottom:1px solid var(--border)">'
      + '<td style="padding:10px 12px;font-weight:500;color:var(--head)">'+esc(t.kantoor_naam||t.id)+'</td>'
      + '<td style="padding:10px 12px;font-family:IBM Plex Mono,monospace;font-size:11px;color:var(--mid)">'+esc(t.tussen_code||'—')+'</td>'
      + '<td style="padding:10px 12px">'+statusHtml+'</td>'
      + '<td style="padding:10px 12px;font-size:12px;color:var(--mid)">'+esc(vok.naam||'—')+'</td>'
      + '<td style="padding:10px 12px;font-size:11px;color:var(--muted);font-family:IBM Plex Mono,monospace">'+datum+'</td>'

      + '</tr>';
  });

  html += '</tbody></table>';

  html += '</div></div>'

    + '<div class="table-hdr"><div class="table-title">&#9989; AVG-checklist platform</div></div>'
    + '<div style="padding:1.25rem;display:flex;flex-direction:column;gap:8px">';

  var checks = [
    { ok: true,  label: 'HTTPS versleuteling', detail: 'Alle verbindingen versleuteld via TLS' },
    { ok: true,  label: 'EU-dataopslag', detail: 'Cloudflare D1/R2 — Frankfurt, Duitsland' },
    { ok: true,  label: 'Toegangsbeveiliging', detail: 'Persoonlijke codes, sessiebeperking 8 uur, max 10 pogingen' },
    { ok: true,  label: 'Verwerkersovereenkomst template', detail: 'Versie 1.0 — mei 2026' },
    { ok: false, label: 'Privacy.html sub-verwerkers', detail: 'Anthropic en Signhost nog niet vermeld → TO DO' },
    { ok: true,  label: 'Audit log', detail: 'Logins en downloads worden geregistreerd per traject' },
    { ok: true,  label: 'Gegevensminimalisatie', detail: 'Anoniem traject aanmaken zonder persoonsgegevens mogelijk' },
    { ok: false, label: 'Verwijderingsproces gedocumenteerd', detail: 'Procedure voor verwijderingsverzoeken nog niet formeel → TO DO' },
  ];

  checks.forEach(function(check) {
    html += '<div style="display:flex;align-items:flex-start;gap:12px;padding:.6rem .875rem;background:var(--card);border-radius:var(--r);border-left:3px solid '+(check.ok?'var(--teal)':'var(--gold)')+'">'
      + '<span style="font-size:14px;flex-shrink:0;margin-top:1px">'+(check.ok?'✅':'⚠️')+'</span>'
      + '<div><div style="font-size:13px;font-weight:500;color:var(--sub)">'+check.label+'</div>'
      + '<div style="font-size:11px;color:var(--muted)">'+check.detail+'</div></div>'
      + '</div>';
  });

  html += '</div></div>';

  el.innerHTML = html;

  // VOK reset knop handler
  var vokResetBtn = document.getElementById('vok-reset-btn');
  if (vokResetBtn) {
    vokResetBtn.addEventListener('click', async function() {
      if (!confirm('Alle VOK-records verwijderen? Alleen doen in testomgeving.')) return;
      vokResetBtn.disabled = true; vokResetBtn.textContent = 'Bezig...';
      var fouten = 0;
      for (var i = 0; i < mnaList.length; i++) {
        var tCode = mnaList[i].tussen_code;
        if (!tCode || tCode === '—') continue;
        try {
          await fetch(WORKER + '/mna/vok/reset?code=' + encodeURIComponent(tCode) + '&key=' + encodeURIComponent(adminKey), { method: 'POST' });
        } catch(e) { fouten++; }
      }
      toast(fouten === 0 ? '&#10003; VOK records gewist' : '⚠ ' + fouten + ' fouten', fouten === 0 ? 'ok' : 'warn');
      renderComplianceTab(el);
    });
  }
}

          + '<td style="padding:10px 12px;color:var(--mid)">' + esc(g.bedrijf||'—') + '</td>'
          + '<td style="padding:10px 12px;color:var(--mid);font-family:IBM Plex Mono,monospace;font-size:11px">' + esc(g.email) + '</td>'
          + '<td style="padding:10px 12px"><span style="font-size:11px;font-weight:600;color:'+statusKleur+'">' + statusLabel + '</span></td>'
          + '<td style="padding:10px 12px;font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--teal)">' + (g.traject_count||0) + '</td>'
          + '<td style="padding:10px 12px;font-size:11px;color:var(--muted)">' + llDatum + '</td>'
          + '<td style="padding:10px 12px;display:flex;gap:6px">'
          + (g.status==='uitgenodigd'?'<button class="btn-ghost btn-resend" data-id="'+esc(g.id)+'" data-email="'+esc(g.email)+'" data-naam="'+esc(g.naam)+'" style="font-size:10px;padding:3px 8px">&#9993; Opnieuw sturen</button>':'')
          + '<button class="btn-ghost btn-reset" data-id="'+esc(g.id)+'" data-email="'+esc(g.email)+'" style="font-size:10px;padding:3px 8px">Reset ww</button>'
          + (g.status==='inactief'
              ?'<button class="btn-ghost btn-act" data-id="'+esc(g.id)+'" style="font-size:10px;padding:3px 8px;color:var(--teal)">Activeren</button>'
              :'<button class="btn-ghost btn-deact" data-id="'+esc(g.id)+'" style="font-size:10px;padding:3px 8px;color:var(--red)">Deactiveren</button>')
          + '<button class="btn-ghost btn-del-user" data-id="'+esc(g.id)+'" data-naam="'+esc(g.naam)+'" style="font-size:10px;padding:3px 8px;color:var(--red);border-color:var(--red)">✕</button>'
          + '</td>'
          + '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;

    // Uitnodigen knop
    var uitnBtn = document.getElementById('btn-uitnodigen');
    if (uitnBtn) uitnBtn.addEventListener('click', function() { toonUitnodigenModal(); });

    // Deactiveren knoppen
    el.querySelectorAll('.btn-act').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker activeren?')) return;
        var drBody=new URLSearchParams();drBody.append('key',adminKey);
        var dr = await fetch(WORKER + '/gebruikers/activeer/' + btn.dataset.id, {method:'POST',body:drBody});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker geactiveerd.', 'ok'); var tc2=document.querySelector('.tab-content'); if(tc2)renderGebruikersTab(tc2); }
        else toast(dd.error || 'Fout bij activeren.', 'err');
      });
    });
    el.querySelectorAll('.btn-reset').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var nieuwWw = prompt('Nieuw wachtwoord voor ' + btn.dataset.email + ':');
        if (!nieuwWw || nieuwWw.length < 8) { toast('Wachtwoord minimaal 8 tekens.', 'err'); return; }
        var dr = await fetch(WORKER + '/gebruikers/reset-ww/' + btn.dataset.id + '?key=' + encodeURIComponent(adminKey), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({wachtwoord:nieuwWw})});
        var dd = await dr.json();
        if (dd.ok) toast('Wachtwoord gereset voor ' + btn.dataset.email + '.', 'ok');
        else toast(dd.error || 'Fout bij resetten.', 'err');
      });
    });
    el.querySelectorAll('.btn-del-user').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker "'+btn.dataset.naam+'" definitief verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
        var drBody2=new URLSearchParams();drBody2.append('key',adminKey);
        var dr = await fetch(WORKER + '/gebruikers/verwijder/' + btn.dataset.id, {method:'POST',body:drBody2});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker verwijderd.', 'ok'); var tc3=document.querySelector('.tab-content'); if(tc3)renderGebruikersTab(tc3); }
        else toast(dd.error || 'Fout bij verwijderen.', 'err');
      });
    });
    el.querySelectorAll('.btn-deact').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker deactiveren? Ze kunnen dan niet meer inloggen.')) return;
        btn.disabled = true;
        var drBody3=new URLSearchParams();drBody3.append('key',adminKey);
        var dr = await fetch(WORKER + '/gebruikers/deactiveer/' + btn.dataset.id, {method:'POST',body:drBody3});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker gedeactiveerd.', 'ok'); var tc4=document.querySelector('.tab-content'); if(tc4)renderGebruikersTab(tc4); }
        else { toast('Fout: ' + (dd.error||'onbekend'), 'err'); btn.disabled = false; }
      });
    });

    // Opnieuw versturen knoppen
    el.querySelectorAll('.btn-resend').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        btn.disabled = true; btn.textContent = 'Versturen...';
        // Goede aanpak: opnieuw uitnodigen via deactiveer + nieuw uitnodigen
        var rr = await fetch(WORKER + '/gebruikers/uitnodigen?key=' + encodeURIComponent(adminKey), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({naam: btn.dataset.naam, email: btn.dataset.email, _resend: btn.dataset.id})
        });
        var rd = await rr.json();
        if (rd.ok) { toast('Uitnodiging opnieuw verstuurd.', 'ok'); }
        else { toast('Fout: ' + (rd.error||'onbekend'), 'err'); }
        btn.disabled = false; btn.textContent = '✉ Opnieuw sturen';
      });
    });
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout bij laden: ' + esc(e.message) + '</div>';
  }
}

function toonUitnodigenModal() {
  var ov = document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  var mo = document.createElement('div'); mo.className = 'modal'; mo.style.maxWidth = '480px';
  mo.innerHTML = '<div class="modal-title">&#9993; Adviseur uitnodigen</div>'
    + '<div style="font-size:13px;color:var(--mid);margin-bottom:1.25rem;line-height:1.7">De adviseur ontvangt een e-mail met een activatielink. Na activatie kan hij inloggen en eigen trajecten aanmaken.</div>'
    + '<div class="field"><label>Naam <span style="color:var(--red)">*</span></label><input type="text" id="inv-naam" placeholder="Voornaam achternaam"></div>'
    + '<div class="field"><label>Bedrijf</label><input type="text" id="inv-bedrijf" placeholder="Naam kantoor of bedrijf"></div>'
    + '<div class="field"><label>E-mailadres <span style="color:var(--red)">*</span></label><input type="email" id="inv-email" placeholder="adviseur@kantoor.nl"></div>'
    + '<div id="inv-err" style="color:var(--red);font-size:12px;margin-bottom:.75rem;display:none"></div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem">'
    + '<button class="btn-ghost" id="inv-ann">Annuleren</button>'
    + '<button class="btn" id="inv-ok" style="background:var(--teal)">&#9993; Uitnodiging versturen</button>'
    + '</div>';
  ov.appendChild(mo);
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('inv-ann').addEventListener('click', function() { document.body.removeChild(ov); });
  document.getElementById('inv-ok').addEventListener('click', async function() {
    var btn = this; btn.disabled = true; btn.textContent = 'Versturen...';
    var naam = document.getElementById('inv-naam').value.trim();
    var bedrijf = document.getElementById('inv-bedrijf').value.trim();
    var email = document.getElementById('inv-email').value.trim();
    var errDiv = document.getElementById('inv-err');
    errDiv.style.display = 'none';
    if (!naam || !email) { errDiv.textContent = 'Naam en e-mail zijn verplicht.'; errDiv.style.display = 'block'; btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen'; return; }
    try {
      var r = await fetch(WORKER + '/gebruikers/uitnodigen?key=' + encodeURIComponent(adminKey), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({naam, bedrijf, email})
      });
      var d = await r.json();
      if (d.ok) {
        document.body.removeChild(ov);
        toast('Uitnodiging verstuurd naar ' + email + '.', 'ok');
        // Refresh gebruikerslijst
        var tc = document.getElementById('tc');
        if (tc) renderGebruikersTab(tc);
      } else {
        errDiv.textContent = d.error || 'Fout bij versturen.';
        errDiv.style.display = 'block';
        btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen';
      }
    } catch(e) {
      errDiv.textContent = 'Verbindingsfout.';
      errDiv.style.display = 'block';
      btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen';
    }
  });
  document.getElementById('inv-naam').focus();
}

renderLogin();
