<!DOCTYPE html>
<html lang="nl">

<title>Koers voor Morgen — Beheer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#6b6862;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--gold-dark:#8a6d00;--red:#e05252;--red-bg:rgba(224,82,82,.1);--info:#2a5ea0;--info-bg:#eef3fa;--info-dim:#4a6ea0;--purple:#7c5cbf;--purple-bg:#f3f0ff;--purple-border:#c8b8f0;--r:6px;--r2:10px}
/* Nachtmodus: volgt de systeeminstelling van het apparaat, zoals in mna.html/adv.html. */
@media(prefers-color-scheme:dark){
  :root{--void:#1b1a17;--panel:#252320;--card:#2f2c27;--border:#3d3a34;--border2:#4d4940;--muted:#938f86;--mid:#b8b4aa;--sub:#e9e7e1;--head:#f6f4ef;--teal:#2fae87;--teal-dim:#3fc49a;--teal-dark:#8fe0c0;--teal-bg:rgba(47,174,135,.16);--gold:#e0c06a;--gold-bg:rgba(224,192,106,.14);--gold-dark:#f0d68c;--red:#e8746b;--red-bg:rgba(232,116,107,.14);--info:#6ea8e0;--info-bg:rgba(110,168,224,.14);--info-dim:#8fb8e8;--purple:#b39ce0;--purple-bg:rgba(179,156,224,.16);--purple-border:#8f74b8}
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1400px;margin:0 auto;padding:2rem}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid)}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red);font-family:'IBM Plex Sans',sans-serif;font-size:11px;padding:3px 10px;border-radius:var(--r);cursor:pointer}
.btn-red:hover{background:var(--red-bg)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.login-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--head);font-weight:600;margin-bottom:.4rem}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--teal)}
.tabs{display:flex;gap:4px;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tab{font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:2rem}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--teal);line-height:1;margin-bottom:.25rem}
.stat-lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:2rem}
.table-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;gap:.5rem}
.table-title{font-size:13px;font-weight:600;color:var(--head)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px;text-align:left;border-bottom:2px solid var(--border);background:var(--card);white-space:nowrap;position:relative;resize:horizontal;overflow:auto;min-width:60px}
th:after{content:'';position:absolute;right:0;top:25%;height:50%;width:3px;background:var(--border2);cursor:col-resize;opacity:0;transition:opacity .15s}
th:hover:after{opacity:1}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--mid);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(26,122,94,.04)}
.table-wrap{overflow-x:auto}
.score-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:2px 8px;border-radius:3px}
.score-high{background:var(--teal-bg);color:var(--teal)}
.score-mid{background:var(--gold-bg);color:var(--gold)}
.score-low{background:var(--red-bg);color:var(--red)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.search-bar{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;width:220px;outline:none}
.search-bar:focus{border-color:var(--teal)}
.detail-panel{background:var(--card);border-top:1px solid var(--border);padding:12px 14px;display:none}
.detail-panel.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.detail-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.detail-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.detail-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500}
.code-chip{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark);padding:2px 8px;border-radius:3px;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:1.25rem}
.copy-btn{font-size:10px;padding:1px 6px;border:1px solid var(--border2);border-radius:3px;cursor:pointer;background:transparent;color:var(--muted);margin-left:4px}
.copy-btn:hover{border-color:var(--mid);color:var(--sub)}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:13px;color:var(--sub);box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:flex-start;gap:10px;max-width:340px;pointer-events:auto;animation:toastIn .25s ease forwards;border-left:4px solid var(--teal)}
.toast.toast-ok{border-left-color:var(--teal)}.toast.toast-err{border-left-color:var(--red)}.toast.toast-warn{border-left-color:var(--gold)}.toast.toast-info{border-left-color:var(--info)}
.toast.hide{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand"><div class="wdot"></div>Koers voor Morgen <span style="color:var(--teal);margin-left:4px">Beheer</span></div>
    <div id="hdr-actions" style="display:none;gap:10px;align-items:center">
      <button class="btn-ghost" style="font-size:12px" id="btn-refresh">&#8635; Verversen</button>
      <button class="btn-ghost" style="font-size:12px" id="btn-logout">Uitloggen</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>

// Standaard altijd productie. Alleen overschrijfbaar via ?worker=... in de URL, en dan uitsluitend
// naar de bekende staging-omgeving — bedoeld om daar tegen te testen, nooit als permanente
// instelling. Security-fix 17 aug 2026 (extern codereview): een willekeurige ?worker=-waarde
// accepteren betekende dat een gekaapte link de admin-sleutel naar een server van een aanvaller
// kon sturen; met deze whitelist zijn alleen deze twee, door onszelf beheerde, bestemmingen mogelijk.
const _WORKER_WHITELIST=['https://kantoorinzicht.marcel-bisschops.workers.dev','https://kantoorinzicht-staging.marcel-bisschops.workers.dev'];
const _WORKER_PARAM=new URLSearchParams(location.search).get('worker')||'';
const WORKER=_WORKER_WHITELIST.includes(_WORKER_PARAM)?_WORKER_PARAM:'https://kantoorinzicht.marcel-bisschops.workers.dev';
// White-label basis — centrale merkconfig voor de beheerkant (zelfde patroon als de rest).
const BRAND={platform:'Koers voor Morgen',bedrijf:'Bisschops Financing B.V.',suffix:'Beheer',kort:'Bisschops Financing',adres:'Grotestraat 13, 5841AA Oploo'};
// Vaste taalregels voor elke AI-prompt in marilyn.html (5 aug 2026, zelfde tekst als index.html/mna.html).
const TAAL_REGELS='Schrijf in natuurlijk, vloeiend Nederlands — geen letterlijke vertaling uit het Engels. Gebruik uitsluitend de formele aanspreekvorm "u/uw", nooit "je/jij/jouw", ook niet losse keren door elkaar. Gebruik "geen [zelfstandig naamwoord]" i.p.v. de onnatuurlijke constructie "niet een [zelfstandig naamwoord]". Vermijd andere letterlijke Engelse constructies en verzin geen niet-bestaande woorden.';
document.title=BRAND.platform+' — '+BRAND.suffix;
(function(){var b=document.querySelector('.brand');if(b)b.innerHTML='<div class="wdot"></div>'+BRAND.platform+' <span style="color:var(--teal);margin-left:4px">'+BRAND.suffix+'</span>';})();
let adminKey='',scans=[],callbacks=[],mnaList=[],rapporten=[],leads=[],activeTab='scans',scanFilter='',openRow=null;
let gebruikerToken='',gebruikerInfo=null,isSuperAdmin=false;

function toast(msg,type,dur){type=type||'ok';dur=dur||3500;var c=document.getElementById('toast-container');if(!c){c=document.createElement('div');c.id='toast-container';c.className='toast-container';document.body.appendChild(c);}var t=document.createElement('div');t.className='toast toast-'+type;var ico=type==='ok'?'✓':type==='err'?'✕':type==='warn'?'⚠':'ℹ';t.innerHTML='<span style="font-size:15px;flex-shrink:0;color:'+(type==='ok'?'var(--teal)':type==='err'?'var(--red)':type==='warn'?'var(--gold)':'#2a5ea0')+'">'+ico+'</span><span style="flex:1;line-height:1.5">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0;line-height:1;flex-shrink:0">&times;</button>';c.appendChild(t);setTimeout(function(){t.classList.add('hide');setTimeout(function(){if(t.parentElement)t.parentElement.removeChild(t);},220);},dur);return t;}

function dc(v){return v>=70?'score-high':v>=50?'score-mid':'score-low';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
// Security-fix 17 aug 2026: downloads/exports gingen voorheen via <a href="...?key=admin-sleutel">
// — daarmee stond de admin-sleutel letterlijk in de link (browsergeschiedenis, "kopieer link").
// Nu een fetch met de sleutel in een header, en de browser-download-dialoog getriggerd via een
// tijdelijke blob-URL i.p.v. de sleutel zichtbaar in de adresbalk/link te zetten.
async function downloadMetAdminKey(url,bestandsnaam){
  try{
    var r=await fetch(url,{headers:{'x-admin-key':adminKey}});
    if(!r.ok){toast('Download mislukt','err');return;}
    var blob=await r.blob();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=bestandsnaam||'download';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){toast('Download mislukt','err');}
}
function meekijkerChipsHtml(t){
  var actief=(t.meekijkers||[]).filter(function(v){return !v.ingetrokken_op&&!(v.expires_at&&Date.now()>v.expires_at);});
  if(!actief.length)return '';
  return '<span style="margin-top:3px;display:inline-flex;gap:3px;flex-wrap:wrap;align-items:center">'
    +actief.map(function(v){
      return '<span class="code-chip" style="font-size:10px;background:var(--card);color:var(--mid);border-color:var(--border2)" title="Meekijker: '+esc(v.viewer_naam||'—')+' ('+esc(v.viewer_type||'—')+') — scope: '+esc(v.scope_fase==='alle'?'alle fases':v.scope_fase)+'">&#128064; '+esc(v.viewer_code)+'</span><button class="copy-btn" data-copy="'+esc(v.viewer_code)+'">⎘</button>';
    }).join('')
    +'</span>';
}
function partijLabels(type){
  var t=type||'Verkoop';
  if(t==='Fusie')return{partij1:'Fusiepartij A',partij2:'Fusiepartij B',p1adres:'Adres partij A',p2adres:'Adres partij B',p1kvk:'KvK partij A',p2kvk:'KvK partij B',p1contact:'Contactpersoon A',p2contact:'Contactpersoon B',p1email:'E-mail partij A',p2email:'E-mail partij B',p1rv:'Rechtsvorm partij A',sectie1:'Fusiepartij A',sectie2:'Fusiepartij B'};
  if(t==='Overname')return{partij1:'Over te nemen partij',partij2:'Overnemende partij',p1adres:'Adres target',p2adres:'Adres overnemende partij',p1kvk:'KvK target',p2kvk:'KvK overnemende partij',p1contact:'Contactpersoon target',p2contact:'Contactpersoon overnemende partij',p1email:'E-mail target',p2email:'E-mail overnemende partij',p1rv:'Rechtsvorm overnemende partij',sectie1:'Target',sectie2:'Overnemende partij'};
  if(t==='PE-traject')return{partij1:'Te verkopen onderneming',partij2:'PE-partij / Investeerder',p1adres:'Adres onderneming',p2adres:'Adres PE-partij',p1kvk:'KvK onderneming',p2kvk:'KvK PE-partij',p1contact:'Contactpersoon onderneming',p2contact:'Contactpersoon PE-partij',p1email:'E-mail onderneming',p2email:'E-mail PE-partij',p1rv:'Rechtsvorm PE-partij',sectie1:'Onderneming',sectie2:'PE-partij'};
  if(t==='Opvolging')return{partij1:'Overdragende eigenaar',partij2:'Opvolgend eigenaar',p1adres:'Adres overdragende eigenaar',p2adres:'Adres opvolger',p1kvk:'KvK bedrijf',p2kvk:'KvK opvolger',p1contact:'Contactpersoon overdragende eigenaar',p2contact:'Contactpersoon opvolger',p1email:'E-mail overdragende eigenaar',p2email:'E-mail opvolger',p1rv:'Rechtsvorm opvolger',sectie1:'Overdragende eigenaar',sectie2:'Opvolgend eigenaar'};
  // default: Verkoop / Aankoop
  return{partij1:'Verkoper',partij2:'Kopende partij',p1adres:'Adres verkoper',p2adres:'Adres koper',p1kvk:'KvK verkoper',p2kvk:'KvK koper',p1contact:'Contactpersoon verkoper',p2contact:'Contactpersoon koper',p1email:'E-mail verkoper',p2email:'E-mail koper',p1rv:'Rechtsvorm koper',sectie1:'Verkoper',sectie2:'Kopende partij'};
}

// LOGIN
function renderLogin(){
  document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-box">'
    +'<div class="login-title">'+BRAND.platform+' '+BRAND.suffix+'</div>'
    +'<div class="login-sub">Beheerder-toegang. Alleen voor beheerder.</div>'
    +'<div class="field" style="margin-top:1rem"><label>Beheerder-sleutel</label><input type="password" id="ak" placeholder="••••••••" autofocus></div>'
    +'<button class="btn" id="login-btn" style="width:100%">Inloggen</button>'
    +'<div style="margin-top:1rem;padding:.75rem 1rem;background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);font-size:11px;color:var(--muted);line-height:1.7">&#128274; <strong style="color:var(--sub)">Beveiliging & privacy</strong><br>Verbinding versleuteld (HTTPS). Gegevens in Cloudflare EU (Frankfurt). Geen gegevensverkoop. <a href="privacy.html" style="color:var(--teal)">Privacyverklaring</a></div>'
    +'<div id="login-err" style="color:var(--red);font-size:12px;margin-top:.75rem;display:none">Sleutel incorrect.</div>'
    +'<div id="login-mode" style="display:none"></div>'
    +'<div id="admin-fields" style="display:none"></div>'
    +'<div id="adviseur-fields" style="display:none"></div>'
    +'<div style="text-align:center;margin-top:1rem;font-size:11px;color:var(--muted)">&copy; '+new Date().getFullYear()+' '+BRAND.bedrijf+' Alle rechten voorbehouden.</div>'
    +'</div></div>';
  document.getElementById('login-btn').addEventListener('click',doLogin);
  document.getElementById('ak').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  var btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Laden...';
  var err=document.getElementById('login-err');err.style.display='none';
  var key=document.getElementById('ak').value.trim();
  if(!key){btn.disabled=false;btn.textContent='Inloggen';return;}
  try{
    var [r1,r2,r3,r4,r5]=await Promise.all([
      fetch(WORKER+'/admin/scans',{headers:{'x-admin-key':key}}),
      fetch(WORKER+'/admin/callbacks',{headers:{'x-admin-key':key}}),
      fetch(WORKER+'/mna/admin/lijst',{headers:{'x-admin-key':key}}),
      fetch(WORKER+'/admin/rapporten',{headers:{'x-admin-key':key}}),
      fetch(WORKER+'/admin/leads',{headers:{'x-admin-key':key}})
    ]);
    if(!r1.ok)throw new Error('unauthorized');
    scans=await r1.json();callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    try{var r5data=r5.ok?await r5.json().catch(()=>[]):[];leads=Array.isArray(r5data)?r5data:[];}catch(e){leads=[];}
    adminKey=key;isSuperAdmin=true;gebruikerInfo=null;gebruikerToken='';
    document.getElementById('hdr-actions').style.display='flex';
    document.getElementById('btn-refresh').addEventListener('click',refreshData);
    document.getElementById('btn-logout').addEventListener('click',logout);
    renderDashboard();
  }catch(e){
    err.textContent='Sleutel incorrect of verbindingsfout.';
    err.style.display='block';
    btn.disabled=false;btn.textContent='Inloggen';
  }
}

function logout(){
  adminKey='';scans=[];callbacks=[];mnaList=[];rapporten=[];leads=[];
  gebruikerToken='';gebruikerInfo=null;isSuperAdmin=false;
  document.getElementById('hdr-actions').style.display='none';
  renderLogin();
}

async function refreshData(){
  try{
    var [r1,r2,r3,r4,r5]=await Promise.all([
      fetch(WORKER+'/admin/scans',{headers:{'x-admin-key':adminKey}}),
      fetch(WORKER+'/admin/callbacks',{headers:{'x-admin-key':adminKey}}),
      fetch(WORKER+'/mna/admin/lijst',{headers:{'x-admin-key':adminKey}}),
      fetch(WORKER+'/admin/rapporten',{headers:{'x-admin-key':adminKey}}),
      fetch(WORKER+'/admin/leads',{headers:{'x-admin-key':adminKey}})
    ]);
    scans=await r1.json();callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}

}

 document.getElementById('btn-load-docs').click();});

  document.getElementById('btn-load-docs').addEventListener('click',async function(){
    var db=document.getElementById('docs-body');

      var r=await fetch(WORKER+'/mna/admin/documenten',{headers:{'x-admin-key':adminKey}});

      var html='<table><thead><tr><th style="width:32px"><input type="checkbox" id="cb-all" title="Alles selecteren"></th><th>Traject</th><th>Fase</th><th>Bestand</th><th>Grootte</th><th>Opgeslagen</th><th>Status</th><th>Datum</th><th></th></tr></thead><tbody>';
      docs.forEach(function(d){
        var gr=d.bestand_grootte?(d.bestand_grootte/1024/1024).toFixed(1)+'MB':'—';
        var dt=d.uploaded_at?new Date(d.uploaded_at).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
        var vergr=d.vergrendeld||0;
        html+='<tr>'
          +'<td><input type="checkbox" class="doc-cb" data-id="'+d.id+'"'+(vergr?' disabled title="Vergrendeld"':'')+' style="cursor:pointer"></td>'
          +'<td class="mono" style="font-size:11px;color:var(--teal)">'+esc(d.traject_id||'—')+'</td>'
          +'<td style="font-size:11px">'+esc(d.fase_id||'—')+'</td>'
          +'<td style="font-weight:500;color:var(--head)">'+esc(d.bestand_naam||'—')+'</td>'
          +'<td class="mono" style="font-size:11px">'+gr+'</td>'
          +'<td>'+(d.bewaard?'<span class="tag">&#10003; Dataroom</span>':'<span style="font-size:11px;color:var(--muted)">Analyse only</span>')+'</td>'
          +'<td>'+(vergr?'<span class="tag" style="background:var(--red-bg);color:var(--red);border-color:var(--red)">&#128274; Vergrendeld</span>':'<span style="font-size:11px;color:var(--muted)">Vrij</span>')+'</td>'
          +'<td class="mono" style="font-size:11px">'+dt+'</td>'
          +'<td style="white-space:nowrap;display:flex;gap:4px">'
          +(d.bewaard?'<button class="btn-ghost btn-dl-doc" data-id="'+esc(d.id)+'" data-naam="'+esc(d.bestand_naam||'download')+'" style="font-size:11px;padding:3px 8px">&#8681;</button>':'')
          +(vergr
            ?'<button class="btn-ghost btn-ontv-doc" data-id="'+d.id+'" style="font-size:11px;padding:3px 8px;color:var(--teal)">&#128275;</button>'
            :'<button class="btn-ghost btn-verg-doc" data-id="'+d.id+'" style="font-size:11px;padding:3px 8px;color:var(--gold)">&#128274;</button>')
          +(!vergr?'<button class="btn-red btn-del-doc" data-id="'+d.id+'" style="font-size:10px;padding:2px 6px">&#10005;</button>':'')
          +'</td>'
          +'</tr>';
      });
      html+='</tbody></table>';
      db.innerHTML=html;
      var ds=document.getElementById('doc-search');if(ds)ds.addEventListener('input',function(){var q=this.value.toLowerCase();db.querySelectorAll('tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});});
      var cbAll=document.getElementById('cb-all');if(cbAll){cbAll.addEventListener('change',function(){document.querySelectorAll('.doc-cb:not(:disabled)').forEach(function(cb){cb.checked=cbAll.checked;});updateSelCount();});}
      db.querySelectorAll('.doc-cb').forEach(function(cb){cb.addEventListener('change',updateSelCount);});
      db.querySelectorAll('.btn-del-doc').forEach(function(b){b.addEventListener('click',function(){verwijderDoc(b.dataset.id);});});
      db.querySelectorAll('.btn-verg-doc').forEach(function(b){b.addEventListener('click',function(){vergrendelDoc(b.dataset.id,true);});});
      db.querySelectorAll('.btn-ontv-doc').forEach(function(b){b.addEventListener('click',function(){vergrendelDoc(b.dataset.id,false);});});
      db.querySelectorAll('.btn-dl-doc').forEach(function(b){b.addEventListener('click',function(){downloadMetAdminKey(WORKER+'/mna/document/download/'+encodeURIComponent(b.dataset.id),b.dataset.naam);});});
    }catch(e){db.textContent='Fout bij laden: '+e.message;}
  });
}


async function renderBenchmarksTab(el){
  el.innerHTML='<div class="table-wrap"><div class="table-hdr"><div class="table-title">Benchmarks</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-refresh">&#8635; Bronnen updaten</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-bench-add">+ Handmatig toevoegen</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)" id="btn-bench-pdf">&#128196; PDF analyseren</button>'
    +'</div></div>'
    +'<div id="bench-body" class="empty">Laden...</div></div>';

  async function laadBenchmarks(){
    var db=document.getElementById('bench-body');
    try{
      var r=await fetch(WORKER+'/benchmarks');
      var data=await r.json();
      if(!data.length){db.innerHTML='<div class="empty">Nog geen benchmarks. Klik op Bronnen updaten om de eerste data op te halen.</div>';return;}
      var html='<table><thead><tr><th>Sleutel</th><th>Omschrijving</th><th>Waarde</th><th>Bron</th><th>Peildatum</th><th>Bijgewerkt</th><th></th></tr></thead><tbody>';
      data.forEach(function(b){
        var dt=b.updated_at?new Date(b.updated_at).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'--';
        var valFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
        html+='<tr>'
          +'<td class="mono" style="font-size:11px;color:var(--teal)">'+esc(b.sleutel)+'</td>'
          +'<td style="font-size:12px">'+esc(b.omschrijving||'--')+'</td>'
          +'<td class="mono" style="font-weight:600;color:var(--head)">'+valFmt+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+esc(b.bron||'--')+(b.bron_url?'<br><a href="'+esc(b.bron_url)+'" target="_blank" style="color:var(--teal);font-size:10px">Bron &#8599;</a>':'')+'</td>'
          +'<td class="mono" style="font-size:11px">'+esc(b.peildatum||'--')+'</td>'
          +'<td class="mono" style="font-size:11px">'+dt+'</td>'
          +'<td><button class="btn-red btn-del-bench" data-sleutel="'+esc(b.sleutel)+'" style="font-size:10px;padding:2px 6px">&#10005;</button></td>'
          +'</tr>';
      });
      html+='</tbody></table>';
      db.innerHTML=html;
      db.querySelectorAll('.btn-del-bench').forEach(function(btn){
        btn.addEventListener('click',async function(){
          if(!confirm('Benchmark "'+btn.dataset.sleutel+'" verwijderen?'))return;
          await fetch(WORKER+'/admin/benchmarks/delete/'+btn.dataset.sleutel,{headers:{'x-admin-key':adminKey},method:'POST'}).catch(function(){});
          laadBenchmarks();
        });
      });
    }catch(e){db.innerHTML='<div class="empty">Fout bij laden: '+e.message+'</div>';}
  }
  laadBenchmarks();

  document.getElementById('btn-bench-refresh').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;btn.textContent='Updaten...';
    try{
      var r=await fetch(WORKER+'/admin/benchmarks/refresh',{method:'POST',headers:{'x-admin-key':adminKey}});
      if(!r.ok&&r.status!==400){var errTxt=await r.text().catch(()=>'');throw new Error('Server fout '+r.status+': '+errTxt.substring(0,100));}
      var d=await r.json();
      if(d.ok){toast(d.count+' benchmarks bijgewerkt uit bronnen.','ok');laadBenchmarks();}
      else toast('Fout: '+(d.error||'onbekend'),'err');
    }catch(e){toast('Verbindingsfout.','err');}
    btn.disabled=false;btn.textContent='↻ Bronnen updaten';
  });

  document.getElementById('btn-bench-pdf').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.className='modal';
    mo.style.maxWidth='520px';
    mo.innerHTML='<div class="modal-title">&#128196; PDF analyseren voor benchmarks</div>'
      +'<p style="font-size:13px;color:var(--mid);margin-bottom:1rem;line-height:1.6">Upload een PDF met benchmarkdata (bijv. Full Finance, Simplicate, AV Top 20). De AI extraheert automatisch de relevante waarden en slaat ze op als benchmarks.</p>'
      +'<div class="field"><label>Bron naam <span style="color:var(--red)">*</span></label><input type="text" id="pdf-bron" placeholder="Naam van de bron" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>Peildatum <span style="color:var(--red)">*</span></label><input type="text" id="pdf-datum" placeholder="Jaartal" style="margin-bottom:.5rem"></div>'
      +'<div class="field"><label>PDF bestand <span style="color:var(--red)">*</span></label><input type="file" id="pdf-file" accept=".pdf" style="margin-bottom:.5rem"></div>'
      +'<div id="pdf-status" style="font-size:12px;color:var(--teal);margin:.75rem 0;display:none;padding:10px;background:var(--teal-bg);border-radius:var(--r)"></div>'
      +'<div id="pdf-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div id="pdf-preview" style="font-size:12px;color:var(--mid);margin-bottom:.75rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="pdf-ann">Annuleren</button><button class="btn" id="pdf-ok">Analyseren &amp; opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('pdf-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('pdf-ok').addEventListener('click',async function(){
      var bron=document.getElementById('pdf-bron').value.trim();
      var datum=document.getElementById('pdf-datum').value.trim();
      var file=document.getElementById('pdf-file').files[0];
      var err=document.getElementById('pdf-err');
      var status=document.getElementById('pdf-status');
      var preview=document.getElementById('pdf-preview');
      if(!bron||!datum||!file){err.style.display='block';err.textContent='Vul alle velden in en selecteer een PDF.';return;}
      var btn=document.getElementById('pdf-ok');
      // Als al geanalyseerd en bevestigd: sla op zonder opnieuw analyseren
      if(btn.dataset.confirmed==='1'){
        btn.disabled=true;btn.textContent='Opslaan...';
        var gevonden2=btn._gevonden||[];
        for(var bi=0;bi<gevonden2.length;bi++){
          await fetch(WORKER+'/admin/benchmarks/update',{
            method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
            body:JSON.stringify({sleutel:gevonden2[bi].sleutel,waarde:gevonden2[bi].waarde,categorie:gevonden2[bi].categorie||'algemeen',omschrijving:gevonden2[bi].omschrijving,bron:bron,peildatum:datum})
          }).catch(function(){});
        }
        status.innerHTML='&#10003; '+gevonden2.length+' benchmarks opgeslagen.';
        status.style.background='var(--teal-bg)';status.style.color='var(--teal)';
        btn.textContent='Klaar';btn.dataset.confirmed='';
        laadBenchmarks();
        return;
      }
      btn.disabled=true;btn.textContent='Analyseren...';
      err.style.display='none';
      status.style.display='block';status.textContent='PDF inlezen...';
      try{
        // PDF naar base64
        var b64=await new Promise(function(res,rej){
          var r=new FileReader();
          r.onload=function(){res(r.result.split(',')[1]);};
          r.onerror=function(){rej(new Error('Lezen mislukt'));};
          r.readAsDataURL(file);
        });
        status.textContent='AI analyseert PDF... (30-60 seconden)';
        // Stuur naar worker die AI aanroept
        var resp=await fetch(WORKER+'/admin/benchmarks/pdf-analyse',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-admin-key':adminKey},
          body:JSON.stringify({pdf_base64:b64,bron:bron,peildatum:datum,bestandsnaam:file.name})
        });
        var data=await resp.json();
        if(!resp.ok||data.error)throw new Error(data.error||'Analyse mislukt');
        var gevonden=data.benchmarks||[];
        if(!gevonden.length)throw new Error('Geen benchmarkwaarden gevonden in dit document.');
        // Haal huidige benchmarks op voor conflict check
        var huidig={};
        try{var br=await fetch(WORKER+'/benchmarks');var bd=await br.json();bd.forEach(function(b){huidig[b.sleutel]=b;});}catch(e){}
        // Bouw preview met conflict waarschuwingen
        var conflicten=gevonden.filter(function(b){return huidig[b.sleutel]&&Math.abs(huidig[b.sleutel].waarde-b.waarde)>1;});
        var pvHtml='<strong style="color:var(--head)">'+gevonden.length+' waarden gevonden'+(conflicten.length?' &mdash; <span style="color:var(--gold)">'+conflicten.length+' conflict(en)</span>':'')+':</strong><br><br>';
        gevonden.forEach(function(b){
          var hv=huidig[b.sleutel];
          var conflict=hv&&Math.abs(hv.waarde-b.waarde)>1;
          var nvFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
          if(conflict){
            var ovFmt=hv.waarde>1000?'€'+(hv.waarde/1000).toFixed(0)+'K':hv.waarde.toFixed(2)+'x';
            pvHtml+='<div style="padding:6px 10px;margin-bottom:4px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0">'
              +'<span style="color:var(--gold)">&#9888; Conflict</span> <code>'+b.sleutel+'</code><br>'
              +'Huidig ('+esc(hv.bron||'onbekend')+'): <strong>'+ovFmt+'</strong> → Nieuw ('+esc(bron)+'): <strong>'+nvFmt+'</strong></div>';
          } else {
            pvHtml+='<div style="padding:4px 0;font-size:12px">&#10003; <code>'+b.sleutel+'</code>: '+nvFmt+(hv?' (ongewijzigd)':' (nieuw)')+'</div>';
          }
        });
        preview.style.display='block';preview.innerHTML=pvHtml;
        if(conflicten.length){
          status.style.display='block';status.innerHTML='&#9888; Controleer de conflicten hierboven. Klik Opslaan om alle waarden te overschrijven.';
          status.style.background='var(--gold-bg)';status.style.color='var(--gold)';
          btn._gevonden=gevonden;
          btn.disabled=false;btn.textContent='Toch opslaan';
          btn.dataset.confirmed='1';
        } else {
          status.innerHTML='&#10003; '+gevonden.length+' benchmarks opgeslagen in D1.';
          btn.textContent='Klaar';
          laadBenchmarks();
        }
      }catch(e){
        err.style.display='block';err.textContent='Fout: '+e.message;
        btn.disabled=false;btn.textContent='Opnieuw proberen';
        status.style.display='none';
      }
    });
  });

  document.getElementById('btn-bench-add').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.className='modal';
    mo.innerHTML='<div class="modal-title">Benchmark handmatig toevoegen</div>'
      +'<div class="field"><label>Sleutel (uniek ID) <span style="color:var(--red)">*</span></label><input type="text" id="bm-id" placeholder="Sleutel (key)"></div>'
      +'<div class="field"><label>Omschrijving</label><input type="text" id="bm-omschr" placeholder="Omschrijving"></div>'
      +'<div class="field"><label>Waarde (getal) <span style="color:var(--red)">*</span></label><input type="number" id="bm-val" step="0.1"></div>'
      +'<div class="field"><label>Categorie</label><select id="bm-cat"><option value="productiviteit">Productiviteit</option><option value="winstgevendheid">Winstgevendheid</option><option value="waardering">Waardering</option><option value="tarieven">Tarieven</option><option value="algemeen">Algemeen</option></select></div>'
      +'<div class="field"><label>Bron</label><input type="text" id="bm-bron" placeholder="Bron"></div>'
      +'<div class="field"><label>Bron URL (optioneel)</label><input type="text" id="bm-url" placeholder="URL"></div>'
      +'<div class="field"><label>Peildatum</label><input type="text" id="bm-datum" placeholder="Peildatum"></div>'
      +'<div id="bm-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="bm-ann">Annuleren</button><button class="btn" id="bm-ok">Opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('bm-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('bm-ok').addEventListener('click',async function(){
      var id=document.getElementById('bm-id').value.trim();
      var val=parseFloat(document.getElementById('bm-val').value);
      var err=document.getElementById('bm-err');
      if(!id||isNaN(val)){err.style.display='block';err.textContent='Sleutel en waarde zijn verplicht.';return;}
      var btn=document.getElementById('bm-ok');
      // Conflict check: huidige waarde ophalen
      if(!btn.dataset.confirmed){
        try{
          var chkR=await fetch(WORKER+'/benchmarks');
          var chkD=await chkR.json();
          var bestaand=chkD.find(function(b){return b.sleutel===id;});
          if(bestaand&&Math.abs(bestaand.waarde-val)>0.01){
            var ovFmt2=bestaand.waarde>1000?'€'+(bestaand.waarde/1000).toFixed(0)+'K':bestaand.waarde.toFixed(2)+'x';
            var nvFmt2=val>1000?'€'+(val/1000).toFixed(0)+'K':val.toFixed(2)+'x';
            err.style.display='block';
            err.style.color='var(--gold)';
            err.innerHTML='&#9888; Huidige waarde: <strong>'+ovFmt2+'</strong> ('+esc(bestaand.bron||'onbekend')+')<br>Nieuwe waarde: <strong>'+nvFmt2+'</strong><br><br>Klik nogmaals op Opslaan om te overschrijven.';
            btn.dataset.confirmed='1';
            return;
          }
        }catch(eCk){}
      }
      btn.dataset.confirmed='';
      btn.disabled=true;btn.textContent='Opslaan...';
      try{
        var r=await fetch(WORKER+'/admin/benchmarks/update',{
          method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
          body:JSON.stringify({sleutel:id,waarde:val,categorie:document.getElementById('bm-cat').value,omschrijving:document.getElementById('bm-omschr').value.trim(),bron:document.getElementById('bm-bron').value.trim(),bron_url:document.getElementById('bm-url').value.trim(),peildatum:document.getElementById('bm-datum').value.trim()})
        });
        var d=await r.json();
        if(d.ok){document.body.removeChild(ov);laadBenchmarks();}
        else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Opslaan';}
      }catch(e2){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Opslaan';}
    });
  });
}

  el.innerHTML='<div class="table-wrap"><div class="table-hdr"><div class="table-title">&#128196; Document Templates</div></div>'

  var lijst=document.getElementById('tpl-lijst');

    div.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem';
    div.innerHTML='<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'

      +'<div id="tpl-status-'+type+'" style="font-size:11px;color:var(--muted)">Laden...</div>'
      +'<div style="margin-left:auto;display:flex;gap:8px">'
      +'<button class="btn-ghost tpl-bekijk" data-type="'+type+'" style="font-size:11px;padding:4px 12px" title="Bekijk huidig template">&#128065; Bekijk</button>'
      +'<label class="btn" style="font-size:11px;padding:4px 12px;cursor:pointer;background:'+kleur+'">&#128196; Upload eigen<input type="file" accept=".txt,.docx,.doc" data-type="'+type+'" class="tpl-upload" style="display:none"></label>'
      +'<button class="btn-ghost tpl-reset" data-type="'+type+'" style="font-size:11px;padding:4px 12px;color:var(--red);border-color:var(--red)">&#10005; Reset BF standaard</button>'
      +'</div></div>'
      +'<div id="tpl-preview-'+type+'" style="display:none;margin-top:.75rem;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:.75rem;font-size:12px;font-family:Georgia,serif;line-height:1.7;color:var(--sub);max-height:200px;overflow-y:auto"></div>';
    lijst.appendChild(div);

    // Laad status
    fetch(WORKER+'/mna/template/'+type+'?email='+encodeURIComponent('marcel@bisschopsfinancing.nl')).then(function(r){return r.json();}).then(function(d){
      var s=document.getElementById('tpl-status-'+type);
      if(s)s.innerHTML=(d.ok&&d.bron!=='bf_standaard')?'<span style="color:var(--teal)">&#10003; Eigen template actief</span> (door '+esc(d.begeleider_naam||'onbekend')+')':'<span style="color:var(--muted)">BF standaard actief</span>';
    }).catch(function(){});

    // Bekijk knop
    div.querySelector('.tpl-bekijk').addEventListener('click',async function(){
      var prev=document.getElementById('tpl-preview-'+type);
      if(prev.style.display!=='none'){prev.style.display='none';return;}
      prev.textContent='Laden...';prev.style.display='block';
      var r=await fetch(WORKER+'/mna/template/'+type);var d=await r.json();
      prev.textContent=d.ok?d.tekst:'(BF standaard — zie gegenereerde documenten)';
    });

    // Upload eigen template
    div.querySelector('.tpl-upload').addEventListener('change',async function(){
      var file=this.files[0];if(!file)return;
      var reader=new FileReader();
      reader.onload=async function(e){
        var tekst=e.target.result;
        if(file.name.endsWith('.docx')){toast('Upload als .txt bestand (kopieer tekst uit Word en sla op als .txt)','warn');return;}
        var r=await fetch(WORKER+'/mna/template/upload',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({doc_type:type,tekst:tekst,begeleider_naam:'Marcel Bisschops',begeleider_email:'marcel@bisschopsfinancing.nl'})});
        var d=await r.json();
        if(d.ok){toast('Template opgeslagen!','ok');renderTemplatesTab(el);}
        else toast('Fout: '+(d.error||'onbekend'),'err');
      };
      reader.readAsText(file,'utf-8');
    });

    // Reset naar BF standaard
    div.querySelector('.tpl-reset').addEventListener('click',async function(){
      if(!confirm('Reset naar BF standaard template voor '+label+'?'))return;
      var r=await fetch(WORKER+'/mna/template/upload',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({doc_type:type,tekst:'',begeleider_naam:'',begeleider_email:'marcel@bisschopsfinancing.nl'})});
      var d=await r.json();
      if(d.ok)toast('Teruggezet naar BF standaard.','ok');else toast('Fout: '+(d.error||'onbekend'),'err');
      renderTemplatesTab(el);
    });
  });
}

// SECTOREN TAB — beheer van sectorprofielen (globaal). Stuurt de DD-velden,
// benchmarks (aiNormen) en AI-analyse aan die adviseurs in mna.html gebruiken.
function renderSectorenTab(el){
  el.innerHTML='<div class="table-wrap"><div class="table-hdr"><div class="table-title">&#127970; Sectorprofielen</div>'
    +'<button class="btn-ghost" id="sec-reset" style="font-size:11px;padding:4px 12px;color:var(--red);border-color:var(--red)">&#8635; Alles terug naar standaard</button></div>'
    +'<div style="padding:1.25rem">'
    +'<div style="font-size:13px;color:var(--mid);margin-bottom:1.25rem;line-height:1.7">'
    +'Deze profielen bepalen per sector de <strong>DD-velden</strong>, de <strong>benchmarks/normen</strong> (voor de AI-analyse) en de checklists. '
    +'Wijzigingen hier gelden meteen voor alle adviseurs. Zolang je niets wijzigt, gelden de ingebouwde standaardprofielen.'
    +'</div>'
    +'<div id="sec-lijst" style="display:flex;flex-direction:column;gap:14px"><div style="color:var(--muted);font-size:13px">Laden...</div></div>'
    +'<div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)">'
    +'<div style="font-size:12px;font-weight:600;color:var(--head);margin-bottom:.5rem">Nieuwe sector toevoegen</div>'
    +'<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:140px"><label style="font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px">Sleutel (bijv. bouw)</label><input id="sec-new-key" placeholder="kleine letters, geen spaties" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px"></div>'
    +'<div style="flex:1;min-width:160px"><label style="font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px">Kopiëren van</label><select id="sec-new-base" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px"></select></div>'
    +'<button class="btn" id="sec-new-add" style="font-size:12px;padding:8px 14px">+ Toevoegen</button>'
    +'</div><div style="font-size:11px;color:var(--muted);margin-top:6px">Start van een kopie van een bestaande sector; pas daarna de velden/benchmarks aan.</div>'
    +'</div></div></div>';

  var profielen={};

  function laad(){
    fetch(WORKER+'/mna/sectorprofielen').then(function(r){return r.json();}).then(function(d){
      profielen=(d&&d.profielen)||{};
      teken(d&&d.bron);
    }).catch(function(){document.getElementById('sec-lijst').innerHTML='<div style="color:var(--red);font-size:13px">Kon profielen niet laden.</div>';});
  }

  function teken(bron){
    var lijst=document.getElementById('sec-lijst');
    var keys=Object.keys(profielen);
    // Vul de "kopiëren van"-select
    var sel=document.getElementById('sec-new-base');
    if(sel)sel.innerHTML=keys.map(function(k){return '<option value="'+esc(k)+'">'+esc((profielen[k]&&profielen[k].label)||k)+'</option>';}).join('');
    lijst.innerHTML=keys.map(function(k){
      var p=profielen[k]||{};
      var aantalVelden=(p.fases||[]).reduce(function(a,f){return a+((f.dataFields||[]).filter(function(x){return !x.header;}).length);},0);
      return '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem">'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.75rem"><span style="font-family:IBM Plex Mono,monospace;font-size:11px;color:var(--teal);background:var(--teal-bg);padding:2px 8px;border-radius:10px">'+esc(k)+'</span>'
        +'<span style="font-size:11px;color:var(--muted)">'+((p.fases||[]).length)+' fases · '+aantalVelden+' velden</span></div>'
        +'<div style="margin-bottom:.6rem"><label style="font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px">Weergavenaam</label><input class="sec-label" data-k="'+esc(k)+'" value="'+esc(p.label||'')+'" style="width:100%;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px"></div>'
        +'<div style="margin-bottom:.6rem"><label style="font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px">Benchmarks / normen — kort (DD-formulier, chat, waardering)</label><textarea class="sec-normen" data-k="'+esc(k)+'" style="width:100%;height:60px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:12px;font-family:IBM Plex Sans,sans-serif;resize:vertical">'+esc(p.aiNormen||'')+'</textarea></div>'
        +'<div style="margin-bottom:.6rem"><label style="font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px">Documentanalyse-benchmarks — uitgebreid (bij uploaden van documenten)</label><textarea class="sec-docbench" data-k="'+esc(k)+'" style="width:100%;height:120px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:12px;font-family:IBM Plex Sans,sans-serif;resize:vertical">'+esc(p.docBenchmarks||'')+'</textarea></div>'
        +'<details style="margin-bottom:.6rem"><summary style="font-size:11px;color:var(--muted);cursor:pointer">&#9881; Geavanceerd — volledig profiel (JSON: fases, velden, checklists)</summary>'
        +'<textarea class="sec-json" data-k="'+esc(k)+'" style="width:100%;height:220px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:11px;font-family:IBM Plex Mono,monospace;line-height:1.5;margin-top:6px;resize:vertical">'+esc(JSON.stringify(p,null,2))+'</textarea>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:4px">Bij opslaan telt de JSON hierboven. De velden Weergavenaam/Benchmarks worden erin verwerkt.</div></details>'
        +'<div style="display:flex;gap:8px"><button class="btn sec-save" data-k="'+esc(k)+'" style="font-size:12px;padding:6px 14px">&#128190; Opslaan</button>'

        +'</div>';
    }).join('') || '<div style="color:var(--muted);font-size:13px">Geen sectoren.</div>';

    // Opslaan per sector

        var k=btn.dataset.k;
        var jsonEl=lijst.querySelector('.sec-json[data-k="'+k+'"]');
        var labelEl=lijst.querySelector('.sec-label[data-k="'+k+'"]');
        var normenEl=lijst.querySelector('.sec-normen[data-k="'+k+'"]');
        var docbenchEl=lijst.querySelector('.sec-docbench[data-k="'+k+'"]');
        var prof;
        try{ prof=JSON.parse(jsonEl.value); }catch(e){ toast('Ongeldige JSON in het geavanceerde veld: '+e.message,'err',6000); return; }

        prof.label=labelEl.value.trim();
        prof.aiNormen=normenEl.value.trim();
        prof.docBenchmarks=docbenchEl.value.trim();
        btn.disabled=true;btn.textContent='Opslaan...';
        var body={};body[k]=prof;
        var r=await fetch(WORKER+'/mna/admin/sectorprofielen',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({profielen:body})}).then(function(x){return x.json();}).catch(function(){return{};});
        if(r.ok){toast('Sector "'+k+'" opgeslagen','ok');laad();}else{toast('Fout: '+(r.error||'onbekend'),'err');btn.disabled=false;btn.textContent='💾 Opslaan';}
      };
    });
    // Verwijderen
    lijst.querySelectorAll('.sec-del').forEach(function(btn){
      btn.onclick=async function(){
        var k=btn.dataset.k;
        if(!confirm('Sector "'+k+'" verwijderen uit de database? De ingebouwde standaard (indien aanwezig) komt dan weer terug; een eigen toegevoegde sector verdwijnt.'))return;
        var body={};body[k]=null;
        var r=await fetch(WORKER+'/mna/admin/sectorprofielen',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({profielen:body})}).then(function(x){return x.json();}).catch(function(){return{};});
        if(r.ok){toast('Sector "'+k+'" verwijderd','ok');laad();}else toast('Fout: '+(r.error||'onbekend'),'err');
      };
    });
  }

  // Reset alles
  document.getElementById('sec-reset').onclick=async function(){
    if(!confirm('Alle sectorprofielen terugzetten naar de ingebouwde standaard? Je eigen wijzigingen en toegevoegde sectoren gaan verloren.'))return;
    var r=await fetch(WORKER+'/mna/admin/sectorprofielen',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({reset:true})}).then(function(x){return x.json();}).catch(function(){return{};});
    if(r.ok){toast('Teruggezet naar standaard','ok');laad();}else toast('Fout: '+(r.error||'onbekend'),'err');
  };
  // Nieuwe sector toevoegen

function renderWaarderingTab(el){
  var selectedTraject=null;
  var bms={};
  var W={omzet1:0,omzet2:0,omzet3:0,ebitda:0,fte:0,aantalKlanten:0,recurring:0,churn:0,marge:0,
    multiLaag:4.6,multiMid:5.05,multiHoog:5.5,multiBronOntbreekt:true,omzetFactor:0.8,risico:0,
    earnBase:0,earnPct:20,earnTarget:5,earnJaren:3,earnMinimum:0};

  // Fix 5 aug 2026: "3.000.000" werd afgekapt tot 3 — punten zijn NL-duizendtal-scheiding, nooit
  // decimaal, dus eerst verwijderen vóór de komma naar een decimale punt om te zetten.
  // Fix 1 sep 2026: teken behouden (zie parseGeld in mna/03) — de tekenklasse [^0-9,.] slikte het
  // minteken, waardoor een negatief bedrag als positief werd ingelezen.
  function parseGeld(s){if(!s)return 0;var str=String(s).trim();var neg=/^[^\d]*[-−–—‑－]\s*\d/.test(str)||/\d\s*[-−–—‑－]\s*$/.test(str)||/^\(.*\d.*\)$/.test(str);var n=str.replace(/[^0-9,.]/g,'').replace(/\./g,'').replace(',','.');var v=parseFloat(n)||0;return neg?-v:v;}
  function fmtGeld(n){if(!n||isNaN(n))return '—';if(n>=1000000)return '\u20ac'+(n/1000000).toFixed(2).replace('.',',')+' mln';if(n>=1000)return '\u20ac'+(n/1000).toFixed(0)+'.000';return '\u20ac'+Math.round(n);}
  function fmtPct(n){return n?n.toFixed(1)+'%':'—';}

  function bereken(){
    var o3=W.omzet3||0;
    var ebitdaAmt=o3*(W.ebitda/100);
    var waardeMultiLaag=ebitdaAmt*W.multiLaag*(1-W.risico/100);
    var waardeMultiMid=ebitdaAmt*W.multiMid*(1-W.risico/100);
    var waardeMultiHoog=ebitdaAmt*W.multiHoog*(1-W.risico/100);
    var waardeOmzet=o3*W.omzetFactor*(1-W.risico/100);
    // Rolling forecast: gemiddelde groei berekenen
    var groei=0,groeiSteps=0;
    if(W.omzet1>0&&W.omzet2>0){groei+=(W.omzet2-W.omzet1)/W.omzet1*100;groeiSteps++;}
    if(W.omzet2>0&&W.omzet3>0){groei+=(W.omzet3-W.omzet2)/W.omzet2*100;groeiSteps++;}
    var gemGroei=groeiSteps>0?groei/groeiSteps:3;
    var fc=[o3];
    for(var i=1;i<=3;i++)fc.push(fc[fc.length-1]*(1+gemGroei/100));
    var fcEbitda=fc.map(function(o){return o*(W.ebitda/100);});
    var fcWaarde=fcEbitda.map(function(e){return e*W.multiMid*(1-W.risico/100);});
    // Earn-out
    var koopsom=W.earnBase||waardeMultiMid;
    var earnTotaal=0;var earnSchema=[];
    for(var j=1;j<=W.earnJaren;j++){
      var targetOmzet=o3*(1+W.earnTarget/100*j);
      var uitkering=Math.max(W.earnMinimum,koopsom*(W.earnPct/100)/W.earnJaren);
      earnTotaal+=uitkering;
      earnSchema.push({jaar:j,target:targetOmzet,uitkering:uitkering});
    }
    return {ebitdaAmt,waardeMultiLaag,waardeMultiMid,waardeMultiHoog,waardeOmzet,gemGroei,fc,fcEbitda,fcWaarde,koopsom,earnTotaal,earnSchema};
  }

  function renderModule(){
    var res=bereken();
    var html='<div class="table-wrap" style="margin-bottom:1.5rem">'
      +'<div class="table-hdr"><div class="table-title">&#9654; Waardebepaling &amp; Forecast</div>'
      +'<div style="display:flex;gap:8px"><button class="btn" style="font-size:12px;padding:7px 14px" id="w-ai-btn">&#9881; AI Waarderingsrapport</button>'
      +'<button class="btn-ghost" style="font-size:12px;padding:7px 14px" onclick="window.print()">&#128196; PDF</button></div></div>'
      +'<div style="padding:1.25rem">';

    // Traject selector
    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem">'
      +'<div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Traject</div>'
      +'<select id="w-traject" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 11px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub)">'
      +'<option value="">— Selecteer traject —</option>'
      +mnaList.map(function(t){return '<option value="'+esc(t.id)+'"'+(selectedTraject===t.id?' selected':'')+'>'+esc(t.kantoor_naam)+' ('+esc(t.id)+')</option>';}).join('')
      +'</select></div>'
      +'<div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Risico-aftrek (%)</div>'
      +'<input type="number" id="w-risico" value="'+W.risico+'" min="0" max="50" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 11px;font-size:13px"></div>'
      +'<div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Omzetfactor (×)</div>'
      +'<input type="number" id="w-omzetfactor" value="'+W.omzetFactor+'" step="0.05" min="0.3" max="2" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 11px;font-size:13px"></div>'
      +'</div>';

    // Invoervelden
    html+='<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)">Financiële basis</div>'
      +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem">';
    var velden=[
      {id:'w-omzet1',lbl:'Omzet jaar 1',val:W.omzet1?fmtGeld(W.omzet1):''},
      {id:'w-omzet2',lbl:'Omzet jaar 2',val:W.omzet2?fmtGeld(W.omzet2):''},
      {id:'w-omzet3',lbl:'Omzet jaar 3',val:W.omzet3?fmtGeld(W.omzet3):''},
      {id:'w-ebitda',lbl:'EBITDA-marge (%)',val:W.ebitda||''},
      {id:'w-fte',lbl:'FTE',val:W.fte||''},
    ];
    velden.forEach(function(v){
      html+='<div><div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">'+v.lbl+'</div>'
        +'<input type="text" id="'+v.id+'" value="'+esc(String(v.val))+'" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px;font-family:IBM Plex Mono,monospace"></div>';
    });
    html+='</div>';

    // Multiples
    html+='<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)">EBITDA multiples</div>'

  // Waarderingsmodel — zelfde config-gedreven curve als index.html/mna (Fase 4, 5 aug 2026).
  // Geeft hier één best-estimate-punt (geen los "kwaliteit"-signaal zoals de scan heeft), dat als
  // startpunt in de drie editbare velden komt — Marcel verbreedt/versmalt de band zelf naar inzicht.
  var waarderingConfig=null;
  function interpoleerCurve(curve,x){
    if(x<=curve[0][0])return curve[0][1];
    if(x>=curve[curve.length-1][0])return curve[curve.length-1][1];
    for(var i=0;i<curve.length-1;i++){
      var p0=curve[i],p1=curve[i+1];
      if(x>=p0[0]&&x<=p1[0]){var frac=(x-p0[0])/(p1[0]-p0[0]);return p0[1]+frac*(p1[1]-p0[1]);}
    }
    return curve[curve.length-1][1];
  }
  function pasMultiplesAan(){
    if(!waarderingConfig||!waarderingConfig.beschikbaar){W.multiBronOntbreekt=true;return;}
    var conf=waarderingConfig.basisconfig.regulier;
    var ebitdaBedrag=(W.omzet3||0)*((W.ebitda||0)/100);
    var betrouwbaarheidsfactor={hoog:1.0,midden:0.6,laag:0.3};
    var marktcorrectie=0;
    (waarderingConfig.marktfactoren||[]).forEach(function(f){
      var gewicht=(waarderingConfig.marktconfig.gewicht_per_sleutel||{})[f.sleutel]||0;
      marktcorrectie+=gewicht*(f.effect_op_multiple||0)*(betrouwbaarheidsfactor[f.betrouwbaarheid]||0.3);
    });
    var mc=waarderingConfig.marktconfig;
    marktcorrectie=Math.max(-mc.max_correctie,Math.min(mc.max_correctie,marktcorrectie));
    var basis=interpoleerCurve(conf.curve_punten,ebitdaBedrag);
    var eind=Math.max(mc.ondergrens_eindmultiple,Math.min(mc.bovengrens_eindmultiple,Math.round((basis+marktcorrectie)*100)/100));
    W.multiLaag=W.multiMid=W.multiHoog=eind;
    W.multiBronOntbreekt=false;
  }

async function laadDocumentdekking(code){
  var el=document.getElementById('dekking-body');
  if(!el)return;
  try{
    var r=await fetch(WORKER+'/mna/documentdekking/'+encodeURIComponent(code),{headers:{'x-admin-key':adminKey}});
    var d=await r.json();
    if(!d.ok||!d.fases||!d.fases.length){el.innerHTML='<span style="font-style:italic">Geen documentdekking gedefinieerd voor dit sectorprofiel.</span>';return;}
    var totAanwezig=0,totVereist=0;
    d.fases.forEach(function(f){totAanwezig+=f.aanwezig;totVereist+=f.totaal;});
    var html='<div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:.5rem">'+totAanwezig+' / '+totVereist+' vereiste documenten aanwezig</div>';
    d.fases.forEach(function(f){
      var kleur=f.aanwezig>=f.totaal?'var(--teal)':'var(--gold)';
      var ontbrekend=f.vereist.filter(function(v){return!(f.dekking[v.naam]&&f.dekking[v.naam].aanwezig);});
      html+='<details style="margin-bottom:4px"><summary style="cursor:pointer;font-size:12px;color:var(--mid)">'+esc(f.fase_title)+' — <span style="color:'+kleur+';font-weight:600">'+f.aanwezig+'/'+f.totaal+'</span></summary>';
      if(ontbrekend.length){
        html+='<ul style="margin:4px 0 8px 1.2rem;padding:0;font-size:11px;color:var(--muted)">'+ontbrekend.map(function(v){return'<li>'+esc(v.naam)+(v.verplicht?' <span style="color:var(--red)">(verplicht)</span>':' (optioneel)')+'</li>';}).join('')+'</ul>';
      } else {
        html+='<div style="margin:4px 0 8px 1.2rem;font-size:11px;color:var(--teal)">Alles aanwezig.</div>';
      }
      html+='</details>';
    });
    el.innerHTML=html;
  }catch(e){el.innerHTML='<span style="color:var(--red)">Fout bij laden.</span>';}
}

erplichting tot transactie\nDeze overeenkomst verplicht Partijen niet tot het aangaan van een Transactie.\nArtikel 8 – Boetebeding\nBij overtreding van de geheimhoudingsplicht verbeurt de Ontvangende Partij een direct opeisbare boete van € 25.000 per overtreding, vermeerderd met € 2.500 voor iedere dag dat de overtreding voortduurt.\nDeze boete laat onverlet het recht van de Verstrekkende Partij om daarnaast vergoeding van de daadwerkelijk geleden schade te vorderen, voor zover deze de boete overstijgt.\nArtikel 9 – Rechtskeuze en forum\nOp deze overeenkomst is Nederlands recht van toepassing. Geschillen worden exclusief voorgelegd aan de Rechtbank Oost-Brabant.\nOndertekening\nPlaats: ____________________ Datum: ____________________\nVerstrekkende Partij\nNaam: ____________________\nHandtekening: ____________________\nOntvangende Partij\nNaam: ____________________\nHandtekening: ____________________';

    +'<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">&#128206; Bijlagen</span>'
    +'<label class="btn-ghost" style="font-size:11px;padding:3px 10px;cursor:pointer">&#43; Voeg toe<input type="file" id="gs-bijlage-input" multiple accept=".pdf,.docx,.doc,.txt,.eml,.msg,.html,.png,.jpg,.jpeg" style="display:none"></label>'

    +'<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">'
    +'<button class="btn-ghost" id="gs-ai-btn" style="font-size:12px;padding:6px 14px;color:var(--teal);border-color:var(--teal)">&#9881; AI-verslag genereren</button>'
    +'<span id="gs-ai-status" style="font-size:12px;color:var(--muted);align-self:center"></span>'
    +'</div>'
    +'<div id="gs-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.5rem"></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +'<button class="btn-ghost" id="gs-ann">Annuleren</button>'
    +'<button class="btn" id="gs-ok">Opslaan</button>'
    +'</div>';

  ov2.appendChild(mo2);document.body.appendChild(ov2);
  ov2.addEventListener('click',function(e){if(e.target===ov2)document.body.removeChild(ov2);});
  document.getElementById('gs-ann').addEventListener('click',function(){document.body.removeChild(ov2);});

  // ── OPNAME (Web Speech API) ──────────────────────────────────
  var recognition=null;
  var recActief=false;
  var recBtn=document.getElementById('gs-rec-btn');
  var recStatus=document.getElementById('gs-rec-status');
  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    recBtn.title='Spraakherkenning niet beschikbaar in deze browser (gebruik Chrome)';
    recBtn.style.opacity='0.4';recBtn.disabled=true;
    recStatus.textContent='Chrome vereist';
  } else {
    recBtn.addEventListener('click',function(){
      if(!recActief){
        recognition=new SpeechRecognition();
        recognition.lang='nl-NL';
        recognition.continuous=true;
        recognition.interimResults=true;
        var notitiesEl=document.getElementById('gs-notities');
        var baseText=notitiesEl.value;
        var interim='';
        recognition.onresult=function(evt){
          interim='';
          var final='';
          for(var i=evt.resultIndex;i<evt.results.length;i++){
            if(evt.results[i].isFinal)final+=evt.results[i][0].transcript+' ';
            else interim+=evt.results[i][0].transcript;
          }
          if(final){baseText+=(baseText&&!baseText.endsWith(' ')?'\n':'')+final;notitiesEl.value=baseText+interim;}
          else{notitiesEl.value=baseText+interim;}
        };
        recognition.onerror=function(e){recStatus.textContent='Fout: '+e.error;stopRec();};
        recognition.onend=function(){if(recActief)recognition.start();};
        recognition.start();
        recActief=true;
        recBtn.textContent='⏹ Stop';recBtn.style.color='var(--red)';recBtn.style.borderColor='var(--red)';
        recStatus.innerHTML='<span style="color:var(--red)">● Aan het opnemen...</span>';
      } else {
        stopRec();
      }
    });
  }

  function stopRec(){
    if(recognition){recognition.onend=null;recognition.stop();recognition=null;}
    recActief=false;
    recBtn.innerHTML='&#127908; Opnemen';recBtn.style.color='var(--teal)';recBtn.style.borderColor='var(--teal)';
    recStatus.textContent='Opname gestopt';
  }

  // ── BIJLAGEN ────────────────────────────────────────────────
  function renderBijlagen(){
    var el=document.getElementById('gs-bijlagen-lijst');
    if(!el)return;
    if(!bijlagenLijst.length){el.innerHTML='<span style="color:var(--muted);font-style:italic">Geen bijlagen</span>';return;}
    el.innerHTML=bijlagenLijst.map(function(b){
      var size=b.grootte?(b.grootte/1024).toFixed(0)+'KB':'';
      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">'
        +'<span style="font-size:18px">'+(b.type&&b.type.includes('pdf')?'📄':b.type&&b.type.includes('word')?'📝':'📎')+'</span>'
        +'<span style="font-size:12px;flex:1;color:var(--sub)">'+esc(b.naam)+'</span>'
        +'<span style="font-size:10px;color:var(--muted)">'+size+'</span>'
        +(b.tekst?'<span style="font-size:10px;background:var(--teal-bg);color:var(--teal);padding:1px 6px;border-radius:3px">AI kan lezen</span>':'')
        +(b.uploading?'<span style="font-size:10px;color:var(--muted)">Uploaden...</span>'
          :'<button class="btn-ghost bijlage-del" data-id="'+b.id+'" style="font-size:10px;padding:1px 6px;color:var(--red);border-color:var(--red)">✕</button>')
        +'</div>';
    }).join('');
    el.querySelectorAll('.bijlage-del').forEach(function(btn){
      btn.addEventListener('click',async function(){
        var bid=btn.dataset.id;
        if(gesprekId){await fetch(WORKER+'/mna/admin/gesprek/bijlage/delete/'+bid,{headers:{'x-admin-key':adminKey},method:'POST'}).catch(function(){});}
        bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==bid;});
        renderBijlagen();
      });
    });
  }

  // Laad bestaande bijlagen als bewerken
  if(gesprekId){
    fetch(WORKER+'/mna/admin/gesprek/bijlagen/'+gesprekId,{headers:{'x-admin-key':adminKey}})
      .then(function(r){return r.json();})
      .then(function(d){
        bijlagenLijst=(d.bijlagen||[]).map(function(b){return{id:b.id,naam:b.bestand_naam,type:b.bestand_type,grootte:b.bestand_grootte,tekst:b.tekst};});
        renderBijlagen();
      }).catch(function(){});
  }

  document.getElementById('gs-bijlage-input').addEventListener('change',async function(){
    var files=Array.from(this.files);
    if(!files.length)return;
    // Sla gesprek eerst op als het nieuw is zodat we een ID hebben
    if(!gesprekId){
      var datum=document.getElementById('gs-datum').value;
      if(!datum){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Sla het gesprek eerst op (datum vereist) voor je bijlagen toevoegt.';return;}
      var payload={datum:datum,deelnemers:document.getElementById('gs-deelnemers').value.trim(),type:document.getElementById('gs-type').value,ruwe_notities:document.getElementById('gs-notities').value.trim(),verslag:document.getElementById('gs-verslag').value.trim()};
      var r=await fetch(WORKER+'/mna/admin/gesprekken/'+trajectId,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(payload)});
      var d=await r.json();
      if(!d.ok){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Kon gesprek niet opslaan: '+(d.error||'onbekend');return;}
      gesprekId=d.id;
      bestaand={id:gesprekId};
    }
    for(var i=0;i<files.length;i++){
      var file=files[i];
      var tmpId='tmp_'+Date.now()+'_'+i;
      bijlagenLijst.push({id:tmpId,naam:file.name,type:file.type,grootte:file.size,uploading:true});
      renderBijlagen();
      var fd=new FormData();fd.append('file',file);
      try{
        var resp=await fetch(WORKER+'/mna/admin/gesprek/bijlage/'+gesprekId,{headers:{'x-admin-key':adminKey},method:'POST',body:fd});
        var bd=await resp.json();
        bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==tmpId;});
        if(bd.ok){bijlagenLijst.push({id:bd.id,naam:bd.naam||file.name,type:file.type,grootte:file.size,tekst:bd.tekst_beschikbaar?'ja':''});}
      }catch(e){bijlagenLijst=bijlagenLijst.filter(function(b){return b.id!==tmpId;});}
      renderBijlagen();
    }
    this.value='';
  });

  // ── AI VERSLAG ────────────────────────────────────────────
  document.getElementById('gs-ai-btn').addEventListener('click',async function(){
    var notities=(document.getElementById('gs-notities').value||'').trim();
    var bijlagenTekst=bijlagenLijst.filter(function(b){return b.tekst;}).map(function(b){return '--- '+b.naam+' ---\n'+b.tekst;}).join('\n\n');
    if(!notities&&!bijlagenTekst){document.getElementById('gs-err').style.display='block';document.getElementById('gs-err').textContent='Voer notities in of voeg een bijlage toe.';return;}
    document.getElementById('gs-err').style.display='none';
    var st=document.getElementById('gs-ai-status');st.textContent='Verslag wordt gegenereerd...';
    var btn2=this;btn2.disabled=true;
    var deelnemers=(document.getElementById('gs-deelnemers').value||'').trim();
    var datum=(document.getElementById('gs-datum').value||'');
    var type=(document.getElementById('gs-type').value||'gesprek');
    var typeLabels={gesprek:'Gesprek',kennismaking:'Kennismaking',onderhandeling:'Onderhandeling',vergadering:'Vergadering',telefonisch:'Telefonisch overleg',email:'E-mailwisseling',andere:'Overig'};
    var prompt='Maak een professioneel gespreksverslag van een M&A traject.'
      +'\n\nGesprek: '+(typeLabels[type]||type)+' | Datum: '+(datum||'onbekend')+' | Deelnemers: '+(deelnemers||'onbekend')
      +(notities?'\n\nNOTITIES:\n'+notities:'')
      +(bijlagenTekst?'\n\nBIJLAGEN:\n'+bijlagenTekst:'')
      +'\n\nGeef het verslag terug in dit formaat:\n\n## Samenvatting\n[2-3 zinnen]\n\n## Besproken punten\n[per punt]\n\n## Beslissingen & afspraken\n[concreet]\n\n## Actiepunten\n[wie, wat, wanneer]\n\n## Volgende stap\n[gepland]\n\nProfessioneel, derde persoon, bondig.';
    try{
      var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1500})});
      var rd=await resp.json();
      document.getElementById('gs-verslag').value=rd.text||rd.content||'';
      st.textContent='✓ Verslag gegenereerd';
    }catch(err){st.textContent='Fout bij genereren';}
    btn2.disabled=false;
  });

  // ── OPSLAAN ───────────────────────────────────────────────
  document.getElementById('gs-ok').addEventListener('click',async function(){
    if(recActief)stopRec();
    var err=document.getElementById('gs-err');err.style.display='none';
    var datum=document.getElementById('gs-datum').value;
    if(!datum){err.style.display='block';err.textContent='Datum is verplicht.';return;}
    var btn3=this;btn3.disabled=true;btn3.textContent='Opslaan...';
    try{
      var payload={datum:datum,deelnemers:document.getElementById('gs-deelnemers').value.trim(),type:document.getElementById('gs-type').value,ruwe_notities:document.getElementById('gs-notities').value.trim(),verslag:document.getElementById('gs-verslag').value.trim()};
      if(gesprekId)payload.id=gesprekId;
      var r=await fetch(WORKER+'/mna/admin/gesprekken/'+trajectId,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(payload)});
      var d=await r.json();
      if(d.ok){document.body.removeChild(ov2);if(onSaved)onSaved();}
      else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn3.disabled=false;btn3.textContent='Opslaan';}
    }catch(e2){err.style.display='block';err.textContent='Verbindingsfout.';btn3.disabled=false;btn3.textContent='Opslaan';}
  });
}

function toonBegeleiderModal(trajectId, trajectNaam, tussenCode){

  mo.innerHTML='<div class="modal-title">&#128231; Begeleider uitnodigen</div>'
