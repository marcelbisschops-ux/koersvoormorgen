<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantoorInzicht — Beheer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--head:#1a1815;--teal:#1a7a5e;--teal-dim:#145f48;--teal-dark:#0a3d2e;--teal-bg:rgba(34,197,160,.1);--gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--red:#e05252;--red-bg:rgba(224,82,82,.1);--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1400px;margin:0 auto;padding:2rem}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer}
.btn:hover{background:var(--teal-dim)}
.btn:disabled{background:var(--border2);color:var(--muted);cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-ghost:hover{border-color:var(--mid)}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red);font-family:'IBM Plex Sans',sans-serif;font-size:11px;padding:3px 10px;border-radius:var(--r);cursor:pointer}
.btn-red:hover{background:var(--red-bg)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.login-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--head);font-weight:600;margin-bottom:.4rem}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--teal)}
.tabs{display:flex;gap:4px;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tab{font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:2rem}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--teal);line-height:1;margin-bottom:.25rem}
.stat-lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:2rem}
.table-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;gap:.5rem}
.table-title{font-size:13px;font-weight:600;color:var(--head)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px;text-align:left;border-bottom:2px solid var(--border);background:var(--card);white-space:nowrap;position:relative;resize:horizontal;overflow:auto;min-width:60px}
th:after{content:'';position:absolute;right:0;top:25%;height:50%;width:3px;background:var(--border2);cursor:col-resize;opacity:0;transition:opacity .15s}
th:hover:after{opacity:1}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--mid);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(26,122,94,.04)}
.table-wrap{overflow-x:auto}
.score-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:2px 8px;border-radius:3px}
.score-high{background:var(--teal-bg);color:var(--teal)}
.score-mid{background:var(--gold-bg);color:var(--gold)}
.score-low{background:var(--red-bg);color:var(--red)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.search-bar{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;width:220px;outline:none}
.search-bar:focus{border-color:var(--teal)}
.detail-panel{background:var(--card);border-top:1px solid var(--border);padding:12px 14px;display:none}
.detail-panel.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.detail-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.detail-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.detail-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500}
.code-chip{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-dark);padding:2px 8px;border-radius:3px;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:1.25rem}
.copy-btn{font-size:10px;padding:1px 6px;border:1px solid var(--border2);border-radius:3px;cursor:pointer;background:transparent;color:var(--muted);margin-left:4px}
.copy-btn:hover{border-color:var(--mid);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand"><div class="wdot"></div>KantoorInzicht <span style="color:var(--teal);margin-left:4px">Beheer</span></div>
    <div id="hdr-actions" style="display:none;gap:10px;align-items:center">
      <button class="btn-ghost" style="font-size:12px" id="btn-refresh">&#8635; Verversen</button>
      <button class="btn-ghost" style="font-size:12px" id="btn-logout">Uitloggen</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
const WORKER='https://kantoorinzicht.marcel-bisschops.workers.dev';
let adminKey='',scans=[],callbacks=[],mnaList=[],rapporten=[],activeTab='scans',scanFilter='',openRow=null;

function dc(v){return v>=70?'score-high':v>=50?'score-mid':'score-low';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}

// LOGIN
function renderLogin(){
  document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-box">'
    +'<div class="login-title">Beheer toegang</div>'
    +'<div class="login-sub">Voer uw admin-sleutel in om door te gaan.</div>'
    +'<div class="field"><label>Admin-sleutel</label><input type="password" id="ak" placeholder="••••••••" autofocus></div>'
    +'<button class="btn" id="login-btn" style="width:100%">Inloggen</button>'
    +'<div id="login-err" style="color:var(--red);font-size:12px;margin-top:.75rem;display:none">Sleutel incorrect of verbindingsfout.</div>'
    +'</div></div>';
  document.getElementById('login-btn').addEventListener('click',doLogin);
  document.getElementById('ak').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  var key=document.getElementById('ak').value.trim();
  if(!key)return;
  var btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Laden...';
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(key)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(key)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(key))
    ]);
    if(!r1.ok)throw new Error('unauthorized');
    scans=await r1.json();
    callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    adminKey=key;
    document.getElementById('hdr-actions').style.display='flex';
    document.getElementById('btn-refresh').addEventListener('click',refreshData);
    document.getElementById('btn-logout').addEventListener('click',logout);
    renderDashboard();
  }catch(e){
    document.getElementById('login-err').style.display='block';
    btn.disabled=false;btn.textContent='Inloggen';
  }
}

function logout(){
  adminKey='';scans=[];callbacks=[];mnaList=[];rapporten=[];
  document.getElementById('hdr-actions').style.display='none';
  renderLogin();
}

async function refreshData(){
  try{
    var [r1,r2,r3,r4]=await Promise.all([
      fetch(WORKER+'/admin/scans?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/callbacks?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/mna/admin/lijst?key='+encodeURIComponent(adminKey)),
      fetch(WORKER+'/admin/rapporten?key='+encodeURIComponent(adminKey))
    ]);
    scans=await r1.json();
    callbacks=await r2.json();
    mnaList=r3.ok?await r3.json():[];
    try{var r4data=r4.ok?await r4.json().catch(()=>[]):[];rapporten=Array.isArray(r4data)?r4data:[];}catch(e){rapporten=[];}
    renderDashboard();
  }catch(e){alert('Kon niet verversen.');}
}

// DASHBOARD
function renderDashboard(){
  var avg=scans.length?Math.round(scans.reduce(function(a,s){return a+(s.overall||0);},0)/scans.length):0;
  var recent=scans.filter(function(s){return Date.now()-s.created_at<7*24*3600*1000;}).length;
  document.getElementById('app').innerHTML=
    '<div class="stats-row">'
    +'<div class="stat-card"><div class="stat-num">'+scans.length+'</div><div class="stat-lbl">Totaal scans</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+recent+'</div><div class="stat-lbl">7 dagen</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+(avg||'—')+'</div><div class="stat-lbl">Gem. score</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+callbacks.length+'</div><div class="stat-lbl">Terugbelverzoeken</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+mnaList.length+'</div><div class="stat-lbl">M&A Trajecten</div></div>'
    +'</div>'
    +'<div id="sys-waarschuwingen" style="margin-bottom:1.5rem"></div>'
    +'<div class="tabs">'
    +'<button class="tab'+(activeTab==='scans'?' active':'')+'" id="t-scans">Scans ('+scans.length+')</button>'
    +'<button class="tab'+(activeTab==='callbacks'?' active':'')+'" id="t-cb">Terugbelverzoeken ('+callbacks.length+')</button>'
    +'<button class="tab'+(activeTab==='mna'?' active':'')+'" id="t-mna">M&A Trajecten ('+mnaList.length+')</button>'
    +'<button class="tab'+(activeTab==='docs'?' active':'')+'" id="t-docs">Documenten</button>'
    +'<button class="tab'+(activeTab==='rapporten'?' active':'')+'" id="t-rapp">Scan rapporten ('+rapporten.length+')</button>'
    +'<button class="tab'+(activeTab==='benchmarks'?' active':'')+'" id="t-bench">Benchmarks</button>'
    +'<button class="tab'+(activeTab==='waardering'?' active':'')+'" id="t-waardering">&#9654; Waardering</button>'
    +'</div>'
    +'<div id="tc"></div>';
  document.getElementById('t-scans').addEventListener('click',function(){activeTab='scans';scanFilter='';openRow=null;renderDashboard();});
  document.getElementById('t-cb').addEventListener('click',function(){activeTab='callbacks';renderDashboard();});
  document.getElementById('t-mna').addEventListener('click',function(){activeTab='mna';renderDashboard();});
  document.getElementById('t-docs').addEventListener('click',function(){activeTab='docs';renderDashboard();});
  document.getElementById('t-rapp').addEventListener('click',function(){activeTab='rapporten';renderDashboard();});
  document.getElementById('t-bench').addEventListener('click',function(){activeTab='benchmarks';renderDashboard();});
  document.getElementById('t-waardering').addEventListener('click',function(){activeTab='waardering';renderDashboard();});
  renderTab();
  // Systeem waarschuwingen
  var swDiv=document.getElementById('sys-waarschuwingen');
  if(swDiv){
    var warns=[];
    // KvK productie key check
    warns.push('<div style="background:#fff8e1;border:1px solid #f0ad4e;border-radius:var(--r);padding:.6rem 1rem;font-size:12px;display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:16px">&#9888;&#65039;</span>'
      +'<span><strong>KvK API:</strong> Draait momenteel op test-key. <a href="https://developers.kvk.nl/" target="_blank" style="color:var(--teal)">Vraag productie key aan</a> en voeg toe als secret <code>KVK_API_KEY</code> in Cloudflare dashboard.</span>'
      +'<button onclick="this.parentElement.parentElement.remove()" style="margin-left:auto;background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:16px">&times;</button>'
      +'</div>');
    // Signhost nog niet gekoppeld
    warns.push('<div style="background:#f0f4ff;border:1px solid #7c9cbf;border-radius:var(--r);padding:.6rem 1rem;font-size:12px;display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:16px">&#128394;&#65039;</span>'
      +'<span><strong>Digitaal ondertekenen:</strong> Signhost nog niet gekoppeld. <a href="https://www.signhost.com/" target="_blank" style="color:var(--teal)">Account aanmaken</a> → API key ophalen → toevoegen als secret <code>SIGNHOST_API_KEY</code>.</span>'
      +'<button onclick="this.parentElement.parentElement.remove()" style="margin-left:auto;background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:16px">&times;</button>'
      +'</div>');
    swDiv.innerHTML=warns.join('');
  }
}

function renderTab(){
  var el=document.getElementById('tc');
  if(activeTab==='scans')renderScansTab(el);
  else if(activeTab==='callbacks')renderCallbacksTab(el);
  else if(activeTab==='mna')renderMnaTab(el);
  else if(activeTab==='docs')renderDocsTab(el);
  else if(activeTab==='benchmarks')renderBenchmarksTab(el);
  else if(activeTab==='waardering')renderWaarderingTab(el);
  else renderRapportenTab(el);
}

// SCANS TAB
function renderScansTab(el){
  var filtered=scans.filter(function(s){
    if(!scanFilter)return true;
    var q=scanFilter.toLowerCase();
    return (s.office_name||'').toLowerCase().includes(q)
      ||(s.region||'').toLowerCase().includes(q)
      ||(s.top_scenario||'').toLowerCase().includes(q)
      ||(s.group_name||'').toLowerCase().includes(q);
  });
  var html='<div class="table-wrap"><div class="table-hdr"><div class="table-title">Ingediende scans</div>'
    +'<div style="display:flex;gap:10px;align-items:center">'
    +'<input class="search-bar" id="ss" placeholder="Zoek op naam, regio, scenario..." value="'+esc(scanFilter)+'">'
    +'<button class="btn-red" id="btn-del-sel-scans" style="font-size:12px;padding:7px 14px;display:none">&#10005; Verwijder geselecteerde (<span id="sel-cnt-scans">0</span>)</button>'
    +'<button class="btn" style="font-size:12px;padding:7px 14px" id="btn-ref-s">&#8635; Verversen</button>'
    +'</div></div>';
  if(!filtered.length){
    html+='<div class="empty">Geen scans gevonden'+(scans.length?'. Filter: "'+esc(scanFilter)+'"':' — nog geen scans ingediend.')+'</div>';
  } else {
    html+='<table><thead><tr><th style="width:32px"><input type="checkbox" id="cb-all-scans" title="Alles"></th><th>Datum</th><th>Kantoor</th><th>Regio</th><th>Fte</th><th>Omzet</th><th>Score</th><th>Scenario</th><th>Groep</th><th></th></tr></thead><tbody>';
    filtered.forEach(function(s,i){
      var scores='';
      if(s.scores){
        try{
          var sc=typeof s.scores==='string'?JSON.parse(s.scores):s.scores;
          scores=Object.entries(sc).map(function(kv){
            return '<div class="detail-item"><div class="detail-label">'+esc(kv[0])+'</div>'
              +'<div class="detail-val" style="color:'+(kv[1]>=70?'var(--teal)':kv[1]>=50?'var(--gold)':'var(--red)')+'">'+kv[1]+'/100</div></div>';
          }).join('');
        }catch(e){}
      }
      html+='<tr data-i="'+i+'" style="cursor:pointer"><td onclick="event.stopPropagation()"><input type="checkbox" class="scan-cb" data-id="'+( s.id||'')+'" style="cursor:pointer"></td>'
        +'<td class="mono" style="font-size:11px;white-space:nowrap">'+formatDate(s.created_at)+'</td>'
        +'<td style="font-weight:500;color:var(--head)">'+esc(s.office_name||'Anoniem')+'</td>'
        +'<td>'+esc(s.region||'—')+'</td>'
        +'<td>'+(s.fte||'—')+'</td>'
        +'<td>'+(s.revenue||'—')+'</td>'
        +'<td><span class="score-badge '+dc(s.overall)+'">'+(s.overall||'—')+'</span></td>'
        +'<td><span class="tag">'+esc((s.top_scenario||'—').split(' ').slice(0,2).join(' '))+'</span></td>'
        +'<td style="font-size:11px;color:var(--muted)">'+esc(s.group_name||s.group_id||'Solo')+'</td>'
        +'<td style="white-space:nowrap;display:flex;gap:4px;align-items:center">'+(openRow===i?'▲':'▼')
        +' <button class="btn-ghost btn-maak-traject" data-id="'+(s.id||'')+'" data-naam="'+esc(s.office_name||'Anoniem')+'" data-email="'+esc(s.office_email||'')+'" style="font-size:10px;padding:2px 8px;color:var(--teal)">&#43; Traject</button>'
        +' <button class="btn-del-scan btn-red" data-id="'+(s.id||'')+'" style="font-size:10px;padding:2px 6px">&#10005;</button></td>'
        +'</tr>'
        +'<tr><td colspan="10" style="padding:0"><div class="detail-panel'+(openRow===i?' open':'')+'"><div class="detail-grid">'
        +(scores||'<div style="color:var(--muted);font-size:12px">Geen scoredata.</div>')
        +'</div></div></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';
  el.innerHTML=html;
  var inp=document.getElementById('ss');
  if(inp)inp.addEventListener('input',function(){scanFilter=this.value;renderTab();});
  var rb=document.getElementById('btn-ref-s');
  if(rb)rb.addEventListener('click',refreshData);
  el.querySelectorAll('tr[data-i]').forEach(function(r){
    r.addEventListener('click',function(){
      var i=parseInt(r.dataset.i);openRow=openRow===i?null:i;renderTab();
    });
  });
  el.querySelectorAll('.btn-del-scan').forEach(function(b){
    b.addEventListener('click',function(e){e.stopPropagation();deleteScan(b.dataset.id);});
  });
  el.querySelectorAll('.btn-maak-traject').forEach(function(b){
    b.addEventListener('click',function(e){e.stopPropagation();maakTrajectVanScan(b.dataset.id,b.dataset.naam,b.dataset.email);});
  });
  function updSelScans(){var n=el.querySelectorAll('.scan-cb:checked').length;var btn=document.getElementById('btn-del-sel-scans');var cnt=document.getElementById('sel-cnt-scans');if(btn)btn.style.display=n>0?'inline-block':'none';if(cnt)cnt.textContent=n;}
  var cbAllS=document.getElementById('cb-all-scans');
  if(cbAllS)cbAllS.addEventListener('change',function(){el.querySelectorAll('.scan-cb').forEach(function(cb){cb.checked=cbAllS.checked;});updSelScans();});
  el.querySelectorAll('.scan-cb').forEach(function(cb){cb.addEventListener('change',updSelScans);});
  var btnDelS=document.getElementById('btn-del-sel-scans');
  if(btnDelS)btnDelS.addEventListener('click',async function(){var ids=Array.from(el.querySelectorAll('.scan-cb:checked')).map(function(cb){return cb.dataset.id;});if(!ids.length)return;if(!confirm('Verwijder '+ids.length+' scan(s)?'))return;btnDelS.disabled=true;btnDelS.textContent='Verwijderen...';for(var i=0;i<ids.length;i++){try{await fetch(WORKER+'/admin/delete/scan/'+ids[i]+'?key='+encodeURIComponent(adminKey),{method:'POST'});}catch(e){}}await refreshData();});
}

// CALLBACKS TAB

      if(!bron||!datum||!file){err.style.display='block';err.textContent='Vul alle velden in en selecteer een PDF.';return;}
      var btn=document.getElementById('pdf-ok');
      // Als al geanalyseerd en bevestigd: sla op zonder opnieuw analyseren
      if(btn.dataset.confirmed==='1'){
        btn.disabled=true;btn.textContent='Opslaan...';
        var gevonden2=btn._gevonden||[];
        for(var bi=0;bi<gevonden2.length;bi++){
          await fetch(WORKER+'/admin/benchmarks/update?key='+encodeURIComponent(adminKey),{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sleutel:gevonden2[bi].sleutel,waarde:gevonden2[bi].waarde,categorie:gevonden2[bi].categorie||'algemeen',omschrijving:gevonden2[bi].omschrijving,bron:bron,peildatum:datum})
          }).catch(function(){});
        }
        status.textContent='&#10003; '+gevonden2.length+' benchmarks opgeslagen.';
        status.style.background='var(--teal-bg)';status.style.color='var(--teal)';
        btn.textContent='Klaar';btn.dataset.confirmed='';
        laadBenchmarks();
        return;
      }
      btn.disabled=true;btn.textContent='Analyseren...';
      err.style.display='none';
      status.style.display='block';status.textContent='PDF inlezen...';
      try{
        // PDF naar base64
        var b64=await new Promise(function(res,rej){
          var r=new FileReader();
          r.onload=function(){res(r.result.split(',')[1]);};
          r.onerror=function(){rej(new Error('Lezen mislukt'));};
          r.readAsDataURL(file);
        });
        status.textContent='AI analyseert PDF... (30-60 seconden)';
        // Stuur naar worker die AI aanroept
        var resp=await fetch(WORKER+'/admin/benchmarks/pdf-analyse?key='+encodeURIComponent(adminKey),{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pdf_base64:b64,bron:bron,peildatum:datum,bestandsnaam:file.name})
        });
        var data=await resp.json();
        if(!resp.ok||data.error)throw new Error(data.error||'Analyse mislukt');
        var gevonden=data.benchmarks||[];
        if(!gevonden.length)throw new Error('Geen benchmarkwaarden gevonden in dit document.');
        // Haal huidige benchmarks op voor conflict check
        var huidig={};
        try{var br=await fetch(WORKER+'/benchmarks');var bd=await br.json();bd.forEach(function(b){huidig[b.sleutel]=b;});}catch(e){}
        // Bouw preview met conflict waarschuwingen
        var conflicten=gevonden.filter(function(b){return huidig[b.sleutel]&&Math.abs(huidig[b.sleutel].waarde-b.waarde)>1;});
        var pvHtml='<strong style="color:var(--head)">'+gevonden.length+' waarden gevonden'+(conflicten.length?' &mdash; <span style="color:var(--gold)">'+conflicten.length+' conflict(en)</span>':'')+':</strong><br><br>';
        gevonden.forEach(function(b){
          var hv=huidig[b.sleutel];
          var conflict=hv&&Math.abs(hv.waarde-b.waarde)>1;
          var nvFmt=b.waarde>1000?'€'+(b.waarde/1000).toFixed(0)+'K':b.waarde.toFixed(2)+'x';
          if(conflict){
            var ovFmt=hv.waarde>1000?'€'+(hv.waarde/1000).toFixed(0)+'K':hv.waarde.toFixed(2)+'x';
            pvHtml+='<div style="padding:6px 10px;margin-bottom:4px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0">'
              +'<span style="color:var(--gold)">&#9888; Conflict</span> <code>'+b.sleutel+'</code><br>'
              +'Huidig ('+esc(hv.bron||'onbekend')+'): <strong>'+ovFmt+'</strong> → Nieuw ('+esc(bron)+'): <strong>'+nvFmt+'</strong></div>';
          } else {
            pvHtml+='<div style="padding:4px 0;font-size:12px">&#10003; <code>'+b.sleutel+'</code>: '+nvFmt+(hv?' (ongewijzigd)':' (nieuw)')+'</div>';
          }
        });
        preview.style.display='block';preview.innerHTML=pvHtml;
        if(conflicten.length){
          status.style.display='block';status.textContent='&#9888; Controleer de conflicten hierboven. Klik Opslaan om alle waarden te overschrijven.';
          status.style.background='var(--gold-bg)';status.style.color='var(--gold)';
          btn._gevonden=gevonden;
          btn.disabled=false;btn.textContent='Toch opslaan';
          btn.dataset.confirmed='1';
        } else {
          status.textContent='&#10003; '+gevonden.length+' benchmarks opgeslagen in D1.';
          btn.textContent='Klaar';
          laadBenchmarks();
        }
      }catch(e){
        err.style.display='block';err.textContent='Fout: '+e.message;
        btn.disabled=false;btn.textContent='Opnieuw proberen';
        status.style.display='none';
      }
    });
  });

  document.getElementById('btn-bench-add').addEventListener('click',function(){
    var ov=document.createElement('div');ov.className='overlay';
    var mo=document.createElement('div');mo.className='modal';
    mo.innerHTML='<div class="modal-title">Benchmark handmatig toevoegen</div>'
      +'<div class="field"><label>Sleutel (uniek ID) <span style="color:var(--red)">*</span></label><input type="text" id="bm-id" placeholder="bijv. noab_ebitda_marge"></div>'
      +'<div class="field"><label>Omschrijving</label><input type="text" id="bm-omschr" placeholder="bijv. EBITDA marge benchmark NOAB 2025"></div>'

      +'<div class="field"><label>Categorie</label><select id="bm-cat"><option value="productiviteit">Productiviteit</option><option value="winstgevendheid">Winstgevendheid</option><option value="waardering">Waardering</option><option value="tarieven">Tarieven</option><option value="algemeen">Algemeen</option></select></div>'
      +'<div class="field"><label>Bron</label><input type="text" id="bm-bron" placeholder="bijv. NOAB/Fiscount Benchmark 2025"></div>'
      +'<div class="field"><label>Bron URL (optioneel)</label><input type="text" id="bm-url" placeholder="https://..."></div>'
      +'<div class="field"><label>Peildatum</label><input type="text" id="bm-datum" placeholder="bijv. 2025-Q3 of 2025"></div>'
      +'<div id="bm-err" style="color:var(--red);font-size:12px;margin-bottom:.5rem;display:none"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" id="bm-ann">Annuleren</button><button class="btn" id="bm-ok">Opslaan</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('bm-ann').addEventListener('click',function(){document.body.removeChild(ov);});
    document.getElementById('bm-ok').addEventListener('click',async function(){
      var id=document.getElementById('bm-id').value.trim();
      var val=parseFloat(document.getElementById('bm-val').value);
      var err=document.getElementById('bm-err');
      if(!id||isNaN(val)){err.style.display='block';err.textContent='Sleutel en waarde zijn verplicht.';return;}
      var btn=document.getElementById('bm-ok');
      // Conflict check: huidige waarde ophalen
      if(!btn.dataset.confirmed){
        try{
          var chkR=await fetch(WORKER+'/benchmarks');
          var chkD=await chkR.json();
          var bestaand=chkD.find(function(b){return b.sleutel===id;});
          if(bestaand&&Math.abs(bestaand.waarde-val)>0.01){
            var ovFmt2=bestaand.waarde>1000?'€'+(bestaand.waarde/1000).toFixed(0)+'K':bestaand.waarde.toFixed(2)+'x';
            var nvFmt2=val>1000?'€'+(val/1000).toFixed(0)+'K':val.toFixed(2)+'x';
            err.style.display='block';
            err.style.color='var(--gold)';
            err.innerHTML='&#9888; Huidige waarde: <strong>'+ovFmt2+'</strong> ('+esc(bestaand.bron||'onbekend')+')<br>Nieuwe waarde: <strong>'+nvFmt2+'</strong><br><br>Klik nogmaals op Opslaan om te overschrijven.';
            btn.dataset.confirmed='1';
            return;
          }
        }catch(eCk){}
      }
      btn.dataset.confirmed='';
      btn.disabled=true;btn.textContent='Opslaan...';
      try{
        var r=await fetch(WORKER+'/admin/benchmarks/update?key='+encodeURIComponent(adminKey),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({sleutel:id,waarde:val,categorie:document.getElementById('bm-cat').value,omschrijving:document.getElementById('bm-omschr').value.trim(),bron:document.getElementById('bm-bron').value.trim(),bron_url:document.getElementById('bm-url').value.trim(),peildatum:document.getElementById('bm-datum').value.trim()})
        });
        var d=await r.json();
        if(d.ok){document.body.removeChild(ov);laadBenchmarks();}
        else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Opslaan';}
      }catch(e2){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Opslaan';}
    });
  });
}

function renderWaarderingTab(el){
  var selectedTraject=null;
  var bms={};
  var W={omzet1:0,omzet2:0,omzet3:0,ebitda:0,fte:0,aantalKlanten:0,recurring:0,churn:0,marge:0,
    multiLaag:4.6,multiMid:5.05,multiHoog:5.5,omzetFactor:0.8,risico:0,
    earnBase:0,earnPct:20,earnTarget:5,earnJaren:3,earnMinimum:0};

  function parseGeld(s){if(!s)return 0;var n=String(s).replace(/[^0-9,.]/g,'').replace(',','.');return parseFloat(n)||0;}
  function fmtGeld(n){if(!n||isNaN(n))return '—';if(n>=1000000)return '\u20ac'+(n/1000000).toFixed(2).replace('.',',')+' mln';if(n>=1000)return '\u20ac'+(n/1000).toFixed(0)+'.000';return '\u20ac'+Math.round(n);}
  function fmtPct(n){return n?n.toFixed(1)+'%':'—';}

  function bereken(){
    var o3=W.omzet3||0;
    var ebitdaAmt=o3*(W.ebitda/100);
    var waardeMultiLaag=ebitdaAmt*W.multiLaag*(1-W.risico/100);
    var waardeMultiMid=ebitdaAmt*W.multiMid*(1-W.risico/100);
    var waardeMultiHoog=ebitdaAmt*W.multiHoog*(1-W.risico/100);
    var waardeOmzet=o3*W.omzetFactor*(1-W.risico/100);
    // Rolling forecast: gemiddelde groei berekenen
    var groei=0,groeiSteps=0;
    if(W.omzet1>0&&W.omzet2>0){groei+=(W.omzet2-W.omzet1)/W.omzet1*100;groeiSteps++;}
    if(W.omzet2>0&&W.omzet3>0){groei+=(W.omzet3-W.omzet2)/W.omzet2*100;groeiSteps++;}
    var gemGroei=groeiSteps>0?groei/groeiSteps:3;
    var fc=[o3];
    for(var i=1;i<=3;i++)fc.push(fc[fc.length-1]*(1+gemGroei/100));
    var fcEbitda=fc.map(function(o){return o*(W.ebitda/100);});
    var fcWaarde=fcEbitda.map(function(e){return e*W.multiMid*(1-W.risico/100);});
    // Earn-out
    var koopsom=W.earnBase||waardeMultiMid;
    var earnTotaal=0;var earnSchema=[];
    for(var j=1;j<=W.earnJaren;j++){
      var targetOmzet=o3*(1+W.earnTarget/100*j);
      var uitkering=Math.max(W.earnMinimum,koopsom*(W.earnPct/100)/W.earnJaren);
      earnTotaal+=uitkering;
      earnSchema.push({jaar:j,target:targetOmzet,uitkering:uitkering});
    }
    return {ebitdaAmt,waardeMultiLaag,waardeMultiMid,waardeMultiHoog,waardeOmzet,gemGroei,fc,fcEbitda,fcWaarde,koopsom,earnTotaal,earnSchema};
  }

    var html='<div class="table-wrap" style="margin-bottom:1.5rem">'

    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem">'

      +'<option value="">— Selecteer traject —</option>'

      +'</select></div>'
      +'<div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Risico-aftrek (%)</div>'
      +'<input type="number" id="w-risico" value="'+W.risico+'" min="0" max="50" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 11px;font-size:13px"></div>'
      +'<div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Omzetfactor (×)</div>'
      +'<input type="number" id="w-omzetfactor" value="'+W.omzetFactor+'" step="0.05" min="0.3" max="2" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:8px 11px;font-size:13px"></div>'

        else if(id==='w-omzet3')W.omzet3=parseGeld(this.value);
        else if(id==='w-ebitda')W.ebitda=parseFloat(this.value)||0;
        else if(id==='w-fte')W.fte=parseFloat(this.value)||0;
        else if(id==='w-risico')W.risico=parseFloat(this.value)||0;
        else if(id==='w-omzetfactor')W.omzetFactor=parseFloat(this.value)||0.8;
        else if(id==='w-multi-laag')W.multiLaag=parseFloat(this.value)||4.6;

        else if(id==='w-multi-hoog')W.multiHoog=parseFloat(this.value)||5.5;

        // Herrender alleen resultaten zonder volledige re-render
        var res2=bereken();

        var boxes=document.querySelectorAll('#tc .stat-num');
        // Herrender module
        var cur=document.getElementById('w-traject');var curVal=cur?cur.value:'';
        selectedTraject=curVal;
        el.innerHTML=renderModule();bindWaardering();
      });

    // AI waarderingsrapport
    var aiBt=document.getElementById('w-ai-btn');

      var prompt='Je bent Marcel Bisschops, senior M&A-adviseur gespecialiseerd in accountants- en administratiekantoren.\n\n'
        +'Schrijf een professioneel waarderingsrapport voor traject: '+trajectNaam+'\n\n'
        +'FINANCIËLE DATA:\n'
        +'- Omzet jaar 1: '+fmtGeld(W.omzet1)+'\n'
        +'- Omzet jaar 2: '+fmtGeld(W.omzet2)+'\n'
        +'- Omzet jaar 3 (meest recent): '+fmtGeld(W.omzet3)+'\n'
        +'- EBITDA-marge: '+W.ebitda+'%\n'
        +'- EBITDA absoluut: '+fmtGeld(res3.ebitdaAmt)+'\n'
        +'- FTE: '+W.fte+'\n'
        +'- Recurring omzet: '+W.recurring+'%\n'
        +'- Klantverloop: '+W.churn+'%\n\n'
        +'WAARDERING AS-IS:\n'
        +'- EBITDA-methode laag: '+fmtGeld(res3.waardeMultiLaag)+' ('+W.multiLaag+'×)\n'
        +'- EBITDA-methode midden: '+fmtGeld(res3.waardeMultiMid)+' ('+W.multiMid+'×)\n'
        +'- EBITDA-methode hoog: '+fmtGeld(res3.waardeMultiHoog)+' ('+W.multiHoog+'×)\n'
        +'- Omzetmethode: '+fmtGeld(res3.waardeOmzet)+'\n'
        +'- Risico-aftrek: '+W.risico+'%\n\n'
        +'ROLLING FORECAST:\n'
        +'- Gem. historische groei: '+res3.gemGroei.toFixed(1)+'%/jaar\n'
        +res3.fc.map(function(o,i){return '- '+(i===0?'Huidig':'Jaar +'+i)+': omzet '+fmtGeld(o)+', EBITDA '+fmtGeld(res3.fcEbitda[i])+', waarde ~'+fmtGeld(res3.fcWaarde[i]);}).join('\n')+'\n\n'
        +'EARN-OUT STRUCTUUR:\n'

      try{
        var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:8000})});
        var rd=await resp.json();

        +'<td><span class="tag" style="font-size:9px">'+esc((r.top_scenario||'—').split(' ').slice(0,2).join(' '))+'</span></td>'

async function leesRapport(id){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.className='modal';mo.style.maxWidth='800px';
  mo.innerHTML='<div class="modal-title">Laden...</div>'
    +'<div id="rapp-body" style="font-size:13px;color:var(--mid);line-height:1.8;max-height:65vh;overflow-y:auto;margin-bottom:1rem"></div>'
    +'<div style="display:flex;justify-content:flex-end"><button class="btn-ghost" id="rapp-sluit">Sluiten</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('rapp-sluit').addEventListener('click',function(){document.body.removeChild(ov);});
  try{
    var r=await fetch(WORKER+'/admin/rapport/'+id+'?key='+encodeURIComponent(adminKey));
    var d=await r.json();
    mo.querySelector('.modal-title').textContent=(d.kantoor_naam||'Rapport')+' — score '+d.overall+' — '+formatDate(d.created_at);
    var rb=document.getElementById('rapp-body');
    if(d.rapport_tekst){
      var txt=d.rapport_tekst
        .replace(/## (.+)/g,'<h3 style="font-family:Playfair Display,serif;font-size:1rem;color:var(--head);font-weight:600;margin:1.25rem 0 .5rem;border-top:1px solid var(--border);padding-top:1rem">$1</h3>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      txt=txt.split('\n\n').map(function(p){p=p.trim();if(!p||p.startsWith('<'))return p;return '<p>'+p+'</p>';}).join('');


      rb.innerHTML=txt;
    } else {
      rb.textContent='Geen rapport tekst.';
    }
  }catch(e){document.getElementById('rapp-body').textContent='Fout: '+e.message;}
}

async function verwijderRapport(id){
  if(!confirm('Rapport permanent verwijderen?'))return;
  try{
    var r=await fetch(WORKER+'/admin/delete/rapport/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST'});
    var d=await r.json();
    if(d.ok){rapporten=rapporten.filter(function(x){return x.id!==id;});renderDashboard();}
    else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}

    +'<div style="border-bottom:1px solid var(--border);margin:.75rem 0 .75rem;padding-bottom:.25rem"><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Koper</div></div>'
    +'<div class="field"><label>Naam koper</label><input type="text" id="bw-koper-naam" value="'+esc(t.koper_naam||'')+'"></div>'
    +'<div class="field"><label>Rechtsvorm</label><input type="text" id="bw-koper-rv" value="'+esc(t.koper_rechtsvorm||'')+'"></div>'
    +'<div class="field"><label>Contactpersoon koper</label><input type="text" id="bw-koper-contact" value="'+esc(t.koper_contact||'')+'"></div>'
    +'<div class="field"><label>E-mail koper</label><input type="email" id="bw-koper-email" value="'+esc(t.koper_email||'')+'"></div>'
    +'<div class="field"><label>KvK-nummer koper</label><div style="display:flex;gap:6px"><input type="text" id="bw-koper-kvk" value="'+esc(t.koper_kvk||'')+'" style="flex:1"><button type="button" id="bw-btn-kvk-koper" class="btn-ghost" style="font-size:11px;padding:6px 10px">&#128269; KvK</button></div></div>'
    +'<div class="field"><label>Adres koper</label><input type="text" id="bw-koper-adres" value="'+esc(t.koper_adres||'')+'"></div>'
    +'<div id="bw-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.5rem"></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:.5rem"><button class="btn-ghost" id="bw-ann">Annuleren</button><button class="btn" id="bw-ok">&#10003; Opslaan</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('bw-ann').addEventListener('click',function(){document.body.removeChild(ov);});

  // KvK knoppen in bewerk modal
  document.getElementById('bw-btn-kvk-verk').addEventListener('click',async function(){
    var kvk=document.getElementById('bw-kvk').value.trim().replace(/[^0-9]/g,'');
    if(kvk.length!==8){alert('8 cijfers vereist');return;}
    this.textContent='...';this.disabled=true;
    var rk=await fetch(WORKER+'/kvk/'+kvk);var dk=await rk.json();
    if(dk.ok){if(dk.adres)document.getElementById('bw-adres').value=dk.adres;}
    else alert(dk.error||'Niet gevonden');
    this.textContent='&#128269; KvK';this.disabled=false;
  });
  document.getElementById('bw-btn-kvk-koper').addEventListener('click',async function(){
    var kvk=document.getElementById('bw-koper-kvk').value.trim().replace(/[^0-9]/g,'');
    if(kvk.length!==8){alert('8 cijfers vereist');return;}
    this.textContent='...';this.disabled=true;
    var rk=await fetch(WORKER+'/kvk/'+kvk);var dk=await rk.json();
    if(dk.ok){
      if(dk.adres)document.getElementById('bw-koper-adres').value=dk.adres;
      if(dk.rechtsvorm&&!document.getElementById('bw-koper-rv').value)document.getElementById('bw-koper-rv').value=dk.rechtsvorm;
    } else alert(dk.error||'Niet gevonden');
    this.textContent='&#128269; KvK';this.disabled=false;
  });

  document.getElementById('bw-ok').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;btn.textContent='Opslaan...';
    var err=document.getElementById('bw-err');err.style.display='none';
    try{
      var resp=await fetch(WORKER+'/mna/admin/update/'+id+'?key='+encodeURIComponent(adminKey),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          kantoor_naam:document.getElementById('bw-k').value.trim(),
          contact_naam:document.getElementById('bw-c').value.trim(),
          contact_email:document.getElementById('bw-e').value.trim(),
          verkoper_kvk:document.getElementById('bw-kvk').value.trim(),
          verkoper_adres:document.getElementById('bw-adres').value.trim(),
          begeleider_naam:document.getElementById('bw-bg-naam').value.trim(),
          begeleider_email:document.getElementById('bw-bg-email').value.trim(),
          koper_naam:document.getElementById('bw-koper-naam').value.trim(),
          koper_rechtsvorm:document.getElementById('bw-koper-rv').value.trim(),
          koper_contact:document.getElementById('bw-koper-contact').value.trim(),
          koper_email:document.getElementById('bw-koper-email').value.trim(),
          koper_kvk:document.getElementById('bw-koper-kvk').value.trim(),
          koper_adres:document.getElementById('bw-koper-adres').value.trim()
        })
      });
      var rd=await resp.json();
      if(rd.ok){
        // Update lokale mnaList
        var tIdx=mnaList.findIndex(function(x){return x.id===id;});
        if(tIdx>=0){
          mnaList[tIdx].kantoor_naam=document.getElementById('bw-k').value.trim();
          mnaList[tIdx].begeleider_naam=document.getElementById('bw-bg-naam').value.trim();
          mnaList[tIdx].begeleider_email=document.getElementById('bw-bg-email').value.trim();
          mnaList[tIdx].koper_naam=document.getElementById('bw-koper-naam').value.trim();
        }
        document.body.removeChild(ov);
        renderTab();
      } else {err.style.display='block';err.textContent='Fout: '+(rd.error||'onbekend');btn.disabled=false;btn.textContent='Opslaan';}
    }catch(e){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Opslaan';}
  });
}

    try{
      var url=kvk.length===8?WORKER+'/kvk/'+kvk:WORKER+'/kvk/00000000?naam='+encodeURIComponent(naam);
      var r=await fetch(url);var d=await r.json();
      if(d.ok&&d.eerste){
        if(d.eerste.adres)document.getElementById('m-adres').value=d.eerste.adres;
        if(d.eerste.naam&&!document.getElementById('m-k').value)document.getElementById('m-k').value=d.eerste.naam;
        if(d.eerste.kvkNummer)document.getElementById('m-kvk').value=d.eerste.kvkNummer;
        kvkVerkBtn.textContent='✓ Ingevuld';
        setTimeout(function(){kvkVerkBtn.textContent='↻ Ophalen';kvkVerkBtn.disabled=false;},2000);
      } else {alert('KvK: '+(d.error||'Niet gevonden'));kvkVerkBtn.disabled=false;kvkVerkBtn.textContent='↻ Ophalen';}
    }catch(e){alert('Fout: '+e.message);kvkVerkBtn.disabled=false;kvkVerkBtn.textContent='↻ Ophalen';}
  });

  // KvK ophalen koper
  var kvkKopBtn=document.getElementById('btn-kvk-koper');
  if(kvkKopBtn)kvkKopBtn.addEventListener('click',async function(){
    var kvk=document.getElementById('m-koper-kvk').value.trim().replace(/[^0-9]/g,'');
    var naam=document.getElementById('m-koper-naam').value.trim();
    if(!kvk&&!naam){alert('Vul eerst een KvK-nummer of naam koper in.');return;}
    kvkKopBtn.disabled=true;kvkKopBtn.textContent='Ophalen...';
    try{
      var url=kvk.length===8?WORKER+'/kvk/'+kvk:WORKER+'/kvk/00000000?naam='+encodeURIComponent(naam);
      var r=await fetch(url);var d=await r.json();
      if(d.ok&&d.eerste){
        if(d.eerste.adres)document.getElementById('m-koper-adres').value=d.eerste.adres;
        if(d.eerste.naam&&!document.getElementById('m-koper-naam').value)document.getElementById('m-koper-naam').value=d.eerste.naam;
        if(d.eerste.kvkNummer)document.getElementById('m-koper-kvk').value=d.eerste.kvkNummer;
        if(d.eerste.rechtsvorm&&!document.getElementById('m-koper-rv').value)document.getElementById('m-koper-rv').value=d.eerste.rechtsvorm;
        kvkKopBtn.textContent='✓ Ingevuld';
        setTimeout(function(){kvkKopBtn.textContent='↻ Ophalen';kvkKopBtn.disabled=false;},2000);
      } else {alert('KvK: '+(d.error||'Niet gevonden'));kvkKopBtn.disabled=false;kvkKopBtn.textContent='↻ Ophalen';}
    }catch(e){alert('Fout: '+e.message);kvkKopBtn.disabled=false;kvkKopBtn.textContent='↻ Ophalen';}
  });

  document.getElementById('m-ok').addEventListener('click',async function(){
    var kantoor=document.getElementById('m-k').value.trim();
    if(!kantoor){var er=document.getElementById('m-err');er.style.display='block';er.textContent='Kantoornaam is verplicht.';return;}
    var btn=document.getElementById('m-ok');btn.disabled=true;btn.textContent='Aanmaken...';
    document.getElementById('m-err').style.display='none';
    try{
      var r=await fetch(WORKER+'/mna/create',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
        body:JSON.stringify({kantoor_naam:kantoor,contact_naam:document.getElementById('m-c').value.trim(),contact_email:document.getElementById('m-e').value.trim(),traject_type:document.getElementById('m-t').value,notitie:document.getElementById('m-n').value.trim(),begeleider_naam:document.getElementById('m-bg-naam').value.trim()||'Marcel Bisschops',begeleider_email:document.getElementById('m-bg-email').value.trim()||'marcel@bisschopsfinancing.nl',koper_naam:document.getElementById('m-koper-naam').value.trim(),koper_rechtsvorm:document.getElementById('m-koper-rv').value.trim(),koper_contact:document.getElementById('m-koper-contact').value.trim(),koper_email:document.getElementById('m-koper-email').value.trim(),koper_adres:document.getElementById('m-koper-adres')?document.getElementById('m-koper-adres').value.trim():'',koper_kvk:document.getElementById('m-koper-kvk')?document.getElementById('m-koper-kvk').value.trim():'',verkoper_adres:document.getElementById('m-adres')?document.getElementById('m-adres').value.trim():'',verkoper_kvk:document.getElementById('m-kvk')?document.getElementById('m-kvk').value.trim():''})});
      var d=await r.json();
      if(d.ok){
        mnaList.unshift({id:d.code,kantoor_naam:kantoor,traject_type:document.getElementById('m-t').value,koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});
        var res=document.getElementById('m-res');res.style.display='block';
        res.innerHTML='<strong style="color:var(--teal-dim)">&#10003; Traject aangemaakt</strong><br>'
          +'<b>Verkoperscode:</b> <span class="code-chip">'+d.code+'</span> <button class="copy-btn res-copy" data-copy="'+d.code+'">⎘ Kopieer</button><br>'
          +'<b>Koperscode:</b> <span class="code-chip" style="background:var(--gold-bg);color:var(--gold);border-color:var(--gold)">'+d.koper_code+'</span> <button class="copy-btn res-copy" data-copy="'+d.koper_code+'">⎘ Kopieer</button><br>'
          +'<b>Tussenpersoon:</b> <span class="code-chip" style="background:var(--card);color:var(--mid)">'+d.tussen_code+'</span> <button class="copy-btn res-copy" data-copy="'+d.tussen_code+'">⎘ Kopieer</button>'+(document.getElementById('m-bg-email')&&document.getElementById('m-bg-email').value?' <span style="font-size:11px;color:var(--muted)">→ '+esc(document.getElementById('m-bg-email').value)+'</span>':'')+'<br><br>'
          +'<button id="res-opslaan" style="font-size:12px;padding:5px 12px;border:1px solid var(--teal-dark);border-radius:var(--r);cursor:pointer;background:transparent;color:var(--teal)">&#8681; Opslaan als bestand</button>';
        res.querySelectorAll('.res-copy').forEach(function(b){b.addEventListener('click',function(){navigator.clipboard.writeText(b.dataset.copy).then(function(){var o=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=o;},1500);});});});
        document.getElementById('res-opslaan').addEventListener('click',function(){slaOp({id:d.code,kantoor_naam:kantoor,traject_type:document.getElementById('m-t').value,koper_code:d.koper_code,tussen_code:d.tussen_code,created_at:Date.now()});});
        btn.textContent='Aangemaakt';
        var annBtn=document.getElementById('m-ann');
        annBtn.textContent='Sluiten';
        annBtn.onclick=function(){document.body.removeChild(ov);renderTab();};
      }else{var er2=document.getElementById('m-err');er2.style.display='block';er2.textContent='Fout: '+(d.error||'onbekend');btn.disabled=false;btn.textContent='Traject aanmaken';}
    }catch(e){var er3=document.getElementById('m-err');er3.style.display='block';er3.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Traject aanmaken';}
  });
}

function slaOp(t){
  var inhoud='KantoorInzicht \u2014 M&A Traject\n\nKantoor: '+(t.kantoor_naam||'—')+'\nType: '+(t.traject_type||'—')+'\nStatus: '+(t.status||'actief')+'\nAangemaakt: '+formatDate(t.created_at)+'\n\nCODES\nVerkoperscode: '+t.id+'\nKoperscode: '+(t.koper_code||'—')+'\nTussenpersoonscode: '+(t.tussen_code||'—')+'\n\nToegang via: https://koersvoormorgen.nl/mna.html';
  var blob=new Blob([inhoud],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='traject-'+t.id+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function vergrendel(id,naam){
  if(!confirm('Traject '+naam+' vergrendelen?'))return;
  try{
    var r=await fetch(WORKER+'/mna/admin/vergrendel/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST'});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='vergrendeld';renderTab();}
    else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}

async function ontvergrendel(id){
  try{
    var r=await fetch(WORKER+'/mna/admin/status/'+id+'?key='+encodeURIComponent(adminKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'actief'})});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='actief';renderTab();}
    else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}

async function maakTrajectVanScan(scanId, naam, email){
  if(!confirm('M&A traject aanmaken voor '+naam+'?'))return;
  try{
    var r=await fetch(WORKER+'/mna/scan-to-traject?key='+encodeURIComponent(adminKey),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scan_id:scanId,kantoor_naam:naam,contact_email:email,traject_type:'Verkoop'})
    });
    var d=await r.json();
    if(d.ok){
      mnaList.unshift({id:d.code,kantoor_naam:naam,traject_type:'Verkoop',koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});
      alert('Traject aangemaakt!\n\nVerkoperscode: '+d.code+'\nKoperscode: '+d.koper_code);
      activeTab='mna';renderDashboard();
    } else alert('Fout: '+(d.error||'onbekend'));
  }catch(e){alert('Verbindingsfout.');}
}
