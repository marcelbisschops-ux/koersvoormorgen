    +'<div style="background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r2);padding:1rem;margin-bottom:1.25rem">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-dim);margin-bottom:.4rem">Tussenpersoon-code</div>'
    +'<div style="font-family:IBM Plex Mono,monospace;font-size:1.4rem;font-weight:600;color:var(--teal);letter-spacing:.2em">'+esc(tussenCode||'—')+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:.3rem">Inloggen op: '+mnaUrl+'</div>'
    +'</div>'
    +'<div class="field"><label>E-mail begeleider <span style="color:var(--red)">*</span></label><input type="email" id="bg-email-input" placeholder="E-mailadres begeleider"></div>'
    +'<div class="field"><label>Naam begeleider</label><input type="text" id="bg-naam-input" placeholder="Naam begeleider"></div>'
    +'<div class="field"><label>Persoonlijk bericht (optioneel)</label><textarea id="bg-bericht-input" rows="3" placeholder="Voeg eventueel een persoonlijk bericht toe..."></textarea></div>'
    +'<div id="bg-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.5rem"></div>'
    +'<div id="bg-ok" style="display:none;color:var(--teal);font-size:13px;margin-bottom:.5rem">&#10003; Uitnodiging verstuurd!</div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +'<button class="btn-ghost" id="bg-ann">Annuleren</button>'
    +'<button class="btn-ghost" id="bg-kopieer" style="color:var(--teal);border-color:var(--teal)">&#8690; Kopieer code</button>'
    +'<button class="btn" id="bg-verstuur">&#9993; Stuur uitnodiging</button>'
    +'</div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('bg-ann').addEventListener('click',function(){document.body.removeChild(ov);});
  document.getElementById('bg-kopieer').addEventListener('click',function(){
    var tekst=tussenCode+'\n'+mnaUrl;
    navigator.clipboard.writeText(tekst).then(function(){var o=document.getElementById('bg-kopieer').textContent;document.getElementById('bg-kopieer').textContent='✓ Gekopieerd';setTimeout(function(){document.getElementById('bg-kopieer').textContent=o;},2000);});
  });
  document.getElementById('bg-verstuur').addEventListener('click',async function(){
    var email=document.getElementById('bg-email-input').value.trim();
    var naam=document.getElementById('bg-naam-input').value.trim();
    var bericht=document.getElementById('bg-bericht-input').value.trim();
    var err=document.getElementById('bg-err');err.style.display='none';
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.style.display='block';err.textContent='Geldig e-mailadres is verplicht.';return;}
    var btn=this;btn.disabled=true;btn.textContent='Versturen...';
    try{
      var html='<div style="font-family:sans-serif;max-width:600px;margin:0 auto">'
        +'<div style="background:#1a7a5e;color:#fff;padding:1.5rem;border-radius:8px 8px 0 0"><h2 style="margin:0;font-size:1.1rem">Koers voor Morgen M&A — Uitnodiging begeleider</h2></div>'
        +'<div style="background:#fff;border:1px solid #ddd;border-top:none;padding:1.5rem;border-radius:0 0 8px 8px">'
        +'<p style="font-size:14px;color:#2a2825">Beste '+(naam||'begeleider')+',</p>'
        +'<p style="font-size:13px;color:#5a5854;line-height:1.7">Je bent uitgenodigd als begeleider voor het M&A traject <strong>'+esc(trajectNaam)+'</strong>.</p>'
        +(bericht?'<p style="font-size:13px;color:#5a5854;line-height:1.7;border-left:3px solid #1a7a5e;padding-left:1rem;margin:1rem 0">'+esc(bericht)+'</p>':'')
        +'<div style="background:#f0faf6;border:1px solid #0a3d2e;border-radius:8px;padding:1.25rem;margin:1.25rem 0">'
        +'<div style="font-size:11px;font-weight:600;color:#145f48;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem">Jouw toegangscode</div>'
        +'<div style="font-family:monospace;font-size:1.6rem;font-weight:700;color:#1a7a5e;letter-spacing:.2em">'+esc(tussenCode)+'</div>'
        +'<div style="font-size:12px;color:#8a8880;margin-top:.3rem">Inloggen op: <a href="'+mnaUrl+'" style="color:#1a7a5e">'+mnaUrl+'</a></div>'
        +'</div>'
        +'<p style="font-size:12px;color:#8a8880">Met jouw code kun je het traject volledig beheren: documenten genereren, gesprekken vastleggen en de koper toegang geven.</p>'
        +'<p style="font-size:12px;color:#8a8880;margin-top:1rem">Met vriendelijke groet,<br><strong>Marcel Bisschops</strong><br>' + BRAND.kort + ' BV</p>'
        +'</div></div>';
      var r=await fetch(WORKER+'/mna/mail-begeleider',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
        body:JSON.stringify({to:email,naam:naam,trajectNaam:trajectNaam,tussenCode:tussenCode,html:html})});
      var d=await r.json();
      if(d.ok){
        document.getElementById('bg-ok').style.display='block';
        btn.textContent='Verstuurd';
        // Update begeleider in DB als naam/email ingevuld
        if(naam||email){
          await fetch(WORKER+'/mna/admin/update/'+trajectId,{method:'POST',headers:{'x-admin-key':adminKey,'Content-Type':'application/json'},
            body:JSON.stringify({begeleider_naam:naam,begeleider_email:email})}).catch(function(){});
        }
      } else {
        err.style.display='block';err.textContent='Fout bij versturen: '+(d.error||'onbekend');
        btn.disabled=false;btn.textContent='Stuur uitnodiging';
      }
    }catch(e){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Stuur uitnodiging';}
  });
}

// MEEKIJKERS — read-only toegang voor bank/accountant per traject (worker/21-meekijker.js).
async function toonMeekijkersModal(trajectId, trajectNaam, sector){
  var ov=document.createElement('div');ov.className='overlay';
  var mo=document.createElement('div');mo.className='modal';mo.style.maxWidth='720px';
  mo.innerHTML='<div class="modal-title">&#128065; Meekijkers — '+esc(trajectNaam)+'</div>'
    +'<p style="font-size:13px;color:var(--mid);margin-bottom:1rem;line-height:1.6">Bank of accountant read-only toegang geven tot dit traject. Een meekijker kan nooit iets wijzigen, alleen de gekozen fase (of alles) inzien.</p>'
    +'<div id="mk-lijst" style="margin-bottom:1.25rem;font-size:13px">Laden...</div>'
    +'<div style="border-top:1px solid var(--border);padding-top:1rem">'
    +'<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Nieuwe meekijker</div>'
    +'<div style="display:flex;gap:8px">'
    +'<div class="field" style="flex:2"><label>Naam meekijker <span style="color:var(--red)">*</span></label><input type="text" id="mk-naam"></div>'
    +'<div class="field" style="flex:1"><label>Type</label><select id="mk-type"><option value="bank">Bank</option><option value="accountant">Accountant</option><option value="overig">Overig</option></select></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<div class="field" style="flex:1"><label>Scope</label><select id="mk-scope"><option value="alle">Alle fases</option></select></div>'
    +'<div class="field" style="flex:1"><label>Verloopt na <span style="font-weight:400;color:var(--muted)">(optioneel, dagen)</span></label><input type="number" id="mk-verloopt" min="1"></div>'
    +'</div>'
    +'<label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--mid);line-height:1.5;margin:.5rem 0 1rem;cursor:pointer"><input type="checkbox" id="mk-toestemming" style="margin-top:2px"> Ik heb toestemming van mijn opdrachtgever om deze partij beperkte inzage te geven in dit traject.</label>'
    +'<div id="mk-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.5rem"></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +'<button class="btn-ghost" id="mk-sluit">Sluiten</button>'
    +'<button class="btn" id="mk-toevoegen">+ Meekijker aanmaken</button>'
    +'</div></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  document.getElementById('mk-sluit').addEventListener('click',function(){document.body.removeChild(ov);});

  // Eén fetch i.p.v. twee losse (was een race: laadLijst() kon eerder terug zijn dan de
  // labelcache, waardoor de Scope-kolom bij de eerste render de ruwe fase-id toonde i.p.v. het
  // genummerde label — zie sectorprofielenKlaar hieronder).
  var faseLabelCache={};
  function faseLabel(id){return faseLabelCache[id]||id;}
  var sectorprofielenKlaar=fetch(WORKER+'/mna/sectorprofielen').then(function(r){return r.json();}).then(function(d){
    var profiel=d.profielen&&d.profielen[sector||'accountancy'];
    var sel=document.getElementById('mk-scope');
    (profiel&&profiel.fases||[]).forEach(function(f){
      faseLabelCache[f.id]=f.title;
      if(sel){var opt=document.createElement('option');opt.value=f.id;opt.textContent=(f.num?f.num+'. ':'')+f.title;sel.appendChild(opt);}
    });
  }).catch(function(){});

  async function laadLijst(){
    var lijstEl=document.getElementById('mk-lijst');if(!lijstEl)return;
    try{
      var r=await fetch(WORKER+'/mna/admin/viewer/lijst?traject_id='+encodeURIComponent(trajectId),{headers:{'x-admin-key':adminKey}});
      var d=await r.json();
      var viewers=(d.viewers||[]);
      if(!viewers.length){lijstEl.innerHTML='<div style="color:var(--muted);font-style:italic">Nog geen meekijkers voor dit traject.</div>';return;}
      var html='<table style="width:100%"><thead><tr><th>Naam</th><th>Type</th><th>Scope</th><th>Code</th><th>Status</th><th>Laatst bekeken</th><th></th></tr></thead><tbody>';
      viewers.forEach(function(v){
        var ingetrokken=!!v.ingetrokken_op;
        var verlopen=v.expires_at&&Date.now()>v.expires_at;
        var status=ingetrokken?'Ingetrokken':(verlopen?'Verlopen':'Actief');
        var statusKleur=ingetrokken||verlopen?'var(--red)':'var(--teal)';
        html+='<tr><td>'+esc(v.viewer_naam||'—')+'</td><td>'+esc(v.viewer_type||'—')+'</td>'
          +'<td>'+(v.scope_fase==='alle'?'Alle fases':esc(faseLabel(v.scope_fase)))+'</td>'
          +'<td style="white-space:nowrap"><span class="code-chip" style="font-size:11px">'+esc(v.viewer_code)+'</span></td>'
          +'<td style="color:'+statusKleur+';font-size:12px">'+status+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+(v.laatst_bekeken?formatDate(v.laatst_bekeken):'<span style="font-style:italic">Nog niet bekeken</span>')+'</td>'
          +'<td>'+(ingetrokken?'':'<button class="btn-ghost btn-mk-intrekken" data-id="'+esc(v.id)+'" style="font-size:11px;padding:2px 8px;color:var(--red);border-color:var(--red)">Intrekken</button>')+'</td></tr>';
      });
      html+='</tbody></table>';
      lijstEl.innerHTML=html;
      lijstEl.querySelectorAll('.btn-mk-intrekken').forEach(function(b){
        b.addEventListener('click',async function(){
          if(!confirm('Toegang voor deze meekijker direct intrekken?'))return;
          b.disabled=true;b.textContent='Bezig...';
          await fetch(WORKER+'/mna/admin/viewer/intrekken',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({id:b.dataset.id,traject_id:trajectId})}).catch(function(){});
          laadLijst();
          refreshData();
        });
      });
    }catch(e){lijstEl.innerHTML='<div style="color:var(--red)">Kon meekijkers niet laden.</div>';}
  }
  sectorprofielenKlaar.then(laadLijst);

  document.getElementById('mk-toevoegen').addEventListener('click',async function(){
    var naam=document.getElementById('mk-naam').value.trim();
    var type=document.getElementById('mk-type').value;
    var scope=document.getElementById('mk-scope').value;
    var verloopt=document.getElementById('mk-verloopt').value.trim();
    var toestemming=document.getElementById('mk-toestemming').checked;
    var err=document.getElementById('mk-err');err.style.display='none';
    if(!naam){err.style.display='block';err.textContent='Naam meekijker is verplicht.';return;}
    if(!toestemming){err.style.display='block';err.textContent='Bevestig eerst dat u toestemming heeft van uw opdrachtgever.';return;}
    var btn=this;btn.disabled=true;btn.textContent='Bezig...';
    try{
      var body={traject_id:trajectId,viewer_naam:naam,viewer_type:type,scope_fase:scope,toestemming_bevestigd:true};
      if(verloopt)body.verloopt_dagen=Number(verloopt);
      var r=await fetch(WORKER+'/mna/admin/viewer/aanmaken',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(body)});
      var d=await r.json();
      if(d.ok){
        document.getElementById('mk-naam').value='';document.getElementById('mk-verloopt').value='';document.getElementById('mk-toestemming').checked=false;
        toast('Meekijker-code aangemaakt: '+d.viewer_code,'ok',6000);
        laadLijst();
        refreshData();

function slaOp(t){
  var regels=['Koers voor Morgen - M&A Traject','','Kantoor: '+(t.kantoor_naam||'-'),'Type: '+(t.traject_type||'-'),'Status: '+(t.status||'actief'),'Aangemaakt: '+formatDate(t.created_at),'','CODES','Verkoperscode: '+t.id,'Koperscode: '+(t.koper_code||'-'),'Tussenpersoonscode: '+(t.tussen_code||'-'),'','Toegang via: https://koersvoormorgen.nl/mna.html'];
  var inhoud=regels.join('\n');
  var blob=new Blob([inhoud],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='traject-'+t.id+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function vergrendel(id,naam){
  if(!confirm('Traject '+naam+' vergrendelen?'))return;
  try{
    var r=await fetch(WORKER+'/mna/admin/vergrendel/'+id,{headers:{'x-admin-key':adminKey},method:'POST'});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='vergrendeld';renderTab();}
    else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

async function ontvergrendel(id){
  try{
    var r=await fetch(WORKER+'/mna/admin/status/'+id,{method:'POST',headers:{'x-admin-key':adminKey,'Content-Type':'application/json'},body:JSON.stringify({status:'actief'})});
    var d=await r.json();
    if(d.ok){var t=mnaList.find(function(x){return x.id===id;});if(t)t.status='actief';renderTab();}
    else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

async function maakTrajectVanScan(scanId, naam, email){
  if(!confirm('M&A traject aanmaken voor '+naam+'?'))return;
  try{
    var r=await fetch(WORKER+'/mna/scan-to-traject',{
      method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},
      body:JSON.stringify({scan_id:scanId,kantoor_naam:naam,contact_email:email,traject_type:'Verkoop'})
    });
    var d=await r.json();
    if(d.ok){
      mnaList.unshift({id:d.code,kantoor_naam:naam,traject_type:'Verkoop',koper_code:d.koper_code,tussen_code:d.tussen_code,status:'actief',created_at:Date.now()});
      toast('Traject aangemaakt! Verkoperscode: '+d.code,' ok');
      activeTab='mna';renderDashboard();
    } else toast('Fout: '+(d.error||'onbekend'),'err');
  }catch(e){toast('Verbindingsfout.','err');}
}

    if (wisDD) confirmMsg += '✓ DD-velden (alle fases)\n';
    if (wisChk) confirmMsg += '✓ Checklist-statussen\n';
    if (wisDocs) confirmMsg += '✓ Geüploade documenten\n';
    if (wisTeken) confirmMsg += '✓ Ondertekeningen + trajectfase\n';
    confirmMsg += '\nDit kan NIET ongedaan worden gemaakt. Doorgaan?';
    if (!confirm(confirmMsg)) return;
    var btn = this; btn.disabled = true; btn.textContent = 'Bezig...';
    var prog = document.getElementById('wis-progress'); prog.style.display = 'block';
    var stappen = []; var ok = true;
    // Stap 1: DD-velden + checklist (+ evt. ondertekeningen) wissen
    if (wisDD || wisChk || wisTeken) {
      prog.textContent = '⏳ DD-data wissen...';
      try {
        var r = await fetch(WORKER + '/mna/admin/wis-data/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey }, body: JSON.stringify({ tekenen: wisTeken }) });
        var d = await r.json();
        if (d.ok) {
          stappen.push('✓ DD-data gewist via worker' + (wisTeken ? ' (incl. ondertekeningen + trajectfase)' : ''));
        } else {
          // Fallback: fase voor fase leegmaken
          var fases = ['financieel','commercieel','partner','compliance','it','juridisch','strategisch'];
          var gedaan = 0;
          for (var i = 0; i < fases.length; i++) {
            try {
              await fetch(WORKER + '/mna/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: id, fase_id: fases[i], data_json: {}, checklist_json: {}, notitie: '' }) });
              gedaan++;
            } catch(e2) {}
          }
          stappen.push('✓ DD-data gewist via ' + gedaan + '/7 fases');
        }
      } catch(e) { stappen.push('✕ DD-data fout: ' + esc(e.message)); ok = false; }
    }
    // Stap 2: Documenten verwijderen
    if (wisDocs) {
      prog.textContent = '⏳ Documenten verwijderen...';
      try {
        var rd = await fetch(WORKER + '/mna/admin/documenten', { headers: { 'x-admin-key': adminKey } });
        var docs = await rd.json();
        var trajectDocs = docs.filter(function(doc) { return doc.traject_id === id && !doc.vergrendeld; });
        var verw = 0;
        for (var j = 0; j < trajectDocs.length; j++) {
          try {
            var dr = await fetch(WORKER + '/mna/document/delete/' + trajectDocs[j].id, { method: 'POST', headers: { 'x-admin-key': adminKey } });
            if (dr.ok) verw++;
          } catch(e3) {}
        }
        stappen.push('✓ ' + verw + '/' + trajectDocs.length + ' documenten verwijderd');
      } catch(e) { stappen.push('✕ Documenten fout: ' + esc(e.message)); ok = false; }
    }
    prog.innerHTML = stappen.join('<br>') + '<br><br>' + (ok ? '<strong style="color:var(--teal)">✓ Klaar!</strong>' : '<strong style="color:var(--gold)">⚠ Voltooid met fouten</strong>');
    btn.textContent = 'Sluiten';
    btn.style.background = 'var(--teal)';
    btn.onclick = function() { document.body.removeChild(ov); refreshData(); };
    document.getElementById('wis-ann').textContent = 'Sluiten';
    document.getElementById('wis-ann').onclick = function() { document.body.removeChild(ov); refreshData(); };
    toast((ok ? 'Data gewist voor traject ' : 'Data gedeeltelijk gewist voor traject ') + naam, ok ? 'ok' : 'warn');
  });
}

// ── KOPPEL TRAJECT AAN ADVISEURSACCOUNT ──────────────────────
// Zet gebruiker_id op een bestaand traject, zodat het verschijnt in de trajectenlijst van die
// adviseur op adv.html (bijv. voor een externe tester die een al opgebouwd testtraject moet zien).
// Tussen_code/koper_code/verkoper-id blijven ongewijzigd — bestaande toegang blijft werken.
function koppelTrajectAanGebruiker(id, naam) {
  var ov = document.createElement('div'); ov.className = 'overlay';
  var mo = document.createElement('div'); mo.className = 'modal'; mo.style.maxWidth = '440px';
  mo.innerHTML = '<div class="modal-title">&#128279; Koppel aan adviseursaccount — ' + esc(naam) + '</div>'
    + '<p style="font-size:13px;color:var(--mid);line-height:1.65;margin-bottom:1rem">Het traject verschijnt daarna in de trajectenlijst van dit account op adv.html. De adviseur moet al bestaan (marilyn → Gebruikers).</p>'
    + '<label style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">E-mail adviseursaccount</label>'
    + '<input type="email" id="kg-email" placeholder="naam@voorbeeld.nl" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;font-size:13px;color:var(--sub);margin-bottom:1rem">'
    + '<div id="kg-err" style="display:none;color:var(--red);font-size:12px;margin-bottom:.75rem"></div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button class="btn-ghost" id="kg-ann">Annuleren</button>'
    + '<button class="btn" id="kg-ok">&#128279; Koppelen</button>'
    + '</div>';
  ov.appendChild(mo); document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('kg-ann').addEventListener('click', function() { document.body.removeChild(ov); });
  document.getElementById('kg-ok').addEventListener('click', async function() {
    var email = document.getElementById('kg-email').value.trim();
    var errEl = document.getElementById('kg-err');
    if (!email) { errEl.style.display = 'block'; errEl.textContent = 'E-mail verplicht.'; return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Bezig...';
    try {
      var r = await fetch(WORKER + '/mna/admin/traject/koppel/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey }, body: JSON.stringify({ email: email }) });
      var d = await r.json();
      if (d.ok) {
        toast('Traject ' + naam + ' gekoppeld aan ' + email + (d.gebruiker_status === 'uitgenodigd' ? ' (account nog niet geactiveerd)' : '') + '.', 'ok');
        document.body.removeChild(ov);
      } else { errEl.style.display = 'block'; errEl.textContent = d.error || 'Fout'; btn.disabled = false; btn.textContent = 'Koppelen'; }
    } catch (e) { errEl.style.display = 'block'; errEl.textContent = 'Verbindingsfout.'; btn.disabled = false; btn.textContent = 'Koppelen'; }
  });
}

      {id:'pContract',label:'Partnerovereenkomsten',req:true}
    ]},

      {id:'tijdlijn',label:'Tijdlijn',req:true}
    ]}
  };

  // Bouw bron-index: veld_key → bestandsnaam (welk doc vulde dit veld in)
  var bronIndex = {};
  (d.documenten || []).forEach(function(doc) {
    if (!doc.veld_extractie) return;
    try {
      var ve = typeof doc.veld_extractie === 'string' ? JSON.parse(doc.veld_extractie) : doc.veld_extractie;
      // De extractie-keys zijn de raw AI-keys (omzet, fte, etc.)
      // We slaan het document op als bron voor alle keys die het bevat
      Object.keys(ve || {}).forEach(function(k) {
        if (ve[k] !== null && ve[k] !== undefined && String(ve[k]).trim() !== '' && String(ve[k]) !== 'null') {
          if (!bronIndex[doc.fase_id + '::' + k]) bronIndex[doc.fase_id + '::' + k] = [];
          bronIndex[doc.fase_id + '::' + k].push(doc.bestand_naam);
        }
      });
    } catch(e) {}
  });

  // Bouw data-index: fase_id_veld_id → waarde
  var dataIndex = {};
  (d.data || []).forEach(function(row) {
    try {
      var dj = typeof row.data_json === 'string' ? JSON.parse(row.data_json) : row.data_json;
      Object.entries(dj || {}).forEach(function(entry) {
        var vId = entry[0]; var vData = entry[1];
        if (vData && vData.value) dataIndex[row.fase_id + '_' + vId] = vData.value;
      });
    } catch(e) {}
  });

  var ov = document.createElement('div'); ov.className = 'overlay';

  // Samenvatting
  Object.keys(FASE_DEF).forEach(function(faseId) {
    FASE_DEF[faseId].velden.forEach(function(v) {
      totaalVeld++;
      if (dataIndex[faseId + '_' + v.id]) gevuldVeld++;
      else if (v.req) leegReq++;
    });
  });

  var pct = Math.round(gevuldVeld / totaalVeld * 100);
  var pctReq = totaalVeld > 0 ? Math.round((totaalVeld - leegReq) / totaalVeld * 100) : 0;

  html += '<div style="display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">'
    + '<div style="background:var(--teal-bg);border:1px solid var(--teal-dark);border-radius:var(--r);padding:8px 14px;font-size:12px">'

    + '<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:8px 14px;font-size:12px">'
    + '<span style="color:var(--muted)">Leeg verplicht:</span> <strong style="color:var(--red)">' + leegReq + '</strong></div>'
    + '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;font-size:12px">'
    + '<span style="color:var(--muted)">Documenten geanalyseerd:</span> <strong>' + (d.documenten || []).length + '</strong></div>'
    + '</div>';

  // Legenda
  html += '<div style="display:flex;gap:16px;margin-bottom:1rem;font-size:11px">'
    + '<span style="color:var(--teal)">&#10003; Gevuld</span>'
    + '<span style="color:var(--red)">&#10005; Leeg verplicht</span>'
    + '<span style="color:var(--muted)">&#8212; Leeg optioneel</span>'
    + '</div>';

  // Per fase
  Object.keys(FASE_DEF).forEach(function(faseId) {
    var fase = FASE_DEF[faseId];
    var faseFilled = fase.velden.filter(function(v) { return !!dataIndex[faseId + '_' + v.id]; }).length;
    var faseReq = fase.velden.filter(function(v) { return v.req; }).length;
    var faseReqFilled = fase.velden.filter(function(v) { return v.req && !!dataIndex[faseId + '_' + v.id]; }).length;
    var fasePct = faseReq > 0 ? Math.round(faseReqFilled / faseReq * 100) : 100;
    var faseKleur = fasePct === 100 ? 'var(--teal)' : fasePct >= 50 ? 'var(--gold)' : 'var(--red)';

    // Documenten voor deze fase
    var faseDocs = (d.documenten || []).filter(function(doc) { return doc.fase_id === faseId; });

    html += '<div style="margin-bottom:1rem;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card)">'
      + '<span style="font-size:12px;font-weight:600;color:var(--head)">' + fase.label + '</span>'
      + '<div style="display:flex;gap:12px;align-items:center">'
      + (faseDocs.length ? '<span style="font-size:10px;color:var(--muted)">' + faseDocs.map(function(d) { return esc(d.bestand_naam); }).join(', ') + '</span>' : '<span style="font-size:10px;color:var(--red)">Geen documenten</span>')
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:11px;color:' + faseKleur + '">' + fasePct + '%</span>'
      + '</div></div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0">';

    fase.velden.forEach(function(v) {
      var key = faseId + '_' + v.id;
      var waarde = dataIndex[key];
      var gevuld = !!waarde;
      var bg = gevuld ? 'var(--teal-bg)' : v.req ? 'var(--red-bg)' : 'transparent';
      var icoon = gevuld ? '&#10003;' : v.req ? '&#10005;' : '&#8212;';
      var icoonKleur = gevuld ? 'var(--teal)' : v.req ? 'var(--red)' : 'var(--muted)';
      var labelKleur = gevuld ? 'var(--sub)' : v.req ? 'var(--red)' : 'var(--muted)';

      // Bron opzoeken
      var bronnen = bronIndex[faseId + '::' + v.id] || [];
      // Ook proberen met alternatieven (bijv. 'fte' voor 'partner_fte')
      if (!bronnen.length) {
        var altKeys = [v.id, v.id.replace(/([A-Z])/g, '_$1').toLowerCase()];
        altKeys.forEach(function(ak) {
          var b2 = bronIndex[faseId + '::' + ak];
          if (b2 && b2.length) bronnen = bronnen.concat(b2);
        });
      }
      var bronTekst = bronnen.length ? bronnen[bronnen.length-1] : (gevuld ? 'handmatig' : '');

      html += '<div style="padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:' + bg + '">'
        + '<div style="display:flex;align-items:flex-start;gap:6px">'
        + '<span style="color:' + icoonKleur + ';font-size:12px;flex-shrink:0;margin-top:1px">' + icoon + '</span>'
        + '<div style="min-width:0">'
        + '<div style="font-size:10px;color:' + labelKleur + ';font-weight:' + (v.req ? '600' : '400') + '">' + esc(v.label) + (v.req ? '' : ' <span style="opacity:.5;font-weight:400">(opt)</span>') + '</div>'
        + (gevuld ? '<div style="font-size:11px;font-family:IBM Plex Mono,monospace;color:var(--teal-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px" title="' + esc(waarde) + '">' + esc(String(waarde).length > 35 ? String(waarde).substring(0, 35) + '…' : waarde) + '</div>' : '')
        + (bronTekst ? '<div style="font-size:9px;color:var(--muted);margin-top:1px">&#128196; ' + esc(bronTekst) + '</div>' : '')
        + '</div></div></div>';
    });

    html += '</div></div>';
  });

  html += '<div style="display:flex;justify-content:flex-end;margin-top:1rem">'
    + '<button class="btn-ghost" id="debug-sluit">Sluiten</button></div>';

  mo.innerHTML = html;
  ov.appendChild(mo);
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('debug-sluit').addEventListener('click', function() { document.body.removeChild(ov); });
}

          + '<td style="padding:10px 12px"><span style="font-size:11px;font-weight:600;color:'+statusKleur+'">' + statusLabel + '</span></td>'
          + '<td style="padding:10px 12px;font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--teal)">' + (g.traject_count||0) + ' / ' + (g.traject_limiet||1) + '</td>'
          + '<td style="padding:10px 12px;font-size:11px;color:var(--muted)">' + llDatum + '</td>'
          + '<td style="padding:10px 12px">' + (g.is_eigen
              ? '<button class="btn-ghost btn-eigen" data-id="'+esc(g.id)+'" data-waarde="0" style="font-size:10px;padding:3px 8px;color:var(--teal);border-color:var(--teal)" title="Bisschops Financing kan prijsgevoelige inhoud van deze gebruiker inzien. Klik om af te schermen.">&#128275; Eigen</button>'
              : '<button class="btn-ghost btn-eigen" data-id="'+esc(g.id)+'" data-waarde="1" style="font-size:10px;padding:3px 8px" title="Prijsgevoelige inhoud van deze gebruiker is afgeschermd voor Bisschops Financing. Klik om als eigen te markeren.">&#128274; Extern</button>')
            + '</td>'
          + '<td style="padding:10px 12px;display:flex;gap:6px">'
          + '<button class="btn-ghost btn-verkoop" data-id="'+esc(g.id)+'" style="font-size:10px;padding:3px 8px;color:var(--gold);border-color:var(--gold)">&euro; Verkoop</button>'
          + (g.status==='uitgenodigd'?'<button class="btn-ghost btn-resend" data-id="'+esc(g.id)+'" data-email="'+esc(g.email)+'" data-naam="'+esc(g.naam)+'" style="font-size:10px;padding:3px 8px">&#9993; Opnieuw sturen</button>':'')
          + '<button class="btn-ghost btn-reset" data-id="'+esc(g.id)+'" data-email="'+esc(g.email)+'" style="font-size:10px;padding:3px 8px">Reset ww</button>'
          + (g.status==='inactief'
              ?'<button class="btn-ghost btn-act" data-id="'+esc(g.id)+'" style="font-size:10px;padding:3px 8px;color:var(--teal)">Activeren</button>'
              :'<button class="btn-ghost btn-deact" data-id="'+esc(g.id)+'" style="font-size:10px;padding:3px 8px;color:var(--red)">Deactiveren</button>')
          + '<button class="btn-ghost btn-del-user" data-id="'+esc(g.id)+'" data-naam="'+esc(g.naam)+'" style="font-size:10px;padding:3px 8px;color:var(--red);border-color:var(--red)">✕</button>'
          + '</td>'
          + '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;

    // Uitnodigen knop
    var uitnBtn = document.getElementById('btn-uitnodigen');
    if (uitnBtn) uitnBtn.addEventListener('click', function() { toonUitnodigenModal(); });

    // Verkoop knoppen: limiet + modules per adviseur
    el.querySelectorAll('.btn-verkoop').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var g = lijst.filter(function(x){ return x.id === btn.dataset.id; })[0];
        if (!g) return;
        var mods = {};
        try { mods = JSON.parse(g.modules || '{}'); } catch(e) {}
        var modDefs = [['traject','Traject (basis)'],['contracten','Contracten & ondertekening'],['ai_analyse','AI-analyse'],['qa','Q&A'],['meekijker','Meekijkers (bank/accountant laten meekijken)'],['marketing','Marketing aan/uit (teaser, verkoopmemorandum & matching)'],['export','Export & rapportage (dossier downloaden als tekstbestand)']];
        var chk = modDefs.map(function(md){
          var aan = md[0]==='traject' ? (mods[md[0]]!==false) : !!mods[md[0]];
          return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:4px 0;cursor:pointer">'
            + '<input type="checkbox" class="vk-mod" data-mod="'+md[0]+'" '+(aan?'checked':'')+'> '+md[1]+'</label>';
        }).join('');
        var ov = document.createElement('div');
        ov.id = 'vk-overlay';
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center';
        // Audit-fix P2 (24 aug 2026, zevende heraudit): dit modal (en alle marilyn-modals) miste
        // role="dialog"/aria-modal — schermlezers kregen geen aankondiging dat er een dialoog
        // opende. Zelfde patroon als mna/adv al gebruiken. Escape sluit toegevoegd omdat dat
        // sitebreed nergens stond en hier triviaal is; een volledige focus-trap voor alle overige
        // marilyn-modals is bewust bredere scope, niet in deze fix meegenomen.
        ov.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="vk-titel" style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.75rem;width:100%;max-width:420px">'
          + '<div id="vk-titel" style="font-size:15px;font-weight:600;color:var(--head);margin-bottom:2px">&euro; Verkoop &mdash; ' + esc(g.naam) + '</div>'
          + '<div style="font-size:11px;color:var(--muted);margin-bottom:1rem">' + esc(g.email) + ' &middot; ' + (g.traject_count||0) + ' traject(en) in gebruik</div>'
          + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px">Trajectlimiet</div>'
          + '<input type="number" id="vk-limiet" min="1" value="' + (g.traject_limiet||1) + '" style="width:100px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--sub);font-size:14px;margin-bottom:1rem">'
          + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px">Modules <span style="font-weight:400;text-transform:none;letter-spacing:normal">(aan/uit per adviseur — prijzen staan in &euro; Tarieven)</span></div>'
          + chk
          + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem">'
          + '<button class="btn-ghost" id="vk-annuleer" style="font-size:12px;padding:7px 14px">Annuleren</button>'
          + '<button class="btn" id="vk-opslaan" style="font-size:12px;padding:7px 14px">Opslaan</button>'
          + '</div></div>';
        document.body.appendChild(ov);
        document.getElementById('vk-limiet').focus();
        ov.addEventListener('keydown', function(e){ if (e.key === 'Escape') ov.remove(); });
        document.getElementById('vk-annuleer').addEventListener('click', function(){ ov.remove(); });
        document.getElementById('vk-opslaan').addEventListener('click', async function() {
          var nm = {};
          ov.querySelectorAll('.vk-mod').forEach(function(c){ nm[c.dataset.mod] = c.checked; });
          var lim = Math.max(1, parseInt(document.getElementById('vk-limiet').value, 10) || 1);
          try {
            var vr = await fetch(WORKER + '/gebruikers/verkoop/' + encodeURIComponent(g.id), { method: 'POST', headers: { 'x-admin-key': adminKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ traject_limiet: lim, modules: nm }) });
            var vd = await vr.json();
            if (vd.ok) { toast('Verkoopinstellingen opgeslagen: limiet ' + vd.traject_limiet + '.', 'ok'); ov.remove(); var tcv = document.getElementById('tc'); if (tcv) renderGebruikersTab(tcv); }
            else toast(vd.error || 'Fout bij opslaan.', 'err');
          } catch(e) { toast('Verbindingsfout.', 'err'); }
        });
      });
    });

    // Eigen/extern-toggle (muur): bepaalt of Bisschops Financing prijsgevoelige inhoud mag inzien
    el.querySelectorAll('.btn-eigen').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var nieuweWaarde = btn.dataset.waarde === '1';
        var g = lijst.filter(function(x){ return x.id === btn.dataset.id; })[0];
        var naam = g ? g.naam : '';
        var msg = nieuweWaarde
          ? 'Trajecten van ' + naam + ' als EIGEN markeren? Bisschops Financing krijgt dan volledige inzage in de prijsgevoelige inhoud (DD-cijfers, documenten, gesprekken).'
          : 'Trajecten van ' + naam + ' als EXTERN markeren? Bisschops Financing verliest dan alle inzage in de prijsgevoelige inhoud van deze gebruiker.';
        if (!confirm(msg)) return;
        try {
          var er = await fetch(WORKER + '/gebruikers/eigen/' + encodeURIComponent(btn.dataset.id), { method: 'POST', headers: { 'x-admin-key': adminKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ is_eigen: nieuweWaarde }) });
          var ed = await er.json();
          if (ed.ok) { toast(nieuweWaarde ? 'Gemarkeerd als eigen — inhoud zichtbaar.' : 'Gemarkeerd als extern — inhoud afgeschermd.', 'ok'); var tce = document.getElementById('tc'); if (tce) renderGebruikersTab(tce); }
          else toast(ed.error || 'Fout bij opslaan.', 'err');
        } catch(e) { toast('Verbindingsfout.', 'err'); }
      });
    });

    // Deactiveren knoppen
    el.querySelectorAll('.btn-act').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker activeren?')) return;
        var dr = await fetch(WORKER + '/gebruikers/activeer/' + btn.dataset.id, {method:'POST',headers:{'x-admin-key':adminKey}});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker geactiveerd.', 'ok'); var tc2=document.getElementById('tc'); if(tc2)renderGebruikersTab(tc2); }
        else toast(dd.error || 'Fout bij activeren.', 'err');
      });
    });
    el.querySelectorAll('.btn-reset').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var nieuwWw = prompt('Nieuw wachtwoord voor ' + btn.dataset.email + ':');
        if (!nieuwWw || nieuwWw.length < 8) { toast('Wachtwoord minimaal 8 tekens.', 'err'); return; }
        var dr = await fetch(WORKER + '/gebruikers/reset-ww/' + btn.dataset.id, {method:'POST', headers:{'Content-Type':'application/json','x-admin-key':adminKey}, body:JSON.stringify({wachtwoord:nieuwWw})});
        var dd = await dr.json();
        if (dd.ok) toast('Wachtwoord gereset voor ' + btn.dataset.email + '.', 'ok');
        else toast(dd.error || 'Fout bij resetten.', 'err');
      });
    });
    el.querySelectorAll('.btn-del-user').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker "'+btn.dataset.naam+'" definitief verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
        var dr = await fetch(WORKER + '/gebruikers/verwijder/' + btn.dataset.id, {method:'POST',headers:{'x-admin-key':adminKey}});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker verwijderd.', 'ok'); var tc3=document.getElementById('tc'); if(tc3)renderGebruikersTab(tc3); }
        else toast(dd.error || 'Fout bij verwijderen.', 'err');
      });
    });
    el.querySelectorAll('.btn-deact').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (!confirm('Gebruiker deactiveren? Ze kunnen dan niet meer inloggen.')) return;
        btn.disabled = true;
        var dr = await fetch(WORKER + '/gebruikers/deactiveer/' + btn.dataset.id, {method:'POST',headers:{'x-admin-key':adminKey}});
        var dd = await dr.json();
        if (dd.ok) { toast('Gebruiker gedeactiveerd.', 'ok'); var tc4=document.getElementById('tc'); if(tc4)renderGebruikersTab(tc4); }
        else { toast('Fout: ' + (dd.error||'onbekend'), 'err'); btn.disabled = false; }
      });
    });

    // Opnieuw versturen knoppen
    el.querySelectorAll('.btn-resend').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        btn.disabled = true; btn.textContent = 'Versturen...';
        // Goede aanpak: opnieuw uitnodigen via deactiveer + nieuw uitnodigen
        var rr = await fetch(WORKER + '/gebruikers/uitnodigen', {
          method: 'POST',
          headers: {'Content-Type':'application/json','x-admin-key':adminKey},
          body: JSON.stringify({naam: btn.dataset.naam, email: btn.dataset.email, _resend: btn.dataset.id})
        });
        var rd = await rr.json();
        if (rd.ok) { toast('Uitnodiging opnieuw verstuurd.', 'ok'); }
        else { toast('Fout: ' + (rd.error||'onbekend'), 'err'); }
        btn.disabled = false; btn.textContent = '✉ Opnieuw sturen';
      });
    });
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout bij laden: ' + esc(e.message) + '</div>';
  }
}

var TARIEF_LABELS = {
  basis: 'Basis (DD-begeleiding zonder AI-extractie)',
  ai: 'Basis + AI (met AI-documentextractie/analyse)',
  lead_inbreng: 'Module-fee — Lead-inbreng (eenmalig per traject met aandrager)',
  meekijker: 'Module-fee — Meekijker (eenmalig per aangemaakte code)',
  teaser: 'Module-fee — Teaser (eenmalig bij eerste generatie per traject)',
  verkoopmemorandum: 'Module-fee — Verkoopmemorandum (eenmalig bij eerste generatie per traject)',
  matching: 'Module-fee — Matching (eenmalig per koper die zich aanmeldt)'
};

async function renderTarievenTab(el) {
  el.innerHTML = '<div style="padding:1rem;color:var(--muted);font-size:13px">Laden...</div>';
  try {
    var tr = await fetch(WORKER + '/mna/admin/tarieven', { headers: { 'x-admin-key': adminKey } });
    var tarieven = await tr.json();
    var er = await fetch(WORKER + '/mna/admin/tarieven/events', { headers: { 'x-admin-key': adminKey } });
    var events = await er.json();
    var fcr = await fetch(WORKER + '/mna/admin/factuurconfig', { headers: { 'x-admin-key': adminKey } });
    var fcfg = await fcr.json().catch(function(){return{};});
    if (!fcfg || typeof fcfg !== 'object') fcfg = {};
    var fcCompleet = !!(fcfg.btwnr && fcfg.iban);
    if (!Array.isArray(tarieven)) tarieven = [];
    if (!Array.isArray(events)) events = [];

    var html = '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem">&euro; Tarieven — platformgebruik door adviseurs</div>'
      + '<div style="font-size:12px;color:var(--muted);margin-bottom:1.25rem;line-height:1.6">Bedragen hieronder gelden voor <em>nieuwe</em> trajecten/gebeurtenissen vanaf het moment van opslaan. Een reeds aangemaakt traject behoudt het tarief dat gold op het moment van aanmaken (vastgepind, zie kolom "Gepind" in het overzicht eronder) — een latere wijziging hier raakt lopende trajecten dus nooit met terugwerkende kracht.</div>'
      + '<div style="overflow-x:auto;margin-bottom:2rem"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      + '<thead><tr>'
      + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Fee-type</th>'
      + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Bedrag (&euro;)</th>'
      + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Laatst gewijzigd</th>'
      + '<th style="padding:8px 12px;border-bottom:1px solid var(--border)"></th>'
      + '</tr></thead><tbody>';
    tarieven.forEach(function(t) {
      var wijzDatum = t.laatst_gewijzigd_op ? new Date(t.laatst_gewijzigd_op).toLocaleDateString('nl-NL') : '—';
      html += '<tr style="border-bottom:1px solid var(--border)">'
        + '<td style="padding:10px 12px;color:var(--sub)"><div style="font-weight:600">' + esc(t.fee_type) + '</div><div style="font-size:11px;color:var(--muted)">' + esc(TARIEF_LABELS[t.fee_type] || t.omschrijving || '') + '</div></td>'
        + '<td style="padding:10px 12px"><input type="number" min="0" step="1" class="tar-bedrag" data-type="' + esc(t.fee_type) + '" value="' + Number(t.bedrag) + '" style="width:110px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--sub);font-family:IBM Plex Mono,monospace"></td>'
        + '<td style="padding:10px 12px;font-size:11px;color:var(--muted)">' + wijzDatum + (t.laatst_gewijzigd_door ? ' &middot; ' + esc(t.laatst_gewijzigd_door) : '') + '</td>'
        + '<td style="padding:10px 12px"><button class="btn-ghost tar-opslaan" data-type="' + esc(t.fee_type) + '" style="font-size:10px;padding:3px 8px;color:var(--gold);border-color:var(--gold)">Opslaan</button></td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';

    // Openstaand per adviseur (24 aug 2026, Marcel: "factuur die ik kan versturen") — som van
    // fee-events zonder gefactureerd_op, gegroepeerd op gebruiker_id, met een knop die het nieuwe
    // /mna/admin/factuur/{id}-endpoint aanroept en de PDF-download start.
    var openstaandPerGeb = {};
    events.forEach(function(ev) {
      if (ev.gefactureerd_op || !ev.gebruiker_id) return;
      if (!openstaandPerGeb[ev.gebruiker_id]) openstaandPerGeb[ev.gebruiker_id] = { naam: ev.gebruiker_naam, email: ev.gebruiker_email, totaal: 0, aantal: 0 };
      openstaandPerGeb[ev.gebruiker_id].totaal += Number(ev.bedrag) || 0;
      openstaandPerGeb[ev.gebruiker_id].aantal++;
    });
    var openGebIds = Object.keys(openstaandPerGeb);

    // Facturatiegegevens (backlogpunt 3) — verplicht vóór er een BTW-factuur gegenereerd kan worden.
    html += '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Facturatiegegevens Bisschops Financing</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:2rem;padding:1rem;background:var(--card);border:1px solid var(--border);border-radius:8px">'
      + '<div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px">BTW-nummer</label><input type="text" id="fc-btwnr" placeholder="NL123456789B01" value="' + esc(fcfg.btwnr || '') + '" style="width:170px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--void);color:var(--sub);font-family:IBM Plex Mono,monospace;font-size:12px"></div>'
      + '<div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px">IBAN</label><input type="text" id="fc-iban" placeholder="NL00BANK0123456789" value="' + esc(fcfg.iban || '') + '" style="width:200px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--void);color:var(--sub);font-family:IBM Plex Mono,monospace;font-size:12px"></div>'
      + '<div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px">T.n.v. (rekeninghouder)</label><input type="text" id="fc-tnv" placeholder="Bisschops Financing B.V." value="' + esc(fcfg.tnv || '') + '" style="width:200px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--void);color:var(--sub);font-size:12px"></div>'
      + '<div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px">Betaaltermijn (dagen)</label><input type="number" id="fc-term" min="0" max="90" value="' + (fcfg.betaaltermijn != null ? Number(fcfg.betaaltermijn) : 14) + '" style="width:90px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--void);color:var(--sub);font-family:IBM Plex Mono,monospace;font-size:12px"></div>'
      + '<button class="btn btn-sm" id="fc-opslaan" style="font-size:11px;padding:6px 14px">Opslaan</button>'
      + '</div>';

    html += '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Openstaand per adviseur — BTW-factuur genereren</div>';
    if (!fcCompleet) html += '<div style="font-size:12px;color:var(--gold-dark);background:var(--gold-bg);border:1px solid var(--gold);border-radius:6px;padding:8px 12px;margin-bottom:.75rem">Vul eerst het BTW-nummer en IBAN hierboven in — zonder deze gegevens kan er geen factuur worden gegenereerd.</div>';
    if (!openGebIds.length) {
      html += '<div style="color:var(--muted);font-size:13px;font-style:italic;padding:.5rem 0 1.25rem">Geen openstaande (nog niet gefactureerde) kosten.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem">';
      openGebIds.forEach(function(gid) {
        var o = openstaandPerGeb[gid];
        html += '<div style="display:flex;align-items:center;gap:12px;padding:.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:8px">'
          + '<div style="flex:1"><div style="font-weight:600;color:var(--sub)">' + esc(o.naam || '—') + '</div><div style="font-size:11px;color:var(--muted)">' + esc(o.email || '') + ' &middot; ' + o.aantal + ' openstaande post(en)</div></div>'
          + '<div style="font-family:IBM Plex Mono,monospace;font-weight:600;color:var(--teal)">&euro;' + o.totaal.toLocaleString('nl-NL') + '</div>'
          + '<button class="btn btn-sm fact-genereer" data-gid="' + esc(gid) + '" style="font-size:11px;padding:5px 12px">&#128196; Factuur genereren</button>'
          + '</div>';
      });
      html += '</div>';
    }

    html += '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Fee-events (' + events.length + ') — volledige geschiedenis</div>';
    if (!events.length) {
      html += '<div style="color:var(--muted);font-size:13px;font-style:italic;padding:1rem 0">Nog geen fee-events gelogd.</div>';
    } else {
      html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
        + '<thead><tr>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Datum</th>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Adviseur</th>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Traject</th>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Fee-type</th>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Bedrag</th>'
        + '<th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600">Omschrijving</th>'

    el.querySelectorAll('.fact-genereer').forEach(function(btn) {

          .then(function(r) {
            if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Onbekende fout'); });
            var cd = r.headers.get('Content-Disposition') || '';
            var naamMatch = cd.match(/filename="([^"]+)"/);
            return r.blob().then(function(blob) { return { blob: blob, naam: naamMatch ? naamMatch[1] : 'factuur.pdf' }; });
          })
          .then(function(res) {
            var url = URL.createObjectURL(res.blob);
            var a = document.createElement('a');
            a.href = url; a.download = res.naam; document.body.appendChild(a); a.click();
            setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            toast('Factuur gegenereerd en gedownload — ' + res.naam, 'ok');
            var tct = document.getElementById('tc'); if (tct) renderTarievenTab(tct);
          })
          .catch(function(e) { toast('Fout: ' + e.message, 'err'); btn.disabled = false; btn.textContent = '📄 Factuur genereren'; });
      });
    });

    var fcBtn = document.getElementById('fc-opslaan');
    if (fcBtn) fcBtn.addEventListener('click', function() {
      fcBtn.disabled = true; fcBtn.textContent = 'Opslaan...';
      fetch(WORKER + '/mna/admin/factuurconfig', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
        body: JSON.stringify({
          btwnr: document.getElementById('fc-btwnr').value, iban: document.getElementById('fc-iban').value,
          tnv: document.getElementById('fc-tnv').value, betaaltermijn: document.getElementById('fc-term').value
        })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) { toast('Facturatiegegevens opgeslagen.', 'ok'); var tct = document.getElementById('tc'); if (tct) renderTarievenTab(tct); }
        else { toast('Fout: ' + (d.error || 'onbekend'), 'err'); fcBtn.disabled = false; fcBtn.textContent = 'Opslaan'; }
      }).catch(function() { toast('Kon niet opslaan.', 'err'); fcBtn.disabled = false; fcBtn.textContent = 'Opslaan'; });
    });

    el.querySelectorAll('.tar-opslaan').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var type = btn.dataset.type;
        var inp = el.querySelector('.tar-bedrag[data-type="' + type + '"]');
        var bedrag = Number(inp.value);
        if (!isFinite(bedrag) || bedrag < 0) { toast('Bedrag moet een getal ≥ 0 zijn.', 'err'); return; }
        btn.disabled = true; btn.textContent = 'Opslaan...';
        try {
          var sr = await fetch(WORKER + '/mna/admin/tarieven', { method: 'POST', headers: { 'x-admin-key': adminKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ fee_type: type, bedrag: bedrag, door: 'Marcel (marilyn)' }) });
          var sd = await sr.json();
          if (sd.ok) { toast('Tarief "' + type + '" opgeslagen: €' + bedrag + '.', 'ok'); var tct = document.getElementById('tc'); if (tct) renderTarievenTab(tct); }
          else { toast(sd.error || 'Fout bij opslaan.', 'err'); btn.disabled = false; btn.textContent = 'Opslaan'; }
        } catch(e) { toast('Verbindingsfout.', 'err'); btn.disabled = false; btn.textContent = 'Opslaan'; }
      });
    });
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout bij laden: ' + esc(e.message) + '</div>';
  }
}

// VEILIGHEID TAB (19 aug 2026) — structureert audit-bevindingen uit security_audit_log in D1,
// plus de dagelijkse geautomatiseerde selfcheck (zelfde cross-path-invarianten als
// tests/e2e-crosspath-fixes.mjs, maar dan als cron in de worker zelf) als "levend" onderdeel.
var veiligheidRefreshTimer = null;
var ERNST_KLEUR = { kritiek: 'var(--red)', hoog: 'var(--red)', midden: 'var(--gold)', laag: 'var(--info)' };
var ERNST_LABEL = { kritiek: 'Kritiek', hoog: 'Hoog', midden: 'Midden', laag: 'Laag' };

function veiligheidGauge(waarde, label, subtekst) {
  var cx = 110, cy = 95, r = 75, strokeW = 14;
  function polair(hoekGraden) { var rad = hoekGraden * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) }; }
  function hoekVoorWaarde(w) { return 180 - (Math.max(0, Math.min(100, w)) / 100) * 180; }
  function boogPad(vanW, totW) {
    var p1 = polair(hoekVoorWaarde(vanW)), p2 = polair(hoekVoorWaarde(totW));
    return 'M ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
  }
  // Zelfde grens-drempels (70/50) als de bestaande scorekleuring elders in marilyn (regel ~319).
  var zones = [{ van: 0, tot: 50, kleur: 'var(--red)' }, { van: 50, tot: 70, kleur: 'var(--gold)' }, { van: 70, tot: 100, kleur: 'var(--teal)' }];
  // stroke-linecap:butt op de losse zone-segmenten — met "round" overlappen de afgeronde
  // uiteinden bij elke zonegrens (50/70) en ontstaat een bultje dat op een losse stip lijkt,
  // los van de waarde (leek op een verkeerd gepositioneerde naald "in het midden").
  var boogSvg = zones.map(function(z){ return '<path d="'+boogPad(z.van,z.tot)+'" fill="none" stroke="'+z.kleur+'" stroke-width="'+strokeW+'" stroke-linecap="butt"/>'; }).join('');
  var heeftWaarde = waarde !== null && waarde !== undefined;
  var naaldKleur = !heeftWaarde ? 'var(--muted)' : (waarde >= 70 ? 'var(--teal)' : waarde >= 50 ? 'var(--gold)' : 'var(--red)');
  var naaldPunt = polair(hoekVoorWaarde(heeftWaarde ? waarde : 0));
  // Bugfix 21 aug 2026: de stip stond vast op het draaipunt (cx,cy) i.p.v. op het naaldpunt zelf —
  // zag er dus bij elke score hetzelfde uit (een bolletje in het midden), los van de waarde.
  var naaldSvg = !heeftWaarde ? '' :
    '<line x1="'+cx+'" y1="'+cy+'" x2="'+naaldPunt.x.toFixed(2)+'" y2="'+naaldPunt.y.toFixed(2)+'" stroke="'+naaldKleur+'" stroke-width="4" stroke-linecap="round"/>'
    + '<circle cx="'+naaldPunt.x.toFixed(2)+'" cy="'+naaldPunt.y.toFixed(2)+'" r="8" fill="'+naaldKleur+'" stroke="var(--panel)" stroke-width="2"/>';
  var waardeTekst = heeftWaarde ? Math.round(waarde) : '—';
  return '<div style="text-align:center">'
    + '<svg viewBox="0 0 220 130" width="100%" style="max-width:230px" role="img" aria-label="' + esc(label) + ': ' + waardeTekst + (heeftWaarde ? '/100' : '') + '">' + boogSvg + naaldSvg
    + '<text x="110" y="122" text-anchor="middle" font-size="26" font-weight="700" fill="var(--head)" font-family="IBM Plex Sans, sans-serif">' + waardeTekst + (heeftWaarde ? '<tspan font-size="13" fill="var(--muted)"> /100</tspan>' : '') + '</text>'
    + '</svg>'
    + '<div style="font-size:12px;font-weight:600;color:var(--head);margin-top:-4px">' + esc(label) + '</div>'
    + (subtekst ? '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + esc(subtekst) + '</div>' : '')
    + '</div>';
}

function auditVerzoekStatusTekst(verzoek) {
  if (!verzoek) return 'Nog geen aanvraag ingediend.';
  var tijd = function(ms) { return new Date(ms).toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  if (verzoek.status === 'open') return 'Aanvraag ingediend om ' + tijd(verzoek.aangevraagd_op) + ' — wacht tot de routine dit oppikt (elke ~15 min).';
  if (verzoek.status === 'bezig') return 'Routine is bezig sinds ' + tijd(verzoek.opgehaald_op) + '...';
  if (verzoek.status === 'klaar') return 'Laatste aanvraag afgerond om ' + tijd(verzoek.afgerond_op) + '.';
  return '';
}

async function renderVeiligheidTab(el) {

      var open = (bv.bevindingen || []).filter(function(b){ return b.status === 'open'; });
      var gefixt = (bv.bevindingen || []).filter(function(b){ return b.status !== 'open'; }).slice(0, 15);
      var laatsteRun = ov.laatste_selfcheck;
      var laatsteRunTekst = laatsteRun ? (new Date(laatsteRun.ran_at).toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' — ' + laatsteRun.checks_geslaagd + '/' + laatsteRun.checks_totaal + ' geslaagd') : 'Nog nooit gedraaid';
      function pushBadge(naam, run) {
        if (!run) return '<div style="font-size:11px;color:var(--muted)">' + naam + ': nog geen push gemeld</div>';
        var groen = run.checks_geslaagd === run.checks_totaal;
        var kleur = groen ? 'var(--teal)' : 'var(--red)';
        return '<div style="font-size:11px;color:var(--mid)">' + naam + ': <span style="color:' + kleur + ';font-weight:600">' + run.checks_geslaagd + '/' + run.checks_totaal + '</span> — ' + new Date(run.ran_at).toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</div>';

      var html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem">'
        + '<div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">&#128737; Veiligheid</div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
        + '<button class="btn" id="btn-rapport-link" style="font-size:12px;padding:7px 14px">&#128196; Beveiligingsrapport ophalen</button>'
        + '<button class="btn-ghost" id="btn-rapport-nieuw" style="font-size:12px;padding:7px 14px;color:var(--red);border-color:var(--red)" title="Oude gedeelde links stoppen direct met werken">&#8635; Nieuwe link (oude verlopen)</button>'
        + '</div>'
        + '</div>'
        + '<div id="rapport-link-out" style="display:none;margin-bottom:1rem;padding:.75rem 1rem;background:var(--teal-bg);border:1px solid var(--teal);border-radius:8px;font-size:12px;color:var(--sub);word-break:break-all"></div>'
        + '<div style="font-size:12px;color:var(--muted);margin-bottom:1.25rem;max-width:720px;line-height:1.6">Drie bewust gescheiden lagen — een groene "continue check" hierboven betekent nooit "het hele platform is veilig", alleen dat de daar getoetste punten kloppen. Voor de brede, redenerende beoordeling (architectuur, waardering, AI-kwaliteit, compliance) blijft de periodieke diepe audit leidend. Het externe rapport (knop rechtsboven) is <strong>niet publiek</strong> — alleen bereikbaar met de code in de link. Deel de link alleen rechtstreeks (mail/gesprek), nooit publiek plaatsen.</div>'

        + '<div class="table-wrap" style="margin-bottom:1.25rem"><div class="table-hdr"><div class="table-title">1. Continue geautomatiseerde checks</div></div>'
        + '<div style="padding:1.25rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start">'
        + '<div style="flex:0 0 230px">' + veiligheidGauge(ov.gauges.dagelijkse_check_score, 'Nachtelijke gedragschecks', laatsteRunTekst) + '</div>'
        + '<div style="flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding-top:.5rem">'
        + '<div style="font-size:12px;color:var(--mid);line-height:1.6">Elke nacht, live in productie: admin-endpoints weigeren zonder key, security-headers aanwezig, een SQL-injectie-achtige payload geeft geen crash/data, plus de cross-path-invarianten (koper-categorie-intrekking, muur tegen externe adviseurs, existence-oracles). Een gefaalde check schrijft direct een kritieke bevinding + waarschuwingsmail.</div>'
        + '<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;padding-top:8px;border-top:1px solid var(--border)">'
        + '<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px">Statische code-audit (bij elke push, git-hook)</div>'
        + pushBadge('Frontend-repo', ov.statische_audit && ov.statische_audit.frontend)
        + pushBadge('Backend-repo', ov.statische_audit && ov.statische_audit.backend)
        + '</div>'
        + '<button class="btn" id="btn-veiligheid-nu" style="font-size:12px;padding:8px 16px;align-self:flex-start;margin-top:6px">&#8635; Draai nachtelijke check nu</button>'
        + '</div>'
        + '</div></div>'

        + '<div class="table-wrap" style="margin-bottom:1.25rem"><div class="table-hdr"><div class="table-title">2. Open bevindingen (uit alle bronnen)</div></div>'
        + '<div style="padding:1.25rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start">'
        + '<div style="flex:0 0 230px">' + veiligheidGauge(ov.gauges.bevindingen_score, 'Open bevindingen', ov.open_totaal + ' open (' + ov.open_kritiek_hoog + ' kritiek/hoog) · ' + ov.gefixt_totaal + ' gefixt') + '</div>'
        + '<div style="flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding-top:.5rem">'
        + '<div style="font-size:12px;color:var(--mid);line-height:1.6">Alle nog openstaande bevindingen, ongeacht bron (nachtelijke check, statische audit, of handmatig gelogd bij een diepe audit). Elke open kritieke/hoge bevinding trekt fors af van de score — 0 open kritiek/hoog is de enige manier om hier op 100 te staan.</div>'
        + '</div>'
        + '</div>'

        + '<div class="table-wrap" style="margin-bottom:1.5rem' + ((ov.diepe_audit && ov.diepe_audit.verouderd) || !ov.diepe_audit ? ';border-color:var(--red)' : '') + '"><div class="table-hdr"><div class="table-title">3. Laatste periodieke diepe audit</div>'
        + (!ov.diepe_audit || (ov.diepe_audit && ov.diepe_audit.verouderd) ? '<span class="tag" style="background:var(--red-bg);color:var(--red);border-color:var(--red)">&#9888; Verouderd — audit is toe aan een nieuwe ronde</span>' : '<span class="tag" style="background:var(--teal-bg);color:var(--teal);border-color:var(--teal)">&#10003; Op schema</span>')
        + '</div>'
        + '<div style="padding:1.25rem">'
        + (ov.diepe_audit
            ? '<div style="display:flex;gap:1.5rem;align-items:flex-start;flex-wrap:wrap">'
              + '<div style="flex:0 0 230px">' + veiligheidGauge(ov.diepe_audit.score, 'Diepe audit-score', new Date(ov.diepe_audit.datum).toLocaleDateString('nl-NL') + ' — ' + ov.diepe_audit.dagen_geleden + ' dagen geleden') + '</div>'
              + '<div style="flex:1;min-width:260px;font-size:12px;color:var(--mid);line-height:1.6"><strong>' + esc(ov.diepe_audit.bron) + '</strong><br>' + esc(ov.diepe_audit.samenvatting) + '</div>'
              + '</div>'
            : '<div class="empty" style="color:var(--red)">Nog geen diepe audit gelogd.</div>')
        + '<div style="font-size:11px;color:var(--muted);margin-top:1rem">Redenerende, brede beoordeling (architectuur/waardering/AI-kwaliteit/compliance) — kan niet in de Worker zelf draaien zonder forse AI-kosten en kwaliteitsverlies, dus normaal handmatig gelogd na elke <code>AUDIT-STANDAARD.md</code>-ronde of <code>/code-review ultra</code>-run. Cadans: maandelijks + vóór elke grote release + op verzoek — dit vervangt de dagelijkse/push-checks hierboven niet en wordt er ook nooit door vervangen.</div>'
        + '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
        + '<button class="btn" id="btn-audit-aanvragen" style="font-size:12px;padding:8px 16px">&#9889; Draai diepe audit nu (frontend + backend)</button>'
        + '<span id="audit-verzoek-status" style="font-size:11px;color:var(--muted)">' + auditVerzoekStatusTekst(ov.audit_verzoek) + '</span>'
        + '</div>'
        + '<div style="font-size:10px;color:var(--muted);margin-top:6px">Zet een aanvraag klaar die een cloud-routine binnen ~15 min oppikt en zelf uitvoert (kost AI-tokens — max 1 tegelijk, min. 10 min tussen aanvragen).</div>'
        + '</div></div>';

      html += '<div class="table-wrap" style="margin-bottom:1.5rem"><div class="table-hdr"><div class="table-title">Open bevindingen (' + open.length + ')</div></div>';
      if (!open.length) {
        html += '<div class="empty" style="color:var(--teal)">Geen openstaande bevindingen. &#127881;</div>';
      } else {
        html += '<table><thead><tr><th>Ernst</th><th>Code</th><th>Titel</th><th>Omschrijving</th><th>Gevonden</th><th></th></tr></thead><tbody>';
        open.sort(function(a,b){ var o={kritiek:0,hoog:1,midden:2,laag:3}; return (o[a.ernst]||9)-(o[b.ernst]||9) || b.gevonden_op-a.gevonden_op; }).forEach(function(b){
          html += '<tr>'
            + '<td><span class="tag" style="background:' + ERNST_KLEUR[b.ernst] + '22;color:' + ERNST_KLEUR[b.ernst] + ';border-color:' + ERNST_KLEUR[b.ernst] + '">' + (ERNST_LABEL[b.ernst] || b.ernst) + '</span></td>'
            + '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(b.code || '—') + '</td>'
            + '<td style="font-size:12px;font-weight:600">' + esc(b.titel) + '</td>'
            + '<td style="font-size:11px;color:var(--muted);max-width:340px">' + esc(b.omschrijving || '') + '</td>'
            + '<td class="mono" style="font-size:11px">' + new Date(b.gevonden_op).toLocaleDateString('nl-NL') + '</td>'
            + '<td><button class="btn-ghost btn-veiligheid-opgelost" data-id="' + esc(b.id) + '" style="font-size:10px;padding:3px 8px">Markeer opgelost</button></td>'
            + '</tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div>';

      html += '<div class="table-wrap"><div class="table-hdr"><div class="table-title">Recent gefixt / afgehandeld</div></div>';
      if (!gefixt.length) {
        html += '<div class="empty">Nog niets.</div>';
      } else {
        html += '<table><thead><tr><th>Status</th><th>Code</th><th>Titel</th><th>Opgelost</th></tr></thead><tbody>';
        gefixt.forEach(function(b){
          html += '<tr>'
            + '<td><span class="tag" style="background:var(--teal-bg);color:var(--teal);border-color:var(--teal)">' + (b.status === 'gefixt' ? 'Gefixt' : 'Bewust uitgesteld') + '</span></td>'
            + '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(b.code || '—') + '</td>'
            + '<td style="font-size:12px">' + esc(b.titel) + '</td>'
            + '<td class="mono" style="font-size:11px">' + (b.opgelost_op ? new Date(b.opgelost_op).toLocaleDateString('nl-NL') : '—') + '</td>'
            + '</tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div>';

      el.innerHTML = html;

      function haalRapportLinkOp(nieuw) {
        var linkBtn = document.getElementById('btn-rapport-link');
        var out = document.getElementById('rapport-link-out');
        linkBtn.disabled = true; linkBtn.textContent = 'Bezig...';
        fetch(WORKER + '/mna/admin/veiligheid/rapport-link' + (nieuw ? '?nieuw=1' : ''), { headers: { 'x-admin-key': adminKey } })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (!d.ok) { toast(d.error || 'Fout bij ophalen link.', 'err'); return; }
            out.style.display = 'block';
            out.innerHTML = '<strong>Niet-publieke link (alleen delen via mail/gesprek):</strong><br>' + esc(d.url)
              + '<br><button class="btn-ghost" id="btn-rapport-open" style="font-size:11px;padding:3px 10px;margin-top:8px">&#8599; Open</button>'
              + ' <button class="btn-ghost" id="btn-rapport-kopieer" style="font-size:11px;padding:3px 10px;margin-top:8px">&#128203; Kopieer</button>';
            document.getElementById('btn-rapport-open').addEventListener('click', function(){ window.open(d.url, '_blank'); });
            document.getElementById('btn-rapport-kopieer').addEventListener('click', function(){ navigator.clipboard.writeText(d.url).then(function(){ toast('Link gekopieerd.', 'ok'); }); });
          })
          .catch(function(){ toast('Verbindingsfout.', 'err'); })
          .finally(function(){ linkBtn.disabled = false; linkBtn.textContent = '📄 Beveiligingsrapport ophalen'; });
      }
      var rapportBtn = document.getElementById('btn-rapport-link');
      if (rapportBtn) rapportBtn.addEventListener('click', function(){ haalRapportLinkOp(false); });
      var rapportNieuwBtn = document.getElementById('btn-rapport-nieuw');
      if (rapportNieuwBtn) rapportNieuwBtn.addEventListener('click', function(){
        if (!confirm('Nieuwe code genereren? Elke eerder verstuurde link stopt dan direct met werken.')) return;
        haalRapportLinkOp(true);
      });

      var auditAanvraagBtn = document.getElementById('btn-audit-aanvragen');
      if (auditAanvraagBtn) auditAanvraagBtn.addEventListener('click', async function() {
        if (!confirm('Diepe audit aanvragen voor zowel de frontend- als de backend-repo? Dit kost AI-tokens (facturering) en start niet direct — een cloud-routine pikt de aanvraag binnen ~15 min op.')) return;
        auditAanvraagBtn.disabled = true; auditAanvraagBtn.textContent = 'Bezig...';
        try {
          var r = await fetch(WORKER + '/mna/admin/veiligheid/diepe-audit/aanvragen', { method: 'POST', headers: { 'x-admin-key': adminKey } });
          var d = await r.json();
          if (!r.ok) { toast(d.error || 'Aanvraag mislukt.', 'err'); }
          else if (d.al_in_behandeling) { toast('Er staat al een aanvraag open (status: ' + d.status + ').', 'warn'); }
          else { toast('Audit aangevraagd — de routine pikt dit binnen ~15 min op.', 'ok'); }
          laadVeiligheid();
        } catch(e) { toast('Verbindingsfout.', 'err'); }
        finally { auditAanvraagBtn.disabled = false; auditAanvraagBtn.textContent = '⚡ Draai diepe audit nu (frontend + backend)'; }
      });

      var nuBtn = document.getElementById('btn-veiligheid-nu');
      if (nuBtn) nuBtn.addEventListener('click', async function() {
        nuBtn.disabled = true; nuBtn.textContent = 'Bezig...';
        try {
          var r = await fetch(WORKER + '/mna/admin/veiligheid/selfcheck-nu', { method: 'POST', headers: { 'x-admin-key': adminKey } });
          var d = await r.json();
          if (d.ok) { toast('Selfcheck uitgevoerd: ' + (d.resultaat ? d.resultaat.checks_geslaagd + '/' + d.resultaat.checks_totaal + ' geslaagd' : ''), d.resultaat && d.resultaat.checks_geslaagd === d.resultaat.checks_totaal ? 'ok' : 'warn'); laadVeiligheid(); }
          else { toast(d.error || 'Fout bij selfcheck.', 'err'); }
        } catch(e) { toast('Verbindingsfout.', 'err'); }
        finally { nuBtn.disabled = false; nuBtn.textContent = '↻ Draai selfcheck nu'; }
      });
      el.querySelectorAll('.btn-veiligheid-opgelost').forEach(function(btn){
        btn.addEventListener('click', async function() {
          btn.disabled = true;
          try {
            var r = await fetch(WORKER + '/mna/admin/veiligheid/bevinding', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey }, body: JSON.stringify({ id: btn.dataset.id, status: 'gefixt' }) });
            var d = await r.json();
            if (d.ok) { toast('Bevinding gemarkeerd als opgelost.', 'ok'); laadVeiligheid(); }
            else { toast(d.error || 'Fout.', 'err'); btn.disabled = false; }
          } catch(e) { toast('Verbindingsfout.', 'err'); btn.disabled = false; }
        });
      });
    } catch(e) {
      el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout bij laden: ' + esc(e.message) + '</div>';
    }
  }

  await laadVeiligheid();
  // "Live/doorlopend" (Marcels verzoek 19 aug 2026): elke 60s verversen zolang dit tabblad open
  // staat — geen websocket/SSE-infrastructuur nodig, en de dagelijkse cron zelf draait toch maar
  // 1x per nacht, dus vaker pollen dan dit voegt niets toe.
  veiligheidRefreshTimer = setInterval(laadVeiligheid, 60000);
}

function toonUitnodigenModal() {
  var ov = document.createElement('div'); ov.className = 'overlay';
  var mo = document.createElement('div'); mo.className = 'modal'; mo.style.maxWidth = '480px';
  mo.innerHTML = '<div class="modal-title">&#9993; Adviseur uitnodigen</div>'
    + '<div style="font-size:13px;color:var(--mid);margin-bottom:1.25rem;line-height:1.7">De adviseur ontvangt een e-mail met een activatielink. Na activatie kan hij inloggen en eigen trajecten aanmaken.</div>'
    + '<div class="field"><label>Naam <span style="color:var(--red)">*</span></label><input type="text" id="inv-naam" placeholder="Voornaam achternaam"></div>'
    + '<div class="field"><label>Bedrijf</label><input type="text" id="inv-bedrijf" placeholder="Naam kantoor of bedrijf"></div>'
    + '<div class="field"><label>E-mailadres <span style="color:var(--red)">*</span></label><input type="email" id="inv-email" placeholder="E-mailadres adviseur"></div>'
    + '<div class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="inv-tester" style="width:auto"><label for="inv-tester" style="margin:0">Dit is een testaccount (testvoorwaarden + aansprakelijkheid nihil in de uitnodigingsmail)</label></div>'
    + '<div id="inv-err" style="color:var(--red);font-size:12px;margin-bottom:.75rem;display:none"></div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem">'
    + '<button class="btn-ghost" id="inv-ann">Annuleren</button>'
    + '<button class="btn" id="inv-ok" style="background:var(--teal)">&#9993; Uitnodiging versturen</button>'
    + '</div>';
  ov.appendChild(mo);
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('inv-ann').addEventListener('click', function() { document.body.removeChild(ov); });
  document.getElementById('inv-ok').addEventListener('click', async function() {
    var btn = this; btn.disabled = true; btn.textContent = 'Versturen...';
    var naam = document.getElementById('inv-naam').value.trim();
    var bedrijf = document.getElementById('inv-bedrijf').value.trim();
    var email = document.getElementById('inv-email').value.trim();
    var isTester = document.getElementById('inv-tester').checked;
    var errDiv = document.getElementById('inv-err');
    errDiv.style.display = 'none';
    if (!naam || !email) { errDiv.textContent = 'Naam en e-mail zijn verplicht.'; errDiv.style.display = 'block'; btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen'; return; }
    try {
      var r = await fetch(WORKER + '/gebruikers/uitnodigen', {
        method: 'POST',
        headers: {'Content-Type': 'application/json','x-admin-key':adminKey},
        body: JSON.stringify({naam, bedrijf, email, is_tester: isTester})
      });
      var d = await r.json();
      if (d.ok) {
        document.body.removeChild(ov);
        toast('Uitnodiging verstuurd naar ' + email + '.', 'ok');
        // Refresh gebruikerslijst
        var tc = document.getElementById('tc');
        if (tc) renderGebruikersTab(tc);
      } else {
        errDiv.textContent = d.error || 'Fout bij versturen.';
        errDiv.style.display = 'block';
        btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen';
      }
    } catch(e) {
      errDiv.textContent = 'Verbindingsfout.';
      errDiv.style.display = 'block';
      btn.disabled = false; btn.textContent = '✉ Uitnodiging versturen';
    }
  });
  document.getElementById('inv-naam').focus();
}
// ─────────────────────────────────────────────────────────────────────────────


renderLogin();

</script>
