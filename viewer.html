<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Koers voor Morgen — Meekijker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
:root{
  --void:#f6f2ea;--bg:#f6f2ea;--panel:#fff;
  --border:#d9dee3;--border2:#bfc8d0;
  --head:#0d1b2a;--sub:#16232e;--mid:#42525e;--muted:#8a8480;
  --teal:#3d6b63;--teal-light:#edf7f3;--teal-border:#b8ddd2;--teal-dark:#2c4f4a;
  --gold:#c49a4a;--gold-bg:#fdf8ee;--gold-border:#e8d99a;
  --red:#c0392b;--red-light:#fdf2f0;
  --r:5px;--r2:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){
  :root{
    --void:#0d1b2a;--bg:#132534;--panel:#132534;
    --border:#24384a;--border2:#33485c;
    --head:#f4f1e9;--sub:#e2e9ee;--mid:#a6b8c4;--muted:#8ca0ae;
    --teal:#5e9b8f;--teal-light:#1c352c;--teal-border:#2f5c4a;--teal-dark:#9cc8bd;
    --gold:#d8b36a;--gold-bg:#332c1a;--gold-border:#5c4f2a;
    --red:#e8746b;--red-light:#3a211f;
  }
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.5}
#app{min-height:100vh}

.login-outer{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2.25rem;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-brand{display:flex;align-items:center;gap:8px;margin-bottom:2rem}
.login-dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.login-brand-name{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.login-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.35rem}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.75rem;line-height:1.6}

.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;padding:10px 11px;outline:none}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(61,107,99,.08)}

.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;width:100%}
.btn:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.err-msg{color:var(--red);font-size:12px;background:var(--red-light);border:1px solid var(--red);border-radius:var(--r);padding:8px 10px;margin-bottom:.75rem;display:none}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px}
.hdr-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.hdr-mid{font-size:13px;color:var(--mid)}
.hdr-mid strong{color:var(--head)}
.hdr-right{display:flex;align-items:center;gap:.6rem}
.badge{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--teal-light);color:var(--teal);border:1px solid var(--teal-border)}
.badge-gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border)}

.wrap{max-width:820px;margin:0 auto;padding:2rem 1.5rem 4rem}
.notice{background:var(--teal-light);border:1px solid var(--teal-border);border-radius:var(--r2);padding:.9rem 1.1rem;font-size:12px;color:var(--mid);line-height:1.6;margin-bottom:1.75rem}
.notice strong{color:var(--sub)}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:1.5rem;overflow:hidden}
.panel-hdr{padding:.9rem 1.25rem;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel-body{padding:1.1rem 1.25rem}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:.5rem 0}

.dv-row{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.dv-row:last-child{border-bottom:none}
.dv-label{color:var(--mid);font-size:12.5px;flex:1}
.dv-val{color:var(--head);font-weight:500;font-size:12.5px;text-align:right;max-width:55%}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 .5rem;border-bottom:1px solid var(--border)}
td{padding:.6rem 0;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.doc-naam{font-weight:500;color:var(--head)}
.analyse-toggle{font-size:11px;color:var(--teal);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit}
.analyse-tekst{font-size:11.5px;color:var(--mid);line-height:1.6;margin-top:.4rem;white-space:pre-wrap;display:none;background:var(--bg);border-radius:var(--r);padding:.6rem .75rem}

.footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:2rem;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Security-fix 17 aug 2026 (extern codereview): ?worker= accepteerde voorheen elke waarde, waardoor
// een gekaapte link meekijker-gegevens naar een server van een aanvaller kon sturen. Whitelist naar
// alleen productie en de bekende staging-omgeving.
var _WORKER_WHITELIST=['https://kantoorinzicht.marcel-bisschops.workers.dev','https://kantoorinzicht-staging.marcel-bisschops.workers.dev'];
var _WORKER_PARAM=new URLSearchParams(location.search).get('worker')||'';
var WORKER=_WORKER_WHITELIST.includes(_WORKER_PARAM)?_WORKER_PARAM:'https://kantoorinzicht.marcel-bisschops.workers.dev';
var viewerCode='',info=null,dataRows=[],documenten=[],faseLabels={};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatDate(ts){if(!ts)return'—';var d=new Date(ts);return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}

function renderLogin(foutmelding){
  document.getElementById('app').innerHTML=''
    +'<div class="login-outer"><div class="login-card">'
    +'<div class="login-brand"><span class="login-dot"></span><span class="login-brand-name">Koers voor Morgen</span></div>'
    +'<div class="login-title">Meekijker-toegang</div>'
    +'<div class="login-sub">Alleen-lezen inzicht in een M&amp;A-traject. Voer de toegangscode in die u van uw contactpersoon heeft ontvangen.</div>'
    +'<div class="field"><label>Toegangscode</label><input type="text" id="vc-input" autocomplete="off" autocapitalize="characters"></div>'
    +'<div class="err-msg" id="vc-err"'+(foutmelding?' style="display:block"':'')+'>'+esc(foutmelding||'')+'</div>'
    +'<button class="btn" id="vc-login">Inloggen</button>'
    +'</div></div>';
  document.getElementById('vc-input').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  document.getElementById('vc-login').addEventListener('click',doLogin);
  document.getElementById('vc-input').focus();
}

async function doLogin(){
  var code=document.getElementById('vc-input').value.trim();
  if(!code){return;}
  var btn=document.getElementById('vc-login');btn.disabled=true;btn.textContent='Bezig...';
  try{
    var r=await fetch(WORKER+'/mna/viewer/info?code='+encodeURIComponent(code));
    var d=await r.json();
    if(!d.ok){renderLogin(d.error||'Inloggen mislukt.');return;}
    viewerCode=code;info=d;
    if(!info.voorwaarden_akkoord){renderVoorwaarden();return;}
    await naarDashboard();
  }catch(e){renderLogin('Verbindingsfout. Probeer het opnieuw.');}
}

async function naarDashboard(){
  await laadData();
  await laadDocumenten();
  await laadFaseLabels();
  renderDashboard();
}

function renderVoorwaarden(){
  document.getElementById('app').innerHTML=''
    +'<div class="login-outer"><div class="login-card" style="max-width:480px">'
    +'<div class="login-brand"><span class="login-dot"></span><span class="login-brand-name">Koers voor Morgen</span></div>'
    +'<div class="login-title">Vertrouwelijkheidsverklaring</div>'
    +'<div class="login-sub">U krijgt zo meteen alleen-lezen inzage in vertrouwelijke bedrijfsgegevens van <strong style="color:var(--head)">'+esc(info.kantoor_naam)+'</strong>, in het kader van een lopend overnametraject. Voordat u verdergaat:</div>'
    +'<ul style="font-size:12.5px;color:var(--mid);line-height:1.7;margin:0 0 1.25rem 1.1rem;padding:0">'
    +'<li>U behandelt deze gegevens vertrouwelijk en deelt ze niet met derden</li>'
    +'<li>U gebruikt de gegevens uitsluitend voor het doel waarvoor deze toegang aan u is verleend</li>'
    +'<li>Deze toegang is alleen-lezen en kan op elk moment door de begeleider worden ingetrokken</li>'
    +'</ul>'
    +'<label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--mid);line-height:1.5;margin-bottom:1.25rem;cursor:pointer"><input type="checkbox" id="vw-akkoord" style="margin-top:2px"> Ik ga akkoord en wil de gegevens inzien.</label>'
    +'<div class="err-msg" id="vw-err"></div>'
    +'<button class="btn" id="vw-verder">Doorgaan naar de gegevens</button>'
    +'</div></div>';
  document.getElementById('vw-verder').addEventListener('click',async function(){
    var err=document.getElementById('vw-err');err.style.display='none';
    if(!document.getElementById('vw-akkoord').checked){err.style.display='block';err.textContent='Vink eerst het vakje aan om verder te gaan.';return;}
    var btn=this;btn.disabled=true;btn.textContent='Bezig...';
    try{
      var r=await fetch(WORKER+'/mna/viewer/voorwaarden/accepteren',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:viewerCode})});
      var d=await r.json();
      if(!d.ok){err.style.display='block';err.textContent='Kon niet doorgaan. Probeer het opnieuw.';btn.disabled=false;btn.textContent='Doorgaan naar de gegevens';return;}
      info.voorwaarden_akkoord=true;
      await naarDashboard();
    }catch(e){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='Doorgaan naar de gegevens';}
  });
}

async function laadData(){
  try{
    var r=await fetch(WORKER+'/mna/viewer/data?code='+encodeURIComponent(viewerCode));
    var d=await r.json();
    dataRows=d.ok?(d.data||[]):[];
  }catch(e){dataRows=[];}
}
async function laadDocumenten(){
  try{
    var r=await fetch(WORKER+'/mna/viewer/documenten?code='+encodeURIComponent(viewerCode));
    var d=await r.json();
    documenten=d.ok?(d.documenten||[]):[];
  }catch(e){documenten=[];}
}
async function laadFaseLabels(){
  faseLabels={};
  try{
    var r=await fetch(WORKER+'/mna/sectorprofielen');
    var d=await r.json();
    var profiel=d.profielen&&d.profielen[info.sector||'accountancy'];
    var fieldLabels={};
    (profiel&&profiel.fases||[]).forEach(function(f){
      faseLabels[f.id]=(f.num?f.num+'. ':'')+f.title;
      (f.dataFields||[]).forEach(function(df){if(!df.header)fieldLabels[f.id+'::'+df.id]=df.label;});
    });
    window._viewerFieldLabels=fieldLabels;
  }catch(e){}
}
function faseLabel(id){return faseLabels[id]||id;}
function veldLabel(faseId,veldId){var fl=window._viewerFieldLabels||{};return fl[faseId+'::'+veldId]||veldId;}

function renderDashboard(){
  var scopeTekst=info.scope_fase&&info.scope_fase!=='alle'?('Alleen fase: '+esc(faseLabel(info.scope_fase))):'Alle fases';
  var html='<div class="hdr">'
    +'<div class="hdr-brand"><span class="hdr-dot"></span>Koers voor Morgen</div>'
    +'<div class="hdr-mid">Meekijker bij <strong>'+esc(info.kantoor_naam)+'</strong></div>'
    +'<div class="hdr-right"><span class="badge">'+esc(info.viewer_naam)+'</span><span class="badge badge-gold">'+esc(info.viewer_type||'—')+'</span></div>'
    +'</div>'
    +'<div class="wrap">'
    +'<div class="notice"><strong>Alleen-lezen toegang.</strong> U kunt niets wijzigen, uploaden of verwijderen. Zichtbaarheid: '+scopeTekst+'. Traject-status: '+esc(info.traject_status||'—')+', huidige fase: '+esc(faseLabel(info.traject_fase)||'—')+'.</div>';

  html+='<div class="panel"><div class="panel-hdr">Due diligence-gegevens</div><div class="panel-body">';
  var faseData=dataRows.filter(function(r){return r.data_json&&r.data_json!=='{}';});
  if(!faseData.length){
    html+='<div class="empty">Nog geen gegevens ingevuld binnen uw zichtbare scope.</div>';
  } else {
    faseData.forEach(function(r){
      var velden;
      try{velden=JSON.parse(r.data_json||'{}');}catch(e){velden={};}
      var keys=Object.keys(velden).filter(function(k){return velden[k]!==''&&velden[k]!=null;});
      if(!keys.length)return;
      html+='<div style="margin-bottom:1rem"><div style="font-size:11px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem">'+esc(faseLabel(r.fase_id))+'</div>';
      keys.forEach(function(k){
        html+='<div class="dv-row"><div class="dv-label">'+esc(veldLabel(r.fase_id,k))+'</div><div class="dv-val">'+esc(velden[k])+'</div></div>';
      });
      html+='</div>';
    });
  }
  html+='</div></div>';

  html+='<div class="panel"><div class="panel-hdr">Documenten</div><div class="panel-body">';
  if(!documenten.length){
    html+='<div class="empty">Geen documenten binnen uw zichtbare scope.</div>';
  } else {
    html+='<table><thead><tr><th>Bestand</th><th>Fase</th><th>Datum</th></tr></thead><tbody>';
    documenten.forEach(function(d,i){
      html+='<tr><td><div class="doc-naam">'+esc(d.bestand_naam)+'</div>'
        +(d.analyse?'<button class="analyse-toggle" data-i="'+i+'">AI-analyse tonen</button><div class="analyse-tekst" id="an-'+i+'">'+esc(d.analyse)+'</div>':'')
        +'</td><td>'+esc(faseLabel(d.fase_id))+'</td><td>'+formatDate(d.uploaded_at)+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div></div>';

  html+='<div class="footer-note">Deze toegang is op elk moment intrekbaar door de begeleider van dit traject.</div>';
  html+='</div>';
  document.getElementById('app').innerHTML=html;

  document.querySelectorAll('.analyse-toggle').forEach(function(b){
    b.addEventListener('click',function(){
      var t=document.getElementById('an-'+b.dataset.i);
      var open=t.style.display==='block';
      t.style.display=open?'none':'block';
      b.textContent=open?'AI-analyse tonen':'AI-analyse verbergen';
    });
  });
}

renderLogin();
</script>
</body>
</html>
