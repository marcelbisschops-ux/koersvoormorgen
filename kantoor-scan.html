<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategische Kantoor Scan — KantoorInzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#0b0d0f;--deep:#111418;--panel:#161b21;--card:#1c2229;
  --border:#252d37;--border2:#2f3a47;--muted:#4a5868;--mid:#6b7d8f;
  --body:#9aabb8;--sub:#c4d0d9;--head:#e8edf2;--white:#f4f7fa;
  --teal:#22c5a0;--teal-dim:#1a9b7e;--teal-dark:#0f5c4a;--teal-bg:rgba(34,197,160,.08);
  --gold:#c9a84c;--gold-bg:rgba(201,168,76,.08);
  --red:#e05252;--red-bg:rgba(224,82,82,.08);
  --r:6px;--r2:10px;
}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--body);min-height:100vh;font-size:15px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
#app{min-height:100vh}

/* INTRO */
.intro-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4rem 2rem;position:relative;overflow:hidden}
.intro-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 70% 30%,rgba(34,197,160,.04),transparent 70%),radial-gradient(ellipse 400px 600px at 20% 80%,rgba(201,168,76,.03),transparent 70%);pointer-events:none}
.intro-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.2;pointer-events:none}
.intro-inner{max-width:700px;width:100%;text-align:center;position:relative;z-index:1}
.wordmark{display:inline-flex;align-items:center;gap:10px;margin-bottom:2.5rem;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:1.25rem}
.intro-h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:600;color:var(--white);line-height:1.1;margin-bottom:1.25rem}
.intro-h1 em{font-style:italic;color:var(--teal)}
.intro-sub{font-size:15px;color:var(--sub);line-height:1.75;max-width:500px;margin:0 auto 2.5rem;font-weight:300}
.kpi-row{display:flex;justify-content:center;gap:2rem;margin-bottom:2.5rem;flex-wrap:wrap}
.kpi-item{text-align:center}
.kpi-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--head);line-height:1;margin-bottom:.2rem}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi-div{width:1px;height:36px;background:var(--border2);align-self:center}
.dim-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:2.5rem}
.dim-chip{font-size:11px;font-weight:500;padding:4px 11px;border-radius:3px;border:1px solid var(--border2);color:var(--mid);background:var(--panel)}
.btn-start{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:var(--void);font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:14px 32px;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s}
.btn-start:hover{background:var(--teal-dim);transform:translateY(-1px)}
.intro-foot{margin-top:3rem;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center}
.intro-foot::before,.intro-foot::after{content:'';flex:1;max-width:80px;height:1px;background:var(--border)}

/* PAGE SHELL */
.page-wrap{max-width:860px;margin:0 auto;padding:2rem 2rem 5rem}
.page-wrap.narrow{max-width:680px}
.page-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0;border-bottom:1px solid var(--border);margin-bottom:2.5rem}
.page-brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.page-step{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}

/* INTAKE */
.intake-title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--white);font-weight:600;margin-bottom:.5rem}
.intake-sub{font-size:13px;color:var(--mid);line-height:1.65;margin-bottom:2rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;transition:border-color .12s;-webkit-appearance:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field select option{background:var(--panel)}
.field textarea{resize:vertical;min-height:72px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.note-box{font-size:12px;color:var(--muted);line-height:1.6;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:2rem}
.note-box strong{color:var(--sub)}

/* PROGRESS */
.prog-section{margin-bottom:2.5rem}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.75rem}
.prog-lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.prog-frac{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.prog-track{height:2px;background:var(--border2);border-radius:1px;position:relative;overflow:visible}
.prog-fill{height:100%;background:var(--teal);border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px rgba(34,197,160,.5)}
.prog-steps{display:flex;gap:3px;margin-top:10px}
.p-step{flex:1;height:3px;border-radius:1px;background:var(--border);transition:background .3s}
.p-step.done{background:var(--teal-dark)}
.p-step.active{background:var(--teal)}

/* SECTION HEAD */
.sec-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--teal);border:1px solid var(--teal-dark);background:var(--teal-bg);padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:.6rem}
.sec-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--white);font-weight:600;margin-bottom:.4rem}
.sec-desc{font-size:14px;color:var(--mid);line-height:1.65;margin-bottom:2rem}

/* QUESTION CARDS */
.q-stack{display:flex;flex-direction:column;gap:12px;margin-bottom:2.5rem}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem 1.5rem;transition:border-color .15s}
.q-card.answered{border-color:var(--border2)}
.q-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.q-text{font-size:14px;color:var(--sub);line-height:1.6;flex:1}
.q-hint{font-size:11px;color:var(--muted);font-style:italic;margin-top:3px}
.q-val{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500;color:var(--muted);min-width:24px;text-align:right;flex-shrink:0;transition:color .12s}
.q-val.set{color:var(--teal)}
.likert{display:flex;gap:6px}
.l-btn{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;padding:9px 4px;border-radius:var(--r);cursor:pointer;transition:all .1s;text-align:center}
.l-btn:hover{border-color:var(--border2);color:var(--sub);background:var(--panel)}
.l-btn.sel{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.likert-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:6px;padding:0 2px;text-transform:uppercase}

/* NAV */
.scan-nav{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 0;border-top:1px solid var(--border)}
.nav-info{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 20px;border-radius:var(--r);cursor:pointer;transition:all .12s}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-ghost:disabled{opacity:0;pointer-events:none}
.btn-adv{background:var(--teal);color:var(--void);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 24px;border-radius:var(--r);border:none;cursor:pointer;transition:all .12s;letter-spacing:.02em}
.btn-adv:hover{background:var(--teal-dim)}
.btn-adv:disabled{background:var(--border2);color:var(--muted);cursor:default}

/* RESULTS */
.r-header{border-bottom:1px solid var(--border);padding:1.5rem 0 2rem;margin-bottom:2.5rem}
.r-brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.r-brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.r-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.kantoor-slug{font-family:'Playfair Display',serif;font-size:1rem;color:var(--teal);font-style:italic;margin-bottom:.3rem}
.report-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:600;color:var(--white);line-height:1.1;margin-bottom:.5rem}
.report-title em{font-style:italic;color:var(--teal)}
.report-sub{font-size:13px;color:var(--mid);line-height:1.65}
.score-hero{display:flex;align-items:center;gap:2rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem 2.5rem;margin-bottom:1.25rem}
.score-circle{position:relative;flex-shrink:0;width:110px;height:110px}
.score-circle svg{transform:rotate(-90deg)}
.score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-big{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:600;color:var(--white);line-height:1}
.score-denom{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.score-verdict{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:600;color:var(--head);margin-bottom:.4rem}
.score-explain{font-size:13px;color:var(--mid);line-height:1.65}
.bench-strip{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:2rem;font-size:12px;flex-wrap:wrap}
.bench-lbl{color:var(--muted);font-weight:500;white-space:nowrap}
.bench-track{flex:1;min-width:120px;height:6px;background:var(--border2);border-radius:3px;position:relative}
.bench-bar{height:100%;border-radius:3px;background:var(--teal)}
.bench-marker{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);background:var(--panel);transform:translateX(-50%)}
.bench-leg{display:flex;gap:12px;flex-shrink:0}
.bench-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.bench-dot{width:8px;height:8px;border-radius:50%}
.sec-lbl{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:2.5rem}
@media(max-width:560px){.dim-grid{grid-template-columns:1fr}}
.dim-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dim-top{display:flex;align-items:center;justify-content:space-between}
.dim-name{font-size:12px;font-weight:500;color:var(--sub)}
.dim-val{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500}
.dim-bar-bg{height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.dim-bar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.dim-flag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.matrix-sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem;margin-bottom:2.5rem}
.matrix-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--head);font-weight:600;margin-bottom:.25rem}
.matrix-sub{font-size:12px;color:var(--muted);margin-bottom:1.5rem}
.matrix-body{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap}
.quadrant-list{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.q-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--r);border:1px solid transparent;font-size:12px}
.q-item.active{border-color:var(--teal);background:var(--teal-bg)}
.q-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.q-iname{color:var(--sub);font-weight:500;line-height:1.4}
.q-idesc{color:var(--muted);margin-top:2px;line-height:1.4}
.scenario-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:2.5rem}
.sc-card{border-radius:var(--r2);border:1px solid var(--border);overflow:hidden}
.sc-hdr{display:flex;align-items:center;gap:12px;padding:1rem 1.5rem;background:var(--panel);cursor:pointer;transition:background .12s}
.sc-hdr:hover{background:var(--card)}
.sc-rank{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;border:1px solid var(--border2);color:var(--muted);padding:2px 7px;border-radius:3px;flex-shrink:0}
.sc-rank.pri{border-color:var(--teal-dark);color:var(--teal);background:var(--teal-bg)}
.sc-name{font-size:14px;font-weight:600;color:var(--head);flex:1}
.sc-name.pri{color:var(--teal)}
.sc-fit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.sc-chev{color:var(--muted);font-size:11px;transition:transform .2s}
.sc-chev.open{transform:rotate(180deg)}
.sc-body{padding:1.25rem 1.5rem;background:var(--card);border-top:1px solid var(--border);display:none}
.sc-body.open{display:block}
.actions-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
.action-items{display:flex;flex-direction:column;gap:8px}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--panel);border-radius:var(--r);border:1px solid var(--border)}
.act-num{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;color:var(--teal);border:1px solid var(--teal-dark);background:var(--teal-bg);padding:1px 6px;border-radius:2px;flex-shrink:0;margin-top:1px}
.act-title{font-size:13px;color:var(--sub);font-weight:500;line-height:1.5}
.act-desc{font-size:12px;color:var(--mid);line-height:1.5;margin-top:2px}
.act-horizon{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px}

/* AI PANEL */
.ai-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:2.5rem}
.ai-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);background:var(--card);gap:1rem;flex-wrap:wrap}
.ai-badge{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:rgba(34,197,160,.12);color:var(--teal);border:1px solid var(--teal-dark)}
.ai-title-group{display:flex;align-items:center;gap:10px}
.ai-panel-name{font-family:'Playfair Display',serif;font-size:1rem;color:var(--head);font-weight:600}
.ai-panel-sub{font-size:12px;color:var(--muted);margin-top:1px}
.btn-gen{display:flex;align-items:center;gap:8px;background:var(--teal);color:var(--void);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer;transition:all .12s;white-space:nowrap;flex-shrink:0}
.btn-gen:hover{background:var(--teal-dim)}
.btn-gen:disabled{background:var(--border2);color:var(--muted);cursor:default}
.ai-body{padding:1.5rem}
.ai-placeholder{text-align:center;padding:2.5rem 1rem}
.ai-placeholder-icon{font-size:2rem;margin-bottom:.75rem;opacity:.35}
.ai-placeholder-text{font-size:13px;color:var(--muted);line-height:1.65;max-width:400px;margin:0 auto}
.ai-loading{display:flex;align-items:center;gap:12px;padding:.5rem 0;font-size:13px;color:var(--mid)}
.ai-spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--teal);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-output{font-size:14px;color:var(--mid);line-height:1.8}
.ai-output h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--head);font-weight:600;margin:1.25rem 0 .5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.ai-output h3:first-child{margin-top:0;padding-top:0;border-top:none}
.ai-output p{margin-bottom:.65rem}
.ai-output strong{color:var(--sub);font-weight:600}
.ai-output ul{margin:.5rem 0 .75rem 1.1rem;display:flex;flex-direction:column;gap:3px}
.ai-output ul li{font-size:13px}
.ai-cursor{display:inline-block;width:2px;height:14px;background:var(--teal);margin-left:2px;vertical-align:text-bottom;animation:blink .8s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2.5rem}
@media(max-width:560px){.risk-grid{grid-template-columns:1fr}}
.risk-card{background:var(--panel);border-radius:var(--r);border:1px solid var(--border);padding:12px 14px}
.risk-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.risk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.risk-name{font-size:12px;font-weight:500;color:var(--sub)}
.risk-body{font-size:11px;color:var(--muted);line-height:1.55}
.r-footer{border-top:1px solid var(--border);padding-top:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-note{font-size:12px;color:var(--muted);max-width:380px;line-height:1.6}
.footer-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn-print{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--r);cursor:pointer;transition:all .12s}
.btn-print:hover{border-color:var(--mid);color:var(--sub)}
.btn-restart{background:var(--teal);color:var(--void);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r);border:none;cursor:pointer;transition:all .12s}
.btn-restart:hover{background:var(--teal-dim)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:440px;width:100%}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--white);font-weight:600;margin-bottom:.5rem}
.modal-sub{font-size:13px;color:var(--mid);line-height:1.65;margin-bottom:1.25rem}
.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:.75rem}
.modal-field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.modal-field input{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 12px;outline:none;transition:border-color .12s;width:100%}
.modal-field input:focus{border-color:var(--teal)}
.modal-note{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:1.5rem}
.modal-note a{color:var(--teal);text-decoration:none}

/* ═══ SCORING ═══ */
function calcScores(){
  const s={};
  SECTIONS.forEach(sec=>{
    let tot=0,cnt=0;
    sec.questions.forEach(q=>{
      if(ST.answers[q.id]!==undefined){
        let v=ST.answers[q.id];
        if(REVERSE.has(q.id)) v=6-v;
        tot+=v;cnt++;
      }
    });
    s[sec.id]=cnt>0?Math.round((tot/(cnt*5))*100):0;
  });
  return s;
}

function rankScenarios(s){
  return Object.entries(SCENARIOS)
    .map(([k,sc])=>({k,...sc,score:Math.min(100,sc.fit(s))}))
    .sort((a,b)=>b.score-a.score);
}

function overall(s){return Math.round(Object.values(s).reduce((a,b)=>a+b,0)/Object.values(s).length)}

function verdict(v){
  if(v>=72)return{label:'Sterk strategisch profiel',color:'var(--teal)',bg:'var(--teal-bg)',txt:'Het kantoor beschikt over een solide strategische basis. De kernwaardedrivers zijn goed ontwikkeld.'};
  if(v>=52)return{label:'Gemiddeld profiel — actie vereist',color:'var(--gold)',bg:'var(--gold-bg)',txt:'Het kantoor functioneert redelijk, maar er zijn duidelijke verbeterpunten die de waarde beperken.'};
  return{label:'Kwetsbaar profiel — urgente actie',color:'var(--red)',bg:'var(--red-bg)',txt:'Meerdere kritieke dimensies vereisen onmiddellijke aandacht.'};
}

function dc(v){return v>=70?'var(--teal)':v>=50?'var(--gold)':'var(--red)'}
function df(v){return v>=70?{l:'Sterk',c:'var(--teal)'}:v>=50?{l:'Gemiddeld',c:'var(--gold)'}:{l:'Aandacht vereist',c:'var(--red)'}}

/* ═══ AI ═══ */
async function generateAI(){
  const s=ST.scores; const ov=overall(s); const vd=verdict(ov);
  const top3=ST.scenarios.slice(0,3).map(sc=>`${sc.name} (${sc.score}% fit)`).join(', ');
  const p=ST.profile;
  const dims=SECTIONS.map(sec=>`- ${sec.label}: ${s[sec.id]}/100`).join('\n');
  const risks=SECTIONS.filter(sec=>s[sec.id]<55).map(sec=>sec.label).join(', ')||'geen kritieke risico\'s';

  const prompt=`Je bent een senior strategisch adviseur gespecialiseerd in administratie- en accountantskantoren in Nederland. Je combineert de diepgang van een M&A-adviseur met praktische sectorkennis.

KANTOORPROFIEL:
- Naam: ${p.naam||'Niet opgegeven'}
- Regio: ${p.regio||'Niet opgegeven'}
- Medewerkers (fte): ${p.fte||'Niet opgegeven'}
- Jaaromzet: ${p.omzet||'Niet opgegeven'}
- Specialisme: ${p.specialisme||'Generalistisch'}
- Doelgroep: ${p.doelgroep||'MKB algemeen'}
- Software: ${p.software||'Onbekend'}
- Strategische ambitie: ${p.ambitie||'Niet opgegeven'}
- Context: ${p.context||'Geen aanvullende context'}

SCANRESULTATEN:
Totaalscore: ${ov}/100 — ${vd.label}
${dims}
Aanbevolen scenario's: ${top3}
Risicosignalen: ${risks}

Schrijf een professioneel, gepersonaliseerd strategisch memo. Gebruik ## voor hoofdstukken en ** voor vetgedrukte sleutelzinnen. Schrijf scherp, direct en zonder open deuren. Verwerk de kantoorgegevens actief in het advies.

## Strategisch oordeel
[2-3 zinnen directe diagnose afgestemd op dit kantoor]

## Kritieke inzichten
[De 2–3 meest urgente bevindingen met verwijzing naar specifieke scores]

## Strategisch advies
[Concreet advies passend bij het aanbevolen scenario, omvang en ambitie van dit kantoor]

## Eerste 90 dagen
[3 concrete prioriteiten met eigenaar en gewenst resultaat]

## Waarschuwingssignaal
[Één kritisch risico dat dit kantoor nu waarschijnlijk onderschat]`;

  ST.aiLoading=true;ST.aiText='';render();

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        stream:true,
        messages:[{role:'user',content:prompt}]
      })
    });

    if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`)}

    const reader=resp.body.getReader();const dec=new TextDecoder();
    ST.aiLoading=false;ST.aiText='';

    while(true){
      const{done,value}=await reader.read();if(done)break;
      const chunk=dec.decode(value,{stream:true});
      for(const line of chunk.split('\n')){
        if(line.startsWith('data:')){
          const d=line.slice(5).trim();if(d==='[DONE]')continue;
          try{const j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta?.text){ST.aiText+=j.delta.text;updateAI()}}catch(e){}
        }
      }
    }
    updateAI(true);
  }catch(err){
    ST.aiLoading=false;
    ST.aiText=`**Fout:** ${err.message}\n\nControleer uw API-sleutel (invoeren via de knop) en probeer opnieuw.`;
    updateAI(true);
  }
}

function updateAI(final=false){
  const el=document.getElementById('ai-out');
  if(el) el.innerHTML=renderAIText(ST.aiText,!final);
}

function renderAIText(text,cursor=false){
  if(!text&&ST.aiLoading)return`<div class="ai-loading"><div class="ai-spinner"></div>Strategisch memo wordt gegenereerd…</div>`;
  if(!text)return`<div class="ai-placeholder"><div class="ai-placeholder-icon">◈</div><p class="ai-placeholder-text">Klik op "Genereer AI-advies" om een volledig gepersonaliseerd strategisch memo te ontvangen op basis van de scanresultaten en het kantoorprofiel.</p></div>`;
  let html=text
    .replace(/## (.+)/g,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/(<li>[^]*?<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  html=html.split('\n\n').map(p=>p.trim()&&!p.startsWith('<')?`<p>${p}</p>`:p).join('');
  if(cursor)html+=`<span class="ai-cursor"></span>`;
  return`<div class="ai-output">${html}</div>`;
}

/* ═══ RENDER ═══ */
function render(){
  const app=document.getElementById('app');
  if(ST.screen==='intro')app.innerHTML=rIntro();
  else if(ST.screen==='intake')app.innerHTML=rIntake();
  else if(ST.screen==='questions')app.innerHTML=rQuestions();
  else if(ST.screen==='results')app.innerHTML=rResults();
  if(ST.showModal)renderModal();
  bindEvents();
}

      <select id="f-omzet"><option value="">Selecteer…</option>${['< €300k','€300k – €700k','€700k – €1,5m','€1,5m – €3m','€3m – €7m','> €7m'].map(v=>`<option${p.omzet===v?' selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Specialisme of niche</label><input type="text" id="f-spec" placeholder="bijv. agri, vastgoed, zorg, generalist" value="${p.specialisme}"></div>
    <div class="field"><label>Primaire doelgroep</label><input type="text" id="f-doel" placeholder="bijv. MKB, ZZP, familiebedrijven" value="${p.doelgroep}"></div>
    <div class="field"><label>Gebruikte software</label><input type="text" id="f-sw" placeholder="bijv. Exact, Twinfield, Yuki, Afas" value="${p.software}"></div>
    <div class="field"><label>Strategische ambitie</label>
      <select id="f-ambitie"><option value="">Selecteer…</option>${['Stabiel houden','Groeien (organisch)','Groeien (via overnames)','Fusie of samenwerking','Verkoop (3–7 jaar)','Opvolging regelen'].map(v=>`<option${p.ambitie===v?' selected':''}>${v}</option>`).join('')}</select></div>
  </div>
  <div class="form-grid full anim a2">
    <div class="field"><label>Aanvullende context (optioneel)</label>
      <textarea id="f-context" placeholder="Wat speelt er momenteel? Bijzondere omstandigheden, recente ontwikkelingen, specifieke vragen…">${p.context}</textarea></div>
  </div>
  <div class="note-box anim a2"><strong>Privacy:</strong> Uw gegevens worden alleen gebruikt voor het genereren van uw persoonlijke rapport en worden niet opgeslagen op externe servers.</div>
  <div class="scan-nav anim a3">
    <button class="btn-ghost" id="back-intro">← Terug</button>
    <button class="btn-adv" id="start-scan">Naar de vragenlijst →</button>
  </div>
</div>`}

function rQuestions(){
  const sec=SECTIONS[ST.section];const total=SECTIONS.length;
  const answered=sec.questions.every(q=>ST.answers[q.id]!==undefined);
  const isLast=ST.section===total-1;
  const steps=SECTIONS.map((_,i)=>`<div class="p-step${i<ST.section?' done':i===ST.section?' active':''}"></div>`).join('');
  return`
<div class="page-wrap">
  <div class="page-hdr"><div class="page-brand"><div class="wdot"></div>KantoorInzicht</div><div class="page-step mono">STAP ${ST.section+1}/${total}</div></div>
  <div class="prog-section">
    <div class="prog-top"><div class="prog-lbl">${sec.label}</div><div class="prog-frac">${ST.section+1} / ${total}</div></div>
    <div class="prog-track"><div class="prog-fill" style="width:${(ST.section/total)*100}%"></div></div>
    <div class="prog-steps">${steps}</div>
  </div>
  <div class="anim"><span class="sec-badge">${sec.icon}</span><div class="sec-title">${sec.label}</div><div class="sec-desc">${sec.desc}</div></div>
  <div class="q-stack">
    ${sec.questions.map((q,qi)=>{const v=ST.answers[q.id];return`
    <div class="q-card${v!==undefined?' answered':''} anim a${qi+1}">
      <div class="q-row">
        <div><div class="q-text">${q.q}</div>${q.hint?`<div class="q-hint">${q.hint}</div>`:''}</div>
        <div class="q-val${v!==undefined?' set':''}">${v!==undefined?v:'—'}</div>
      </div>
      <div class="likert">${[1,2,3,4,5].map(n=>`<button class="l-btn${v===n?' sel':''}" data-q="${q.id}" data-v="${n}">${n}</button>`).join('')}</div>
      <div class="likert-axis"><span>Helemaal niet</span><span>Volledig</span></div>
    </div>`;}).join('')}
  </div>
  <div class="scan-nav">
    <div class="nav-info">${Object.keys(ST.answers).length} / 33 beantwoord</div>
    <div style="display:flex;gap:10px">
      <button class="btn-ghost" id="prev-btn" ${ST.section===0?'disabled':''}>← Terug</button>
      <button class="btn-adv" id="next-btn" ${!answered?'disabled':''}>${isLast?'Genereer rapport →':'Volgende →'}</button>
    </div>
  </div>
</div>`}

function rResults(){
  const s=ST.scores;const ov=overall(s);const vd=verdict(ov);
  const top3=ST.scenarios.slice(0,3);
  const mx=Math.round((s.schaal+s.auto+s.commercieel)/3);
  const my=Math.round((s.winst+s.klant+s.partner)/3);
  const bench=62;const p=ST.profile;
  const risks=SECTIONS.filter(sec=>s[sec.id]<55).slice(0,6);
  const now=new Date().toLocaleDateString('nl-NL',{year:'numeric',month:'long',day:'numeric'});

  return`
<div class="page-wrap">
  <div class="r-header anim">
    <div class="r-brand-row"><div class="r-brand"><div class="wdot"></div>KantoorInzicht — Strategische Kantoor Scan</div><div class="r-date">${now}</div></div>
    ${p.naam?`<div class="kantoor-slug">${p.naam}${p.regio?' · '+p.regio:''}</div>`:''}
    <h2 class="report-title">Strategisch <em>profiel</em> &amp; adviesrapport</h2>
    <p class="report-sub">Gebaseerd op 33 indicatoren over 11 strategische dimensies.${p.fte?' Kantoor '+p.fte+' fte'+( p.omzet?', '+p.omzet:'')+'.' :''}</p>
  </div>

  <div class="score-hero anim a1">
    <div class="score-circle">
      <svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="var(--border)" stroke-width="6"/><circle cx="55" cy="55" r="48" fill="none" stroke="${vd.color}" stroke-width="6" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-ov/100)}" stroke-linecap="round"/></svg>
      <div class="score-inner"><div class="score-big">${ov}</div><div class="score-denom">/100</div></div>
    </div>
    <div>
      <div style="margin-bottom:.5rem"><span style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:${vd.bg};color:${vd.color};border:1px solid ${vd.color}44">${vd.label}</span></div>
      <div class="score-explain">${vd.txt}</div>
    </div>
  </div>

  <div class="bench-strip anim a1">
    <span class="bench-lbl">Benchmark</span>
    <div class="bench-track"><div class="bench-bar" style="width:${ov}%"></div><div class="bench-marker" style="left:${bench}%"></div></div>
    <div class="bench-leg">
      <div class="bench-leg-item"><div class="bench-dot" style="background:var(--teal)"></div><span>Uw kantoor (${ov})</span></div>
      <div class="bench-leg-item"><div class="bench-dot" style="background:var(--gold)"></div><span>Sector (~${bench})</span></div>
    </div>
  </div>

  <div class="sec-lbl anim a2">Scores per dimensie</div>
  <div class="dim-grid anim a2">
    ${SECTIONS.map(sec=>{const v=s[sec.id];const f=df(v);return`<div class="dim-card">
      <div class="dim-top"><div class="dim-name">${sec.label}</div><div class="dim-val" style="color:${dc(v)}">${v}</div></div>
      <div class="dim-bar-bg"><div class="dim-bar" style="width:${v}%;background:${dc(v)}"></div></div>
      <div class="dim-flag" style="color:${f.c}">${f.l}</div>
    </div>`}).join('')}
  </div>

  <div class="sec-lbl anim a2">Positioneringsmatrix</div>
  <div class="matrix-sec anim a2">
    <div class="matrix-title">Strategische positiematrix</div>
    <div class="matrix-sub">Schaalbaarheid & commercieel (X) · Winstkracht & klantbinding (Y)</div>
    <div class="matrix-body">
      <div style="flex-shrink:0">
        <svg width="270" height="220" viewBox="0 0 270 220">
          <rect x="30" y="10" width="220" height="170" fill="var(--card)" rx="4"/>
          <rect x="30" y="10" width="110" height="85" fill="rgba(224,82,82,.07)" rx="4"/>
          <rect x="140" y="10" width="110" height="85" fill="rgba(201,168,76,.07)"/>
          <rect x="30" y="95" width="110" height="85" fill="rgba(201,168,76,.07)"/>
          <rect x="140" y="95" width="110" height="85" fill="rgba(34,197,160,.07)" rx="4"/>
          <line x1="140" y1="10" x2="140" y2="180" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>
          <line x1="30" y1="95" x2="250" y2="95" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="85" y="26" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Sans">Kwetsbaar</text>
          <text x="195" y="26" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Sans">Groei mogelijk</text>
          <text x="85" y="172" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Sans">Stabiel / defensief</text>
          <text x="195" y="172" text-anchor="middle" font-size="9" fill="var(--teal)" font-family="IBM Plex Sans">Sterk platform</text>
          <text x="140" y="207" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Sans">← Schaal & commercieel →</text>
          <circle cx="${30+(bench/100)*220}" cy="${180-((bench/100)*170)}" r="5" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity=".6"/>
          <circle cx="${30+(mx/100)*220}" cy="${180-((my/100)*170)}" r="9" fill="var(--teal)" opacity=".2"/>
          <circle cx="${30+(mx/100)*220}" cy="${180-((my/100)*170)}" r="5" fill="var(--teal)"/>
          ${p.naam?`<text x="${30+(mx/100)*220+9}" y="${180-((my/100)*170)-4}" font-size="8" fill="var(--teal)" font-family="IBM Plex Sans">${p.naam.split(/\s|&/)[0]}</text>`:''}
        </svg>
      </div>
      <div class="quadrant-list">
        ${[{q:'Sterk platform',d:'Hoge schaal + hoge winstkracht.',a:mx>50&&my>50},{q:'Groei mogelijk',d:'Lage schaal + hoge winstkracht.',a:mx<=50&&my>50},{q:'Stabiel / defensief',d:'Hoge schaal + lagere winstkracht.',a:mx>50&&my<=50},{q:'Kwetsbaar',d:'Lage schaal + lage winstkracht.',a:mx<=50&&my<=50}]
          .map(i=>`<div class="q-item${i.a?' active':''}"><div class="q-dot" style="background:${i.a?'var(--teal)':'var(--border2)'}"></div><div><div class="q-iname">${i.q}</div><div class="q-idesc">${i.d}</div></div></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="sec-lbl anim a3">Strategische scenario's & adviespad</div>
  <div class="scenario-cards anim a3">
    ${top3.map((sc,i)=>`<div class="sc-card">
      <div class="sc-hdr" data-k="${sc.k}">
        <span class="sc-rank${i===0?' pri':''}">${i===0?'AANBEVOLEN':i===1?'ALTERNATIEF':'OPTIONEEL'}</span>
        <span class="sc-name${i===0?' pri':''}">${sc.name}</span>
        <span class="sc-fit mono">${sc.score}% fit</span>
        <span class="sc-chev${ST.openScenario===sc.k?' open':''}">▾</span>
      </div>
      <div class="sc-body${ST.openScenario===sc.k?' open':''}">
        <div class="actions-lbl">Concrete vervolgstappen</div>
        <div class="action-items">
          ${sc.actions.map((a,ai)=>`<div class="action-item"><span class="act-num">0${ai+1}</span><div><div class="act-title">${a.t}</div><div class="act-desc">${a.d}</div><div class="act-horizon">${a.h}</div></div></div>`).join('')}
        </div>
      </div>
    </div>`).join('')}
  </div>

  <div class="sec-lbl anim a3">AI-strategisch memo</div>
  <div class="ai-panel anim a3">
    <div class="ai-panel-hdr">
      <div class="ai-title-group">
        <span class="ai-badge">AI · Claude</span>
        <div><div class="ai-panel-name">Gepersonaliseerd strategisch advies</div><div class="ai-panel-sub">Op basis van scanresultaten + kantoorprofiel — gegenereerd door Claude</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn-ghost" id="set-key-btn" style="font-size:11px;padding:7px 12px">🔑 API-sleutel</button>
        <button class="btn-gen" id="gen-btn" ${ST.aiLoading?'disabled':''}>
          ${ST.aiLoading?'<div class="ai-spinner" style="width:13px;height:13px;border-width:2px"></div> Genereren…':ST.aiText?'↺ Opnieuw':'◈ Genereer AI-advies'}
        </button>
      </div>
    </div>
    <div class="ai-body"><div id="ai-out">${renderAIText(ST.aiText,false)}</div></div>
  </div>

  ${risks.length>0?`
  <div class="sec-lbl anim a4">Risicovlaggen</div>
  <div class="risk-grid anim a4">
    ${risks.map(r=>`<div class="risk-card"><div class="risk-top"><div class="risk-dot" style="background:${dc(s[r.id])}"></div><div class="risk-name">${r.label}</div></div><div class="risk-body">Score ${s[r.id]}/100 — prioritaire aandacht vereist.</div></div>`).join('')}
  </div>`:''}

  <div class="r-footer anim a4">
    <p class="footer-note">Rapport gegenereerd door KantoorInzicht. Aanbevelingen zijn indicatief. © KantoorInzicht ${new Date().getFullYear()}</p>
    <div class="footer-btns">
      <button class="btn-print" onclick="window.print()">↓ PDF / Afdrukken</button>
      <button class="btn-restart" id="restart-btn">Nieuwe scan</button>
    </div>
  </div>
</div>`}

function renderModal(){
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-overlay" id="m-overlay">
    <div class="modal">
      <div class="modal-title">Anthropic API-sleutel</div>
      <div class="modal-sub">Voer uw Anthropic API-sleutel in om het AI-memo te genereren. De sleutel wordt alleen in uw browser opgeslagen.</div>
      <div class="modal-field"><label>API-sleutel</label><input type="password" id="key-inp" placeholder="sk-ant-…" value="${ST.apiKey}"></div>
      <div class="modal-note">Haal uw sleutel op via <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>. De sleutel verlaat uw browser niet.</div>
      <div class="modal-btns">
        <button class="btn-cancel" id="m-cancel">Annuleren</button>
        <button class="btn-confirm" id="m-confirm">Opslaan & genereren</button>
      </div>
    </div>
  </div>`;
}

/* ═══ EVENTS ═══ */
function bindEvents(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el)el[`on${ev}`]=fn};

  on('start-btn','click',()=>{ST.screen='intake';render()});
  on('back-intro','click',()=>{ST.screen='intro';render()});
  on('start-scan','click',()=>{
    ST.profile={naam:$('f-naam')?.value||'',regio:$('f-regio')?.value||'',fte:$('f-fte')?.value||'',omzet:$('f-omzet')?.value||'',specialisme:$('f-spec')?.value||'',doelgroep:$('f-doel')?.value||'',software:$('f-sw')?.value||'',ambitie:$('f-ambitie')?.value||'',context:$('f-context')?.value||''};
    ST.screen='questions';render();
  });
  on('prev-btn','click',()=>{if(ST.section>0){ST.section--;render()}});
  on('next-btn','click',()=>{
    const sec=SECTIONS[ST.section];
    if(!sec.questions.every(q=>ST.answers[q.id]!==undefined))return;
    if(ST.section<SECTIONS.length-1){ST.section++;render();}
    else{ST.scores=calcScores();ST.scenarios=rankScenarios(ST.scores);ST.screen='results';render();window.scrollTo(0,0);}
  });
  document.querySelectorAll('.l-btn').forEach(b=>{b.onclick=()=>{ST.answers[b.dataset.q]=parseInt(b.dataset.v);render()}});
  document.querySelectorAll('.sc-hdr').forEach(h=>{h.onclick=()=>{const k=h.dataset.k;ST.openScenario=ST.openScenario===k?null:k;render()}});

  on('gen-btn','click',()=>{
    if(!ST.apiKey){ST.showModal=true;render();}
    else generateAI();
  });
  on('set-key-btn','click',()=>{ST.showModal=true;render()});
  on('m-cancel','click',()=>{ST.showModal=false;render()});
  on('m-confirm','click',()=>{
    const k=$('key-inp')?.value||'';
    ST.apiKey=k;localStorage.setItem('ki_key',k);ST.showModal=false;render();
    generateAI();
  });
  on('m-overlay','click',(e)=>{if(e.target===$('m-overlay')){ST.showModal=false;render()}});
  on('restart-btn','click',()=>{
    ST={...ST,screen:'intro',section:0,answers:{},scores:null,scenarios:null,openScenario:null,aiText:null,aiLoading:false,profile:{naam:'',regio:'',fte:'',omzet:'',specialisme:'',doelgroep:'',software:'',ambitie:'',context:''}};
    render();window.scrollTo(0,0);
  });
}

render();
</script>
</body>
</html>
