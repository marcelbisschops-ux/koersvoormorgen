function rankScenarios(s){

  const ambitieBonus={
    'Stabiel houden':{'afweerstrategie':20,'zelfstandig-doorgroeien':10},

    'Investeerder / PE aan boord halen':{'pe-ready-maken':30,'verkoop-voorbereiden':10},
    'Opvolging regelen':{'opvolging-voorbereiden':25,'verkoop-voorbereiden':10},
  };
  // Context keywords
  const contextBonus={};
  if(/kop[ei]n|acquisiti|overnemen|overnemer/.test(context)){contextBonus['acquisitie']=25;contextBonus['regionaliseren']=10;}
  if(/verk[oa][op]|exit|uittreden/.test(context)){contextBonus['verkoop-voorbereiden']=20;contextBonus['pe-ready-maken']=10;}
  if(/fusie|samen[wv]erk/.test(context)){contextBonus['fusiepartner-zoeken']=20;}
  if(/opvolg|pensioen|overdracht/.test(context)){contextBonus['opvolging-voorbereiden']=20;}
  if(/pe|private equity|investeer/.test(context)){contextBonus['pe-ready-maken']=20;}
  const bonusMap={...(ambitieBonus[ambitie]||{}),...contextBonus};
  // PE al aanwezig? Dan PE-ready maken minder relevant
  const peAanwezig=(ST.answers&&ST.answers['f5']||0)>=4;
  return Object.entries(SCENARIOS).map(([k,sc])=>{
    const base=sc.fit(s);
    const bonus=bonusMap[k]||0;
    let penalty=0;
    if(k==='pe-ready-maken'&&peAanwezig) penalty=40;
    return {k,...sc,score:Math.max(0,Math.min(100,base+bonus-penalty))};
  }).sort((a,b)=>b.score-a.score);
}

async function callAI(prompt, maxTokens) {
  const resp = await fetch(WORKER + '/ai', {signal:AbortSignal.timeout(120000),
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [{ role: 'user', content: prompt }], max_tokens: maxTokens||10000 })
  });
  if (!resp.ok) {
    const errTxt = await resp.text().catch(() => String(resp.status));
    throw new Error('Worker fout ' + resp.status + ': ' + errTxt.substring(0, 200));
  }
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  const tekst = (data.text || '').trim();
  if (!tekst) throw new Error('Leeg antwoord van AI ontvangen');
  return opschonen(tekst);
}

function opschonen(tekst) {
  return tekst
    .replace(/\bdit kantoor\b/gi, 'uw kantoor')
    .replace(/\bDit kantoor\b/g, 'Uw kantoor')
    .replace(/^#{1}[^#][^\n]*\n/, '')
    .replace(/Opgesteld door[^\n]*\n?/gi, '')
    .replace(/Senior M&A-adviseur[^\n]*\n?/gi, '')
    .replace(/Marcel Bisschops[^\n]*marcel@bisschops[^\n]*/gi, '')
    .replace(/\+31[^\n]*op afspraak[^\n]*/gi, '')
    .replace(/^\*+Marcel Bisschops[^\n]*/gm, '')
    .replace(/^\*+[\s]*$/gm, '')
    .trim();
}

    const _isTimeout=_msg.toLowerCase().includes('timeout')||_msg.toLowerCase().includes('aborted');

    const _uitleg=_isTimeout?'De verbinding heeft te lang geduurd. Controleer uw internetverbinding en probeer opnieuw.'
      :_isNetwork?'Geen verbinding met de server. Controleer uw internetverbinding.'
      :_isServer?'De server heeft een fout gemeld. Probeer het over een minuut opnieuw.'
      :'Het rapport kon niet worden gegenereerd. Probeer het opnieuw.';
    if(_errEl)_errEl.innerHTML=
      '<div style="padding:2rem;text-align:center;max-width:420px;margin:0 auto">'
      +'<div style="font-size:2rem;margin-bottom:.75rem">&#9888;&#65039;</div>'

      +'</div>';
    updateAI(true);
  }
}

async function saveScanToGroup(){
  if(!ST.scores)return;
  if(!ST.profile.saveConsent&&!ST.groupId)return;
  const p=ST.profile;
  try{
    const resp=await fetch(`${WORKER}/group/join`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_id:ST.groupId||'SOLO',office_name:p.naamAnon?'Anoniem':p.naam,office_email:p.naamAnon?'':p.email,region:p.regio,fte:p.fte,revenue:p.omzet,ebitda:p.ebitda,recurring:p.recurring,ambitie:p.ambitie,specialisme:p.specialisme,sbi:p.sbi||'',scores:ST.scores,top_scenario:ST.scenarios?.[0]?.name||''})});

function updateAI(final=false){
  const el=document.getElementById('ai-out');

function renderAIText(text,cursor=false){
  if(ST.aiLoading)return'<div style="text-align:center;padding:2.5rem 2rem"><div class="ai-spinner"></div><p style="margin-top:1.25rem;color:var(--head);font-size:15px;font-weight:600">&#9749; Uw rapport wordt opgesteld</p><p style="margin-top:.5rem;color:var(--muted);font-size:13px">Neem gerust een kopje koffie &#9749; of doe wat rek- en strekoefeningen &#127939;</p><p style="margin-top:.25rem;color:var(--muted);font-size:12px">(duurt 2-3 minuten)</p></div>';
  if(!text)return'<div class="ai-placeholder"><div class="ai-placeholder-icon">&#9672;</div><p class="ai-placeholder-text">Klik op "Genereer AI-advies" voor een gepersonaliseerd strategisch memo.</p></div>';
  if(text==='__ERROR__')return'<div class="ai-placeholder"><div class="ai-placeholder-icon" style="opacity:.5">&#9888;</div><p class="ai-placeholder-text" style="margin-bottom:1rem">Kon niet verbinden.</p><button class="btn-gen" onclick="generateAI()" style="margin:0 auto">Opnieuw proberen</button></div>';
  if(text==='__LIMIT__')return'<div class="ai-placeholder"><div class="ai-placeholder-icon" style="color:var(--gold)">&#9888;</div><p class="ai-placeholder-text" style="margin-bottom:.5rem"><strong>Rapport-limiet bereikt</strong></p><p style="font-size:13px;color:var(--muted);text-align:center;max-width:380px;margin:0 auto">U heeft het maximale aantal rapporten bereikt. Neem contact op via <a href="mailto:marcel@bisschopsfinancing.nl" style="color:var(--teal)">marcel@bisschopsfinancing.nl</a>.</p></div>';
  let t=text;
  // Verwijder markdown tabellen (|---|) volledig
  t=t.replace(/^\|.*\|.*$/gm,'').replace(/^\s*\|[-| :]+\|\s*$/gm,'');
  // ## Koppen
  t=t.replace(/^## (.+)$/gm,'<h3 class="ai-h2">$1</h3>');
  // ### Subkoppen
  t=t.replace(/^### (.+)$/gm,'<h4 class="ai-h3">$1</h4>');
  // Bold
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Bullets
  t=t.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,function(m){return '<ul style="margin:.5rem 0 .5rem 1.25rem">'+m+'</ul>';});
  // Horizontale lijn
  t=t.replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">');
  // Paragrafen
  let parts=t.split(/\n{2,}/);
  t=parts.map(function(p){
    p=p.trim();
    if(!p)return '';
    if(p.startsWith('<'))return p;
    p=p.replace(/\n/g,'<br>');
    return '<p style="margin-bottom:.75rem">'+p+'</p>';
  }).join('');
  if(cursor)t+='<span class="ai-cursor"></span>';
  return '<div class="ai-output">'+t+'</div>';
}

function renderSummary(){
  if(ST.aiLoading){
    return '<h4>Strategisch profiel op hoofdlijnen</h4><p style="color:var(--muted);font-size:13px">&#9749; Uw rapport wordt opgesteld &mdash; de samenvatting verschijnt hier zodra het gereed is.</p>';
  }
  if(!ST.scores){
    return '<h4>Strategisch profiel op hoofdlijnen</h4><p style="color:var(--muted);font-style:italic;font-size:13px">Genereer het AI-advies hieronder voor een uitgebreide managementsamenvatting.</p>';
  }
  var s=ST.scores;
  var ov=overall(s);
  var vd=verdict(ov);
  var top3sc=ST.scenarios?ST.scenarios.slice(0,3):[];
  var sigs=[];
  var p=ST.profile||{};
  var ebitdaVal=parseFloat(String(p.ebitda||'').replace('%','').replace(',','.'));
  var recurringVal=parseFloat(String(p.recurring||'').replace('%','').replace(',','.'));
  var omzetVal=parseFloat(String(p.omzet||'').replace(/[^0-9.]/g,''))||0;
  var fteVal=parseFloat(String(p.fte||'').replace(/[^0-9.]/g,''))||0;
  var omzetPerFte=omzetVal>0&&fteVal>0?Math.round(omzetVal/fteVal):0;
  var isAdmin=(p.kantoorType||'').toLowerCase().includes('admin');
  var bFte=isAdmin?(ST._benchmarks&&ST._benchmarks['omzet_fte_admin']?ST._benchmarks['omzet_fte_admin'].waarde:120000):(ST._benchmarks&&ST._benchmarks['omzet_fte_accountant']?ST._benchmarks['omzet_fte_accountant'].waarde:ST._benchmarks&&ST._benchmarks['omzet_fte_gemiddeld']?ST._benchmarks['omzet_fte_gemiddeld'].waarde:133000);
  if(!isNaN(ebitdaVal)&&ebitdaVal<0)sigs.push({c:'var(--red)',t:'Negatieve EBITDA ('+ebitdaVal+'%)',sub:'Verliesgevend. Verkoopbaarheid nihil zonder directe winstgevendheidsherstel.'});
  else if(!isNaN(ebitdaVal)&&ebitdaVal<15)sigs.push({c:'var(--gold)',t:'EBITDA '+ebitdaVal+'% (benchmark 20-30%)',sub:'Te lage marge voor PE-transacties en serieuze fusiegesprekken.'});
  if(omzetPerFte>0&&omzetPerFte<bFte)sigs.push({c:'var(--gold)',t:'Omzet/FTE €'+omzetPerFte.toLocaleString('nl-NL')+' (benchmark €'+(bFte/1000)+'K)',sub:'Productiviteitspotentieel van €'+((bFte-omzetPerFte)*fteVal).toLocaleString('nl-NL')+' wordt niet benut.'});
  if(!isNaN(recurringVal)&&recurringVal<50)sigs.push({c:'var(--gold)',t:'Vaste omzet '+recurringVal+'% (PE-norm >70%)',sub:'Lage contractzekerheid drukt waardering en verkoopbaarheid structureel.'});
  var weakDims=Object.entries(s).filter(function(e){return e[1]<50;}).map(function(e){var sec=SECTIONS.find(function(x){return x.id===e[0];});return sec?sec.label+' ('+e[1]+')':e[0];});
  var strongDims=Object.entries(s).filter(function(e){return e[1]>=75;}).map(function(e){var sec=SECTIONS.find(function(x){return x.id===e[0];});return sec?sec.label+' ('+e[1]+')':e[0];});
  var out='<h4>Strategisch profiel op hoofdlijnen</h4>';
  out+='<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;padding:.75rem 1rem;background:'+vd.bg+';border-left:4px solid '+vd.color+';border-radius:0 var(--r) var(--r) 0">';
  out+='<div style="font-size:2rem;font-weight:700;color:'+vd.color+';font-family:IBM Plex Mono,monospace">'+ov+'</div>';
  out+='<div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:'+vd.color+'">'+vd.label+'</div>';
  out+='<div style="font-size:13px;color:var(--mid);margin-top:2px">'+vd.txt+'</div></div></div>';
  if(sigs.length){
    out+='<div style="margin-bottom:.75rem">';
    sigs.forEach(function(sig){
      out+='<div style="padding:8px 10px;margin-bottom:6px;background:var(--card);border-left:3px solid '+sig.c+';border-radius:0 var(--r) var(--r) 0">';
      out+='<div style="font-size:12px;font-weight:600;color:'+sig.c+';display:flex;gap:6px"><span>&#9888;</span><span>'+sig.t+'</span></div>';
      if(sig.sub)out+='<div style="font-size:12px;color:var(--mid);margin-top:3px;padding-left:18px">'+sig.sub+'</div>';
      out+='</div>';
    });
    out+='</div>';
  }
  if(strongDims.length){
    out+='<div style="margin-bottom:.75rem">';
    out+='<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px">Sterktes</div>';
    out+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    strongDims.forEach(function(d){out+='<span style="font-size:12px;background:var(--teal-bg);color:var(--teal);padding:3px 8px;border-radius:3px;border:1px solid var(--teal)44">'+d+'</span>';});
    out+='</div></div>';
  }
  if(weakDims.length){out+='<p style="font-size:13px;color:var(--mid);margin-bottom:.75rem"><strong style="color:var(--gold)">Aandacht:</strong> '+weakDims.join(', ')+'</p>';}
  if(top3sc.length){
    out+='<div style="margin-top:.5rem">';
    top3sc.forEach(function(sc,i){
      out+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">';
      out+='<span style="font-size:13px;color:var(--sub)">'+['Aanbevolen','Alternatief','Optioneel'][i]+': '+sc.name+'</span>';
      out+='<span style="font-size:12px;color:var(--teal);font-family:IBM Plex Mono,monospace">'+sc.score+'%</span>';
      out+='</div>';
    });
    out+='</div>';
  }
  return out;
}

function formatOmzet(v){
  if(!v)return '';
  var s=String(v).replace(/[^0-9]/g,'');
  if(!s)return v;
  var n=parseInt(s);
  if(isNaN(n))return v;
  return '€'+n.toLocaleString('nl-NL');
}

function laadChartJs(cb){
  if(typeof Chart!=='undefined'){setTimeout(cb,50);return;}
  if(window._cjsLoad){setTimeout(function(){laadChartJs(cb);},200);return;}
  window._cjsLoad=true;
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  s.onload=function(){window._cjsLoad=false;setTimeout(cb,100);};
  document.head.appendChild(s);
}

function rStaafdiagram(offices){
  if(!offices||!offices.length)return '';
  var namen=offices.map(function(o){return o.name||'Anoniem';});
  var ebitda=offices.map(function(o){return parseFloat(String(o.ebitda||'0').replace('%','').replace(',','.'))||0;});
  var recurring=offices.map(function(o){return parseFloat(String(o.recurring||'0').replace('%','').replace(',','.'))||0;});
  var scores=offices.map(function(o){return o.overall||0;});
  var chartId='chart_'+Math.random().toString(36).slice(2,8);
  var h=Math.max(offices.length*50+150,250);
  laadChartJs(function(){
    setTimeout(function(){
      var ctx=document.getElementById(chartId);
      if(!ctx)return;
      new Chart(ctx,{type:'bar',data:{labels:namen,datasets:[
        {label:'EBITDA-marge (%)',data:ebitda,backgroundColor:'rgba(26,122,94,.8)',borderRadius:3},
        {label:'Vaste omzet (%)',data:recurring,backgroundColor:'rgba(201,168,76,.8)',borderRadius:3},
        {label:'Totaalscore (0-100, gem. van 11 dimensies)',data:scores,backgroundColor:'rgba(59,130,246,.7)',borderRadius:3}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}},tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y;}}}},scales:{y:{beginAtZero:true,max:100},x:{grid:{display:false}}}}});
    },100);
  });
  return '<div style="margin-bottom:1.5rem"><div class="sec-lbl anim a2">Vergelijkende kengetallen</div><div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem"><div style="position:relative;height:'+h+'px"><canvas id="'+chartId+'" role="img" aria-label="Kengetallen per kantoor">Kengetallen.</canvas></div></div></div>';
}

function kantoorRadar(scores){
  const R=75,cx=85,cy=85,n=SECTIONS.length;
  const ap=(i,v)=>{const a=(i/n)*2*Math.PI-Math.PI/2,r=(v/100)*R;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const pts=SECTIONS.map((s,i)=>ap(i,scores[s.id]||0)).map(p=>p.join(",")).join(" ");
  const grid=[20,40,60,80,100].map(v=>{const gp=SECTIONS.map((_,i)=>ap(i,v)).map(p=>p.join(",")).join(" ");return '<polygon points="'+gp+'" fill="none" stroke="var(--border)" stroke-width="0.5"/>';}).join("");
  const axes=SECTIONS.map((_,i)=>{const[x,y]=ap(i,100);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--border2)" stroke-width="0.5"/>';}).join("");
  const labs=SECTIONS.map((s,i)=>{const[x,y]=ap(i,107);const lbl=s.label.length>9?s.label.slice(0,8)+"…":s.label;return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="6" fill="var(--muted)" font-family="IBM Plex Sans">'+lbl+'</text>';}).join("");
  return '<svg width="170" height="170" viewBox="0 0 170 170" style="display:block;margin:.25rem auto">'+grid+axes+'<polygon points="'+pts+'" fill="rgba(34,197,160,.15)" stroke="var(--teal)" stroke-width="1.5"/>'+labs+'</svg>';
}

async function genereerKantoorAI(o, container) {
  container.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><span>Analyse wordt gegenereerd\u2026 (1-2 minuten)</span></div>';
  var dimInfo = SECTIONS.map(function(s) {
    return s.label + ': ' + ((o.scores && o.scores[s.id]) || 0);
  }).join(', ');
  var oPfte = o.fte && o.revenue
    ? Math.round(parseFloat(String(o.revenue).replace(/[^0-9]/g,'')) / parseFloat(o.fte)) : 0;
  var isAdmin = (o.kantoorType||'').toLowerCase().includes('admin') || (o.specialisme||'').toLowerCase().includes('admin');
  var bFte = isAdmin?(ST._benchmarks&&ST._benchmarks['omzet_fte_admin']?ST._benchmarks['omzet_fte_admin'].waarde:120000):(ST._benchmarks&&ST._benchmarks['omzet_fte_accountant']?ST._benchmarks['omzet_fte_accountant'].waarde:ST._benchmarks&&ST._benchmarks['omzet_fte_gemiddeld']?ST._benchmarks['omzet_fte_gemiddeld'].waarde:133000);
  var bLabel = isAdmin ? '\u20ac'+(bFte/1000).toFixed(0)+'K (admin)' : '\u20ac'+(bFte/1000).toFixed(0)+'K';
  var prompt =
    'Schrijf een strategisch rapport. Gebruik "uw kantoor". Geen eerste persoon. Begin direct met ## Strategisch profiel.\n\n'
    + 'Kantoor: ' + (o.name||'Anoniem') + ' | Score: ' + o.overall + '/100\n'
    + 'Fte: ' + (o.fte||'?') + ' | Omzet: ' + (o.revenue||'?')
      + (oPfte > 0 ? ' (\u20ac' + (oPfte/1000).toFixed(0) + 'K/fte' + (oPfte < bFte ? ' — ONDER ' + bLabel : '') + ')' : '') + '\n'
    + 'EBITDA: ' + (o.ebitda||'?') + '% | Vaste omzet: ' + (o.recurring||'?') + '%\n'
    + 'Ambitie: ' + (o.ambitie||'?') + ' | Scenario: ' + (o.top_scenario||'?') + '\n'
    + 'Dimensiescores: ' + dimInfo + '\n\n'
    + 'Rapport (400-500 woorden) met ## koppen:\n'
    + '## Strategisch profiel\n## Sterktes\n## Risicos en aandachtspunten\n## Aanbeveling';
  try {
    var txt = await callAI(prompt);
    container.innerHTML = renderAIText(txt, false);
  } catch(e) {
    container.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Kon analyse niet genereren: ' + e.message + '</div>';
  }
}
async function genereerGroepsAI() {
  var d = ST.groupData;
  if (!d || !d.offices || !d.offices.length) return;
  d._aiLoading = true; d._aiTekst = '';
  var el = document.getElementById('groep-ai-out');
  if (el) el.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><span>Groepsanalyse wordt gegenereerd\u2026 (1-2 minuten)</span></div>';
  var offices = (d.offices||[]).slice().sort(function(a,b){ return b.overall - a.overall; });
  var cum = d.cumulative || {};
  var avg = offices.length ? Math.round(offices.reduce(function(a,o){ return a+o.overall; },0) / offices.length) : 0;
  var info = offices.map(function(o,i) {
    var oPfte = o.fte && o.revenue
      ? Math.round(parseFloat(String(o.revenue).replace(/[^0-9]/g,'')) / parseFloat(o.fte)) : 0;
    return (i+1) + '. ' + (o.name||'Anoniem')
      + '\n   Score: ' + o.overall + '/100 | Scenario: ' + (o.top_scenario||'?')
      + '\n   Fte: ' + (o.fte||'?') + ' | Omzet: ' + (o.revenue||'?')
        + (oPfte > 0 ? ' (\u20ac' + (oPfte/1000).toFixed(0) + 'K/fte)' : '')
      + '\n   EBITDA: ' + (o.ebitda||'?') + '% | Vaste omzet: ' + (o.recurring||'?') + '%'
      + '\n   Ambitie: ' + (o.ambitie||'?')
      + (o.specialisme ? ' | Specialisme: ' + o.specialisme : '');
  }).join('\n');
  var dims = SECTIONS.map(function(s){ return s.label + ': ' + (cum[s.id]||0); }).join(', ');
  var prompt =
    'Schrijf een uitgebreid strategisch groepsrapport in het Nederlands (800-1000 woorden).\n'
    + 'Gebruik de kantoornaam of "het kantoor" direct. NOOIT eerste persoon (geen ik/mijn).\n'
    + 'VERBOD: geen markdown-tabellen (geen |---|). Schrijf alles in lopende tekst.\n\n'
    + 'GROEP: ' + (d.group&&d.group.name||'Onbekend') + ' | Gem. score: ' + avg + '/100\n'
    + 'Dimensiegemiddelden: ' + dims + '\n\nKANTOREN (gesorteerd op score):\n' + info + '\n\n'
    + 'STRUCTUUR (gebruik exact deze ## koppen):\n'
    + '## Groepsprofiel\n'
    + '## Financieel profiel\n'
    + '## Sterktes en kansen\n'
    + '## Aandachtspunten\n'
    + '## Strategische opties\n'
    + '## Per kantoor (behandel elk kantoor kort met naam en 2-3 specifieke observaties)';
  try {
    var txt = await callAI(prompt);
    d._aiTekst = txt; d._aiLoading = false;
    var el2 = document.getElementById('groep-ai-out');
    if (el2) el2.innerHTML = renderAIText(txt, false);
  } catch(e) {
    d._aiLoading = false;
    var el3 = document.getElementById('groep-ai-out');
    if (el3) el3.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout: ' + e.message + '</div>';
  }
}

function downloadGroepsRapport(){
  var d=ST.groupData;if(!d)return;
  var offices=(d.offices||[]).sort(function(a,b){return b.overall-a.overall;});
  var avg=offices.length?Math.round(offices.reduce(function(a,o){return a+o.overall;},0)/offices.length):0;
  var txt='KantoorInzicht -- Groepsrapport\n================================\n\n';
  txt+='Groep: '+(d.group&&d.group.name||ST.groupId)+'\n';
  txt+='Datum: '+new Date().toLocaleDateString('nl-NL')+'\n';
  txt+='Deelnemers: '+offices.length+'\nGem. score: '+avg+'/100\n\n';
  if(d._aiTekst)txt+='AI-ANALYSE\n----------\n'+d._aiTekst+'\n\n';
  txt+='KANTOREN\n--------\n';
  offices.forEach(function(o,i){
    txt+='\n#'+(i+1)+' '+(o.name||'Anoniem')+' ('+o.overall+'/100)\n';
    if(o.fte)txt+='Fte: '+o.fte+'\n';
    if(o.revenue)txt+='Omzet: '+o.revenue+'\n';
    if(o.ebitda)txt+='EBITDA: '+o.ebitda+'\n';
    if(o.recurring)txt+='Vaste omzet: '+o.recurring+'\n';
    if(o.ambitie)txt+='Ambitie: '+o.ambitie+'\n';
    txt+='Scenario: '+(o.top_scenario||'Onbekend')+'\n';
  });
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download='groepsrapport-'+new Date().toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

  document.querySelectorAll('.office-hdr').forEach(h=>{h.onclick=()=>{const id=h.dataset.oid;ST.openOffice=ST.openOffice===id?null:id;render();};});
  on('gen-btn','click',()=>generateAI());

  on('refresh-dash','click',()=>loadGroup(ST.groupId));
  on('route-rapport','click',()=>{ST.screen='rapport-ophalen';render();});
  on('rapport-terug','click',()=>{ST.screen='intro';render();});
  on('rapport-ophalen-btn','click',async function(){
    var code=document.getElementById('rapport-code-input');
    if(!code||!code.value.trim())return;
    var id=code.value.trim().toUpperCase();
    var btn=document.getElementById('rapport-ophalen-btn');
    var errEl=document.getElementById('rapport-error');
    if(errEl)errEl.style.display='none';
    btn.textContent='Laden...';btn.disabled=true;
    try{
      var resp=await fetch(WORKER+'/rapport/'+id,{signal:AbortSignal.timeout(15000)});
      var data={};
      try{data=await resp.json();}catch(e){}
      console.log('Rapport ophalen:',resp.status,JSON.stringify(data).substring(0,200));
      if(resp.status===404)throw new Error('Rapport met code '+id+' bestaat niet. Controleer de code of vraag een nieuw rapport aan.');
      if(!resp.ok||data.error)throw new Error(data.error||'Rapport niet gevonden (code: '+id+')');
      // Herstel state volledig
      ST.savedScanId=data.id||data.scan_id||id;
      var parsedScores={};
      try{parsedScores=JSON.parse(data.scores||'{}');}catch(e){parsedScores={};}
      ST.scores=parsedScores;
      // Herstel scenarios via rankScenarios zodat rResults correct werkt
      ST.scenarios=rankScenarios(Object.keys(parsedScores).length?parsedScores:{
        strategisch:60,opvolging:60,winst:60,schaal:60,auto:60,
        partner:60,klant:60,fusie:60,ai_dim:60,personeel:60,commercieel:60
      });
      // Forceer top_scenario als eerste
      if(data.top_scenario){
        ST.scenarios.sort(function(a,b){return a.name===data.top_scenario?-1:b.name===data.top_scenario?1:0;});
      }
      ST.profile={
        naam:data.kantoor_naam||'',
        email:data.email||'',
        regio:data.regio||'',
        fte:data.fte||'',
        omzet:data.omzet||data.revenue||'',
        ambitie:data.ambitie||'',
        ebitda:'',recurring:'',
        specialisme:'',doelgroep:'',software:'',
        context:'',naamAnon:false,saveConsent:false,
        kantoorType:''
      };
      ST.aiText=data.rapport_tekst||'';
      ST.aiLoading=false;
      ST.screen='results';
      render();
    }catch(e){
      console.error('Rapport ophalen fout:',e);
      const _isNet=e.name==='TypeError'||e.message.toLowerCase().includes('fetch')||e.message.toLowerCase().includes('network');
      const _isNotFound=e.message.toLowerCase().includes('niet gevonden')||e.message.toLowerCase().includes('not found');
      const _msg=_isNet?'Geen verbinding. Controleer uw internet en probeer opnieuw.'
        :_isNotFound?'Rapport niet gevonden. Controleer de code — deze is hoofdlettergevoelig. Rapporten worden maximaal 12 maanden bewaard.'
        :'Er ging iets mis: '+e.message;
      if(errEl){errEl.style.display='block';errEl.textContent=_msg;}
    }
    btn.textContent='Rapport ophalen →';btn.disabled=false;
  });
  on('groep-ai-btn','click',async function(){
    var btn=document.getElementById('groep-ai-btn');
    var out=document.getElementById('groep-ai-out');
    if(!btn||!out)return;
    btn.disabled=true;btn.textContent='Genereren...';
    out.innerHTML='<div class="ai-loading"><div class="ai-spinner"></div><span>Groepsanalyse wordt gegenereerd...</span></div>';
    var d=ST.groupData;
    if(!d)return;
    var offices=(d.offices||[]).sort(function(a,b){return b.overall-a.overall;});
    var cum=d.cumulative||{};
    var avg=offices.length?Math.round(offices.reduce(function(a,o){return a+o.overall;},0)/offices.length):0;
    var kantoorInfo=offices.map(function(o,i){
      return (i+1)+'. '+( o.name||'Anoniem')+' | Score: '+o.overall+' | EBITDA: '+(o.ebitda||'?')+'% | Vast: '+(o.recurring||'?')+'% | Omzet: '+(o.revenue||'?')+' | Fte: '+(o.fte||'?')+' | Ambitie: '+(o.ambitie||'?')+' | Scenario: '+(o.top_scenario||'?');
    }).join('\n');
    var dimInfo=SECTIONS.map(function(s){return s.label+': '+(cum[s.id]||0);}).join(' | ');
    var oPfte=o.fte&&o.revenue?Math.round(parseFloat(String(o.revenue).replace(/[^0-9]/g,''))/parseFloat(o.fte)):0;var prompt='Geef een strategische analyse van dit kantoor. Gebruik "uw kantoor". Geen eerste persoon.\n\nKANTOORPROFIEL:\n- Naam: '+(o.name||'Anoniem')+'\n- Score: '+o.overall+'/100\n- Fte: '+(o.fte||'?')+' medewerkers\n- Omzet: '+(o.revenue||'?')+(oPfte>0?' (\u20ac'+(oPfte/1000).toFixed(0)+'K per fte)':'')+'\n- EBITDA-marge: '+(o.ebitda||'?')+'% (benchmark: 20-30%)\n- Aandeel vaste/abonnements-omzet: '+(o.recurring||'?')+'% (>60% = sterk voor M&A)\n- Ambitie: '+(o.ambitie||'?')+'\n- Aanbevolen scenario: '+(o.top_scenario||'?')+'\n\nDIMENSIESCORES:\n'+dimInfo+'\n\nGeef een rapport in het Nederlands met ## koppen:\n## Strategisch profiel\n[Score en positie, kantoortype-context, omzet per fte beoordeling]\n## Sterktes\n[Concrete sterktes op basis van dimensiescores en financiele kengetallen]\n## Risicos en aandachtspunten\n[Lage scores, financiele signalen, structurele kwetsbaarheden]\n## Aanbeveling\n[Concreet advies passend bij ambitie en aanbevolen scenario]\n\nDirect, concreet, specifiek voor dit kantoor. Max 350 woorden.';
    try{
      var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      var reader=resp.body.getReader();
      var dec=new TextDecoder();
      var txt='';
      out.innerHTML='';
      while(true){
        var res=await reader.read();
        if(res.done)break;
        var chunk=dec.decode(res.value,{stream:true});
        var lines2=chunk.split('\n');
        for(var li=0;li<lines2.length;li++){
          var line2=lines2[li].trim();
          if(!line2||line2==='data: [DONE]')continue;
          if(line2.startsWith('data: ')){
            try{var j=JSON.parse(line2.slice(6));if(j.type==='content_block_delta'&&j.delta&&j.delta.text)txt+=j.delta.text;}catch(e){}
          }
        }
        out.innerHTML=renderAIText(txt,true);
      }
      out.innerHTML=renderAIText(txt,false);
      btn.textContent='Opnieuw genereren';btn.disabled=false;
    }catch(e){
      out.innerHTML='<div style="color:var(--red)">Fout: '+e.message+'</div>';
      btn.textContent='Probeer opnieuw';btn.disabled=false;
    }
  });
  on('callback-btn','click',()=>showCallbackModal());
  on('restart-btn','click',()=>{if(ST.groupData)ST.groupData._aiTekst='';ST={...ST,screen:'intro',section:0,answers:{},scores:null,scenarios:null,openScenario:null,openOffice:null,aiText:null,aiLoading:false,_smvKlaar:false,savedScanId:null,adminCode:null,profile:{naam:'',naamAnon:false,email:'',regio:'',fte:'',omzet:'',specialisme:'',doelgroep:'',software:'',ambitie:'',context:'',omzetfte:'',ebitda:'',recurring:'',saveConsent:true,sbi:''}};render();window.scrollTo(0,0);});
}

function showCallbackModal(){
  const existing=document.getElementById('cb-overlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='cb-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem';

    +'<button id="cb-send" class="btn-adv">Verstuur verzoek</button>'

  document.body.appendChild(overlay);
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
