<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koersvoormorgen — AI-platform voor M&amp;A due diligence en overnames</title>
<meta name="description" content="Koersvoormorgen: AI-gedreven M&amp;A due-diligence platform voor verkoop- en overnametrajecten in accountancy, mkb, zorg en IT — plus een gratis strategische kantoorscan voor accountantskantoren.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#faf9f6;--panel:#ffffff;
  --border:#dddbd4;--border2:#c8c5bc;--muted:#8a8880;--mid:#5a5854;
  --body:#4a4845;--sub:#2a2825;--head:#1a1815;
  --teal:#1a7a5e;--teal-dim:#145f48;--teal-bg:rgba(34,197,160,.1);
  --gold-bg:rgba(201,168,76,.12);
  --r2:10px;--r4:22px;
}
@media(prefers-color-scheme:dark){
  :root{
    --void:#171614;--panel:#211f1c;
    --border:#38352f;--border2:#48443c;--muted:#83807a;--mid:#a8a49c;
    --body:#c8c5bc;--sub:#e0dcd2;--head:#f5f1e8;
    --teal:#22c98a;--teal-dim:#1a9a6a;--teal-bg:rgba(34,197,138,.14);
    --gold-bg:rgba(224,184,90,.14);
  }
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--body);min-height:100vh;font-size:15px;line-height:1.65;position:relative}
a{color:var(--teal)}
.wrap{max-width:1040px;margin:0 auto;padding:0 2rem}

.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:64px 64px;opacity:.3;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 60%);
  mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 60%)}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 700px 460px at 80% 5%,var(--teal-bg),transparent 65%),radial-gradient(ellipse 460px 600px at 5% 25%,var(--gold-bg),transparent 65%)}
.content{position:relative;z-index:1}

.hero{padding:7rem 0 3rem;text-align:center}
.hero h1{font-family:'Playfair Display',serif;font-weight:600;font-size:2.9rem;line-height:1.15;color:var(--head);max-width:760px;margin:0 auto 1.25rem}
.hero h1 em{font-style:italic;color:var(--teal);font-weight:400}
.hero p{font-size:16px;color:var(--mid);max-width:560px;margin:0 auto 2.25rem}
.hero-ctas{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.1rem}
.btn-primary{background:var(--teal);color:#08130f;padding:14px 28px;border-radius:99px;font-weight:600;font-size:14.5px;text-decoration:none;display:inline-block}
.btn-primary:hover{background:var(--teal-dim);color:#fff}
.btn-secondary{background:var(--panel);color:var(--sub);border:1px solid var(--border2);padding:13px 27px;border-radius:99px;font-weight:600;font-size:14.5px;text-decoration:none;display:inline-block}
.btn-secondary:hover{border-color:var(--teal);color:var(--teal)}
.hero-note{font-size:12.5px;color:var(--muted)}
.hero-note a{font-weight:600}

.foot{border-top:1px solid var(--border);padding:2.5rem 0;margin-top:2rem}
.foot-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.foot-links{display:flex;gap:1.5rem;flex-wrap:wrap}
.foot-links a{font-size:12px;color:var(--muted);text-decoration:none}
.foot-copy{font-size:11.5px;color:var(--muted)}

@media(max-width:760px){
  .hero{padding:4rem 0 2rem}
  .hero h1{font-size:2.1rem}
  .foot-inner{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="content">

<div class="hero">
  <div class="wrap">
    <h1>Koersvoormorgen</h1>
    <p>Due diligence, contracten en dealbegeleiding op één plek &mdash; via uw adviseur.</p>
    <div class="hero-ctas">
      <a href="mna.html" class="btn-primary">Inloggen op mijn traject &rarr;</a>
      <a href="adv.html" class="btn-secondary">Ik ben adviseur</a>
    </div>
    <div class="hero-note">Accountants- of administratiekantoor? Start de <a href="kantoorscan.html">gratis kantoorscan</a></div>
  </div>
</div>

<div class="wrap">
  <div class="foot">
    <div class="foot-inner">
      <div class="foot-links">
        <a href="privacy.html">Privacyverklaring</a>
        <a href="platformvoorwaarden.html">Voorwaarden</a>
      </div>
      <div class="foot-copy">&copy; <span id="jr"></span> Bisschops Financing B.V.</div>
    </div>
  </div>
</div>

</div>
<script>document.getElementById('jr').textContent=new Date().getFullYear();</script>
</body>
</html>
