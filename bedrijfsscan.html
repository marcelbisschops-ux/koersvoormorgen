<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Huisstijl Koers voor Morgen (1 sep 2026): nachtblauw #0D1B2A, petrolgroen #3D6B63,
   warm off-white #F6F2EA, koel lichtgrijs, goud #C49A4A. --red blijft semantisch. */
:root{
  --void:#f6f2ea;--panel:#ffffff;--card:#ebeef1;
  --border:#d9dee3;--border2:#bfc8d0;--muted:#647581;--mid:#42525e;
  --body:#2f3d47;--sub:#16232e;--head:#0d1b2a;--white:#0a0805;
  --teal:#3d6b63;--teal-dim:#2c4f4a;--teal-dark:#12352d;--teal-bg:rgba(61,107,99,.1);
  --gold:#c49a4a;--gold-bg:rgba(196,154,74,.12);
  --red:#e05252;--red-bg:rgba(224,82,82,.1);
  --r:6px;--r2:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --void:#0d1b2a;--panel:#132534;--card:#16293a;
    --border:#24384a;--border2:#33485c;--muted:#8ca0ae;--mid:#a6b8c4;
    --body:#c6d3db;--sub:#e2e9ee;--head:#f4f1e9;--white:#f6f2ea;
    --teal:#5e9b8f;--teal-dim:#4a8377;--teal-dark:#9cc8bd;--teal-bg:rgba(94,155,143,.16);
    --gold:#d8b36a;--gold-bg:rgba(216,179,106,.14);
    --red:#f07070;--red-bg:rgba(240,112,112,.12);
  }
  .ai-h2{color:#e8e4da!important}
  .ai-h3{color:#bfc8d0!important}
  .field input,.field select,.field textarea{color:#ebeef1!important;background:#2e2c29!important;border-color:#4a4845!important}
  .field input::placeholder,.field textarea::placeholder{color:#7a7875}
  .field select option{background:#2e2c29;color:#ebeef1}
  .field label,.field .field-label{color:#bfc8d0}
  .intake-wrap,.intake-card{background:#242220}
  .field-hint{color:#7a7875}
}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--body);min-height:100vh;font-size:15px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
#app{min-height:100vh}
.page-wrap{max-width:900px;margin:0 auto;padding:2rem 2rem 5rem}
.page-wrap.narrow{max-width:680px}
.page-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0;border-bottom:1px solid var(--border);margin-bottom:2.5rem}
.page-brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.page-step{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.sec-lbl{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 20px;border-radius:var(--r);cursor:pointer;transition:all .12s}
.btn-ghost:hover{border-color:var(--mid);color:var(--sub)}
.btn-ghost:disabled{opacity:0;pointer-events:none}
.btn-adv{background:var(--teal);color:var(--void);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 24px;border-radius:var(--r);border:none;cursor:pointer;transition:all .12s}
.btn-adv:hover{background:var(--teal-dim)}
.btn-adv:disabled{background:var(--border2);color:var(--muted);cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field.required label::after{content:' *';color:var(--red);font-size:11px}
.field.required input,.field.required select,.field.required textarea{border-color:var(--border2)}
.field.required input:not([value='']),.field.required select:not([value='']){border-color:var(--teal)}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);color:#0d1b2a;font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;transition:border-color .12s;-webkit-appearance:none;width:100%}.field.required input,.field.required select,.field.required textarea{background:#eaf1ef;border-color:var(--teal-dark)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field select option{background:var(--panel)}
.field textarea{resize:vertical;min-height:70px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.form-grid.full{grid-template-columns:1fr}
.intro-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4rem 2rem;position:relative;overflow:hidden}
.intro-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 70% 30%,rgba(61,107,99,.04),transparent 70%),radial-gradient(ellipse 400px 600px at 20% 80%,rgba(201,168,76,.03),transparent 70%);pointer-events:none}
.intro-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.4;pointer-events:none}
.intro-inner{max-width:700px;width:100%;text-align:center;position:relative;z-index:1}
.wordmark{display:inline-flex;align-items:center;gap:10px;margin-bottom:2.5rem;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:1.25rem}
.intro-h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:600;color:var(--white);line-height:1.1;margin-bottom:1.25rem}
.intro-h1 em{font-style:italic;color:var(--teal)}
.intro-sub{font-size:15px;color:var(--sub);line-height:1.75;max-width:500px;margin:0 auto 2.5rem;font-weight:300}
.kpi-row{display:flex;justify-content:center;gap:2rem;margin-bottom:2.5rem;flex-wrap:wrap}
.kpi-item{text-align:center}
.kpi-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--head);line-height:1;margin-bottom:.2rem}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi-div{width:1px;height:36px;background:var(--border2);align-self:center}
.dim-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:2.5rem}
.dim-chip{font-size:11px;font-weight:500;padding:4px 11px;border-radius:3px;border:1px solid var(--border2);color:var(--mid);background:var(--panel)}

.intro-foot::before,.intro-foot::after{content:'';flex:1;max-width:80px;height:1px;background:var(--border)}
.route-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:2.5rem;max-width:580px;margin-left:auto;margin-right:auto}

.sector-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.sector-picker{grid-template-columns:1fr}}
.sector-pick{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 14px;cursor:pointer;transition:all .15s;font-family:inherit}
.sector-pick:hover{border-color:var(--teal)}

.route-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;text-align:left;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:.75rem}

.group-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem;margin-bottom:2rem}

.code-display{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;font-weight:500;color:var(--teal);letter-spacing:.2em;text-align:center;padding:1.5rem;background:var(--card);border:1px solid var(--border2);border-radius:var(--r2);margin:1.5rem 0}

.note-box strong{color:var(--sub)}
.prog-section{margin-bottom:2.5rem}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.75rem}
.prog-lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.prog-frac{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.prog-track{height:2px;background:var(--border2);border-radius:1px;position:relative;overflow:visible}
.prog-fill{height:100%;background:var(--teal);border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px rgba(61,107,99,.5)}
.prog-steps{display:flex;gap:3px;margin-top:10px}
.p-step{flex:1;height:3px;border-radius:1px;background:var(--border);transition:background .3s}
.p-step.done{background:var(--teal-dark)}
.p-step.active{background:var(--teal)}
.sec-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--teal);border:1px solid var(--teal-dark);background:var(--teal-bg);padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:.6rem}
.sec-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--white);font-weight:600;margin-bottom:.4rem}

.q-stack{display:flex;flex-direction:column;gap:12px;margin-bottom:2.5rem}

.likert{display:flex;gap:6px}
.l-btn{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;padding:9px 4px;border-radius:var(--r);cursor:pointer;transition:all .1s;text-align:center}
.l-btn:hover{border-color:var(--border2);color:var(--sub);background:var(--panel)}
.l-btn.sel{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.likert-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:6px;padding:0 2px;text-transform:uppercase}
.scan-nav{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 0;border-top:1px solid var(--border)}
.nav-info{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.r-header{border-bottom:1px solid var(--border);padding:1.5rem 0 2rem;margin-bottom:2.5rem}

.r-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.kantoor-slug{font-family:'Playfair Display',serif;font-size:1rem;color:var(--teal);font-style:italic;margin-bottom:.3rem}
.report-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:600;color:var(--white);line-height:1.1;margin-bottom:.5rem}

.score-hero{display:flex;align-items:center;gap:2rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem 2.5rem;margin-bottom:1.25rem}
.score-circle{position:relative;flex-shrink:0;width:110px;height:110px}
.score-circle svg{transform:rotate(-90deg)}
.score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-big{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:600;color:var(--white);line-height:1}
.score-denom{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.score-explain{font-size:13px;color:var(--mid);line-height:1.65}
.bench-strip{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:2rem;font-size:12px;flex-wrap:wrap}
.bench-lbl{color:var(--muted);font-weight:500;white-space:nowrap}

.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:2.5rem}
@media(max-width:560px){.dim-grid{grid-template-columns:1fr}}
.dim-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dim-top{display:flex;align-items:center;justify-content:space-between}
.dim-name{font-size:12px;font-weight:500;color:var(--sub)}
.dim-val{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500}

.dim-bar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.dim-flag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.matrix-sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem;margin-bottom:2.5rem}
.matrix-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--head);font-weight:600;margin-bottom:.25rem}
.matrix-sub{font-size:12px;color:var(--muted);margin-bottom:1.5rem}

.quadrant-list{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}

.q-idesc{color:var(--muted);margin-top:2px;line-height:1.4}
.scenario-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:2.5rem}
.sc-card{border-radius:var(--r2);border:1px solid var(--border);overflow:hidden}

.sc-hdr:hover{background:var(--card)}

.actions-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}

.ai-body{padding:1.5rem}

<body>
<div id="app"></div>
<div id="build-stamp" style="position:fixed;bottom:4px;right:8px;font-size:10px;font-family:monospace;color:#aaa;pointer-events:none;z-index:9999">27 May 10:45</div>
<script>

/* ======== CONFIG ======== */
const WORKER = 'https://kantoorinzicht.marcel-bisschops.workers.dev';
// White-label basis — centrale merkconfig voor de publieke scan (zelfde patroon als de rest).
const BRAND = { platform:'Koers voor Morgen', bedrijf:'Bisschops Financing B.V.', bedrijfKort:'Bisschops Financing BV' };
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// Vaste taalregels voor elke AI-prompt op deze pagina (5 aug 2026, Marcel: analyses bevatten soms
// onnatuurlijk/vertaald Nederlands — vooral inconsistent u/je-gebruik en Engelse zinsconstructies
// zoals "niet een X" i.p.v. "geen X"). Eén centrale plek i.p.v. losse, licht verschillende
// taalinstructies per prompt.
const TAAL_REGELS='Schrijf in natuurlijk, vloeiend Nederlands — geen letterlijke vertaling uit het Engels. Gebruik uitsluitend de formele aanspreekvorm "u/uw", nooit "je/jij/jouw", ook niet losse keren door elkaar. Gebruik "geen [zelfstandig naamwoord]" i.p.v. de onnatuurlijke constructie "niet een [zelfstandig naamwoord]". Vermijd andere letterlijke Engelse constructies (bijv. "maakt sense", "op het einde van de dag") en verzin geen niet-bestaande woorden.';

// Kwalitatieve M&A-overnamecontext per niet-accountancy sector (31 aug 2026, Marcel: de MKB-scan-AI
// was "weinig zeggend"). Buiten accountancy krijgt de AI géén benchmarks/waardering mee — er is geen
// gebronde data en de gouden standaard verbiedt verzonnen getallen. Dit blok geeft de AI in plaats
// daarvan concrete, algemeen geldende overname-aandachtspunten om op te sturen. GEEN cijfers, GEEN
// multiples, GEEN benchmarks — alleen kwalitatieve richting.
// ChatGPT-review 31 aug 2026: geformuleerd als beoordelingsvragen, niet als vaststaande
// waarderingswaarheden of marktnormen ("beoordeel of…", "weeg…" i.p.v. "de waarde zit in…",
// "is gebruikelijk"). De AI mag hieruit geen algemene regel als feit overnemen — het zijn
// aandachtspunten om tegen de concrete bedrijfssituatie te houden.
const SECTOR_AI_CONTEXT={
  mkb:'SECTORCONTEXT MKB-/familiebedrijfsoverdracht (kwalitatief — verzin GEEN benchmarkcijfers, multiples of bedragen; formuleer als beoordeling van dit specifieke bedrijf, niet als algemene marktregel): beoordeel in hoeverre de onderneming overdraagbaar is zonder de huidige eigenaar, en weeg daarbij: afhankelijkheid van de DGA/oprichter (klantrelaties, kennis, netwerk, inkoop), aanwezigheid van een tweede managementlaag, klantconcentratie, leveranciersafhankelijkheid, en of het resultaat genormaliseerd is (marktconform ondernemersloon, privé-onttrekkingen, incidentele posten, vastgoed in privé). Relevante koperstypes: strategische koper (branchegenoot), MBI-kandidaat (individuele manager die koopt), participatiemaatschappij of buy-and-build-platform, en management- of familiebuy-out. Een earn-out of verkoperslening kan passen wanneer er onzekerheid is over de overdraagbaarheid of de toekomstige prestaties — beoordeel of dat hier speelt, presenteer het niet als standaard.\n',
  zorg:'SECTORCONTEXT overname van een zorgpraktijk (kwalitatief — verzin GEEN benchmarkcijfers, multiples of bedragen; formuleer als beoordeling van deze praktijk, niet als algemene regel): beoordeel in hoeverre de continuïteit van de patiënten-/cliëntenstroom en het behandelteam losstaat van de praktijkhouder persoonlijk, en weeg: personele bezetting en openstaande vacatures voor behandelaars, afhankelijkheid van de praktijkhouder, de contractpositie met zorgverzekeraars/gemeenten en de daaruit volgende omzetzekerheid, de vastgoed-/huursituatie, en kwaliteits- en registratie-eisen. Koperstypes: collega-praktijk (regionale schaalvergroting), zorgketen of -groep, en participatiemaatschappijen die actief zijn in de eerstelijnszorg. Regelgeving rond winstuitkering in delen van de zorg kan de kopersgroep beperken — benoem dat als mogelijk aandachtspunt, niet als vaststaand feit voor deze praktijk.\n',
  itsoftware:'SECTORCONTEXT overname van een IT-/softwarebedrijf (kwalitatief — verzin GEEN benchmarkcijfers, multiples of bedragen; formuleer als beoordeling van dit bedrijf, niet als algemene regel): beoordeel de kwaliteit van de terugkerende omzet en de herhaalbaarheid van de sales, en weeg: aandeel contractuele/abonnementsomzet, netto omzetretentie en klantverloop, klantconcentratie, de bus-factor op kritieke technische kennis, eigendom van de code en IP, en afhankelijkheid van enkele grote klanten of leveranciers/hyperscalers. Koperstypes: strategische koper (product- of marktuitbreiding), grotere softwarepartij, en (buy-and-build-)participatiemaatschappijen. Bij IT-dienstverlening/detachering: weeg schaalbaarheid en marge, niet alleen omzetgroei.\n'
};

document.title = 'Strategische Bedrijfsscan - ' + BRAND.platform;
function setScanTitle(){
  document.title = 'Strategische Bedrijfsscan - ' + BRAND.platform;
}

const SECTIONS_BY_SECTOR={};
const SCENARIOS_BY_SECTOR={};
const REVERSE_BY_SECTOR={ accountancy:new Set(['p1','k1','k2','ai1','pe1']) };
SECTIONS_BY_SECTOR.accountancy=[
  {id:'strategisch',label:'Strategische positie',icon:'I',desc:'Hoe helder en onderscheidend is de strategische koers van het kantoor?',questions:[

  ]},
  {id:'opvolging',label:'Opvolgingsrisico',icon:'II',desc:'Is de eigendoms- en managementcontinueteit geborgd voor de komende 5-10 jaar?',questions:[
    {id:'o1',q:'Er is een formeel en concreet opvolgingsplan voor eigenaren en sleutelpartners.',hint:null},
    {id:'o2',q:'Potentiele interne opvolgers zijn aangewezen en worden actief klaargestoomd.',hint:null},
    {id:'o3',q:'Het kantoor kan operationeel doordraaien bij langdurige uitval van een eigenaar.',hint:null},
  ]},
  {id:'winst',label:'Winstkwaliteit',icon:'III',desc:'Zijn de inkomsten structureel, voorspelbaar en weerbaar tegen marktdruk?',questions:[
    {id:'w1',q:'Een significant deel van de omzet bestaat uit vaste abonnementen of retainer-tarieven.',hint:'terugkerende omzet is waarderingsrelevant'},
    {id:'w2',q:'De EBITDA-marge is in lijn met of beter dan de branchebenchmark van 20-30%.',hint:null},
    {id:'w3',q:'De omzet per fte is stabiel of groeiend over de afgelopen drie jaar.',hint:null},
  ]},
  {id:'schaal',label:'Schaalbaarheid',icon:'IV',desc:'Kan het kantoor groeien zonder evenredige groei in kosten of hoofden?',questions:[
    {id:'sc1',q:'Werkprocessen zijn volledig gestandaardiseerd en schriftelijk vastgelegd.',hint:null},
    {id:'sc2',q:'30% omzetgroei is realiseerbaar zonder de bezetting proportioneel uit te breiden.',hint:null},
    {id:'sc3',q:'Het kantoor biedt gestandaardiseerde dienstenpakketten, klantportals of rapportagetools waarmee meer klanten bediend kunnen worden zonder evenredige groei in uren.',hint:null},
  ]},
  {id:'auto',label:'Automatiseringsgraad',icon:'V',desc:'In hoeverre zijn repetitieve processen vervangen door technologie?',questions:[
    {id:'a1',q:'Routinetaken (scanning, codering, btw-verwerking) zijn grotendeels geautomatiseerd.',hint:null},
    {id:'a2',q:'Het kantoor werkt met geentegreerde cloudplatformen die data automatisch koppelen.',hint:'bijv. Exact, Twinfield, Yuki, Dext, Silverfin'},
    {id:'a3',q:'Het team heeft voldoende digitale maturiteit om nieuwe tools zelfstandig te adopteren.',hint:null},
  ]},
  {id:'partner',label:'Partnerafhankelijkheid',icon:'VI',desc:'Hoe kwetsbaar is het kantoor als een partner of sleutelpersoon vertrekt?',questions:[
    {id:'p1',q:'Klantrelaties zijn geborgd binnen het team - niet geconcentreerd bij één persoon.',hint:'1 = alles hangt aan één persoon (kwetsbaar) · 5 = volledig geborgd in het team'},

    {id:'f1',q:'De financiele administratie en klantdossiers zijn op orde voor due diligence.',hint:null},

  const bonusMap={...(ambitieBonus[ambitie]||{}),...contextBonus};

/* ── Centrale AI transport + opschoon ── */
async function callAI(prompt, maxTokens) {
  const resp = await fetch(WORKER + '/ai', {signal:AbortSignal.timeout(120000),
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [{ role: 'user', content: prompt }], max_tokens: maxTokens||10000 })
  });
  if (!resp.ok) {
    const errTxt = await resp.text().catch(() => String(resp.status));
    throw new Error('Worker fout ' + resp.status + ': ' + errTxt.substring(0, 200));
  }
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  const tekst = (data.text || '').trim();
  if (!tekst) throw new Error('Leeg antwoord van AI ontvangen');
  return opschonen(tekst);
}

function opschonen(tekst) {
  return tekst
    .replace(/\bdit kantoor\b/gi, 'uw kantoor')
    .replace(/\bDit kantoor\b/g, 'Uw kantoor')
    .replace(/^#{1}[^#][^\n]*\n/, '')
    .replace(/Opgesteld door[^\n]*\n?/gi, '')
    .replace(/Senior M&A-adviseur[^\n]*\n?/gi, '')
    .replace(/Marcel Bisschops[^\n]*marcel@bisschops[^\n]*/gi, '')
    .replace(/\+31[^\n]*op afspraak[^\n]*/gi, '')
    .replace(/^\*+Marcel Bisschops[^\n]*/gm, '')
    .replace(/^\*+[\s]*$/gm, '')
    .trim();
}

    for(var i=0;i<curve.length-1;i++){
      var p0=curve[i],p1=curve[i+1];
      if(x>=p0[0]&&x<=p1[0]){var frac=(x-p0[0])/(p1[0]-p0[0]);return p0[1]+frac*(p1[1]-p0[1]);}
    }

function renderAIText(text,cursor=false){
  if(ST.aiLoading)return'<div style="text-align:center;padding:2.5rem 2rem"><div class="ai-spinner"></div><p style="margin-top:1.25rem;color:var(--head);font-size:15px;font-weight:600">&#9749; Uw rapport wordt opgesteld</p><p style="margin-top:.5rem;color:var(--muted);font-size:13px">Neem gerust een kopje koffie &#9749; of doe wat rek- en strekoefeningen &#127939;</p><p style="margin-top:.25rem;color:var(--muted);font-size:12px">(duurt 2-3 minuten)</p></div>';
  if(!text)return'<div class="ai-placeholder"><div class="ai-placeholder-icon">&#9672;</div><p class="ai-placeholder-text">Klik op "Genereer AI-advies" voor een gepersonaliseerd strategisch memo.</p></div>';
  if(text==='__ERROR__')return'<div class="ai-placeholder"><div class="ai-placeholder-icon" style="opacity:.5">&#9888;</div><p class="ai-placeholder-text" style="margin-bottom:1rem">Kon niet verbinden.</p><button class="btn-gen" onclick="generateAI()" style="margin:0 auto">Opnieuw proberen</button></div>';
  if(text==='__LIMIT__')return'<div class="ai-placeholder"><div class="ai-placeholder-icon" style="color:var(--gold)">&#9888;</div><p class="ai-placeholder-text" style="margin-bottom:.5rem"><strong>Rapport-limiet bereikt</strong></p><p style="font-size:13px;color:var(--muted);text-align:center;max-width:380px;margin:0 auto">U heeft het maximale aantal rapporten bereikt. Neem contact op via <a href="mailto:marcel@bisschopsfinancing.nl" style="color:var(--teal)">marcel@bisschopsfinancing.nl</a>.</p></div>';
  // Security-fix 17 aug 2026: text komt uit de AI en ging voorheen ongefilterd in innerHTML —
  // eerst esc() toepassen, dan pas de markdown-achtige opmaak erop loslaten.
  let t=esc(text);
  // Verwijder markdown tabellen (|---|) volledig
  t=t.replace(/^\|.*\|.*$/gm,'').replace(/^\s*\|[-| :]+\|\s*$/gm,'');
  // ## Koppen
  t=t.replace(/^## (.+)$/gm,'<h3 class="ai-h2">$1</h3>');
  // ### Subkoppen
  t=t.replace(/^### (.+)$/gm,'<h4 class="ai-h3">$1</h4>');
  // Bold
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Bullets
  t=t.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,function(m){return '<ul style="margin:.5rem 0 .5rem 1.25rem">'+m+'</ul>';});
  // Horizontale lijn
  t=t.replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">');
  // Paragrafen
  let parts=t.split(/\n{2,}/);
  t=parts.map(function(p){
    p=p.trim();
    if(!p)return '';
    if(p.startsWith('<'))return p;
    p=p.replace(/\n/g,'<br>');
    return '<p style="margin-bottom:.75rem">'+p+'</p>';
  }).join('');
  if(cursor)t+='<span class="ai-cursor"></span>';
  return '<div class="ai-output">'+t+'</div>';
}

function renderSummary(){
  if(ST.aiLoading){
    return '<h4>Strategisch profiel op hoofdlijnen</h4><p style="color:var(--muted);font-size:13px">&#9749; Uw rapport wordt opgesteld &mdash; de samenvatting verschijnt hier zodra het gereed is.</p>';
  }

    return '<h4>Strategisch profiel op hoofdlijnen</h4><p style="color:var(--muted);font-style:italic;font-size:13px">Genereer het AI-advies hieronder voor een uitgebreide managementsamenvatting.</p>';
  }
  var s=ST.scores;
  var ov=overall(s);
  var vd=verdict(ov);
  var top3sc=ST.scenarios?ST.scenarios.slice(0,3):[];
  var sigs=[];
  var p=ST.profile||{};
  var ebitdaVal=parseFloat(String(p.ebitda||'').replace('%','').replace(',','.'));
  var recurringVal=parseFloat(String(p.recurring||'').replace('%','').replace(',','.'));
  var omzetVal=parseFloat(String(p.omzet||'').replace(/[^0-9.]/g,''))||0;
  var fteVal=parseFloat(String(p.fte||'').replace(/[^0-9.]/g,''))||0;
  var omzetPerFte=omzetVal>0&&fteVal>0?Math.round(omzetVal/fteVal):0;
  var isAdmin=(p.kantoorType||'').toLowerCase().includes('admin');
  var accSamenvatting=isAccountancyScan();
  // Omzet/FTE-benchmark is accountancy-specifiek; buiten accountancy niet tonen (geen verkeerde norm).
  var bFte=!accSamenvatting?0:(isAdmin?(ST._benchmarks&&ST._benchmarks['omzet_fte_admin']?ST._benchmarks['omzet_fte_admin'].waarde:120000):(ST._benchmarks&&ST._benchmarks['omzet_fte_accountant']?ST._benchmarks['omzet_fte_accountant'].waarde:ST._benchmarks&&ST._benchmarks['omzet_fte_gemiddeld']?ST._benchmarks['omzet_fte_gemiddeld'].waarde:133000));
  if(!isNaN(ebitdaVal)&&ebitdaVal<0)sigs.push({c:'var(--red)',t:'Negatieve EBITDA ('+ebitdaVal+'%)',sub:'Verliesgevend. Verkoopbaarheid nihil zonder directe winstgevendheidsherstel.'});
  else if(!isNaN(ebitdaVal)&&ebitdaVal<15)sigs.push({c:'var(--gold)',t:accSamenvatting?('EBITDA '+ebitdaVal+'% (benchmark 20-30%)'):('Lage EBITDA-marge ('+ebitdaVal+'%)'),sub:accSamenvatting?'Te lage marge voor PE-transacties en serieuze fusiegesprekken.':'Beperkte marge drukt waardering en verkoopbaarheid.'});
  if(omzetPerFte>0&&bFte>0&&omzetPerFte<bFte)sigs.push({c:'var(--gold)',t:'Omzet/FTE €'+omzetPerFte.toLocaleString('nl-NL')+' (benchmark €'+(bFte/1000)+'K)',sub:'Productiviteitspotentieel van €'+((bFte-omzetPerFte)*fteVal).toLocaleString('nl-NL')+' wordt niet benut.'});
  if(!isNaN(recurringVal)&&recurringVal<50)sigs.push({c:'var(--gold)',t:accSamenvatting?('Vaste omzet '+recurringVal+'% (PE-norm >70%)'):('Lage vaste omzet ('+recurringVal+'%)'),sub:'Beperkte contractzekerheid drukt waardering en verkoopbaarheid.'});
  var weakDims=Object.entries(s).filter(function(e){return e[1]<50;}).map(function(e){var sec=SECTIONS.find(function(x){return x.id===e[0];});return sec?sec.label+' ('+e[1]+')':e[0];});
  var strongDims=Object.entries(s).filter(function(e){return e[1]>=75;}).map(function(e){var sec=SECTIONS.find(function(x){return x.id===e[0];});return sec?sec.label+' ('+e[1]+')':e[0];});
  var out='<h4>Strategisch profiel op hoofdlijnen</h4>';
  out+='<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;padding:.75rem 1rem;background:'+vd.bg+';border-left:4px solid '+vd.color+';border-radius:0 var(--r) var(--r) 0">';
  out+='<div style="font-size:2rem;font-weight:700;color:'+vd.color+';font-family:IBM Plex Mono,monospace">'+ov+'</div>';
  out+='<div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:'+vd.color+'">'+vd.label+'</div>';
  out+='<div style="font-size:13px;color:var(--mid);margin-top:2px">'+vd.txt+'</div></div></div>';
  if(sigs.length){
    out+='<div style="margin-bottom:.75rem">';
    sigs.forEach(function(sig){
      out+='<div style="padding:8px 10px;margin-bottom:6px;background:var(--card);border-left:3px solid '+sig.c+';border-radius:0 var(--r) var(--r) 0">';
      out+='<div style="font-size:12px;font-weight:600;color:'+sig.c+';display:flex;gap:6px"><span>&#9888;</span><span>'+sig.t+'</span></div>';
      if(sig.sub)out+='<div style="font-size:12px;color:var(--mid);margin-top:3px;padding-left:18px">'+sig.sub+'</div>';
      out+='</div>';
    });
    out+='</div>';
  }
  if(strongDims.length){
    out+='<div style="margin-bottom:.75rem">';
    out+='<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px">Sterktes</div>';
    out+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    strongDims.forEach(function(d){out+='<span style="font-size:12px;background:var(--teal-bg);color:var(--teal);padding:3px 8px;border-radius:3px;border:1px solid var(--teal)44">'+d+'</span>';});
    out+='</div></div>';
  }
  if(weakDims.length){out+='<p style="font-size:13px;color:var(--mid);margin-bottom:.75rem"><strong style="color:var(--gold)">Aandacht:</strong> '+weakDims.join(', ')+'</p>';}
  if(top3sc.length){
    out+='<div style="margin-top:.5rem">';
    top3sc.forEach(function(sc,i){
      out+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">';

      out+='<span style="font-size:12px;color:var(--teal);font-family:IBM Plex Mono,monospace">'+sc.score+'%</span>';
      out+='</div>';
    });
    out+='</div>';
  }
  return out;
}

function formatOmzet(v){
  if(!v)return '';
  var s=String(v).replace(/[^0-9]/g,'');
  if(!s)return v;
  var n=parseInt(s);
  if(isNaN(n))return v;
  return '€'+n.toLocaleString('nl-NL');
}

function rQuestions(){
  const sec=SECTIONS[ST.section];const total=SECTIONS.length;
  const answered=sec.questions.every(q=>ST.answers[q.id]!==undefined);
  const isLast=ST.section===total-1;
  const steps=SECTIONS.map((_,i)=>`<div class="p-step${i<ST.section?' done':i===ST.section?' active':''}"></div>`).join('');
  return`<div class="page-wrap"><div class="page-hdr"><div class="page-brand"><div class="wdot"></div>${BRAND.platform}</div><div class="page-step mono">STAP ${ST.section+1}/${total}</div></div><div class="prog-section"><div class="prog-top"><div class="prog-lbl">${sec.label}</div><div class="prog-frac">${ST.section+1} / ${total}</div></div><div class="prog-track"><div class="prog-fill" style="width:${(ST.section/total)*100}%"></div></div><div class="prog-steps">${steps}</div></div><div class="anim"><span class="sec-badge">${sec.icon}</span><div class="sec-title">${sec.label}</div><div class="sec-desc">${sec.desc}</div></div><div class="q-stack">${sec.questions.map((q,qi)=>{const v=ST.answers[q.id];return q.type==='select' ? `<div class="q-card${v!==undefined?' answered':''} anim a${qi+1}"><div class="q-row"><div><div class="q-text">${q.q}</div>${q.hint?`<div class="q-hint">${q.hint}</div>`:''}</div><div class="q-val${v!==undefined?' set':''}">${v!==undefined?v:'\u2014'}</div></div><select class="q-select" data-q="${q.id}" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-size:13px;margin-top:4px;color:var(--sub)"><option value="">Selecteer...</option>${q.options?q.options.map((o,oi)=>`<option value="${oi+1}" ${v===oi+1?'selected':''} >${o}</option>`).join(''):''}` + `</select></div>` : `<div class="q-card${v!==undefined?' answered':''} anim a${qi+1}"><div class="q-row"><div><div class="q-text">${q.q}</div>${q.hint?`<div class="q-hint">${q.hint}</div>`:''}</div><div class="q-val${v!==undefined?' set':''}">${v!==undefined?v:'\u2014'}</div></div><div class="likert">${[1,2,3,4,5].map(n=>`<button class="l-btn${v===n?' sel':''}" data-q="${q.id}" data-v="${n}">${n}</button>`).join('')}</div><div class="likert-axis"><span>1 = Helemaal niet</span><span>5 = Volledig</span></div></div>`;}).join('')}</div><div class="scan-nav"><div class="nav-info">${Object.keys(ST.answers).length} / ${SECTIONS.reduce((n,x)=>n+x.questions.length,0)} beantwoord</div><div style="display:flex;gap:10px"><button class="btn-ghost" id="prev-btn" ${ST.section===0?'disabled':''}>Terug</button><button class="btn-adv" id="next-btn" ${!answered?'disabled':''}>${isLast?'Genereer rapport':'Volgende'}</button></div></div></div>`;
}

function laadChartJs(cb){
  if(typeof Chart!=='undefined'){setTimeout(cb,50);return;}
  if(window._cjsLoad){setTimeout(function(){laadChartJs(cb);},200);return;}
  window._cjsLoad=true;
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  s.onload=function(){window._cjsLoad=false;setTimeout(cb,100);};
  document.head.appendChild(s);
}

function rStaafdiagram(offices){
  if(!offices||!offices.length)return '';
  var namen=offices.map(function(o){return o.name||'Anoniem';});
  var ebitda=offices.map(function(o){return parseFloat(String(o.ebitda||'0').replace('%','').replace(',','.'))||0;});
  var recurring=offices.map(function(o){return parseFloat(String(o.recurring||'0').replace('%','').replace(',','.'))||0;});
  var scores=offices.map(function(o){return o.overall||0;});
  var chartId='chart_'+Math.random().toString(36).slice(2,8);
  var h=Math.max(offices.length*50+150,250);
  laadChartJs(function(){
    setTimeout(function(){
      var ctx=document.getElementById(chartId);
      if(!ctx)return;
      new Chart(ctx,{type:'bar',data:{labels:namen,datasets:[
        {label:'EBITDA-marge (%)',data:ebitda,backgroundColor:'rgba(61,107,99,.8)',borderRadius:3},
        {label:'Vaste omzet (%)',data:recurring,backgroundColor:'rgba(201,168,76,.8)',borderRadius:3},
        {label:'Totaalscore (0-100, gem. van 11 dimensies)',data:scores,backgroundColor:'rgba(59,130,246,.7)',borderRadius:3}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}},tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y;}}}},scales:{y:{beginAtZero:true,max:100},x:{grid:{display:false}}}}});
    },100);
  });
  return '<div style="margin-bottom:1.5rem"><div class="sec-lbl anim a2">Vergelijkende kengetallen</div><div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem"><div style="position:relative;height:'+h+'px"><canvas id="'+chartId+'" role="img" aria-label="Kengetallen per kantoor">Kengetallen.</canvas></div></div></div>';
}

function kantoorRadar(scores){
  const R=75,cx=85,cy=85,n=SECTIONS.length;
  const ap=(i,v)=>{const a=(i/n)*2*Math.PI-Math.PI/2,r=(v/100)*R;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const pts=SECTIONS.map((s,i)=>ap(i,scores[s.id]||0)).map(p=>p.join(",")).join(" ");
  const grid=[20,40,60,80,100].map(v=>{const gp=SECTIONS.map((_,i)=>ap(i,v)).map(p=>p.join(",")).join(" ");return '<polygon points="'+gp+'" fill="none" stroke="var(--border)" stroke-width="0.5"/>';}).join("");
  const axes=SECTIONS.map((_,i)=>{const[x,y]=ap(i,100);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--border2)" stroke-width="0.5"/>';}).join("");
  const labs=SECTIONS.map((s,i)=>{const[x,y]=ap(i,107);const lbl=s.label.length>9?s.label.slice(0,8)+"…":s.label;return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="6" fill="var(--muted)" font-family="IBM Plex Sans">'+lbl+'</text>';}).join("");
  return '<svg width="170" height="170" viewBox="0 0 170 170" style="display:block;margin:.25rem auto">'+grid+axes+'<polygon points="'+pts+'" fill="rgba(61,107,99,.15)" stroke="var(--teal)" stroke-width="1.5"/>'+labs+'</svg>';
}

async function genereerKantoorAI(o, container) {
  container.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><span>Analyse wordt gegenereerd\u2026 (1-2 minuten)</span></div>';
  var dimInfo = SECTIONS.map(function(s) {
    return s.label + ': ' + ((o.scores && o.scores[s.id]) || 0);
  }).join(', ');
  var oPfte = o.fte && o.revenue
    ? Math.round(parseFloat(String(o.revenue).replace(/[^0-9]/g,'')) / parseFloat(o.fte)) : 0;
  // Sector van D\u00cdT kantoor (uit de opgeslagen scan); valt terug op de scan-sector voor oude scans.
  var oSector = (o.sector||'').trim() || ST.sector || 'accountancy';
  var oAcc = oSector === 'accountancy';
  var zn = labelsVoorSector(oSector).zn;
  var isAdmin = (o.kantoorType||'').toLowerCase().includes('admin') || (o.specialisme||'').toLowerCase().includes('admin');
  // Accountancy-benchmark alleen voor de accountancy-scan; andere sectoren hebben (nog) geen externe norm.
  var bFte = !oAcc ? 0 : (isAdmin?(ST._benchmarks&&ST._benchmarks['omzet_fte_admin']?ST._benchmarks['omzet_fte_admin'].waarde:120000):(ST._benchmarks&&ST._benchmarks['omzet_fte_accountant']?ST._benchmarks['omzet_fte_accountant'].waarde:ST._benchmarks&&ST._benchmarks['omzet_fte_gemiddeld']?ST._benchmarks['omzet_fte_gemiddeld'].waarde:133000));
  var bLabel = isAdmin ? '\u20ac'+(bFte/1000).toFixed(0)+'K (admin)' : '\u20ac'+(bFte/1000).toFixed(0)+'K';
  var prompt =
    'Schrijf een strategisch rapport. Gebruik "uw ' + zn + '". Geen eerste persoon. Begin direct met ## Strategisch profiel.\n\n'
    + (oAcc?'':'LET OP: dit is GEEN accountantskantoor \u2014 geen accountancy-jargon of -benchmarks, schrijf over "' + zn + '".\n')
    + (oAcc?'':'Er is voor deze sector geen externe benchmark beschikbaar \u2014 noem geen marktgemiddelde, sectornorm of vergelijkingscijfer uit eigen kennis.\n')
    + 'Baseer alles uitsluitend op de scores en gegevens hieronder. Verzin geen oorzaak, cijfer of externe norm die niet uit de scan volgt. Formuleer de aanbeveling als directe consequentie van de ingevulde scaninformatie; ontbreekt onderbouwing, benoem dat.\n'
    + (zn==='kantoor'?'Kantoor: ':zn==='praktijk'?'Praktijk: ':'Bedrijf: ') + (o.name||'Anoniem') + ' | Score: ' + o.overall + '/100\n'
    + 'Fte: ' + (o.fte||'?') + ' | Omzet: ' + (o.revenue||'?')
      + (oPfte > 0 ? ' (\u20ac' + (oPfte/1000).toFixed(0) + 'K/fte' + (oPfte < bFte ? ' — ONDER ' + bLabel : '') + ')' : '') + '\n'
    + 'EBITDA: ' + (o.ebitda||'?') + '% | Vaste omzet: ' + (o.recurring||'?') + '%\n'
    + 'Ambitie: ' + (o.ambitie||'?') + ' | Scenario: ' + (o.top_scenario||'?') + '\n'
    + 'Dimensiescores: ' + dimInfo + '\n\n'
    + 'Rapport (400-500 woorden) met ## koppen:\n'
    + '## Strategisch profiel\n## Sterktes\n## Risicos en aandachtspunten\n## Aanbeveling';
  try {
    var txt = await callAI(prompt);
    container.innerHTML = renderAIText(txt, false);
  } catch(e) {
    container.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Kon analyse niet genereren: ' + e.message + '</div>';
  }
}
async function genereerGroepsAI() {
  var d = ST.groupData;
  if (!d || !d.offices || !d.offices.length) return;
  d._aiLoading = true; d._aiTekst = '';
  var el = document.getElementById('groep-ai-out');
  if (el) el.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><span>Groepsanalyse wordt gegenereerd\u2026 (1-2 minuten)</span></div>';
  var offices = (d.offices||[]).slice().sort(function(a,b){ return b.overall - a.overall; });
  var cum = d.cumulative || {};
  var avg = offices.length ? Math.round(offices.reduce(function(a,o){ return a+o.overall; },0) / offices.length) : 0;
  var info = offices.map(function(o,i) {
    var oPfte = o.fte && o.revenue
      ? Math.round(parseFloat(String(o.revenue).replace(/[^0-9]/g,'')) / parseFloat(o.fte)) : 0;
    return (i+1) + '. ' + (o.name||'Anoniem')
      + '\n   Score: ' + o.overall + '/100 | Scenario: ' + (o.top_scenario||'?')
      + '\n   Fte: ' + (o.fte||'?') + ' | Omzet: ' + (o.revenue||'?')
        + (oPfte > 0 ? ' (\u20ac' + (oPfte/1000).toFixed(0) + 'K/fte)' : '')
      + '\n   EBITDA: ' + (o.ebitda||'?') + '% | Vaste omzet: ' + (o.recurring||'?') + '%'
      + '\n   Ambitie: ' + (o.ambitie||'?')
      + (o.specialisme ? ' | Specialisme: ' + o.specialisme : '');
  }).join('\n');
  var dims = SECTIONS.map(function(s){ return s.label + ': ' + (cum[s.id]||0); }).join(', ');
  var gL = groepSectorLabels(offices);
  var zn = gL.L.zn, znMv = gL.L.znMv;
  var prompt =
    'Schrijf een uitgebreid strategisch groepsrapport in het Nederlands (800-1000 woorden).\n'
    + 'Gebruik de bedrijfsnaam of "het ' + zn + '" direct. NOOIT eerste persoon (geen ik/mijn).\n'
    + (gL.sector==='gemengd'?'LET OP: deze groep bevat deelnemers uit verschillende sectoren — schrijf sectorneutraal ("onderneming(en)"), geen sectorspecifiek jargon of sectorbenchmarks.\n':(gL.acc?'':'LET OP: dit betreft GEEN accountantskantoren — geen accountancy-jargon of -benchmarks, schrijf over "' + znMv + '".\n'))
    + 'VERBOD: geen markdown-tabellen (geen |---|). Schrijf alles in lopende tekst.\n'
    + 'Baseer alles uitsluitend op de scores en gegevens hieronder. Verzin geen externe benchmark, marktgemiddelde, synergiebedrag of oorzaak die niet uit de scan volgt. Presenteer "Strategische opties" als opties die logisch uit de groepsdata volgen, niet als vaststaande noodzaak.\n\n'
    + 'GROEP: ' + (d.group&&d.group.name||'Onbekend') + ' | Gem. score: ' + avg + '/100\n'
    + 'Dimensiegemiddelden: ' + dims + '\n\n' + znMv.toUpperCase() + ' (gesorteerd op score):\n' + info + '\n\n'
    + 'STRUCTUUR (gebruik exact deze ## koppen):\n'
    + '## Groepsprofiel\n'
    + '## Financieel profiel\n'
    + '## Sterktes en kansen\n'
    + '## Aandachtspunten\n'
    + '## Strategische opties\n'
    + '## Per ' + zn + ' (behandel elk ' + zn + ' kort met naam en 2-3 specifieke observaties)';
  try {
    var txt = await callAI(prompt);
    d._aiTekst = txt; d._aiLoading = false;
    var el2 = document.getElementById('groep-ai-out');
    if (el2) el2.innerHTML = renderAIText(txt, false);
  } catch(e) {
    d._aiLoading = false;
    var el3 = document.getElementById('groep-ai-out');
    if (el3) el3.innerHTML = '<div style="color:var(--red);font-size:13px;padding:1rem">Fout: ' + e.message + '</div>';
  }
}

function downloadGroepsRapport(){
  var d=ST.groupData;if(!d)return;
  var offices=(d.offices||[]).sort(function(a,b){return b.overall-a.overall;});
  var avg=offices.length?Math.round(offices.reduce(function(a,o){return a+o.overall;},0)/offices.length):0;
  var txt='Koers voor Morgen -- Groepsrapport\n================================\n\n';
  txt+='Groep: '+(d.group&&d.group.name||ST.groupId)+'\n';
  txt+='Datum: '+new Date().toLocaleDateString('nl-NL')+'\n';
  txt+='Deelnemers: '+offices.length+'\nGem. score: '+avg+'/100\n\n';
  if(d._aiTekst)txt+='AI-ANALYSE\n----------\n'+d._aiTekst+'\n\n';
  txt+='KANTOREN\n--------\n';
  offices.forEach(function(o,i){
    txt+='\n#'+(i+1)+' '+(o.name||'Anoniem')+' ('+o.overall+'/100)\n';
    if(o.fte)txt+='Fte: '+o.fte+'\n';
    if(o.revenue)txt+='Omzet: '+o.revenue+'\n';
    if(o.ebitda)txt+='EBITDA: '+o.ebitda+'\n';
    if(o.recurring)txt+='Vaste omzet: '+o.recurring+'\n';
    if(o.ambitie)txt+='Ambitie: '+o.ambitie+'\n';
    txt+='Scenario: '+(o.top_scenario||'Onbekend')+'\n';
  });
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download='groepsrapport-'+new Date().toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

    const inhoud='Koers voor Morgen — Groepscodes\n\nGroep: '+naam+'\nDeelnemerscode: '+code+'\nBeheerdscode: '+(adminCode||'niet beschikbaar')+'\nDatum: '+new Date().toLocaleDateString('nl-NL')+'\n\nKantoren gebruiken de DEELNEMERSCODE.\nU gebruikt de BEHEERDSCODE om alles te zien.\n\nhttps://koersvoormorgen.nl';
    const blob=new Blob([inhoud],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='koersvoormorgen-code-'+code+'.txt';
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  });
  on('do-join-group','click',()=>{
    const code=$('gj-code')?.value?.trim().toUpperCase();
    if(!code||code.length<4){alert('Voer een geldige groepscode in.');return;}
    ST.groupId=code;ST.screen='intake';render();
  });
  on('start-scan','click',()=>{
    if(!ST._sectorGekozen){alert('Kies eerst uw sector bovenaan deze pagina.');window.scrollTo({top:0,behavior:'smooth'});return;}
    const fte=$('f-fte')?.value?.trim();
    const omzet=$('f-omzet')?.value?.trim();
    const omzetfte='';
    const ebitda=$('f-ebitda')?.value?.trim();
    const recurring=$('f-recurring')?.value?.trim();
    const naam=$('f-naam')?.value?.trim();
    const ambitie=$('f-ambitie')?.value?.trim();
    const ktCheck=document.getElementById('f-kantoortype')?.value||'';
    if(!naam||!fte||!omzet||!ebitda||!recurring||!ambitie||!ktCheck){
      alert('Vul alle verplichte velden in (gemarkeerd met *):\nNaam kantoor, medewerkers, jaaromzet, EBITDA-marge, aandeel vaste omzet en strategische ambitie.');return;
    }
    const saveConsent=true;
    const kantoorType=document.getElementById('f-kantoortype')?.value||'onbekend';
    ST.profile={naam,naamAnon:false,saveConsent,kantoorType,email:$('f-email')?.value||'',regio:$('f-regio')?.value||'',fte,omzet,specialisme:$('f-spec')?.value||'',doelgroep:$('f-doel')?.value||'',software:$('f-sw')?.value||'',sbi:$('f-sbi')?.value||'',ambitie,context:$('f-context')?.value||'',omzetfte,ebitda,recurring};
    ST.screen='questions';render();
  });
  on('prev-btn','click',()=>{if(ST.section>0){ST.section--;render();}});
  on('next-btn','click',async()=>{
    const sec=SECTIONS[ST.section];
    if(!sec.questions.every(q=>ST.answers[q.id]!==undefined))return;
    if(ST.section<SECTIONS.length-1){ST.section++;render();}
    else{ST.scores=calcScores();ST.scenarios=rankScenarios(ST.scores);ST.screen='results';render();window.scrollTo(0,0);setTimeout(function(){generateAI();},100);saveScanToGroup().catch(function(e){console.error('saveScanToGroup fout:',e);});}
  });
  document.querySelectorAll('.l-btn').forEach(b=>{b.onclick=()=>{ST.answers[b.dataset.q]=parseInt(b.dataset.v);render();};});
  document.querySelectorAll('.q-select').forEach(s=>{s.onchange=()=>{if(s.value)ST.answers[s.dataset.q]=parseInt(s.value);render();};});
  document.querySelectorAll('.q-select').forEach(s=>{s.onchange=()=>{if(s.value)ST.answers[s.dataset.q]=parseInt(s.value);render();};});
  document.querySelectorAll('.sc-hdr').forEach(h=>{h.onclick=()=>{const k=h.dataset.k;ST.openScenario=ST.openScenario===k?null:k;render();};});
  document.querySelectorAll('.office-hdr').forEach(h=>{h.onclick=()=>{const id=h.dataset.oid;ST.openOffice=ST.openOffice===id?null:id;render();};});
  on('gen-btn','click',()=>generateAI());
  on('view-group-btn','click',()=>loadGroup(ST.groupId));
  on('refresh-dash','click',()=>loadGroup(ST.groupId));
  on('route-rapport','click',()=>{ST.screen='rapport-ophalen';render();});
  on('rapport-terug','click',()=>{ST.screen='intro';render();});
  on('rapport-ophalen-btn','click',async function(){
    var code=document.getElementById('rapport-code-input');
    if(!code||!code.value.trim())return;
    var id=code.value.trim().toUpperCase();
    var btn=document.getElementById('rapport-ophalen-btn');
    var errEl=document.getElementById('rapport-error');
    if(errEl)errEl.style.display='none';
    btn.textContent='Laden...';btn.disabled=true;
    try{
      var resp=await fetch(WORKER+'/rapport/'+id,{signal:AbortSignal.timeout(15000)});
      var data={};
      try{data=await resp.json();}catch(e){}
      console.log('Rapport ophalen:',resp.status,JSON.stringify(data).substring(0,200));
      if(resp.status===404)throw new Error('Rapport met code '+id+' bestaat niet. Controleer de code of vraag een nieuw rapport aan.');
      if(!resp.ok||data.error)throw new Error(data.error||'Rapport niet gevonden (code: '+id+')');
      // Herstel state volledig
      ST.savedScanId=data.id||data.scan_id||id;
      setScanSector(data.sector||'accountancy');
      ST._sectorGekozen=true;
      var parsedScores={};
      try{parsedScores=JSON.parse(data.scores||'{}');}catch(e){parsedScores={};}
      ST.scores=parsedScores;
      // Herstel scenarios via rankScenarios zodat rResults correct werkt
      ST.scenarios=rankScenarios(Object.keys(parsedScores).length?parsedScores:{
        strategisch:60,opvolging:60,winst:60,schaal:60,auto:60,
        partner:60,klant:60,fusie:60,ai_dim:60,personeel:60,commercieel:60
      });
      // Forceer top_scenario als eerste
      if(data.top_scenario){
        ST.scenarios.sort(function(a,b){return a.name===data.top_scenario?-1:b.name===data.top_scenario?1:0;});
      }
      ST.profile={
        naam:data.kantoor_naam||'',
        email:data.email||'',
        regio:data.regio||'',
        fte:data.fte||'',
        omzet:data.omzet||data.revenue||'',
        ambitie:data.ambitie||'',
        ebitda:'',recurring:'',
        specialisme:'',doelgroep:'',software:'',
        context:'',naamAnon:false,saveConsent:false,
        kantoorType:''
      };
      ST.aiText=data.rapport_tekst||'';
      ST.aiLoading=false;
      ST.screen='results';
      render();
    }catch(e){
      console.error('Rapport ophalen fout:',e);
      const _isNet=e.name==='TypeError'||e.message.toLowerCase().includes('fetch')||e.message.toLowerCase().includes('network');
      const _isNotFound=e.message.toLowerCase().includes('niet gevonden')||e.message.toLowerCase().includes('not found');
      const _msg=_isNet?'Geen verbinding. Controleer uw internet en probeer opnieuw.'
        :_isNotFound?'Rapport niet gevonden. Controleer de code — deze is hoofdlettergevoelig. Rapporten worden maximaal 12 maanden bewaard.'
        :'Er ging iets mis: '+e.message;
      if(errEl){errEl.style.display='block';errEl.textContent=_msg;}
    }
    btn.textContent='Rapport ophalen →';btn.disabled=false;
  });
  on('groep-ai-btn','click',async function(){
    var btn=document.getElementById('groep-ai-btn');
    var out=document.getElementById('groep-ai-out');
    if(!btn||!out)return;
    btn.disabled=true;btn.textContent='Genereren...';
    out.innerHTML='<div class="ai-loading"><div class="ai-spinner"></div><span>Groepsanalyse wordt gegenereerd...</span></div>';
    var d=ST.groupData;
    if(!d)return;
    var offices=(d.offices||[]).sort(function(a,b){return b.overall-a.overall;});
    var cum=d.cumulative||{};
    var avg=offices.length?Math.round(offices.reduce(function(a,o){return a+o.overall;},0)/offices.length):0;
    var kantoorInfo=offices.map(function(o,i){
      return (i+1)+'. '+( o.name||'Anoniem')+' | Score: '+o.overall+' | EBITDA: '+(o.ebitda||'?')+'% | Vast: '+(o.recurring||'?')+'% | Omzet: '+(o.revenue||'?')+' | Fte: '+(o.fte||'?')+' | Ambitie: '+(o.ambitie||'?')+' | Scenario: '+(o.top_scenario||'?');
    }).join('\n');
    var dimInfo=SECTIONS.map(function(s){return s.label+': '+(cum[s.id]||0);}).join(' | ');
    // Bugfix 5 aug 2026: verwees naar een niet-bestaande variabele 'o' (leek gekopieerd van een
    // losse-kantoor-prompt) \u2014 crashte synchroon v\u00f3\u00f3r de fetch, dus de laadspinner bleef eeuwig staan
    // zonder foutmelding. Nu een echte groepsbrede prompt op basis van kantoorInfo/avg/dimInfo, die
    // al w\u00e9l correct werden opgebouwd maar nooit gebruikt werden.
    var prompt='Geef een strategische groepsanalyse over deze '+offices.length+' kantoren samen \u2014 geen los rapport per kantoor. '+TAAL_REGELS+'\n\nGROEPSOVERZICHT:\n- Aantal kantoren: '+offices.length+'\n- Gemiddelde score: '+avg+'/100\n\nKANTOREN (gesorteerd op score):\n'+kantoorInfo+'\n\nGEMIDDELDE DIMENSIESCORES OVER DE GROEP:\n'+dimInfo+'\n\nGeef een rapport in het Nederlands met ## koppen:\n## Groepsprofiel\n[Spreiding in scores, opvallende verschillen tussen de kantoren, algemeen beeld]\n## Gezamenlijke sterktes\n[Wat de groep als geheel sterk maakt, op basis van de dimensiescores]\n## Gezamenlijke risicos en aandachtspunten\n[Structurele zwaktes die bij meerdere kantoren terugkomen]\n## Aanbeveling\n[Concreet advies voor de groep \u2014 bijv. kennisdeling, gezamenlijke inkoop, benchmarking, consolidatie]\n\nDirect, concreet, specifiek voor deze groep kantoren. Max 400 woorden.';
    try{
      // Bugfix 5 aug 2026: dit parste een SSE-streamformaat ("data: {...}") dat de backend nooit
      // levert (/ai draait met stream:false en geeft één JSON-object terug — zelfde patroon als
      // callAI() voor het individuele rapport). Zonder deze fix bleef txt altijd leeg: de crash die
      // hiervóór zat (variabele 'o' bestond niet) verborg dit tot nu toe, want de code kwam nooit
      // tot hier.
      var resp=await fetch(WORKER+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:3000})});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      var data=await resp.json();
      if(data.error)throw new Error(data.error);
      var txt=(data.text||'').trim();
      if(!txt)throw new Error('Leeg antwoord van AI ontvangen');
      out.innerHTML=renderAIText(txt,false);
      btn.textContent='Opnieuw genereren';btn.disabled=false;
    }catch(e){
      out.innerHTML='<div style="color:var(--red)">Fout: '+e.message+'</div>';
      btn.textContent='Probeer opnieuw';btn.disabled=false;
    }
  });
  on('callback-btn','click',()=>showCallbackModal());
  on('restart-btn','click',()=>{if(ST.groupData)ST.groupData._aiTekst='';ST={...ST,screen:'intro',_sectorGekozen:false,section:0,answers:{},scores:null,scenarios:null,openScenario:null,openOffice:null,aiText:null,aiLoading:false,_smvKlaar:false,savedScanId:null,adminCode:null,profile:{naam:'',naamAnon:false,email:'',regio:'',fte:'',omzet:'',specialisme:'',doelgroep:'',software:'',ambitie:'',context:'',omzetfte:'',ebitda:'',recurring:'',saveConsent:true,sbi:''}};render();window.scrollTo(0,0);});
}


function bellen(){window.location.href="tel:+31638689888";}
function toonFeedbackModal(){

  var ov=document.createElement('div');ov.id='fb-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem';

    +'<div><label style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">E-mail of telefoon</label><input id="fb-contact" type="text" placeholder="E-mailadres of telefoonnummer" style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);outline:none"></div>'
    +'<div><label style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">Bericht</label><textarea id="fb-bericht" rows="4" placeholder="Uw vraag of opmerking..." style="width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-family:IBM Plex Sans,sans-serif;font-size:13px;color:var(--sub);outline:none;resize:vertical"></textarea></div>'
    +'</div>'

    +'<div style="display:flex;gap:10px">'
    +'<button id="fb-sluit" style="flex:1;background:transparent;border:1px solid var(--border2);color:var(--mid);border-radius:var(--r);padding:10px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:13px">Annuleren</button>'
    +'<button id="fb-send" style="flex:1;background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:10px;cursor:pointer;font-family:IBM Plex Sans,sans-serif;font-size:13px;font-weight:600">Verstuur</button>'
    +'</div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  document.getElementById('fb-sluit').addEventListener('click',function(){ov.remove();});
  document.getElementById('fb-send').addEventListener('click',async function(){

    var contact=document.getElementById('fb-contact').value.trim();
    var bericht=document.getElementById('fb-bericht').value.trim();
    var err=document.getElementById('fb-err');
    if(!naam||!contact||!bericht){err.style.display='block';err.textContent='Vul alle velden in.';return;}
    var btn=document.getElementById('fb-send');btn.disabled=true;btn.textContent='Versturen...';
    err.style.display='none';
    var p=ST.profile||{};
    try{
      await fetch(WORKER+'/callback',{method:'POST',headers:{'Content-Type':'application/json'},

          tijd:'',kantoor:{naam:p.naam||'',regio:p.regio||'',fte:p.fte||'',omzet:p.omzet||'',specialisme:p.specialisme||'',ambitie:p.ambitie||''},
          scores:ST.scores||{},totaal:ST.scores?overall(ST.scores):0,
          scenario:ST.scenarios&&ST.scenarios[0]?ST.scenarios[0].name:'',
          feedback:bericht,type:'feedback'})});
      document.getElementById('fb-status').style.display='block';

function showCallbackModal(){
  const existing=document.getElementById('cb-overlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='cb-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  overlay.innerHTML='<div style="background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:440px;width:100%;max-height:90vh;overflow-y:auto">'
    +'<div style="font-family:\'Playfair Display\',serif;font-size:1.2rem;color:var(--head);font-weight:600;margin-bottom:.4rem">Terugbelverzoek</div>'
    +'<div style="font-size:13px;color:var(--mid);line-height:1.65;margin-bottom:1.25rem">Vul uw gegevens in. Marcel Bisschops neemt binnen 1 werkdag contact op. Uw gegevens worden uitsluitend gebruikt voor dit verzoek.</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.25rem">'
    +'<div class="field"><label>Naam</label><input type="text" id="cb-naam" placeholder="Uw naam"></div>'
    +'<div class="field"><label>Telefoonnummer</label><input type="tel" id="cb-tel" placeholder="Telefoonnummer"></div>'
    +'<div class="field"><label>E-mailadres</label><input type="email" id="cb-email" placeholder="E-mailadres"></div>'
    +'<div class="field"><label>Beste beltijd (optioneel)</label><input type="text" id="cb-tijd" placeholder="Voorkeur voor moment van bellen"></div>'
    +'</div>'
    +'<div id="cb-status" style="font-size:12px;color:var(--teal);margin-bottom:1rem;display:none">Dank voor uw feedback! Marcel neemt dit ter harte.</div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +'<button id="cb-cancel" class="btn-ghost">Annuleren</button>'
    +'<button id="cb-send" class="btn-adv">Verstuur verzoek</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  document.getElementById('cb-cancel').onclick=function(){overlay.remove();};
  document.getElementById('cb-send').onclick=async function(){
    var naam=document.getElementById('cb-naam').value.trim();
    var tel=document.getElementById('cb-tel').value.trim();
    var email=document.getElementById('cb-email').value.trim();
    var tijd=document.getElementById('cb-tijd').value.trim();

    var btn=document.getElementById('cb-send');
    btn.disabled=true;btn.textContent='Versturen...';
    var s=ST.scores||{};
    var p=ST.profile||{};
    var ov=ST.scores?overall(ST.scores):0;
    try{
      await fetch(WORKER+'/callback',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({naam:naam,tel:tel,email:email,tijd:tijd,
          kantoor:{naam:p.naam||'Niet opgegeven',regio:p.regio||'',fte:p.fte||'',omzet:p.omzet||'',specialisme:p.specialisme||'',ambitie:p.ambitie||''},
          scores:s,totaal:ov,scenario:ST.scenarios&&ST.scenarios[0]?ST.scenarios[0].name:''
        })
      });
      document.getElementById('cb-status').style.display='block';
      btn.textContent='Verstuurd';
      setTimeout(function(){overlay.remove();},2500);
    }catch(e){
      btn.disabled=false;btn.textContent='Verstuur verzoek';
      alert('Er ging iets mis. Bel direct: 06 - 38 68 98 88');
    }
  };
}
