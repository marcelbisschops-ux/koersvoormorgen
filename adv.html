<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Koers voor Morgen — Adviseur</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
:root{
  --void:#f7f5f2;--bg:#faf9f7;--panel:#fff;
  --border:#e4e0db;--border2:#d0cbc4;
  --head:#1a1815;--sub:#2a2825;--mid:#5a5450;--muted:#6b6862;
  --teal:#1a7a5e;--teal-light:#edf7f3;--teal-border:#b8ddd2;--teal-dark:#145f48;
  --gold:#c9a84c;--gold-bg:#fdf8ee;--gold-border:#e8d99a;--gold-dark:#8a6d00;
  --red:#c0392b;--red-light:#fdf2f0;
  --r:5px;--r2:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
}
/* Nachtmodus: volgt de systeeminstelling van het apparaat, zoals in mna.html. De toastmelding
   (#toast) gebruikt bewust een vaste donkere pil ongeacht thema — die staat los van --head. */
@media(prefers-color-scheme:dark){
  :root{
    --void:#1b1a17;--bg:#221f1c;--panel:#252320;
    --border:#3d3a34;--border2:#4d4940;
    --head:#f6f4ef;--sub:#e9e7e1;--mid:#b8b4aa;--muted:#938f86;
    --teal:#2fae87;--teal-light:#1c352c;--teal-border:#2f5c4a;--teal-dark:#8fe0c0;
    --gold:#e0c06a;--gold-bg:#332c1a;--gold-border:#5c4f2a;--gold-dark:#f0d68c;
    --red:#e8746b;--red-light:#3a211f;
  }
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.5}
#app{min-height:100vh}

/* LOGIN */
.login-outer{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--void)}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2.25rem;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.login-brand{display:flex;align-items:center;gap:8px;margin-bottom:2rem}
.login-dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.login-brand-name{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.login-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.35rem}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.75rem;line-height:1.6}

/* FORMS */
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,94,.08)}
.field textarea{resize:vertical;min-height:80px}
.row2{display:flex;gap:12px}
.row2 .field{flex:1}

/* BUTTONS */
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{font-size:11px;padding:5px 12px}
.btn-outline{background:transparent;color:var(--mid);border:1.5px solid var(--border2);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-outline:hover{border-color:var(--mid);color:var(--sub);background:var(--bg)}
.btn-outline.sm{font-size:11px;padding:4px 10px}

/* MESSAGES */
.err-msg{color:var(--red);font-size:12px;background:var(--red-light);border:1px solid #f5c6c0;border-radius:var(--r);padding:8px 10px;margin-bottom:.75rem;display:none}
.ok-msg{color:var(--teal);font-size:12px;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:var(--r);padding:8px 10px;margin-bottom:.75rem;display:none}
.sec-notice{margin-top:1.25rem;padding:.75rem 1rem;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:var(--r);font-size:11px;color:var(--muted);line-height:1.7}
.sec-notice strong{color:var(--sub)}
.link-subtle{font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s;cursor:pointer}
.link-subtle:hover{color:var(--teal)}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:56px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.hdr-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.hdr-right{display:flex;align-items:center;gap:.75rem}
.hdr-user{font-size:12px;color:var(--muted)}
.hdr-name{font-weight:600;color:var(--sub)}

/* MAIN / LAYOUT */
.main{max-width:1000px;margin:0 auto;padding:2rem}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:1.5rem;transition:color .15s}
.back-btn:hover{color:var(--teal)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:2rem}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.stat-n{font-family:'IBM Plex Mono',monospace;font-size:1.75rem;font-weight:500;color:var(--teal);line-height:1;margin-bottom:.2rem}
.stat-l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow);margin-bottom:1.5rem}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;border-bottom:1px solid var(--border);background:var(--bg)}
.card-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card-body{padding:1.25rem}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--sub);vertical-align:middle}
tr:last-child td{border-bottom:none}

/* Audit-fix P3 (25 juli 2026): geen enkel breakpoint behalve dark-mode, in tegenstelling tot
   mna.html (dat wel 600px/680px-breakpoints heeft) — tabellen liepen op smal scherm ongewijzigd
   door i.p.v. te scrollen. table-wrap laat de tabel zelf horizontaal scrollen i.p.v. de pagina. */
@media(max-width:700px){
  .stats{grid-template-columns:1fr 1fr}
  table{min-width:520px}
}
tr:hover td{background:var(--bg);cursor:pointer}
.td-name{font-weight:600;color:var(--head)}
.td-sec{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.badge-actief{background:var(--teal-light);color:var(--teal);border:1px solid var(--teal-border)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:13px}
.empty-icon{font-size:1.75rem;margin-bottom:.75rem;opacity:.4}

/* DETAIL SECTIONS */
.section{margin-bottom:1.5rem}
.section-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.code-box{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:6px 12px}
.code-val{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--teal);font-weight:500;letter-spacing:.1em}
.code-val-gold{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--gold);font-weight:500;letter-spacing:.1em}
.copy-btn{font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:3px;padding:2px 7px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.copy-btn:hover{border-color:var(--teal);color:var(--teal)}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:1rem}

/* GESPREK */
.gesprek-item{border:1px solid var(--border);border-radius:var(--r2);margin-bottom:.75rem;overflow:hidden}
.gesprek-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);cursor:pointer}
.gesprek-body{padding:12px 14px;font-size:13px;color:var(--sub);line-height:1.7;display:none;border-top:1px solid var(--border)}
.gesprek-body.open{display:block}

/* OVERLAY / MODAL */
.overlay{position:fixed;inset:0;background:rgba(26,24,21,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--head);font-weight:600;margin-bottom:1.5rem}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}

/* TOAST */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1815;color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:999;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// Standaard altijd productie. Alleen overschrijfbaar via ?worker=... in de URL, en dan uitsluitend
// naar de bekende staging-omgeving — bedoeld om daar tegen te testen, nooit als permanente
// instelling. Security-fix 17 aug 2026 (extern codereview): een willekeurige ?worker=-waarde
// accepteren betekende dat een gekaapte link inloggegevens naar een server van een aanvaller kon
// sturen; met deze whitelist zijn alleen deze twee, door onszelf beheerde, bestemmingen mogelijk.
var _WORKER_WHITELIST=['https://kantoorinzicht.marcel-bisschops.workers.dev','https://kantoorinzicht-staging.marcel-bisschops.workers.dev'];
var _WORKER_PARAM=new URLSearchParams(location.search).get('worker')||'';
var WORKER=_WORKER_WHITELIST.includes(_WORKER_PARAM)?_WORKER_PARAM:'https://kantoorinzicht.marcel-bisschops.workers.dev';
// White-label basis — centrale merkconfig (zelfde patroon als mna.html). Eén plek wijzigen = overal.
var BRAND = { platform:'Koers voor Morgen', bedrijf:'Bisschops Financing B.V.', bedrijfKort:'Bisschops Financing BV', suffix:'M&A', kort:'Bisschops Financing' };
document.title = BRAND.platform + ' — Adviseur';
var G={email:'',token:'',naam:'',bedrijf:'',trajecten:[]};
var VIEW='dashboard'; // dashboard | detail
var TRAJECT=null;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function ge(id){return document.getElementById(id);}
function render(h){ge('app').innerHTML=h;}

function toast(msg,type){
  var el=ge('toast');el.textContent=msg;
  el.style.background=type==='err'?'#c0392b':type==='ok'?'#1a7a5e':'#1a1815';
  el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2800);
}

function post(url,body){
  var params=new URLSearchParams();
  params.append('data',JSON.stringify(body));
  // Security-fix 17 aug 2026 (fix 6): sessietoken als header i.p.v. wachtwoord in elke request-body
  // opnieuw meesturen. Tijdens de allereerste login is G.token nog leeg — dan valt de backend zelf
  // terug op email/wachtwoord uit de body (die het inlogscherm daar bewust nog wél in zet).
  var opts={method:'POST',body:params};
  if(G.token) opts.headers={'x-gebruiker-token':G.token};
  return fetch(WORKER+url,opts);
}

// ===== LOGIN =====
function renderLogin(){
  render(`<div class="login-outer"><div class="login-card">
    <div class="login-brand"><div class="login-dot"></div><span class="login-brand-name">${BRAND.platform} ${BRAND.suffix}</span></div>
    <div class="login-title">Adviseur portaal</div>
    <div class="login-sub">Log in met uw e-mailadres en wachtwoord.</div>
    <div class="field"><label>E-mailadres</label><input type="email" id="l-e" placeholder="E-mailadres" autofocus></div>
    <div class="field"><label>Wachtwoord</label><input type="password" id="l-w" placeholder="••••••••"></div>
    <div id="l-err" class="err-msg"></div>
    <button class="btn" id="l-btn" style="width:100%;margin-bottom:1rem">Inloggen</button>
    <div style="text-align:right;margin-bottom:1.25rem">
      <a class="link-subtle" id="l-forgot">Wachtwoord vergeten?</a>
    </div>
    <div class="sec-notice">&#128274; <strong>Beveiliging & privacy</strong><br>
    Verbinding versleuteld (HTTPS). Gegevens in Cloudflare EU (Frankfurt). Geen gegevensverkoop.
    <a href="privacy.html" style="color:var(--teal)">Privacyverklaring</a> &middot; <a href="platformvoorwaarden.html" style="color:var(--teal)">Gebruiksvoorwaarden</a></div>
    <div style="text-align:center;margin-top:1rem;font-size:11px;color:var(--muted)">&copy; ${new Date().getFullYear()} ${BRAND.bedrijf} Alle rechten voorbehouden.</div>
  </div></div>`);
  ge('l-btn').onclick=doLogin;
  ge('l-w').onkeydown=function(e){if(e.key==='Enter')doLogin();};
  ge('l-e').onkeydown=function(e){if(e.key==='Enter')ge('l-w').focus();};
  ge('l-forgot').onclick=function(){renderForgot();};
}

function renderForgot(){
  render(`<div class="login-outer"><div class="login-card">
    <div class="login-brand"><div class="login-dot"></div><span class="login-brand-name">${BRAND.platform} ${BRAND.suffix}</span></div>
    <div class="login-title">Wachtwoord vergeten</div>
    <div class="login-sub">Vul uw e-mailadres in. Als het bekend is ontvangt u een resetlink.</div>
    <div class="field"><label>E-mailadres</label><input type="email" id="f-e" placeholder="E-mailadres" autofocus></div>
    <div id="f-ok" class="ok-msg"></div>
    <div id="f-err" class="err-msg"></div>
    <button class="btn" id="f-btn" style="width:100%;margin-bottom:1rem">Verstuur resetlink</button>
    <div style="text-align:center"><a class="link-subtle" id="f-back">← Terug naar inloggen</a></div>
  </div></div>`);
  ge('f-btn').onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent='Versturen...';
    var email=ge('f-e').value.trim();
    if(!email){ge('f-err').textContent='Vul uw e-mailadres in.';ge('f-err').style.display='block';btn.disabled=false;btn.textContent='Verstuur resetlink';return;}
    try{
      var r=await fetch(WORKER+'/gebruikers/ww-vergeten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
      var d=await r.json();
      ge('f-ok').textContent=d.msg||'Controleer uw e-mail.';ge('f-ok').style.display='block';
      btn.textContent='Verstuurd ✓';
    }catch(e){ge('f-err').textContent='Fout: '+e.message;ge('f-err').style.display='block';btn.disabled=false;btn.textContent='Verstuur resetlink';}
  };
  ge('f-back').onclick=function(){renderLogin();};
  ge('f-e').onkeydown=function(e){if(e.key==='Enter')ge('f-btn').click();};
}

async function doLogin(){
  var btn=ge('l-btn');btn.disabled=true;btn.textContent='Inloggen...';
  var err=ge('l-err');err.style.display='none';
  var email=ge('l-e').value.trim(),ww=ge('l-w').value;
  if(!email||!ww){err.textContent='Vul e-mail en wachtwoord in.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
  try{
    var r=await post('/adviseur/trajecten',{email:email,wachtwoord:ww});
    var d=await r.json();
    if(!r.ok||!d.ok){err.textContent=d.error||'Inloggegevens onjuist.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
    G.email=email;G.token=d.sessie_token||'';G.naam=d.naam;G.bedrijf=d.bedrijf;G.trajecten=d.trajecten||[];G.limiet=d.traject_limiet||1;G.modules=d.modules||{traject:true};G.isTester=!!d.is_tester;G.branding=d.branding||{brand_naam:'',brand_kleur:'',brand_logo_url:''};
    var vw=d.voorwaarden||{gv_akkoord:true};
    if(!vw.gv_akkoord){ renderVoorwaardenAcceptatie(vw); return; }
    renderDashboard();
  }catch(e){err.textContent='Verbindingsfout — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';}
}

// ===== VERPLICHTE ACCEPTATIE GEBRUIKSVOORWAARDEN =====
// Blokkeert de rest van het portaal totdat de Gebruiksvoorwaarden (platformgebruik) zijn geaccepteerd.
// NB: de Algemene Voorwaarden van Bisschops Financing gelden voor de M&A-adviesrelatie van BF zelf
// en zijn niet van toepassing op een adviseur die uitsluitend het platform gebruikt — daarom hier
// bewust niet opgenomen (gecorrigeerd juli 2026).
function renderVoorwaardenAcceptatie(vw){
  render(`<div class="login-outer"><div class="login-card" style="max-width:640px">
    <div class="login-brand"><div class="login-dot"></div><span class="login-brand-name">${BRAND.platform} ${BRAND.suffix}</span></div>
    <div class="login-title">Gebruiksvoorwaarden accepteren</div>
    <div class="login-sub">Voordat u verder kunt, dient u de Gebruiksvoorwaarden van het platform te accepteren.</div>
    <div id="vw-tekst" style="font-size:12px;color:var(--muted);padding:2rem 0;text-align:center">Laden...</div>
    <div id="vw-vakjes" style="display:none">
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--sub);margin-bottom:1.25rem;cursor:pointer">
        <input type="checkbox" id="vw-gv" style="margin-top:3px">
        <span>Ik heb de Gebruiksvoorwaarden hierboven gelezen en ga hiermee akkoord.</span>
      </label>
      <div id="vw-err" class="err-msg"></div>
      <button class="btn" id="vw-ok" style="width:100%" disabled>Ga akkoord en verder</button>
    </div>
  </div></div>`);

  fetch(WORKER+'/gebruiker/voorwaarden').then(function(r){return r.json();}).then(function(d){
    var tekstDiv=ge('vw-tekst');
    var gv=(d.gv&&d.gv.tekst)||'';
    tekstDiv.innerHTML='<div style="max-height:320px;overflow-y:auto;text-align:left;background:var(--void);border:1px solid var(--border);border-radius:var(--r);padding:1rem;font-size:11px;color:var(--mid);white-space:pre-wrap;line-height:1.6" id="vw-doc-gv">'+gv.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
    tekstDiv.style.textAlign='left';tekstDiv.style.padding='0';
    ge('vw-vakjes').style.display='block';
    function checkKlaar(){ge('vw-ok').disabled=!ge('vw-gv').checked;}
    ge('vw-gv').onchange=checkKlaar;
    ge('vw-ok').onclick=async function(){
      var btn=this;btn.disabled=true;btn.textContent='Verwerken...';
      var err=ge('vw-err');err.style.display='none';
      try{
        var r=await fetch(WORKER+'/gebruiker/voorwaarden/accepteren',{method:'POST',headers:{'Content-Type':'application/json','x-gebruiker-token':G.token},body:JSON.stringify({})});
        var rd=await r.json();
        if(!r.ok||!rd.ok){err.textContent=rd.error||'Kon niet worden verwerkt.';err.style.display='block';btn.disabled=false;btn.textContent='Ga akkoord en verder';return;}
        renderDashboard();
      }catch(e){err.textContent='Verbindingsfout — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Ga akkoord en verder';}
    };
  }).catch(function(){ ge('vw-tekst').textContent='Kon de voorwaarden niet laden. Ververs de pagina.'; });
}

// ===== DASHBOARD =====
function modChips(){
  var m=G.modules||{traject:true};
  var lbl={traject:'Traject',contracten:'Contracten & ondertekening',ai_analyse:'AI-analyse',qa:'Q&A',meekijker:'Meekijkers',marketing:'Marketing'};
  return Object.keys(lbl).map(function(k){
    var aan=!!m[k];
    return '<span title="'+(aan?'Module actief':'Activeren via '+BRAND.kort+' — neem contact op')+'" style="font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--border);'+(aan?'color:var(--teal)':'color:var(--muted);opacity:.65')+'">'+(aan?'&#10003; ':'&#128274; ')+lbl[k]+'</span>';
  }).join('');
}

    rows='<tr><td colspan="6"><div class="empty"><div class="empty-icon">📁</div>Nog geen trajecten.<br>Klik op "+ Nieuw traject" om te beginnen.</div></td></tr>';

    G.trajecten.forEach(function(t){
      rows+=`<tr onclick="openTraject('${esc(t.id)}')">
        <td class="td-name">${esc(t.kantoor_naam||'—')}</td>

      <div class="hdr-right">
        <span class="hdr-user">Ingelogd als <span class="hdr-name">${esc(G.naam)}</span>${G.bedrijf?' &middot; '+esc(G.bedrijf):''}</span>

        <button class="btn-outline" onclick="renderHuisstijlModal()">&#127912; Huisstijl</button>

      </div>
      <div class="card">
        <div class="card-hdr">
          <div class="card-title">M&A Trajecten</div>

// ===== HANDLEIDING (achter login, alle rollen in één pagina) =====

function renderAdvHandleiding(){
  VIEW='handleiding';
  function sectie(titel, inhoud){
    return `<div class="card" style="margin-bottom:1.25rem"><div class="card-hdr"><div class="card-title">${titel}</div></div><div style="padding:1rem 0">${inhoud}</div></div>`;
  }
  function stap(nr, titel, tekst){
    return `<div style="display:flex;gap:12px;margin-bottom:1rem;align-items:flex-start">
      <div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--teal-bg);color:var(--teal);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">${nr}</div>
      <div><div style="font-weight:600;color:var(--head);font-size:13px;margin-bottom:.2rem">${titel}</div><div style="font-size:13px;color:var(--muted);line-height:1.65">${tekst}</div></div>
    </div>`;
  }
  function term(t, d){ return `<div style="margin-bottom:.7rem"><div style="font-weight:600;color:var(--head);font-size:13px">${t}</div><div style="font-size:13px;color:var(--muted);line-height:1.6">${d}</div></div>`; }
  function rekenBlok(t, d){ return `<div style="margin-bottom:1rem;padding-left:12px;border-left:3px solid var(--teal-bg)"><div style="font-weight:600;color:var(--head);font-size:13px;margin-bottom:.2rem">${t}</div><div style="font-size:13px;color:var(--muted);line-height:1.65">${d}</div></div>`; }
  render(`
    <div class="hdr">
      <div class="hdr-brand"><div class="hdr-dot"></div>${BRAND.platform} ${BRAND.suffix} &middot; Handleiding</div>
      <div class="hdr-right"><button class="btn-outline" onclick="renderDashboard()">&#8592; Terug naar dashboard</button></div>
    </div>
    <div class="main">
      <div style="font-family:Playfair Display,serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.25rem">Handleiding ${esc(BRAND.platform)}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:1.5rem">Uitgebreide handleiding voor alle rollen. Uw eigen rol (adviseur) staat als eerste.</div>

      ${sectie('🏢 Adviseur (accountbeheer — dit portaal)',
        stap(1,'Account activeren','U ontvangt een uitnodigingsmail met een activeringslink. Stel een wachtwoord in — u komt daarna in dit adviseursportaal.')
        + stap(2,'Een traject starten',`Klik op "+ Nieuw traject", vul de gegevens van de onderneming (en desgewenst de koper) in. Zijn e-mailadressen ingevuld, dan verstuurt het platform automatisch een uitnodigingsmail met code en instructies naar verkoper en/of koper — anders geeft u de codes zelf handmatig door. Bracht een bank, accountant of ander contact u bij deze opdracht? Vul dat in bij "Aangedragen door" (optioneel) — dit is uw eigen administratie voor de referral-afspraak met die aandrager, los van het platform.`)
        + stap(3,'Eigen huisstijl (optioneel)','Via "🎨 Huisstijl" stelt u een eigen platformnaam, accentkleur en logo in. Dit geldt voor alle trajecten die u vanaf dat moment aanmaakt. Kiest u een kleur die op een donkere achtergrond moeilijk leesbaar zou zijn, dan waarschuwt het scherm dit direct — en wordt de kleur voor uw cliënten automatisch iets aangepast voor leesbaarheid.')
        + stap(4,'Modules en limieten','Uw account heeft een trajectlimiet en een set modules (Contracten, AI-analyse, Q&amp;A, Meekijkers, Marketing, Export &amp; rapportage), zichtbaar als chips boven uw trajectenlijst. Een module met een slotje is niet actief — neem contact op met uw platformbeheerder.'+(G.isTester?'':' Via de knop "€ Kosten" bovenaan ziet u op elk moment uw eigen platformkosten (trajectfees, module-fees, matching-fees) — zo weet u vooraf wat bijvoorbeeld een matching-tarief kost vóórdat u de module gebruikt.'))
        + stap(5,'Voorwaarden','Bij eerste gebruik accepteert u de <a href="platformvoorwaarden.html">Gebruiksvoorwaarden</a>. Zie ook de <a href="privacy.html">Privacyverklaring</a>.')
        + stap(6,'Meekijkers','Bij elk traject kunt u onder "Meekijkers" een bank, accountant of andere aandrager beperkte, alleen-lezen inzage geven in (een deel van) dat traject. U bevestigt daarbij expliciet dat u toestemming heeft van uw opdrachtgever — zonder die bevestiging kan er geen toegangscode ontstaan. De meekijker moet zelf eerst een vertrouwelijkheidsverklaring accepteren voordat hij iets te zien krijgt, en verkoper/koper zien in hun eigen dashboard altijd wie er meekijkt. Toegang is altijd alleen-lezen en door u op elk moment intrekbaar.')
        + stap(7,'Dossier exporteren','Is de module "Export &amp; rapportage" actief, dan staat bij elk van uw trajecten een kaart "Export" met de knop "Dossier downloaden" — een compleet tekstbestand met de due-diligence-gegevens, Q&amp;A, gespreksverslagen, documentenlijst en toegangslog van dat traject. Uitsluitend voor uw eigen trajecten.')
      )}

      ${sectie('🧭 Begeleider (binnen een traject, op mna.html)',
        stap(1,'Inloggen','Klik op een traject in uw trajectenlijst, of log rechtstreeks in op mna.html met de tussenpersoonscode van dat traject. Bij de eerste keer moet u de verwerkersovereenkomst (VOK) accepteren.')
        + stap(2,'Documenten genereren','Is de module "Contracten" actief, dan kunt u vanuit het traject-dashboard NDA, LoI, BEM (bemiddelingsovereenkomst), Excl (exclusiviteitsovereenkomst), Dealvoorstel, Bieding, SPA en een Closing-checklist genereren en digitaal laten ondertekenen via Signhost. Bij LoI en Bieding is vóór verzending een verplicht veld "Intern goedgekeurd door" ingebouwd, vastgelegd in het logboek (bij een fusietraject twee namen — één per fusiepartij — omdat een fusie goedkeuring vanuit beide besturen vereist). De BEM-knop kiest zelf de juiste tekst op basis van het trajecttype (verkoop/aankoop met succesfee-staffel 5%/4%/3%/2%, min. €25.000; bij "Opvolging" een apart bedrijfsopvolgings-sjabloon).')
        + stap('2b','Documentdekking','Op het traject-dashboard ziet u per DD-fase welke vereiste documenten (bijv. jaarrekeningen, KvK-uittreksel) al zijn aangeleverd — automatisch bijgewerkt zodra een document met een herkenbare bestandsnaam wordt geüpload. Klap een fase open voor de lijst met ontbrekende documenten (verplicht/optioneel). Puur een hulpmiddel op bestandsnaam, geen inhoudelijke AI-beoordeling — een verkeerd benoemd bestand kan gemist worden.')
        + stap('2c','Teaser &amp; verkoopmemorandum (module Marketing)','Is de module "Marketing" actief, dan staan in het traject-dashboard (mna.html), gewoon tussen de andere documenten in de Documenten-flow: een <strong>teaser</strong> (kort, anoniem, geen bedrijfsnaam, vóór de NDA — geschikt om vroeg in het proces breed te verspreiden, vóór er een koper is; de verkoper kan deze ook zelf genereren) en een <strong>verkoopmemorandum</strong> (uitgebreid, mét bedrijfsnaam, ná de NDA). Beide worden automatisch gevuld met de al ingevulde DD-data, zijn bewerkbaar vóór verspreiding, en verzinnen nooit ontbrekende informatie. "Opslaan" bewaart de tekst bij het traject (geen bestand-download); met "Print / PDF" maakt de begeleider er een net opgemaakt document van om te versturen — geen groot CONCEPT-watermerk zoals bij de contracten, maar het verkoopmemorandum krijgt onder de kop wél een discrete regel "Conceptversie — controleer vóór verspreiding". Of het traject zichtbaar is op de live matching-pagina regelt u niet op mna.html, maar hier in uw eigen adviseursportaal — zie de kaart "Matching-platform" bij dit traject.')
        + stap('2d','Matching-platform','Zodra dit traject een teaser heeft, kunt u het bij de kaart "Matching-platform" (bij dit traject) zelf "beschikbaar voor matching" zetten — verschijnt dan anoniem op het losse matching-platform, gefilterd op sector/regio/omzetklasse tegen de daar geregistreerde koper-zoekprofielen (geen AI, puur filtering). Meldt een koper zich daar aan, dan gebeurt automatisch: hij krijgt zijn inlogcode gemaild, u ontvangt een melding met naam/e-mail plus het matching-tarief, en het traject verdwijnt van de matching-pagina. <strong>Dit is geen automatische vervolgstap</strong> in de rest van het traject: de koper ziet nog niets inhoudelijks — u stuurt zelf de NDA en geeft daarna zelf de DD-fases vrij, exact zoals bij elke andere koper.')
        + stap(3,'AI-analyse &amp; waardering','De deterministieke rekenkern (closing/earn-up/buy-and-build/vendor loan-aflossingsschema, optioneel aangevuld met intrinsieke waarde/liquidatiewaarde/goodwill-methode, een synergie-analyse met NPV, een downside/base/upside-scenarioanalyse en een DCF-gevoeligheidsmatrix WACC×groeivoet, met IRR/MoM) plus een onafhankelijke AI-"second opinion"-waardering op basis van sectorbenchmarks. Op het waarderingsscherm en in het Dealvoorstel staat daarnaast een <strong>Management- &amp; sleutelpersoonrisico</strong>-indicatie (laag/midden/hoog, of "onvoldoende ingevuld") afgeleid uit de DD-velden over tweede echelon, key-person-afhankelijkheid, veranderbereidheid en retentieafspraken — een kwalitatief aandachtspunt, geen correctie op de waardering.')
        + stap(4,'Wat elke waarderingsmethode in het Dealvoorstel precies berekent','Het Dealvoorstel toont altijd een <strong>opbrengst-brug</strong> ("Van ondernemingswaarde naar opbrengst bij closing"): headline-ondernemingswaarde minus netto schuld / debt-like items / werkkapitaalcorrectie / transactiekosten = equity value; minus escrow en een eventuele uitgestelde earn-out = cash bij closing; plus de verwachte vrijval = verwachte gerealiseerde waarde (optimistisch scenario). Als tabel én waterfall-grafiek. De aftrekposten zijn door de begeleider ingevoerde aannames — netto schuld voorgevuld uit de balansvelden, de rest handmatig; geen platformgok. Direct eronder staat de <strong>onderhandelruimte</strong> ("verdeling van de opbrengst naar zekerheid"): de waardepositie van de verkoper ingedeeld naar zekerheid × timing (zeker bij closing / escrow / voorwaardelijk — earn-out, de voorwaardelijke earn-up en een eventuele verkoperslening / behouden belang — dat laatste is geen betaling van de koper), als tabel én gestapelde balk. Bouwt op de opbrengst-brug plus de earn-up (herrekend naar dezelfde equity/cash-basis); zolang er een earn-up is, is de voorwaardelijke laag nooit 0. Laat zien waar in de onderhandeling ruimte zit (meer cash bij closing tegen een lagere prijs, kortere escrow, kleinere earn-out-tranche). Bij verkoop-/opvolgingstrajecten vult u ook een <strong>BATNA &amp; walk-away</strong> in (in overleg met de verkoper): een walk-awayprijs (minimale acceptabele opbrengst), het gekozen alternatief zonder deze deal, een optionele waarde daarvan en de tijdsdruk. Het voorstel toetst de opbrengst tegen die ondergrens → oordeel BOVEN / KRAP / ONDER; leeg gelaten → geen oordeel (geen verzonnen ondergrens). Dit blok is alleen voor verkoper + begeleider, niet voor de koper. Verder een <strong>LoI-checklist</strong> (15 kern-economics: koopsom-aanpassingsmechanisme, exclusiviteit, reps &amp; warranties-kader, W&amp;I, MAC, opschortende voorwaarden, non-concurrentie, retentie, overtollige liquiditeiten, kostenverdeling, geschillenregeling) met per punt "gedekt / deels / leg vast in LoI" — gedachte: onderhandel de LoI alsof het de SPA is. Aandachtspuntenlijst, geen juridisch advies. Voert u parallelle <strong>gekoppelde trajecten</strong> voor dezelfde verkoper (andere kopers)? Dan geeft <strong>Biedingen vergelijken</strong> een Deal Value Matrix: koopsom + betaalstructuur per traject uit het laatste Dealvoorstel, u vult per bod vier inschattingen aan (voorwaarden, financiering, doorlooptijd, fit), gewogen score (prijs 30 / zekerheid cash 25 / deal-zekerheid 20 / fit 15 / timing 10). De matrix ordent, hij kiest niet. Koperstrajecten blijven volledig gescheiden. Naast de hoofdwaardering (EBITDA-multiple, of een omzet-multiple bij sectoren zoals zorg — het scherm toont altijd welke grondslag geldt) kunnen deze methodes als kruiscontrole worden toegevoegd, nooit als vervanging: <strong>DCF</strong> (contante waarde van de vrije kasstromen vóór financieringseffecten, verdisconteerd tegen de WACC, plus een terminal value — "n.v.t." als WACC ≤ groeivoet, want dan is de formule ongeldig); <strong>Intrinsieke waarde</strong> (boekwaarde eigen vermogen, geen correctie voor stille reserves); <strong>Liquidatiewaarde</strong> (inbare debiteuren/OHW minus liquidatiekosten minus schulden); <strong>Goodwill via de overwinstmethode</strong> (overwinst = genormaliseerde nettowinst minus normrendement over eigen vermogen; goodwill = overwinst / kapitalisatievoet); <strong>Vendor loan</strong> (rente-/aflossingsschema, los van de bankfinanciering); <strong>Earn-out</strong> (ander mechanisme dan de earn-up bij closing: een deel van de koopsom wordt aangehouden en pas uitgekeerd in jaarlijkse tranches, gekoppeld aan een zelf ingestelde doelomzetgroei per jaar); <strong>Synergie-analyse</strong> (zelf ingeschatte kosten-/omzetsynergieën, verdisconteerd tot NPV); <strong>Scenarioanalyse</strong> (downside/base/upside op de groeivoet). Bij elk zelf in te vullen percentage geldt: het platform vult nooit een waarde in als het veld leeg blijft — geen verzonnen branchenorm, de uitkomst blijft dan gewoon weg. Is er al een Dealvoorstel verstuurd voor dit traject? Dan neemt de LoI-generatie koopsom, multiple en escrow daaruit automatisch over (zichtbaar aan de melding boven het gegenereerde LoI-document).')
        + stap('4b','Risicoraamwerk (SWOT/PESTEL/Porter)','Genereert op basis van de al ingevulde DD-data en eerdere AI-beoordelingen een SWOT-, PESTEL- en Porter\'s Five Forces-analyse. Puur interne analyse — nooit voor verkoper of koper zichtbaar, niet gekoppeld aan de Contracten-module. Bij te dunne DD-data benoemt het raamwerk dat expliciet in plaats van een aanname te verzinnen.')
        + stap(5,'Koper-fit strategie','Leg vast waarom de koper overnames zoekt; het systeem toetst de verkoper hier expliciet tegen — harde cijfers automatisch, vrije tekst alleen geciteerd door de AI, nooit zelf beoordeeld.')
        + stap(6,'Groepsstructuur, koper-toegang, Q&amp;A, wijzigingenlog','Entiteiten beheren bij een holdingstructuur, per DD-categorie bepalen wat de koper mag zien, en elke wijziging van de verkoper gelogd terugzien. Bij het Q&amp;A-register (op mna.html) kunt u per vraag een deadline zetten (onbeantwoord na die datum geeft een rode waarschuwing) en de vraag toewijzen aan een naam; na een antwoord blijft de vraag open voor een reactiedraad.')
        + stap(7,'Partners / eigenaren beheren','Terminologie past zich aan de sector aan (partners / maten-praktijkhouders / eigenaren-DGA / founders). Registreer ze bij naam en koppel ze aan hun entiteit(en), in plaats van per entiteit los leeftijd/veranderbereidheid in te vullen. De gevraagde omzet is bewust de omzet inclusief onderliggend team die bij vertrek van de partner risico loopt. De fase "Partners &amp; personeel" vraagt daarnaast naar het tweede echelon (managementlaag onder de eigenaar), de key-person-afhankelijkheid (% omzet/relaties aan één persoon) en — in fase 2 — aanblijf-/retentieafspraken voor management.')
        + stap(8,'Meekijkers toevoegen','Wilt u een bank, accountant of andere aandrager beperkte, alleen-lezen inzage geven in dit traject? Dat regelt u niet hier op mna.html, maar bij dit traject in uw eigen adviseursportaal (adv.html), onder "Meekijkers" — bent u zelf platformbeheerder, dan kan dit ook via marilyn. Bij het aanmaken bevestigt u expliciet dat er toestemming is van de opdrachtgever. De meekijker moet zelf eerst een vertrouwelijkheidsverklaring accepteren, en verkoper/koper zien in hun eigen dashboard altijd wie er meekijkt. Toegang is altijd alleen-lezen, beperkt tot één fase (of alles), en op elk moment intrekbaar.')
        + stap(9,'Traject afsluiten en databewaring','Sluit het traject af zodra de deal (of het contact) definitief is beëindigd — dit is niet vrijblijvend: veertien dagen ná afsluiting wordt <strong>alle</strong> trajectdata definitief verwijderd (documenten, ingevulde velden, gesprekken, Q&amp;A, waardering — alles), op een minimale archiefregel na (trajectnaam, datum, betrokken partijen). Bij het afsluiten ontvangt u direct een link naar één ZIP-download met het complete dossier — download deze binnen veertien dagen als u iets wilt bewaren, want daarna is het echt weg. Sluit u een traject niet zelf af, dan doet het platform dat automatisch na drie maanden zonder inhoudelijke activiteit (u ontvangt daarvoor eerst een waarschuwing met nog veertien dagen de tijd om te reageren) — zo blijft er nooit onnodig data staan.')
      )}

      ${sectie('👤 Verkoper',
        stap(1,'Inloggen','Met de persoonlijke verkopercode op mna.html.')
        + stap(2,'Eenmalig openingsscherm (alleen bij een nieuw traject)','Bij de allereerste keer inloggen op een nieuw traject vraagt het platform eerst adres, KvK-nummer en de naam van de tekenbevoegde, plus (optioneel) groepsstructuur en partners. Eenmalig; bestaande trajecten van vóór deze functie krijgen dit scherm niet te zien.')
        + stap(3,'7 informatiefases doorlopen','Financieel, Klanten &amp; commercieel, Partners &amp; personeel, Compliance &amp; kwaliteit, IT &amp; automatisering, Juridisch &amp; fiscaal, Strategisch &amp; markt. Boven elke fase staat een korte toelichting wat er gevraagd wordt en waarom. Fase-2-velden komen pas ná ondertekening van de LoI, waaronder een blok "Balans &amp; schuld" dat de financiële ratio\'s (ROE, ROA, solvabiliteit, current/quick ratio, DSCR) op het waarderingsscherm voedt — een ratio verschijnt alleen als de bijbehorende velden zijn ingevuld. De fase "Partners &amp; personeel" vraagt in fase 1 ook naar de managementlaag onder de eigenaar (tweede echelon) en de key-person-afhankelijkheid; retentieafspraken voor management volgen in fase 2.')
        + stap(4,'Documenten uploaden — als bewijsstuk, of laten uitlezen door AI','De verkoper vult de velden eerst zelf in; documenten zijn ter onderbouwing, AI-analyse is een aparte, bewuste keuze bij het uploaden. Het vinkje "Alleen als bewijsstuk toevoegen (geen AI-analyse)" aangevinkt &rarr; alleen opslaan, niets verandert aan ingevulde velden (label "📎 Bewijsstuk"). Niet aangevinkt (standaard) &rarr; AI leest het document en vult ontbrekende velden aan. Een zelf ingevuld veld wordt nooit automatisch overschreven; bij de belangrijkste financiële velden krijgt de verkoper bij een afwijking ook een keuzescherm. PDF, Word, Excel/CSV, tekst, en SBR/XBRL-jaarrekeningen (.xml/.xbrl, 100% deterministisch uitgelezen). Let op: bij kleine/middelgrote rechtspersonen bevat een SBR-bestand wettelijk geen apart omzetcijfer.')
        + stap(5,'Extra controle (optioneel)','Vinkje bij het uploaden: het document wordt dan twee keer onafhankelijk gelezen; bij een afwijking krijgt de verkoper een keuze in plaats van een gok.')
        + stap(6,'Herkomst en afwijkingen','Elk automatisch ingevuld veld toont van welk document het komt, met het letterlijke citaat. Geeft een ander document een andere waarde, dan verschijnt een keuzescherm.')
        + stap(7,'Groepsstructuur','Bij meerdere entiteiten koppelt de verkoper documenten aan de juiste werkmaatschappij; bij onzekerheid wordt niets automatisch verwerkt. Entiteiten die niet al bij het openingsscherm (stap 2) zijn ingevoerd, kunnen hier alsnog worden toegevoegd.')

        + term('DCF (discounted cash flow)','Waarderingsmethode: de waarde is de contante waarde van de verwachte toekomstige vrije kasstromen. Op dit platform alleen als kruiscontrole naast de multiple.')

      ${sectie('🧮 Hoe de berekeningen tot stand komen',

        + rekenBlok('Waardering — multiple × grondslag (hoofdmethode)','Grondslag × gekozen multiple = ondernemingswaarde. Grondslag = genormaliseerde EBITDA (maatschap/eenmanszaak: winst ná ondernemersloon, zonder VpB). Sommige sectoren (zorg) gebruiken een <strong>omzet-multiple</strong> (praktijkwaarde): dan wordt de hele dealvoorstel-rekenkern (glijdende schaal, cliff, gevoeligheid, ondernemingswaarde in de opbrengst-brug) op de omzet toegepast, niet op de EBITDA — het schuldafbouw-/DCF-model blijft EBITDA-based. De multiple beweegt mee via een glijdende schaal (cliff → basis, prognose → bovengrens, daartussen lineair). Kent een sector geen onderbouwde multiple-range → géén waardering getoond (melding), geen gegokte bandbreedte; vul in het Dealvoorstel dan handmatig een onderbouwde multiple in.')
        + rekenBlok('Waardetoerekening per belang en de earn-up','Het hoofdstuk "Waardetoerekening per belang en de earn-up" = ondernemingswaarde (bewezen basis) × belang%, vóór aftrek van schuld en kosten — een waardering, GEEN cash voor de verkoper. Earn-up = (prognose-EBITDA × bovengrens-multiple × belang%) − (bewezen EBITDA × basis-multiple × belang%): de extra toegerekende waarde bij volledige realisatie. In de onderhandelruimte wordt de earn-up herrekend naar de equity/cash-basis van de verkoper.')
        + rekenBlok('Opbrengst-brug','Ondernemingswaarde − netto schuld − debt-like items − werkkapitaalcorrectie − transactiekosten (aanname) = equity value (100%). × verkocht belang = tegenprestatie voor dat belang. − escrow − eventuele uitgestelde earn-out = cash bij closing. + verwachte vrijval van escrow/earn-out = "verwachte gerealiseerde waarde" (optimistisch scenario). Netto schuld voorgevuld uit de balansvelden; de rest vult de begeleider in. Dit is een andere schuldpost dan de nieuwe acquisitiefinanciering waarmee het schuldafbouwmodel start (× bewezen EBITDA) — die twee horen niet gelijk te zijn. Ligt de netto schuld bóven de ondernemingswaarde (equity value negatief), dan toont het voorstel een waarschuwing en zet de opbrengst voor de verkoper op €0, niet op een negatief bedrag.')
        + rekenBlok('Onderhandelruimte (ZOPA trade-space)','De waardepositie van de verkoper, ingedeeld naar zekerheid × timing: zeker bij closing / escrow / voorwaardelijk (earn-out + voorwaardelijke earn-up + verkoperslening) / behouden belang (geen betaling van de koper). Bouwt op de opbrengst-brug plus de earn-up (herrekend naar dezelfde basis); de som van de vier delen is exact "verkocht belang + earn-up (verkoper-basis) + behouden belang". Zolang er een earn-up bestaat, is de voorwaardelijke laag nooit 0.')
        + rekenBlok('BATNA & walk-away (alleen verkoperszijde)','Vergelijkt de zekere cash bij closing én de totale tegenprestatie (cash + escrow + uitgestelde earn-out) met de ingevoerde walk-awayprijs → BOVEN (zekere cash erboven) / KRAP (alleen de totale tegenprestatie erboven) / ONDER (ook die eronder). Een eventuele earn-up staat er ter info bij maar telt niet mee in het oordeel. Walk-away leeg → geen oordeel.')
        + rekenBlok('LoI-checklist','15 vaste kern-economics. Per punt: "gedekt" (dit Dealvoorstel legt het al vast), "deels" (bedrag vast, mechanisme niet, of DD-veld gevuld) of "leg vast in LoI" (SPA-materie). Geen juridisch advies.')
        + rekenBlok('Bod-vergelijker (Deal Value Matrix)','Euro-bedragen per bod = herrekening van de ingevoerde percentages. Cash + escrow + earn-out zijn percentages van de koopsom (verkocht belang) en horen ~100% te zijn — rode controleregel als dat afwijkt. Behouden belang is geen betaling van de koper: waarde niet-verkocht deel = koopsom ÷ verkocht belang% × behouden belang% (op de héle onderneming), telt niet mee in die check. Vijf scores 0-100: prijs (t.o.v. hoogste bod), zekerheid cash (cash/koopsom), deal-zekerheid (financieringszekerheid + aantal voorwaarden), timing (weken tot closing, 26 wk = 0), strategische fit (inschatting begeleider). Totaal = gewogen som met een vaste weging 30/25/20/10/15 (weeg de assen zelf tegen de prioriteiten van de verkoper — een andere weging kan een andere volgorde geven). Earn-out en behouden belang staan elk als eigen euro-regel — niet opgeteld tot één "upside"-getal (verschillende grondslagen). Ongeldig percentage behouden belang (100%+ of negatief) → regel toont "n.v.t." + rode controleregel. Koopsommen een factor >3 uiteen → waarschuwing (vermoedelijk ongelijke grootheden). De matrix ordent, hij kiest niet.')
        + rekenBlok('DCF — kruiscontrole','Contante waarde van een <strong>vereenvoudigde unlevered kasstroom</strong> (EBITDA − belasting − capex − werkkapitaalmutatie), geen volledige FCFF: standaard belasting over de EBITDA (conservatief, belastingschild op afschrijvingen ontbreekt); een afschrijvings-% in het Dealvoorstel laat de DCF de belasting over de EBIT berekenen. + terminal value volgens Gordon Growth (kasstroom laatste jaar × (1 + g) / (WACC − g)), verdisconteerd tegen de discontovoet (WACC). Tabel toont WACC en g apart + per jaar de oprentingsfactor (1+r)ᵗ (een echte disconteringsfactor is de inverse, &lt;1). Alleen plausibiliteitscheck; bij een kleine marge WACC−g weegt de terminal value zwaar. Discontovoet ≤ g → "n.v.t.".')
        + rekenBlok('Schuldafbouwmodel — earn-up-financiering','Het model start met de acquisitiefinanciering (× bewezen EBITDA) en lost af met de vrije kasstroom. Een earn-up in jaar 1 drukt standaard voor 100% op de bankschuld; dat aandeel is instelbaar in het Dealvoorstel (rest = eigen middelen). Bij negatieve bewezen EBITDA worden capex en werkkapitaalmutatie op 0 gezet (geen fictieve kasinstroom via een negatief percentage).')
        + rekenBlok('Management- & sleutelpersoonrisico','Kwalitatief laag/midden/hoog uit vijf DD-velden. Raakt nooit de multiple/waardering. Een leeg veld telt als "onbekend", niet als risicopunt. Te veel onbekend → oordeel vervalt.')
        + rekenBlok('Financiële ratio&rsquo;s','Solvabiliteit, ROE, ROA, current ratio, quick ratio (excl. voorraad/OHW), EBITDA-dekking schuldendienst (vereenvoudigd, geen volwaardige DSCR), netto schuld/EBITDA uit de balansvelden in fase 2 "Financieel". Elke ratio verschijnt alléén als de bijbehorende velden zijn ingevuld; onleesbare invoer (tekst i.p.v. getal) → geen ratio, geen 0%.')
      )}

      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:1rem">Deze handleiding wordt bijgehouden zodra het platform wijzigt.</div>
    </div>
  `);
}

// Security-fix 17 aug 2026 (fix 6): uitloggen wiste voorheen alleen lokale JS-state — de
// sessietoken bleef tot 8 uur geldig op de server, ook na uitloggen. Nu ook server-side intrekken.
async function doLogout(){
  var tok=G.token;
  G.token='';G.email='';
  try{ if(tok) await fetch(WORKER+'/gebruikers/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessie_token:tok})}); }catch(e){}
  renderLogin();
}

async function ververs(){
  try{
    var r=await post('/adviseur/trajecten',{});
    var d=await r.json();
    if(d.ok){G.trajecten=d.trajecten||[];G.limiet=d.traject_limiet||G.limiet||1;G.modules=d.modules||G.modules;G.isTester=!!d.is_tester;renderDashboard();}
  }catch(e){}
}

// Werkt door naar de mna.html-trajecten die deze adviseur aanmaakt — niet naar dit adv-portaal zelf.
// ===== KOSTEN (24 aug 2026, Marcel: "begeleider moet keuze kunnen maken obv kosten") =====
// Eigen fee-events (trajectfee, meekijker, matching e.d.) — via de eigen sessietoken, nooit
// andermans kosten zichtbaar (server-side hard gefilterd op gebruiker_id, zie /adviseur/kosten).
async function renderKostenModal(){
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:1.5rem';
  var mo=document.createElement('div');
  mo.setAttribute('role','dialog');mo.setAttribute('aria-modal','true');mo.setAttribute('aria-labelledby','kosten-modal-titel');
  mo.style.cssText='background:var(--panel);border-radius:10px;padding:2rem;max-width:560px;width:100%;max-height:85vh;overflow-y:auto';
  mo.innerHTML='<div id="kosten-modal-titel" style="font-family:Playfair Display,serif;font-size:1.15rem;color:var(--head);font-weight:600;margin-bottom:.25rem">&#128176; Kosten</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:1.25rem;line-height:1.6">Overzicht van alle aan uw account gekoppelde platformkosten — trajectfees, module-fees en matching-fees. Vragen over een bedrag? Neem contact op met '+esc(BRAND.kort)+'.</div>'
    +'<div id="kosten-inhoud" style="font-size:13px;color:var(--muted)">Laden...</div>'
    +'<div style="display:flex;justify-content:flex-end;margin-top:1.25rem"><button id="kosten-sluit" class="btn-outline">Sluiten</button></div>';
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  ge('kosten-sluit').onclick=function(){document.body.removeChild(ov);};

  var r=await fetch(WORKER+'/adviseur/kosten',{headers:{'x-gebruiker-token':G.token}}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  var inhoudEl=document.getElementById('kosten-inhoud');
  if(!inhoudEl)return; // modal intussen gesloten
  if(!r.ok){inhoudEl.innerHTML='<div class="err-msg">Kon kosten niet laden.</div>';return;}
  var feeLabels={basis:'Trajectfee (basis)',ai:'Trajectfee (met AI-extractie)',lead_inbreng:'Lead-inbreng',meekijker:'Meekijker toegevoegd',teaser:'Teaser gegenereerd',verkoopmemorandum:'Verkoopmemorandum gegenereerd',matching:'Koper aangemeld via matching'};
  var html='';
  if(r.tarieven && Object.keys(r.tarieven).length){
    var tarievenLabels={basis:'Trajectfee (basis, per nieuw traject)',ai:'Trajectfee (met AI-extractie, per nieuw traject)',lead_inbreng:'Lead-inbreng (per aangedragen traject)',meekijker:'Meekijker (per toegevoegde meekijker)',teaser:'Teaser (eerste keer)',verkoopmemorandum:'Verkoopmemorandum (eerste keer)',matching:'Matching (per aangemelde koper)'};
    var tarievenVolgorde=['basis','ai','lead_inbreng','meekijker','teaser','verkoopmemorandum','matching'];
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;font-size:12px;color:var(--sub)">'
      +'<div style="font-weight:600;margin-bottom:.4rem">Huidige tarieven</div>'
      +tarievenVolgorde.filter(function(k){return r.tarieven[k]!=null;}).map(function(k){
        return esc(tarievenLabels[k]||k)+': <strong>&euro;'+Number(r.tarieven[k]).toLocaleString('nl-NL')+'</strong>';
      }).join('<br>')
      +'</div>';
  }
  if(!r.events.length){
    html+='<div class="empty">Nog geen kosten geregistreerd.</div>';
  }else{
    html+='<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Type</th><th>Traject</th><th style="text-align:right">Bedrag</th></tr></thead><tbody>';
    r.events.forEach(function(e){
      html+='<tr><td style="font-size:12px">'+fmt(e.created_at)+'</td>'
        +'<td style="font-size:12px">'+esc(feeLabels[e.fee_type]||e.fee_type)+'</td>'
        +'<td style="font-size:12px">'+esc(e.kantoor_naam||e.traject_id||'—')+'</td>'
        +'<td style="text-align:right;font-size:12px;font-weight:600">&euro;'+Number(e.bedrag).toLocaleString('nl-NL')+'</td></tr>';
    });
    html+='</tbody></table></div>'
      +'<div style="display:flex;justify-content:flex-end;margin-top:.75rem;font-size:14px;font-weight:600;color:var(--head)">Totaal: &euro;'+Number(r.totaal).toLocaleString('nl-NL')+'</div>';
  }
  inhoudEl.innerHTML=html;
}

    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">Bedrijfsgegevens voor documenten (optioneel)</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:.75rem;line-height:1.5">Vult u dit in, dan noemen NDA/LoI/bemiddelingsovereenkomst e.d. uw eigen kantoor als begeleidende partij in plaats van ${esc(BRAND.platform)}. Laat leeg om de standaardtekst te gebruiken.</div>
    <div class="field" style="margin-bottom:1rem"><label>Vestigingsadres</label><input type="text" id="hs-adres" value="${esc(b.brand_adres||'')}" placeholder="Vestigingsadres" maxlength="120"></div>
    <div class="field" style="margin-bottom:1.25rem"><label>KvK-nummer</label><input type="text" id="hs-kvk" value="${esc(b.brand_kvk||'')}" placeholder="KvK-nummer" maxlength="8"></div>
    <div id="hs-err" class="err-msg"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="hs-ann" class="btn-outline">Annuleren</button>
      <button id="hs-ok" class="btn">Opslaan</button>
    </div>`;
  ov.appendChild(mo);document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
  ge('hs-ann').onclick=function(){document.body.removeChild(ov);};

  // Live waarschuwing: dezelfde contrastberekening als mna/06-schermen.js (contrastveiligeHuisstijlkleur)
  // — hier alleen om de adviseur meteen te laten zien dat zijn/haar keuze straks automatisch wordt
  // aangepast, niet om de kleur hier al te wijzigen (dat gebeurt pas bij mna.html zelf).
  function contrastTegenDonker(hex){
    if(!/^#[0-9a-f]{6}$/i.test(hex))return 99;
    function relLuminantie(h){
      var r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
      function lin(c){return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
      return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
    }
    var l1=relLuminantie(hex),l2=relLuminantie('#1b1a17');
    return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
  }
  function toonKleurWaarschuwingIndienNodig(){
    var w=ge('hs-kleur-waarschuwing');
    if(!w)return;
    w.style.display=(contrastTegenDonker(ge('hs-kleur').value)<4.5)?'block':'none';
  }
  ge('hs-kleur').addEventListener('input',toonKleurWaarschuwingIndienNodig);
  toonKleurWaarschuwingIndienNodig();

  var nieuwLogoBase64=null, nieuwLogoMime=null, logoVerwijderen=false;
  ge('hs-logo-file').onchange=function(){
    var f=this.files[0];
    if(!f)return;
    if(f.size>1500000){toast('Bestand te groot (max 1,5 MB).','err');this.value='';return;}
    var reader=new FileReader();
    reader.onload=function(e){
      var dataUrl=String(e.target.result);
      nieuwLogoBase64=dataUrl.split(',')[1]||'';
      nieuwLogoMime=f.type||'image/png';
      logoVerwijderen=false;
      ge('hs-logo-img').src=dataUrl;
      ge('hs-logo-preview').style.display='block';
    };
    reader.readAsDataURL(f);
  };
  var verwijderLink=document.getElementById('hs-logo-verwijder');
  if(verwijderLink)verwijderLink.onclick=function(e){
    e.preventDefault();
    logoVerwijderen=true;nieuwLogoBase64=null;nieuwLogoMime=null;
    ge('hs-logo-preview').style.display='none';
    ge('hs-logo-file').value='';
    toast('Logo wordt verwijderd bij opslaan.','ok');
  };

  ge('hs-ok').onclick=async function(){
    var btn=this;var err=ge('hs-err');err.style.display='none';
    var naam=ge('hs-naam').value.trim();
    var kleur=ge('hs-kleur').value.trim();
    var adres=ge('hs-adres').value.trim();
    var kvk=ge('hs-kvk').value.trim();
    if(kvk&&!/^\d{8}$/.test(kvk)){err.textContent='KvK-nummer moet 8 cijfers zijn.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Opslaan...';
    try{
      var payload={brand_naam:naam,brand_kleur:kleur,brand_adres:adres,brand_kvk:kvk};
      if(nieuwLogoBase64){payload.logo_base64=nieuwLogoBase64;payload.logo_mime=nieuwLogoMime;}
      if(logoVerwijderen)payload.verwijder_logo=true;
      var r=await fetch(WORKER+'/adviseur/branding',{method:'POST',headers:{'Content-Type':'application/json','x-gebruiker-token':G.token},body:JSON.stringify(payload)});
      var d=await r.json();
      if(!r.ok||!d.ok){err.textContent=d.error||'Opslaan mislukt.';err.style.display='block';btn.disabled=false;btn.textContent='Opslaan';return;}
      G.branding={brand_naam:naam,brand_kleur:kleur,brand_logo_url:d.logo_url||'',brand_adres:adres,brand_kvk:kvk};
      document.body.removeChild(ov);
      toast('Huisstijl opgeslagen.','ok');
    }catch(e){err.textContent='Verbindingsfout — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Opslaan';}
  };
}

// ===== DOCUMENTEN =====
async function laadDocumenten(id, tussenCode){
  var body=ge('docs-body');
  body.innerHTML='<div style="color:var(--muted);font-size:13px">Laden...</div>';
  try{
    var r=await fetch(WORKER+'/mna/document/lijst/'+encodeURIComponent(tussenCode));
    var docs=await r.json();
    if(!Array.isArray(docs))docs=[];
    if(!docs.length){body.innerHTML='<div class="empty" style="padding:1.5rem">Nog geen documenten geüpload.</div>';return;}
    // Audit-fix P3 (26 juli 2026): deze dynamisch opgebouwde tabel miste table-wrap — lange
    // bestandsnamen konden op mobiel horizontaal uitbreken buiten de kaart (zelfde patroon als de
    // al beschermde statische tabel elders in dit bestand, regel 341).
    var html='<div class="table-wrap"><table><thead><tr><th>Fase</th><th>Bestand</th><th>Datum</th><th></th></tr></thead><tbody>';
    docs.forEach(function(doc){
      var dt=doc.uploaded_at?new Date(doc.uploaded_at).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'}):'—';
      html+='<tr>'
        +'<td class="td-sec">'+esc(doc.fase_id||'—')+'</td>'
        +'<td class="td-name" style="font-size:13px">'+esc(doc.bestand_naam||'—')+(doc.methode==='bewijsstuk'?' <span style="font-size:9px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:8px;padding:1px 6px;margin-left:2px" title="Alleen als onderbouwing toegevoegd, niet automatisch geanalyseerd">📎 Bewijsstuk</span>':'')+'</td>'
        +'<td class="td-sec">'+dt+'</td>'
        +'<td style="text-align:right">'
        +(doc.bewaard?'<a href="'+WORKER+'/mna/document/download/'+doc.id+'?code='+encodeURIComponent(tussenCode)+'" target="_blank" class="btn-outline sm">↓ Download</a>':'')
        +'</td></tr>';
    });
    html+='</tbody></table></div>';
    body.innerHTML=html;
  }catch(e){body.innerHTML='<div style="color:var(--red);font-size:13px">Fout bij laden: '+esc(e.message)+'</div>';}
}

function uploadDocument(id, tussenCode){
  if(!tussenCode){toast('Geen tussenpersoonscode beschikbaar.','err');return;}
  var faseKeuze=['voorgesprek','financieel','juridisch','commercieel','operationeel','personeel','strategisch','compliance'];

  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="upload-modal-titel">
    <div class="modal-title" id="upload-modal-titel">Document uploaden</div>
    <div class="field"><label>Bestand</label><input type="file" id="up-file" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.xlsx,.xls" style="background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:8px;width:100%"></div>
    <div class="field"><label>Fase</label><select id="up-fase">
      ${faseKeuze.map(function(f){return'<option value="'+f+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</option>';}).join('')}
    </select></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;margin:.4rem 0" title="Slaat het document alleen op als bewijsstuk, zonder AI-analyse.">
      <input type="checkbox" id="up-bewijsstuk" style="margin:0"> Alleen als bewijsstuk toevoegen (geen AI-analyse)
    </label>
    <div id="up-err" class="err-msg"></div>
    <div class="modal-footer">
      <button class="btn-outline" id="up-ann">Annuleren</button>
      <button class="btn" id="up-ok">↑ Uploaden</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ge('up-ann').onclick=function(){document.body.removeChild(ov);};
  ge('up-ok').onclick=async function(){
    var file=ge('up-file').files[0];
    var fase=ge('up-fase').value;
    if(!file){ge('up-err').textContent='Kies een bestand.';ge('up-err').style.display='block';return;}
    var btn=this;btn.disabled=true;btn.textContent='Uploaden...';
    try{
      var fd=new FormData();
      fd.append('file',file);
      var alleenBewijsstuk=ge('up-bewijsstuk').checked;
      var r=await fetch(WORKER+'/mna/document/upload?code='+encodeURIComponent(tussenCode)+'&fase_id='+encodeURIComponent(fase)+'&bewaar=1'+(alleenBewijsstuk?'&alleen_bewijsstuk=true':''),{method:'POST',body:fd});
      var d=await r.json();
      if(d.ok||d.id){
        toast('Geüpload: '+file.name,'ok');
        document.body.removeChild(ov);
        laadDocumenten(id, tussenCode);
      } else {
        ge('up-err').textContent=d.error||'Upload mislukt.';ge('up-err').style.display='block';
        btn.disabled=false;btn.textContent='↑ Uploaden';
      }
    }catch(e){ge('up-err').textContent='Verbindingsfout: '+e.message;ge('up-err').style.display='block';btn.disabled=false;btn.textContent='↑ Uploaden';}
  };
}

async function laadGesprekken(id, tussenCode){
  var body=ge('gesp-body');

  try{
    var r=await fetch(WORKER+'/mna/gesprekken/'+id+'?code='+encodeURIComponent(tussenCode));
    if(!r.ok)throw new Error('HTTP '+r.status);
    var gesprekken=await r.json();
    if(!gesprekken.length){body.innerHTML='<div class="empty" style="padding:1.5rem">Nog geen gesprekken vastgelegd.</div>';return;}
    var typenL={intake:'Intake',voortgang:'Voortgang',onderhandeling:'Onderhandeling',presentatie:'Presentatie',overig:'Overig'};
    var html='';
    gesprekken.forEach(function(g){
      var dt=g.datum?new Date(g.datum).toLocaleDateString('nl-NL',{day:'2-digit',month:'long',year:'numeric'}):fmt(g.created_at);
      html+='<div class="gesprek-item">'
        +'<div class="gesprek-hdr" onclick="this.nextSibling.classList.toggle(\'open\')">'
        +'<span class="badge badge-actief" style="font-size:9px">'+esc(typenL[g.type]||g.type||'Gesprek')+'</span>'
        +'<span style="font-size:13px;font-weight:600;color:var(--head)">'+esc(dt)+'</span>'

        +'</div>'
        +'<div class="gesprek-body">'
        +(g.verslag?'<div style="white-space:pre-wrap">'+esc(g.verslag)+'</div>':'<div style="color:var(--muted);font-style:italic">Geen verslag.</div>')
        +'</div></div>';
    });
    body.innerHTML=html;
  }catch(e){body.innerHTML='<div style="color:var(--red);font-size:13px">Fout: '+esc(e.message)+'</div>';}
}

async function laadDocumentdekking(id, tussenCode){
  var el=ge('dekking-body');
  if(!el)return;
  try{
    var r=await fetch(WORKER+'/mna/documentdekking/'+encodeURIComponent(id),{headers:{'x-tussen-key':tussenCode||''}});
    var d=await r.json();
    if(!d.ok||!d.fases||!d.fases.length){el.innerHTML='<div style="color:var(--muted);font-size:13px;font-style:italic">Geen documentdekking gedefinieerd voor dit sectorprofiel.</div>';return;}
    var totAanwezig=0,totVereist=0;
    d.fases.forEach(function(f){totAanwezig+=f.aanwezig;totVereist+=f.totaal;});
    var html='<div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:.5rem">'+totAanwezig+' / '+totVereist+' vereiste documenten aanwezig</div>';
    d.fases.forEach(function(f){
      var kleur=f.aanwezig>=f.totaal?'var(--teal)':'var(--gold)';
      var ontbrekend=f.vereist.filter(function(v){return!(f.dekking[v.naam]&&f.dekking[v.naam].aanwezig);});
      html+='<details style="margin-bottom:4px"><summary style="cursor:pointer;font-size:12px;color:var(--mid)">'+esc(f.fase_title)+' — <span style="color:'+kleur+';font-weight:600">'+f.aanwezig+'/'+f.totaal+'</span></summary>';
      if(ontbrekend.length){
        html+='<ul style="margin:4px 0 8px 1.2rem;padding:0;font-size:11px;color:var(--muted)">'+ontbrekend.map(function(v){return'<li>'+esc(v.naam)+(v.verplicht?' <span style="color:var(--red)">(verplicht)</span>':' (optioneel)')+'</li>';}).join('')+'</ul>';
      } else {
        html+='<div style="margin:4px 0 8px 1.2rem;font-size:11px;color:var(--teal)">Alles aanwezig.</div>';
      }
      html+='</details>';
    });
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div style="color:var(--red);font-size:13px">Fout bij laden.</div>';}
}

async function exportDossierAdv(id, btn){
  var errEl=ge('adv-export-err');
  if(errEl)errEl.textContent='';
  var origTekst=btn.textContent;
  btn.disabled=true;btn.textContent='Bezig...';
  try{
    var r=await fetch(WORKER+'/adviseur/export/'+encodeURIComponent(id),{headers:{'x-gebruiker-token':G.token}});
    if(!r.ok){
      var d=await r.json().catch(function(){return{};});
      throw new Error(d.error||'Download mislukt.');
    }
    var cd=r.headers.get('Content-Disposition')||'';
    var naamMatch=cd.match(/filename="([^"]+)"/);
    var blob=await r.blob();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=naamMatch?naamMatch[1]:('dossier-'+id+'.txt');
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){
    if(errEl)errEl.textContent=e.message||'Download mislukt.';
  }
  btn.disabled=false;btn.textContent=origTekst;
}

function initMatchingAdv(id, tussenCode, t){
  var el=ge('matching-adv-body');
  if(!el)return; // module niet actief — kaart toont dan alleen de vergrendel-tekst
  if(!t.teaser_tekst){
    el.innerHTML='<div style="font-size:12px;color:var(--muted);line-height:1.6">Genereer eerst een teaser bij dit traject (mna.html, sectie "Documenten") voordat u het beschikbaar kunt maken voor matching.</div>';
    return;
  }
  var aan=!!t.beschikbaar_voor_matching;
  el.innerHTML='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--sub)"><input type="checkbox" id="matching-adv-chk" '+(aan?'checked':'')+'> Zichtbaar op de live <a href="matching-platform.html" target="_blank" style="color:var(--teal)" onclick="event.stopPropagation()">matching-pagina</a></label><div style="font-size:11px;color:var(--muted);margin-top:6px">Verdwijnt automatisch zodra er een koper is ingevuld — geen aparte actie nodig.</div>';
  ge('matching-adv-chk').addEventListener('change', async function(e){
    var nieuw=e.target.checked;
    e.target.disabled=true;
    try{
      var r=await fetch(WORKER+'/mna/matching/beschikbaar',{method:'POST',headers:{'Content-Type':'application/json','x-tussen-key':tussenCode},body:JSON.stringify({code:id,beschikbaar:nieuw})});
      var d=await r.json();
      if(d.ok){t.beschikbaar_voor_matching=nieuw?1:0;toast(nieuw?'Zichtbaar gemaakt op matching-pagina.':'Verborgen van matching-pagina.','ok');}
      else{toast(d.error||'Fout bij opslaan.','err');e.target.checked=!nieuw;}
    }catch(err){toast('Verbindingsfout.','err');e.target.checked=!nieuw;}
    e.target.disabled=false;
  });
}

// ===== MEEKIJKERS (adviseur beheert zelf, via eigen tussenpersoonscode) =====
function initMeekijkersAdv(id, tussenCode, sector){
  if(!(G.modules&&G.modules.meekijker))return; // module niet actief — kaart toont dan alleen de vergrendel-tekst, geen formulier om aan te binden
  // Eén fetch i.p.v. twee losse (was een race: laadLijst() kon eerder terug zijn dan
  // faseLabels, waardoor de Scope-kolom bij de eerste render de ruwe fase-id toonde).
  var faseLabels={};
  var sectorprofielenKlaar=fetch(WORKER+'/mna/sectorprofielen').then(function(r){return r.json();}).then(function(d){
    var profiel=d.profielen&&d.profielen[sector];
    var sel=ge('mk-adv-scope');
    (profiel&&profiel.fases||[]).forEach(function(f){
      faseLabels[f.id]=f.title;
      if(sel){var opt=document.createElement('option');opt.value=f.id;opt.textContent=(f.num?f.num+'. ':'')+f.title;sel.appendChild(opt);}
    });
  }).catch(function(){});

  function laadLijst(){
    var el=ge('meekijkers-body');if(!el)return;
    fetch(WORKER+'/mna/admin/viewer/lijst?traject_id='+encodeURIComponent(id),{headers:{'x-tussen-key':tussenCode}})
      .then(function(r){return r.json();}).then(function(d){
        var viewers=d.viewers||[];
        if(!viewers.length){el.innerHTML='<div style="color:var(--muted);font-style:italic">Nog geen meekijkers voor dit traject.</div>';return;}
        var html='<table style="width:100%;border-collapse:collapse"><thead><tr style="font-size:10px;text-transform:uppercase;color:var(--muted);text-align:left"><th style="padding-bottom:6px">Naam</th><th>Type</th><th>Scope</th><th>Code</th><th>Status</th><th>Laatst bekeken</th><th></th></tr></thead><tbody>';
        viewers.forEach(function(v){
          var ingetrokken=!!v.ingetrokken_op;
          var verlopen=v.expires_at&&Date.now()>v.expires_at;
          var status=ingetrokken?'Ingetrokken':(verlopen?'Verlopen':'Actief');
          var statusKleur=ingetrokken||verlopen?'#c0392b':'#1a7a5e';
          html+='<tr style="border-top:1px solid var(--border)"><td style="padding:6px 0">'+esc(v.viewer_naam||'—')+'</td><td>'+esc(v.viewer_type||'—')+'</td>'
            +'<td>'+(v.scope_fase==='alle'?'Alle fases':esc(faseLabels[v.scope_fase]||v.scope_fase))+'</td>'
            +'<td><span class="code-val" style="font-size:11px">'+esc(v.viewer_code)+'</span></td>'
            +'<td style="color:'+statusKleur+'">'+status+'</td>'
            +'<td style="font-size:11px;color:var(--muted)">'+(v.laatst_bekeken?fmt(v.laatst_bekeken):'<span style="font-style:italic">Nog niet bekeken</span>')+'</td>'
            +'<td>'+(ingetrokken?'':'<button class="btn-outline" style="font-size:11px;padding:2px 8px;color:#c0392b;border-color:#c0392b" onclick="intrekMeekijkerAdv(\''+esc(v.id)+'\',\''+esc(id)+'\',\''+esc(tussenCode)+'\')">Intrekken</button>')+'</td></tr>';
        });
        html+='</tbody></table>';
        el.innerHTML=html;
      }).catch(function(){el.innerHTML='<div style="color:#c0392b">Kon meekijkers niet laden.</div>';});
  }
  sectorprofielenKlaar.then(laadLijst);
  window._mkAdvLaadLijst=laadLijst;

  ge('mk-adv-toevoegen').onclick=function(){
    var naam=ge('mk-adv-naam').value.trim();
    var type=ge('mk-adv-type').value;
    var scope=ge('mk-adv-scope').value;
    var verloopt=ge('mk-adv-verloopt').value.trim();
    var toestemming=ge('mk-adv-toestemming').checked;
    var err=ge('mk-adv-err');err.style.display='none';
    if(!naam){err.style.display='block';err.textContent='Naam meekijker is verplicht.';return;}
    if(!toestemming){err.style.display='block';err.textContent='Bevestig eerst dat u toestemming heeft van uw opdrachtgever.';return;}
    var btn=this;btn.disabled=true;btn.textContent='Bezig...';
    var body={traject_id:id,viewer_naam:naam,viewer_type:type,scope_fase:scope,toestemming_bevestigd:true};
    if(verloopt)body.verloopt_dagen=Number(verloopt);
    fetch(WORKER+'/mna/admin/viewer/aanmaken',{method:'POST',headers:{'Content-Type':'application/json','x-tussen-key':tussenCode},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){
          ge('mk-adv-naam').value='';ge('mk-adv-verloopt').value='';ge('mk-adv-toestemming').checked=false;
          toast('Meekijker-code aangemaakt: '+d.viewer_code,'ok');
          laadLijst();
        }else{err.style.display='block';err.textContent='Fout: '+(d.error||'onbekend');}
        btn.disabled=false;btn.textContent='+ Meekijker aanmaken';
      }).catch(function(){err.style.display='block';err.textContent='Verbindingsfout.';btn.disabled=false;btn.textContent='+ Meekijker aanmaken';});
  };
}

      <div class="field"><label>Adres</label><input type="text" id="bw-adres" value="${esc(t.verkoper_adres||'')}"></div>
    </div>
    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:1rem 0 .5rem">Koper</div>
    <div class="field"><label>Naam koper</label><input type="text" id="bw-koper-naam" value="${esc(t.koper_naam||'')}"></div>
    <div class="row2">
      <div class="field"><label>Contactpersoon koper</label><input type="text" id="bw-koper-contact" value="${esc(t.koper_contact||'')}"></div>
      <div class="field"><label>E-mail koper</label><input type="email" id="bw-koper-email" value="${esc(t.koper_email||'')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>KvK-nummer koper</label><input type="text" id="bw-koper-kvk" value="${esc(t.koper_kvk||'')}"></div>
      <div class="field"><label>Adres koper</label><input type="text" id="bw-koper-adres" value="${esc(t.koper_adres||'')}"></div>
    </div>
    <div class="field"><label>Rechtsvorm koper</label><select id="bw-koper-rv">
      <option value="">— Kies rechtsvorm —</option>
      <option value="B.V."${t.koper_rechtsvorm==='B.V.'?' selected':''}>B.V.</option>
      <option value="N.V."${t.koper_rechtsvorm==='N.V.'?' selected':''}>N.V.</option>
      <option value="Eenmanszaak"${t.koper_rechtsvorm==='Eenmanszaak'?' selected':''}>Eenmanszaak</option>
      <option value="V.O.F."${t.koper_rechtsvorm==='V.O.F.'?' selected':''}>V.O.F.</option>
      <option value="Holding B.V."${t.koper_rechtsvorm==='Holding B.V.'?' selected':''}>Holding B.V.</option>
    </select></div>
    <div id="bw-err" class="err-msg"></div>
    <div class="modal-footer">
      <button class="btn-outline" id="bw-ann">Annuleren</button>
      <button class="btn" id="bw-ok">&#10003; Opslaan</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ge('bw-ann').onclick=function(){document.body.removeChild(ov);};
  ge('bw-ok').onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent='Opslaan...';
    var err=ge('bw-err');err.style.display='none';
    var payload={
      kantoor_naam:ge('bw-k').value.trim(),
      contact_naam:ge('bw-c').value.trim(),
      contact_email:ge('bw-e').value.trim(),
      verkoper_kvk:ge('bw-kvk').value.trim(),
      verkoper_adres:ge('bw-adres').value.trim(),
      koper_naam:ge('bw-koper-naam').value.trim(),
      koper_contact:ge('bw-koper-contact').value.trim(),
      koper_email:ge('bw-koper-email').value.trim(),
      koper_kvk:ge('bw-koper-kvk').value.trim(),
      koper_adres:ge('bw-koper-adres').value.trim(),
      koper_rechtsvorm:ge('bw-koper-rv').value
    };
    try{
      var r=await fetch(WORKER+'/adviseur/traject/update/'+id,{method:'POST',headers:{'Content-Type':'application/json','x-gebruiker-token':G.token},body:JSON.stringify(payload)});
      var d=await r.json();
      if(!d.ok){err.textContent=d.error||'Fout bij opslaan.';err.style.display='block';btn.disabled=false;btn.textContent='Opslaan';return;}
      Object.assign(t,{kantoor_naam:payload.kantoor_naam,contact_naam:payload.contact_naam,contact_email:payload.contact_email,verkoper_kvk:payload.verkoper_kvk,verkoper_adres:payload.verkoper_adres,koper_naam:payload.koper_naam,koper_contact:payload.koper_contact,koper_email:payload.koper_email,koper_kvk:payload.koper_kvk,koper_adres:payload.koper_adres,koper_rechtsvorm:payload.koper_rechtsvorm});
      document.body.removeChild(ov);
      toast('Gegevens opgeslagen.','ok');
      renderDetail(t);
    }catch(e){err.textContent='Verbindingsfout — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Opslaan';}
  };
}

renderLogin();
</script>
</body>
</html>
