<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantoorInzicht — Adviseur</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#f7f5f2;
  --bg:#faf9f7;
  --panel:#ffffff;
  --border:#e4e0db;
  --border2:#d0cbc4;
  --head:#1a1815;
  --sub:#2a2825;
  --mid:#5a5450;
  --muted:#8a8480;
  --teal:#1a7a5e;
  --teal-light:#edf7f3;
  --teal-border:#b8ddd2;
  --teal-dark:#145f48;
  --gold:#c9a84c;
  --gold-bg:#fdf8ee;
  --gold-border:#e8d99a;
  --red:#c0392b;
  --red-light:#fdf2f0;
  --r:5px;
  --r2:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);min-height:100vh;font-size:14px;line-height:1.5}
#app{min-height:100vh}

/* LOGIN */
.login-outer{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--void)}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2.25rem;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.login-brand{display:flex;align-items:center;gap:8px;margin-bottom:2rem}
.login-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0}
.login-brand-name{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.login-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--head);font-weight:600;margin-bottom:.35rem;line-height:1.2}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.75rem;line-height:1.6}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,94,.08)}
.field textarea{resize:vertical;min-height:72px}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--teal-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;color:var(--mid);border:1.5px solid var(--border2);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;padding:8px 16px;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-outline:hover{border-color:var(--mid);color:var(--sub);background:var(--bg)}
.err-msg{color:var(--red);font-size:12px;background:var(--red-light);border:1px solid #f5c6c0;border-radius:var(--r);padding:8px 10px;margin-bottom:.75rem;display:none}
.ok-msg{color:var(--teal);font-size:12px;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:var(--r);padding:8px 10px;margin-bottom:.75rem;display:none}
.sec-notice{margin-top:1.25rem;padding:.75rem 1rem;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:var(--r);font-size:11px;color:var(--muted);line-height:1.7}
.sec-notice strong{color:var(--sub)}
.link-subtle{font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s}
.link-subtle:hover{color:var(--teal)}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:56px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.hdr-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:.75rem}
.hdr-user{font-size:12px;color:var(--muted)}
.hdr-name{font-weight:600;color:var(--sub)}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:2rem}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:2rem}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.stat-n{font-family:'IBM Plex Mono',monospace;font-size:1.75rem;font-weight:500;color:var(--teal);line-height:1;margin-bottom:.2rem}
.stat-l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* TABLE CARD */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;border-bottom:1px solid var(--border);background:var(--bg)}
.card-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--sub);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f5}
.td-name{font-weight:600;color:var(--head)}
.td-sec{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.badge-actief{background:var(--teal-light);color:var(--teal);border:1px solid var(--teal-border)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:13px}
.empty-icon{font-size:1.75rem;margin-bottom:.75rem;opacity:.4}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(26,24,21,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--head);font-weight:600;margin-bottom:1.5rem}
.modal-section{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:1.25rem 0 .75rem;padding-top:1rem;border-top:1px solid var(--border)}
.modal-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
.code-box{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px}
.code-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);font-weight:500;letter-spacing:.08em}
.code-val-gold{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);font-weight:500;letter-spacing:.08em}
.copy-btn{font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:3px;padding:2px 7px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.copy-btn:hover{border-color:var(--teal);color:var(--teal)}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;font-size:12px;color:var(--muted);line-height:1.6}
.row2{display:flex;gap:12px}
.row2 .field{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
var WORKER='https://kantoorinzicht.marcel-bisschops.workers.dev';
var G={email:'',ww:'',naam:'',bedrijf:'',trajecten:[]};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function ge(id){return document.getElementById(id);}
function render(h){ge('app').innerHTML=h;}

function post(url,body){
  var params=new URLSearchParams();
  params.append('data',JSON.stringify(body));
  return fetch(WORKER+url,{method:'POST',body:params});
}

function renderLogin(){
  render(`<div class="login-outer"><div class="login-card">
    <div class="login-brand"><div class="login-dot"></div><span class="login-brand-name">KantoorInzicht M&A</span></div>
    <div class="login-title">Adviseur portaal</div>
    <div class="login-sub">Log in met uw e-mailadres en wachtwoord.</div>
    <div class="field"><label>E-mailadres</label><input type="email" id="l-e" placeholder="u@kantoor.nl" autofocus></div>
    <div class="field"><label>Wachtwoord</label><input type="password" id="l-w" placeholder="••••••••"></div>
    <div id="l-err" class="err-msg"></div>
    <button class="btn" id="l-btn" style="width:100%;margin-bottom:1rem">Inloggen</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <span></span>
      <a href="#" id="l-forgot" class="link-subtle">Wachtwoord vergeten?</a>
    </div>
    <div class="sec-notice">&#128274; <strong>Beveiliging & privacy</strong><br>
    Verbinding versleuteld (HTTPS). Gegevens opgeslagen in Cloudflare EU-datacenters (Frankfurt). Geen gegevensverkoop aan derden.
    <a href="privacy.html" style="color:var(--teal)">Privacyverklaring</a></div>
  </div></div>`);
  ge('l-btn').onclick=doLogin;
  ge('l-w').onkeydown=function(e){if(e.key==='Enter')doLogin();};
  ge('l-e').onkeydown=function(e){if(e.key==='Enter')ge('l-w').focus();};
  ge('l-forgot').onclick=function(e){e.preventDefault();renderForgot();};
}

function renderForgot(){
  render(`<div class="login-outer"><div class="login-card">
    <div class="login-brand"><div class="login-dot"></div><span class="login-brand-name">KantoorInzicht M&A</span></div>
    <div class="login-title">Wachtwoord vergeten</div>
    <div class="login-sub">Vul uw e-mailadres in. Als het bekend is, ontvangt u een resetlink.</div>
    <div class="field"><label>E-mailadres</label><input type="email" id="f-e" placeholder="u@kantoor.nl" autofocus></div>
    <div id="f-msg" class="ok-msg"></div>
    <div id="f-err" class="err-msg"></div>
    <button class="btn" id="f-btn" style="width:100%;margin-bottom:1rem">Verstuur resetlink</button>
    <div style="text-align:center"><a href="#" id="f-back" class="link-subtle">← Terug naar inloggen</a></div>
  </div></div>`);
  ge('f-btn').onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent='Versturen...';
    var email=ge('f-e').value.trim();
    ge('f-err').style.display='none';
    if(!email){ge('f-err').textContent='Vul een e-mailadres in.';ge('f-err').style.display='block';btn.disabled=false;btn.textContent='Verstuur resetlink';return;}
    try{
      var r=await fetch(WORKER+'/gebruikers/ww-vergeten',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:email})});
      var d=await r.json();
      ge('f-msg').textContent=d.msg||'Controleer uw e-mail.';ge('f-msg').style.display='block';
      btn.textContent='Verstuurd ✓';
    }catch(e){ge('f-err').textContent='Fout: '+e.message;ge('f-err').style.display='block';btn.disabled=false;btn.textContent='Verstuur resetlink';}
  };
  ge('f-back').onclick=function(e){e.preventDefault();renderLogin();};
  ge('f-e').onkeydown=function(e){if(e.key==='Enter')ge('f-btn').click();};
}

async function doLogin(){
  var btn=ge('l-btn');btn.disabled=true;btn.textContent='Inloggen...';
  var err=ge('l-err');err.style.display='none';
  var email=ge('l-e').value.trim();
  var ww=ge('l-w').value;
  if(!email||!ww){err.textContent='Vul e-mail en wachtwoord in.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
  try{
    var r=await post('/adviseur/trajecten',{email:email,wachtwoord:ww});
    var d=await r.json();
    if(!r.ok||!d.ok){err.textContent=d.error||'Inloggegevens onjuist.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';return;}
    G.email=email;G.ww=ww;G.naam=d.naam;G.bedrijf=d.bedrijf;G.trajecten=d.trajecten||[];
    renderDashboard();
  }catch(e){err.textContent='Verbindingsfout — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Inloggen';}
}

function renderDashboard(){
  var actief=G.trajecten.filter(function(t){return t.status==='actief';}).length;
  var sl={accountancy:'Accountancy',mkb:'MKB',zorg:'Zorg',itsoftware:'IT/Software'};
  var rows='';
  if(!G.trajecten.length){
    rows='<tr><td colspan="6"><div class="empty"><div class="empty-icon">📁</div>Nog geen trajecten.<br>Klik op "Nieuw traject" om te beginnen.</div></td></tr>';
  } else {
    G.trajecten.forEach(function(t){
      rows+='<tr>'
        +'<td class="td-name">'+esc(t.kantoor_naam||'—')+'</td>'
        +'<td class="td-sec">'+esc(t.traject_type||'—')+'</td>'
        +'<td class="td-sec">'+esc(sl[t.sector]||'—')+'</td>'
        +'<td><span class="badge badge-actief">'+esc(t.status||'actief')+'</span></td>'
        +'<td class="td-sec">'+fmt(t.created_at)+'</td>'
        +'<td style="text-align:right"><button class="btn-outline" onclick="bekijkCodes(\''+esc(t.id)+'\',\''+esc(t.koper_code||'')+'\',\''+esc(t.tussen_code||'')+'\',\''+esc(t.kantoor_naam||'')+'\')">Codes</button></td>'
        +'</tr>';
    });
  }

  render(`
    <div class="hdr">
      <div class="hdr-brand"><div class="hdr-dot"></div>KantoorInzicht M&A</div>
      <div class="hdr-right">
        <span class="hdr-user">Ingelogd als <span class="hdr-name">${esc(G.naam)}</span>${G.bedrijf?' &middot; '+esc(G.bedrijf):''}</span>
        <button class="btn-outline" onclick="renderLogin()">Uitloggen</button>
      </div>
    </div>
    <div class="main">
      <div class="stats">
        <div class="stat"><div class="stat-n">${G.trajecten.length}</div><div class="stat-l">Trajecten</div></div>
        <div class="stat"><div class="stat-n">${actief}</div><div class="stat-l">Actief</div></div>
      </div>
      <div class="card">
        <div class="card-hdr">
          <div class="card-title">M&A Trajecten</div>
          <div style="display:flex;gap:8px">
            <button class="btn-outline" onclick="ververs()">↻ Verversen</button>
            <button class="btn" onclick="nieuwTraject()">+ Nieuw traject</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Onderneming</th><th>Type</th><th>Sector</th><th>Status</th><th>Aangemaakt</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `);
}

async function ververs(){
  try{
    var r=await post('/adviseur/trajecten',{email:G.email,wachtwoord:G.ww});
    var d=await r.json();
    if(d.ok){G.trajecten=d.trajecten||[];renderDashboard();}
  }catch(e){}
}

function bekijkCodes(id,koperCode,tussenCode,naam){
  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <div class="modal-title">${esc(naam)}</div>
    <div class="modal-section">Toegangscodes</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:1.5rem">
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Verkoperscode</div>
        <div class="code-box">
          <span class="code-val">${esc(id)}</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${esc(id)}');this.textContent='✓'">Kopieer</button>
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Koperscode</div>
        <div class="code-box">
          <span class="code-val-gold">${esc(koperCode||'—')}</span>
          ${koperCode?'<button class="copy-btn" onclick="navigator.clipboard.writeText(\''+esc(koperCode)+'\');this.textContent=\'✓\'">Kopieer</button>':''}
        </div>
      </div>
      ${tussenCode?`<div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Tussenpersoonscode</div>
        <div class="code-box">
          <span class="code-val" style="color:var(--mid)">${esc(tussenCode)}</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${esc(tussenCode)}');this.textContent='✓'">Kopieer</button>
        </div>
      </div>`:''}
    </div>
    <div class="info-box">Verkoper en koper loggen in via <strong>koersvoormorgen.nl/mna.html</strong></div>
    <div style="display:flex;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn-outline" id="mo-sluit">Sluiten</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)document.body.removeChild(ov);};
  ge('mo-sluit').onclick=function(){document.body.removeChild(ov);};
}

function nieuwTraject(){
  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <div class="modal-title">Nieuw traject aanmaken</div>
    <div class="row2">
      <div class="field"><label>Type *</label><select id="n-type">
        <option value="Verkoop">Verkoop</option><option value="Fusie">Fusie</option>
        <option value="Opvolging">Opvolging</option><option value="PE-traject">PE-traject</option>
        <option value="Overname">Overname</option>
      </select></div>
      <div class="field"><label>Sector *</label><select id="n-sector">
        <option value="accountancy">Accountancy</option><option value="mkb">MKB</option>
        <option value="zorg">Zorg</option><option value="itsoftware">IT & Software</option>
      </select></div>
    </div>
    <div class="field"><label>Naam onderneming *</label><input type="text" id="n-naam" placeholder="Naam van de onderneming"></div>
    <div class="row2">
      <div class="field"><label>Contactpersoon *</label><input type="text" id="n-contact" placeholder="Naam"></div>
      <div class="field"><label>E-mail contactpersoon *</label><input type="email" id="n-email" placeholder="E-mailadres"></div>
    </div>
    <div class="field"><label>Adres</label><input type="text" id="n-adres" placeholder="Straat, postcode, plaats"></div>
    <div class="modal-section">Kopende partij (optioneel)</div>
    <div class="row2">
      <div class="field"><label>Naam koper</label><input type="text" id="n-koper-naam" placeholder="Naam"></div>
      <div class="field"><label>E-mail koper</label><input type="email" id="n-koper-email" placeholder="E-mailadres"></div>
    </div>
    <div id="n-err" class="err-msg"></div>
    <div id="n-ok" class="ok-msg"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
      <button class="btn-outline" id="n-ann">Annuleren</button>
      <button class="btn" id="n-maak">Aanmaken</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)document.body.removeChild(ov);};
  ge('n-ann').onclick=function(){document.body.removeChild(ov);};
  ge('n-maak').onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent='Aanmaken...';
    var err=ge('n-err');err.style.display='none';
    var naam=ge('n-naam').value.trim();
    var contact=ge('n-contact').value.trim();
    var email=ge('n-email').value.trim();
    if(!naam||!contact||!email){err.textContent='Naam onderneming, contactpersoon en e-mail zijn verplicht.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';return;}
    try{
      var r=await post('/adviseur/create',{
        email:G.email,wachtwoord:G.ww,
        traject:{
          kantoor_naam:naam,contact_naam:contact,contact_email:email,
          traject_type:ge('n-type').value,
          sector:ge('n-sector').value,
          verkoper_adres:ge('n-adres').value.trim(),
          koper_naam:ge('n-koper-naam').value.trim(),
          koper_email:ge('n-koper-email').value.trim()
        }
      });
      var d=await r.json();
      if(!d.ok){err.textContent=d.error||'Fout.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';return;}
      ge('n-ok').innerHTML='<strong>✓ Aangemaakt</strong> &nbsp;Verkoperscode: <strong>'+esc(d.code)+'</strong> &nbsp;Koperscode: <strong>'+esc(d.koper_code)+'</strong><br><span style="font-size:11px">Inloggen via koersvoormorgen.nl/mna.html</span>';
      ge('n-ok').style.display='block';
      ge('n-ann').textContent='Sluiten';
      btn.textContent='Aangemaakt ✓';
      G.trajecten.unshift({id:d.code,kantoor_naam:naam,traject_type:ge('n-type').value,sector:ge('n-sector').value,status:'actief',koper_code:d.koper_code,tussen_code:d.tussen_code,created_at:Date.now()});
    }catch(e){err.textContent=e.message+' — probeer opnieuw.';err.style.display='block';btn.disabled=false;btn.textContent='Aanmaken';}
  };
  ge('n-naam').focus();
}

renderLogin();
</script>
