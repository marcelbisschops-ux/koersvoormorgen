name: Statische checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Audit-fix P2/P3 (25 juli 2026): draaide voorheen tegen productie (WORKER_URL niet gezet,
    # tests/lib.mjs valt dan terug op de productie-worker) — nu expliciet tegen staging, zodat CI
    # geen productieverkeer/-schrijfacties meer genereert bij elke push.
    #
    # STAGING_ADMIN_KEY staat hier op job-niveau (i.p.v. alleen bij de laatste stap) omdat een
    # `if:`-conditie op een stap alleen job-/workflow-niveau env-vars ziet, niet een env-var die op
    # diezelfde stap zelf wordt gezet — zie de P1-fix hieronder bij de laatste stap.
    env:
      WORKER_URL: https://kantoorinzicht-staging.marcel-bisschops.workers.dev
      STAGING_ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check mna-modules
        run: |
          for f in mna/*.js; do node --check "$f"; done

      - name: Veiligheids- en consistentie-audit
        run: node tests/audit-consistentie.mjs

      # P3 (19 aug 2026, kwaliteitsaudit): dependency-vulnerability-scanning ontbrak volledig —
      # geen npm audit in CI, geen Dependabot. Enige dependency is @playwright/test (devDependency,
      # laag risico), maar het proces zelf hoort structureel te bestaan i.p.v. incidenteel handmatig.
      - name: Dependency-scan (npm audit)
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high

      # P3 (19 aug 2026): aanvulling op de bestaande, gerichte .gevoelige-termen-check (die vangt
      # cliëntnamen, niet generieke secret-patronen) — basale scan op de bekendste secret-vormen
      # als extra vangnet naast discipline. Geen vervanging voor GitHub Advanced Security (niet
      # beschikbaar voor deze private/publieke repo-combinatie zonder aparte instelling door Marcel).
      - name: Basale secret-patroonscan
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[a-zA-Z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "Mogelijk secret-patroon gevonden — zie regels hierboven."; exit 1;
          else
            echo "Geen bekende secret-patronen gevonden.";
          fi

      - name: Publieke e2e-checks tegen staging (health-check, geen admin-key nodig)
        run: node tests/e2e-api.mjs

      # Audit-fix P2 (25 juli 2026): de admin-key-afhankelijke 90% van e2e-api.mjs (adviseur-
      # lifecycle, traject-flow, module-gating, waardering, tekenen) draaide nergens automatisch —
      # alleen handmatig lokaal. Draait hier zodra het secret STAGING_ADMIN_KEY bestaat (Marcel:
      # instellen via repo Settings → Secrets and variables → Actions, met de staging-ADMIN_KEY —
      # NOOIT de productie-ADMIN_KEY hier zetten). Zonder dat secret wordt deze stap overgeslagen,
      # geen falende build zolang het nog niet is ingesteld.
      #
      # Audit-fix P1 (24 aug 2026, zevende heraudit): `if: ${{ secrets.X != '' }}` breekt de hele
      # workflow vóór de eerste stap ("Unrecognized named-value: 'secrets'") — de `secrets`-context
      # is niet toegestaan in een `if:`-expressie. Live geverifieerd: alle 160+ runs sinds commit
      # 1eadd38 (25 juli 2026) faalden hierdoor, dus geen enkele stap hierboven (node --check,
      # audit-consistentie.mjs, npm audit, secret-scan, publieke e2e) heeft ooit gedraaid. Fix: het
      # secret staat nu als job-niveau env-var (hierboven) — de env-context ís toegestaan in `if:`.
      - name: Volledige e2e-testsuite tegen staging (admin-key vereist)
        if: ${{ env.STAGING_ADMIN_KEY != '' }}
        run: node tests/e2e-api.mjs --key="$STAGING_ADMIN_KEY"
