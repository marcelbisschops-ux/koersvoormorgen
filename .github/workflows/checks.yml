name: Statische checks

on:
  push:
  pull_request:
  # Dagelijkse volledige regressie (incl. de 2 echte AI-tests in e2e-3rollen hieronder) — los van
  # de bestaande, AI-exploratieve dagelijkse-knoppentest-scheduled-task op de Mac (die blijft
  # bestaan, dit is een aanvullende, deterministische laag). Tijdstip bewust ná de Mac-gebaseerde
  # ochtendroutines (diepe-audit draait 06:07 lokaal) — puur voor overzicht, geen harde noodzaak:
  # GitHub Actions en de Mac-routines draaien vanaf verschillende IP's, dus ze delen de per-IP-
  # loginlimiter (worker/11-mna-tekenen-beheer.js, 15 pogingen/10 min) niet.
  schedule:
    - cron: '30 4 * * *'  # 04:30 UTC = 06:30 zomertijd / 05:30 wintertijd Amsterdam
  # 19 sep 2026: ontbrak volledig — zonder workflow_dispatch was er geen enkele manier om de exacte
  # dagelijkse keten handmatig te bewijzen (bijv. na een schedule-run die niet vuurde, zoals vandaag
  # geconstateerd) zonder op de volgende cron te wachten. `if: github.event_name == 'schedule'`
  # hieronder is daarom uitgebreid met `workflow_dispatch`, zodat een handmatige run ECHT de volle
  # 27 tests (16 basis + 9 uitbreiding + 2 AI) doorloopt, niet alleen de 16 van een gewone push.
  workflow_dispatch:

# 18 sep 2026 (Checkpoint 2, 3-rollen-regressietest): serialiseert ALLE workflow-runs van dit
# bestand tegen elkaar — dus ook de bestaande 'checks'-job, die via e2e-api.mjs al staging raakt.
# cancel-in-progress:false is bewust: een geannuleerde run zou de afterAll-cleanup van
# tests/e2e-3rollen-regressie.spec.js kunnen overslaan en een testtraject laten hangen. Trager bij
# snel-achter-elkaar pushen, maar cleanup blijft daardoor altijd gegarandeerd.
concurrency:
  group: kantoorinzicht-staging-e2e
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    # Audit-fix P2/P3 (25 juli 2026): draaide voorheen tegen productie (WORKER_URL niet gezet,
    # tests/lib.mjs valt dan terug op de productie-worker) — nu expliciet tegen staging, zodat CI
    # geen productieverkeer/-schrijfacties meer genereert bij elke push.
    #
    # STAGING_ADMIN_KEY staat hier op job-niveau (i.p.v. alleen bij de laatste stap) omdat een
    # `if:`-conditie op een stap alleen job-/workflow-niveau env-vars ziet, niet een env-var die op
    # diezelfde stap zelf wordt gezet — zie de P1-fix hieronder bij de laatste stap.
    env:
      WORKER_URL: https://kantoorinzicht-staging.marcel-bisschops.workers.dev
      STAGING_ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check mna-modules
        run: |
          for f in mna/*.js; do node --check "$f"; done

      - name: Veiligheids- en consistentie-audit
        run: node tests/audit-consistentie.mjs

      # P3 (19 aug 2026, kwaliteitsaudit): dependency-vulnerability-scanning ontbrak volledig —
      # geen npm audit in CI, geen Dependabot. Enige dependency is @playwright/test (devDependency,
      # laag risico), maar het proces zelf hoort structureel te bestaan i.p.v. incidenteel handmatig.
      - name: Dependency-scan (npm audit)
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high

      # P3 (19 aug 2026): aanvulling op de bestaande, gerichte .gevoelige-termen-check (die vangt
      # cliëntnamen, niet generieke secret-patronen) — basale scan op de bekendste secret-vormen
      # als extra vangnet naast discipline. Geen vervanging voor GitHub Advanced Security (niet
      # beschikbaar voor deze private/publieke repo-combinatie zonder aparte instelling door Marcel).
      - name: Basale secret-patroonscan
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[a-zA-Z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "Mogelijk secret-patroon gevonden — zie regels hierboven."; exit 1;
          else
            echo "Geen bekende secret-patronen gevonden.";
          fi

      - name: Publieke e2e-checks tegen staging (health-check, geen admin-key nodig)
        run: node tests/e2e-api.mjs

      # Audit-fix P2 (25 juli 2026): de admin-key-afhankelijke 90% van e2e-api.mjs (adviseur-
      # lifecycle, traject-flow, module-gating, waardering, tekenen) draaide nergens automatisch —
      # alleen handmatig lokaal. Draait hier zodra het secret STAGING_ADMIN_KEY bestaat (Marcel:
      # instellen via repo Settings → Secrets and variables → Actions, met de staging-ADMIN_KEY —
      # NOOIT de productie-ADMIN_KEY hier zetten). Zonder dat secret wordt deze stap overgeslagen,
      # geen falende build zolang het nog niet is ingesteld.
      #
      # Audit-fix P1 (24 aug 2026, zevende heraudit): `if: ${{ secrets.X != '' }}` breekt de hele
      # workflow vóór de eerste stap ("Unrecognized named-value: 'secrets'") — de `secrets`-context
      # is niet toegestaan in een `if:`-expressie. Live geverifieerd: alle 160+ runs sinds commit
      # 1eadd38 (25 juli 2026) faalden hierdoor, dus geen enkele stap hierboven (node --check,
      # audit-consistentie.mjs, npm audit, secret-scan, publieke e2e) heeft ooit gedraaid. Fix: het
      # secret staat nu als job-niveau env-var (hierboven) — de env-context ís toegestaan in `if:`.
      - name: Volledige e2e-testsuite tegen staging (admin-key vereist)
        if: ${{ env.STAGING_ADMIN_KEY != '' }}
        run: node tests/e2e-api.mjs --key="$STAGING_ADMIN_KEY"

  # 18 sep 2026 (Checkpoint 2): vaste, deterministische 3-rollen-regressietest (verkoper/koper/
  # begeleider) — het permanente kwaliteitshek naast de bestaande, AI-exploratieve dagelijkse-
  # knoppentest-scheduled-task (die blijft ongewijzigd bestaan, los van deze CI-job). Draait pas ná
  # de bestaande 'checks'-job (needs:) zodat de twee staging-schrijvende testsuites (e2e-api.mjs
  # hierboven, e2e-3rollen hieronder) nooit gelijktijdig dezelfde per-IP-loginlimiter belasten.
  e2e-3rollen:
    needs: checks
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://kantoorinzicht-staging.marcel-bisschops.workers.dev
      STAGING_ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 18 sep 2026 (CI-blokkade, eerste keer dat deze job daadwerkelijk draaide): deze job is een
      # eigen, verse runner — checks (hierboven) deelt geen node_modules met deze job, en
      # `npx playwright install` hieronder installeert alleen de playwright-browserbinaries in een
      # ephemere npx-cache, niet het project-devDependency @playwright/test in node_modules/. Zonder
      # deze stap faalt "npx playwright test" met "Cannot find package '@playwright/test'".
      - run: npm ci

      # Marcel, 18 sep 2026, expliciet: dit kwaliteitshek mag NOOIT stilzwijgend "groen" ogen omdat
      # de test niet kon draaien — anders schijnzekerheid ("test niet uitgevoerd → toch groen").
      # Ontbreekt de secret, dan FAALT deze job hard, met een duidelijke reden — geen 'if:'-skip
      # zoals bij de bestaande e2e-api.mjs-stap hierboven (dat is een bewust andere, lagere-inzet-
      # test; dit hier is het release-kwaliteitshek).
      - name: Verifieer dat STAGING_ADMIN_KEY beschikbaar is (mag nooit stilzwijgend overslaan)
        run: |
          if [ -z "${STAGING_ADMIN_KEY}" ]; then
            echo "::error::STAGING_ADMIN_KEY ontbreekt — de 3-rollen-regressietest (release-kwaliteitshek) kan niet draaien. Dit is een FAIL, geen overgeslagen stap: een ontbrekende testsleutel mag nooit als 'groen' verschijnen. Zet het secret via repo Settings → Secrets and variables → Actions, met de staging-ADMIN_KEY (nooit de productie-ADMIN_KEY)."
            exit 1
          fi
          echo "STAGING_ADMIN_KEY aanwezig."

      - name: Playwright browsers installeren
        run: npx playwright install --with-deps chromium

      # E2E_REPORT_KEY (18 sep 2026): smalle, doel-specifieke sleutel waarmee de test ZELF (in
      # afterAll, tests/e2e-3rollen-regressie.spec.js) haar resultaat meldt aan de PRODUCTIE-Worker,
      # zodat het zichtbaar wordt in Marilyn → Veiligheid — los van de staging-only ADMIN_KEY
      # hierboven, die geen productietoegang heeft en dat ook niet moet krijgen. Ontbreekt dit
      # secret, dan meldt de test dat zelf (niet kritiek) en blijft de teststatus leidend — zie
      # meldResultaatAanMarilyn() in het testbestand.
      # CLOUDFLARE_API_TOKEN (18 sep 2026, CI-onderzoek): onafhankelijke D1-verificatie (tests/lib.mjs
      # d1()) draait via `wrangler d1 execute`, dat niet-interactief dit env-var verwacht. Deze
      # spec-file gebruikt d1() uitsluitend voor SELECT — het token krijgt daarom alleen het D1
      # Read-account-recht (nooit Edit), zodat schrijven — ook naar productie — server-side door
      # Cloudflare zelf wordt geweigerd, ongeacht wat de testcode doet. D1-rechten zijn vandaag
      # accountbreed (nog geen per-database-scoping bij Cloudflare), dus dit is de smalst haalbare
      # credential voor een stap die op ÉLKE push/PR draait.
      #
      # CLOUDFLARE_ACCOUNT_ID (18 sep 2026, vervolgonderzoek): een D1 Read-only token heeft geen
      # rechten om "welk account hoort bij dit token" op te zoeken — wrangler doet die opzoekstap
      # standaard altijd, en faalt daar met "Failed to automatically retrieve account IDs" nog vóór
      # de D1-query zelf wordt geprobeerd. Bewezen via de eerste echte CI-foutmelding (voorheen
      # onzichtbaar — zie de d1()/zetMfaUitVoorTest-diagnosefix hierboven). Wrangler's eigen
      # foutmelding wijst zelf naar deze oplossing: het account-id direct meegeven slaat die
      # opzoekstap over, zonder dat het token bredere rechten nodig heeft. Dit account-id is geen
      # secret (staat al publiek in CLAUDE.md, regel 24, en in elke Cloudflare-API-foutmelding).
      - name: 3-rollen regressietest (deterministisch — elke push/PR)
        env:
          ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
          E2E_REPORT_KEY: ${{ secrets.E2E_REPORT_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_D1_READ }}
          CLOUDFLARE_ACCOUNT_ID: '280ee5671bc3c27b895246a620dbc97b'
        run: npx playwright test tests/e2e-3rollen-regressie.spec.js

      # Alleen bij de dagelijkse cron (of een handmatige workflow_dispatch, 19 sep 2026 toegevoegd om
      # de volledige dagelijkse keten op afroep te kunnen bewijzen) — kost echte Anthropic-tokens,
      # dus niet bij elke push.
      - name: 3-rollen regressietest — incl. 2 echte AI-tests (alleen dagelijkse cron)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
          E2E_REPORT_KEY: ${{ secrets.E2E_REPORT_KEY }}
          KVM_DOE_AI: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_D1_READ }}
          CLOUDFLARE_ACCOUNT_ID: '280ee5671bc3c27b895246a620dbc97b'
        run: npx playwright test tests/e2e-3rollen-regressie.spec.js

      # Checkpoint 18 sep 2026 (Marcel, GO): 9 aanvullende, deterministische regressietests
      # (tests/e2e-regressie-uitbreiding.spec.js) die eerder onontdekte gaten dichten — o.a. Marilyn
      # had zelf geen directe UI-buttontests, en dossier-vrijgeven, documentverwijdering,
      # sectorprofielen en Q&A-tegenvoorstellen hadden nog geen automatische dekking. Bewust alleen
      # bij de dagelijkse cron, niet bij elke push: 0 AI-kosten (net als de 16/16 hierboven), maar
      # ~1,8 min extra looptijd + eigen staging-testdata per run — geen releasepoort, een bredere
      # dagelijkse controle naast de 16/16. Hergebruikt dezelfde reeds geïnstalleerde
      # Playwright-browsers en hetzelfde STAGING_ADMIN_KEY-secret; geen E2E_REPORT_KEY (nog geen
      # Marilyn-dashboardrapportage voor deze suite — apart besluit, bewust nu niet gebouwd).
      #
      # CLOUDFLARE_API_TOKEN_D1_EDIT (18 sep 2026, bewuste isolatie): deze suite gebruikt d1() ook
      # schrijvend (bv. opening_voltooid zetten) — heeft dus het bredere D1 Edit-accountrecht nodig,
      # in tegenstelling tot de Read-only 16/16 hierboven. Staat daarom UITSLUITEND als env op déze
      # ene stap, nooit op job-niveau — zo is het breder-bevoegde credential alleen actief tijdens de
      # dagelijkse cron-run, niet bij elke push, en blijft de push-poort (16/16) op het smalst
      # haalbare Read-only credential.
      - name: 9 regressie-uitbreidingstests (sectie D) — alleen dagelijkse cron
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_D1_EDIT }}
          CLOUDFLARE_ACCOUNT_ID: '280ee5671bc3c27b895246a620dbc97b'
        run: npx playwright test tests/e2e-regressie-uitbreiding.spec.js
