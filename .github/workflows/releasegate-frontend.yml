name: Releasegate frontend (onafhankelijke controle)

# N-203 stap 1 (ontwerp KVM-ONTWERP-CENTRALE-PUBLICATIESTAP-20261113, GO Marcel voor het ontwerp; geen wijziging van
# productierechten): de releasegate draait hier buiten de werkplek en buiten Claude Code. De workflow bouwt de
# frontend uit de opgegeven commit, controleert dat de opgegeven preview-URL exact die build serveert (SHA-256 per
# publiek bestand) en draait de N-83-lektest. Het resultaat staat in het (onwijzigbare) Actions-logboek en als
# artefact. Deze workflow publiceert niets en heeft geen Cloudflare-schrijfrecht nodig.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Unieke preview-deployment-URL (https://<hash>.kantoorinzicht-frontend.pages.dev)'
        required: true
      ref:
        description: 'Commit of branch die gebouwd moet worden (standaard main)'
        required: false
        default: 'main'

# Minimale rechten: alleen lezen (broncode en eerdere runs/artefacten van deze workflow).
permissions:
  contents: read
  actions: read

jobs:
  releasegate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preview-URL valideren
        env:
          URL: ${{ inputs.preview_url }}
        run: |
          if ! printf '%s' "$URL" | grep -Eq '^https://[a-z0-9]+\.kantoorinzicht-frontend\.pages\.dev/?$'; then
            echo "::error::Ongeldige preview-URL. Gebruik de unieke deployment-URL."; exit 1
          fi

      - name: Build (allowlist, N-83)
        run: node scripts/build-frontend-release.mjs

      # Codex-review 13-11 (P1, daarna 2x FAIL op volledigheid): eerdere uitkomsten moeten aantoonbaar VOLLEDIG meetellen.
      # Elke run bewaart de samengevoegde historie als artefact, met historie-status.txt = "volledig" als die historie
      # compleet was. Deze stap loopt de eerdere runs af van nieuw naar oud tot de eerste run met een volledige historie
      # (het anker). Voor elke nieuwere run waarvan de gate-stap echt heeft gedraaid MOET het artefact leesbaar zijn en
      # geldige JSON-regels bevatten; anders stopt de workflow (historie NIET GEVERIFIEERD = blokkade, fail-closed).
      # Runs waarin de gate-stap nooit draaide (bijv. ongeldige URL) hebben geen uitkomst en worden overgeslagen.
      # Alleen als er nooit eerder een gate-stap heeft gedraaid, start de historie leeg. Geen placeholders.
      - name: Historie van eerdere gate-uitkomsten ophalen (volledig of blokkeren)
        id: historie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kvm-release-gate eerder
          : > ~/.kvm-release-gate/frontend.jsonl
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow releasegate-frontend.yml --limit 1000 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId')
          anker=""
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gate=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[].steps[] | select(.name | startswith("Releasegate")) | .conclusion] | first // ""')
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n releasegate-bewijs -D "eerder/$id" >/dev/null 2>&1; then
              if [ -s "eerder/$id/frontend.jsonl" ]; then
                if ! node -e 'const r=require("fs").readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean);for(const l of r){const o=JSON.parse(l);if(!o.hash||!o.result||!Number.isFinite(o.ts))throw new Error("ongeldige regel")}' "eerder/$id/frontend.jsonl"; then
                  echo "::error::Gate-historie van run $id is ongeldig. Historie NIET GEVERIFIEERD: blokkade."; exit 1
                fi
                cat "eerder/$id/frontend.jsonl" >> ~/.kvm-release-gate/frontend.jsonl
              fi
              if [ "$(cat "eerder/$id/historie-status.txt" 2>/dev/null)" = "volledig" ]; then anker="$id"; break; fi
            else
              if [ "$gate" = "skipped" ] || [ -z "$gate" ]; then
                echo "Run $id: gate-stap niet uitgevoerd, geen uitkomst om mee te nemen."
              else
                echo "::error::Run $id had een gate-uitkomst ($gate) maar het artefact is niet leesbaar (verlopen of verwijderd). Historie NIET GEVERIFIEERD: blokkade."; exit 1
              fi
            fi
          done
          sort -u ~/.kvm-release-gate/frontend.jsonl -o ~/.kvm-release-gate/frontend.jsonl
          echo "Anker: ${anker:-geen (alle eerdere runs doorlopen)}; gate-regels: $(wc -l < ~/.kvm-release-gate/frontend.jsonl)"

      - name: Releasegate — inhoudsbinding en N-83 op de preview
        env:
          URL: ${{ inputs.preview_url }}
        run: |
          node scripts/frontend-release-gate.mjs preview "$URL"
          node scripts/frontend-release-gate.mjs check

      - name: Bewijs bewaren
        if: ${{ always() }}
        run: |
          mkdir -p bewijs
          node scripts/frontend-release-gate.mjs hash > bewijs/build-vingerafdruk.txt || true
          git rev-parse HEAD > bewijs/commit.txt
          if [ -f ~/.kvm-release-gate/frontend.jsonl ]; then cp ~/.kvm-release-gate/frontend.jsonl bewijs/; else : > bewijs/frontend.jsonl; fi
          # Alleen een run waarin de historie volledig is opgehaald, mag als anker voor latere runs dienen.
          if [ "${{ steps.historie.outcome }}" = "success" ]; then echo volledig > bewijs/historie-status.txt; else echo onvolledig > bewijs/historie-status.txt; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: releasegate-bewijs
          path: bewijs/
          # Bewaartermijn: het anker moet leesbaar blijven. Verloopt het (90 dagen zonder run), dan blokkeert de
          # volgende run fail-closed tot Marcel een herstelbesluit neemt; niets wordt stilzwijgend leeg gestart.
          retention-days: 90
