<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerhuisScan — Admin</title>
<!-- BUILD: 27 May 10:33 -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--void:#faf9f6;--panel:#fff;--card:#f0eeea;--border:#dddbd4;--muted:#8a8880;--mid:#5a5854;--sub:#2a2825;--teal:#1a7a5e;--orange:#e8500a;--red:#e05252;--r:6px;--r2:10px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--void);color:var(--sub);font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:2rem}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.brand{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--teal);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--mid);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:var(--r);cursor:pointer}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red);font-family:'IBM Plex Sans',sans-serif;font-size:11px;padding:3px 10px;border-radius:var(--r);cursor:pointer}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--sub);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none}
.field input:focus{border-color:var(--teal)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;text-align:center}
.stat-num{font-size:2rem;font-weight:700;color:var(--orange);font-family:'IBM Plex Mono',monospace;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.25rem}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);background:var(--card)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--mid)}
tr:hover td{background:rgba(232,80,10,.03)}
.tabel-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:2rem}
.tabel-hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:var(--card)}
.score-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 8px;border-radius:3px;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:2rem;max-width:680px;width:100%;max-height:88vh;overflow-y:auto}
.modal-titel{font-size:1.2rem;font-weight:700;color:var(--sub);margin-bottom:1.25rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand">VerhuisScan · Admin</div>
    <div id="hdr-acties" style="display:none;gap:8px">
      <button class="btn-ghost" style="font-size:12px" id="btn-refresh">&#8635; Verversen</button>
      <button class="btn-ghost" style="font-size:12px" id="btn-logout">Uitloggen</button>
    </div>
  </div>
  <div id="app"></div>
<div id="build-stamp" style="position:fixed;bottom:4px;right:8px;font-size:10px;font-family:monospace;color:#aaa;pointer-events:none;z-index:9999">27 May 10:33</div>
</div>
<script>
const WORKER = 'https://kantoorinzicht.marcel-bisschops.workers.dev';
let adminKey = '', scans = [];

function renderLogin() {
  document.getElementById('app').innerHTML = '<div class="login-wrap"><div class="login-box">'
    + '<div style="font-size:1.3rem;font-weight:700;margin-bottom:.25rem">Beheer</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-bottom:1.5rem">VerhuisScan administratie</div>'
    + '<div class="field"><label>Admin sleutel</label><input type="password" id="ak" autofocus></div>'
    + '<button class="btn" id="login-btn" style="width:100%">Inloggen</button>'
    + '<div id="login-err" style="color:var(--red);font-size:12px;margin-top:.75rem;display:none">Sleutel onjuist.</div>'
    + '</div></div>';
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('ak').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  var key = document.getElementById('ak').value.trim();
  if (!key) return;
  var btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Laden...';
  try {
    var r = await fetch(WORKER + '/verhuis/admin/scans?key=' + encodeURIComponent(key));
    if (!r.ok) throw new Error('unauthorized');
    scans = await r.json();
    adminKey = key;
    document.getElementById('hdr-acties').style.display = 'flex';
    document.getElementById('btn-refresh').addEventListener('click', async function() {
      var r2 = await fetch(WORKER + '/verhuis/admin/scans?key=' + encodeURIComponent(adminKey));
      scans = await r2.json();
      renderDashboard();
    });
    document.getElementById('btn-logout').addEventListener('click', function() {
      adminKey = ''; scans = [];
      document.getElementById('hdr-acties').style.display = 'none';
      renderLogin();
    });
    renderDashboard();
  } catch(e) {
    document.getElementById('login-err').style.display = 'block';
    btn.disabled = false; btn.textContent = 'Inloggen';
  }
}

function dc(v) { return v >= 70 ? '#1a7a5e' : v >= 50 ? '#b8860b' : '#e05252'; }
function fd(ts) { return ts ? new Date(ts).toLocaleDateString('nl-NL', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }

function renderDashboard() {
  var avg = scans.length ? Math.round(scans.reduce(function(a, s) { return a + (s.overall || 0); }, 0) / scans.length) : 0;
  var recent = scans.filter(function(s) { return Date.now() - s.created_at < 7 * 24 * 3600 * 1000; }).length;
  var html = '<div class="stat-row">'
    + '<div class="stat"><div class="stat-num">' + scans.length + '</div><div class="stat-lbl">Totaal scans</div></div>'
    + '<div class="stat"><div class="stat-num">' + recent + '</div><div class="stat-lbl">Deze week</div></div>'
    + '<div class="stat"><div class="stat-num">' + (avg || '—') + '</div><div class="stat-lbl">Gem. score</div></div>'
    + '</div>'
    + '<div class="tabel-wrap"><div class="tabel-hdr"><div style="font-size:13px;font-weight:600">Ingediende scans</div>'
    + '<button class="btn" style="font-size:12px;padding:7px 14px" onclick="document.getElementById(\'btn-refresh\').click()">&#8635;</button>'
    + '</div>';
  if (!scans.length) {
    html += '<div style="text-align:center;padding:3rem;color:var(--muted)">Nog geen scans.</div>';
  } else {
    html += '<table><thead><tr><th>Datum</th><th>Bedrijf</th><th>Regio</th><th>Score</th><th>Scenario</th><th>Email</th><th></th></tr></thead><tbody>';
    scans.forEach(function(s) {
      html += '<tr>'
        + '<td style="font-size:11px;font-family:IBM Plex Mono,monospace">' + fd(s.created_at) + '</td>'
        + '<td style="font-weight:500;color:var(--sub)">' + (s.bedrijfsnaam || 'Anoniem') + '</td>'
        + '<td>' + (s.regio || '—') + '</td>'
        + '<td><span class="score-chip" style="background:rgba(0,0,0,.05);color:' + dc(s.overall) + '">' + (s.overall || '—') + '</span></td>'
        + '<td style="font-size:12px">' + (s.top_scenario || '—') + '</td>'
        + '<td style="font-size:12px;color:var(--teal)">' + (s.email ? '<a href="mailto:' + s.email + '" style="color:var(--teal);text-decoration:none">' + s.email + '</a>' : '—') + '</td>'
        + '<td><button class="btn-ghost btn-lees" data-id="' + s.id + '" style="font-size:11px;padding:3px 8px">Bekijk</button>'
        + ' <button class="btn-red btn-del" data-id="' + s.id + '" style="font-size:10px;padding:2px 6px">✕</button></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;

  document.querySelectorAll('.btn-lees').forEach(function(b) {
    b.addEventListener('click', function() { leesRapport(b.dataset.id); });
  });
  document.querySelectorAll('.btn-del').forEach(function(b) {
    b.addEventListener('click', async function() {
      if (!confirm('Scan verwijderen?')) return;
      await fetch(WORKER + '/verhuis/admin/delete/' + b.dataset.id + '?key=' + encodeURIComponent(adminKey), { method: 'POST' });
      scans = scans.filter(function(s) { return s.id !== b.dataset.id; });
      renderDashboard();
    });
  });
}

async function leesRapport(id) {
  var ov = document.createElement('div'); ov.className = 'overlay';
  var mo = document.createElement('div'); mo.className = 'modal';
  mo.innerHTML = '<div class="modal-titel">Laden...</div><div id="modal-body" style="font-size:13px;color:var(--mid);line-height:1.8;max-height:60vh;overflow-y:auto"></div>'
    + '<div style="margin-top:1rem;text-align:right"><button class="btn-ghost" id="mo-sluit">Sluiten</button></div>';
  ov.appendChild(mo); document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) document.body.removeChild(ov); });
  document.getElementById('mo-sluit').addEventListener('click', function() { document.body.removeChild(ov); });

  var r = await fetch(WORKER + '/verhuis/admin/scan/' + id + '?key=' + encodeURIComponent(adminKey));
  var d = await r.json();
  mo.querySelector('.modal-titel').textContent = (d.bedrijfsnaam || 'Anoniem') + ' · Score ' + d.overall;
  var scores = typeof d.scores === 'string' ? JSON.parse(d.scores) : d.scores || {};
  var scHtml = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:1rem">';
  Object.entries(scores).forEach(function(e) {
    scHtml += '<div style="background:var(--card);border-radius:var(--r);padding:6px 10px;font-size:12px"><span style="color:var(--muted)">' + e[0] + ':</span> <strong style="color:' + dc(e[1]) + '">' + e[1] + '</strong></div>';
  });
  scHtml += '</div>';
  var tekst = (d.rapport_tekst || 'Rapport nog niet gegenereerd.')
    .replace(/^## (.+)$/gm, '<h3 style="font-size:.95rem;font-weight:700;color:var(--sub);margin:1rem 0 .4rem;border-top:1px solid var(--border);padding-top:.75rem">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .split('\n\n').map(function(p) { p = p.trim(); if (!p || p.startsWith('<')) return p; return '<p>' + p + '</p>'; }).join('');
  document.getElementById('modal-body').innerHTML = scHtml + tekst;
}

renderLogin();
</script>
</body>
</html>
